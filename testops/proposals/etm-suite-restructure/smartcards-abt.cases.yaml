# ETM — Smartcards & ABT (Functional). Consolidates 337 old cases -> 28 behaviour cases.
# Products + Adult/Child + source-device ride as variation lines (see smartcards-abt-crosstab.md).
# Mode-specific: Metro MJ zones + Metro ABT zones (Metro); Ulsterbus MJ + Town Service + Capping +
# Ulsterbus ABT zones (Ulsterbus). Everything else @mode(all). Grounded in the FLU/ABT Overflow notes
# (success tone + "Success"; error tone + declined receipt + "See Driver"; tap availability rules).
suite_id: 30254
defaults:
  template_id: 1
  custom_autoconfirmation: false
  custom_devtypes: [25]
  custom_revstatus: 2

sections:
  - path: Functional / Smartcards / Validation
    cases:
      - title: Smartcard — validation and passback
        objective: This test is to confirm a smartcard validates on tap-on and that passback is handled within the transfer period.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/flu/05_0_2 - FLU - DayLink Tap on - Success.png
        steps: |
          **Given** a Driver is signed on at the FLU screen
          **WHEN** a customer presents a valid smartcard
          **THEN** the card is validated for the journey
          **AND** a successful validation is indicated to the Driver
          **WHEN** the same card is presented again within the transfer period
          **THEN** passback is applied per the product rules
        expected: A valid smartcard validates and passback is applied within the transfer period. Run for Adult and Child across products — DayLink, Belfast Visitor Pass, iLink Zones 1–4/NW, aLink, yLink, Metro/Ulsterbus Multi-Journey, Travelcards.
      - title: Smartcard — direction and transfer-period rules
        objective: This test is to confirm validation handles same vs different direction and within vs outside the transfer period.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** a customer has validated a smartcard for a journey
          **WHEN** the card is presented again in the same direction within the transfer period
          **THEN** passback applies and no second fare is taken
          **WHEN** the card is presented in a different direction within the transfer period
          **THEN** the validation is handled per the transfer rules
          **WHEN** the card is presented outside the transfer period
          **THEN** a new journey is validated and charged
        expected: Same-direction within transfer = passback; different direction handled per rules; outside transfer = new journey. Run Adult/Child, Metro & Ulsterbus MJ.
      - title: Smartcard — invalid card presented
        objective: This test is to confirm the ETM rejects an invalid smartcard with the correct reason.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/flu/05_0_0 - Hotlisted Error.png
        steps: |
          **Given** a Driver is signed on at the FLU screen
          **WHEN** an invalid smartcard is presented
          **THEN** the card is rejected with the reason displayed
        expected: Invalid cards are rejected with the reason — wrong zone (Metro), invalid boarding stage (Ulsterbus), outside time band, expired, or hotlisted.
      - title: Smartcard — concessionary pass validation
        objective: This test is to confirm concessionary passes validate correctly, reject when invalid, and support passback override where allowed.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** a Driver is signed on at the FLU screen
          **WHEN** a valid concessionary pass is presented
          **THEN** the matching concessionary entitlement is applied and validated
          **WHEN** the pass is invalid or presented outside its valid time
          **THEN** the pass is rejected with the reason shown
          **WHEN** a passback override is permitted and selected
          **THEN** a further validation is allowed
        expected: Concessionary passes validate/reject correctly with passback override where allowed. Representative — 60+, Senior, ROI Senior, Blind, War Pensioner, DLA / Partially Sighted / Learning Disability / No Driving Licence / PIPS Half-Fare, Free Smartpass, Staff / Spouse / Dependants / Retired / External Staff, EA Smartpass Bus & Rail Pupil + Further Education (incl. start/expiry/weekend/holiday/time-band rules).
      - title: Smartcard — faulty card handling
        objective: This test is to confirm the Driver can handle a faulty smartcard by selecting card type, charging full fare or issuing a ticket.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/flu/06_0_2_0 -  FLU - Smartcard - Faulty - Select Card Type.png
        steps: |
          **Given** a faulty smartcard is presented
          **WHEN** the Driver selects the card type for the faulty card
          **THEN** the Driver is offered to charge full fare or issue a ticket
          **WHEN** the Driver issues a ticket or charges full fare
          **THEN** the transaction completes
          **AND** a faulty Smartpass receipt is produced where applicable
        expected: A faulty card lets the Driver select card type and charge full fare or issue a ticket, producing a faulty Smartpass receipt where applicable.

  - path: Functional / Smartcards / Top-Up
    cases:
      - title: Smartcard top-up — successful with auto-validation
        objective: This test is to confirm a successful smartcard top-up prints a receipt and auto-validates the card.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/flu/06_0_1_2_2 - FLU - Smartcard - Top Up - Confirmation.png
        steps: |
          **Given** a customer presents a topp-able smartcard and the Driver selects Top-Up
          **WHEN** the Driver takes payment and confirms the top-up
          **THEN** the card is topped up
          **AND** a top-up receipt is printed
          **AND** the card is auto-validated for the current journey
        expected: A successful top-up prints a receipt and auto-validates. Variation by product — DayLink/iLink/Travelcard show days/periods, Multi-Journey shows journeys.
      - title: Smartcard top-up — cancelled with Back
        objective: This test is to confirm a smartcard top-up can be cancelled with Back or by removing the card.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** the Driver is in the smartcard top-up flow
          **WHEN** the Driver selects Back or the card is removed before payment
          **THEN** the top-up is cancelled
          **AND** the ETM returns to the FLU Home screen
        expected: Top-up cancels on Back or card removal and returns to FLU Home with no charge.
      - title: Smartcard top-up — maximum journeys enforced
        objective: This test is to confirm a Multi-Journey top-up cannot exceed the maximum of 50 journeys.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** a Multi-Journey smartcard is presented for top-up
          **WHEN** a top-up would take the card above 50 journeys
          **THEN** the top-up is limited to the 50-journey maximum
        expected: Multi-Journey top-up is capped at 50 journeys. Run for Adult and Child, Metro & Ulsterbus MJ.
      - title: Smartcard top-up — expired journeys removed
        objective: This test is to confirm expired journeys are removed on top-up and a journey-removal receipt is produced where applicable.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** a smartcard with expired journeys is presented for top-up
          **WHEN** the Driver tops up the card
          **THEN** the expired journeys are removed
          **AND** a journey-removal receipt is produced where applicable
        expected: Expired journeys are removed on top-up (incl. top-up on expiry), with a removal receipt where applicable.
      - title: Smartcard top-up — annulment
        objective: This test is to confirm a smartcard top-up can be annulled.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** a Driver has just topped up a smartcard
          **WHEN** the Driver annuls the top-up transaction
          **THEN** the top-up is annulled
          **AND** the annulment is recorded
        expected: A smartcard top-up can be annulled and recorded. Representative — Belfast Visitor Pass, iLink zones.
      - title: Smartcard — mini-statement
        objective: This test is to confirm the Driver can view a smartcard mini-statement.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/flu/06_0_1_1 - FLU - Smart Card - Mini Statement.png
        steps: |
          **Given** a customer presents a smartcard and the Driver opens the smartcard menu
          **WHEN** the Driver selects Mini Statement
          **THEN** the card's mini-statement is displayed
          **WHEN** the card is removed
          **THEN** the ETM returns to the FLU Home screen
        expected: The smartcard mini-statement is shown; removing the card returns to FLU Home.
      - title: Smartcard — inter-device top-up then validate on ETM
        objective: This test is to confirm a card topped up on another device validates correctly on the ETM.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** a smartcard has been topped up on another device
          **WHEN** the card is presented to the ETM for validation
          **THEN** the ETM validates the card reflecting the top-up made elsewhere
        expected: A card topped up elsewhere validates on the ETM. Variation by source device — POS (TGX150), POS (WAY6), HHD, PV, another ETM; products incl. Metro/Ulsterbus zones, Travelcards, iLink.

  - path: Functional / Smartcards / Multi-Journey
    cases:
      - title: Metro Multi-Journey — zone validation
        objective: This test is to confirm Metro Multi-Journey validates within the correct zone and rejects a wrong-zone presentation.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** a Metro Multi-Journey smartcard for a given zone is presented
          **WHEN** the card is validated within its zone
          **THEN** the journey is validated against the Multi-Journey balance
          **WHEN** the card is presented outside its zone
          **THEN** the card is rejected as wrong zone
        expected: Metro MJ validates within zone and rejects wrong zone. Run City, Inner and Extended zones, Adult and Child. (Metro mode.)
      - title: Ulsterbus Multi-Journey — boarding-stage validation
        objective: This test is to confirm Ulsterbus Multi-Journey validates with a valid boarding stage and rejects an invalid one.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** an Ulsterbus Multi-Journey smartcard is presented
          **WHEN** the card is validated with a valid boarding stage
          **THEN** the journey is validated against the Multi-Journey balance
          **WHEN** the boarding stage is invalid
          **THEN** the card is rejected as an invalid boarding stage
        expected: Ulsterbus MJ validates on a valid boarding stage and rejects an invalid one. Run Adult and Child. (Ulsterbus mode.)

  - path: Functional / Smartcards / Hotlist
    cases:
      - title: Hotlisted smartcard — presented and marked
        objective: This test is to confirm a hotlisted smartcard is rejected and a card marked for hotlist is handled.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** a Driver is signed on at the FLU screen
          **WHEN** an already-hotlisted smartcard is presented
          **THEN** the card is rejected with a hotlisted error
          **WHEN** a smartcard marked for hotlist is presented
          **THEN** the card is handled per the hotlist rules
        expected: Hotlisted cards are rejected; cards marked for hotlist are handled per the rules.

  - path: Functional / ABT
    cases:
      - title: ABT — successful tap-on
        objective: This test is to confirm a successful ABT tap-on plays the success tone and shows Success on the passenger display.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/flu/06_0_10_0 - FLU - ABT Presented.png
        steps: |
          **Given** ABT taps are enabled and the ETM is at the FLU screen
          **WHEN** a customer taps a valid contactless payment card or device
          **THEN** the tap is accepted for the journey
          **AND** a success tone is played
          **AND** the passenger display shows "Success"
        expected: A valid ABT tap is accepted with a success tone and "Success" on the passenger display. Representative — Visa, Mastercard.
      - title: ABT — declined or error tap
        objective: This test is to confirm a declined or errored ABT tap plays the error tone, prints a declined receipt and shows See Driver.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/flu/02_6_4 _ EMV Validation Failure - Card has been declined.png
        steps: |
          **Given** ABT taps are enabled and the ETM is at the FLU screen
          **WHEN** a customer taps a card that is declined, expired, deny/BIN-listed, or that mis-reads
          **THEN** the error tone is played
          **AND** a declined receipt is printed
          **AND** the passenger display shows "See Driver"
        expected: A declined/errored tap gives the error tone, a declined receipt and "See Driver". Covers declined, expired, BIN/deny-list and tap-error.
      - title: ABT — passback on second tap
        objective: This test is to confirm a second tap of the same card puts the ETM into passback mode.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** a customer has tapped a card to validate
          **WHEN** the same card is tapped again
          **THEN** the ETM enters passback mode for the additional passenger
        expected: A second tap of the same card enters passback mode.
      - title: ABT — tap availability rules
        objective: This test is to confirm ABT taps are only enabled in the appropriate states and ignored elsewhere.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** ABT is configured as enabled
          **WHEN** the ETM is at the FLU screen ready for taps
          **THEN** ABT taps are accepted
          **WHEN** the ETM is on a basket screen, in basket mode, Driver Break, a smartcard screen, the annul screen, the Start New Journey flow, or Travel Mode above 5kph
          **THEN** ABT taps are not enabled
        expected: ABT taps are accepted only at FLU-ready states and ignored on basket/break/smartcard/annul/start-new-journey/travel-mode-above-5kph.
      - title: ABT — Metro zone boarding and alighting
        objective: This test is to confirm ABT boarding and alighting within a Metro ABT zone.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** ABT is enabled in a Metro ABT zone
          **WHEN** the customer taps for boarding only, alighting only, or both within the Metro ABT zone
          **THEN** the ABT journey is recorded for the corresponding boarding/alighting points
        expected: Metro ABT zone records boarding-only, alighting-only and both. (Metro mode.)
      - title: ABT — Ulsterbus zone boarding and alighting
        objective: This test is to confirm ABT boarding and alighting within Ulsterbus ABT zones.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** ABT is enabled in an Ulsterbus ABT zone
          **WHEN** the customer taps for boarding only, alighting only, or both within Ulsterbus ABT zones
          **THEN** the ABT journey is recorded for the corresponding boarding/alighting points
        expected: Ulsterbus ABT zones record boarding-only, alighting-only and both. (Ulsterbus mode.)
      - title: ABT — reverts to standard fixed fare on rule change
        objective: This test is to confirm an ABT journey reverts to the standard fixed fare when a different service, journey or rule is triggered.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** an ABT journey is in progress
          **WHEN** a different service, journey or fare rule is triggered
          **THEN** the ABT fare reverts to the standard fixed fare
        expected: ABT reverts to the standard fixed fare when a different service/journey/rule applies. (Ulsterbus mode.)
      - title: ABT — mobile wallet taps
        objective: This test is to confirm ABT accepts mobile wallet taps from phones and watches.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** ABT taps are enabled at the FLU screen
          **WHEN** a customer taps a mobile wallet
          **THEN** the tap is accepted as for a contactless card
        expected: Mobile wallet taps are accepted. Variation — Apple Pay, Google Pay, Samsung Pay; mobile device and watch.
      - title: ABT — EMV validation failure variants
        objective: This test is to confirm the EMV validation-failure screens for each failure reason.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/flu/02_6_1 _ EMV Validation Failure.png
        steps: |
          **Given** ABT taps are enabled at the FLU screen
          **WHEN** an EMV validation fails
          **THEN** the matching EMV validation-failure screen is shown
        expected: The correct EMV validation-failure screen is shown for tap error, card expired, card declined and card already validated.
      - title: ABT — invalid taps recorded in back office
        objective: This test is to confirm invalid ABT taps are recorded in the back office under ABT.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** an invalid ABT tap has occurred on the ETM
          **WHEN** the back-office ABT records are reviewed
          **THEN** the invalid tap is recorded under ABT with its reason
        expected: Invalid ABT taps appear in the back office under ABT with the decline reason.

  - path: Functional / Capping
    cases:
      - title: Capping — cap reached
        objective: This test is to confirm a capping group applies the cap once the qualifying journeys are reached.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** a customer is tapping journeys within a capping group
          **WHEN** the qualifying journeys for the cap are reached
          **THEN** the cap is applied and no further fare is charged for the capped period
        expected: The cap applies once reached. Run for same-day and weekly caps. (Ulsterbus mode.)
      - title: Capping — journeys without reaching the cap
        objective: This test is to confirm journeys are charged normally until the cap is reached.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** a customer is tapping journeys within a capping group
          **WHEN** the journeys taken are below the cap threshold
          **THEN** each journey is charged normally
        expected: Journeys below the cap are charged normally. Run for same-day and weekly. (Ulsterbus mode.)
      - title: Capping — multiple services and modes
        objective: This test is to confirm capping aggregates correctly across multiple services and transport modes in a daily capping group.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** a daily capping group spans multiple services and transport modes
          **WHEN** the customer taps journeys across those services and modes
          **THEN** the journeys aggregate toward the same cap
        expected: Capping aggregates across multiple services and transport modes within a daily capping group. (Ulsterbus mode.)
