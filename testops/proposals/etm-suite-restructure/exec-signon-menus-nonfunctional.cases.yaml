  # ═══════════════════════════ Non-Functional / Power ═══════════════════════════
  - path: Non-Functional / Power
    cases:
      - title: Power interruption — minor versus major outage
        objective: This test is to confirm the ETM handles a momentary power interruption versus a prolonged one, saving state safely before shutdown.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/power-interruption/11_0_0 - Power Interruption.png
        steps: |-
          **GIVEN** the ETM is in service with the seeded test Driver signed on to route 10A (IN) at the FLU screen
          **AND** the device's Activity Log is open in CloudFare Estate Management to verify
          **WHEN** you interrupt power momentarily and restore it
          **THEN** the ETM returns the user to the FLU screen they were originally on
          **WHEN** you interrupt power for a prolonged period past the backup window
          **THEN** the ETM saves its state and shuts down once the backup period is reached
          **WHEN** you open the device's Activity Log in CloudFare Estate Management
          **THEN** the power interruption entries are recorded for the device
        expected: A momentary outage restores the previous FLU screen; a prolonged outage saves state and shuts down safely within the backup window; both are recorded in the CloudFare Activity Log.
      - title: Power loss recovery — within and outside the recovery period
        objective: This test is to confirm the ETM recovers to the signed-in state after a power loss within the recovery period, and does not after it.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** the seeded test Driver is signed on to route 10A (IN) and in service
          **AND** the device's Activity Log is open in CloudFare Estate Management to verify
          **WHEN** you lose power and restore it within the recovery period
          **THEN** the ETM recovers to the signed-in state (10A FLU, same Driver)
          **WHEN** you lose power and restore it outside the recovery period
          **THEN** the ETM does not recover the signed-in state and returns to idle
          **WHEN** you lose power while in break mode and restore it
          **THEN** the ETM recovers to the break state appropriately
          **WHEN** you open the device's Activity Log in CloudFare Estate Management
          **THEN** the power-loss and recovery entries are recorded for the device
        expected: Recovery to the signed-in state happens within the recovery period only; outside it the ETM returns to idle; break mode recovers appropriately; all recorded in the CloudFare Activity Log.
      - title: Power — charging state on boot
        objective: This test is to confirm the ETM shows the charging screen on boot until it has enough charge to safely save state on a future interruption.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/startup/11_2_0 - Charging.png
        steps: |-
          **GIVEN** the ETM is booting with low charge
          **WHEN** you boot it while it does not yet have enough charge to guarantee a safe state-save
          **THEN** the charging screen is displayed and held until sufficient charge is reached
        expected: The charging screen holds boot until there is enough charge to safely save state on a power interruption.
      - title: Power Saving Mode — entering and leaving
        objective: This test is to confirm the ETM enters and leaves Power Saving Mode correctly.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** the ETM is idle and configured for power saving
          **WHEN** the conditions to enter Power Saving Mode are met
          **THEN** the ETM enters Power Saving Mode
          **WHEN** you wake the ETM
          **THEN** the ETM leaves Power Saving Mode and returns to its prior state
        expected: The ETM enters Power Saving Mode when idle conditions are met and leaves it on wake, returning to its prior state.
      - title: Scheduled Maintenance — suspend and idle
        objective: This test is to confirm the ETM handles scheduled maintenance, coming out of suspend and returning to idle.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** a scheduled maintenance window applies and the ETM is in idle mode
          **WHEN** the ETM is in idle mode during the maintenance window
          **THEN** the scheduled maintenance is performed
          **WHEN** the ETM comes out of suspend
          **THEN** the ETM resumes to idle ready for service
        expected: Scheduled maintenance runs in idle mode and the ETM resumes to idle ready for service when coming out of suspend.

