# ETM — Sign On & Session + Driver/Supervisor/Technician menus + Non-Functional
# EXECUTABLE walk-throughs (ETM Suite 30254). Authored 2026-07-17.
#
# Rewrites the existing Functional / Sign On & Session (Driver/Supervisor/Technician), the
# Driver Menu & Options / Supervisor Menu / Technician Menu, and the Non-Functional cases so a
# tester can follow each start-to-finish — concrete GIVEN setup, ordered real WHEN actions, and
# THEN lines that say what you observe, WHERE, and to what value. WHAT each case tests is
# UNCHANGED: every observable check from the current body is preserved, only made concrete,
# ordered and grouped into a few tight steps (each step's THEN capped at ~3 ANDs). Update-in-place
# by verbatim title; three weak titles tightened via `match:` (old) + `title:` (new).
# EXCLUDES the HMI Screen Validation layer (those stay terse) and the ZZ section.
#
# Grounding:
#   - Device flow + screens: knowledge/devices/etm.md; Overflow "Driver Sign On" flow annotations.
#     Sign-on order: Enter -> Staff ID (4-6 digits) -> PIN (masked '*') -> authorised-user check ->
#     First Use Safety Check -> Any Defects -> Duty Number -> Route -> Journey -> Route Summary ->
#     Message of the Day -> Word & Colours of the Day -> FLU. Idle timeout 30s (sign-on) / 60s
#     (supervisor). MOTD / Word & Colours have a 5-second Unavailable fallback. Failed-PIN lock-out
#     threshold is TMS/config-driven (never hard-coded). Abandon after Duty entry = End-of-Shift +
#     Driver Waybill printed.
#   - Shift board / duty numbers: FBD-100831 (duty = Shift Number; Journey List after duty entry).
#   - Audit: verified in the device's Activity Log in CloudFare Estate Management (per the existing
#     Supervisor unlock case). Entries named descriptively (Start of Shift / Sign Off / Unlocked) —
#     never an invented machine event name (knowledge/devices/etm.md rule).
#   - Worked route examples (real): Metro 10A (IN) Casement Park -> City Hall; Ulsterbus 72b (IN)
#     Moygashel Busby Shop -> Armagh Bus Centre (knowledge/ABT/ABT_FARE_REFERENCE.md). Duty/journey
#     numbers are seeded test-data worked examples (e.g. duty 4021, journey 1030).
suite_id: 30254
defaults:
  template_id: 1
  custom_devtypes: [25]
  custom_autoconfirmation: false
  custom_revstatus: 2

sections:
  # ═══════════════════════════ Sign On & Session / Driver ═══════════════════════════
  - path: Functional / Sign On & Session / Driver
    cases:
      - title: Driver Sign On — Manual, first use
        objective: This test is to confirm a Driver can sign on to an ETM with a valid ID and PIN through the full first-use flow, and that the shift is audited to CloudFare.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/driver-sign-on/01_2_0 - Sign On Details Entered - First Use Safety Check.png
        steps: |-
          **GIVEN** the ETM is displaying the idle screen and is communicating with CloudFare
          **AND** the seeded test Driver's Staff ID (4–6 digits) and PIN are to hand
          **AND** the Driver will sign on to Metro route 10A (IN) Casement Park → City Hall, seeded duty 4021 / journey 1030
          **AND** the device's Activity Log is open in CloudFare Estate Management to verify
          **WHEN** you press Enter, key in the Staff ID and PIN, confirming each with Enter
          **THEN** each PIN digit is masked with a '*' as you type it
          **AND** the ETM authenticates the operator against the authorised user list
          **AND** the First Use Safety Check screen is displayed
          **WHEN** you confirm the bus has been safety checked and answer No to the Any Defects prompt
          **AND** at Duty Number you enter an invalid duty, then the valid duty 4021, confirming with Enter
          **THEN** the invalid duty is rejected on entry
          **AND** the valid duty advances to Route Selection
          **WHEN** you select route 10A by letters or number, with inbound and outbound journeys filtered
          **AND** you select journey 1030, entering an invalid journey number first, then confirm the Route Summary
          **THEN** the invalid journey number is rejected
          **AND** the Message of the Day is displayed, or its Unavailable fallback after the 5-second timeout
          **WHEN** you confirm the Message of the Day, then confirm the Word and Colours of the Day (or its Unavailable fallback after 5 seconds)
          **THEN** the FLU screen is displayed for 10A
          **AND** the start of shift is audited
          **AND** the running total is recorded
          **WHEN** you open the shift in CloudFare Estate Management
          **THEN** a Start of Shift entry identifies the Driver, duty 4021 and vehicle
          **AND** the shift details and defect record for the shift can be identified
        expected: The Driver reaches the 10A FLU screen signed on, and the start of shift (with defect record) is auditable in the CloudFare Activity Log.
      - title: Driver Sign On — Smartcard, first use
        objective: This test is to confirm a Driver can sign on by presenting a Staff pass, which pre-populates the Staff ID, then proceeds through the first-use flow.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** the ETM is displaying the idle screen and is communicating with CloudFare
          **AND** the seeded test Driver's Staff pass (carrying the Staff ID) and PIN are to hand
          **AND** the device's Activity Log is open in CloudFare Estate Management to verify
          **WHEN** you present the Staff pass to the reader
          **THEN** the operator sign-on screen is displayed with the Staff ID pre-populated
          **AND** the PIN field is highlighted for entry
          **WHEN** you enter the valid PIN and confirm with Enter, then remove the Staff pass
          **THEN** the ETM authenticates the operator and displays the First Use Safety Check screen
          **AND** removing the pass leaves the ETM on the First Use Safety Check screen and sign-on continues as normal
          **WHEN** you open the device's Activity Log in CloudFare Estate Management
          **THEN** a Start of Shift entry for the Driver is recorded at the time of the sign-on
        expected: The Staff pass pre-populates the ID; after a valid PIN the Driver proceeds through the first-use flow, and the sign-on is recorded in the CloudFare Activity Log.
      - title: Driver Sign On — first use with defects recorded
        objective: This test is to confirm a Driver can record vehicle defects during first-use sign-on and that the defect record is audited to CloudFare.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** the seeded test Driver is mid first-use sign-on to Metro route 10A (IN), stopped at the Any Defects screen
          **AND** the device's Activity Log is open in CloudFare Estate Management to verify
          **WHEN** you select Yes to record that the bus has defects and enter the defect detail (e.g. "offside mirror cracked")
          **THEN** the defect is recorded against the shift
          **AND** sign-on continues to the Duty Number entry screen
          **WHEN** you open the shift in CloudFare Estate Management
          **THEN** the defect record can be identified against the Driver and vehicle
        expected: The recorded defect is captured against the shift and is visible against the Driver and vehicle in the CloudFare Activity Log.
      - title: Driver Sign On — subsequent use
        objective: This test is to confirm subsequent-use sign-on honours the on-board First Use Safety Check state (skipped when already satisfied, presented or overridden per configuration) and reaches FLU.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** the ETM is displaying the idle screen and a First Use Safety Check has already been performed for the vehicle today
          **AND** the seeded test Driver's Staff ID and PIN are to hand, signing on to Metro route 10A (IN), seeded duty 4021 / journey 1030
          **AND** the device's Activity Log is open in CloudFare Estate Management to verify
          **WHEN** you sign on with the valid ID and PIN
          **THEN** the ETM authenticates the operator
          **AND** the First Use Safety Check is skipped when already satisfied on board, or presented/overridden per configuration
          **WHEN** you complete duty 4021, route 10A and journey 1030 selection
          **THEN** the FLU screen is displayed
          **AND** the shift is audited
          **WHEN** you open the device's Activity Log in CloudFare Estate Management
          **THEN** a Start of Shift entry for the Driver is recorded at the time of the sign-on
        expected: Subsequent-use sign-on honours the on-board safety-check state, reaches the 10A FLU, and is recorded in the CloudFare Activity Log.
      - title: Driver Sign On — incorrect PIN locks the device after the configured attempts
        objective: This test is to confirm the ETM blocks sign-on after the configured number of failed PIN attempts (by manual entry and by Staff pass) and audits the lock-out.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/driver-sign-on/01_1_5 - Sign On - Device Locked.png
        steps: |-
          **GIVEN** the ETM is in idle mode prompting for sign-on
          **AND** a configurable failed-attempt threshold is set in the TMS (do not assume a value — read it from the TMS)
          **AND** a valid Staff ID and Staff pass for the seeded Driver are to hand, but the wrong PIN
          **AND** the device's Activity Log is open in CloudFare Estate Management to verify
          **WHEN** you enter the wrong PIN for the valid Staff ID once by manual entry, then once by Staff pass
          **THEN** the Sign On Failed screen is displayed after each attempt
          **WHEN** you keep entering the wrong PIN until the failed attempts reach the configured threshold
          **THEN** the Device Locked screen is displayed
          **AND** the device is locked against further sign-on
          **WHEN** you open the device's Activity Log in CloudFare Estate Management
          **THEN** a lock-out entry for the device is recorded at the time it locked
        expected: After the configured number of failed PIN attempts (manual or Staff pass) the device shows Device Locked, blocks further sign-on, and the lock-out appears in the CloudFare Activity Log.
      - title: Driver Sign On — not communicating with CloudFare
        match: Driver Sign On — communications locked / not communicating with CloudFare
        objective: This test is to confirm sign-on behaviour when the ETM has not communicated with CloudFare within the configured period.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/driver-sign-on/01_0_1 - Communications Locked.png
        steps: |-
          **GIVEN** the ETM has not communicated with CloudFare for the configured number of hours
          **AND** the seeded test Driver's Staff ID and PIN are to hand
          **WHEN** you view the idle screen
          **THEN** a bad-comms indicator is displayed and communications are locked
          **WHEN** you attempt to sign on with the valid ID and PIN
          **THEN** sign-on proceeds in the not-communicating state per design
          **AND** the not-communicating condition is made clear to the Driver on screen
          **WHEN** communications are restored and you open the device's Activity Log in CloudFare Estate Management
          **THEN** the sign-on and comms-restore entries for the device are recorded
        expected: A comms-locked ETM signals bad comms, handles sign-on per the not-communicating design, and the entries appear in the CloudFare Activity Log once comms restore.
      - title: Driver Sign On — abandon
        objective: This test is to confirm that abandoning sign-on before route selection records no shift, while abandoning after Duty entry records an End-of-Shift and prints a Driver Waybill.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** the seeded test Driver is mid sign-on to Metro route 10A (IN), seeded duty 4021
          **AND** the device's Activity Log is open in CloudFare Estate Management to verify
          **WHEN** before route selection you press 'P' to reach the Sign Off prompt and confirm the abandon
          **THEN** sign-on is abandoned and no shift is recorded
          **WHEN** you sign on again as far as after Duty Number entry (Route Selection onwards), then abandon
          **THEN** an End-of-Shift record is recorded
          **AND** a Driver Waybill is printed
          **WHEN** you open the device's Activity Log in CloudFare Estate Management
          **THEN** the End-of-Shift entry is recorded for the abandon-after-duty case
        expected: Abandon before route records no shift; abandon after Duty entry records an End-of-Shift, prints a Driver Waybill, and the End-of-Shift appears in the CloudFare Activity Log.
      - title: Driver Sign On — idle timeout returns to idle
        objective: This test is to confirm that with no key press during sign-on the ETM times out to the idle screen after 30 seconds, signing the Driver out if signed in.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** the seeded test Driver is mid sign-on (e.g. stopped at the Duty Number screen)
          **AND** the device's Activity Log is open in CloudFare Estate Management to verify
          **WHEN** you press no key for 30 seconds
          **THEN** the ETM returns to the Idle screen
          **AND** if the Driver was signed in they are signed out
          **WHEN** you open the device's Activity Log in CloudFare Estate Management
          **THEN** the timeout sign-off entry is recorded for the device
        expected: A 30-second inactivity timeout returns the ETM to idle, signs out any signed-in Driver, and the sign-off appears in the CloudFare Activity Log.
      - title: Driver Sign On — correct topology and fares for the route
        match: Driver Sign On — correct topology and fares data presented for the route
        objective: This test is to confirm the ETM presents the correct topology and fares data for the signed-on route.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** the seeded test Driver signs on to Metro route 10A (IN) Casement Park → City Hall, seeded duty 4021 / journey 1030
          **AND** the configured topology and fares for 10A are known for cross-check
          **AND** the device's Activity Log is open in CloudFare Estate Management to verify
          **WHEN** sign-on completes and the FLU screen is displayed
          **THEN** the stages and fares shown on the 10A FLU match the configured topology and fares for that route and mode
          **WHEN** you open the device's Activity Log in CloudFare Estate Management
          **THEN** the start-of-shift entry for route 10A is recorded
        expected: The FLU presents topology and fares matching the 10A configured data, recorded in the CloudFare Activity Log. Run against Metro and Ulsterbus configurations.
      - title: Driver Sign Off
        objective: This test is to confirm a Driver can sign off, that the ETM returns to idle, and that the sign-off is audited.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/driver-sign-on/01_1_6 - Sign Off.png
        steps: |-
          **GIVEN** the seeded test Driver is signed on to Metro route 10A (IN) with the FLU screen displayed
          **AND** the device's Activity Log is open in CloudFare Estate Management to verify
          **WHEN** you sign the Driver off
          **THEN** the ETM returns to the Idle screen
          **AND** the operator sign-off is audited
          **WHEN** you open the device's Activity Log in CloudFare Estate Management
          **THEN** a Sign Off entry for the Driver is recorded at the time of the action
        expected: The Driver signs off, the ETM returns to idle, and a Sign Off entry appears for the Driver in the CloudFare Activity Log.

  # ═══════════════════════════ Sign On & Session / Supervisor ═══════════════════════════
  - path: Functional / Sign On & Session / Supervisor
    cases:
      - title: Supervisor Sign On — Manual
        objective: This test is to confirm a Supervisor can sign on manually with a valid ID and PIN to reach the Supervisor menu.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** the ETM is displaying the idle screen
          **AND** the seeded test Supervisor's Staff ID and PIN are to hand
          **AND** the device's Activity Log is open in CloudFare Estate Management to verify
          **WHEN** you sign on with the valid Supervisor ID and PIN
          **THEN** the Supervisor menu is displayed
          **WHEN** you open the device's Activity Log in CloudFare Estate Management
          **THEN** a Supervisor sign-on entry is recorded at the time of the action
        expected: A valid Supervisor manual sign-on reaches the Supervisor menu and is recorded in the CloudFare Activity Log.
      - title: Supervisor Sign On — Smartcard
        objective: This test is to confirm a Supervisor can sign on by presenting a Staff card and entering a valid PIN to reach the Supervisor menu.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** the ETM is displaying the idle screen
          **AND** the seeded test Supervisor's Staff card and PIN are to hand
          **AND** the device's Activity Log is open in CloudFare Estate Management to verify
          **WHEN** you present the valid Staff card and enter the valid PIN
          **THEN** the Supervisor menu is displayed
          **WHEN** you open the device's Activity Log in CloudFare Estate Management
          **THEN** a Supervisor sign-on entry is recorded at the time of the action
        expected: A valid Supervisor smartcard sign-on reaches the Supervisor menu and is recorded in the CloudFare Activity Log.
      - title: Supervisor Sign On — device locks after the configured attempts
        objective: This test is to confirm the ETM locks against Supervisor sign-on after the configured number of failed PIN attempts and audits the lock-out.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** the ETM is prompting for sign-on with a configured failed-attempt threshold set in the TMS
          **AND** a valid Supervisor Staff ID with the wrong PIN is to hand
          **AND** the device's Activity Log is open in CloudFare Estate Management to verify
          **WHEN** you enter the wrong PIN for the valid Supervisor ID up to the configured threshold
          **THEN** the Device Locked screen is displayed
          **AND** the device is locked against further sign-on
          **WHEN** you open the device's Activity Log in CloudFare Estate Management
          **THEN** a lock-out entry for the device is recorded at the time it locked
        expected: Supervisor sign-on locks after the configured failed-attempt threshold and the lock-out appears in the CloudFare Activity Log.
      - title: Supervisor — unlock a PIN-locked device
        objective: This test is to confirm a Supervisor can unlock a PIN-locked device with their Staff card, and that the unlock is auditable in CloudFare.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** an operator has PIN-locked the device (a Driver reached the failed-attempt threshold)
          **AND** the seeded test Supervisor's Staff card is to hand
          **AND** the device's Activity Log is open in CloudFare Estate Management to verify
          **WHEN** you sign in with the Supervisor's Staff card
          **THEN** the Supervisor menu is displayed
          **AND** the device is no longer PIN-locked
          **WHEN** you filter the Activity Log for the device in CloudFare Estate Management
          **THEN** an Unlocked entry for the device is shown for the time of the action
        expected: A Supervisor Staff-card sign-in clears the PIN lock, and an Unlocked entry for the device appears in the CloudFare Activity Log.
      - title: Supervisor Sign Off — manual and idle timeout
        objective: This test is to confirm a Supervisor can exit Supervisor mode manually, and that a 60-second idle timeout returns to idle, auditing the sign-off in both cases.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** the ETM is displaying the Supervisor menu
          **AND** the device's Activity Log is open in CloudFare Estate Management to verify
          **WHEN** you sign off manually
          **THEN** the ETM returns to idle
          **AND** the sign-off is audited
          **WHEN** you sign back in and instead press no button for 60 seconds
          **THEN** the ETM returns to idle mode
          **AND** the operator sign-off is audited
          **WHEN** you open the device's Activity Log in CloudFare Estate Management
          **THEN** a Supervisor sign-off entry is recorded for each of the two exits
        expected: Supervisor mode exits on manual sign-off or after a 60-second idle timeout, and both sign-offs appear in the CloudFare Activity Log.

