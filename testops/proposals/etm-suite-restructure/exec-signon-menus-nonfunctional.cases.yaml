          **THEN** the Technician menu is displayed
          **WHEN** you open the device's Activity Log in CloudFare Estate Management
          **THEN** a Technician sign-on entry is recorded at the time of the action
        expected: A valid Technician manual sign-on reaches the Technician menu and is recorded in the CloudFare Activity Log.
      - title: Technician Sign On — Smartcard
        objective: This test is to confirm a Technician can sign on by presenting a Staff card and entering a valid PIN to reach the Technician menu.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** the ETM is displaying the idle screen
          **AND** the seeded test Technician's Staff card and PIN are to hand
          **AND** the device's Activity Log is open in CloudFare Estate Management to verify
          **WHEN** you present the valid Staff card and enter the valid PIN
          **THEN** the Technician menu is displayed
          **WHEN** you open the device's Activity Log in CloudFare Estate Management
          **THEN** a Technician sign-on entry is recorded at the time of the action
        expected: A valid Technician smartcard sign-on reaches the Technician menu and is recorded in the CloudFare Activity Log.
      - title: Technician Sign On — device locks after the configured attempts
        objective: This test is to confirm the ETM locks against Technician sign-on after the configured number of failed PIN attempts and audits the lock-out.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** the ETM is prompting for sign-on with a configured failed-attempt threshold set in the TMS
          **AND** a valid Technician Staff ID with the wrong PIN is to hand
          **AND** the device's Activity Log is open in CloudFare Estate Management to verify
          **WHEN** you enter the wrong PIN for the valid Technician ID up to the configured threshold
          **THEN** the Device Locked screen is displayed
          **AND** the device is locked against further sign-on
          **WHEN** you open the device's Activity Log in CloudFare Estate Management
          **THEN** a lock-out entry for the device is recorded at the time it locked
        expected: Technician sign-on locks after the configured failed-attempt threshold and the lock-out appears in the CloudFare Activity Log.

  # ═══════════════════════════ Driver Menu & Options ═══════════════════════════
  - path: Functional / Driver Menu & Options
    cases:
      - title: Driver Menu — access and navigation
        objective: This test is to confirm a signed-on Driver can open the Driver Menu and navigate it, including via a Staff pass, and back out with 'C' or Go Back.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/driver-menu-options/08_0_0 Driver Menu.png
        steps: |-
          **GIVEN** the seeded test Driver is signed on to Metro route 10A (IN) at the FLU screen
          **WHEN** you open the Driver Menu from the FLU screen, and again by presenting a Staff pass
          **THEN** the Driver Menu options are displayed each time
          **WHEN** you press 'C' or Go Back
          **THEN** the ETM returns to the previous screen
        expected: A signed-on Driver can open and navigate the Driver Menu (including via Staff pass) and back out with 'C' or Go Back.
      - title: Driver Break — enter, leave and override
        objective: This test is to confirm the Driver Break flow, including who may sign in during a break, the configured break duration, and supervisor override.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/driver-menu-options/08_0_7 - Idle Screen - On Break_Black.png
        steps: |-
          **GIVEN** the seeded test Driver is signed on to Metro route 10A (IN)
          **AND** a second operator and the seeded Supervisor Staff card are available
          **AND** the device's Activity Log is open in CloudFare Estate Management to verify
          **WHEN** you select Driver Break to enter break mode
          **THEN** the ETM shows the On Break idle screen
          **AND** only the operator who started the break may sign back in (the second operator is refused)
          **WHEN** you leave the break by manual sign-in or Staff card, or abort the leave
          **THEN** the Driver resumes the shift, or the abort returns to the On Break screen
          **WHEN** you re-enter break and a Supervisor signs in with the Staff card during the break
          **THEN** the Supervisor overrides the break
          **WHEN** you re-enter break and let the TMS-configured break time elapse
          **THEN** the Driver is signed out and others may sign in
          **WHEN** you open the device's Activity Log in CloudFare Estate Management
          **THEN** the break enter/leave/override entries are recorded for the shift
        expected: Driver Break locks sign-in to that operator; leave (manual/smartcard) or abort works; a Supervisor can override; the break auto-ends after the configured time and signs the Driver out; all recorded in the CloudFare Activity Log.
      - title: Driver options — display settings
        objective: This test is to confirm a Driver can adjust display brightness and volume from Driver options.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** the seeded test Driver is signed on and has opened Driver options
          **WHEN** you raise then lower the brightness, and raise then lower the volume
          **THEN** the display brightness changes on screen accordingly
          **AND** the volume changes accordingly
        expected: Brightness and volume adjust up and down from Driver options.
      - title: Driver Menu — change currency
        objective: This test is to confirm a Driver can change the sale currency between Pounds and Euros from the menu.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** the seeded test Driver is signed on and has opened the Driver Menu
          **WHEN** you change the currency to Euros
          **THEN** the sale currency is set to Euros and prices show in €
          **WHEN** you change the currency back to Pounds
          **THEN** the sale currency is set to Pounds and prices show in £
        expected: The Driver can switch the sale currency between Pounds and Euros from the menu, with prices shown in the selected currency.
      - title: Inspector — report and smartcard check
        objective: This test is to confirm an Inspector can present a smartcard for inspection (with invalid-card handling) and produce an Inspector report.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/driver-menu-options/08_0_1 - Inspector - Present Smartcard.png
        steps: |-
          **GIVEN** the Inspector option is selected from the Driver Menu
          **AND** a valid smartcard and an invalid smartcard are to hand
          **WHEN** you present the valid smartcard for inspection
          **THEN** the card's inspection detail is displayed
          **WHEN** you present the invalid smartcard
          **THEN** the invalid-smartcard error is shown
          **WHEN** you request an Inspector report
          **THEN** the Inspector report is produced
        expected: The Inspector can check a presented smartcard (with invalid-card handling) and produce an Inspector report.
      - title: Other devices — manage a paired device
        objective: This test is to confirm the Driver can view status, reboot and view alerts for a paired on-vehicle device.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/driver-menu-options/08_9_0 - Driver Menu - BV Devices.png
        steps: |-
          **GIVEN** the seeded test Driver has opened the Other Devices option with a paired device present (e.g. a Bus Validator the ETM manages)
          **WHEN** you view the paired device status and summary
          **THEN** the device status and summary are displayed
          **WHEN** you reboot the paired device
          **THEN** the paired device is rebooted
          **WHEN** you view the device alerts
          **THEN** the alerts for the paired device are displayed
        expected: The Driver can view status and summary, reboot, and view alerts for a paired on-vehicle device.
      - title: Driver options — duty and journey totals
        objective: This test is to confirm a Driver can view duty and journey totals.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** the seeded test Driver is signed on with some sales made this shift and has opened Driver options
          **WHEN** you view the Totals
          **THEN** the duty totals are displayed
          **AND** the journey totals are displayed
        expected: The duty totals and journey totals are displayed for the current shift.
      - title: Driver options — ticket history and last ticket
        objective: This test is to confirm a Driver can view ticket history and the last ticket issued, with annulled tickets marked.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/driver-menu-options/08_2_0 - Driver Menu - Ticket History.png
        steps: |-
          **GIVEN** the seeded test Driver has issued several tickets this shift, including one annulled ticket, and has opened Driver options
