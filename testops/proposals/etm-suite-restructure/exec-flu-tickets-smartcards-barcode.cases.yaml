        expected: A smartcard top-up can be annulled and is recorded in CloudFare, MERIT and SmartTrack.
      - title: Smartcard — mini-statement
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/flu/06_0_1_1 - FLU - Smart Card - Mini Statement.png
        objective: This test is to confirm the Driver can view a smartcard mini-statement and that removing the card returns to FLU Home.
        steps: |-
          **GIVEN** a customer presents a smartcard and the Driver opens the smartcard menu on route 72b (IN)
          **WHEN** you select the mini-statement, then remove the card
          **THEN** the smartcard mini-statement is shown on screen
          **AND** removing the card returns the ETM to FLU Home
        expected: The smartcard mini-statement is shown; removing the card returns to FLU Home.
      - title: Smartcard — inter-device top-up then validate on ETM
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm a card topped up on another device validates correctly on the ETM.
        steps: |-
          **GIVEN** a smartcard has been topped up on another device and has synced to the back office
          **AND** a Driver is signed on to Metro route 10A at the FLU screen
          **WHEN** you present the card on the ETM to validate
          **AND** you open the CloudFare activity log
          **THEN** the card validates on the ETM with the topped-up product recognised
          **AND** the validation appears in CloudFare and flows to MERIT and SmartTrack
