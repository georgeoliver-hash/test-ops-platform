  # ═════════════════════════ Smartcards / Multi-Journey ═════════════════════════
  - path: [Functional, Smartcards, Multi-Journey]
    cases:
      - title: Metro Multi-Journey — zone validation
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm a Metro Multi-Journey card validates within its correct zone and rejects a wrong-zone presentation.
        steps: |-
          **GIVEN** a Driver is signed on to Metro route 10A in Metro mode
          **AND** a Metro Multi-Journey card for a given zone is presented
          **WHEN** you present the card at a stop within its zone, then at a stop outside its zone
          **AND** you open the CloudFare activity log
          **THEN** the in-zone present validates and deducts a journey
          **AND** the out-of-zone present is rejected with the reason
          **AND** both are recorded in CloudFare and flow to MERIT and SmartTrack
          Data variations: City, Inner and Extended zones; Adult and Child. (Metro mode.)
        expected: Metro MJ validates within zone and rejects wrong zone; recorded in CloudFare, MERIT and SmartTrack; runs City/Inner/Extended, Adult/Child.
      - title: Ulsterbus Multi-Journey — boarding-stage validation
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm an Ulsterbus Multi-Journey card validates with a valid boarding stage and rejects an invalid one.
        steps: |-
          **GIVEN** a Driver is signed on to Ulsterbus route 72b (IN) in Ulsterbus mode
          **AND** an Ulsterbus Multi-Journey card is presented
          **WHEN** you present the card with a valid boarding stage set, then with an invalid boarding stage
          **AND** you open the CloudFare activity log
          **THEN** the valid-boarding-stage present validates and deducts a journey
          **AND** the invalid-boarding-stage present is rejected with the reason
          **AND** both are recorded in CloudFare and flow to MERIT and SmartTrack
          Data variations: Adult and Child. (Ulsterbus mode.)
        expected: Ulsterbus MJ validates on a valid boarding stage and rejects an invalid one; recorded in CloudFare, MERIT and SmartTrack; runs Adult and Child.
      - title: Metro Travelcard — validation
        objective: This test is to confirm a Metro Travelcard validates within its period when valid, is rejected with the reason when invalid, and is recorded in the back office.
        steps: |-
          **GIVEN** the ETM is signed on and in service on Metro route 10A in Metro mode
          **AND** seeded Metro Travelcards are available valid, expired and hotlisted
          **WHEN** you present the valid card, then the expired card, then the hotlisted card
          **AND** you open the CloudFare activity log
          **THEN** the valid Travelcard validates within its period
          **AND** the expired and hotlisted cards are rejected with the reason
          **AND** all presents are recorded in CloudFare and flow to MERIT and SmartTrack
        expected: A Metro Travelcard validates within its period and rejects when expired or hotlisted; recorded in CloudFare, MERIT and SmartTrack. (Metro mode.)
      - title: Town Service Travelcard — validation
        objective: This test is to confirm a Town Service Travelcard validates within its period and town service when valid, is rejected with the reason when invalid, and is recorded in the back office.
        steps: |-
          **GIVEN** the ETM is signed on and in service on Bangor town service route 203b (IN) in Ulsterbus mode
          **AND** seeded Town Service Travelcards are available valid and invalid
          **WHEN** you present the valid card on its town service, then present an invalid or out-of-service card
          **AND** you open the CloudFare activity log
          **THEN** the valid card validates on its town service within period
          **AND** the invalid card is rejected with the reason
          **AND** both are recorded in CloudFare and flow to MERIT and SmartTrack
        expected: A Town Service Travelcard validates on its town service within period and rejects otherwise; recorded in CloudFare, MERIT and SmartTrack. (Ulsterbus mode.)

