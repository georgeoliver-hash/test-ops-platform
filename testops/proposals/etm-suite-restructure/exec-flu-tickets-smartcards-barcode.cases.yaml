  # ═════════════════════════ Smartcards / Transfers ═════════════════════════
  - path: [Functional, Smartcards, Transfers]
    cases:
      - title: Transfer — the ETM decides transfer vs journey from the ROUTE Transfer Time
        refs: [FBD-100271]
        objective: This test is to confirm the ETM uses the ROUTE Transfer Time property, not the product property, to decide transfer versus journey.
        steps: |-
          **GIVEN** a Metro Multi-Journey card (Field ID 01, City Adult) has already validated on Metro route 10A with time and direction written
          **AND** route 10A carries a ROUTE Transfer Time of 90 minutes and the current stop is inside the Metro Transfer Zone
          **WHEN** you re-present the card 30 minutes later in the same direction of travel
          **AND** you open the CloudFare activity log
          **THEN** the ETM reads the 90-minute ROUTE Transfer Time and allows the re-tap as a transfer
          **AND** no Multi-Journey deduction is made
        expected: The ETM reads the ROUTE Transfer Time (90 min) to allow the re-tap as a transfer with no journey deducted.
      - title: Transfer — a stop outside the Metro Transfer Zone is charged as a journey
        refs: [FBD-100271]
        objective: This test is to confirm a re-validation outside the Metro Transfer Zone is treated as a journey rather than a transfer.
        steps: |-
          **GIVEN** a Metro Multi-Journey card (Field ID 01, City Adult) has already validated within the transfer window on route 10A
          **AND** the current stop is outside the Metro Transfer Zone (zone ID > 256 membership fails)
          **WHEN** you re-present the card at the out-of-zone stop
          **AND** you open the CloudFare activity log
          **THEN** the re-tap is charged as a journey with a deduction
          **AND** the re-tap is not treated as a transfer
        expected: A re-tap at a stop outside the Metro Transfer Zone is charged as a journey with a deduction, not a transfer.
      - title: Transfer — passback is prioritised over the transfer window
        refs: [FBD-100271]
        objective: This test is to confirm a re-tap inside the passback window is handled as passback and not as a transfer.
        steps: |-
          **GIVEN** a Metro Multi-Journey card (Field ID 01, City Adult) has just validated on route 10A inside the Metro Transfer Zone
          **AND** the passback time is configured shorter than the 90-minute route Transfer Time
          **WHEN** you re-present the card within the passback window
          **AND** you open the CloudFare activity log
          **THEN** the re-tap is treated as passback
          **AND** passback takes priority over the transfer window
        expected: A re-tap within the passback window is treated as passback, taking priority over the transfer window.
      - title: Transfer — a transfer audits WTS SmartTransfer while a journey audits WTS SmartUse
        refs: [FBD-100271]
        objective: This test is to confirm the ETM audits a transfer as WTS SmartTransfer and a deducted journey as WTS SmartUse.
        steps: |-
          **GIVEN** a Metro Multi-Journey card (Field ID 01, City Adult) will make two validations on route 10A inside the Metro Transfer Zone
          **AND** the second validation falls inside the 90-minute route Transfer Time in the same direction
          **WHEN** you make the first validation, then make the in-window second validation
          **AND** you open the CloudFare activity log
          **THEN** the first tap audits as WTS SmartUse
          **AND** the in-window re-tap audits as WTS SmartTransfer with the TRN incremented
        expected: The first tap audits as WTS SmartUse and the in-window re-tap audits as WTS SmartTransfer with the TRN incremented.

  # ═════════════════════════ ABT ═════════════════════════
  - path: [Functional, ABT]
    cases:
      - title: ABT — successful tap, passback and mobile wallet
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm a successful ABT tap, second-tap passback, and mobile wallet acceptance.
        steps: |-
          **GIVEN** ABT taps are enabled and a Driver is signed on to Metro route 10A at the FLU screen
          **AND** a seeded contactless card and mobile wallets are available
          **WHEN** you tap a valid card, then tap it a second time, then tap each mobile wallet
          **AND** you open the CloudFare activity log
          **THEN** the first tap is accepted with the success tone and "Success"
          **AND** the second tap enters passback
          **AND** Visa, Mastercard, Apple Pay, Google Pay and Samsung Pay on phone and watch are accepted
        expected: A valid ABT tap is accepted (success tone, "Success"); a second tap enters passback; mobile wallets are accepted on phone and watch; recorded in CloudFare and MERIT.
      - title: ABT — declined, error and EMV validation failures
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm declined and errored ABT taps and the EMV validation-failure screens.
        steps: |-
          **GIVEN** ABT taps are enabled and a Driver is signed on to Metro route 10A at the FLU screen
          **AND** seeded cards are available for declined, errored, expired and already-validated states
          **WHEN** you tap a declined card, an errored card, and cards for each EMV failure state
          **AND** you check the printout and screen
          **THEN** declined and errored taps give the error tone, a declined receipt and "See Driver"
          **AND** the correct EMV validation-failure screen shows for tap-error, expired, declined and already-validated
        expected: Declined/errored taps give the error tone, declined receipt and "See Driver"; the correct EMV validation-failure screen shows for tap-error, expired, declined and already-validated.
      - title: ABT — tap availability rules
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm ABT taps are only enabled in the appropriate states and ignored elsewhere.
        steps: |-
          **GIVEN** ABT is configured as enabled and a Driver is signed on to Metro route 10A
          **WHEN** you tap at a FLU-ready state, then tap while in basket, on break, in the smartcard flow, mid-annul, starting a new journey, and in travel mode above 5 kph
          **THEN** the tap at the FLU-ready state is accepted
          **AND** the tap is ignored in basket, break, smartcard, annul and start-new-journey states
          **AND** the tap is ignored in travel mode above 5 kph
        expected: ABT taps are accepted only at FLU-ready states and ignored on basket, break, smartcard, annul, start-new-journey and travel-mode-above-5kph.
      - title: ABT — Metro zone boarding and alighting
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm ABT boarding and alighting within a Metro ABT zone.
        steps: |-
          **GIVEN** ABT is enabled in a Metro ABT zone and a Driver is signed on to Metro route 10A
          **AND** a seeded contactless card is available
          **WHEN** you make a boarding-only tap, an alighting-only tap, and both a boarding and alighting tap
          **AND** you open the CloudFare activity log
          **THEN** the Metro ABT zone records the boarding-only tap
          **AND** it records the alighting-only tap
          **AND** it records the boarding-and-alighting pair
          Data variations: Metro mode.
        expected: The Metro ABT zone records boarding-only, alighting-only and both; recorded in CloudFare and MERIT. (Metro mode.)
      - title: ABT — Ulsterbus zone boarding and alighting
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm ABT boarding and alighting within Ulsterbus ABT zones.
        steps: |-
          **GIVEN** ABT is enabled in an Ulsterbus ABT zone and a Driver is signed on to Ulsterbus route 72b (IN)
          **AND** a seeded contactless card is available
          **WHEN** you make a boarding-only tap, an alighting-only tap, and both a boarding and alighting tap
          **AND** you open the CloudFare activity log
          **THEN** the Ulsterbus ABT zone records the boarding-only tap
          **AND** it records the alighting-only tap
          **AND** it records the boarding-and-alighting pair
          Data variations: Ulsterbus mode.
        expected: The Ulsterbus ABT zone records boarding-only, alighting-only and both; recorded in CloudFare and MERIT. (Ulsterbus mode.)
      - title: ABT — reverts to standard fixed fare on rule change
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm an ABT journey reverts to the standard fixed fare when a different service, journey or rule is triggered.
        steps: |-
          **GIVEN** an ABT journey is in progress on Ulsterbus route 72b (IN)
          **WHEN** you trigger a different service, journey or rule during the ABT journey
          **AND** you open the CloudFare activity log
          **THEN** the ABT journey reverts to the standard fixed fare
          **AND** the reverted fare is recorded in CloudFare and flows to MERIT
          Data variations: Ulsterbus mode.
        expected: ABT reverts to the standard fixed fare when a different service, journey or rule applies; recorded in CloudFare and MERIT. (Ulsterbus mode.)
      - title: ABT — invalid taps recorded in back office
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm invalid ABT taps are recorded in the back office under ABT with the decline reason.
        steps: |-
          **GIVEN** an invalid ABT tap has occurred on the ETM on Metro route 10A
          **WHEN** you open the CloudFare device-activity log under ABT
          **THEN** the invalid ABT tap appears under ABT
          **AND** the decline reason is shown against the tap
        expected: Invalid ABT taps appear in the back office under ABT with the decline reason.

  # ═════════════════════════ Barcode Scanning ═════════════════════════
  - path: [Functional, Barcode Scanning]
    cases:
      - title: Barcode — online validation (pass and fail)
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm barcode online validation passes for a valid ticket and is rejected with the correct reason when it fails.
        steps: |-
          **GIVEN** a Driver is signed on to route 72b (IN) and barcode scanning is available online
          **AND** seeded barcodes are available valid and for each failure reason, as printed copy and on a mobile phone
          **WHEN** you scan a valid barcode, then scan barcodes for each failure reason
          **AND** you open the CloudFare activity log
          **THEN** the valid barcode validates online showing the green result with the validity detail
          **AND** each failing barcode is cancelled with its reason shown
          **AND** the BarcodeUsage zero-fare transaction for the pass appears in CloudFare
          Data variations: decryption failed, not valid, already used, wrong date, expired, exceeds offline limit, invalid product, visual inspection not passed; printed copy and mobile phone.
        expected: Valid barcodes validate online with the validity detail; failures cancel with the reason; the pass posts a BarcodeUsage zero-fare transaction to CloudFare and MERIT.
      - title: Barcode — offline validation
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/barcode-scanning/12_2_1 - Barcode - Offline Check.png
        objective: This test is to confirm barcode offline validation succeeds within the offline limit and is rejected when over the limit or invalid.
        steps: |-
          **GIVEN** the ETM is validating a barcode offline on route 72b (IN)
          **AND** seeded barcodes are available within the offline limit, over the limit and invalid
          **WHEN** you scan a barcode within the offline limit, then one over the offline limit, then an invalid one
          **AND** you open the CloudFare activity log once back online
          **THEN** the within-limit barcode validates offline
          **AND** the over-limit and invalid barcodes are rejected with the reason
          **AND** the queued offline result posts to CloudFare when back online
        expected: Offline validation accepts within the limit and rejects when over the offline limit or invalid; the result posts to CloudFare when back online.
      - title: Barcode — multiple-use validation
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm multiple-use barcode validation including confirming multiple use and the failure reasons.
        steps: |-
          **GIVEN** a Driver is signed on to route 72b (IN) and barcode scanning is available
          **AND** seeded multiple-use barcodes are available valid and for each failure reason, as printed copy and on a mobile phone
          **WHEN** you scan a valid multiple-use barcode and confirm multiple use, then scan barcodes for each failure reason
          **AND** you open the CloudFare activity log
          **THEN** the valid multiple-use barcode validates with the confirmation
          **AND** failures show passback, incorrect zone, wrong dates or wrong travel method
          **AND** the pass posts a BarcodeUsage zero-fare transaction to CloudFare
          Data variations: printed copy and mobile phone.
        expected: Multiple-use barcodes validate with confirmation; failures show passback / incorrect zone / wrong dates / wrong travel method; the pass posts a BarcodeUsage transaction to CloudFare and MERIT.
      - title: Barcode — mLink scan validation
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm mLink barcode validation succeeds when valid and rejects an expired mLink barcode.
        steps: |-
          **GIVEN** a Driver is signed on to route 72b (IN) and barcode scanning is available
          **AND** a seeded valid mLink barcode and an expired mLink barcode are available
          **WHEN** you scan the valid mLink barcode, then scan the expired one
          **AND** you open the CloudFare activity log
          **THEN** the valid mLink barcode validates
          **AND** the expired mLink barcode is rejected with the reason
          **AND** the pass posts a BarcodeUsage zero-fare transaction to CloudFare
        expected: mLink barcodes validate when valid and reject when expired; the pass posts a BarcodeUsage transaction to CloudFare and MERIT.
      - title: Barcode — reference entry via Driver Menu
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/barcode-scanning/12_0_0 - Barcode Reference.png
        objective: This test is to confirm a Driver can enter a barcode reference manually for single and multiple use, with invalid references rejected.
        steps: |-
          **GIVEN** a Driver has opened the barcode reference entry from the Driver Menu on route 72b (IN)
          **WHEN** you key a valid single-use reference, key a valid multiple-use reference, then key an invalid reference
          **AND** you open the CloudFare activity log
          **THEN** the valid single-use and multiple-use references validate
          **AND** the invalid reference is rejected
          **AND** the passes post their BarcodeUsage transactions to CloudFare
        expected: Manual barcode reference entry (single and multiple use) validates valid references and rejects invalid ones; recorded in CloudFare and MERIT.
      - title: Barcode — printed tickets and print error
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm a barcode-bearing ticket can be printed and that a print error during a barcode ticket is handled, including legacy barcodes.
        steps: |-
          **GIVEN** a Driver on route 72b (IN) is issuing a ticket configured to carry a barcode
          **WHEN** you issue the barcode ticket normally, then issue one and cause a print error mid-print
          **AND** you check the printout and open the CloudFare activity log
          **THEN** the ticket prints with its barcode appended at the end
          **AND** a print error during a barcode ticket is handled without a duplicate or orphaned ticket
          **AND** legacy barcodes print and are handled the same way
        expected: Tickets print with their barcode; a print error during a barcode ticket is handled; legacy barcodes are supported; recorded in CloudFare and MERIT.

  # ═════════════════════════ Location ═════════════════════════
  - path: [Functional, Location]
    cases:
      - title: GPS — notifications and tracking
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm GPS lock, new-location, arrival, departure and look-ahead behaviour on a route.
        steps: |-
          **GIVEN** a Driver is signed on to Ulsterbus route 72b (IN) with GPS active
          **WHEN** you acquire a GPS lock, drive to a new location, then arrive at and depart a stop
          **THEN** the GPS lock and new-location notifications are shown
          **AND** arrival and departure at the stop are detected
          **AND** look-ahead updates the current stage as the bus progresses
        expected: GPS lock and new-location notifications show; arrival and departure are detected; look-ahead updates the current stage.
      - title: GPS — travelling mode dims and input restores the screen
        match: GPS — travelling mode brightness behaviour
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm travelling-mode brightness behaviour at night and that a button press or smartcard restores the screen.
        steps: |-
          **GIVEN** a Driver is signed on to route 72b (IN) and the bus is travelling at night
          **WHEN** you keep travelling without input so the screen enters travelling mode
          **AND** you then press a button or present a smartcard
          **THEN** travelling mode dims the screen, including at night
          **AND** the button press or smartcard restores the screen brightness
        expected: Travelling mode dims the screen (including at night); a button press or smartcard restores brightness.

  # ═════════════════════════ Revenue Limit ═════════════════════════
  - path: [Functional, Revenue Limit]
    cases:
      - title: Revenue Limit — approaching notification
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/revenue-limit/02_9 _ Main Screen - Revenue Limit Approaching.png
        objective: This test is to confirm a header notification appears as the configured revenue limit is approaching.
        steps: |-
          **GIVEN** a Driver is signed on to route 72b (IN) and taking cash fares toward the configured revenue limit
          **WHEN** you take a cash fare that brings the takings close to the limit and watch the header after the Transaction Complete banner
          **THEN** the revenue-limit-approaching notification shows in the header after the Transaction Complete banner
          **AND** the notification clears after 3 seconds
        expected: A revenue-limit-approaching header notification shows after the Transaction Complete banner and clears after 3 seconds.
      - title: Revenue Limit — reached locks the ETM
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/revenue-limit/02_9_1 - Main Screen - Revenue Limit Reached.png
        objective: This test is to confirm reaching the maximum revenue signs the Driver off, prints a waybill and locks the ETM pending supervisor or technician action.
        steps: |-
          **GIVEN** a Driver is signed on to route 72b (IN) and the takings reach the maximum revenue limit
          **WHEN** you take the cash fare that reaches the maximum revenue limit
          **AND** you check the printout and the screen
          **THEN** the ETM auto-signs-off the Driver
          **AND** the ETM prints a waybill
          **AND** the ETM locks and requires a Supervisor or Technician to proceed
          **AND** the back-office connection re-establishes in the background
        expected: Reaching max revenue auto-signs-off the Driver, prints a waybill, locks the ETM (needs Supervisor/Technician) and re-establishes the back-office connection in the background.
