# ETM executable walk-through rewrite (ETM suite, 30254)
# Authored 2026-07-17. UPDATES 81 existing cases IN PLACE across four functional
# areas: Fare Look-Up (Navigation + Sales), Basket Mode + Ticket Issue, Smartcards +
# ABT, and Barcode Scanning + Location + Revenue Limit. Push with --update so titles
# match by the existing title (or by `match:` where a weak title is tightened).
#
# WHAT each case tests is UNCHANGED. Each is re-cut from a declarative summary into a
# procedure a tester can follow start to finish:
#   GIVEN = the full concrete setup (Driver signed on to a real duty/route, the seeded
#           card/product, the config that matters, where you verify in the back office),
#   WHEN  = the real ordered actions (make the tap/sale, check the printout/screen,
#           read the back office),
#   THEN  = what you observe and WHERE, with the value (screen label, receipt line,
#           CloudFare / MERIT / SmartTrack record).
# 1-3 steps per case; THEN/AND capped at ~3 lines; single-predicate lines throughout.
#
# Grounding: knowledge/devices/etm.md (sign-on flow, CloudFare/MERIT/SmartTrack audit,
# terminology), knowledge/ABT/ABT_FARE_REFERENCE.md (real Ulsterbus routes 72b/105a/203b
# with stop names + ref/fare), FBD-100167 (multi-use barcode result states + BarcodeUsage
# zero-fare audit), FBD-100271 (ROUTE Transfer Time — already grounded in the Transfer
# preconds). Metro examples use route 10A (Metro single £2.30). Where a concrete value is
# not confirmable the case says so rather than inventing it.
# No @tags, no [Automatable] line. Overflow/screen-image references preserved where present.
suite_id: 30254
defaults:
  template_id: 1
  custom_devtypes: [25]
  custom_autoconfirmation: false
  custom_revstatus: 2
sections:
  # ═════════════════════════ Fare Look-Up / Navigation ═════════════════════════
  - path: [Functional, Fare Look-Up, Navigation]
    cases:
      - title: FLU — navigate and select products
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm FLU product navigation across groups, preset and menu-type products, the journey-type toggle, and the idle reset to the default product.
        steps: |-
          **GIVEN** a Driver is signed on to a Metro duty on route 10A and the ETM is at the FLU Home screen showing the default product
          **AND** more than one product group is configured so the group toggle and the '+' more-indicator are available
          **WHEN** you press the group toggle to move through the product groups
          **AND** you select a preset product, then open a menu-type product and select from its list
          **AND** you use the journey-type toggle to switch between fare-based, favourite and transfer
          **THEN** the FLU screen steps through each group
          **AND** the position pips and the '+' more-indicator update
          **AND** the selected preset and menu-type products become the active product with the fare shown
          **AND** the journey-type toggle changes the journey basis on screen
          **WHEN** you leave the ETM idle at a non-default product for 60 seconds
          **THEN** the FLU screen reverts to the default product
        expected: Product navigation works across groups, preset and menu-type products and the journey-type toggle, and the screen resets to the default product after 60 seconds idle.
      - title: FLU — set boarding and alighting stages
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm the boarding stage is gated by GPS footprint and speed, that a stage can be set by ID, and that alighting stages page correctly.
        steps: |-
          **GIVEN** a Driver is signed on to Ulsterbus route 72b (IN) Dungannon to Armagh at the FLU screen
          **AND** the route has more than five downstream stages so the alighting list must page
          **WHEN** you attempt to change the boarding stage while inside the current stop GPS footprint or above 20 kph
          **AND** you then move outside the footprint below 20 kph and change the boarding stage, and also set a boarding stage by entering its stage ID
          **THEN** the boarding stage does not change while inside the footprint or above 20 kph
          **AND** the boarding stage changes once outside the footprint below 20 kph, or immediately when set by stage ID
          **WHEN** you page through the alighting stages
          **THEN** the alighting stages page five at a time
          **AND** the final stage on the route stays reachable at the end of the list
        expected: The boarding stage changes only outside the GPS footprint below 20 kph or by stage ID; alighting stages page five-at-a-time with the last stage always reachable.

  # ═════════════════════════ Fare Look-Up / Sales ═════════════════════════
  - path: [Functional, Fare Look-Up, Sales]
    cases:
      - title: FLU — numeric entry, change and last transaction
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm numeric entry for change and stage-by-ID, the error-bar messages, and the last-transaction display after a sale.
        steps: |-
          **GIVEN** a Driver is signed on to Ulsterbus route 72b (IN) at the FLU screen
          **AND** an Adult single Moygashel Busby Shop to Armagh Bus Centre is priced at £4.50 (ref.60)
          **WHEN** you key the cash tendered for the £4.50 fare and take the sale, then start a fresh entry and key an invalid value, pressing 'C' to clear a character
          **THEN** the change due is calculated from the tendered amount
          **AND** the change due is shown
          **AND** the invalid entry shows the error-bar message and 'C' clears a character
          **AND** the completed sale shows the 3-second success confirmation followed by the last-transaction detail
        expected: Numeric entry calculates change and sets stages by ID; invalid entries show the error-bar message and 'C' clears a character; a completed sale shows a 3-second success then the last transaction.
      - title: FLU — group ticket payment
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/flu/04_1 _ FLU - Group Ticket - Payment.png
        objective: This test is to confirm a group ticket can be priced, paid and issued from the FLU screen.
        steps: |-
          **GIVEN** a Driver is signed on to Ulsterbus route 72b (IN) at the FLU screen
          **AND** a group ticket product is configured for the route
          **WHEN** you select the group ticket product, set the group size and take payment
          **AND** you check the printout and open the CloudFare activity log for the duty
          **THEN** the FLU screen prices the group ticket for the selected size
          **AND** a group ticket prints
          **AND** the sale appears in the CloudFare activity log and flows to MERIT
        expected: A group ticket is priced, paid and issued with a printed ticket, recorded in CloudFare and MERIT.
      - title: FLU — ticket type selection, change and default reversion
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm selecting and changing the ticket type updates the fare, and that a non-default class reverts to the default on the inactivity timeout.
        steps: |-
          **GIVEN** a Driver is signed on to Ulsterbus route 72b (IN) at the FLU screen with Adult as the default ticket type
          **WHEN** you select Child, then change to another ticket type
          **THEN** the fare on the FLU screen updates to match each selected ticket type
          **WHEN** you leave the ETM idle at the non-default class for the inactivity timeout
          **THEN** the ticket type reverts to the default Adult class
        expected: Selecting or changing the ticket type updates the fare; a non-default class reverts to the default after the inactivity timeout.
      - title: FLU — currency switch to Euro and back
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/flu/07_0_4 _ Main Screen - Currency is Euro.png
        objective: This test is to confirm the alighting-stage key toggles the sale currency between Pounds and Euro.
        steps: |-
          **GIVEN** a Driver is signed on to Ulsterbus route 72b (IN) at the FLU screen with an alighting stage selectable and the fare shown in Pounds
          **WHEN** you press the alighting-stage key once, then press it again
          **THEN** the FLU screen shows the sale amount in Euro after the first press
          **AND** the FLU screen returns the sale amount to Pounds after the second press
        expected: The alighting-stage key toggles the sale currency £ to € to £.
      - title: FLU — Travel Mode and schedule adherence
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/flu/07_0_6 -Main Screen - Travel Mode.png
        objective: This test is to confirm the ETM enters Travel Mode while driving, showing time, date and schedule adherence, and restores to FLU on any input.
        steps: |-
          **GIVEN** a Driver is signed on to Ulsterbus route 72b (IN) and the bus is in motion
          **WHEN** you keep driving without touching the ETM for one minute
          **THEN** the screen enters Travel Mode dimmed, showing the time and date
          **AND** the schedule-adherence colour reflects whether the service is early, on time or late
          **WHEN** you press any button or a passenger taps a smartcard
          **THEN** the ETM restores the FLU screen
        expected: Travel Mode triggers after one minute while driving (dimmed, time/date plus schedule-adherence colour); any button press or smartcard tap restores FLU.
      - title: FLU — passenger count
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm the Driver can record a passenger count against the journey.
        steps: |-
          **GIVEN** a Driver is signed on to Ulsterbus route 72b (IN) at the FLU screen
          **WHEN** you open the passenger-count entry and record a count for the journey
          **AND** you open the CloudFare activity log for the duty
          **THEN** the recorded passenger count is confirmed on screen
          **AND** the passenger count is held against the current journey in the CloudFare activity log
        expected: A passenger count is captured against the journey and recorded in CloudFare.
      - title: FLU — favourite stages
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm the Driver can view the favourite stages and apply one to the sale.
        steps: |-
          **GIVEN** a Driver is signed on to Ulsterbus route 72b (IN) at the FLU screen with favourite stages configured
          **WHEN** you open the favourite stages list and select one
          **THEN** the favourite stages are listed
          **AND** the selected favourite stage is applied as the alighting stage with its fare shown
        expected: Favourite stages are listed and a selection is applied to the sale.
      - title: FLU — start a new journey mid-shift
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm a Driver can start a new journey partway through a shift, re-selecting route and journey, with the change audited.
        steps: |-
          **GIVEN** a Driver is signed on and partway through a shift on Ulsterbus route 72b (IN)
          **WHEN** you select Start New Journey and re-select the route and journey number
          **AND** you open the CloudFare activity log for the duty
          **THEN** the FLU screen shows the newly selected route and journey
          **AND** the journey change is recorded in the CloudFare activity log
        expected: Start New Journey re-selects the route and journey mid-shift and audits the change to CloudFare.

  # ═════════════════════════ Ticket Issue ═════════════════════════
  - path: [Functional, Ticket Issue]
    cases:
      - title: Ticket Issue — issue a single ticket
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm a ticket builds via fare look-up, takes payment and issues, printing a change receipt when change is due.
        steps: |-
          **GIVEN** a Driver is signed on to Ulsterbus route 72b (IN) at the FLU screen
          **AND** an Adult Moygashel Busby Shop to Armagh Bus Centre single is £4.50 (ref.60)
          **WHEN** you build the ticket via fare look-up, tender more than the fare and take payment
          **AND** you check the printouts and open the CloudFare activity log
          **THEN** the ticket prints for the selected product and fare
          **AND** a change receipt prints for the change due and can be annulled
          **AND** the sale appears in CloudFare and flows to MERIT and SmartTrack
          Data variations: Adult and Child; products Metro Single, Day Return, Month Return, iLink Single, Gateway, Jobseeker, Warrant Return, ME Rugby Day.
        expected: A ticket builds, pays and issues with a printed ticket; when change is due a change receipt prints and is annullable; recorded in CloudFare, MERIT and SmartTrack.
      - title: Ticket Issue — annulment (last ticket, timeout and refusal)
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm annulling the last issued ticket, the unconfirmed-annul timeout, and refusal where annulment is not permitted.
        steps: |-
          **GIVEN** a Driver on route 72b (IN) has just issued an Adult single ticket
          **WHEN** you annul the last issued ticket and confirm, then issue another and start an annul but let it time out unconfirmed
          **THEN** the confirmed annulment voids the last ticket and records it in CloudFare
          **AND** the unconfirmed annul times out leaving that ticket valid
          **WHEN** you attempt to annul a ticket whose boarding stage has changed, or an MJ-validated, pass-validated or concession-pass transaction
          **THEN** the annulment is refused with the reason shown
          Data variations: Adult and Child; single and basketed tickets.
        expected: The last ticket annuls (single or basket); an unconfirmed annul times out leaving the ticket valid; annulment is refused with a reason for boarding-stage-changed, MJ-validated, pass-validated and concession-pass cases.
      - title: Ticket Issue — Easibus stage selection
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/flu/02_0_5 _ Easibus.png
        objective: This test is to confirm a ticket can be issued using the Easibus stage selection, including via the basket.
        steps: |-
          **GIVEN** a Driver is signed on to Ulsterbus route 72b (IN) at the FLU screen with Easibus stage selection available
          **WHEN** you choose an Easibus stage, take payment and issue the ticket
          **AND** you check the printout and open the CloudFare activity log
          **THEN** a ticket issues against the chosen Easibus stage
          **AND** the sale appears in CloudFare and flows to MERIT
          Data variations: Easibus options Red, Orange, Yellow, Green, White, Buggy, Wheelchair, Other; also via the basket.
        expected: A ticket issues against the chosen Easibus stage, recorded in CloudFare and MERIT; runs across all Easibus options and via the basket.
      - title: Ticket Issue — Open Tickets excess fare
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm a Driver can issue an Open (excess) ticket for a valid amount and that an invalid amount is rejected.
        steps: |-
          **GIVEN** a Driver is signed on to Ulsterbus route 72b (IN) at the FLU screen
          **WHEN** you open the Open Tickets flow, key a valid excess amount and issue, then repeat keying an invalid amount
          **THEN** the Open excess ticket issues for the valid amount
          **AND** the Open excess ticket prints for the valid amount
          **AND** the invalid amount is rejected without issuing a ticket
          Data variations: Adult and Child.
        expected: Open/excess tickets issue for a valid amount and reject invalid amounts; runs for Adult and Child.
      - title: Ticket Issue — printer or power interrupt during print recovers
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm ticket printing resumes or annuls correctly after a power or printer interrupt, recovering to the signed-in state where possible without duplicating or orphaning a ticket.
        steps: |-
          **GIVEN** a Driver is issuing a ticket on route 72b (IN) when a power or printer interrupt occurs mid-print
          **WHEN** you cause a momentary printer/power failure during the print, then repeat with a full reset
          **AND** you open the CloudFare activity log to reconcile issued tickets
          **THEN** a momentary failure offers retry or annul
          **AND** it completes cleanly
          **AND** a full reset recovers to the signed-in state where possible
          **AND** CloudFare shows no duplicate and no orphaned ticket for the interrupted print
        expected: Momentary failures allow retry or annul; full resets recover to signed-in where possible and never leave a duplicate or orphaned ticket, confirmed in CloudFare and MERIT.

  # ═════════════════════════ Ticket Issue / Promo Menu ═════════════════════════
  - path: [Functional, Ticket Issue, Promo Menu]
    cases:
      - title: Promo Menu — issue a promo product
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm issuing a Promo Menu product, including adding an additional child to a family product.
        steps: |-
          **GIVEN** a Driver is signed on to route 72b (IN) at the FLU screen with the Promo Menu configured
          **WHEN** you open the Promo Menu, select a family product, add an additional child, take payment and issue
          **AND** you check the printout and open the CloudFare activity log
          **THEN** the promo product issues, including the additional child on the family product
          **AND** the promo product prints
          **AND** the sale appears in CloudFare and flows to MERIT
          Data variations: Adult and Child; products Bus Rambler, Metro Day/Evening/Family Day, Family & Friends Day, Park & Ride, ME Rugby Day.
        expected: A Promo Menu product issues and prints; family products can add an additional child; recorded in CloudFare and MERIT.
      - title: Promo Menu — promo product not available
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm the ETM indicates when a promo product is not currently available and cannot be issued.
        steps: |-
          **GIVEN** a promo product is configured as not currently available (e.g. Bus Rambler out of season)
          **AND** a Driver is signed on to route 72b (IN) at the Promo Menu
          **WHEN** you select the unavailable promo product
          **THEN** the ETM flags the promo product as not available
          **AND** the promo product cannot be issued
          Data variations: Adult and Child.
        expected: An unavailable promo product is flagged not available and cannot be issued; runs for Adult and Child.

  # ═════════════════════════ Basket Mode ═════════════════════════
  - path: [Functional, Basket Mode]
    cases:
      - title: Basket Mode — build a multi-item basket and pay
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/basket-mode/02_7 _ Main Screen - FLU - Multiple Items - Basket Mode Selected.png
        objective: This test is to confirm a Driver can enter basket mode, add multiple items, confirm and take a single payment with the mandatory receipt printed.
        steps: |-
          **GIVEN** a Driver is signed on to route 72b (IN) at the FLU screen with a product selected
          **WHEN** you enter basket mode, add further items, confirm the basket and take one payment
          **AND** you check the printouts and open the CloudFare activity log
          **THEN** the selected product is auto-added to the basket on entry
          **AND** all basket items issue in one paid transaction with a mandatory receipt printed automatically
          **AND** the transaction appears in CloudFare and flows to MERIT
        expected: Basket mode issues multiple items in one paid transaction; the selected product is auto-added on entry; a mandatory receipt prints automatically; recorded in CloudFare and MERIT.
      - title: Basket Mode — limits and line-item quantity
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm the nine-item basket limit, the Basket Full error, and line-item quantity changes.
        steps: |-
          **GIVEN** a Driver on route 72b (IN) has nine items in the basket
          **WHEN** you try to add a tenth item, then remove one item and add another
          **THEN** the ETM shows a Basket Full error and refuses the tenth item
          **AND** removing an item frees a slot so another can be added
          **WHEN** you adjust a line item with the plus and minus keys, including a change that is not allowed
          **THEN** the line-item quantity adjusts with the plus/minus keys
          **AND** a disallowed quantity change shows the 2-second error
        expected: The basket caps at nine with a Basket Full error; removing frees a slot; line-item quantity adjusts with +/- and shows a 2-second error when it cannot change.
      - title: Basket Mode — clear, add more and basket tracker
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm the Clear Basket and Add More options and that the basket tracker persists across screens including Promo sub-menus.
        steps: |-
          **GIVEN** a Driver on route 72b (IN) has items in the basket
          **WHEN** you select Add More and navigate across FLU and the Promo sub-menus
          **THEN** Add More keeps the existing basket contents
          **AND** the basket tracker count persists across screens including the Promo sub-menus
          **WHEN** you select Clear Basket
          **THEN** the basket empties
          **AND** the FLU screen reverts to the default product
        expected: Add More keeps the basket; the basket tracker persists across screens including Promo sub-menus; Clear Basket empties it and reverts to default.
      - title: Basket Mode — annul a basketed transaction
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm a basketed transaction can be annulled after issue and recorded.
        steps: |-
          **GIVEN** a Driver on route 72b (IN) has just issued a basket of tickets
          **WHEN** you annul the basketed transaction and confirm
          **AND** you open the CloudFare activity log
          **THEN** the basketed transaction is annulled on the ETM
          **AND** the annulment is recorded in CloudFare and flows to MERIT
        expected: A basketed transaction can be annulled after issue and is recorded in CloudFare and MERIT.

  # ═════════════════════════ Smartcards / Validation ═════════════════════════
  - path: [Functional, Smartcards, Validation]
    cases:
      - title: Smartcard — validation and passback rules
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm smartcard validation and the passback rules for same versus different direction and within versus outside the transfer period.
        steps: |-
          **GIVEN** a Driver is signed on to Metro route 10A at the FLU screen
          **AND** a seeded valid smartcard product is available for the route
          **WHEN** you present the card to validate, then re-present it inside the transfer period in the same direction, then again in the opposite direction, then again outside the transfer period
          **THEN** the first present validates with the success indication
          **AND** the same-direction re-present inside the period is handled as passback
          **AND** the opposite-direction and outside-period re-presents follow the direction and transfer rules
          Data variations: Adult and Child across products and Metro and Ulsterbus Multi-Journey.
        expected: A valid card validates with passback within the transfer period; direction and outside-transfer rules apply; runs Adult/Child across products and Metro and Ulsterbus MJ.
      - title: Smartcard — invalid card presented
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/flu/05_0_0 - Hotlisted Error.png
        objective: This test is to confirm the ETM rejects an invalid smartcard with the correct reason shown.
        steps: |-
          **GIVEN** a Driver is signed on at the FLU screen (Metro route 10A for zone checks, Ulsterbus route 72b for boarding-stage checks)
          **AND** seeded cards are available for each invalid condition
          **WHEN** you present each invalid card in turn
          **THEN** the ETM rejects the card
          **AND** the ETM shows the reason on screen
          Data variations: wrong zone (Metro), invalid boarding stage (Ulsterbus), outside time band, expired, hotlisted.
        expected: Invalid cards are rejected with the reason shown — wrong zone (Metro), invalid boarding stage (Ulsterbus), outside time band, expired, or hotlisted.
      - title: Smartcard — concessionary pass validation
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm concessionary passes validate, reject when invalid, and support passback override where allowed.
        steps: |-
          **GIVEN** a Driver is signed on to Metro route 10A at the FLU screen
          **AND** seeded concessionary passes are available in valid and invalid states
          **WHEN** you present a valid pass, present an invalid pass, and re-present a valid pass to exercise passback override where allowed
          **THEN** a valid concessionary pass validates for free travel
          **AND** an invalid pass is rejected with the reason
          **AND** passback override is allowed where the pass rules permit it
          Data variations: 60+, Senior, ROI Senior, Blind, War Pensioner, Half-Fare (DLA / Partially Sighted / Learning Disability / No Driving Licence / PIPS), Free Smartpass, Staff / Spouse / Dependants / Retired / External Staff, EA Bus & Rail Pupil + Further Education (start/expiry/weekend/holiday/time-band rules).
        expected: Concessionary passes validate or reject correctly with passback override where allowed, across the representative pass range and their eligibility rules.
      - title: Smartcard — faulty card handling
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/flu/06_0_2_0 -  FLU - Smartcard - Faulty - Select Card Type.png
        objective: This test is to confirm the Driver can handle a faulty smartcard by selecting the card type and either charging full fare or issuing a ticket.
        steps: |-
          **GIVEN** a Driver is signed on to Metro route 10A and a faulty smartcard is presented
          **WHEN** you select the card type on the faulty-card screen, then charge full fare or issue a ticket
          **AND** you check the printout
          **THEN** the ETM lets you select the card type for the faulty card
          **AND** full fare is charged or a ticket is issued as chosen
          **AND** a faulty Smartpass receipt prints where applicable
        expected: A faulty card lets the Driver select the card type and charge full fare or issue a ticket, producing a faulty Smartpass receipt where applicable.
      - title: Fare-Paying Smartcard — validation
        objective: This test is to confirm a fare-paying stored-value smartcard deducts the fare from its balance when in funds, is handled when out of funds, and is recorded in the back office.
        steps: |-
          **GIVEN** the ETM is signed on and in service on route 72b (IN)
          **AND** a seeded fare-paying smartcard is available both in funds and out of funds
          **WHEN** you present the in-funds card for a £4.50 fare, then present the out-of-funds card
          **AND** you open the CloudFare activity log
          **THEN** the in-funds card validates
          **AND** the fare is deducted from its balance
          **AND** the out-of-funds card is handled per the insufficient-balance rules
          **AND** both validations appear in CloudFare and flow to MERIT and SmartTrack
        expected: A fare-paying smartcard deducts the fare when in funds and handles insufficient balance otherwise; recorded in CloudFare, MERIT and SmartTrack.

  # ═════════════════════════ Smartcards / Top-Up ═════════════════════════
  - path: [Functional, Smartcards, Top-Up]
    cases:
      - title: Smartcard top-up — successful, maximum and expired-journey rules
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm a successful smartcard top-up with auto-validation, the maximum-journey cap, and removal of expired journeys.
        steps: |-
          **GIVEN** a customer presents a topp-able smartcard and the Driver selects Top-Up on route 72b (IN)
          **WHEN** you top up the card and take payment, then top up a Multi-Journey card at its journey limit, then top up a card carrying expired journeys
          **AND** you check the receipt and open the CloudFare activity log
          **THEN** the top-up succeeds with a receipt
          **AND** the card auto-validates
          **AND** the Multi-Journey balance caps at 50 journeys
          **AND** expired journeys are removed on top-up
          Data variations: DayLink / iLink / Travelcard periods; Multi-Journey journeys.
        expected: Top-up succeeds (receipt plus auto-validate); MJ caps at 50 journeys; expired journeys are removed on top-up; recorded in CloudFare, MERIT and SmartTrack.
      - title: Smartcard top-up — cancelled with Back
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm a smartcard top-up can be cancelled with Back or by removing the card, with no charge.
        steps: |-
          **GIVEN** the Driver is in the smartcard top-up flow on route 72b (IN)
          **WHEN** you press Back partway through, then repeat and instead remove the card
          **AND** you open the CloudFare activity log
          **THEN** the top-up cancels
          **AND** the ETM returns to FLU Home in both cases
          **AND** no charge is recorded in CloudFare
        expected: Top-up cancels on Back or card removal and returns to FLU Home with no charge recorded.
      - title: Smartcard top-up — annulment
        overflow: https://overflow.io/s/NDLGF6NF/
        objective: This test is to confirm a smartcard top-up can be annulled and recorded.
        steps: |-
          **GIVEN** a Driver on route 72b (IN) has just topped up a smartcard
          **WHEN** you annul the top-up and confirm
          **AND** you open the CloudFare activity log
          **THEN** the top-up is annulled on the ETM
          **AND** the annulment is recorded in CloudFare and flows to MERIT and SmartTrack
