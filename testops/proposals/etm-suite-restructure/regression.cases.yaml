# ETM — Regression (dedicated cases for defects with no natural functional home).
# The other ~32 regression defects FOLD into their owning functional case (see regression-register.md
# — add the defect id to that case's Refs). Defect ids carried in Refs for traceability.
suite_id: 30254
defaults:
  template_id: 1
  custom_autoconfirmation: false
  custom_devtypes: [25]
  custom_revstatus: 2

sections:
  - path: Regression
    cases:
      - title: Regression — sequence ID integrity across power loss
        objective: This test is to confirm the transaction sequence ID stays in sync across a power loss (defect 301074).
        refs: "301074"
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** the ETM has processed transactions and holds the current sequence ID
          **WHEN** the ETM loses power and restarts
          **THEN** the sequence ID resumes in sync with no gap or duplication
        expected: The sequence ID stays in sync across a power loss (no out-of-sync, gap or duplicate).
      - title: Regression — Deny/BIN list download and update
        objective: This test is to confirm the Deny/BIN list downloads daily and updates correctly, including during FEIG communications (defects 301106, 302090).
        refs: "301106, 302090"
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** the ETM is configured for Open Payments with a Deny/BIN list
          **WHEN** the daily Deny/BIN list download is due
          **THEN** the Deny/BIN list is downloaded to the device
          **WHEN** a Deny/BIN list update arrives while the FEIG is performing communications
          **THEN** the update is applied without disrupting the in-progress communication
        expected: The Deny/BIN list downloads daily and updates safely even while the FEIG is communicating.
      - title: Regression — passenger display GDPR compliance
        objective: This test is to confirm the ETM customer/passenger display does not present data in breach of GDPR (defect 300751).
        refs: "300751"
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** a customer-facing passenger display is connected
          **WHEN** transactions and card interactions are shown on the passenger display
          **THEN** no personal or card data is displayed beyond what GDPR permits
        expected: The passenger display shows only GDPR-permitted information, no personal/card data.
      - title: Regression — no freeze on quick card removal after top-up
        objective: This test is to confirm the ETM does not freeze when a smartcard is removed very quickly after a top-up (defect 301209).
        refs: "301209"
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** a smartcard has just been topped up
          **WHEN** the customer removes the smartcard very quickly after the top-up completes
          **THEN** the ETM returns to the FLU screen without freezing
        expected: Quick card removal immediately after a top-up does not freeze the ETM.
      - title: Regression — no error navigating back from passenger-type menu
        objective: This test is to confirm no internal error occurs when navigating back from the Adult/Child/Other passenger-type menu (defect 301683).
        refs: "301683"
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** the Driver is in the Adult/Child/Other passenger-type menu
          **WHEN** the Driver navigates back from the menu
          **THEN** the ETM returns to the previous screen without an internal error
        expected: Navigating back from the passenger-type menu does not raise an internal error.
      - title: Regression — performance under sustained use
        objective: This test is to confirm the ETM maintains performance under sustained use, including product-group toggling and sign-in load (defects 301276, 301723, 301598).
        refs: "301276, 301723, 301598"
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** the ETM has been in continuous service across a shift
          **WHEN** the Driver toggles product groups, signs in, and performs repeated transactions
          **THEN** the response times remain within acceptable limits with no progressive slow-down
        expected: Performance holds under sustained use — toggling, sign-in load and repeated transactions do not degrade over a shift.
      - title: Regression — ticket print speed
        objective: This test is to confirm the ticket print speed meets the target for a 110mm ticket (defect 301258).
        refs: "301258"
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** the ETM printer is loaded and ready
          **WHEN** a 110mm ticket is printed
          **THEN** the ticket prints within the target print-speed time
        expected: A 110mm ticket prints within the target print-speed time.
