suite: NJT - SystemTestOps
suite_id: 30295

defaults:
  template_id: 1
  custom_autoconfirmation: false
  custom_devtypes: [1]

sections:
  - path: ["Fare Register", "OBV Functionality", "Cubic RS485 Network", "Farebox", "FB Information Request"]
    cases:
      - title: "FB Information Request — Farebox rejects with NAK"
        objective: "This test is to confirm the FR handles a NAK response to an FB Information request."
        steps: |
          **GIVEN** the Fare Register has sent the Farebox Information request message (10 10)
          **WHEN** the Farebox responds with <NAK> instead of an FB IDs message
          **THEN** the Farebox rejects the request and no Farebox/Cashbox ID update is applied
        expected: "FB Information request allows a NAK response in place of FB IDs; the FR does not update its stored IDs on a rejected exchange. (Source: NJT_FRFRP_IS001 p.9)"

  - path: ["Fare Register", "OBV Functionality", "Cubic RS485 Network", "Farebox", "Enter Service (NOT COMPLETE)"]
    cases:
      - title: "Enter Service — message payload carries driver, route, trip and bus number"
        objective: "This test is to confirm the Enter Service message payload contains the required BCD fields."
        steps: |
          **GIVEN** a driver is signing on to an Exact Fare route
          **WHEN** the Fare Register sends the Enter Service message (10 12)
          **THEN** the message payload contains the driver number, route, trip and bus number, each encoded in BCD
        expected: "Enter Service (10 12) carries driver number, route, trip and bus number in BCD, as detailed in section 4.1.4. (Source: NJT_FRFRP_IS001 p.11)"

      - title: "Enter Service — Farebox acknowledges with FB Status"
        objective: "This test is to confirm the FR accepts an FB Status response to Enter Service."
        steps: |
          **GIVEN** the Fare Register has sent the Enter Service message (10 12)
          **WHEN** the Farebox responds with an FB Status message
          **THEN** the response is accepted as a valid acknowledgement of Enter Service
        expected: "Enter Service allows FB Status or NAK as its response set. (Source: NJT_FRFRP_IS001 p.11)"

      - title: "Enter Service — not sent when signing on to a non-Exact-Fare route"
        objective: "This test is to confirm the FR does not send Enter Service outside Exact Fare service."
        steps: |
          **GIVEN** a driver is signing on to a route that is not an Exact Fare service
          **WHEN** the driver completes sign-on
          **THEN** the Fare Register does not send the Enter Service message (10 12)
        expected: "Enter Service is only sent when the FR is signed on to an Exact Fare service. (Source: NJT_FRFRP_IS001 p.11)"

  - path: ["Fare Register", "OBV Functionality", "Cubic RS485 Network", "Farebox", "Exit Service (NOT COMPLETE)"]
    cases:
      - title: "Exit Service — Farebox acknowledges with FB Status"
        objective: "This test is to confirm the FR accepts an FB Status response to Exit Service."
        steps: |
          **GIVEN** the Fare Register has sent the Exit Service message (10 13)
          **WHEN** the Farebox responds with an FB Status message
          **THEN** the response is accepted as a valid acknowledgement of Exit Service
        expected: "Exit Service allows FB Status or NAK as its response set. (Source: NJT_FRFRP_IS001 p.12)"

  - path: ["Fare Register", "OBV Functionality", "Cubic RS485 Network", "Farebox", "Decrement Funds"]
    cases:
      - title: "Decrement Funds — short-fare accept when amount accepted is less than product value"
        objective: "This test is to confirm the FR correctly sends a short-fare Decrement Funds when the accepted amount is below the product value."
        steps: |
          **GIVEN** the Fare Register is in exact fare mode and a driver issues a $4.80 product
          **WHEN** the driver accepts a payment of $4.00
          **THEN** the Fare Register sends the Decrement Funds message (10 20) with Product Value $4.80 and Amount Accepted $4.00
            **AND** the available funds on the screen are updated by $4.00
        expected: "Decrement Funds carries Product Value and Amount Accepted independently; Amount Accepted < Product Value is the documented short-fare 'accept' case. (Source: NJT_FRFRP_IS001 p.13)"

  - path: ["Fare Register", "OBV Functionality", "Cubic RS485 Network", "Farebox", "Bill Reclassify"]
    cases:
      - title: "Bill Rejected prompts driver to invoke Bill Reclassify"
        objective: "This test is to confirm the operator-recovery pairing between a Bill Rejected event and the Accept Next Bill function."
        steps: |
          **GIVEN** the Fare Register is in an active polling state
          **WHEN** a Bill Rejected message (10 2A) is received from the Farebox
            **AND** the driver invokes the 'Accept next bill' function
          **THEN** the Fare Register sends the Bill Reclassify message (10 21) as detailed in section 4.1.7
            **AND** the Farebox subsequently accepts the re-presented bill
        expected: "Bill Rejected may be used by the FR to prompt the driver to use the accept-next-bill function; this is the documented recovery pairing. (Source: NJT_FRFRP_IS001 p.26)"

  - path: ["Fare Register", "OBV Functionality", "Cubic RS485 Network", "Farebox", "Hold"]
    cases:
      - title: "Hold — Farebox resets dump timeout to the configured 60 seconds"
        objective: "This test is to confirm the Hold function resets the Farebox dump timeout as specified."
        steps: |
          **GIVEN** the driver has access to the Hold function on the Fare Register
          **WHEN** the driver invokes the 'Hold' function
          **THEN** the Fare Register sends the Hold message (10 23) as detailed in section 4.1.9
            **AND** the Farebox's dump timeout is reset to the configured 60-second value
        expected: "Hold instructs the Farebox to reset its dump timeout to 60 seconds (configurable). (Source: NJT_FRFRP_IS001 p.16)"

  - path: ["Fare Register", "OBV Functionality", "Cubic RS485 Network", "Farebox", "Bill Unjam"]
    cases:
      - title: "Bill Unjam — subsequent poll confirms Jammed bit cleared"
        objective: "This test is to confirm the FB Status Jammed bit clears on the poll following a completed Bill Unjam."
        steps: |
          **GIVEN** the Farebox is reporting FB Status with the bill-validator Jammed bit set
          **WHEN** the driver invokes the 'Bill unjam' function and the unjam procedure completes
            **AND** the Fare Register performs its next poll
          **THEN** the returned FB Status message has the bill-validator Jammed bit cleared
        expected: "The unjam sample sequence shows FB Status reporting Jammed, then a subsequent Poll returning FB Status with the bit cleared once complete. (Source: NJT_FRFRP_IS001 p.17)"

  - path: ["Fare Register", "OBV Functionality", "Cubic RS485 Network", "Farebox", "Unlock Door"]
    cases:
      - title: "Unlock Door — subsequent poll confirms door-unlocked bit set"
        objective: "This test is to confirm the FB Status door-unlocked bit only becomes visible on the poll after Unlock Door, not in the immediate response."
        steps: |
          **GIVEN** a special user selects the 'Unlock Farebox' option on the Fare Register and sends the configured 5-digit unlock code
          **WHEN** the Fare Register performs its next poll after the Unlock Door response
          **THEN** the returned FB Status message has the cashbox door-unlocked bit set
        expected: "The Unlock Door sample sequence shows the FB Status door-unlocked bit only flips on a subsequent poll, not instantaneously in the direct response. (Source: NJT_FRFRP_IS001 p.18)"

  - path: ["Fare Register", "OBV Functionality", "Cubic RS485 Network", "Farebox", "Poll - FB Status"]
    cases:
      - title: "FB Status — coin and bill validator jammed/offline bits are reflected"
        objective: "This test is to confirm the FR sets internal state from the coin/bill validator jammed and offline bits in FB Status."
        steps: |
          **GIVEN** the Fare Register has sent a poll message
          **WHEN** an FB Status message (10 08) is received with the coin validator jammed/offline and bill validator jammed/offline bits set
          **THEN** the corresponding internal farebox alarm flags are set for each condition
        expected: "The Coin/Bill status byte carries coin validator jammed/offline and bill validator jammed/offline bits (bits 7-0). (Source: NJT_FRFRP_IS001 p.20-21)"

      - title: "FB Status — Out of Service revenue-mode bit is reflected"
        objective: "This test is to confirm the FR reflects the Farebox's Out of Service revenue-mode state from FB Status."
        steps: |
          **GIVEN** the Fare Register has sent a poll message
          **WHEN** an FB Status message (10 08) is received with the Operating status byte's revenue-mode bit set to Out of Service
          **THEN** the internal farebox operating state is set to Out of Service
        expected: "The Operating status byte carries the Revenue mode (In/Out of Service) bit. (Source: NJT_FRFRP_IS001 p.21)"

      - title: "FB Status — cashbox door open 3 minutes or more is flagged"
        objective: "This test is to confirm the FR raises the door-open alarm from the FB Status door-open-3-minutes bit."
        steps: |
          **GIVEN** the Fare Register has sent a poll message
          **WHEN** an FB Status message (10 08) is received with the 'door open >= 3 minutes' bit set in the FB status byte
          **THEN** the internal farebox alarm flag for an extended door-open condition is set
        expected: "The FB status byte carries cashbox door unlocked/open, cashbox removed, top cover opened, and door-open->=3-minutes bits. (Source: NJT_FRFRP_IS001 p.22)"

  - path: ["Fare Register", "OBV Functionality", "Cubic RS485 Network", "Farebox", "Poll - Increment Funds (NOT COMPLETE)"]
    cases:
      - title: "Increment Funds — coin-only indicator is processed"
        objective: "This test is to confirm the FR distinguishes a coin-only Increment Funds message via the Bill/Coin indicator."
        steps: |
          **GIVEN** the Fare Register is in an active state
          **WHEN** an Increment Funds message (10 28) is received with the Bill/Coin indicator set to coins (0x01)
          **THEN** the received value is added to the available funds counter and total vault cash received counter as a coin increment
        expected: "Increment Funds carries a Bill/Coin indicator (0x01 coins, 0x10 bills, 0x11 both) and the delta amount since the last increment. (Source: NJT_FRFRP_IS001 p.24)"

      - title: "Increment Funds — bill-only indicator is processed"
        objective: "This test is to confirm the FR distinguishes a bill-only Increment Funds message via the Bill/Coin indicator."
        steps: |
          **GIVEN** the Fare Register is in an active state
          **WHEN** an Increment Funds message (10 28) is received with the Bill/Coin indicator set to bills (0x10)
          **THEN** the received value is added to the available funds counter and total vault cash received counter as a bill increment
        expected: "Increment Funds carries a Bill/Coin indicator (0x01 coins, 0x10 bills, 0x11 both) and the delta amount since the last increment. (Source: NJT_FRFRP_IS001 p.24)"

      - title: "Increment Funds — combined coin and bill indicator is processed"
        objective: "This test is to confirm the FR processes an Increment Funds message where the Bill/Coin indicator reports both coins and bills."
        steps: |
          **GIVEN** the Fare Register is in an active state
          **WHEN** an Increment Funds message (10 28) is received with the Bill/Coin indicator set to both (0x11)
          **THEN** the received value is added to the available funds counter and total vault cash received counter as a combined increment
        expected: "Increment Funds carries a Bill/Coin indicator (0x01 coins, 0x10 bills, 0x11 both); the amount is a delta since the last increment, not a running total. (Source: NJT_FRFRP_IS001 p.24)"

  - path: ["Fare Register", "OBV Functionality", "Cubic RS485 Network", "Farebox", "Poll - Funds Dumped"]
    cases:
      - title: "Funds Dumped — no IVN transaction detail sent when IVN is not detected"
        objective: "This test is to confirm the FR does not send an IVN dump transaction detail message when no IVN is present."
        steps: |
          **GIVEN** the Fare Register is in an active state with no IVN detected
          **WHEN** a Funds Dumped message (10 29) is received from the Farebox
          **THEN** the Fare Register resets its available funds to $0.00 and sends the dump transaction to CloudFare
            **AND** no dump transaction detail message is sent to the IVN
        expected: "The IVN dump transaction detail message is conditional on IVN detection; absent an IVN, only the CloudFare dump transaction is sent. (Source: NJT_FRFRP_IS001 p.25)"

  - path: ["Fare Register", "OBV Functionality", "Cubic RS485 Network", "Farebox", "Poll - Farebox Vaulted (NOT COMPLETE)"]
    cases:
      - title: "Farebox Vaulted — per-denomination coin and bill counts are parsed"
        objective: "This test is to confirm the FR parses the per-denomination cash breakdown carried in a Farebox Vaulted message."
        steps: |
          **GIVEN** the Fare Register is in an active polling state
          **WHEN** a Farebox Vaulted message (10 2B) is received with populated 1c/5c/10c/25c/$1 coin and $1/$2/$5/$10/$20 bill counts and a coin-bypass indicator
          **THEN** the Fare Register sends an operator event to CloudFare
          **AND** the event contains the per-denomination coin and bill counts
          **AND** the event contains the coin-bypass indicator
          **AND** an ACK is sent to the Farebox
        expected: "Farebox Vaulted details cumulative cash counted since the last cashbox replacement, broken out per denomination (coin and bill, all HEX) plus a coin-bypass indicator. (Source: NJT_FRFRP_IS001 p.27-28)"
