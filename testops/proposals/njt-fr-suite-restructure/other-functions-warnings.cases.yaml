suite: NJT - SystemTestOps
suite_id: 30295
defaults:
  template_id: 1
  custom_autoconfirmation: false
  custom_devtypes: [1]
sections:
  - path: ["Fare Register", "Driver Functionality", "Other Functions", "Sum Function"]
    cases:
      - title: "Sum Function — ten transactions reach the maximum and issue successfully"
        objective: "This test is to confirm the Fare Register accepts exactly ten transactions within a single Sum function use and issues them all in sequence."
        steps: |
          **GIVEN** the Fare Register is signed on to a Full Service route at the ticket-issue screen
          **WHEN** the driver enters product parameters and presses the S (sum) key, repeating this ten times
          **THEN** the Fare Register accepts all ten sum entries without a warning beep or warning message
          **WHEN** the driver presses ISSUE
          **THEN** all ten summed products are issued in sequence, each recorded as a separate transaction
        expected: "The Fare Register allows the sum sequence to reach its stated maximum of 10 transactions and issues all ten in sequence on ISSUE. (Source: NJT_FRFRP_FS002 p.40)"

  - path: ["Fare Register", "Driver Functionality", "Other Functions", "Paper loading"]
    cases:
      - title: "Paper Loading — closing the lid after a new roll prompts a test print"
        objective: "This test is to confirm that replacing the paper roll and closing the lid is what triggers the Fare Register's test-print prompt."
        steps: |
          **GIVEN** the Fare Register lid is open and the old paper roll has been removed
          **WHEN** the driver inserts a new paper roll and closes the lid
          **THEN** the Fare Register prompts the driver to conduct a test print
        expected: "Closing the lid on a newly loaded roll causes the Fare Register to prompt a test print, prior to any print outcome being asserted. (Source: NJT_FRFRP_FS002 p.40)"

  - path: ["Fare Register", "Driver Functionality", "Other Functions", "Colour of the Day"]
    cases:
      - title: "Colour of the Day — sign-on displays colour from the back-office calendar"
        objective: "This test is to confirm the Colour of the Day display is populated from the back-office calendar at driver sign-on."
        steps: |
          **GIVEN** the back office has sent a Colour of the Day calendar to the Fare Register
          **WHEN** a driver signs on
          **THEN** the ticket-selection screen displays the current day's 3-character Colour of the Day code
        expected: "The Colour of the Day code shown on sign-on matches the value populated from the back-office calendar for the current day. (Source: NJT_FRFRP_FS002 p.41)"

  - path: ["Fare Register", "Driver Functionality", "Other Functions", "Disable Receipt Printing"]
    cases:
      - title: "Disable Receipt Printing — Transfer fare media still prints"
        objective: "This test is to confirm a Transfer fare media prints even when the route attribute disables receipt printing."
        steps: |
          **GIVEN** the route attribute disables receipt printing
          **WHEN** the driver issues a Transfer
          **THEN** no receipt is printed
          **AND** the Transfer fare media is printed
        expected: "Transfer fare media always prints, even with receipt printing disabled by route attribute. (Source: NJT_FRFRP_FS002 p.41)"
      - title: "Disable Receipt Printing — CTT fare media still prints"
        objective: "This test is to confirm a CTT fare media prints even when the route attribute disables receipt printing."
        steps: |
          **GIVEN** the route attribute disables receipt printing
          **WHEN** the driver issues a CTT
          **THEN** no receipt is printed
          **AND** the CTT fare media is printed
        expected: "CTT fare media always prints, even with receipt printing disabled by route attribute. (Source: NJT_FRFRP_FS002 p.41)"
      - title: "Disable Receipt Printing — CRT fare media still prints"
        objective: "This test is to confirm a CRT fare media prints even when the route attribute disables receipt printing."
        steps: |
          **GIVEN** the route attribute disables receipt printing
          **WHEN** the driver issues a CRT
          **THEN** no receipt is printed
          **AND** the CRT fare media is printed
        expected: "CRT fare media always prints, even with receipt printing disabled by route attribute. (Source: NJT_FRFRP_FS002 p.41)"
