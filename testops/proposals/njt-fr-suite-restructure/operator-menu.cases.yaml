suite: NJT - SystemTestOps
suite_id: 30295

defaults:
  template_id: 1
  custom_autoconfirmation: false
  custom_devtypes: [1]

sections:
  - path: ["Fare Register", "Driver Functionality", "Operator Menu", "Cancel Ticket"]
    cases:
      - title: "Cancel Ticket — transaction issued exactly at the 10-minute boundary is not eligible"
        objective: "This test is to confirm the user can verify the 10-minute annulment window boundary is enforced exactly, not just generically 'within/outside'."
        steps: |
          **GIVEN** the Fare Register is in Full Service mode
            **AND** the last paper transaction was issued exactly 10 minutes ago (the configured annulment window)
          **WHEN** the driver selects 'Cancel Ticket' from the Operator Menu
          **THEN** the transaction is not selectable/eligible for cancellation
            **AND** the Fare Register shows the "no ticket available to cancel" error
        expected: "At exactly the 10-minute annulment window boundary, the transaction is treated as outside the window and is not offered for cancellation. (Source: NJT_FRFRP_FS002 p.34)"

  - path: ["Fare Register", "Driver Functionality", "Operator Menu", "Hold"]
    cases:
      - title: "Hold — resets the Farebox automatic dump timeout to 60 seconds"
        objective: "This test is to confirm the user can verify that selecting Hold resets the Farebox's automatic dump timeout value back to 60 seconds."
        steps: |
          **GIVEN** the Fare Register is operating in Exact Fare mode
            **AND** the Farebox's automatic dump timeout is at a value other than 60 seconds (e.g. it has been counting down)
          **WHEN** the driver selects the 'Hold' option from the Operator Menu
          **THEN** the Fare Register sends the Hold command to the Farebox
            **AND** the Farebox's automatic dump timeout value is reset to 60 seconds
        expected: "Selecting Hold both initiates the Farebox Hold facility and resets its automatic dump timeout to 60 seconds. (Source: NJT_FRFRP_FS002 p.34)"

  - path: ["Fare Register", "Driver Functionality", "Operator Menu", "Dump"]
    cases:
      - title: "Dump — funds reset to zero with the Clever Device disconnected"
        objective: "This test is to confirm the user can verify the Dump function still resets Farebox funds to zero when the Clever Device is disconnected, and correctly withholds the transaction detail message."
        steps: |
          **GIVEN** the Fare Register is operating in Exact Fare mode
            **AND** unused funds are present in the Farebox
            **AND** the Clever Device is disconnected
          **WHEN** the driver selects the 'Dump' option from the Operator Menu
          **THEN** the Fare Register sends a dump command to the Farebox and available funds reset to zero
            **AND** no transaction detail message is sent to the Clever Device
        expected: "Dump always resets Farebox funds to zero; the Clever Device transaction detail message is conditional on connection and must not be sent when disconnected. (Source: NJT_FRFRP_FS002 p.36)"
