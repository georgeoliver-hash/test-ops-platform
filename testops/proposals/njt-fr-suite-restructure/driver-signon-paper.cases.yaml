# Driver Sign-on / Default Display / Paper Ticket Transactions — gap-fill cases
# Drafted against NJT_FRFRP_FS002 (Sign on / Default Display / Paper Ticket Transactions) after
# cross-examining reports/uk-bus-projects/njt-farebox-and-register-replacement/2026-08-13/area-cases/driver-signon-paper.md
# See proposals/njt-fr-suite-restructure/findings-driver-signon-paper.md for the full classification.
# Push:  python -m system_test_ops push --file proposals/njt-fr-suite-restructure/driver-signon-paper.cases.yaml --commit
suite: NJT - SystemTestOps
suite_id: 30295

defaults:
  template_id: 1
  custom_autoconfirmation: false
  custom_devtypes: [1]

sections:
  - path: ["Fare Register", "Driver Functionality", "Sign on"]
    cases:
      - title: "Sign On - Board Zone - Valid on Another Line, Invalid on Selected Line"
        objective: "This test is to confirm Board Zone validity is evaluated only against the currently selected Line's own zone list, not globally."
        steps: |
          **GIVEN** the operator has entered a valid Run and Line during sign on
            **AND** the tester knows a zone number that is valid for a different Line but not for the currently selected Line
          **WHEN** the operator enters that zone number as the Board Zone and presses ISSUE
          **THEN** the FR displays an 'invalid entry' error
            **AND** the driver must re-enter the Board Zone data
        expected: "Board Zone validity is Line-specific, not global — a zone number valid on another Line is rejected on the currently selected Line. (Source: NJT_FRFRP_FS002 p.27)"
      - title: "Sign On - Alight Zone - Valid on Another Line, Invalid on Selected Line"
        objective: "This test is to confirm Alight Zone validity is evaluated only against the currently selected Line's own zone list, not globally."
        steps: |
          **GIVEN** the operator has entered a valid Run, Line and Board Zone during sign on
            **AND** the tester knows a zone number that is valid for a different Line but not for the currently selected Line
          **WHEN** the operator enters that zone number as the Alight Zone and presses ISSUE
          **THEN** the FR displays an 'invalid entry' error
            **AND** the driver must re-enter the Alight Zone data
        expected: "Alight Zone validity is Line-specific, not global — a zone number valid on another Line is rejected on the currently selected Line. (Source: NJT_FRFRP_FS002 p.27)"

  - path: ["Fare Register", "Driver Functionality", "Paper Ticket Transactions", "Product Issue (Exact Fare)"]
    cases:
      - title: "Product Issue (Exact Fare) - Automatic Dump - Pending Transaction Not Finalised Within Window"
        objective: "This test is to confirm a pending Exact Fare transaction cannot be finalised once the 60-second auto-dump window has elapsed."
        steps: |
          **GIVEN** the user has set valid product parameters for a valid boarding and alighting zone combination
            **AND** the Fare Register displays the configured price for those parameters
          **WHEN** the user waits 60 seconds after the last funds were inserted into the Farebox, without pressing ISSUE
          **THEN** an automatic dump transaction occurs
            **AND** the pending transaction can no longer be finalised by pressing ISSUE
        expected: "**GAP** — FS002 5.3.3 states the pending transaction must be finalised within the 60s window but does not state the exact system response (error tone / no-op / other) to ISSUE after the auto-dump; confirm the exact behaviour on the live system before running. (Source: NJT_FRFRP_FS002 p.31)"

  - path: ["Fare Register", "Driver Functionality", "Paper Ticket Transactions", "Product Issue (Exact Fare)", "Accept"]
    cases:
      - title: "Product Issue (Exact Fare) - Accept - Underpayment Record Printed on Receipt"
        objective: "This test is to confirm an Accept transaction's receipt records and displays the underpayment (accepted fare) value."
        steps: |
          **GIVEN** the user has set valid product parameters for a valid boarding and alighting zone combination
            **AND** at least $0.01, but less than the full fare, is registered in the Farebox
          **WHEN** the user presses the 'A' key prior to the Issue key
          **THEN** the product is issued at the value of the Farebox money actually received
            **AND** the receipt printed shows an underpayment record with the accepted fare value
        expected: "The Accept receipt shows the underpayment record and the accepted fare value, not just a generic receipt confirmation. (Source: NJT_FRFRP_FS002 p.31)"
      - title: "Product Issue (Exact Fare) - Accept - Dual Clever Device Message"
        objective: "This test is to confirm an Accept transaction, when a Clever Device is connected, sends two distinct Clever Device messages rather than one."
        steps: |
          **GIVEN** the user has set valid product parameters for a valid boarding and alighting zone combination
            **AND** at least $0.01, but less than the full fare, is registered in the Farebox
            **AND** a Clever Device is connected
          **WHEN** the user presses the 'A' key prior to the Issue key
          **THEN** a transaction detail message for the ticket class and full price is sent to the Clever Device
            **AND** a second transaction detail message for the accept class and actual money taken is sent to the Clever Device
        expected: "Two distinct Clever Device messages are sent for an Accept issue — one for the full-price ticket class, one for the accept class/actual money taken — not the single message sent on a normal Full/Exact Fare issue. (Source: NJT_FRFRP_FS002 p.31-32)"
