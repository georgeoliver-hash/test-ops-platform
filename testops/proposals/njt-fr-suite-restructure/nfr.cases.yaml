suite: NJT - SystemTestOps
suite_id: 30295

defaults:
  template_id: 1
  custom_autoconfirmation: false
  custom_devtypes: [1]

sections:
  - path: ["Non Functional Requirements", "System Initialization & Offline Resilience"]
    cases:
      - title: "Offline Transaction Data Storage Capacity — 5-day soak check"
        objective: "This test is to confirm the Fare Register retains standard operational transaction logs and events locally, without data loss, across a sustained 5-day offline window. NOTE: this is a multi-day soak-test checkpoint, not a same-day functional case — it cannot be executed and closed in a single test pass; schedule it as a dedicated soak run (or substitute an audited bytes-per-transaction x expected-daily-volume proxy calculation if a live 5-day soak rig is unavailable)."
        steps: |
          **GIVEN** the Fare Register is isolated from CloudFare comms and begins logging standard operational transactions and events
          **WHEN** the Fare Register continues operating offline for 5 consecutive days at expected daily transaction/event volume
          **THEN** on Day 5 the locally stored transaction logs and events cover the full 5-day window with no data loss
          **WHEN** comms are restored and the Fare Register syncs to CloudFare
          **THEN** all 5 days of transaction and event data are present in CloudFare, matching the local record
        expected: "Target per SS003 is a minimum of 5 days of standard operational transaction logs and events stored locally without data loss. Per SS003's Performance Disclaimer (p.4), this figure is a non-binding engineering design goal, not a contractual SLA — treat a miss as a monitoring/regression signal to investigate, not an automatic contract failure. This case supplements, and does not replace, the existing same-day check C4105017. (Source: NJT_FRFRP_SS003 p.5.)"

  - path: ["Non Functional Requirements", "Cloud Synchronization & Configuration Management"]
    cases:
      - title: "Fleet-wide configuration update activation — 6-hour rollout check"
        objective: "This test is to confirm that when a configuration update is distributed from CloudFare, all Fare Registers in the fleet have received and activated it within 6 hours. NOTE: this checkpoint is fleet-scale by definition and is only meaningfully testable at a controlled multi-device test bed (or via fleet telemetry from a live rollout), not as a standard single-device functional case; a single-rig case can only sample a subset of the fleet."
        steps: |
          **GIVEN** comms infrastructure is available to the fleet and all Fare Registers are in a state where they can apply updates
          **WHEN** CloudFare distributes a configuration update to the fleet
          **THEN** each sampled Fare Register in the test bed reports the update applied within 6 hours of distribution
          **WHEN** the tester queries CloudFare's fleet rollout status at the 6-hour mark
          **THEN** CloudFare reports 100% of the fleet as having applied the update
        expected: "Target per SS003 is 6 hours for all Fare Registers to apply a distributed configuration update, subject to comms infrastructure being available and devices being in a state where they can apply updates. Per SS003's Performance Disclaimer (p.4), this is a non-binding engineering design goal, not a contractual SLA — assert against it as a monitoring/regression check. This case supplements, and does not replace, the existing single-rig check C4105021. (Source: NJT_FRFRP_SS003 p.6.)"

      - title: "Fleet-wide software update activation — 24-hour rollout check"
        objective: "This test is to confirm that when a software update is distributed from CloudFare, all Fare Registers in the fleet have received and activated it within 24 hours. NOTE: this checkpoint is fleet-scale by definition and is only meaningfully testable at a controlled multi-device test bed (or via fleet telemetry from a live rollout), not as a standard single-device functional case; a single-rig case can only sample a subset of the fleet."
        steps: |
          **GIVEN** comms infrastructure is available to the fleet and all Fare Registers are in a state where they can apply updates
          **WHEN** CloudFare distributes a software update to the fleet
          **THEN** each sampled Fare Register in the test bed reports the update applied within 24 hours of distribution
          **WHEN** the tester queries CloudFare's fleet rollout status at the 24-hour mark
          **THEN** CloudFare reports 100% of the fleet as having applied the update
        expected: "Target per SS003 is 24 hours for all Fare Registers to apply a distributed software update, subject to comms infrastructure being available and devices being in a state where they can apply updates. Per SS003's Performance Disclaimer (p.4), this is a non-binding engineering design goal, not a contractual SLA — assert against it as a monitoring/regression check. This case supplements, and does not replace, the existing single-rig check C4105023. (Source: NJT_FRFRP_SS003 p.6.)"
