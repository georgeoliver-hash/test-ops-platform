suite: NJT - SystemTestOps
suite_id: 30295
defaults:
  template_id: 1
  custom_autoconfirmation: false
  custom_devtypes: [1]
sections:
  - path: ["Fare Register", "CloudFare Communication", "Remote Commands"]
    cases:
      - title: "Remote Commands - Lock - Exit via Out of Service Command"
        objective: "This test is to confirm that a Fare Register in a CloudFare-initiated locked state can be exited by receiving an Out of Service command from CloudFare, as an alternative to an In Service command."
        steps: |
          **GIVEN** the Fare Register has been placed into a locked state by a CloudFare Lock command
          **WHEN** CloudFare sends an Out of Service command to the Fare Register
          **THEN** the Fare Register exits the locked state
            **And** the Fare Register transitions to an out-of-service state
        expected: "The Fare Register exits the locked state and transitions to an out-of-service state on receipt of the Out of Service command, confirming Lock can be exited by either an In Service or an Out of Service command from CloudFare, never by local logic alone. (Source: NJT_FRFRP_FS002 p.87)"

  - path: ["Fare Register", "CloudFare Communication"]
    cases:
      - title: "CloudFare Communication - Staff List and Manifest Check Periods Are Independently Configurable"
        objective: "This test is to confirm that the staff list check period and the Software/Configuration manifest check period are each independently configurable by Flowbird support staff, and that changing one does not affect the other."
        steps: |
          **GIVEN** the Fare Register's staff list check period and manifest check period are both set to their default value
          **WHEN** Flowbird support staff reconfigure the staff list check period to a different value from the manifest check period
          **THEN** the Fare Register requests the latest staff list according to the newly configured staff list check period
            **And** the Fare Register continues to request the latest manifest according to its own, unchanged, manifest check period
          **WHEN** Flowbird support staff reconfigure the manifest check period to a different value
          **THEN** the Fare Register requests the latest manifest according to the newly configured manifest check period
            **And** the staff list check period remains unaffected
        expected: "The staff list check period and the manifest check period operate independently of one another and are each configurable by Flowbird support staff. (Source: NJT_FRFRP_FS002 p.86)"

      - title: "CloudFare Communication - Current and Future Configuration Sets Stored Simultaneously"
        objective: "This test is to confirm that the Fare Register can hold both a current (active) configuration set and a future (pending) configuration set at the same time, with the future set inactive until its configured activation date/time is reached."
        steps: |
          **GIVEN** the Fare Register has a current, active configuration set in use
          **WHEN** the Fare Register downloads and verifies a new configuration set with a future activation date/time
          **THEN** the Fare Register stores the new configuration set as a future set, distinct from the current active set
            **And** the current configuration set remains in use and continues to govern device behaviour
            **And** the future configuration set is not applied
          **WHEN** the configured activation date/time for the future set is reached
          **THEN** the future configuration set becomes the active set
            **And** the previously current configuration set is superseded
        expected: "The Fare Register supports storing both a current and a future set of configuration data concurrently, activating the future set only at its configured date/time. (Source: NJT_FRFRP_FS002 p.86)"
