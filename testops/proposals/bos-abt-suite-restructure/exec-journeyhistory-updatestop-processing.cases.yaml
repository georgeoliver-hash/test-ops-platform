# ABT — Journey History / Update Stop List / Processing Taps — executable rewrite
# In-place UPDATE of existing cases in suite 30279 (run push with --update).
# Same tests, no scope change: each case is rewritten as a walk-through a tester can
# follow — concrete GIVEN setup (seeded ABT test cEMV card + account in CloudFare env5,
# signed into the ABT Operator Web Portal to verify), ordered WHEN actions, and THEN
# observations that name WHERE + the expected value. Grouped into 1-3 steps.
# Titles tightened only where vague/generic (each kept old title as `match:`): 5 cases.
# Grounded in FBD-100389 (ABT scenarios / operating day / late-tap rules), FBD-100658
# (audit), FBD-100307 (data flow / 14-day expiry), the TODEV-24300/24397 cases, and
# knowledge/ABT/ABT_FARE_REFERENCE.md (routes 72b / 273 / 10b, Metro £4.00 cap, ref bands).
suite_id: 30279
defaults:
  template_id: 1
  custom_devtypes: [200]
  custom_autoconfirmation: false
  custom_revstatus: 2
sections:
  # ───────────────────────── Journey History (TODEV-24061: cancellation retention) ─────────────────────────
  - path: [ABT, Journey History]
    cases:
      - title: A cancelled journey remains visible in Journey History
        refs: [TODEV-24061]
        objective: This test is to confirm that a cancelled journey is retained and shown in Journey History after cancellation.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its customer account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a Metro-zone journey is available to tap (e.g. 10b (IN) High School to Cherry Hill, ref.20, single £2.30, Metro daily cap £4.00)
          **WHEN** you tap the card to make the Metro journey
          **AND** you cancel that journey from the card's Journey History in the portal
          **THEN** the journey is shown as cancelled for that tap
          **WHEN** you run the EndOfDay settlement for the operating day (04:00-03:59)
          **AND** you re-open the card's Journey History
          **THEN** Journey History shows a single journey row for that tap
          **AND** the row is marked cancelled with the "**" indicator
        expected: After settlement the cancelled Metro journey stays visible in Journey History as a single row marked with the "**" indicator.
      - title: A cancelled journey with a £0.00 fare is still visible
        refs: [TODEV-24061]
        objective: This test is to confirm that a cancelled journey charged £0.00 does not vanish from Journey History.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** the Metro day has already reached the £4.00 cap, so the next Metro tap is charged £0.00 (e.g. a further 10b (IN) High School to Cherry Hill tap)
          **WHEN** you tap the card for that capped Metro journey (charged £0.00)
          **AND** you cancel it from the card's Journey History
          **THEN** the £0.00 journey is shown as cancelled
          **WHEN** you run the EndOfDay settlement for the operating day
          **AND** you re-open the card's Journey History
          **THEN** Journey History shows the £0.00 journey
          **AND** the row is marked cancelled with the "**" indicator
        expected: The £0.00 capped Metro journey remains visible after cancellation, marked with the "**" indicator.
      - title: Editing the alighting stop on a cancelled tap keeps the journey visible
        refs: [TODEV-24061]
        objective: This test is to confirm that correcting the stop on a cancelled tap leaves it visible and still cancelled.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a cancelled Metro tap exists for today (e.g. 10b (IN) High School to Cherry Hill, ref.20)
          **WHEN** you open the cancelled journey's Update Stop list in Journey History
          **AND** you select another Metro stage of equal fare and confirm the change
          **THEN** the journey's alighting stop shows the corrected stop
          **WHEN** you run the EndOfDay settlement for the operating day
          **AND** you re-open the card's Journey History
          **THEN** Journey History shows a single journey with the corrected stop
          **AND** it is still marked cancelled with the "**" indicator
        expected: After the stop edit the cancelled journey stays visible as a single row and is still cancelled.
      - title: A zero-fare correction on a cancelled tap leaves a single visible row
        refs: [TODEV-24061]
        objective: This test is to confirm that a correction that zeroes a cancelled tap's fare does not hide or duplicate the row.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a cancelled Metro tap exists for today
          **WHEN** you open the cancelled journey's Update Stop list and select a stop so the recalculated fare is £0.00
          **AND** you confirm the change
          **THEN** the correction is accepted for the cancelled journey
          **WHEN** you run the EndOfDay settlement for the operating day
          **AND** you re-open the card's Journey History
          **THEN** Journey History still shows a single cancelled journey for that tap
          **AND** exactly one journey row exists for it
        expected: A single cancelled row remains; the £0.00 correction does not hide or duplicate it.
      - title: Correcting a non-cancelled journey keeps it active at its new fare
        match: Editing the stop on a non-cancelled journey still works
        refs: [TODEV-24061]
        objective: This test is to confirm that the retention fix does not affect normal corrections on non-cancelled journeys.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a normal (non-cancelled) Metro journey exists for today (e.g. 10b (IN) High School to City Hall, ref.35, £3.10)
          **WHEN** you open the journey's Update Stop list and select a different valid stop and confirm
          **AND** you run the EndOfDay settlement for the operating day
          **AND** you re-open the card's Journey History
          **THEN** Journey History shows the journey with the corrected stop charged its fare
          **AND** it is not marked as cancelled
        expected: A non-cancelled journey corrects normally to its new fare and is not marked cancelled.
      - title: A cancelled journey stays cancelled after a stop correction and further settlement
        refs: [TODEV-24061]
        objective: This test is to confirm that a stop edit does not flip a cancelled journey back to active across settlements.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a cancelled Metro tap whose alighting stop has already been corrected exists for today
          **WHEN** you run a further EndOfDay settlement for the operating day
          **AND** you open the card's Journey History
          **THEN** the journey is still marked as cancelled
          **AND** it remains visible in Journey History with the "**" indicator
        expected: The journey stays cancelled and visible after the correction and a further settlement.
      - title: Cancelling one journey does not affect other visible journeys
        refs: [TODEV-24061]
        objective: This test is to confirm that cancelling one journey leaves other journeys of the day unaffected.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** two Metro journeys exist on the same day (e.g. two 10b (IN) High School to Cherry Hill taps)
          **WHEN** you cancel one of the two journeys from Journey History
          **AND** you run the EndOfDay settlement for the operating day
          **AND** you open the card's Journey History
          **THEN** the cancelled journey is marked cancelled with the "**" indicator
          **AND** the other journey is shown as not cancelled
        expected: Only the cancelled journey is marked with the "**" indicator; the other is unaffected.
      - title: Cancelling a charged journey produces a refund and retains the record
        refs: [TODEV-24061]
        objective: This test is to confirm that cancelling a settled charged journey refunds it and keeps the record in Journey History.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a settled Metro journey charged £2.30 exists (e.g. 10b (IN) High School to Cherry Hill, ref.20)
          **WHEN** you cancel the journey from Journey History
          **AND** you run the EndOfDay settlement for the operating day
          **THEN** a refund of £2.30 for the journey is recorded on the account's transactions
          **AND** Journey History shows a single cancelled journey for it
        expected: The journey is refunded £2.30 on the account and retained as a single cancelled record.
      - title: Editing the stop on a cancelled tap after settlement keeps the record
        refs: [TODEV-24061]
        objective: This test is to confirm that correcting a cancelled tap after its refund keeps a single record and raises no further refund.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a settled Metro journey that was cancelled and refunded £2.30 exists
          **WHEN** you open its Update Stop list and correct the alighting stop and confirm
          **AND** you run the EndOfDay settlement for the operating day
          **AND** you open the card's Journey History
          **THEN** Journey History shows a single cancelled journey with the corrected stop
          **AND** no additional refund is made on the account
        expected: A single cancelled record remains after the correction; no extra refund is raised.
      - title: A cancelled transfer journey remains visible
        refs: [TODEV-24061]
        objective: This test is to confirm that a cancelled transfer leg charged £0.00 stays visible in Journey History.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a Metro transfer leg accepted as a free transfer (Metro Transfer Zone 512), charged £0.00 with a non-zero initial fare, has been cancelled
          **WHEN** you run the EndOfDay settlement for the operating day
          **AND** you open the card's Journey History
          **THEN** Journey History shows a single cancelled transfer journey
          **AND** it is marked cancelled with the "**" indicator
        expected: The cancelled transfer leg remains visible with the "**" indicator.
      # ───────────────── Update Stop dropdown population (TODEV-24397) ─────────────────
      - title: 'A settled TOO journey shows its onward stops, not "No options"'
        refs: [TODEV-24397]
        objective: This test is to confirm that the Update Stop dropdown is populated for a settled TOO journey.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a settled Ulsterbus TOO journey exists on route 72b (IN) boarding from Greys Farm (settled at EndOfDay)
          **WHEN** you open the card's Journey History
          **AND** you open the Update Stop list for that journey's alighting stage
          **THEN** the dropdown is populated with the 14 onward fare-bearing stops
          **AND** it does not show "No options"
          **AND** it excludes the zero-fare stop
        expected: The Update Stop dropdown lists the 14 onward fare-bearing stops for the Greys Farm boarding, not "No options".
      - title: A settled TOO journey from another stage shows its onward stops
        refs: [TODEV-24397]
        objective: This test is to confirm that the Update Stop dropdown is populated for a settled TOO journey from a different boarding stage.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a settled Ulsterbus TOO journey exists on route 72b (IN) boarding from Moygashel Busby Shop
          **WHEN** you open the card's Journey History
          **AND** you open the Update Stop list for that journey's alighting stage
          **THEN** the dropdown is populated with the 15 onward fare-bearing stops
          **AND** it does not show "No options"
          **AND** it excludes the zero-fare stop
        expected: The Update Stop dropdown lists the 15 onward fare-bearing stops for the Moygashel Busby Shop boarding, not "No options".
      - title: Both settled ref.60 taps from the same stage populate the dropdown
        refs: [TODEV-24397]
        objective: This test is to confirm that two settled ref.60 taps from the same boarding stage each populate the Update Stop dropdown.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** two settled TOO ref.60 taps exist on route 72b (IN) from the same boarding stage (e.g. Moygashel Busby Shop to Armagh Bus Centre, ref.60, £4.50)
          **WHEN** you open the card's Journey History
          **AND** you open the Update Stop list for each of the two taps
          **THEN** each dropdown is populated with the onward stops
          **AND** neither shows "No options"
        expected: Both taps' dropdowns are populated with the onward stops; neither shows "No options".
      - title: Re-opening the Update Stop modal always populates the dropdown
        refs: [TODEV-24397]
        objective: This test is to confirm that the Update Stop dropdown populates on every open, not intermittently.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a settled TOO journey exists on route 72b (IN) (e.g. Greys Farm boarding)
          **WHEN** you open the card's Journey History
          **AND** you open, close and re-open the journey's Update Stop modal several times
          **THEN** the dropdown shows the onward stops on every open
          **AND** it never shows "No options"
        expected: The dropdown populates on every open of the modal and never shows "No options".
      - title: '"No options" is correct when the boarding stage is the last stop'
        refs: [TODEV-24397]
        objective: This test is to confirm that an empty Update Stop list is correct only when there are no onward fare-bearing stops.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a settled TOO journey exists boarding from the last stop on the route (e.g. 72b (IN) boarding from Armagh Bus Centre, the final stop)
          **WHEN** you open the card's Journey History
          **AND** you open the Update Stop list for that journey's alighting stage
          **THEN** the dropdown shows "No options"
          **AND** this is correct because there are no onward stops with a fare
        expected: '"No options" is the correct, expected result from the last stop on the route.'
      - title: The correct operator returns stops; a mismatched operator returns none
        refs: [TODEV-24397]
        objective: This test is to confirm that the Update Stop list populates for the journey's correct operator and is empty only on operator mismatch.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a settled TOO journey exists on route 72b (IN) from Greys Farm, whose operator is Ulsterbus
          **WHEN** you open the Update Stop list using the journey's correct operator (Ulsterbus)
          **THEN** the dropdown is populated with the onward stops
          **AND** it does not show "No options"
          **WHEN** you open the Update Stop list using a mismatched operator id
          **THEN** no stops are returned (expected user error)
        expected: The correct operator returns the onward stops; a mismatched operator returns none as user error.

  # ───────────────────────── Update Stop List (TODEV-24300: fare > 0 filter) ─────────────────────────
  - path: [ABT, Update Stop List]
    cases:
      - title: Only stops with a fare greater than zero are shown
        refs: [TODEV-24300]
        objective: This test is to confirm that the Update Stop list shows only alighting stops with a positive fare.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a settled Ulsterbus TOO journey exists on route 273 boarding from Newbuildings Primary School
          **WHEN** you open the card's Journey History
          **AND** you open the Update Stop list for that journey's alighting stage
          **THEN** every stop shown has a fare greater than zero
          **AND** no stop with a blank, zero or negative fare is shown
        expected: Only positive-fare stops are listed; blank, zero or negative-fare stops are hidden.
      - title: Zero-fare transfer stops are not shown
        refs: [TODEV-24300]
        objective: This test is to confirm that zero-fare (transfer) stops are excluded from the Update Stop list.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a TOO journey exists on route 273 from a stage that has several zero-fare transfer stops onward
          **WHEN** you open the card's Journey History
          **AND** you open the Update Stop list for that journey's alighting stage
          **THEN** the zero-fare transfer stops are not shown in the list
        expected: Zero-fare transfer stops are excluded from the list.
      - title: Valid stops with a positive fare are still shown
        refs: [TODEV-24300]
        objective: This test is to confirm that valid positive-fare stops continue to appear in the Update Stop list.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a TOO journey exists on route 273 from a stage with positive-fare onward stops
          **WHEN** you open the card's Journey History
          **AND** you open the Update Stop list for that journey's alighting stage
          **THEN** the onward stops with a positive reference fare are shown
        expected: Positive-fare onward stops are shown in the list.
      - title: Selecting a valid positive-fare stop updates the journey
        refs: [TODEV-24300]
        objective: This test is to confirm that selecting a positive-fare stop updates the journey's alighting stage and recalculates the fare.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a TOO journey exists on route 273 with the Update Stop list open on its alighting stage
          **WHEN** you select a positive-fare stop from the list
          **AND** you confirm the change
          **THEN** the journey's alighting stage is updated to the selected stop
          **AND** the journey fare is recalculated for that stop
        expected: The journey's alighting stage updates and the fare recalculates for the selected stop.
      - title: A zero-fare stop is hidden but the smallest positive-fare stop is shown
        refs: [TODEV-24300]
        objective: This test is to confirm that the filter is fare greater than zero, hiding zero-fare stops while showing the smallest positive fare.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a TOO journey exists on route 273 whose onward stops include a zero-fare stop and a smallest positive-fare stop
          **WHEN** you open the card's Journey History
          **AND** you open the Update Stop list for that journey's alighting stage
          **THEN** the zero-fare stop is not shown
          **AND** the smallest positive-fare stop is shown
        expected: The zero-fare stop is hidden; the smallest positive-fare stop is shown.
      - title: A £0.00 capped journey stays visible and editable
        refs: [TODEV-24300]
        objective: This test is to confirm that a journey charged £0.00 by the daily cap remains visible and its Update Stop list still filters correctly.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a journey charged £0.00 because the daily cap was reached exists (e.g. a Metro tap after the £4.00 cap)
          **WHEN** you open the card's Journey History
          **AND** you open the Update Stop list for that journey's alighting stage
          **THEN** the journey is still shown in Journey History
          **AND** it is editable
          **AND** the Update Stop list still shows only stops with a fare greater than zero
        expected: The £0.00 capped journey stays visible and editable; the list still filters to positive fares.
      - title: A cancelled £0.00 journey stays visible and editable
        refs: [TODEV-24300]
        objective: This test is to confirm that a cancelled £0.00 journey remains visible and its Update Stop list still filters correctly.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a cancelled journey charged £0.00 exists
          **WHEN** you open the card's Journey History
          **AND** you open the Update Stop list for that journey's alighting stage
          **THEN** the journey is still shown with the cancelled indicator
          **AND** it is editable
          **AND** the Update Stop list still shows only stops with a fare greater than zero
        expected: The cancelled £0.00 journey stays visible and editable; the list still filters to positive fares.
      - title: A transfer journey charged £0.00 stays displayed
        refs: [TODEV-24300]
        objective: This test is to confirm that a transfer journey charged £0.00 remains displayed and editable in Journey History.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a journey accepted as a transfer and charged £0.00 exists
          **WHEN** you open the card's Journey History
          **AND** you open the Update Stop list for that journey's alighting stage
          **THEN** the journey is still shown with the transfer icon
          **AND** it is editable
          **AND** the Update Stop list still shows only stops with a fare greater than zero
        expected: The £0.00 transfer journey stays displayed with the transfer icon; the list filters to positive fares.
      - title: A stop with a negative fare is not shown
        refs: [TODEV-24300]
        objective: This test is to confirm that the filter uses fare greater than zero, excluding negative-fare anomalies.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a TOO journey exists on route 273 whose onward stops include one carrying a negative fare (data anomaly)
          **WHEN** you open the card's Journey History
          **AND** you open the Update Stop list for that journey's alighting stage
          **THEN** no stop with a negative fare is shown
        expected: Negative-fare stops are excluded from the list.
      - title: Transfer stops with a positive fare still appear
        refs: [TODEV-24300]
        objective: This test is to confirm that the filter excludes only non-positive fares, so positive-fare transfer stops still appear.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a TOO journey exists on route 273 whose onward stops include transfer stops carrying a positive fare
          **WHEN** you open the card's Journey History
          **AND** you open the Update Stop list for that journey's alighting stage
          **THEN** the positive-fare transfer stops still appear in the list
        expected: Positive-fare transfer stops still appear; only non-positive fares are filtered.
      - title: TVM-only stops with a positive fare still appear
        refs: [TODEV-24300]
        objective: This test is to confirm that TVM-only stops with a positive fare still appear, as excluding them is out of scope for this fix.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a TOO journey exists on route 273 whose onward stops include TVM-only stops carrying a positive fare
          **WHEN** you open the card's Journey History
          **AND** you open the Update Stop list for that journey's alighting stage
          **THEN** the positive-fare TVM-only stops still appear in the list
          **AND** their exclusion is a known limitation tracked separately
        expected: Positive-fare TVM-only stops still appear; excluding them is a tracked known limitation.

  # ───────────────────────── Processing Taps > Card Verification ─────────────────────────
  - path: [ABT, Processing Taps, Card Verification]
    cases:
      - title: Declined payments are guaranteed up to the Issuer Liability Threshold
        objective: This test is to confirm that a declined payment not recovered from the customer is guaranteed by the issuer up to the liability threshold, across card schemes.
        steps: |-
          **GIVEN** a seeded ABT test cEMV card is available for a supported scheme (Visa, MasterCard or Maestro)
          **AND** you can verify the outcome in CloudFare env5
          **AND** a transaction has been made with the card that failed authentication for payment
          **WHEN** the declined payment is not recovered from the customer
          **THEN** in CloudFare the card issuer guarantees the payment up to the Issuer Liability Threshold
        expected: Unrecovered declined payments are guaranteed by the issuer up to the liability threshold, for Visa, MasterCard and Maestro.
      - title: First use of a Visa card triggers an Account Verification Request
        match: Account Verification Request on first use of a Visa card
        objective: This test is to confirm that an Account Verification Request is performed on the first use of a Visa card in the network.
        steps: |-
          **GIVEN** a seeded ABT test cEMV Visa card that has not yet transacted in this network
          **AND** an in-service ETM signed on to a route
          **AND** you can verify the outcome in CloudFare env5
          **WHEN** you tap the Visa card to make a transaction on the ETM
          **THEN** in CloudFare an Account Verification Request is performed for the card
          **AND** the card is confirmed for use
        expected: An Account Verification Request is performed on first Visa use and confirms the card.
      - title: First daily use of a MasterCard or Maestro triggers a Pre-Authorisation check
        match: Pre-Authorisation check on first use each day
        objective: This test is to confirm that a Pre-Authorisation check is performed on the first daily use of a MasterCard or Maestro card.
        steps: |-
          **GIVEN** a seeded ABT test cEMV MasterCard or Maestro card that has not yet transacted today
          **AND** an in-service ETM signed on to a route
          **AND** you can verify the outcome in CloudFare env5
          **WHEN** you tap the card to make the first transaction of the day on the ETM
          **THEN** in CloudFare a Pre-Authorisation check is performed
        expected: A Pre-Authorisation check is performed on the first daily use of a MasterCard or Maestro card.
      - title: First use after Deny List removal triggers a Pre-Authorisation check
        match: Pre-Authorisation check on first use after removal from the Deny List
        objective: This test is to confirm that a Pre-Authorisation check is performed on first use after a MasterCard or Maestro card is removed from the Deny List.
        steps: |-
          **GIVEN** a seeded ABT test cEMV MasterCard or Maestro card that has been removed from the Deny List
          **AND** an in-service ETM signed on to a route
          **AND** you can verify the outcome in CloudFare env5
          **WHEN** you next tap the card to make a transaction on the ETM
          **THEN** in CloudFare a Pre-Authorisation check is performed
        expected: A Pre-Authorisation check is performed on first use after Deny List removal.

  # ───────────────────────── Processing Taps > Late Taps ─────────────────────────
  - path: [ABT, Processing Taps, Late Taps]
    cases:
      - title: Late taps within the maximum late data period are processed
        objective: This test is to confirm that the ABT system processes taps received within the configured maximum late data period.
        steps: |-
          **GIVEN** the maximum late data period is configured to 14 days
          **AND** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a tap was made on an in-service ETM but held/quarantined by a comms failure
          **WHEN** the ABT system receives the held tap within 14 days of the tap date (e.g. it arrives on day 10)
          **AND** the next settlement runs
          **THEN** in the card's Journey History the tap is processed for its travel date
          **AND** the tap is shown as a settled journey
        expected: Taps received within the 14-day late data period are processed and appear as settled journeys.
      - title: Late taps beyond the maximum late data period are rejected
        objective: This test is to confirm that the ABT system rejects taps received beyond the configured maximum late data period.
        steps: |-
          **GIVEN** the maximum late data period is configured to 14 days
          **AND** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a tap was made on an in-service ETM but held beyond the window
          **WHEN** the ABT system receives the tap more than 14 days after the tap date
          **THEN** in CloudFare the tap is rejected as expired
          **AND** no journey or charge is created for it in Journey History
        expected: Taps received beyond the 14-day late data period are rejected as expired and never charged.
      - title: Capping rules are applied retrospectively to late taps
        objective: This test is to confirm that active capping rules are applied retrospectively to late taps received within the late data period.
        steps: |-
          **GIVEN** the maximum late data period is configured to 14 days
          **AND** active capping rules are configured (e.g. Metro £4.00 / ref.60 £7.20)
          **AND** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** the target day already has live taps of that cap group
          **WHEN** a late tap for that day is received within the period that should trigger the cap
          **AND** the settlement reconciliation runs
          **THEN** in the day's Journey History the capping rules are applied retrospectively so the day's charge total is corrected to the cap
        expected: Capping rules are applied retrospectively to late taps within the period and the day total is corrected to the cap.
      - title: Duplicate late taps are disregarded
        objective: This test is to confirm that the ABT system disregards a duplicate of a tap that has already been processed.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a tap has already been processed by the ABT system for the card
          **WHEN** the ABT system receives a duplicate of that tap
          **THEN** in CloudFare the duplicate tap is disregarded
          **AND** no second journey or charge appears in Journey History
        expected: A duplicate of an already-processed tap is disregarded and creates no second journey or charge.
      - title: Taps held on a blocked ETM are processed and capped when the device is unblocked
        refs: [UB-TOO]
        objective: This test is to confirm that taps held on a blocked ETM are processed and capped once the device is unblocked and uploads them.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** taps were made on an ETM that is blocked from the back office and are held on the device
          **AND** example journeys: two 72b (IN) Moygashel Busby Shop to Armagh Bus Centre taps (£4.50, ref.60) held while the ETM is blocked
          **WHEN** the ETM is unblocked and the held taps are uploaded
          **AND** the EndOfDay settlement runs
          **THEN** in Journey History the held taps are processed
          **AND** the applicable daily cap is applied to them (ref.60 cap £7.20)
        expected: Held taps from a blocked ETM are processed on unblock and capped correctly (ref.60 £7.20).
      - title: An intraday late tap is capped together with the day's live taps
        refs: [UB-TOO]
        objective: This test is to confirm that a late tap arriving the same day is combined with the live taps and capped as one day.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** the day has live taps plus further taps held for late arrival
          **AND** example journeys: one live 72b (IN) Moygashel Busby Shop to Armagh Bus Centre tap plus a held tap on the same route and day
          **WHEN** the held taps arrive later the same day before settlement
          **AND** the EndOfDay settlement runs
          **THEN** in Journey History the late taps are combined with the day's live taps
          **AND** the daily cap is applied across all of them
        expected: An intraday late tap is capped together with the day's live taps.
      - title: A late tap arriving after settlement is reconciled into the correct day
        refs: [UB-TOO]
        objective: This test is to confirm that a late tap arriving after a day has settled is reconciled into that day and its cap total corrected.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** a day that has already run EndOfDay settlement
          **AND** example: a 72b (IN) Greys Farm to Armagh Bus Centre tap for that day arriving after settlement
          **WHEN** the late tap arrives after settlement
          **AND** the next settlement reconciliation runs
          **THEN** in Journey History the late tap is reconciled against the correct travel day
          **AND** that day's cap total is corrected to include it
        expected: A cross-settlement late tap is reconciled into the correct day and the cap total corrected.
      - title: A late annulment leaves the annulled tap free and the rest capped
        match: A late tap accompanied by an annulment settles correctly
        refs: [UB-TOO]
        objective: This test is to confirm that held late taps that include an annulment settle with the annulled tap free and the rest capped.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card and its account exist in CloudFare env5
          **AND** you are signed into the ABT Operator Web Portal (env5) on that card's account
          **AND** held late taps that include an annulled tap
          **AND** example journeys: two 72b (IN) Moygashel Busby Shop to Armagh Bus Centre taps held, one of which is annulled
          **WHEN** the held taps and the annulment are uploaded
          **AND** the EndOfDay settlement runs
          **THEN** the annulled tap is charged £0.00
          **AND** the annulled tap is shown cancelled in Journey History
          **AND** the remaining late taps are capped correctly
        expected: With a late annulment, the annulled tap is £0.00 and the remaining late taps cap correctly.
