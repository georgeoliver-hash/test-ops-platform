# Smartrack (BOS smartcard data system).
# Consolidated from old suite 14441 (~40 cases): card-search variants folded; report
# duplicates folded to one case per distinct report; transaction Adult/Child as variation.
# devtype [152]. Single-predicate THENs.
suite_id: 30279
defaults:
  template_id: 1
  custom_devtypes: [152]
  custom_autoconfirmation: false
  custom_revstatus: 2
sections:
  - path: [Smartrack, Functional, Access]
    cases:
      - title: Smartrack access rights for administrator and user
        objective: This test is to confirm that Smartrack grants the correct access to administrator and standard users.
        steps: |-
          **GIVEN** administrator and standard user accounts are configured for Smartrack
          **WHEN** each user signs into Smartrack
          **THEN** the administrator sees the administrative functions
          **AND** the standard user sees only the permitted functions
        expected: Administrator and standard users each see the functions permitted by their access.

  - path: [Smartrack, Functional, Card Data]
    cases:
      - title: View and search card data
        objective: This test is to confirm that a user can view single and multiple cards and search by customer name and address, ESN and PSN, and card type.
        steps: |-
          **GIVEN** a user is signed into Smartrack on the Display Card Data page
          **WHEN** the user searches by customer name and address, ESN and PSN, or card type
          **THEN** the matching single or multiple cards are displayed
        expected: Card data is displayed for searches by customer, ESN/PSN and card type.
      - title: Add notes and attached files to a card
        objective: This test is to confirm that a user can add and view notes and attached files against a card.
        steps: |-
          **GIVEN** a user has selected a card in Smartrack
          **WHEN** the user adds notes and attaches files
          **THEN** the notes and attached files are saved against the card
          **AND** they can be viewed
        expected: Notes and attached files are saved against the card and can be viewed.
      - title: View card transactions
        objective: This test is to confirm that a user can view card transactions for Ulsterbus Multi-Journey and Town Service products, for adult and child.
        steps: |-
          **GIVEN** a user has selected a card in Smartrack
          **WHEN** the user views the card transactions for an adult or child Ulsterbus Multi-Journey or Town Service product
          **THEN** the card transactions are displayed for the selected product and passenger type
        expected: Card transactions are displayed for adult and child Multi-Journey and Town Service products.

  - path: [Smartrack, Functional, Import & Export]
    cases:
      - title: Import a card issue and pass-create record file
        objective: This test is to confirm that a user can import a CSV issue and pass-create record file into Smartrack.
        steps: |-
          **GIVEN** a user is signed into Smartrack
          **WHEN** the user imports a CSV issue and pass-create record file
          **THEN** the records are imported into Smartrack
        expected: A CSV issue and pass-create record file is imported into Smartrack.
      - title: Export the ESN list
        objective: This test is to confirm that a user can export the ESN list from Smartrack.
        steps: |-
          **GIVEN** a user is signed into Smartrack
          **WHEN** the user exports the ESN list
          **THEN** the ESN list is exported
        expected: The ESN list is exported from Smartrack.

  - path: [Smartrack, Functional, Reports]
    cases:
      - title: Run the Action List reports
        objective: This test is to confirm that the Active and Inactive Action List reports, including the daily action list content, generate and export.
        steps: |-
          **GIVEN** a user is on the Smartrack Reports page
          **WHEN** the user runs the Active Action List, Inactive Action List or daily action list content report
          **THEN** the selected Action List report is generated
          **AND** the report can be exported
        expected: The Active and Inactive Action List reports generate and export.
      - title: Run the Liability and Scheme Liability reports
        objective: This test is to confirm that the Liability report (summary and detailed) and Scheme Liability report generate and export.
        steps: |-
          **GIVEN** a user is on the Smartrack Reports page
          **WHEN** the user runs the Liability report in summary or detailed form, or the Scheme Liability report
          **THEN** the selected report is generated
          **AND** the report can be exported
        expected: The Liability and Scheme Liability reports generate and export.
      - title: Run the Default Payment report
        objective: This test is to confirm that the Default Payment report generates and exports.
        steps: |-
          **GIVEN** a user is on the Smartrack Reports page
          **WHEN** the user runs the Default Payment report
          **THEN** the report is generated
          **AND** the report can be exported
        expected: The Default Payment report generates and exports.
      - title: Run the Delivery report
        objective: This test is to confirm that the Delivery report (summary and detailed) generates and exports.
        steps: |-
          **GIVEN** a user is on the Smartrack Reports page
          **WHEN** the user runs the Delivery report in summary or detailed form
          **THEN** the report is generated
          **AND** the report can be exported
        expected: The Delivery report generates and exports in summary and detailed form.
      - title: Run the Refund report
        objective: This test is to confirm that the Refund report generates and exports.
        steps: |-
          **GIVEN** a user is on the Smartrack Reports page
          **WHEN** the user runs the Refund report
          **THEN** the report is generated
          **AND** the report can be exported
        expected: The Refund report generates and exports.
      - title: Run the Decommission Card report
        objective: This test is to confirm that the Decommission Card report generates and exports.
        steps: |-
          **GIVEN** a user is on the Smartrack Reports page
          **WHEN** the user runs the Decommission Card report
          **THEN** the report is generated
          **AND** the report can be exported
        expected: The Decommission Card report generates and exports.
      - title: Run the POS Revenue Analysis report
        objective: This test is to confirm that the POS Revenue Analysis report generates and exports.
        steps: |-
          **GIVEN** a user is on the Smartrack Reports page
          **WHEN** the user runs the POS Revenue Analysis report
          **THEN** the report is generated
          **AND** the report can be exported
        expected: The POS Revenue Analysis report generates and exports.
