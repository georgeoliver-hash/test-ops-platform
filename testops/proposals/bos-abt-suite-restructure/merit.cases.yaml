# Merit + Merit Web Reporter (BOS reporting engine).
# Consolidated from old suite 14441 (~255 cases): Summary/Detailed/with-without-Grouping
# and Direction-of-Travel presentation variants folded to one case per distinct report;
# Merit Web Reporter (a viewer of the same reports) folded to viewer cases; Staff
# Synchronisation import variants folded. devtype [151]. Single-predicate THENs.
suite_id: 30279
defaults:
  template_id: 1
  custom_devtypes: [151]
  custom_autoconfirmation: false
  custom_revstatus: 2
sections:
  - path: [Merit, Functional, Administration]
    cases:
      - title: Date Editor — period, roll-over time and start of week
        objective: This test is to confirm that an administrator can edit the period, roll-over time and start of week in the Date Editor.
        steps: |-
          **GIVEN** an administrator is in the Merit Date Editor
          **WHEN** the administrator edits the period, roll-over time and start of week
          **THEN** the date settings are saved
        expected: The period, roll-over time and start of week are saved in the Date Editor.
      - title: Timeband Editor
        objective: This test is to confirm that an administrator can configure timebands in the Timeband Editor.
        steps: |-
          **GIVEN** an administrator is in the Merit Timeband Editor
          **WHEN** the administrator configures a timeband
          **THEN** the timeband is saved
        expected: A timeband is configured and saved.
      - title: Staff Editor
        objective: This test is to confirm that an administrator can edit staff and operator details in the Staff Editor.
        steps: |-
          **GIVEN** an administrator is in the Merit Staff Editor
          **WHEN** the administrator edits a staff member's details and operator details
          **THEN** the staff details are saved
        expected: Staff and operator details are saved in the Staff Editor.
      - title: Class Type and Class Group Editors
        objective: This test is to confirm that an administrator can edit class types and class groups, including a product class assigned to more than one class group.
        steps: |-
          **GIVEN** an administrator is in the Merit Class Type and Class Group Editors
          **WHEN** the administrator edits class types and class groups, assigning a product class to more than one group
          **THEN** the class type and class group settings are saved
        expected: Class types and class groups are saved, including multi-group product classes.
      - title: Location, Location Group and Location Restrictions Editors
        objective: This test is to confirm that an administrator can edit locations, location groups and location restrictions.
        steps: |-
          **GIVEN** an administrator is in the Merit Location editors
          **WHEN** the administrator edits a location, a location group and location restrictions
          **THEN** the location settings are saved
        expected: Locations, location groups and location restrictions are saved.
      - title: Route Group Editor
        objective: This test is to confirm that an administrator can edit route groups, including a route assigned to more than one route group.
        steps: |-
          **GIVEN** an administrator is in the Merit Route Group Editor
          **WHEN** the administrator edits a route group, assigning a route to more than one group
          **THEN** the route group settings are saved
        expected: Route groups are saved, including multi-group routes.
      - title: Route Revenue Editor
        objective: This test is to confirm that an administrator can configure route revenue allocation (pass revenue, generation factor, rail and BRT mileage and journey allocation).
        steps: |-
          **GIVEN** an administrator is in the Merit Route Revenue Editor
          **WHEN** the administrator configures pass revenue, generation factor, and rail and BRT mileage and journey allocation
          **THEN** the route revenue settings are saved
        expected: Route revenue allocation settings are saved.

