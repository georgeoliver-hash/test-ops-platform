  - path: [Merit, Functional, Stored Procedures]
    cases:
      - title: Ulsterbus revenue stored procedures
        objective: This test is to confirm that the Ulsterbus bus revenue stored procedures return correct revenue by payment type and operational payment type.
        steps: |-
          **GIVEN** Merit has processed Ulsterbus audit data
          **WHEN** the Ulsterbus bus revenue stored procedures are run, including by payment type and operational payment type
          **THEN** the stored procedures return the correct Ulsterbus revenue
        expected: The Ulsterbus revenue stored procedures return correct revenue by payment type.
      - title: Metro revenue stored procedures
        objective: This test is to confirm that the Metro bus revenue stored procedures return correct revenue by payment type and operational payment type.
        steps: |-
          **GIVEN** Merit has processed Metro audit data
          **WHEN** the Metro bus revenue stored procedures are run, including by payment type and operational payment type
          **THEN** the stored procedures return the correct Metro revenue
        expected: The Metro revenue stored procedures return correct revenue by payment type.
      - title: NIR rail revenue stored procedures
        objective: This test is to confirm that the NIR rail revenue stored procedures return correct revenue by payment type and operational payment type.
        steps: |-
          **GIVEN** Merit has processed NIR rail audit data
          **WHEN** the NIR rail revenue stored procedures are run, including by payment type and operational payment type
          **THEN** the stored procedures return the correct NIR rail revenue
        expected: The NIR rail revenue stored procedures return correct revenue by payment type.

  - path: [Merit, Functional, Synchronisation & Tools]
    cases:
      - title: Synchronise staff into Merit
        objective: This test is to confirm that staff changes synchronise into Merit (add, modify, disable, modify ID, home and working location), including via Import Staff.
        steps: |-
          **GIVEN** staff records exist in CloudFare
          **WHEN** staff are added, modified, disabled, have their ID or locations changed, or are imported via Import Staff
          **THEN** the corresponding staff changes are synchronised into Merit
        expected: Staff add, modify, disable, ID and location changes synchronise into Merit, including via import.
      - title: Browse audit data with Client Tools
        objective: This test is to confirm that a user can browse audit data using the Merit Client Tools.
        steps: |-
          **GIVEN** a user has the Merit Client Tools available
          **WHEN** the user browses the audit data
          **THEN** the audit data is displayed
        expected: Audit data can be browsed with the Client Tools.

  - path: [Merit Web Reporter, Functional, Report Viewer]
    cases:
      - title: View the available reports in the Merit Web Reporter
        objective: This test is to confirm that the Merit Web Reporter lists the available reports.
        steps: |-
          **GIVEN** a user is signed into the Merit Web Reporter
          **WHEN** the user views the available reports
          **THEN** the list of available reports is displayed
        expected: The Merit Web Reporter lists the available reports.
      - title: View and export a report in the Merit Web Reporter
        objective: This test is to confirm that a user can view and export a report in the Merit Web Reporter (audit, sales, breakdown, reconciliation, duty, driver and inspector reports).
        steps: |-
          **GIVEN** a user is signed into the Merit Web Reporter
          **WHEN** the user opens and exports a report (Daily Audit, Daily Audit by Module, Daily Audit by Trip, Daily Summary, Class Audit, Route Audit, Annulled Tickets, Sales Analysis by Class, Sales Breakdown by Class, Route/Class or Driver, Operator Activity, Inspector's, Duty Comparison, Driver Shift, Pay-In Reconciliation, Class Breakdown or Route Breakdown)
          **THEN** the selected report is displayed
          **AND** the report can be exported
        expected: Reports can be viewed and exported in the Merit Web Reporter.
