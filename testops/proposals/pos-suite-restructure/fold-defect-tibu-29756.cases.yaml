# Fold-defect: TIBU-29756 (Cloudfare > Remote Reboot > POS). QA PASSED on build 1.0.602.20592,
# merged, status Ready for Release. No existing case covers a back-office-initiated reboot: the
# only reboot coverage found (C4099956 "Technician - Soft Reboot", C4100072/73 screen validation)
# is the LOCAL technician-menu reboot flow, a different trigger/actor. Per docs/test-practices.md
# rubric step 4 ("never one case per bug as a reflex"): scenario genuinely not exercised -> one
# new case, not a fold into an unrelated case.
suite_id: 30253
defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [5]
  custom_autoconfirmation: false

sections:
  - path: ["Non-Functional", "Comms (CloudFare)"]
    cases:
      - title: "Comms — a CloudFare Remote Reboot command reboots the POS"
        objective: "This test is to confirm a Remote Reboot command sent to a POS from CloudFare Asset Manager causes the device to reboot, regressing TIBU-29756 (device previously had no reaction to the command)."
        steps: |
          **GIVEN** a POS device is online and visible in CloudFare Asset Manager
          **WHEN** an operator sends a Remote Reboot command to the device from Asset Manager
          **THEN** the POS performs a soft reboot
        expected: "The POS reboots in response to a CloudFare-issued Remote Reboot command."
        refs: "TIBU-29756"
