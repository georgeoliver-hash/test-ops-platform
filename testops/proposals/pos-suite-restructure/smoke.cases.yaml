# Smoke — the thin critical path, run for every mode (under Configurations). Quick build-confidence
# check; the detailed coverage lives in the Functional areas.
suite: GG - POS - Claude Suite
suite_id: 30253

defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [5]
  custom_autoconfirmation: false

sections:
  - path: ["Smoke"]
    cases:
      - title: "Smoke — operator sign on"
        objective: "This test is to confirm an operator can sign on to a freshly built device."
        steps: |
          **GIVEN** the device is at the Idle screen and communicating with CloudFare
          **WHEN** the operator signs on with valid credentials
          **THEN** the operator reaches the Main Screen
        expected: "The operator signs on and reaches the Main Screen."
      - title: "Smoke — sell a ticket (cash)"
        objective: "This test is to confirm an operator can build a fare, take cash payment and issue the ticket."
        steps: |
          **GIVEN** an operator is signed on
          **WHEN** the operator builds a fare, adds it to the basket and takes cash payment
          **THEN** the ticket is issued
          **AND** a receipt is printed
        expected: "A fare is sold by cash and a ticket plus receipt are produced."
      - title: "Smoke — top up a smartcard"
        objective: "This test is to confirm an operator can top up a smartcard and complete payment."
        steps: |
          **GIVEN** an operator is signed on
          **WHEN** the operator presents a smartcard, tops it up and takes payment
          **THEN** the top up is applied to the card
          **AND** a receipt is printed
        expected: "A smartcard is topped up and a receipt is printed."
      - title: "Smoke — sign off"
        objective: "This test is to confirm an operator can sign off back to the Idle screen."
        steps: |
          **GIVEN** an operator is signed on
          **WHEN** the operator signs off
          **THEN** the device returns to the Idle screen
        expected: "The operator signs off and the device returns to Idle."
