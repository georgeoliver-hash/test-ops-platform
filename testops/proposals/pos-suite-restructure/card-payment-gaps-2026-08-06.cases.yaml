suite_id: 30253
defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [5]
  custom_autoconfirmation: false

sections:
  - path: [Functional, Basket & Payment, Card Payment]
    cases:
      - title: "Card Payment — over £45 prompts card insert for PIN entry"
        refs: MODE-ALL
        objective: |
          This test is to confirm that when a card payment is over £45, the customer is prompted
          to insert their card and complete PIN entry via Present Card PIN.
        steps: |
          **GIVEN** a card payment is over £45 at the Present screen
          **WHEN** the payment device asks the customer to insert their card
          **THEN** Present Card PIN is displayed
          **AND** User Confirming Amount is displayed for the customer to confirm the amount and enter their PIN
        expected: "An over-£45 card payment routes through Present Card PIN into User Confirming Amount for PIN entry."

      - title: "Card Payment — no Chip & PIN card falls back to User Confirming Amount"
        refs: MODE-ALL
        objective: |
          This test is to confirm that when no Chip & PIN card is available, the payment falls
          back to User Confirming Amount rather than failing outright.
        steps: |
          **GIVEN** a card payment is at the Chip & PIN card available decision
          **WHEN** no Chip & PIN card is available
          **THEN** User Confirming Amount is displayed
          **AND** **GAP** — exact fallback confirmation mechanism (e.g. contactless vs PIN entry) at this screen is not resolved in the flow-map (unlabeled decision node); confirm on the live system before running
        expected: "With no Chip & PIN card available, the payment falls back to User Confirming Amount; the exact confirmation mechanism is a confirmed gap pending live-system check."

      - title: "Card Payment — Cancel on the Miura M020 during Present declines the transaction"
        refs: MODE-ALL
        objective: |
          This test is to confirm pressing Cancel on the Miura M020 card reader during Present
          declines the transaction and returns the POS to Main Screen.
        steps: |
          **GIVEN** a card payment is at the Present screen
          **WHEN** the customer presses Cancel on the Miura M020
          **THEN** Transaction Declined 2 is displayed
          **AND** the POS returns to Main Screen
        expected: "Cancelling on the Miura M020 during Present shows Transaction Declined 2 and returns to Main Screen."

      - title: "Card Payment — matching signature completes approval and prints the ticket"
        refs: MODE-ALL
        objective: |
          This test is to confirm that a matching customer signature on an approved card payment
          completes the approval and prints the ticket immediately.
        steps: |
          **GIVEN** a card payment shows Transaction Approved with Customer Signature required
          **WHEN** the customer's signature matches the payment card
          **THEN** Approved-Confirmation is displayed
          **AND** the ticket is printed immediately
        expected: "A matching signature on Transaction Approved moves to Approved-Confirmation and prints the ticket immediately."

      - title: "Card Payment — printing a declined receipt returns to the FLU screen"
        refs: MODE-ALL
        objective: |
          This test is to confirm that printing a receipt from a Declined card payment screen
          returns the POS to the FLU screen.
        steps: |
          **GIVEN** a card payment is at Transaction Declined or Transaction Declined 2
          **WHEN** the operator selects Print receipt
          **THEN** the payment/declined receipt is printed
          **AND** the POS reverts to the FLU screen (2.7.3 Bus FLU or 3.2 Rail FLU)
        expected: "Printing a receipt from either Declined screen returns the POS to the Bus or Rail FLU screen."

      - title: "Card Payment — declining without a receipt still returns to the FLU screen"
        refs: MODE-ALL
        objective: |
          This test is to confirm that choosing Back to Main / No receipt from a Declined card
          payment screen returns the POS to the FLU screen without printing.
        steps: |
          **GIVEN** a card payment is at Transaction Declined or Transaction Declined 2
          **WHEN** the operator selects Back to Main / No receipt
          **THEN** no receipt is printed
          **AND** the POS reverts to the FLU screen (2.7.3 Bus FLU or 3.2 Rail FLU)
        expected: "Choosing Back to Main / No receipt from either Declined screen returns the POS to the Bus or Rail FLU screen without printing."
