        steps: |-
          **GIVEN** the POS has reached the 'Idle Screen'
          **AND** the approved design is the Overflow reference and screen image named in the objective
          **AND** example: Operator → viewing the 'Idle Screen'
          **WHEN** the operator views the screen
          **THEN** the screen matches the approved design (layout, wording, labels and controls)
          **AND** there are no visual or text defects
