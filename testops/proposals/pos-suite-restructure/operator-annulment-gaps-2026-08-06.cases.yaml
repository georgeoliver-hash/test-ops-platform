suite_id: 30253
defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [5]
  custom_autoconfirmation: false

sections:
  - path: [Functional, Basket & Payment, Annulment]
    cases:
      - title: "Annulment — paging through Rail tickets with up and down keys"
        refs: MODE-ALL
        objective: |
          This test is to confirm the operator can page through multiple annulment-candidate Rail tickets on the Annul Previous Ticket Rail screen using the up and down keys.
        steps: |
          **GIVEN** the operator is at the Annul Previous Ticket Rail screen with multiple tickets available
          **WHEN** the operator presses the down key
          **THEN** the next ticket is displayed
          **WHEN** the operator presses the up key
          **THEN** the previous ticket is displayed
        expected: "The up and down keys page between tickets on the Annul Previous Ticket Rail screen."
