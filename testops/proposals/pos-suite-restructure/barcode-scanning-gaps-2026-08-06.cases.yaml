suite_id: 30253
defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [5]
  custom_autoconfirmation: false

sections:
  - path: [Functional, Barcode Scanning]
    cases:
      - title: "Barcode Scanning — data not retrieved after scan"
        refs: MODE-ALL
        objective: |
          This test is to confirm the outcome when scanned barcode data is not successfully retrieved.
        steps: |
          **GIVEN** a barcode is scanned at the FLU screen
          **WHEN** the barcode data is not successfully retrieved
          **THEN** **GAP** — the resulting screen/outcome is not confirmed in the source transcription (unresolved connection target); confirm on the live system before running
        expected: "GAP — the failed-retrieval outcome is not confirmed in the source; confirm on the live system before running."

      - title: "Barcode Scanning — decrypt/parse failure retries Validating Details"
        refs: MODE-ALL
        objective: |
          This test is to confirm a barcode that fails decryption/parsing shows Barcode Validation Failed and can retry back into the Validating Details check.
        steps: |
          **GIVEN** a scanned barcode is at Barcode - Validating Details
          **WHEN** decryption and parsing of the barcode fails
          **THEN** Barcode Validation Failed is shown
          **AND** retrying returns to Barcode - Validating Details
        expected: "A decrypt/parse failure shows Barcode Validation Failed, and retrying re-enters the Validating Details check."

      - title: "Barcode Scanning — decrypt/parse failure returns to FLU"
        refs: MODE-ALL
        objective: |
          This test is to confirm a decrypt/parse Barcode Validation Failed can be exited back to the FLU screen.
        steps: |
          **GIVEN** Barcode Validation Failed is shown for a decrypt/parse failure
          **WHEN** the operator exits back to the FLU screen
          **THEN** the FLU screen is shown
        expected: "Exiting a decrypt/parse Validation Failed returns to the FLU screen."

      - title: "Barcode Scanning — invalid ticket cancellation retries Validating Details"
        refs: MODE-ALL
        objective: |
          This test is to confirm Transaction Cancelled - Ticket Not Valid, shown when Valid Barcode? is No, can retry back into the Validating Details check.
        steps: |
          **GIVEN** Barcode Scan - Transaction Cancelled - Ticket Not Valid is shown after Valid Barcode? = No
          **WHEN** the operator retries
          **THEN** Barcode - Validating Details is shown again
        expected: "An invalid-ticket cancellation can be retried back into the Validating Details check."

      - title: "Barcode Scanning — invalid ticket cancellation returns to FLU"
        refs: MODE-ALL
        objective: |
          This test is to confirm Transaction Cancelled - Ticket Not Valid can be exited back to the FLU screen.
        steps: |
          **GIVEN** Barcode Scan - Transaction Cancelled - Ticket Not Valid is shown
          **WHEN** the operator exits back to the FLU screen
          **THEN** the FLU screen is shown
        expected: "Exiting Transaction Cancelled - Ticket Not Valid returns to the FLU screen."

      - title: "Barcode Scanning — additional background check failure cancels ticket"
        refs: MODE-ALL
        objective: |
          This test is to confirm a barcode ticket that fails the additional background checks shows Transaction Cancelled - Ticket Not Valid.
        steps: |
          **GIVEN** Valid Barcode? has passed for a scanned ticket
          **WHEN** the additional background checks fail
          **THEN** Barcode Scan - Transaction Cancelled - Ticket Not Valid is shown
        expected: "A background-check failure on an otherwise-valid barcode still cancels the ticket as Not Valid."

      - title: "Barcode Scanning — failed visual inspection cancels valid ticket"
        refs: MODE-ALL
        objective: |
          This test is to confirm a failed operator visual inspection of a valid barcode ticket cancels the transaction and returns to FLU.
        steps: |
          **GIVEN** Barcode Scan - Ticket Valid inc. Date and Depart Time is shown
          **WHEN** the operator's visual inspection of the ticket fails
          **THEN** Barcode Scan - Transaction Cancelled - Ticket Not Passed Visual Inspection is shown
          **AND** the FLU screen is shown
        expected: "A failed visual inspection on a valid ticket cancels the transaction and returns straight to FLU."

      - title: "Barcode Scanning — print error retries on first press"
        refs: MODE-ALL
        objective: |
          This test is to confirm the first press on Barcode Ticket - Print Error retries the print job and is audited as a reprint.
        steps: |
          **GIVEN** Barcode Ticket - Print Error is shown after a failed print attempt
          **WHEN** the operator presses to retry (1st press on this barcode)
          **THEN** the print job retries and is audited as a reprint with Corethree/CloudFare
          **AND** the Print successful? check is shown again
        expected: "A first retry press on Print Error re-attempts the print and returns to the Print successful? check, audited as a reprint."

      - title: "Barcode Scanning — second print error press invalidates barcode"
        refs: MODE-ALL
        objective: |
          This test is to confirm a second press on Barcode Ticket - Print Error for the same barcode abandons the print, returns to FLU, and invalidates the barcode.
        steps: |
          **GIVEN** Barcode Ticket - Print Error is shown for the same barcode after a first retry press
          **WHEN** the operator presses again (2nd press on this barcode)
          **THEN** the FLU screen is shown
          **AND** the barcode is no longer valid
        expected: "A second Print Error press on the same barcode abandons printing, returns to FLU, and invalidates the barcode."

      - title: "Barcode Scanning — Printed? confirms still valid loops to print check"
        refs: MODE-ALL
        objective: |
          This test is to confirm selecting that a printed barcode is still valid at Barcode Ticket - Printed? loops back to the Print successful? check.
        steps: |
          **GIVEN** Barcode Ticket - Printed? is shown
          **WHEN** the operator confirms the barcode is still valid
          **THEN** the Print successful? check is shown again
        expected: "Confirming the barcode is still valid at Printed? re-enters the Print successful? check."

      - title: "Barcode Reference — unreadable barcode cancels to FLU"
        refs: MODE-ALL
        objective: |
          This test is to confirm cancelling manual entry of an unreadable barcode reference at the Barcode Reference screen returns to the FLU screen.
        steps: |
          **GIVEN** the Barcode Reference screen is open for an unreadable barcode
          **WHEN** the operator presses Cancel
          **THEN** the FLU screen is shown
        expected: "Cancelling an unreadable-barcode reference entry returns to the FLU screen."

      - title: "Barcode Scanning — validation failure routes to manual Barcode Reference entry"
        refs: MODE-ALL
        objective: |
          This test is to confirm a Barcode Validation Failed screen can route the operator to the Barcode Reference screen for manual retry entry.
        steps: |
          **GIVEN** Barcode Validation Failed is shown for a scanned barcode
          **WHEN** the operator selects manual retry
          **THEN** the Barcode Reference screen is shown
        expected: "A Validation Failed screen can hand off to manual Barcode Reference entry for a retry."

      - title: "Barcode Scanning — Outbound and Return ticket paginates and returns"
        refs: MODE-ALL
        objective: |
          This test is to confirm the Outbound and Return barcode ticket screen pages forward to Page 2 and back to Page 1.
        steps: |
          **GIVEN** Barcode Scan - Ticket Valid inc. Outbound and Return (Page 1) is shown
          **WHEN** the operator selects Next page
          **THEN** Page 2 is shown
          **AND** selecting Next page again returns to Page 1
        expected: "Next page pages the Outbound and Return ticket from Page 1 to Page 2 and back."
