# Sign On & Session — all Shared (identical across modes). Reformatted: short titles, split When/Then.
# `match` = the previous (long) title so push --update renames in place without duplicating.
# Section path kept as-is; move this section under "Functional" in the TestRail UI.
suite: GG - POS - Claude Suite
suite_id: 30253

defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [5]
  custom_autoconfirmation: false

sections:
  - path: ["Functional", "Sign On & Session", "Idle & Screen"]
    cases:
      - title: "Sign On — idle to Sign On screen"
        match: "Sign On — idle screen advances to the Sign On screen on key press"
        objective: "This test is to confirm the POS leaves the idle screen and presents the Sign On screen when a key is pressed."
        steps: |
          **GIVEN** the POS is at the idle screen showing "Present Card or Press Any Key to Continue"
          **WHEN** the operator presses any key
          **THEN** the Sign On screen is displayed
        expected: "The idle screen is dismissed and the Sign On screen is shown, ready for ID and PIN entry."
      - title: "Sign On — ID and PIN fields shown"
        match: "Sign On — screen shows the ID and PIN fields"
        refs: ["REQ-0050"]
        objective: "This test is to confirm the Sign On screen presents the ID field, the PIN field and the confirm prompt."
        steps: |
          **GIVEN** the POS is showing the Sign On screen
          **WHEN** the operator views the Sign On screen
          **THEN** an "ID" field is displayed
          **AND** a "PIN" field is displayed
          **AND** the "Press Enter to Confirm" prompt is displayed
        expected: "The Sign On screen shows the ID field, the PIN field and the 'Press Enter to Confirm' prompt."

  - path: ["Functional", "Sign On & Session", "Sign On"]
    cases:
      - title: "Sign On — Operator sign on"
        match: "Sign On — Operator signs on with valid credentials (manual) and reaches the Operator menu"
        refs: ["REQ-0050", "REQ-0056", "REQ-0276", "REQ-2821", "REQ-3013"]
        objective: "This test is to confirm an Operator can sign on with a valid ID and PIN and reach the Operator menu."
        steps: |
          **GIVEN** the POS has a Home Location for the operating mode
          **AND** the POS is displaying the Idle screen
          **AND** the POS is communicating with CloudFare
          **AND** a valid Operator's seeded ID and PIN are available
          **WHEN** the operator enters the ID and PIN and presses Enter
          **THEN** the Operator menu is displayed
          **AND** a sign-on event is recorded to CloudFare for that operator
        expected: "The operator is signed on, the Operator menu is shown, and a sign-on event is recorded in CloudFare."
      - title: "Sign On — Supervisor sign on"
        match: "Sign On — Supervisor signs on with valid credentials (manual) and reaches the Supervisor menu"
        refs: ["REQ-0050", "REQ-0056", "REQ-0276", "REQ-2821"]
        objective: "This test is to confirm a Supervisor can sign on with a valid ID and PIN and reach the Supervisor menu."
        steps: |
          **GIVEN** the POS is displaying the Idle screen and communicating with CloudFare
          **AND** a valid Supervisor's seeded credentials are available
          **WHEN** the supervisor enters the ID and PIN and presses Enter
          **THEN** the Supervisor menu is displayed
        expected: "The supervisor is signed on and the Supervisor menu is shown."
      - title: "Sign On — Technician sign on"
        match: "Sign On — Technician signs on with valid credentials (manual) and reaches the Technician menu"
        refs: ["REQ-0050", "REQ-0056", "REQ-0276", "REQ-2821"]
        objective: "This test is to confirm a Technician can sign on with a valid ID and PIN and reach the Technician menu."
        steps: |
          **GIVEN** the POS is displaying the Idle screen and communicating with CloudFare
          **AND** a valid Technician's seeded credentials are available
          **WHEN** the technician enters the ID and PIN and presses Enter
          **THEN** the Technician menu is displayed
        expected: "The technician is signed on and the Technician menu is shown."
      - title: "Sign On — Administrator sign on"
        match: "Sign On — Administrator signs on with valid credentials (manual) and reaches the Administrator menu"
        refs: ["REQ-0050", "REQ-0056", "REQ-0276", "REQ-2821"]
        objective: "This test is to confirm an Administrator can sign on with a valid ID and PIN and reach the Administrator menu."
        steps: |
          **GIVEN** the POS is displaying the Idle screen and communicating with CloudFare
          **AND** a valid Administrator's seeded credentials are available
          **WHEN** the administrator enters the ID and PIN and presses Enter
          **THEN** the Administrator menu is displayed
        expected: "The administrator is signed on and the Administrator menu is shown."
      - title: "Sign On — Operator sign on (smartcard)"
        match: "Sign On — Operator signs on by smartcard and reaches the Operator menu"
        refs: ["REQ-0050", "REQ-0056", "REQ-0276", "REQ-2821", "REQ-3013", "TIBU-20813"]
        objective: "This test is to confirm an Operator can sign on by presenting an Operator sign-on smartcard, and that doing so does not crash the device."
        steps: |
          **GIVEN** the POS is displaying the Idle screen and communicating with CloudFare
          **AND** a valid Operator sign-on smartcard is available
          **WHEN** the operator presents the Operator sign-on smartcard
          **THEN** the operator is signed on
          **AND** the Operator menu is displayed
          **AND** the device remains responsive
        expected: "The operator is signed on via smartcard to the Operator menu and the device stays responsive (regression: TIBU-20813)."
      - title: "Sign On — Supervisor sign on (smartcard)"
        match: "Sign On — Supervisor signs on by smartcard and reaches the Supervisor menu"
        refs: ["REQ-0050", "REQ-0056", "REQ-0276", "REQ-2821"]
        objective: "This test is to confirm a Supervisor can sign on by presenting a Supervisor sign-on smartcard."
        steps: |
          **GIVEN** the POS is displaying the Idle screen and communicating with CloudFare
          **AND** a valid Supervisor sign-on smartcard is available
          **WHEN** the supervisor presents the Supervisor sign-on smartcard
          **THEN** the supervisor is signed on
          **AND** the Supervisor menu is displayed
        expected: "The supervisor is signed on via smartcard and the Supervisor menu is shown."
      - title: "Sign On — Technician sign on (smartcard)"
        match: "Sign On — Technician signs on by smartcard and reaches the Technician menu"
        refs: ["REQ-0050", "REQ-0056", "REQ-0276", "REQ-2821"]
        objective: "This test is to confirm a Technician can sign on by presenting a Technician sign-on smartcard."
        steps: |
          **GIVEN** the POS is displaying the Idle screen and communicating with CloudFare
          **AND** a valid Technician sign-on smartcard is available
          **WHEN** the technician presents the Technician sign-on smartcard
          **THEN** the technician is signed on
          **AND** the Technician menu is displayed
        expected: "The technician is signed on via smartcard and the Technician menu is shown."
      - title: "Sign On — Administrator sign on (smartcard)"
        match: "Sign On — Administrator signs on by smartcard and reaches the Administrator menu"
        refs: ["REQ-0050", "REQ-0056", "REQ-0276", "REQ-2821"]
        objective: "This test is to confirm an Administrator can sign on by presenting an Administrator sign-on smartcard."
        steps: |
          **GIVEN** the POS is displaying the Idle screen and communicating with CloudFare
          **AND** a valid Administrator sign-on smartcard is available
          **WHEN** the administrator presents the Administrator sign-on smartcard
          **THEN** the administrator is signed on
          **AND** the Administrator menu is displayed
        expected: "The administrator is signed on via smartcard and the Administrator menu is shown."

  - path: ["Functional", "Sign On & Session", "Failures & Lockout"]
    cases:
      - title: "Sign On — incorrect credentials"
        match: "Sign On — incorrect credentials show 'Sign On Failed' with the attempt counter"
        refs: ["REQ-0050", "REQ-0056", "REQ-0276", "REQ-2821", "TIBU-22671", "TIBU-24379"]
        objective: "This test is to confirm incorrect sign-on credentials are rejected with the correct 'Sign On Failed' screen and attempt counter, and that the ID must be entered before the PIN."
        steps: |
          **GIVEN** the POS is showing the Sign On screen
          **WHEN** the operator enters an unrecognised ID or PIN and presses Enter
          **THEN** the "Sign On Failed" screen is shown with "The ID or PIN is incorrect"
          **AND** the attempt counter is shown (e.g. "1 of 3")
          **AND** the operator is returned to the Sign On screen to retry
        expected: "Sign-on is rejected with the 'Sign On Failed' message and an attempt counter, the operator can retry, and the ID must be entered before the PIN (regression: TIBU-22671, TIBU-24379)."
      - title: "Sign On — device locks after 3 attempts"
        match: "Sign On — three incorrect attempts lock the device"
        refs: ["REQ-0050", "REQ-0099", "REQ-2821", "TIBU-22672", "TIBU-22003"]
        objective: "This test is to confirm the device locks after three incorrect sign-on attempts and that the lock survives a reboot."
        steps: |
          **GIVEN** the POS is showing the Sign On screen
          **WHEN** the operator enters incorrect credentials three times
          **THEN** the "Device Locked" screen is shown with "The ID or PIN was entered incorrectly too many times"
          **AND** it instructs the operator to "Present Supervisor Card"
          **WHEN** the device is rebooted
          **THEN** the device is still locked
        expected: "After three failures the device locks with the correct screen, and the locked state persists across a reboot (regression: TIBU-22672, TIBU-22003)."
      - title: "Sign On — unlock with Supervisor card"
        match: "Sign On — a locked device is unlocked by presenting a Supervisor card"
        refs: ["REQ-0050", "REQ-1137", "REQ-2821", "TIBU-21384"]
        objective: "This test is to confirm a locked device can be unlocked by presenting a valid Supervisor card."
        steps: |
          **GIVEN** the POS is displaying the Device Locked screen
          **AND** the POS is communicating with CloudFare
          **WHEN** a supervisor presents a valid Supervisor card
          **THEN** the device is unlocked
          **AND** the POS returns to the Sign On screen
        expected: "Presenting a valid Supervisor card unlocks the device and returns it to the Sign On screen (regression: TIBU-21384)."

  - path: ["Functional", "Sign On & Session", "Communication Locked"]
    cases:
      - title: "Sign On — Communication Locked"
        match: "Sign On — a device that cannot reach CloudFare shows Communication Locked"
        refs: ["TIBU-28530", "TIBU-21278"]
        objective: "This test is to confirm a POS that has lost CloudFare communication beyond the configured period enters Communication Locked and blocks sign-on."
        steps: |
          **GIVEN** the POS has lost communication with CloudFare for longer than the configured period
          **WHEN** the operator attempts to sign on
          **THEN** the "Communication Locked" screen is shown
          **AND** it states the device was automatically locked due to lost communication
          **AND** it instructs the operator to "Notify a Supervisor or Technician"
        expected: "Once comms are lost beyond the configured period the device enters Communication Locked and sign-on is blocked (regression: TIBU-28530, TIBU-21278)."

  - path: ["Functional", "Sign On & Session", "Sign-on Messages"]
    cases:
      - title: "Sign On — Message of the Day"
        match: "Sign On — Message of the Day is displayed after a successful sign on"
        objective: "This test is to confirm the Message of the Day is shown on sign on when one is configured."
        steps: |
          **GIVEN** a Message of the Day is configured
          **WHEN** a valid operator completes a successful sign on
          **THEN** the Message of the Day is displayed with its date and text
          **AND** pressing any key continues to the next screen
        expected: "When configured, the Message of the Day is shown immediately after sign on and is dismissed with any key."
      - title: "Sign On — Message of the Day unavailable"
        match: "Sign On — 'Message of the Day Unavailable' is shown when none is available"
        objective: "This test is to confirm the 'Message of the Day Unavailable' screen is shown when no Message of the Day is configured or it cannot be retrieved."
        steps: |
          **GIVEN** no Message of the Day is configured (or it cannot be retrieved)
          **WHEN** a valid operator completes a successful sign on
          **THEN** the "Message of the Day Unavailable" screen is shown
          **AND** pressing any key continues to the next screen
        expected: "When no Message of the Day is available the Unavailable screen is shown and dismissed with any key."
      - title: "Sign On — Word & Colour of the Day"
        match: "Sign On — Word & Colour of the Day is displayed after sign on"
        objective: "This test is to confirm the Word & Colour of the Day is shown on sign on when configured."
        steps: |
          **GIVEN** the Word & Colour of the Day is configured
          **WHEN** a valid operator completes a successful sign on
          **THEN** the Word & Colour of the Day is displayed (the colour blocks and the word)
          **AND** pressing any key continues to the Main Screen
        expected: "When configured, the Word & Colour of the Day is shown after sign on and dismissed with any key."
      - title: "Sign On — Word & Colour of the Day unavailable"
        match: "Sign On — 'Word & Colours of the Day Unavailable' is shown when none is available"
        objective: "This test is to confirm the 'Word & Colours of the Day Unavailable' screen is shown when none is configured or cannot be retrieved."
        steps: |
          **GIVEN** the Word & Colour of the Day is not configured (or it cannot be retrieved)
          **WHEN** a valid operator completes a successful sign on
          **THEN** the "Word & Colours of the Day Unavailable" screen is shown
          **AND** pressing any key continues to the Main Screen
        expected: "When unavailable, the Word & Colours of the Day Unavailable screen is shown and dismissed with any key."

  - path: ["Functional", "Sign On & Session", "Sign Off"]
    cases:
      - title: "Sign Off — Operator"
        match: "Sign Off — Operator signs off from the Operator menu and returns to Idle"
        refs: ["TIBU-21440", "TIBU-26846"]
        objective: "This test is to confirm an Operator can sign off from the Operator menu, returning to Idle, without rebooting or going Out Of Service."
        steps: |
          **GIVEN** an operator is signed on and the Operator menu is displayed
          **WHEN** the operator selects Sign Off
          **THEN** the POS returns to the Idle screen
          **AND** a sign-off event is recorded to CloudFare
          **AND** the device does not reboot
          **AND** the device does not go Out Of Service
        expected: "The operator is signed off back to Idle, an event is recorded, and the device neither reboots nor goes Out Of Service (regression: TIBU-21440, TIBU-26846)."
      - title: "Sign Off — Supervisor"
        match: "Sign Off — Supervisor signs off from the Supervisor menu"
        objective: "This test is to confirm a Supervisor can sign off from the Supervisor menu and return to Idle."
        steps: |
          **GIVEN** a supervisor is signed on and the Supervisor menu is displayed
          **WHEN** the supervisor selects Sign Off
          **THEN** the POS returns to the Idle screen
        expected: "The supervisor is signed off and the POS returns to the Idle screen."
      - title: "Sign Off — Technician"
        match: "Sign Off — Technician signs off from the Technician menu"
        objective: "This test is to confirm a Technician can sign off from the Technician menu and return to Idle."
        steps: |
          **GIVEN** a technician is signed on and the Technician menu is displayed
          **WHEN** the technician selects Sign Off
          **THEN** the POS returns to the Idle screen
        expected: "The technician is signed off and the POS returns to the Idle screen."
      - title: "Sign Off — Administrator"
        match: "Sign Off — Administrator signs off from the Administrator menu"
        objective: "This test is to confirm an Administrator can sign off from the Administrator menu and return to Idle."
        steps: |
          **GIVEN** an administrator is signed on and the Administrator menu is displayed
          **WHEN** the administrator selects Sign Off
          **THEN** the POS returns to the Idle screen
        expected: "The administrator is signed off and the POS returns to the Idle screen."
      - title: "Sign Off — automatic (inactivity)"
        match: "Sign Off — the operator is automatically signed off after the configured inactivity period"
        objective: "This test is to confirm the POS automatically signs the operator off after the configured period of inactivity."
        steps: |
          **GIVEN** an operator is signed on
          **WHEN** the configured inactivity period elapses with no interaction
          **THEN** the operator is automatically signed off
          **AND** the POS returns to the Idle screen
        expected: "After the configured inactivity period the operator is automatically signed off and the POS returns to Idle."
      - title: "Sign Off — forced by power cycle"
        match: "Sign Off — a power cycle during a shift forces a sign-off recorded to CloudFare"
        refs: ["TIBU-24790"]
        objective: "This test is to confirm power-cycling the POS during a shift forces a sign-off and records exactly one Forced Sign-off event."
        steps: |
          **GIVEN** an operator is signed on
          **WHEN** the POS is power-cycled during the shift
          **THEN** on restart the POS returns to the Idle screen
          **AND** exactly one Forced Sign-off event is recorded to CloudFare
        expected: "After a power cycle the POS restarts to Idle and records a single Forced Sign-off event (regression: TIBU-24790)."

  - path: ["Functional", "Sign On & Session", "Audit"]
    cases:
      - title: "Sign On — audit events"
        match: "Sign On — sign-on, sign-off and forced sign-off events are recorded to CloudFare"
        objective: "This test is to confirm operator sign-on, sign-off and forced sign-off each produce the corresponding audit event in CloudFare."
        steps: |
          **GIVEN** a valid operator
          **WHEN** the operator signs on, then signs off, and separately a forced sign-off occurs
          **THEN** a Sign On event is recorded to CloudFare
          **AND** a Sign Off event is recorded to CloudFare
          **AND** a Forced Sign Off event is recorded to CloudFare
        expected: "Each of sign-on, sign-off and forced sign-off produces its corresponding CloudFare audit event for the operator."
