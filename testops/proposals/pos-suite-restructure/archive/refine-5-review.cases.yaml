# Wave 1 of George's POS review notes (review-notes-register.md): 2 edits + the clear ADDs.
# Bulk variation-line appends (payment #6/#7, card variants #8, Child #9, green banner #18 on the
# EXISTING ticket cases) are Wave 2. New ticket/issue cases below already carry banner + payment vars.
suite: GG - POS - Claude Suite
suite_id: 30253
defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [5]
  custom_autoconfirmation: false

sections:
  # ----- EDITS -----
  - path: ["Functional", "Sign On & Session", "Failures & Lockout"]
    cases:
      - title: "Sign On — device locks after the configured failed attempts"
        match: "Sign On — device locks after 3 attempts"
        refs: ["REQ-0050", "REQ-0099", "REQ-2821", "TIBU-22672", "TIBU-22003"]
        objective: "This test is to confirm the device locks after the configured number of consecutive failed sign-on attempts. The threshold is set via TMS and is not necessarily 3 — use the configured value."
        steps: |
          **GIVEN** the configured failed-attempt lockout threshold (set via TMS)
          **WHEN** the operator enters incorrect credentials up to the configured number of times
          **THEN** the device locks after the configured number of attempts
          **AND** a Device Locked screen is shown
        expected: "After the TMS-configured number of failed sign-on attempts the device locks and shows the Device Locked screen (regression: TIBU-22672, TIBU-22003)."

  - path: ["Functional", "Technician", "Maintenance"]
    cases:
      - title: "Technician — Network Settings"
        match: "Technician — Network Settings"
        refs: ["TIBU-24740", "TIBU-26905"]
        objective: "This test is to confirm the Technician can view and change network settings, including changing the Ethernet setting on the Network Settings page, with the change applied and retained."
        steps: |
          **GIVEN** a Technician is signed on and on the Network Settings page
          **WHEN** the Technician changes the Ethernet setting
          **THEN** the Ethernet setting is updated
          **AND** the change is applied and retained after the page is reopened
        expected: "Network settings, including the Ethernet setting, can be changed and the change is applied and retained (regression: TIBU-24740, TIBU-26905)."

  # ----- ADDS: Issue Card (Ulsterbus card issues) -----
  - path: ["Ulsterbus", "Issue Card"]
    cases:
      - title: "Issue Card — Ulsterbus Multi-Journey"
        objective: "This test is to confirm an Ulsterbus Multi-Journey smartcard can be issued from blank, written and a receipt printed. Data variations: payment by Cash / Warrant / Card."
        steps: |
          **GIVEN** the operator presents a blank card for an Ulsterbus Multi-Journey product
          **WHEN** the operator creates the Multi-Journey product and takes payment
          **THEN** the Ulsterbus Multi-Journey card is written
          **AND** a receipt is printed
        expected: "An Ulsterbus Multi-Journey card issues from blank, is written and a receipt prints; payable by Cash, Warrant or Card."
      - title: "Issue Card — Town Service Travelcard"
        objective: "This test is to confirm a Town Service Travelcard can be issued from blank, written and a receipt printed. Data variations: payment by Cash / Warrant / Card."
        steps: |
          **GIVEN** the operator presents a blank card for a Town Service Travelcard
          **WHEN** the operator creates the Travelcard product and takes payment
          **THEN** the Town Service Travelcard is written with the correct expiry
          **AND** a receipt is printed
        expected: "A Town Service Travelcard issues from blank with correct expiry and a receipt prints; payable by Cash, Warrant or Card."

  # ----- ADDS: Customer / Passenger Display (Rail + Ulsterbus) -----
  - path: ["Functional", "Customer Displays"]
    cases:
      - title: "Customer Display — Rail passenger display"
        objective: "This test is to confirm the passenger display shows the fare and total to the customer in Rail (NIR) mode and updates through the transaction."
        steps: |
          **GIVEN** an operator is signed on in Rail (NIR) mode and building a fare
          **WHEN** the operator adds items and takes payment
          **THEN** the passenger display shows the rail fare and running total
          **AND** the passenger display updates as the transaction progresses
        expected: "In Rail mode the passenger display shows the fare/total and updates through the transaction."
      - title: "Customer Display — Ulsterbus passenger display"
        objective: "This test is to confirm the passenger display shows the fare and total to the customer in Ulsterbus mode and updates through the transaction."
        steps: |
          **GIVEN** an operator is signed on in Ulsterbus mode and building a fare
          **WHEN** the operator adds items and takes payment
          **THEN** the passenger display shows the Ulsterbus fare and running total
          **AND** the passenger display updates as the transaction progresses
        expected: "In Ulsterbus mode the passenger display shows the fare/total and updates through the transaction."

  # ----- ADDS: Rail FLU (change stations + Euro currency enable) -----
  - path: ["NIR (Rail)", "Fare Look-Up"]
    cases:
      - title: "Rail FLU — change boarding & alighting stations"
        objective: "This test is to confirm the operator can change the boarding and alighting stations on a rail fare and the fare/price updates accordingly."
        steps: |
          **GIVEN** the operator has selected a rail fare with boarding and alighting stations
          **WHEN** the operator changes the boarding station
          **THEN** the fare updates for the new boarding station
          **WHEN** the operator changes the alighting station
          **THEN** the fare updates for the new alighting station
        expected: "Changing the boarding or alighting station on a rail fare updates the fare and price correctly."
      - title: "Cross-Border — enable Euro currency"
        objective: "This test is to confirm Euro currency can be enabled for Cross-Border products and, once enabled, Cross-Border fares can be paid/priced in Euros."
        steps: |
          **GIVEN** a Cross-Border product is selected on a Rail (NIR) POS
          **WHEN** Euro currency is enabled and the price/currency is toggled to Euro
          **THEN** the Cross-Border fare is shown in Euros
          **AND** payment can be taken in the selected currency
        expected: "With Euro currency enabled, Cross-Border products show and accept payment in Euros (GBP↔EUR toggle works)."

  # ----- ADDS: Cross-Border tickets (Rail only) -----
  - path: ["NIR (Rail)", "Tickets"]
    cases:
      - title: "NIR — Cross-Border Single"
        objective: "This test is to confirm a Cross-Border Single ticket can be sold and issued on a Rail POS. Data variations: currency GBP / EUR; payment by Cash / Warrant / Card."
        steps: |
          **GIVEN** an operator is signed on in Rail (NIR) mode
          **WHEN** the operator selects a Cross-Border Single and takes payment
          **THEN** the Cross-Border Single ticket is issued
          **AND** a green success banner is displayed following the successful issue
        expected: "A Cross-Border Single issues correctly (GBP or EUR; Cash/Warrant/Card) with the green success banner shown."
      - title: "NIR — Cross-Border Day Return"
        objective: "This test is to confirm a Cross-Border Day Return ticket can be sold and issued on a Rail POS. Data variations: currency GBP / EUR; payment by Cash / Warrant / Card."
        steps: |
          **GIVEN** an operator is signed on in Rail (NIR) mode
          **WHEN** the operator selects a Cross-Border Day Return and takes payment
          **THEN** the Cross-Border Day Return ticket is issued
          **AND** a green success banner is displayed following the successful issue
        expected: "A Cross-Border Day Return issues correctly (GBP or EUR; Cash/Warrant/Card) with the green success banner shown."

  # ----- ADDS: Annulment of a ticket issue -----
  - path: ["Functional", "Basket & Payment", "Annulment"]
    cases:
      - title: "Annulment — ticket issue"
        objective: "This test is to confirm a newly issued ticket can be annulled within the shift, with the correct outcome and an annulment receipt."
        steps: |
          **GIVEN** the operator has just issued a ticket this shift
          **WHEN** the operator annuls that ticket issue
          **THEN** the ticket issue is annulled
          **AND** the annulment is recorded
          **AND** an annulment receipt is printed
        expected: "A newly issued ticket annuls with the correct outcome and a printed annulment receipt."

  # ----- ADDS: Mini statement after actions -----
  - path: ["Functional", "Top Up & Validation", "Validation"]
    cases:
      - title: "Mini Statement — reflects usage and top-ups"
        objective: "This test is to confirm a smartcard's mini statement shows the correct, up-to-date balance/journeys after the card has been used (validated) and after top-ups, including actions made on other devices."
        steps: |
          **GIVEN** a smartcard that has been validated/used and topped up
          **WHEN** the operator presents the card to view the mini statement
          **THEN** the mini statement shows the correct current balance/journeys
          **AND** it reflects recent validations/usage
          **AND** it reflects top-ups made on this and other devices
        expected: "The mini statement is accurate and current after usage and top-ups, including activity on other devices."

  # ----- ADDS: Technician set Default Boarding Stage -----
  - path: ["Functional", "Technician", "Device Settings"]
    cases:
      - title: "Technician — set Default Boarding Stage"
        objective: "This test is to confirm a Technician can set the Default Boarding Stage and the new default is applied to subsequent bus fare look-ups."
        steps: |
          **GIVEN** a Technician is signed on in Device Settings
          **WHEN** the Technician sets the Default Boarding Stage
          **THEN** the Default Boarding Stage is saved
          **AND** subsequent bus fare look-ups use the new default boarding stage
        expected: "The Default Boarding Stage can be set in Technician and is applied to later bus fare look-ups."

  # ----- ADDS: TMS application + topology updates (full verification) -----
  - path: ["Functional", "Technician", "TMS Updates"]
    cases:
      - title: "TMS — application update"
        objective: "This test is to confirm an application update delivered via TMS downloads, applies, reports the new version, loses no transaction data, and raises an audit event."
        steps: |
          **GIVEN** an application update is published to the device via TMS
          **WHEN** the device downloads and applies the update
          **THEN** the update is applied successfully
          **AND** the new application version is shown in Technician → Versions
          **AND** no queued transactions or unsent data are lost
          **AND** an update audit event is recorded
        expected: "A TMS application update applies, shows the new version, preserves transaction data and raises an audit event."
      - title: "TMS — topology update"
        objective: "This test is to confirm a topology/configuration update delivered via TMS downloads, applies, reports the new version, loses no transaction data, and raises an audit event."
        steps: |
          **GIVEN** a topology/configuration update is published to the device via TMS
          **WHEN** the device downloads and applies the update
          **THEN** the update is applied successfully
          **AND** the new configuration/topology version is shown in Technician → Versions
          **AND** no queued transactions or unsent data are lost
          **AND** an update audit event is recorded
        expected: "A TMS topology update applies, shows the new version, preserves transaction data and raises an audit event."
