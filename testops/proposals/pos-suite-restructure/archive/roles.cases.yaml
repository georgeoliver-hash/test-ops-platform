# Role menus — reformatted: short titles (+ `match` = old title to rename in place), split When/Then,
# sweep refs folded. Shared across modes (lives under Functional - Shared after the UI move).
suite: GG - POS - Claude Suite
suite_id: 30253

defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [5]
  custom_autoconfirmation: false

sections:
  # ============================================================ OPERATOR MENU
  - path: ["Functional", "Operator", "Options"]
    cases:
      - title: "Operator Options — correct options listed"
        match: "Operator Options — the menu lists the correct options"
        refs: ["TIBU-22640"]
        objective: "This test is to confirm the Operator Options menu lists the expected options and excludes ones that should not appear."
        steps: |
          **GIVEN** an operator is signed on
          **WHEN** the operator opens Operator Options
          **THEN** the expected operator options are listed
          **AND** no 'Report Faulty Payment Device' option is shown
        expected: "Operator Options shows the correct set of options, with no spurious 'Report Faulty Payment Device' entry (regression: TIBU-22640)."
      - title: "Operator Options — cancel Soft Reset"
        match: "Operator Options — cancelling a Soft Reset returns without resetting"
        refs: ["TIBU-24727"]
        objective: "This test is to confirm pressing Cancel on the Operator Options Soft Reset confirmation returns to the menu without resetting."
        steps: |
          **GIVEN** an operator is in Operator Options on the Soft Reset confirmation
          **WHEN** the operator presses Cancel
          **THEN** the device returns to Operator Options
          **AND** no soft reset is performed
        expected: "Cancelling the Soft Reset confirmation leaves the device in Operator Options without resetting (regression: TIBU-24727)."
      - title: "Operator Options — brightness & volume"
        match: "Operator Options — brightness and volume can be adjusted"
        refs: ["TIBU-24869"]
        objective: "This test is to confirm the operator can increase and decrease the screen brightness and the audio volume."
        steps: |
          **GIVEN** an operator is in Operator Options
          **WHEN** the operator increases and decreases brightness and volume
          **THEN** the brightness changes accordingly
          **AND** the volume changes accordingly
        expected: "Brightness and volume can both be increased and decreased from Operator Options (regression: TIBU-24869)."

  - path: ["Functional", "Operator", "Break Mode"]
    cases:
      - title: "Operator Break — enter Break"
        match: "Operator Break — entering Break shows a confirmation and the correct Break screen"
        refs: ["TIBU-24335", "TIBU-24879", "TIBU-30633"]
        objective: "This test is to confirm entering Operator Break prompts a confirmation, shows the correct Break screen and uses correct on-screen wording."
        steps: |
          **GIVEN** an operator is signed on
          **WHEN** the operator selects Operator Break
          **THEN** a confirmation screen is shown
          **WHEN** the operator confirms
          **THEN** the device enters Break mode showing the Break screen
          **AND** the Break screen does not show a Bus number
          **AND** all on-screen text is spelled correctly
        expected: "Entering Break shows a confirm screen, then the Break screen with no Bus number and correctly spelled text (regression: TIBU-24335, TIBU-24879, TIBU-30633)."
      - title: "Operator Break — leave Break"
        match: "Operator Break — leaving Break returns to the Operator menu"
        objective: "This test is to confirm the operator can leave Break mode manually and return to the Operator menu."
        steps: |
          **GIVEN** the device is in Operator Break mode
          **WHEN** the operator leaves Break manually
          **THEN** the device returns to the Operator menu
        expected: "Leaving Break returns the device to the Operator menu, in service."
      - title: "Operator Break — no Out Of Service"
        match: "Operator Break — entering and leaving Break does not put the device Out Of Service"
        refs: ["TIBU-26855", "TIBU-20913"]
        objective: "This test is to confirm using Break does not leave the device stuck loading or Out Of Service."
        steps: |
          **GIVEN** an operator is signed on
          **WHEN** the operator enters and then leaves Break mode
          **THEN** the device returns to service
          **AND** the device is not stuck on a loading screen
          **AND** the device is not Out Of Service
        expected: "Break is entered and left cleanly, returning to service with no stuck-loading or Out Of Service state (regression: TIBU-26855, TIBU-20913)."

  - path: ["Functional", "Operator", "Ticket History"]
    cases:
      - title: "Ticket History — view history"
        match: "Ticket History — viewing history lists issued tickets without rebooting"
        refs: ["TIBU-23091", "TIBU-24332", "TIBU-24329"]
        objective: "This test is to confirm the operator can open Ticket History to see issued tickets, with information present and without the device rebooting."
        steps: |
          **GIVEN** an operator is signed on and has issued tickets this shift
          **WHEN** the operator opens Ticket History
          **THEN** the issued tickets are listed with their information
          **AND** the device does not reboot
        expected: "Ticket History lists issued tickets with information and the device does not reboot (regression: TIBU-23091, TIBU-24332, TIBU-24329)."
      - title: "Ticket History — ticket details"
        match: "Ticket History — a selected ticket shows its full details"
        refs: ["TIBU-24146", "TIBU-24718"]
        objective: "This test is to confirm selecting a ticket in Ticket History shows its full details, including annulled card-issue information."
        steps: |
          **GIVEN** the operator is viewing Ticket History
          **WHEN** the operator selects a ticket
          **THEN** the ticket's full details are displayed
          **AND** an annulled card issue includes its details
        expected: "Selecting a ticket shows complete details, including annulled card-issue info (regression: TIBU-24146, TIBU-24718)."
      - title: "Ticket History — scroll pages"
        match: "Ticket History — multiple pages can be scrolled"
        refs: ["TIBU-27444", "TIBU-24884"]
        objective: "This test is to confirm Ticket History provides scrolling controls to view tickets beyond the first page."
        steps: |
          **GIVEN** the operator has more ticket history than fits on one page
          **WHEN** the operator scrolls the Ticket History
          **THEN** up and down arrows are available
          **AND** the operator can view the second and subsequent pages
        expected: "Ticket History shows scroll arrows and lets the operator page through all entries (regression: TIBU-27444, TIBU-24884)."

  - path: ["Functional", "Operator", "Totals"]
    cases:
      - title: "Totals — view & print"
        match: "Totals — the operator can view and print their totals"
        refs: ["TIBU-20914"]
        objective: "This test is to confirm the operator can view and print their shift totals without a fatal error."
        steps: |
          **GIVEN** an operator is signed on
          **WHEN** the operator selects Totals
          **THEN** the operator's totals are displayed
          **WHEN** the operator prints the totals
          **THEN** the totals print without a fatal error
        expected: "The operator's totals are displayed and printed with no fatal error (regression: TIBU-20914)."

  - path: ["NIR (Rail)", "Operator (rail-only)"]
    cases:
      - title: "Excess Ticket — available (rail)"
        match: "Excess Ticket — the Excess Ticket feature is available in the Operator menu (rail)"
        refs: ["TIBU-24804"]
        objective: "This test is to confirm that, in rail (NIR) mode, the operator has the Excess Ticket feature available in the Operator menu."
        steps: |
          **GIVEN** an operator is signed on with the POS in rail (NIR) mode
          **WHEN** the operator opens the Operator menu
          **THEN** the Excess Ticket feature is available
        expected: "In rail mode the Excess Ticket feature is present in the Operator menu (regression: TIBU-24804)."

  # ============================================================ SUPERVISOR MENU
  - path: ["Functional", "Supervisor", "Reports & Information"]
    cases:
      - title: "Supervisor — Duty Information"
        match: "Supervisor — Duty Information displays and scrolls through individual duties"
        refs: ["TIBU-21110", "TIBU-21138", "TIBU-21323", "TIBU-21325", "TIBU-27443", "TIBU-21367", "TIBU-22643"]
        objective: "This test is to confirm a Supervisor can open Duty Information, view its details, scroll through individual duties using the chevron keys, with correct text and without resetting the device."
        steps: |
          **GIVEN** a supervisor is signed on
          **WHEN** the supervisor opens Duty Information
          **THEN** the duty information is displayed with correct headings, text and chevron-key instructions
          **AND** the device does not reset
          **WHEN** the supervisor selects a duty and scrolls with the chevron keys
          **THEN** each individual duty's details can be viewed
        expected: "Duty Information opens with correct text + chevron instructions, shows each duty's details on selection, scrolls, and never resets the device (regression: TIBU-21110, TIBU-21138, TIBU-21323, TIBU-21325, TIBU-27443, TIBU-21367, TIBU-22643)."
      - title: "Supervisor — Day Information"
        match: "Supervisor — Day Information is viewed and printed correctly"
        refs: ["TIBU-24785", "TIBU-22647"]
        objective: "This test is to confirm a Supervisor can view and print Day Information showing the correct shifts, with chevron-key instructions."
        steps: |
          **GIVEN** a supervisor is signed on
          **WHEN** the supervisor opens Day Information
          **THEN** the Day Information is displayed with chevron-key instructions
          **WHEN** the supervisor prints it
          **THEN** the printout shows the correct number of shifts
        expected: "Day Information is viewed (with chevron instructions) and printed with the correct shifts (regression: TIBU-24785, TIBU-22647)."
      - title: "Supervisor — Sales Breakdown"
        match: "Supervisor — Sales Breakdown prints the correct information"
        refs: ["TIBU-19682", "TIBU-23936"]
        objective: "This test is to confirm a Supervisor can view and print the Sales Breakdown with correct, clean content."
        steps: |
          **GIVEN** a supervisor is signed on
          **WHEN** the supervisor opens Sales Breakdown and prints it
          **THEN** the Sales Breakdown is displayed
          **AND** the Sales Breakdown is printed
          **AND** the printout shows the correct sales information
          **AND** the printout does not include stray 'Paper' content
        expected: "Sales Breakdown prints the correct information with no stray content (regression: TIBU-19682, TIBU-23936)."
      - title: "Supervisor — Print & Zero"
        match: "Supervisor — Print and Zero of current and accumulated totals"
        refs: ["TIBU-24786"]
        objective: "This test is to confirm a Supervisor can Print and Zero both the current and accumulated totals correctly."
        steps: |
          **GIVEN** a supervisor is signed on
          **WHEN** the supervisor performs Print and Zero Current
          **THEN** the current totals are printed and reset to zero
          **WHEN** the supervisor performs Print and Zero Accumulated
          **THEN** the accumulated totals are printed and reset to zero
        expected: "Both Print and Zero Current and Accumulated print and reset correctly (regression: TIBU-24786)."

  - path: ["Functional", "Supervisor", "Versions & Comms"]
    cases:
      - title: "Supervisor — Versions"
        match: "Supervisor — view and print Serial, Software and Configuration versions"
        refs: ["TIBU-15782"]
        objective: "This test is to confirm a Supervisor can view and print the serial numbers, software versions and configuration data versions, showing the real version numbers."
        steps: |
          **GIVEN** a supervisor is signed on
          **WHEN** the supervisor opens Versions and views the serial, software and configuration versions
          **THEN** each version set is displayed with the real version numbers
          **AND** each version set can be printed
        expected: "Serial, software and configuration versions show the real numbers and can be printed (regression: TIBU-15782)."
      - title: "Supervisor — Force Comms"
        match: "Supervisor — Force Comms can be initiated, refreshed and exited"
        objective: "This test is to confirm a Supervisor can initiate, refresh and exit Force Comms."
        steps: |
          **GIVEN** a supervisor is signed on
          **WHEN** the supervisor initiates a POS-initiated Force Comms
          **THEN** the communication is performed
          **WHEN** the supervisor refreshes and then exits Force Comms
          **THEN** the supervisor returns to the Supervisor menu
        expected: "Force Comms can be initiated, refreshed and exited cleanly from the Supervisor menu."

  # ============================================================ TECHNICIAN MENU
  - path: ["Functional", "Technician", "Device Settings"]
    cases:
      - title: "Technician — Device Settings"
        match: "Technician — Device Settings: set Home Location, Boarding Location, Mounting Point and Tray Identifier"
        refs: ["TIBU-16044", "TIBU-16228", "TIBU-20967", "TIBU-24866"]
        objective: "This test is to confirm a Technician can change the Home Location, Boarding Location, Mounting Point and Tray Identifier, and that each is saved correctly."
        steps: |
          **GIVEN** a technician is signed on
          **WHEN** the technician changes the Home Location, Boarding Location, Mounting Point and Tray Identifier
          **THEN** each setting is updated
          **AND** each setting is retained
          **AND** the Tray Identifier is stored correctly (prefixed "AT")
        expected: "All device settings can be changed and persist, with the Tray ID prefixed 'AT' (regression: TIBU-16044, TIBU-16228, TIBU-20967, TIBU-24866)."
      - title: "Technician — Display Settings"
        match: "Technician — Display Settings show the current level"
        refs: ["TIBU-21129"]
        objective: "This test is to confirm the Display Settings screen indicates the current level when adjusting."
        steps: |
          **GIVEN** a technician is signed on
          **WHEN** the technician opens Display Settings and adjusts the level
          **THEN** the screen indicates the current level
        expected: "Display Settings clearly indicates the current level while adjusting (regression: TIBU-21129)."

  - path: ["Functional", "Technician", "Maintenance"]
    cases:
      - title: "Technician — Force Comms"
        match: "Technician — Force Comms completes without a fatal error"
        refs: ["TIBU-21096"]
        objective: "This test is to confirm a Technician can run Force Comms (initiate, refresh, exit) without a fatal error."
        steps: |
          **GIVEN** a technician is signed on
          **WHEN** the technician initiates, refreshes and exits Force Comms
          **THEN** each action completes successfully
          **AND** no fatal error occurs
        expected: "Technician Force Comms completes its actions with no fatal error (regression: TIBU-21096)."
      - title: "Technician — Soft Reboot"
        match: "Technician — Soft Reboot restarts the device cleanly, including during a shift"
        refs: ["TIBU-29752"]
        objective: "This test is to confirm a Technician Soft Reboot during a shift restarts the device cleanly and recovers the session state."
        steps: |
          **GIVEN** a technician is signed on during an active shift
          **WHEN** the technician performs a Soft Reboot
          **THEN** the device restarts cleanly
          **AND** the device recovers to a valid state after the restart
        expected: "A Soft Reboot during a shift restarts cleanly and recovers correctly (regression: TIBU-29752)."
      - title: "Technician — Network Settings"
        match: "Technician — Network Settings can be viewed and Ethernet settings adjusted"
        refs: ["TIBU-24740", "TIBU-26905"]
        objective: "This test is to confirm a Technician can open Network Settings and manually adjust the Ethernet settings, and that the controls respond."
        steps: |
          **GIVEN** a technician is signed on
          **WHEN** the technician opens Network Settings and adjusts the Ethernet settings
          **THEN** the screen responds to the input
          **AND** the adjusted Ethernet settings are applied
        expected: "Network Settings opens, responds to input and applies manual Ethernet changes (regression: TIBU-24740, TIBU-26905)."
      - title: "Technician — Versions"
        match: "Technician — view and print Serial, Software and Configuration versions"
        refs: ["TIBU-15782"]
        objective: "This test is to confirm a Technician can view and print the serial, software and configuration versions, showing real version numbers."
        steps: |
          **GIVEN** a technician is signed on
          **WHEN** the technician views and prints the serial, software and configuration versions
          **THEN** each version set is displayed with real version numbers
          **AND** each can be printed
        expected: "Serial, software and configuration versions show real numbers and can be printed (regression: TIBU-15782)."
      - title: "Technician — Status panels"
        match: "Technician — view the device status panels"
        objective: "This test is to confirm a Technician can view the Device Status, Other Devices, Card Reader and Paper Status panels."
        steps: |
          **GIVEN** a technician is signed on
          **WHEN** the technician opens the Device Status, Other Devices, Card Reader and Paper Status panels
          **THEN** each panel displays the relevant status information
        expected: "All Technician status panels display correctly."
      - title: "Technician — Paper Status back key"
        refs: ["TIBU-23928"]
        objective: "This test is to confirm pressing Back on the Paper Status screen returns cleanly without a fatal error."
        steps: |
          **GIVEN** a technician is on the Paper Status screen
          **WHEN** the technician presses Back
          **THEN** the technician returns to the previous screen
          **AND** no fatal error occurs
        expected: "Back from Paper Status returns cleanly with no fatal error (regression: TIBU-23928)."
      - title: "Technician — card reader test"
        match: "Technician — the Present Smartcard test screen works correctly"
        refs: ["TIBU-24792"]
        objective: "This test is to confirm the Technician 'Please Present Smartcard to Test' screen reports the card-read result correctly."
        steps: |
          **GIVEN** a technician is on the card-reader test
          **WHEN** the technician presents a smartcard to the test screen
          **THEN** the test screen reports the card-read result correctly
        expected: "The Present Smartcard test screen correctly reports the result (regression: TIBU-24792)."
      - title: "Technician — menu options"
        match: "Technician — the menu shows only the correct options"
        refs: ["TIBU-22649"]
        objective: "This test is to confirm the Technician menu lists only the intended options."
        steps: |
          **GIVEN** a technician is signed on
          **WHEN** the technician views the Technician menu
          **THEN** only the intended options are listed
        expected: "The Technician menu shows only the intended options, with no extras (regression: TIBU-22649)."
      - title: "Technician — change operating mode"
        match: "Technician — the operating mode can be changed from the Technician menu (rail)"
        refs: ["TIBU-24868"]
        objective: "This test is to confirm a Technician can change the device operating mode from the Technician menu."
        steps: |
          **GIVEN** a technician is signed on
          **WHEN** the technician changes the operating mode from the Technician menu
          **THEN** the device switches to the selected operating mode
        expected: "The operating mode can be changed from the Technician menu (regression: TIBU-24868)."

  # ============================================================ ADMINISTRATOR MENU
  - path: ["Functional", "Administrator", "Card Management"]
    cases:
      - title: "Administrator — Clear Card"
        match: "Administrator — Clear Card succeeds for a valid card and reports failure for an invalid one"
        objective: "This test is to confirm the Administrator can clear a valid card and that an invalid card is reported as unsuccessful."
        steps: |
          **GIVEN** an administrator is signed on
          **WHEN** the administrator clears a valid card
          **THEN** the card is cleared
          **AND** success is reported
          **WHEN** the administrator attempts to clear an invalid card
          **THEN** the operation is reported as unsuccessful with a card error
        expected: "A valid card clears successfully and an invalid card reports a Card Error."
      - title: "Administrator — Card Dump"
        match: "Administrator — Card Dump succeeds for a valid card and reports failure for an invalid one"
        objective: "This test is to confirm the Administrator can dump a valid card's data and that an invalid card is reported as unsuccessful."
        steps: |
          **GIVEN** an administrator is signed on
          **WHEN** the administrator dumps a valid card
          **THEN** the card data is read
          **AND** success is reported
          **WHEN** the administrator attempts to dump an invalid card
          **THEN** the operation is reported as unsuccessful
        expected: "A valid card dump succeeds and an invalid card reports unsuccessful."
      - title: "Administrator — Data Download"
        match: "Administrator — Data Download completes successfully"
        objective: "This test is to confirm the Administrator can perform a Data Download and receive a success confirmation."
        steps: |
          **GIVEN** an administrator is signed on
          **WHEN** the administrator performs a Data Download
          **THEN** the data is downloaded
          **AND** a 'Data Download Successful' confirmation is shown
        expected: "Data Download completes and shows the success confirmation."

  - path: ["Functional", "Administrator", "Device & Network"]
    cases:
      - title: "Administrator — Device Settings"
        match: "Administrator — Device Settings: Home Location, Boarding Location, Mounting Point and Tray Identifier"
        refs: ["TIBU-22632"]
        objective: "This test is to confirm the Administrator can set the device settings, with correct default Boarding Stage and Mounting Point."
        steps: |
          **GIVEN** an administrator is signed on
          **WHEN** the administrator changes the Home Location, Boarding Location, Mounting Point and Tray Identifier
          **THEN** each setting is updated
          **AND** each setting is retained
          **AND** the default Boarding Stage and Mounting Point are correct
        expected: "Device settings change and persist, with correct default Boarding Stage and Mounting Point (regression: TIBU-22632)."
      - title: "Administrator — Network Settings"
        match: "Administrator — Network Settings respond and apply"
        refs: ["TIBU-24740"]
        objective: "This test is to confirm the Administrator Network Settings screen responds to input and applies changes."
        steps: |
          **GIVEN** an administrator is signed on
          **WHEN** the administrator opens Network Settings and changes a setting
          **THEN** the screen responds to the input
          **AND** the change is applied
        expected: "Administrator Network Settings respond to input and apply changes (regression: TIBU-24740)."
      - title: "Administrator — Force Comms"
        match: "Administrator — Force Comms can be initiated, refreshed and exited"
        objective: "This test is to confirm the Administrator can initiate, refresh and exit Force Comms."
        steps: |
          **GIVEN** an administrator is signed on
          **WHEN** the administrator initiates, refreshes and exits Force Comms
          **THEN** each action completes
          **AND** the administrator returns to the Administrator menu
        expected: "Force Comms can be initiated, refreshed and exited from the Administrator menu."
      - title: "Administrator — Versions"
        match: "Administrator — view and print Serial, Software and Configuration versions"
        objective: "This test is to confirm the Administrator can view and print the serial, software and configuration versions."
        steps: |
          **GIVEN** an administrator is signed on
          **WHEN** the administrator views and prints the serial, software and configuration versions
          **THEN** each version set is displayed
          **AND** each version set is printed
        expected: "Serial, software and configuration versions are viewable and printable from the Administrator menu."
