# POS consolidation — enriched keeper flow-tests that absorb folded role/method/product variations.
# `match` = current title -> new broader title + enriched steps. ONE-SHOT. Written with the editor
# (clean UTF-8 em-dashes) — never a PowerShell heredoc. Paired with tools/consolidate_pos.py (retires).
suite_id: 30253
defaults:
  template_id: 1
  custom_autoconfirmation: false
  custom_devtypes: [5]
  custom_revstatus: 2

sections:
  - path: Functional / Sign On & Session / Sign On
    cases:
      - title: Sign On — by role (manual and smartcard)
        match: Sign On — Operator sign on
        objective: This test is to confirm an operator can sign on by manual ID+PIN or by smartcard, reaching the menu for their role.
        steps: |
          **Given** the ETM is at the idle Sign On screen and communicating with CloudFare
          **WHEN** the operator enters a valid ID and PIN and confirms
          **THEN** the operator is authenticated and reaches the menu for their role
          **WHEN** the operator presents a valid staff smartcard instead
          **THEN** the ID is pre-populated and, after a valid PIN, the operator reaches their role menu
        expected: Sign on succeeds by manual entry and by smartcard. Run for each role — Operator, Supervisor, Technician, Administrator.
  - path: Functional / Sign On & Session / Sign-on Messages
    cases:
      - title: Sign On — Message and Word & Colour of the Day
        match: Sign On — Message of the Day
        objective: This test is to confirm the Message of the Day and Word & Colour of the Day are presented during sign-on, each with an Unavailable fallback.
        steps: |
          **Given** an operator is signing on
          **WHEN** the Message of the Day is available
          **THEN** it is presented for the operator to confirm
          **WHEN** the Message of the Day cannot be retrieved
          **THEN** the Message of the Day Unavailable state is shown and sign-on continues
          **WHEN** the Word & Colour of the Day is available
          **THEN** it is presented for the operator to confirm
          **WHEN** the Word & Colour of the Day cannot be retrieved
          **THEN** the Word & Colour Unavailable state is shown and sign-on continues
        expected: Message of the Day and Word & Colour of the Day are each shown during sign-on, with an Unavailable fallback when they cannot be retrieved.
  - path: Functional / Sign On & Session / Idle & Screen
    cases:
      - title: Sign On — screen, field entry and the 'C' key
        match: Sign On — ID and PIN fields shown
        objective: This test is to confirm the Sign On screen presents the ID and PIN fields and handles field entry and the 'C' key.
        steps: |
          **Given** the ETM is idle
          **WHEN** the Sign On screen is displayed
          **THEN** the ID and PIN fields are shown
          **WHEN** the operator enters digits into a field
          **THEN** the field updates and the 'C' key clears one character at a time
          **WHEN** no entry is made
          **THEN** the ETM remains on or returns to the idle Sign On screen
        expected: The Sign On screen shows ID and PIN fields; field entry updates and 'C' clears a character; idle returns to the Sign On screen.
  - path: Functional / Sign On & Session / Sign Off
    cases:
      - title: Sign Off — by role
        match: Sign Off — Operator
        objective: This test is to confirm an operator of any role can sign off, returning the ETM to idle with the sign-off audited.
        steps: |
          **Given** an operator is signed on
          **WHEN** the operator signs off
          **THEN** the ETM returns to the idle screen
          **AND** the sign-off is audited
        expected: Sign off returns the ETM to idle and audits the event. Run for each role — Operator, Supervisor, Technician, Administrator.
  - path: Functional / Top Up & Validation / Top Up
    cases:
      - title: Top Up — top up a smartcard
        match: Top Up — top up a smartcard
        objective: This test is to confirm an operator can top up a smartcard, take payment, print a receipt and auto-validate where applicable.
        steps: |
          **Given** an operator is signed on and a topp-able smartcard is presented
          **WHEN** the operator selects Top Up, takes payment and confirms
          **THEN** the card is topped up
          **AND** a top-up receipt is printed
          **AND** the card is auto-validated for the current journey where applicable
        expected: Top-up completes with a receipt and auto-validation. Run across products — Metro Travelcard, Ulsterbus Town Service Travelcard, DayLink, iLink, Belfast Visitor Pass, ABT smartcard, Monthly Season, half-fare/concession.
  - path: Functional / Issue Card / Issue from Blank
    cases:
      - title: Issue Card — issue from blank
        match: Issue Card — issue from blank
        objective: This test is to confirm an operator can issue a product onto a blank smartcard, take payment and have it recognised on use.
        steps: |
          **Given** an operator is signed on and a blank smartcard is presented
          **WHEN** the operator selects the product, takes payment and issues it to the card
          **THEN** the product is written to the card at the correct price
          **AND** a receipt is printed
        expected: A product issues onto a blank card with a receipt. Run across products — Metro Multi-Journey, Multi-Journey, DayLink, iLink, Metro Travelcard, Belfast Visitor Pass, Ulsterbus Multi-Journey, Town Service Travelcard.
  - path: Functional / Operator / Ticket History
    cases:
      - title: Ticket History — view, detail and paging
        match: Ticket History — view history
        objective: This test is to confirm an operator can view the ticket history, open a ticket's detail and page through the list.
        steps: |
          **Given** an operator is signed on with prior transactions
          **WHEN** the operator opens Ticket History
          **THEN** the issued tickets are listed
          **WHEN** the operator selects a ticket
          **THEN** the ticket detail is displayed
          **WHEN** the operator pages the list
          **THEN** further tickets are shown
        expected: Ticket History lists tickets, shows a selected ticket's detail, and pages through the list.
