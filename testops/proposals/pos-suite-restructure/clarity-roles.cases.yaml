# POS role & menu cases — clarity pass (suite 30253)
# UPDATES 35 existing cases in place. Titles are verbatim (push --update matches by exact title).
# Same behaviour tested — only clarity improved: POS wording, fuller objective, grounded
# preconditions (which role is signed on, device state, one concrete menu item/action example),
# one predicate per THEN/AND line, CloudFare audit step kept where present, no [Automatable] line.
# Scope: Functional sections Operator / Supervisor / Technician / Administrator.
# (Comms & Status and Revenue Allocation held only already-grounded new cases id>=4103473 — skipped.)
# Push with --update; do NOT create new cases.
suite: GG - POS - Claude Suite
suite_id: 30253
defaults:
  template_id: 1
  custom_devtypes: [5]
  custom_autoconfirmation: false
  custom_revstatus: 2

sections:
  # ============================================================ OPERATOR
  - path: [Functional, Operator, Options]
    cases:
      - title: Operator Options — correct options listed
        refs: [TIBU-22640]
        objective: This test is to confirm the Operator Options menu lists exactly the options an operator should have and does not show options that belong to another role or feature — in particular no 'Report Faulty Payment Device' entry.
        steps: |-
          **GIVEN** an operator is signed on to the POS at the main Operator menu
          **AND** the POS is a Way6 Android POS in a live operating mode (NIR, Ulsterbus or Metro)
          **AND** example: the operator opens Operator Options to review the listed entries
          **WHEN** the operator opens Operator Options
          **THEN** the expected operator options are listed
          **AND** no 'Report Faulty Payment Device' option is shown
        expected: "Operator Options shows the correct set of options, with no spurious 'Report Faulty Payment Device' entry (regression: TIBU-22640)."
      - title: Operator Options — cancel Soft Reset
        refs: [TIBU-24727]
        objective: This test is to confirm that choosing Soft Reset in Operator Options and then pressing Cancel on the confirmation returns the operator to the menu without performing a reset.
        steps: |-
          **GIVEN** an operator is signed on to the POS
          **AND** the operator has opened Operator Options and selected Soft Reset so the Soft Reset confirmation is displayed
          **AND** example: the operator decides not to reset and presses Cancel on the confirmation
          **WHEN** the operator presses Cancel on the Soft Reset confirmation
          **THEN** the POS returns to Operator Options
          **AND** no soft reset is performed
          **WHEN** the CloudFare activity log is checked
          **THEN** the corresponding event is recorded in the Back Office System (CloudFare) activity log
        expected: "Cancelling the Soft Reset confirmation leaves the POS in Operator Options without resetting (regression: TIBU-24727)."
      - title: Operator Options — brightness & volume
        refs: [TIBU-24869]
        objective: This test is to confirm an operator can adjust the screen brightness and the audio volume up and down from Operator Options, with each adjustment taking effect.
        steps: |-
          **GIVEN** an operator is signed on to the POS
          **AND** the operator has opened Operator Options showing the brightness and volume controls
          **AND** example: the operator raises then lowers brightness, then raises then lowers volume
          **WHEN** the operator increases and then decreases the screen brightness
          **THEN** the brightness changes accordingly
          **WHEN** the operator increases and then decreases the audio volume
          **THEN** the volume changes accordingly
        expected: "Brightness and volume can both be increased and decreased from Operator Options (regression: TIBU-24869)."

  - path: [Functional, Operator, Break Mode]
    cases:
      - title: Operator Break — enter Break
        refs: [TIBU-24335, TIBU-24879, TIBU-30633]
        objective: This test is to confirm that selecting Operator Break prompts for confirmation and, once confirmed, puts the POS into Break mode showing the correct Break screen with correctly spelled wording and no Bus number.
        steps: |-
          **GIVEN** an operator is signed on to the POS and in service
          **AND** the POS is a Way6 Android POS in a live operating mode
          **AND** example: the operator takes a break mid-shift and selects Operator Break
          **WHEN** the operator selects Operator Break
          **THEN** a Break confirmation screen is shown
          **WHEN** the operator confirms
          **THEN** the POS enters Break mode showing the Break screen
          **AND** the Break screen does not show a Bus number
          **AND** all on-screen text is spelled correctly
          **WHEN** the CloudFare activity log is checked
          **THEN** the corresponding event is recorded in the Back Office System (CloudFare) activity log
        expected: "Entering Break shows a confirmation screen, then the Break screen with no Bus number and correctly spelled text (regression: TIBU-24335, TIBU-24879, TIBU-30633)."
      - title: Operator Break — leave Break
        objective: This test is to confirm an operator can manually leave Break mode and return to the Operator menu in service.
        steps: |-
          **GIVEN** the POS is in Operator Break mode with an operator signed on
          **AND** example: the operator ends the break and selects to leave Break
          **WHEN** the operator leaves Break manually
          **THEN** the POS returns to the Operator menu
          **WHEN** the CloudFare activity log is checked
          **THEN** the corresponding event is recorded in the Back Office System (CloudFare) activity log
        expected: Leaving Break returns the POS to the Operator menu, in service.

  - path: [Functional, Operator, Ticket History]
    cases:
      - title: Ticket History — view, detail and paging
        refs: [TIBU-23091, TIBU-24332, TIBU-24329]
        objective: This test is to confirm an operator can open Ticket History to see the tickets issued this shift, open a single ticket to view its detail, and page through the list when it spans more than one page — with the POS not rebooting.
        steps: |-
          **GIVEN** an operator is signed on to the POS
          **AND** the operator has issued several tickets this shift so Ticket History has more entries than fit on one page
          **AND** example: the operator opens Ticket History, taps one issued ticket, then pages down the list
          **WHEN** the operator opens Ticket History
          **THEN** the issued tickets are listed
          **WHEN** the operator selects a ticket
          **THEN** the ticket detail is displayed
          **WHEN** the operator pages the list
          **THEN** further tickets are shown
          **AND** the POS does not reboot
        expected: "Ticket History lists issued tickets, shows a selected ticket's detail, and pages through the list without the POS rebooting (regression: TIBU-23091, TIBU-24332, TIBU-24329)."

  - path: [Functional, Operator, Totals]
    cases:
      - title: Totals — view & print
        refs: [TIBU-20914]
        objective: This test is to confirm an operator can view their running shift totals on screen and print them without triggering a fatal error.
        steps: |-
          **GIVEN** an operator is signed on to the POS with sales recorded this shift
          **AND** the POS has paper loaded ready to print
          **AND** example: the operator selects Totals to review the shift, then prints the totals slip
          **WHEN** the operator selects Totals
          **THEN** the operator's shift totals are displayed
          **WHEN** the operator prints the totals
          **THEN** the totals print without a fatal error
        expected: "The operator's totals are displayed and printed with no fatal error (regression: TIBU-20914)."

  # ============================================================ SUPERVISOR
  - path: [Functional, Supervisor, Reports & Information]
    cases:
      - title: Supervisor — Duty Information
        refs: [TIBU-21110, TIBU-21138, TIBU-21323, TIBU-21325, TIBU-27443, TIBU-21367, TIBU-22643]
        objective: This test is to confirm a Supervisor can open Duty Information, read it with correct headings and wording, and scroll through the individual duties using the chevron keys — without the POS resetting.
        steps: |-
          **GIVEN** a supervisor is signed on to the POS
          **AND** there are recorded duties for the day to display
          **AND** example: the supervisor opens Duty Information and uses the chevron keys to step through each duty
          **WHEN** the supervisor opens Duty Information
          **THEN** the Duty Information is displayed
          **AND** the headings, text and chevron-key instructions are correct
          **AND** the POS does not reset
          **WHEN** the supervisor selects a duty and scrolls with the chevron keys
          **THEN** each individual duty's details can be viewed
        expected: "Duty Information opens with correct text and chevron-key instructions, shows each duty's details on selection, scrolls, and never resets the POS (regression: TIBU-21110, TIBU-21138, TIBU-21323, TIBU-21325, TIBU-27443, TIBU-21367, TIBU-22643)."
      - title: Supervisor — Day Information
        refs: [TIBU-24785, TIBU-22647]
        objective: This test is to confirm a Supervisor can view Day Information (with chevron-key instructions) and print it, and that the printout shows the correct number of shifts for the day.
        steps: |-
          **GIVEN** a supervisor is signed on to the POS
          **AND** the POS has paper loaded ready to print
          **AND** example: a day with two operator shifts on this POS, viewed then printed
          **WHEN** the supervisor opens Day Information
          **THEN** the Day Information is displayed
          **AND** the chevron-key instructions are shown
          **WHEN** the supervisor prints it
          **THEN** the printout shows the correct number of shifts
        expected: "Day Information is viewed (with chevron instructions) and printed with the correct number of shifts (regression: TIBU-24785, TIBU-22647)."
      - title: Supervisor — Sales Breakdown
        refs: [TIBU-19682, TIBU-23936]
        objective: This test is to confirm a Supervisor can view and print the Sales Breakdown, that the printed figures are correct, and that the printout contains no stray content.
        steps: |-
          **GIVEN** a supervisor is signed on to the POS
          **AND** the POS has paper loaded and sales recorded this shift
          **AND** example: the supervisor opens Sales Breakdown and prints it to check the day's figures
          **WHEN** the supervisor opens Sales Breakdown
          **THEN** the Sales Breakdown is displayed
          **WHEN** the supervisor prints the Sales Breakdown
          **THEN** the Sales Breakdown is printed
          **AND** the printout shows the correct sales information
          **AND** the printout does not include stray 'Paper' content
        expected: "Sales Breakdown displays and prints the correct sales information with no stray content (regression: TIBU-19682, TIBU-23936)."
      - title: Supervisor — Print & Zero
        refs: [TIBU-24786]
        objective: This test is to confirm Print & Zero (Current or Accumulated) asks for confirmation before zeroing, prints the full report contents, and resets the totals to zero when confirmed.
        steps: |-
          **GIVEN** a supervisor is signed on to the POS
          **AND** the POS has paper loaded and totals accumulated from the shift
          **AND** example: the supervisor runs Print and Zero Current at end of shift and confirms Yes
          **WHEN** the supervisor selects Print and Zero (Current or Accumulated)
          **THEN** a confirmation prompt asks whether to zero the totals after printing
          **WHEN** the supervisor confirms Yes
          **THEN** the report is printed
          **AND** the totals are reset to zero
          **AND** the printout includes operator no., POS no., sign-on/off times, tickets sold, revenue, misc revenue, smartcard validations, annulled tickets, first/last ticket numbers and per-ticket detail
          **WHEN** the CloudFare activity log is checked
          **THEN** the corresponding event is recorded in the Back Office System (CloudFare) activity log
        expected: "Print & Zero confirms before zeroing, prints the full report (operator/POS/times/tickets/revenue/validations/annulments/ticket detail) and resets the totals (regression: TIBU-24786)."

  - path: [Functional, Supervisor, Versions & Comms]
    cases:
      - title: Supervisor — Versions
        refs: [TIBU-15782]
        objective: This test is to confirm a Supervisor can view and print the serial numbers, software versions and configuration-data versions, and that the real version numbers are shown rather than placeholders.
        steps: |-
          **GIVEN** a supervisor is signed on to the POS
          **AND** the POS has paper loaded ready to print
          **AND** example: the supervisor opens Versions to record the current software and config versions
          **WHEN** the supervisor opens Versions and views the serial, software and configuration versions
          **THEN** each version set is displayed with the real version numbers
          **AND** each version set can be printed
        expected: "Serial, software and configuration versions show the real numbers and can be printed (regression: TIBU-15782)."
      - title: Supervisor — Force Comms
        objective: This test is to confirm a Supervisor can initiate a POS-initiated Force Comms, refresh it, and exit back to the Supervisor menu.
        steps: |-
          **GIVEN** a supervisor is signed on to the POS
          **AND** the POS is communicating with CloudFare
          **AND** example: the supervisor forces a call-in to pull the latest data, refreshes it, then exits
          **WHEN** the supervisor initiates a POS-initiated Force Comms
          **THEN** the communication is performed
          **WHEN** the supervisor refreshes and then exits Force Comms
          **THEN** the supervisor returns to the Supervisor menu
          **WHEN** the CloudFare activity log is checked
          **THEN** the corresponding event is recorded in the Back Office System (CloudFare) activity log
        expected: Force Comms can be initiated, refreshed and exited cleanly from the Supervisor menu.

  # ============================================================ TECHNICIAN
  - path: [Functional, Technician, Device Settings]
    cases:
      - title: Technician — Device Settings
        refs: [TIBU-16044, TIBU-16228, TIBU-20967, TIBU-24866]
        objective: This test is to confirm a Technician can change the Home Location, Boarding Location, Mounting Point and Tray Identifier, that each change is saved and retained, and that the Tray Identifier is stored with its "AT" prefix.
        steps: |-
          **GIVEN** a technician is signed on to the POS in Device Settings
          **AND** example: setting Home Location OM, a boarding location, a mounting point, and Tray Identifier "AT01"
          **WHEN** the technician changes the Home Location, Boarding Location, Mounting Point and Tray Identifier
          **THEN** each setting is updated
          **AND** each setting is retained after leaving and reopening Device Settings
          **AND** the Tray Identifier is stored with its "AT" prefix
        expected: "All device settings can be changed and persist, with the Tray Identifier stored prefixed 'AT' (regression: TIBU-16044, TIBU-16228, TIBU-20967, TIBU-24866)."
      - title: Technician — Display Settings
        refs: [TIBU-21129]
        objective: This test is to confirm the Display Settings screen shows the current level as the Technician adjusts it, so the setting being changed is always clear.
        steps: |-
          **GIVEN** a technician is signed on to the POS
          **AND** example: the technician opens Display Settings and steps the brightness level up and down
          **WHEN** the technician opens Display Settings and adjusts the level
          **THEN** the screen indicates the current level
        expected: "Display Settings clearly indicates the current level while it is being adjusted (regression: TIBU-21129)."
      - title: Technician — set Default Boarding Stage
        objective: This test is to confirm a Technician can set the Default Boarding Stage in Device Settings and that the new default is then applied to subsequent bus fare look-ups.
        steps: |-
          **GIVEN** a technician is signed on to the POS in Device Settings
          **AND** the POS is in a bus operating mode (Ulsterbus) that performs fare look-ups
          **AND** example: setting the default boarding stage for the OM (Omagh) home location
          **WHEN** the technician sets the Default Boarding Stage
          **THEN** the Default Boarding Stage is saved
          **AND** subsequent bus fare look-ups use the new default boarding stage
        expected: The Default Boarding Stage can be set in Technician Device Settings and is applied to later bus fare look-ups.

  - path: [Functional, Technician, Maintenance]
    cases:
      - title: Technician — Force Comms
        refs: [TIBU-21096]
        objective: This test is to confirm a Technician can run Force Comms end to end — initiate, refresh and exit — with no fatal error at any step.
        steps: |-
          **GIVEN** a technician is signed on to the POS
          **AND** the POS is communicating with CloudFare
          **AND** example: the technician forces a call-in to verify comms, refreshes it, then exits
          **WHEN** the technician initiates, refreshes and exits Force Comms
          **THEN** each action completes successfully
          **AND** no fatal error occurs
          **WHEN** the CloudFare activity log is checked
          **THEN** the corresponding event is recorded in the Back Office System (CloudFare) activity log
        expected: "Technician Force Comms completes initiate, refresh and exit with no fatal error (regression: TIBU-21096)."
      - title: Technician — Soft Reboot
        refs: [TIBU-29752]
        objective: This test is to confirm a Technician Soft Reboot performed during an active shift restarts the POS cleanly and recovers the session state after the restart.
        steps: |-
          **GIVEN** a technician is signed on to the POS during an active shift
          **AND** the shift has recorded transactions that must survive the restart
          **AND** example: the technician performs a Soft Reboot mid-shift to clear a fault
          **WHEN** the technician performs a Soft Reboot
          **THEN** the POS restarts cleanly
          **AND** the POS recovers to a valid state after the restart
          **WHEN** the CloudFare activity log is checked
          **THEN** the corresponding event is recorded in the Back Office System (CloudFare) activity log
        expected: "A Soft Reboot during a shift restarts the POS cleanly and recovers the session state correctly (regression: TIBU-29752)."
      - title: Technician — Network Settings
        refs: [TIBU-24740, TIBU-26905]
        objective: This test is to confirm a Technician can open Network Settings and change the Ethernet setting, and that the change is applied and retained when the page is reopened.
        steps: |-
          **GIVEN** a technician is signed on to the POS and on the Network Settings page
          **AND** example: switching the Ethernet setting and reopening the page to confirm it stuck
          **WHEN** the technician changes the Ethernet setting
          **THEN** the Ethernet setting is updated
          **AND** the change is applied and retained after the page is reopened
        expected: "Network settings, including the Ethernet setting, can be changed and the change is applied and retained (regression: TIBU-24740, TIBU-26905)."
      - title: Technician — Versions
        refs: [TIBU-15782]
        objective: This test is to confirm a Technician can view and print the serial numbers, software versions and configuration-data versions, and that the real version numbers are shown.
        steps: |-
          **GIVEN** a technician is signed on to the POS
          **AND** the POS has paper loaded ready to print
          **AND** example: the technician opens Versions to confirm the deployed software version
          **WHEN** the technician views and prints the serial, software and configuration versions
          **THEN** each version set is displayed with the real version numbers
          **AND** each version set can be printed
        expected: "Serial, software and configuration versions show the real numbers and can be printed (regression: TIBU-15782)."
      - title: Technician — Status panels
        objective: This test is to confirm a Technician can open each device status panel — Device Status, Other Devices, Card Reader and Paper Status — and that each shows its relevant status information.
        steps: |-
          **GIVEN** a technician is signed on to the POS
          **AND** example: the technician reviews Device Status, then Other Devices, Card Reader and Paper Status while diagnosing the POS
          **WHEN** the technician opens the Device Status panel
          **THEN** the Device Status panel displays its status information
          **WHEN** the technician opens the Other Devices, Card Reader and Paper Status panels
          **THEN** each panel displays its relevant status information
        expected: All Technician status panels (Device Status, Other Devices, Card Reader, Paper Status) display correctly.
      - title: Technician — card reader test
        refs: [TIBU-24792]
        objective: This test is to confirm the Technician 'Please Present Smartcard to Test' screen reports the card-read result correctly when a card is presented, and that the read is reflected in the back-office systems.
        steps: |-
          **GIVEN** a technician is signed on to the POS on the card-reader test screen
          **AND** a valid test smartcard is available to present
          **AND** example: the technician presents the test smartcard to confirm the reader is healthy
          **WHEN** the technician presents a smartcard to the test screen
          **THEN** the test screen reports the card-read result correctly
          **WHEN** the CloudFare activity log is checked
          **THEN** the corresponding event is recorded in the Back Office System (CloudFare) activity log
          **WHEN** the data is reviewed in MERIT
          **THEN** the transaction appears in MERIT
          **WHEN** the smartcard record is reviewed in SmartTrack
          **THEN** the updated smartcard record appears in SmartTrack
        expected: "The Present Smartcard test screen correctly reports the card-read result, and the read is reflected in CloudFare, MERIT and SmartTrack (regression: TIBU-24792)."
      - title: Technician — menu options
        refs: [TIBU-22649]
        objective: This test is to confirm the Technician menu lists only the intended options, with no extra or out-of-role entries.
        steps: |-
          **GIVEN** a technician is signed on to the POS
          **AND** example: the technician views the Technician menu to confirm the listed entries
          **WHEN** the technician views the Technician menu
          **THEN** only the intended options are listed
        expected: "The Technician menu shows only the intended options, with no extras (regression: TIBU-22649)."
      - title: Technician — change operating mode
        refs: [TIBU-24868]
        objective: This test is to confirm a Technician can change the device operating mode from the Technician menu and that the POS switches to the selected mode.
        steps: |-
          **GIVEN** a technician is signed on to the POS
          **AND** the POS supports the NIR, Ulsterbus and Metro operating modes
          **AND** example: switching the POS from Ulsterbus to NIR (rail) mode
          **WHEN** the technician changes the operating mode from the Technician menu
          **THEN** the POS switches to the selected operating mode
        expected: "The operating mode can be changed from the Technician menu (regression: TIBU-24868)."
      - title: Technician — Paper Status back key
        refs: [TIBU-23928]
        objective: This test is to confirm that pressing Back on the Paper Status screen returns the Technician to the previous screen cleanly, with no fatal error.
        steps: |-
          **GIVEN** a technician is signed on to the POS on the Paper Status screen
          **AND** example: the technician checks Paper Status then presses Back to return to the status panels
          **WHEN** the technician presses Back
          **THEN** the technician returns to the previous screen
          **AND** no fatal error occurs
        expected: "Back from Paper Status returns cleanly to the previous screen with no fatal error (regression: TIBU-23928)."

  - path: [Functional, Technician, Display]
    cases:
      - title: Display — clock shows correct 24-hour time
        refs: [TIBU-19560, TIBU-21411]
        objective: This test is to confirm the POS on-screen clock shows the correct local time in 24-hour format — not 12-hour and not an hour out.
        steps: |-
          **GIVEN** the POS is powered on and time-synced
          **AND** example: viewing the clock at a known wall-clock time to confirm it matches local time
          **WHEN** the operator views the on-screen clock
          **THEN** the time is shown in 24-hour format
          **AND** the time is correct for the local time zone (not an hour out)
        expected: "The clock displays the correct local time in 24-hour format, not 12-hour and not an hour out (regression: TIBU-19560, TIBU-21411)."

  - path: [Functional, Technician, TMS Updates]
    cases:
      - title: TMS — application update
        objective: This test is to confirm an application update delivered via TMS downloads and applies successfully, reports the new version, loses no transaction data, and raises an audit event.
        steps: |-
          **GIVEN** an application update has been published to the POS via TMS
          **AND** the POS has queued transactions or unsent data that must survive the update
          **AND** example: a new POS application build pushed from TMS to this device
          **WHEN** the POS downloads and applies the update
          **THEN** the update is applied successfully
          **AND** the new application version is shown in Technician → Versions
          **AND** no queued transactions or unsent data are lost
          **AND** an update audit event is recorded
        expected: A TMS application update applies, shows the new version in Versions, preserves transaction data and raises an audit event.
      - title: TMS — topology update
        objective: This test is to confirm a topology/configuration update delivered via TMS downloads and applies successfully, reports the new version, loses no transaction data, and raises an audit event.
        steps: |-
          **GIVEN** a topology/configuration update has been published to the POS via TMS
          **AND** the POS has queued transactions or unsent data that must survive the update
          **AND** example: an updated fares/topology configuration pushed from TMS to this device
          **WHEN** the POS downloads and applies the update
          **THEN** the update is applied successfully
          **AND** the new configuration/topology version is shown in Technician → Versions
          **AND** no queued transactions or unsent data are lost
          **AND** an update audit event is recorded
          **WHEN** the CloudFare activity log is checked
          **THEN** the corresponding event is recorded in the Back Office System (CloudFare) activity log
        expected: A TMS topology update applies, shows the new version in Versions, preserves transaction data and raises an audit event.

  # ============================================================ ADMINISTRATOR
  - path: [Functional, Administrator, Card Management]
    cases:
      - title: Administrator — Clear Card
        objective: This test is to confirm an Administrator can clear a valid smartcard successfully, and that attempting to clear an invalid card is reported as unsuccessful with a card error.
        steps: |-
          **GIVEN** an administrator is signed on to the POS in Card Management
          **AND** a valid smartcard and an unreadable/invalid card are available to present
          **AND** example: clearing a valid staff test card, then presenting a damaged card
          **WHEN** the administrator clears a valid card
          **THEN** the card is cleared
          **AND** success is reported
          **WHEN** the administrator attempts to clear an invalid card
          **THEN** the operation is reported as unsuccessful with a card error
        expected: A valid card clears successfully and an invalid card reports a Card Error.
      - title: Administrator — Card Dump
        objective: This test is to confirm an Administrator can read (dump) the data from a valid smartcard successfully, and that attempting to dump an invalid card is reported as unsuccessful.
        steps: |-
          **GIVEN** an administrator is signed on to the POS in Card Management
          **AND** a valid smartcard and an unreadable/invalid card are available to present
          **AND** example: dumping a valid staff test card, then presenting a damaged card
          **WHEN** the administrator dumps a valid card
          **THEN** the card data is read
          **AND** success is reported
          **WHEN** the administrator attempts to dump an invalid card
          **THEN** the operation is reported as unsuccessful
        expected: A valid card dump succeeds and an invalid card reports unsuccessful.
      - title: Administrator — Data Download
        objective: This test is to confirm an Administrator can perform a Data Download and receive the 'Data Download Successful' confirmation.
        steps: |-
          **GIVEN** an administrator is signed on to the POS in Card Management
          **AND** the POS is communicating with CloudFare
          **AND** example: the administrator triggers a Data Download to refresh the device data set
          **WHEN** the administrator performs a Data Download
          **THEN** the data is downloaded
          **AND** a 'Data Download Successful' confirmation is shown
        expected: Data Download completes and shows the 'Data Download Successful' confirmation.

  - path: [Functional, Administrator, Device & Network]
    cases:
      - title: Administrator — Device Settings
        refs: [TIBU-22632]
        objective: This test is to confirm an Administrator can set the device settings — Home Location, Boarding Location, Mounting Point and Tray Identifier — that each is retained, and that the default Boarding Stage and Mounting Point are correct.
        steps: |-
          **GIVEN** an administrator is signed on to the POS in Device Settings
          **AND** example: setting Home Location OM, a boarding location, mounting point and Tray Identifier "AT01"
          **WHEN** the administrator changes the Home Location, Boarding Location, Mounting Point and Tray Identifier
          **THEN** each setting is updated
          **AND** each setting is retained after leaving and reopening Device Settings
          **AND** the default Boarding Stage and Mounting Point are correct
        expected: "Device settings change and persist, with the correct default Boarding Stage and Mounting Point (regression: TIBU-22632)."
      - title: Administrator — Network Settings
        refs: [TIBU-24740]
        objective: This test is to confirm the Administrator Network Settings screen responds to input and applies the change made.
        steps: |-
          **GIVEN** an administrator is signed on to the POS
          **AND** example: the administrator opens Network Settings and changes a network value
          **WHEN** the administrator opens Network Settings and changes a setting
          **THEN** the screen responds to the input
          **AND** the change is applied
        expected: Administrator Network Settings respond to input and apply the change.
      - title: Administrator — Force Comms
        objective: This test is to confirm an Administrator can initiate a Force Comms, refresh it, and exit back to the Administrator menu.
        steps: |-
          **GIVEN** an administrator is signed on to the POS
          **AND** the POS is communicating with CloudFare
          **AND** example: the administrator forces a call-in to pull the latest data, refreshes it, then exits
          **WHEN** the administrator initiates, refreshes and exits Force Comms
