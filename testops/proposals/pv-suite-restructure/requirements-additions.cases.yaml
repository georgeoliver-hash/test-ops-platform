# Translink PV — requirement-grounded additions (suite 30255)
# Authored 2026-07-16 from the PV cross-examination gap report
# (proposals/translink-requirements-review/gaps-pv.md) to close MISSING / STALE-or-WRONG
# findings. NEW cases only — nothing here edits an existing case.
#
# Each case carries a CONCRETE worked example (real barcode class / FEIG token / rail stop /
# card / product id / device IP) in its Preconditions per docs/gherkin-standard.md
# ("Concrete grounding"); titles/When/Then stay behaviour-level. One predicate per THEN line.
#
# Supersedes note: the live case C4101005 ("single-use barcode validates on the PV") is WRONG
# per FBD-100167 §Scope and FBD-100317 §matrix — the PV validates MULTIPLE-use barcodes ONLY and
# must REJECT single-use with "This Barcode Type is not accepted on this device". The correct
# behaviour is authored below as "Single-Use Barcode — rejected as not accepted on this device".
# C4101005 should be flagged ZZ_DELETE / superseded in the old suite by a human — NOT edited here.
suite_id: 30255
defaults:
  template_id: 1
  custom_devtypes: [10]
  custom_autoconfirmation: false
  custom_revstatus: 2
sections:
  # ───────────────────── Barcode Validation ─────────────────────
  - path: [Functional, Barcode Validation]
    cases:
      - title: Single-Use Barcode — rejected as not accepted on this device
        refs: [FBD-100167, FBD-100317]
        objective: This test is to confirm the PV rejects a single-use barcode because the PV validates multiple-use barcodes only.
        steps: |-
          **GIVEN** a PV is in service with its barcode reader armed
          **AND** the PV validates multiple-use barcodes only (single-use is validated by POS and TVM, never the PV)
          **AND** example media: a Corethree single-use Walk-up (type W) barcode, Scheme ID 5720
          **WHEN** a passenger presents the single-use barcode to the PV reader
          **THEN** the barcode is rejected
          **AND** the screen shows "This Barcode Type is not accepted on this device"
          **AND** no successful validation is recorded
        expected: A single-use barcode is rejected on the PV with "This Barcode Type is not accepted on this device"; the PV validates multiple-use only. This is the correct behaviour that supersedes C4101005.
      - title: Multiple-Use Barcode — a valid barcode shows the green success result
        refs: [FBD-100167]
        objective: This test is to confirm the PV validates a valid multiple-use barcode and shows the green success result state.
        steps: |-
          **GIVEN** a PV is in service with its barcode reader armed
          **AND** example media: a Corethree mLink multiple-use barcode (format 02, Scheme ID 5720, mode BUS 0001) for a valid in-date product, presented on the signed-on route between its boarding and alighting stops
          **WHEN** the passenger presents the valid multiple-use barcode
          **THEN** the PV displays a green-tick success result
          **AND** a success audio tone is played
        expected: A valid multiple-use barcode validates on the PV with a green-tick result and success tone.
      - title: Multiple-Use Barcode — an invalid barcode shows the red failure result
        refs: [FBD-100167]
        objective: This test is to confirm the PV rejects an invalid multiple-use barcode and shows the red failure result state.
        steps: |-
          **GIVEN** a PV is in service with its barcode reader armed
          **AND** example media: a Corethree multiple-use barcode (format 02, Scheme ID 5720) whose expiry has passed, so the current time is later than its encoded End time
          **WHEN** the passenger presents the expired multiple-use barcode
          **THEN** the PV displays a red-cross failure result
          **AND** the screen shows the failure reason
        expected: An expired (invalid) multiple-use barcode is rejected on the PV with a red-cross result and a stated reason.
  # ───────────────────── Pilot List ─────────────────────
  - path: [Functional, Pilot List]
    cases:
      - title: Pilot List — an enrolled FEIG token validates and audits normally
        refs: [FBD-100720]
        objective: This test is to confirm a PV in pilot mode validates an enrolled cEMV card and audits it via the normal ABT flow.
        steps: |-
          **GIVEN** a PV deployed with Enable Pilot List = True and a topology that has ABT enabled via the ABT Type route attribute
          **AND** example media: a cEMV card whose FEIG token is present in the imported pilotlist.dat
          **WHEN** the passenger taps the enrolled card
          **THEN** the PV proceeds down the normal cEMV success flow
          **AND** an ABT audit record is generated for the tap
        expected: An enrolled FEIG token passes the pilot-list check and follows the normal cEMV success-and-audit flow.
      - title: Pilot List — a non-enrolled token is rejected with no audit event
        refs: [FBD-100720]
        objective: This test is to confirm a PV in pilot mode rejects a card whose FEIG token is not on the pilot list and performs no auditing.
        steps: |-
          **GIVEN** a PV deployed with Enable Pilot List = True and ABT enabled via the ABT Type route attribute
          **AND** example media: a cEMV card whose FEIG token is NOT in the imported pilotlist.dat
          **WHEN** the passenger taps the non-enrolled card
          **THEN** the PV shows the standard rejection screen
          **AND** no ABT audit event is generated for the tap
        expected: A non-enrolled FEIG token is rejected with the standard rejection screen and NO audit event — the key negative assertion.
      - title: Pilot Registration — the registration file uploads once per day at End-of-Day
        refs: [FBD-100720]
        objective: This test is to confirm the PV uploads its pilot registration file once per day at End-of-Day rather than in real time.
        steps: |-
          **GIVEN** a PV in registration mode (Enable Registration Mode = True, Enable Pilot List = False)
          **AND** example: several cEMV cards tapped during the day, each capturing its FEIG token into the on-device pilot registration file
          **WHEN** the configured End-of-Day time is reached
          **THEN** the registration file is uploaded as a zip to CloudFare Device Logging
          **AND** the file is not uploaded in real time as tokens are captured
        expected: The pilot registration file uploads as a zip to CloudFare Device Logging once per day at End-of-Day, not in real time.
  # ───────────────────── ABT Audit ─────────────────────
  - path: [Functional, ABT Audit]
    cases:
      - title: NIR Audit — a rail TOTO tap posts a conformant PV audit record
        refs: [FBD-100690, FBD-100658]
        objective: This test is to confirm a rail tap on a NIR PV posts an ABT audit record with the TOTO structure, single location, and the constant ABT fields.
        steps: |-
          **GIVEN** a NIR PV whose home-location first route carries ABT Type "Tap On Tap Off" and whose boarding location is within the Northern Ireland Zone
          **AND** example tap: a cEMV card tapped at Lanyon Place against the configured "ABT Tap Product Name" product (product id 6000)
          **WHEN** the tap posts its ABT audit record to CloudFare
          **THEN** the record uses the TotoTap/Location structure with a single tap location
          **AND** the product id is 6000
          **AND** the paymentType is "ABT"
          **AND** the revenue is 0
        expected: A NIR PV rail tap audits as a TOTO record with a single Location, product id 6000, paymentType "ABT", and revenue 0.
  # ───────────────────── Legacy Smartcard Transfer ─────────────────────
  - path: [Functional, Legacy Transfer]
    cases:
      - title: Legacy Transfer — decided by the product Transfer Time, not a route property
        refs: [FBD-100271]
        objective: This test is to confirm the PV decides transfer-versus-journey using the PRODUCT Transfer Time property, not a route property.
        steps: |-
          **GIVEN** a PV validating a legacy rail smartcard whose product Transfer Time is 90 minutes
          **AND** example card: an iLink Zone 4 smartcard first validated at Botanic, then re-presented at Lanyon Place 20 minutes later, inside the LastValidated + Transfer Time window
          **WHEN** the card is re-presented inside the transfer window
          **THEN** the PV records a transfer with no journey deducted
          **AND** a WTS SmartTransfer transaction is audited
        expected: Inside the product Transfer Time window the PV records a transfer (no journey deducted) and audits a WTS SmartTransfer transaction, using the product property.
      - title: Legacy Transfer — re-validation outside the product Transfer Time counts as a journey
        refs: [FBD-100271]
        objective: This test is to confirm a re-validation outside the product Transfer Time window is charged as a journey on the PV.
        steps: |-
          **GIVEN** a PV validating a legacy rail smartcard whose product Transfer Time is 90 minutes
          **AND** example card: an iLink Zone 4 smartcard first validated at Botanic, then re-presented at Lanyon Place 100 minutes later, outside the LastValidated + Transfer Time window
          **WHEN** the card is re-presented outside the transfer window
          **THEN** the PV deducts a journey
          **AND** a WTS SmartUse transaction is audited
        expected: Outside the product Transfer Time window the PV deducts a journey and audits a WTS SmartUse transaction.
  # ───────────────────── Comms (SaaS network impact) ─────────────────────
  - path: [Non-Functional, Comms]
    cases:
      - title: Comms Lock — a sustained network outage drives the PV out of service
        refs: [FBD-100359]
        objective: This test is to confirm an Ethernet PV enters a communication-locked, out-of-service state after a sustained Translink-network loss.
        steps: |-
          **GIVEN** an Ethernet PV routed to AWS through the Translink network (static IP 192.168.3.10)
          **AND** the Translink-network connection is lost and stays down for a significant period
          **WHEN** the outage is sustained beyond the device's offline tolerance
          **THEN** the PV enters a communication-locked, out-of-service state
          **AND** the PV stops accepting taps
        expected: A sustained Translink-network outage drives the Ethernet PV into a communication-locked, out-of-service state.
      - title: Comms Recovery — transactions queued during an outage are delivered on restore
        refs: [FBD-100359]
        objective: This test is to confirm the PV queues transactions taken during a network outage and delivers them once the network is restored.
        steps: |-
          **GIVEN** an Ethernet PV that took taps while the Translink-network connection was down
          **AND** the taps were queued on-device with no data loss
          **WHEN** the Translink-network connection is restored
          **THEN** the queued transactions are delivered to the back office
          **AND** no queued transaction is lost
        expected: Transactions queued on the PV during the outage are delivered to the back office on network restore with no data loss.
