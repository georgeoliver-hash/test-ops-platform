# PV — ABT/cEMV (Glider) + Barcodes + Legacy & Card Tech (Functional).
# Multi-Use Barcodes is in the live regression (NIR, 21); ABT/cEMV/Legacy = added coverage beyond the
# live regression (find more bugs). Grounded in old suite 10047 Functional/ABT, Multi-Use Barcodes,
# Legacy Support, Glider TOO sections.
suite_id: 30255
defaults:
  template_id: 1
  custom_autoconfirmation: false
  custom_devtypes: [10]
  custom_revstatus: 2

sections:
  - path: Functional / ABT (Glider)
    cases:
      - title: ABT — contactless tap validation
        objective: This test is to confirm a valid contactless payment card is accepted for an ABT tap on a Glider PV.
        steps: |
          **Given** a Glider PV has ABT/cEMV enabled and is showing the Present screen
          **WHEN** a valid contactless payment card or device is presented
          **THEN** the tap is accepted for the journey
          **AND** the success outcome is shown to the passenger
        expected: A valid contactless tap is accepted with a success outcome. Variation — Visa, Mastercard, mobile wallet.
      - title: ABT — declined or errored tap
        objective: This test is to confirm a declined or errored ABT tap shows the correct outcome.
        steps: |
          **Given** a Glider PV has ABT/cEMV enabled
          **WHEN** a card that is declined, expired or mis-read is presented
          **THEN** the tap is rejected
          **AND** the See Driver / decline outcome is shown
        expected: Declined/errored taps are rejected with the See Driver/decline outcome.
      - title: ABT — BIN, Deny and Pilot list handling
        objective: This test is to confirm cards on the BIN, Deny and Pilot lists are handled correctly.
        steps: |
          **Given** a Glider PV has the BIN, Deny and Pilot lists applied
          **WHEN** a card on the Deny or BIN list is presented
          **THEN** the tap is rejected per the list rules
          **WHEN** a card on the Pilot list is presented
          **THEN** the tap is handled per the pilot rules
        expected: Deny/BIN-listed cards are rejected; Pilot-list cards follow the pilot rules.
      - title: cEMV — tap enablement by route, location and fare
        objective: This test is to confirm cEMV taps are enabled only where the route attribute, location and fare checks permit.
        steps: |
          **Given** a Glider PV uses route-attribute, location and fare checks to enable cEMV
          **WHEN** the PV is in a context where all checks pass
          **THEN** cEMV taps are enabled
          **WHEN** any of the route, location or fare checks fail
          **THEN** cEMV taps are disabled in that context
        expected: cEMV is enabled only when route/location/fare checks pass, and disabled otherwise.
      - title: Glider TOO — tap-on-only flat-fare journeys
        objective: This test is to confirm tap-on-only flat-fare journeys and daily taps on a Glider PV.
        steps: |
          **Given** a Glider PV is on a Tap-On-Only flat-fare route
          **WHEN** a passenger taps on for a journey
          **THEN** a flat-fare journey is recorded
          **WHEN** the same passenger taps multiple times in a day
          **THEN** the daily tap and duplicate-tap rules are applied
        expected: TOO flat-fare journeys record correctly; daily and duplicate-tap rules apply.
      - title: Glider — transfers
        objective: This test is to confirm Glider transfer journeys are recognised within the transfer window.
        steps: |
          **Given** a passenger has tapped a first Glider journey
          **WHEN** they tap a connecting journey within the transfer window
          **THEN** the transfer is recognised per the transfer rules
        expected: Glider transfers are recognised within the transfer window.
      - title: ABT — end-to-end journey to back office
        objective: This test is to confirm an ABT journey is recorded and sent to the back office end-to-end.
        steps: |
          **Given** a Glider PV with ABT enabled and back-office comms available
          **WHEN** a passenger completes an ABT journey
          **THEN** the journey is recorded
          **AND** the journey is sent to the back office for settlement
        expected: An ABT journey is recorded and reaches the back office end-to-end.

  - path: Functional / Barcodes
    cases:
      - title: Barcode — single-use validation
        objective: This test is to confirm a single-use barcode validates when valid and is rejected with the reason when invalid.
        steps: |
          **Given** the PV is showing the Present SmartCard or Barcode screen
          **WHEN** a valid single-use barcode is presented
          **THEN** the barcode is validated
          **AND** the validation is recorded in the back office (CloudFare and MERIT)
          **WHEN** an invalid single-use barcode is presented
          **THEN** the barcode is rejected with the specific reason shown
        expected: Single-use barcodes validate when valid and reject with a reason when invalid (already used, expired, decryption failed, invalid product).
      - title: Barcode — multi-use validation
        objective: This test is to confirm a multi-use barcode validates and tracks its remaining uses, for HHD- and TVM-produced barcodes.
        steps: |
          **Given** the PV is showing the Present SmartCard or Barcode screen
          **WHEN** a valid multi-use barcode is presented
          **THEN** the barcode is validated
          **AND** a use is recorded
          **AND** the validation is recorded in the back office (CloudFare and MERIT)
          **WHEN** the barcode is presented beyond its allowed uses or is invalid
          **THEN** the barcode is rejected with the specific reason shown
        expected: Multi-use barcodes validate and decrement remaining uses; reject when exhausted/invalid. Variation — HHD-produced and TVM-produced. (In the live NIR regression.)

  - path: Functional / Legacy & Card Tech
    cases:
      - title: Legacy smartcard support
        objective: This test is to confirm the PV validates legacy journey-based and time-based smartcards.
        steps: |
          **Given** the PV is showing the Present SmartCard or Barcode screen
          **WHEN** a valid legacy journey-based or time-based smartcard is presented
          **THEN** the card is validated per its legacy rules
          **WHEN** an invalid legacy smartcard is presented
          **THEN** the card is rejected with the specific reason shown
        expected: Legacy journey-based and time-based smartcards validate/reject correctly.
      - title: Card technology — MIFARE and DESFire
        objective: This test is to confirm the PV reads and validates the supported card technologies.
        steps: |
          **Given** the PV is in service
          **WHEN** a MIFARE Classic EV1 or DESFire card is presented
          **THEN** the PV reads and validates the card per its type
          **AND** the validation is recorded in the back office (CloudFare, MERIT and SmartTrack)
        expected: The PV reads and validates the supported card technologies (MIFARE Classic EV1, DESFire).
      - title: Passback handling
        objective: This test is to confirm passback handling when a card is re-presented at the PV.
        steps: |
          **Given** a card has just been validated at the PV
          **WHEN** the same card is presented again within the passback window
          **THEN** passback is applied per the product rules
        expected: Passback is applied on re-presentation within the window (smartcard and payment card).
      - title: PV operating times
        objective: This test is to confirm the PV validates within its configured operating times and is out of service outside them.
        steps: |
          **Given** the PV has configured operating times
          **WHEN** a card is presented within the operating times
          **THEN** the card is validated normally
          **WHEN** a card is presented outside the operating times
          **THEN** the PV does not validate
          **AND** shows the out-of-service state
        expected: The PV validates within operating times and is out of service outside them.
