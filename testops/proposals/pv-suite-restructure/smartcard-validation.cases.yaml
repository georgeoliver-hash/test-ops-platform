# PV — Smartcard Validation + Validation Outcomes (Functional). Folds the ~800-case Glider/Rail
# validation matrix into one behaviour case per product family (valid + invalid), with the products,
# Adult/Child and (where relevant) zone as variation lines. Shared cases run under Glider + Rail
# Configurations; Rail-only behaviour is in its own section. Grounded in the old suite 10047 + the
# PV Validation UX screens (Not Valid At This Location / Invalid Time Of Day / Product Expired /
# Represent Card / Unable to Validate / Passback Journeys Left / Machine Not In Service).
suite_id: 30255
defaults:
  template_id: 1
  custom_autoconfirmation: false
  custom_devtypes: [10]
  custom_revstatus: 2

sections:
  - path: Functional / Smartcard Validation
    cases:
      - title: Validate a Concession SmartPass
        objective: This test is to confirm a concession SmartPass validates when valid and is rejected with the correct reason when invalid.
        steps: |
          **Given** the PV is in service showing the Present SmartCard or Barcode screen
          **WHEN** a valid concession SmartPass is presented
          **THEN** the card is validated
          **AND** the success outcome is shown
          **WHEN** an invalid concession SmartPass is presented
          **THEN** the card is rejected with the specific reason shown
        expected: Concession SmartPasses validate when valid and reject with a reason when invalid. Variation — 60+, Blind, Senior, ROI Senior, War Pensioner. Run under Glider and Rail.
      - title: Validate a Half-Fare SmartPass
        objective: This test is to confirm a Half-Fare SmartPass validates when valid and is rejected when invalid.
        steps: |
          **Given** the PV is in service showing the Present SmartCard or Barcode screen
          **WHEN** a valid Half-Fare SmartPass is presented
          **THEN** the card is validated
          **AND** the success outcome is shown
          **WHEN** an invalid Half-Fare SmartPass is presented
          **THEN** the card is rejected with the specific reason shown
        expected: Half-Fare SmartPasses validate/reject correctly. Variation — DLA, Learning Disability, No Driving Licence, PIPS, Partially Sighted. Run under Glider and Rail.
      - title: Validate a Metro Daylink smartcard
        objective: This test is to confirm a Metro Daylink smartcard validates when valid and is rejected when invalid.
        steps: |
          **Given** the PV is in service showing the Present SmartCard or Barcode screen
          **WHEN** a valid Metro Daylink smartcard is presented
          **THEN** the card is validated
          **AND** the success outcome is shown
          **WHEN** an invalid Metro Daylink smartcard is presented
          **THEN** the card is rejected with the specific reason shown
        expected: Metro Daylink validates/rejects correctly. Run for Adult and Child, under Glider and Rail.
      - title: Validate a Metro Multi-Journey smartcard
        objective: This test is to confirm a Metro Multi-Journey smartcard validates in its zone and is rejected out of zone or when invalid.
        steps: |
          **Given** the PV is in service showing the Present SmartCard or Barcode screen
          **WHEN** a valid Metro Multi-Journey smartcard is presented within its zone
          **THEN** the card is validated
          **AND** a journey is deducted with the passback rules applied
          **WHEN** the card is presented out of zone or is otherwise invalid
          **THEN** the card is rejected with the specific reason shown
        expected: Metro Multi-Journey validates within its zone and rejects out-of-zone/invalid. Variation — City, Inner, Extended zones; Adult and Child. Run under Glider and Rail.
      - title: Validate a Metro Travelcard
        objective: This test is to confirm a Metro Travelcard validates when valid and is rejected when invalid.
        steps: |
          **Given** the PV is in service showing the Present SmartCard or Barcode screen
          **WHEN** a valid Metro Travelcard is presented
          **THEN** the card is validated
          **AND** the success outcome is shown
          **WHEN** an invalid Metro Travelcard is presented
          **THEN** the card is rejected with the specific reason shown
        expected: Metro Travelcard validates/rejects correctly. Run for Adult and Child, under Glider and Rail.
      - title: Validate an Ulsterbus Multi-Journey smartcard
        objective: This test is to confirm an Ulsterbus Multi-Journey smartcard validates when valid and is rejected when invalid.
        steps: |
          **Given** the PV is in service showing the Present SmartCard or Barcode screen
          **WHEN** a valid Ulsterbus Multi-Journey smartcard is presented
          **THEN** the card is validated
          **AND** a journey is deducted with the passback rules applied
          **WHEN** an invalid Ulsterbus Multi-Journey smartcard is presented
          **THEN** the card is rejected with the specific reason shown
        expected: Ulsterbus Multi-Journey validates/rejects correctly. Run for Adult and Child, under Glider and Rail.
      - title: Validate an iLink smartcard
        objective: This test is to confirm an iLink smartcard (and Belfast Visitor Pass) validates in its zone and is rejected when invalid.
        steps: |
          **Given** the PV is in service showing the Present SmartCard or Barcode screen
          **WHEN** a valid iLink smartcard is presented within its zone
          **THEN** the card is validated
          **AND** the success outcome is shown
          **WHEN** the card is presented out of zone or is otherwise invalid
          **THEN** the card is rejected with the specific reason shown
        expected: iLink validates within zone and rejects invalid. Variation — Zones 1-4 and NW, plus Belfast Visitor Pass; Adult and Child. Run under Glider and Rail.
      - title: Validate an aLink smartcard
        objective: This test is to confirm an aLink smartcard validates when valid and is rejected when invalid.
        steps: |
          **Given** the PV is in service showing the Present SmartCard or Barcode screen
          **WHEN** a valid aLink smartcard is presented
          **THEN** the card is validated
          **AND** the success outcome is shown
          **WHEN** an invalid aLink smartcard is presented
          **THEN** the card is rejected with the specific reason shown
        expected: aLink validates/rejects correctly. Run under Glider and Rail.
      - title: Validate a yLink or 24+ smartcard
        objective: This test is to confirm a yLink/24+ smartcard validates when valid and is rejected when invalid.
        steps: |
          **Given** the PV is in service showing the Present SmartCard or Barcode screen
          **WHEN** a valid yLink or 24+ smartcard is presented
          **THEN** the card is validated
          **AND** the success outcome is shown
          **WHEN** an invalid yLink or 24+ smartcard is presented
          **THEN** the card is rejected with the specific reason shown
        expected: yLink/24+ validates/rejects correctly. Run under Glider and Rail.
      - title: Validate a Translink Employee smartcard
        objective: This test is to confirm a Translink employee smartcard validates when valid and is rejected when invalid.
        steps: |
          **Given** the PV is in service showing the Present SmartCard or Barcode screen
          **WHEN** a valid Translink employee smartcard is presented
          **THEN** the card is validated
          **AND** the success outcome is shown
          **WHEN** an invalid Translink employee smartcard is presented
          **THEN** the card is rejected with the specific reason shown
        expected: Employee smartcards validate/reject correctly. Variation — Staff, Staff Partner, Retired Staff, External Staff, Dependents Pass. Run under Glider and Rail.
      - title: Validate an EA Smartpass (Pupil and Further Education)
        objective: This test is to confirm an EA Smartpass validates within its valid times and is rejected outside them.
        steps: |
          **Given** the PV is in service showing the Present SmartCard or Barcode screen
          **WHEN** a valid EA Smartpass is presented within its valid time
          **THEN** the card is validated
          **AND** the success outcome is shown
          **WHEN** it is presented before start date, after expiry, outside the valid time, at a weekend or during a school holiday
          **THEN** the card is rejected with the specific reason shown
        expected: EA Smartpasses validate within valid times and reject outside (start/expiry/time/weekend/holiday). Variation — Pupil, Further Education; EA Bus (Glider) and EA Rail.

  - path: Functional / Validation Outcomes
    cases:
      - title: Validation — invalid reasons displayed
        objective: This test is to confirm the PV shows the correct reason for each invalid presentation.
        steps: |
          **Given** the PV is in service showing the Present SmartCard or Barcode screen
          **WHEN** a card is presented that cannot be validated
          **THEN** the specific reason screen is displayed
          **AND** the denied validation is recorded in the back office (CloudFare, MERIT and SmartTrack)
        expected: The correct reason is shown — Not Valid At This Location, Invalid Time Of Day, Product Expired, outside time band, hotlisted, wrong zone, Unable to Validate, Represent Card.
      - title: Validation — passback
        objective: This test is to confirm passback behaviour when a card is re-presented, including the journeys/period remaining.
        steps: |
          **Given** a card has just been validated on the PV
          **WHEN** the same card is presented again within the passback period
          **THEN** passback is applied per the product rules
          **AND** the journeys or period remaining is shown where applicable
          **AND** the validation is recorded in the back office (CloudFare, MERIT and SmartTrack)
        expected: Passback is applied on re-presentation within the period, showing journeys/period left.
      - title: Validation — machine not in service
        objective: This test is to confirm the PV shows Machine Not In Service when it cannot validate.
        steps: |
          **Given** the PV is out of service
          **WHEN** a passenger presents a card
          **THEN** the Machine Not In Service screen is displayed and no validation occurs
        expected: An out-of-service PV shows Machine Not In Service and does not validate.
      - title: Validation — offline transaction
        objective: This test is to confirm the PV validates offline when back-office comms are unavailable and reconciles when restored.
        steps: |
          **Given** the PV has lost back-office communications
          **WHEN** a valid card is presented
          **THEN** the card is validated offline within the offline rules
          **WHEN** communications are restored
          **THEN** the offline transactions are uploaded to the back office
        expected: The PV validates offline within limits and uploads offline transactions when comms return.

  - path: Functional / Rail-specific
    cases:
      - title: Rail — NIR transfer validation
        objective: This test is to confirm NIR transfer validation on a Rail PV across the transfer-eligible products.
        steps: |
          **Given** a Rail PV is in service
          **WHEN** a valid transfer-eligible smartcard is presented for an NIR transfer
          **THEN** the transfer is validated per the transfer rules
          **WHEN** the card is not eligible for the transfer
          **THEN** the card is rejected with the specific reason shown
        expected: NIR transfers validate for eligible products and reject otherwise. Variation — iLink, Belfast Visitor, Staff Smartpass, aLink, EA Pupil/FE; Adult and Child. (Rail mode.)
      - title: Rail — zone validation
        objective: This test is to confirm zone-based validation on a Rail PV.
        steps: |
          **Given** a Rail PV is in service in a defined zone
          **WHEN** a valid zonal smartcard is presented within its zone
          **THEN** the card is validated for the zone
          **WHEN** the card is presented outside its valid zone
          **THEN** the card is rejected as wrong zone
        expected: Zonal validation accepts in-zone and rejects out-of-zone. (Rail mode.)
