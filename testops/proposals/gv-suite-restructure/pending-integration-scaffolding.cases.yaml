  # 5. PRIMARY-SECONDARY TWO-HEAD STATE  — NEEDS-SPEC (bug-derived). FBD-100348 supplies power-up=
  #    OOS-until-both-comms + mains-restore-previous-mode + heartbeat-loss->major-fault (those rows
  #    carry Refs FBD-100348, PENDING); the inter-head interaction detail is bug-derived (no Refs).
  # ============================================================================================
  - path: [Functional, Primary-Secondary Two-Head State (needs-spec)]
    cases:
      - title: Two-Head — on power-up both heads stay Out Of Service until both establish comms
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that on power-up a gate stays Out Of Service until both the Primary and Secondary heads have established comms.
        steps: |-
          **GIVEN** a gate lane has a Primary (Entry/unpaid) head and a Secondary (Exit/paid) head
          **AND** both heads are powered up from cold together
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the heads power up and only one has established comms so far
          **THEN** both heads remain Out Of Service
          **AND** the gate enters service only once both heads have established comms
        expected: On power-up the gate stays OOS until both heads have comms. PENDING INTEGRATION — FBD-100348 power-up=OOS-until-both-comms row not yet validated.
      - title: Two-Head — after a mains restore the gate returns to its previous operating mode
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that after mains power is restored the gate returns to the operating mode it held before the failure.
        steps: |-
          **GIVEN** a gate lane was in Controlled mode when mains power failed
          **AND** an example previous mode of Controlled (Entry direction)
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** mains power is restored to both heads
          **THEN** the gate returns to its previous Controlled mode
        expected: After a mains restore the gate resumes its previous operating mode. PENDING INTEGRATION — FBD-100348 mains-restore=previous-mode row not yet validated.
      - title: Two-Head — loss of heartbeat between the heads raises a major fault
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that loss of the heartbeat between the Primary and Secondary heads raises a major fault.
        steps: |-
          **GIVEN** a gate lane has both heads in service exchanging heartbeats
          **AND** the heartbeat between the Primary and Secondary heads is then lost
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** a head detects the heartbeat has been lost
          **THEN** a major fault is raised
          **AND** the affected head goes Out Of Service
        expected: Loss of the inter-head heartbeat raises a major fault and takes the head OOS. PENDING INTEGRATION — FBD-100348 heartbeat row not yet validated.
      - title: Two-Head — the Primary head recovers its operating state after a power failure
        objective: This test is to confirm (NEEDS-SPEC — no issued GV spec asserts this; not spec-confirmed) that the Primary head recovers its operating state after a power failure, including when it was previously Fully Free.
        steps: |-
          **GIVEN** a gate lane whose Primary head was in Fully Free mode (cf. TIBU-14648)
          **AND** the Primary head then suffers a power failure and recovers
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the Primary head powers back up
          **THEN** the Primary head recovers its previous Fully Free operating state
          **AND** the Primary head does not remain stuck Out Of Service
        expected: The Primary head recovers its operating state (including Fully Free) after a power failure. NEEDS-SPEC — bug-derived (TIBU-14648); no issued GV spec, not validated.
      - title: Two-Head — the gate recovers to service after the nightly reboot
        objective: This test is to confirm (NEEDS-SPEC — no issued GV spec asserts this; not spec-confirmed) that both heads recover to service after the scheduled nightly reboot.
        steps: |-
          **GIVEN** a gate lane with both heads in service before the scheduled nightly reboot
          **AND** an example nightly reboot window (cf. TIBU-19026, TIBU-19250, TIBU-23455)
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the nightly reboot completes
          **THEN** both heads return to service
          **AND** neither head remains Out Of Service after the reboot
        expected: Both heads recover to service after the nightly reboot. NEEDS-SPEC — bug-derived (TIBU-19026/19250/23455); not validated.
      - title: Two-Head — a technician signing on at the Secondary head does not strand the gate Out Of Service
        objective: This test is to confirm (NEEDS-SPEC — no issued GV spec asserts this; not spec-confirmed) that a technician signing on and off at the Secondary head does not leave the gate stranded Out Of Service.
        steps: |-
          **GIVEN** a gate lane in Exit-mode Controlled configuration with both heads in service
          **AND** a technician signs on at the Secondary head then signs off (cf. TIBU-14717, TIBU-16491)
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the technician signs off from the Secondary head
          **THEN** the gate returns to service
          **AND** neither head remains stuck Out Of Service
        expected: A technician sign-on/off at the Secondary head does not strand the gate OOS. NEEDS-SPEC — bug-derived (TIBU-14717/16491); not validated.
      - title: Two-Head — a technician signed on at the Secondary head puts the Primary head Out Of Service
        objective: This test is to confirm (NEEDS-SPEC — no issued GV spec asserts this; not spec-confirmed) that while a technician is signed on at the Secondary head the Primary head goes Out Of Service.
        steps: |-
          **GIVEN** a gate lane in Fully Free mode with both heads in service (cf. TIBU-14670)
          **AND** a technician signs on at the Secondary head
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the technician is signed on at the Secondary head
          **THEN** the Primary head goes Out Of Service while the technician is signed on
        expected: A technician signed on at the Secondary head puts the Primary head OOS for the duration. NEEDS-SPEC — bug-derived (TIBU-14670); not validated.
      - title: Two-Head — rebooting the Secondary head does not force both heads Out Of Service
        objective: This test is to confirm (NEEDS-SPEC — no issued GV spec asserts this; not spec-confirmed) that rebooting the Secondary head does not force both heads into Out Of Service.
        steps: |-
          **GIVEN** a gate lane with both heads in service
          **AND** the Secondary head is rebooted (cf. TIBU-18930, TIBU-18614)
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the Secondary head completes its reboot and boots back up
          **THEN** the Primary head remains in service throughout
          **AND** the gate returns to service without both heads going Out Of Service
        expected: Rebooting the Secondary head does not force both heads OOS. NEEDS-SPEC — bug-derived (TIBU-18930/18614); not validated.
      - title: Two-Head — a remote command can put the Secondary head Out Of Service
        objective: This test is to confirm (NEEDS-SPEC — no issued GV spec asserts this; not spec-confirmed) that a remote command can place the Secondary head Out Of Service.
        steps: |-
          **GIVEN** a gate lane with the Secondary head in service (cf. TIBU-14660)
          **AND** a remote out-of-service command is issued to the Secondary head
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the remote command is applied to the Secondary head
          **THEN** the Secondary head goes Out Of Service
        expected: A remote command can put the Secondary head OOS. NEEDS-SPEC — bug-derived (TIBU-14660); not validated.
      - title: Two-Head — a Station Manager mode change propagates to both heads
        objective: This test is to confirm (NEEDS-SPEC — no issued GV spec asserts this; not spec-confirmed) that a mode change made in Station Manager propagates promptly to both heads.
        steps: |-
          **GIVEN** a gate lane with both heads in Controlled mode
          **AND** the operating mode is changed to Free in Station Manager (cf. TIBU-17473)
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the Station Manager mode change is applied
          **THEN** both heads adopt the new Free mode
          **AND** no reboot is required for the change to take effect
        expected: A Station Manager mode change propagates promptly to both heads without a reboot. NEEDS-SPEC — bug-derived (TIBU-17473/16813); not validated.
      - title: Two-Head — the Primary head displays correctly while the gate is in Fully Free mode
        objective: This test is to confirm (NEEDS-SPEC — no issued GV spec asserts this; not spec-confirmed) that the Primary head shows the correct display while the gate is in Fully Free mode.
        steps: |-
          **GIVEN** a gate lane is set to Fully Free mode (cf. TIBU-18606)
