# Translink GV (Gate Validator) — NEW consolidated cases: PENDING-INTEGRATION / NEEDS-SPEC areas.
# Target: **NEW** GV Test Suite (30286), project 42. Read-only source suite = 14973.
# Push YAML draft — DO NOT push from this task; DO NOT edit existing cases.
#
# ============================ CRITICAL FLAGGING — READ FIRST ============================
# EVERY case in this file covers gate behaviour with NO issued / validated GV spec. They are
# authored (George-approved) ONLY as clearly-flagged SCAFFOLDING so the reorganised suite carries
# the behaviour forward — they must NEVER read as validated acceptance criteria.
#
#   * The only partial requirement is FBD-100348: a FACTORY ACCEPTANCE REPORT of the gate cabinet,
#     with many rows marked "To be validated on integration of Validator." It is NOT a distilled,
#     issued functional spec for the GV heads.
#   * Sections tagged "(pending integration)" trace to FBD-100348 rows that are explicitly pending.
#   * Sections tagged "(needs-spec)" have NO issued GV spec at all (bug-derived / old-suite-derived);
#     they carry no Refs.
#
# To keep this audit-safe, every case here:
#   - opens its objective with "This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed,
#     FBD-100348) that …"  (or "(NEEDS-SPEC — no issued GV spec asserts this; not spec-confirmed) that …"
#     for the no-spec sections); and
#   - carries the precondition line  "AND this behaviour is pending integration sign-off (needs-spec)".
# Do NOT remove these markers when reviewing/pushing. If a real spec is issued, re-baseline the case
# and strike the marker at that point — not before.
#
# DIRECTION = TestRail Run Configuration {Entry · Exit · Bi-di A->B · Bi-di B->A} (per structure.md).
# Shared behaviour authored ONCE; executed against each direction config. No mode-first clone.
#
# Grounding for titles: old suite 14973 sections — Light Pictograms (2754283-6, 2754645-6),
#   Emergency Button (2754282), Power Interruption (3432939), Previous TIBU scenarios (3544376-8),
#   Fixes/Changes two-head cluster (TIBU-14648/14660/14670/14717/16491/18302/18606/18607/18930/
#   19026/19250/23455/14160), iLink/Employee/Rail-EA/aLink smartcard + Invalid Smartcards sweep +
#   NIR Transfers (3532880-917, 3537349-360), DESFire / MIFARE Classic EV1.

suite: "**NEW** GV Test Suite"
suite_id: 30286

defaults:
  template_id: 1
  custom_devtypes: [15]
  custom_autoconfirmation: false
  custom_revstatus: 2

sections:
  # ============================================================================================
  # 1. GATE MODES & PICTOGRAMS  — FBD-100348 rows, all PENDING INTEGRATION.
  #    Mode matrix, pictogram states, buzzer, authorise->open timing, assisted passage, audio assist.
  # ============================================================================================
  - path: [Functional, Gate Modes & Pictograms (pending integration)]
    cases:
      - title: Gate Mode — Controlled mode authorises a valid presentation and opens the gate
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that a GV head in Controlled mode opens the gate on a valid presentation.
        steps: |-
          **GIVEN** a GV head is in service in Controlled mode (e.g. Entry direction configuration)
          **AND** a valid, in-date iLink Zone 1 Adult smartcard is presented to the reader
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the passenger presents the valid smartcard
          **THEN** the presentation is authorised
          **AND** the gate opens
        expected: In Controlled mode a valid presentation is authorised and the gate opens. PENDING INTEGRATION — FBD-100348 row not yet validated; do not treat as confirmed acceptance.
      - title: Gate Mode — Controlled mode keeps the gate closed when a presentation is not authorised
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that a GV head in Controlled mode leaves the gate closed when nothing is authorised.
        steps: |-
          **GIVEN** a GV head is in service in Controlled mode
          **AND** no valid card, tap or barcode has been presented
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** a passenger approaches the gate without presenting a valid credential
          **THEN** the gate stays closed
        expected: With no authorised presentation the Controlled-mode gate stays closed. PENDING INTEGRATION — FBD-100348 row not yet validated.
      - title: Gate Mode — Free mode leaves the gate open to all passengers
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that a GV head in Free mode leaves the gate open without requiring a presentation.
        steps: |-
          **GIVEN** a GV head is set to Free mode by the Station Manager
          **AND** an example configuration where the gate is held open for a rail evacuation drill
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** a passenger passes through the gate
          **THEN** the gate stays open for passage
          **AND** no presentation is required
        expected: In Free mode the gate is held open and passage needs no presentation. PENDING INTEGRATION — FBD-100348 row not yet validated.
      - title: Gate Mode — Locked mode keeps the gate closed to every passenger
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that a GV head in Locked mode keeps the gate closed even for a valid presentation.
        steps: |-
          **GIVEN** a GV head is set to Locked mode by the Station Manager
          **AND** a valid, in-date iLink Zone 1 Adult smartcard is available to present
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the passenger presents the valid smartcard
          **THEN** the gate stays closed
        expected: In Locked mode the gate stays closed regardless of a valid presentation. PENDING INTEGRATION — FBD-100348 row not yet validated.
      - title: Gate Mode — Maintenance mode takes the gate out of passenger service
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that entering Maintenance mode removes the gate from passenger service.
        steps: |-
          **GIVEN** a GV head is in service in Controlled mode
          **AND** a technician is about to sign on at the head to service it
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the head enters Maintenance mode
          **THEN** the gate is no longer available for passenger presentations
        expected: Maintenance mode removes the gate from passenger service. PENDING INTEGRATION — FBD-100348 row not yet validated.
      - title: Gate Mode — Out Of Service mode shows the not-in-service screen and closes the gate
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that a GV head in Out Of Service shows the not-in-service screen and keeps the gate closed.
        steps: |-
          **GIVEN** a GV head has entered Out Of Service (OOS)
          **AND** an example cause of a lost comms link to the paired head
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** a passenger approaches the OOS head
          **THEN** the not-in-service screen is displayed
          **AND** the gate stays closed
        expected: An OOS head shows the not-in-service screen and the gate stays closed. PENDING INTEGRATION — FBD-100348 row not yet validated.
      - title: Gate Mode — Evacuation takes priority over the current operating mode
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that an Evacuation command overrides the current mode and opens the gate.
        steps: |-
          **GIVEN** a GV head is in service in Controlled mode
          **AND** an example rail-station evacuation is triggered by the Station Manager
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the Evacuation command is issued
          **THEN** the gate opens for evacuation
          **AND** the Evacuation state overrides the previous Controlled mode
        expected: Evacuation takes priority over the current mode and opens the gate for egress. PENDING INTEGRATION — FBD-100348 row not yet validated.
      - title: Gate Mode — authorise-to-open is within 650ms on a standard-width gate
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that a standard-width SkyLane gate opens within 650ms of authorisation.
        steps: |-
          **GIVEN** a GV head drives a standard-width SkyLane gate (HF03)
          **AND** a valid presentation is authorised at the head
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the head authorises the presentation
          **THEN** the gate begins to open within 650ms of authorisation
        expected: A standard-width gate opens within 650ms of authorisation. PENDING INTEGRATION — the 650ms figure is an unvalidated FBD-100348 row.
      - title: Gate Mode — authorise-to-open is within 900ms on a wide gate
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that a wide SkyLane gate opens within 900ms of authorisation.
        steps: |-
          **GIVEN** a GV head drives a wide-variant SkyLane gate (HF03)
          **AND** a valid presentation is authorised at the head
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the head authorises the presentation
          **THEN** the gate begins to open within 900ms of authorisation
        expected: A wide gate opens within 900ms of authorisation. PENDING INTEGRATION — the 900ms figure is an unvalidated FBD-100348 row.
      - title: Buzzer — a successful presentation sounds the success beep
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that a successful presentation sounds the success buzzer tone.
        steps: |-
          **GIVEN** a GV head is in service in Controlled mode
          **AND** a valid, in-date Adult iLink Zone 1 smartcard is presented
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the head authorises the presentation
          **THEN** the success beep sounds
        expected: A successful presentation sounds the success buzzer. PENDING INTEGRATION — FBD-100348 buzzer behaviour not yet validated.
      - title: Buzzer — a rejected presentation sounds the failure tone
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that a rejected presentation sounds the distinct failure tone.
        steps: |-
          **GIVEN** a GV head is in service in Controlled mode
          **AND** an expired iLink Zone 1 Adult smartcard is presented
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the head rejects the presentation
          **THEN** the failure tone sounds
          **AND** the failure tone is distinct from the success beep
        expected: A rejected presentation sounds a distinct failure tone. PENDING INTEGRATION — FBD-100348 buzzer behaviour not yet validated.
      - title: Pictogram — a permitted passage shows the passage-permitted light on the approached side
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that a permitted passage shows the passage-permitted pictogram to the approaching passenger.
        steps: |-
          **GIVEN** a GV head is in service in Controlled mode
          **AND** a valid presentation is authorised from the side being approached
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the passenger approaches from the permitted side
          **THEN** the passage-permitted pictogram is shown on the approached side
        expected: A permitted passage shows the passage-permitted pictogram on the approached side. PENDING INTEGRATION — FBD-100348 PIC row not yet validated.
      - title: Pictogram — a not-permitted approach shows the passage-not-permitted light
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that an approach from a non-permitted side shows the passage-not-permitted pictogram.
        steps: |-
          **GIVEN** a GV head is in service in an entry-only Controlled configuration
          **AND** a passenger approaches from the side that is not permitted for passage
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the passenger approaches from the not-permitted side
          **THEN** the passage-not-permitted pictogram is shown on that side
        expected: A not-permitted approach shows the passage-not-permitted pictogram. PENDING INTEGRATION — FBD-100348 PIC row not yet validated.
      - title: Pictogram — an infraction shows the blinking red light
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that a detected infraction shows the blinking-red infraction pictogram.
        steps: |-
          **GIVEN** a GV head is in service in Controlled mode
          **AND** a passenger attempts to pass without an authorised presentation (tailgating)
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the gate detects the infraction
          **THEN** the blinking red infraction pictogram is shown
        expected: A detected infraction shows the blinking-red pictogram. PENDING INTEGRATION — FBD-100348 PIC row not yet validated.
      - title: Pictogram — an out-of-service head shows the Out Of Service light
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that an Out Of Service head shows the OOS pictogram.
        steps: |-
          **GIVEN** a GV head has entered Out Of Service
          **AND** an example cause of a major fault reported by the head
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** a passenger approaches the OOS head
          **THEN** the Out Of Service pictogram is shown
        expected: An OOS head shows the Out Of Service pictogram. PENDING INTEGRATION — FBD-100348 PIC row not yet validated.
      - title: Assisted Passage — an assisted-passage request opens the gate for longer
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that an assisted-passage presentation holds the gate open for the extended assisted time.
        steps: |-
          **GIVEN** a GV head is in service in Controlled mode
          **AND** a valid smartcard flagged for assisted passage (e.g. a Blind SmartPass) is presented
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the head authorises the assisted-passage presentation
          **THEN** the gate opens
          **AND** the gate is held open for the extended assisted-passage time
        expected: An assisted-passage presentation opens the gate and holds it open longer than a standard passage. PENDING INTEGRATION — no validated GV spec for assisted-passage timing.
      - title: Audio Assistance — a Blind or Partial-Sight SmartPass plays the audio assistance message
        objective: This test is to confirm (NEEDS-SPEC — no issued GV spec asserts this; not spec-confirmed) that presenting a Blind or Partial-Sight SmartPass plays the expected audio assistance message.
        steps: |-
          **GIVEN** a GV head is in service in Controlled mode
          **AND** a valid Partial-Sight Half-Fare SmartPass smartcard is presented (cf. TIBU-16372)
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the passenger presents the Partial-Sight SmartPass
          **THEN** the expected audio assistance message is played
        expected: A Blind / Partial-Sight SmartPass plays the audio assistance message. NEEDS-SPEC — bug-derived (TIBU-16372); no issued GV spec, not validated acceptance.

  # ============================================================================================
  # 2. EMERGENCY & FAULT HANDLING  — FBD-100348 rows, all PENDING INTEGRATION.
  #    open-fail->OOS, close-fail->OOS (2-vs-3 ambiguity), emergency release, power interruption,
  #    <=2s power-loss no-reboot, evacuation egress.
  # ============================================================================================
  - path: [Functional, Emergency & Fault Handling (pending integration)]
    cases:
      - title: Open Fail — a gate that fails to open within 3 seconds goes Out Of Service
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that a gate that fails to open within 3 seconds of authorisation goes Out Of Service.
        steps: |-
          **GIVEN** a GV head has authorised a valid presentation
          **AND** an example obstruction prevents the gate paddles from opening
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the gate fails to open within 3 seconds of authorisation
          **THEN** the head goes Out Of Service
        expected: A gate that fails to open within 3s goes OOS. PENDING INTEGRATION — the 3s open-fail rule is an unvalidated FBD-100348 row.
      - title: Close Fail — repeated consecutive close failures take the gate Out Of Service
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that a run of consecutive close failures takes the gate Out Of Service.
        steps: |-
          **GIVEN** a GV head is in service in Controlled mode
          **AND** the gate paddles repeatedly fail to close after each passage
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** consecutive close failures reach the configured threshold
          **THEN** the head goes Out Of Service
          **AND** the exact failure count that triggers OOS is unconfirmed — FBD-100348 is ambiguous between 2 and 3 consecutive close failures (resolve on integration)
        expected: Consecutive close failures take the gate OOS. PENDING INTEGRATION — FBD-100348 does not settle whether the trigger is 2 or 3 consecutive close failures; the threshold needs confirming, do not treat either value as validated.
      - title: Emergency Release — the emergency release button opens the gate
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that pressing the emergency release button opens the gate.
        steps: |-
          **GIVEN** a GV head is in service in Controlled mode
          **AND** an example on-platform emergency requires the gate to be released
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the emergency release button is pressed
          **THEN** the gate opens
        expected: The emergency release button opens the gate. PENDING INTEGRATION — FBD-100348 row not yet validated.
      - title: Emergency Release — the gate can return to its operating mode after the emergency without a reboot
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that the gate returns to its previous operating mode after an emergency release without needing a reboot.
        steps: |-
          **GIVEN** a GV head was released by the emergency switch (cf. TIBU-16813)
          **AND** the emergency condition has now cleared
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the operating mode is changed back from the emergency state
          **THEN** the gate returns to its operating mode
          **AND** no reboot is required to change the mode
        expected: After an emergency release the gate can resume its operating mode without a reboot. PENDING INTEGRATION — bug-derived (TIBU-16813); FBD-100348 row not yet validated.
      - title: Power Interruption — a mains failure with a passenger in the gate leaves the gate open
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that a mains power failure while a passenger is in the gate leaves the gate open.
        steps: |-
          **GIVEN** a GV head is in service in Controlled mode
          **AND** a passenger is positioned within the gate when mains power is lost
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** mains power fails while the passenger is within the gate
          **THEN** the gate remains open
        expected: A mains failure with a passenger in the gate leaves the gate open so the passenger is not trapped. PENDING INTEGRATION — FBD-100348 row not yet validated.
      - title: Power Interruption — a power loss of 2 seconds or less does not reboot the head
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that a power loss of 2 seconds or less does not force the head to reboot.
        steps: |-
          **GIVEN** a GV head is in service in Controlled mode
          **AND** an example brief supply glitch of no more than 2 seconds (cf. TIBU-14160)
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** mains power is lost for 2 seconds or less
          **THEN** the head does not reboot
          **AND** the head remains in service
        expected: A power loss of 2 seconds or less does not reboot the head. PENDING INTEGRATION — bug-derived (TIBU-14160); the 2s tolerance is not validated acceptance.
      - title: Evacuation — an evacuation command opens the gate to allow egress
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that an evacuation command opens the gate so passengers can leave.
        steps: |-
          **GIVEN** a GV head is in service in Controlled mode
          **AND** an example station evacuation is called by the Station Manager
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the evacuation command is issued
          **THEN** the gate opens to allow egress
        expected: An evacuation command opens the gate for egress. PENDING INTEGRATION — FBD-100348 row not yet validated.
      - title: Fault — a major fault reported by the head takes the gate Out Of Service
        refs: [FBD-100348]
        objective: This test is to confirm (PENDING INTEGRATION — not yet spec-confirmed, FBD-100348) that a major fault reported by the head takes the gate Out Of Service.
        steps: |-
          **GIVEN** a GV head is in service in Controlled mode
          **AND** an example major fault (e.g. a gate-drive fault) is raised by the head
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the head reports the major fault
          **THEN** the head goes Out Of Service
        expected: A major fault takes the gate OOS. PENDING INTEGRATION — FBD-100348 fault handling not yet validated.

  # ============================================================================================
  # 3. PER-PRODUCT SMARTCARD ACCEPTANCE  — NEEDS-SPEC. No issued GV spec asserts product-by-product
  #    acceptance at the gate head. Refs intentionally omitted. Old-suite product sweep collapsed via
  #    Data variations. Card technology (DESFire / MIFARE Classic EV1) covered.
  # ============================================================================================
  - path: [Functional, Per-Product Smartcard Acceptance (needs-spec)]
    cases:
      - title: Smartcard — a valid new stored-product smartcard is accepted and opens the gate
        objective: This test is to confirm (NEEDS-SPEC — no issued GV spec asserts this; not spec-confirmed) that a valid new stored-product smartcard is accepted at the gate head and opens the gate.
        steps: |-
          **GIVEN** a GV head is in service in Controlled mode
          **AND** a valid new Adult iLink Zone 1 smartcard is presented
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the passenger presents the new smartcard
          **THEN** the success screen is displayed
          **AND** the gate opens
        expected: A valid new stored-product smartcard is accepted and opens the gate. NEEDS-SPEC — no issued GV spec asserts per-product acceptance; not validated. Data variations, product, iLink Belfast Visitor / iLink Zones 1-4-NW / Employee Staff family / Rail EA Pupil & Further Ed / aLink / Metro Multi-Journey / Daylink / Travelcard / Town Service / 24+ / Ylink, passenger Adult / Child.
      - title: Smartcard — a previously-used stored-product smartcard is accepted again where the product permits
        objective: This test is to confirm (NEEDS-SPEC — no issued GV spec asserts this; not spec-confirmed) that a previously-used smartcard is accepted again at the gate head where its product permits re-use.
        steps: |-
          **GIVEN** a GV head is in service in Controlled mode
          **AND** a valid Adult iLink Zone 1 smartcard that has been used before (outside any passback window) is presented
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the passenger presents the previously-used smartcard
          **THEN** the success screen is displayed
          **AND** the gate opens
        expected: A previously-used smartcard is accepted again where the product permits. NEEDS-SPEC — not validated. Data variations as per the new-card acceptance case.
      - title: Smartcard — a valid smartcard re-presented within the passback period is rejected
        objective: This test is to confirm (NEEDS-SPEC — no issued GV spec asserts this; not spec-confirmed) that a smartcard re-presented within the passback period is rejected at the gate head.
        steps: |-
          **GIVEN** a GV head has just accepted a valid Adult iLink Zone 1 smartcard
          **AND** the same smartcard is presented again within the passback period
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the passenger re-presents the smartcard within the passback period
          **THEN** the passback screen is displayed
          **AND** the gate does not open
        expected: A smartcard re-presented within the passback period is rejected. NEEDS-SPEC — not validated. Data variations as per the new-card acceptance case.
      - title: Smartcard — a hotlisted smartcard is rejected
        objective: This test is to confirm (NEEDS-SPEC — no issued GV spec asserts this; not spec-confirmed) that a hotlisted smartcard is rejected at the gate head.
        steps: |-
          **GIVEN** a GV head is in service in Controlled mode
          **AND** an Adult iLink Zone 1 smartcard that has been marked for hotlist is presented
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the passenger presents the hotlisted smartcard
          **THEN** the not-accepted screen is displayed
          **AND** the gate does not open
        expected: A hotlisted smartcard is rejected and the gate stays closed. NEEDS-SPEC — not validated. Data variations as per the new-card acceptance case.
      - title: Smartcard — an expired stored-product smartcard is rejected
        objective: This test is to confirm (NEEDS-SPEC — no issued GV spec asserts this; not spec-confirmed) that an expired smartcard is rejected at the gate head.
        steps: |-
          **GIVEN** a GV head is in service in Controlled mode
          **AND** an Adult iLink Zone 1 smartcard whose product has expired is presented
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the passenger presents the expired smartcard
          **THEN** the product-expired screen is displayed
          **AND** the gate does not open
        expected: An expired smartcard is rejected. NEEDS-SPEC — not validated. Data variations as per the new-card acceptance case.
      - title: Smartcard — a smartcard presented outside its valid zone is rejected
        objective: This test is to confirm (NEEDS-SPEC — no issued GV spec asserts this; not spec-confirmed) that a smartcard presented outside its valid zone is rejected at the gate head.
        steps: |-
          **GIVEN** a GV head is in service at a gate in Zone 1
          **AND** an Adult iLink Zone 4 smartcard not valid for Zone 1 is presented
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the passenger presents the out-of-zone smartcard
          **THEN** the not-valid-at-location screen is displayed
          **AND** the gate does not open
        expected: A smartcard presented outside its valid zone is rejected. NEEDS-SPEC — not validated. Data variations, zones 1 / 2 / 3 / 4 / NW.
      - title: Smartcard — a smartcard presented outside its valid time is rejected
        objective: This test is to confirm (NEEDS-SPEC — no issued GV spec asserts this; not spec-confirmed) that a smartcard presented outside its valid time is rejected at the gate head.
        steps: |-
          **GIVEN** a GV head is in service in Controlled mode
          **AND** an EA Pupil SmartPass presented on a weekend, outside its Mon-Fri valid time, is used
          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** the passenger presents the smartcard outside its valid time
          **THEN** the invalid-time screen is displayed
          **AND** the gate does not open
        expected: A smartcard presented outside its valid time is rejected. NEEDS-SPEC — not validated. Data variations, weekend / school holiday / outside Mon-Fri window.
      - title: Smartcard — a smartcard presented before its start date is rejected
