          **AND** this behaviour is pending integration sign-off (needs-spec)
          **WHEN** a passenger views the Primary head in Fully Free mode
          **THEN** the Primary head shows the correct Fully Free display
        expected: The Primary head shows the correct display in Fully Free mode. NEEDS-SPEC — bug-derived (TIBU-18606); not validated.
      - title: Two-Head — the Secondary head does not keep accepting cards while the Primary shows Out Of Service
        objective: This test is to confirm (NEEDS-SPEC — no issued GV spec asserts this; not spec-confirmed) that the Secondary head does not keep accepting cards while the Primary head is Out Of Service.
        steps: |-
