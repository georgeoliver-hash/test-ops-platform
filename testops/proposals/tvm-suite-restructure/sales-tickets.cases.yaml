# TVM Sales - Tickets — **NEW** TVM Test Suite (30284)
# Consolidated SALES/TICKETS coverage for the restructured TVM suite.
# Authored per proposals/tvm-suite-restructure/structure.md + cross-tab.md and docs/gherkin-standard.md.
#
# CONSOLIDATION MODEL (see cross-tab.md §1-2):
#   - Ticket issue / basket / numbering / collection / mini-statement / grouped-stops behaviour is
#     SHARED across both hardware models (Kiosk · Astreo) and all modes (NIR-Rail · Ulsterbus · Metro
#     · Glider). It is authored ONCE here; model + mode are TestRail Run Configurations, NOT copies.
#   - Passenger type (Adult/Child/Family), product, and payment method (cash / card Chip&PIN /
#     contactless) are DATA VARIATIONS of one behaviour, folded into "Data variations:" lines — never
#     multiplied into separate cases (this is what collapsed the old ~1,300-per-suite fare matrices).
#   - The ONLY model/mode leaf created is "Rail & Cross-Border (Kiosk)": NIR-Rail and Cross-Border
#     ticketing is Kiosk-only (Astreo has zero rail sales — cross-tab.md §2) and the from/to-station
#     selection flow genuinely differs from bus product selection. Ulsterbus/Metro/Glider get NO leaf:
#     their issue steps are identical (only the product catalogue and fare differ) so they stay shared.
#   - Concrete worked examples are grounded in real routes/stops/fares (Metro 10A £2.30, Ulsterbus 72b
#     ref.60 £4.50 from the UB-TOO tracker) or cited to the fares export (FBD-100336 / FBD-100450);
#     where an exact fare is not in a source it is cited to the export rather than fabricated.
suite_id: 30284
defaults:
  template_id: 1
  custom_devtypes: [1]          # TVM
  custom_autoconfirmation: false
  custom_revstatus: 2
sections:

  # ═══════════════════════════════════════════════════════════════════
  #  Ticket Issue — generic / adult / child / family (SHARED, all models & modes)
  # ═══════════════════════════════════════════════════════════════════
  - path: [Functional, Sales - Tickets, Ticket Issue]
    cases:
      - title: Ticket Issue — a selected product is issued and printed
        refs: [FBD-100336, FBD-100207]
        objective: This test is to confirm the customer can select a valid product, pay, and receive a printed ticket.
        steps: |-
          **GIVEN** a TVM at its home stage on the multi-modal home screen
          **AND** an example product of a Metro Adult Single from 10A (IN) Casement Park to City Hall at £2.30 (fares export FBD-100336)
          **WHEN** the customer selects the product and completes payment
          **THEN** a ticket is printed for the selected product
          **AND** the paid fare on the ticket matches the fares export
          Data variations: model {Kiosk, Astreo}; mode {NIR-Rail, Ulsterbus, Metro, Glider}; payment {cash, card Chip&PIN, contactless}
        expected: The chosen product is issued and a ticket printed at the fares-export price, for either model, any mode and any payment method.
      - title: Ticket Issue — Adult single ticket
        refs: [FBD-100336, FBD-100207]
        objective: This test is to confirm the customer can buy an Adult single ticket for the boarding and alighting stages selected.
        steps: |-
          **GIVEN** a TVM showing the Adult product range
          **AND** an example Metro Adult Single, 10A (IN) Casement Park to City Hall, £2.30 (Ulsterbus example: 72b Moygashel Busby Shop to Armagh Bus Centre, ref.60 £4.50)
          **WHEN** the customer buys the Adult single and pays
          **THEN** an Adult single ticket is printed for the selected stages
          **AND** the fare charged equals the fares-export Adult single fare
          Data variations: mode {Ulsterbus, Metro, Glider}; payment {cash, card, contactless}
        expected: An Adult single is issued for the selected stages at the Adult fare, across modes and payment methods.
      - title: Ticket Issue — Child single ticket
        refs: [FBD-100336, FBD-100207]
        objective: This test is to confirm the customer can buy a Child single ticket at the Child fare.
        steps: |-
          **GIVEN** a TVM showing the Child product range
          **AND** an example Metro Child Single, 10A (IN) Casement Park to City Hall, at the Child fare per the fares export
          **WHEN** the customer buys the Child single and pays
          **THEN** a Child single ticket is printed for the selected stages
          **AND** the fare charged equals the fares-export Child single fare
          Data variations: mode {Ulsterbus, Metro, Glider}; payment {cash, card, contactless}
        expected: A Child single is issued at the Child fare, across modes and payment methods.
      - title: Ticket Issue — Family and Friends day ticket
        refs: [FBD-100336]
        objective: This test is to confirm the customer can buy a Family and Friends day ticket for the group.
        steps: |-
          **GIVEN** a TVM showing the Family and Friends product
          **AND** an example Metro Family and Friends Day ticket priced per the fares export
          **WHEN** the customer buys the Family and Friends ticket and pays
          **THEN** a Family and Friends day ticket is printed
          **AND** the fare charged equals the fares-export Family and Friends fare
          Data variations: mode {Metro, Glider}; payment {cash, card, contactless}
        expected: A Family and Friends day ticket is issued for the group at the fares-export price.
      - title: Ticket Issue — Family and Friends additional child
        refs: [FBD-100336]
        objective: This test is to confirm the customer can add an additional child to a Family and Friends ticket at the add-child price.
        steps: |-
          **GIVEN** a TVM with a Family and Friends day ticket selected
          **AND** the fares export defines a Family and Friends Additional Child price
          **WHEN** the customer adds an additional child and pays
          **THEN** an additional-child ticket is printed alongside the Family and Friends ticket
          **AND** the fare charged includes the add-child price from the fares export
          Data variations: mode {Metro, Glider}; payment {cash, card, contactless}
        expected: An additional child is added to the Family and Friends ticket and charged the add-child price.
      - title: Ticket Issue — Popular tickets shortcut
        refs: [FBD-100336]
        objective: This test is to confirm the customer can buy a product from the Popular Tickets shortcut list.
        steps: |-
          **GIVEN** a TVM showing the Popular Tickets shortcuts
          **AND** an example Popular shortcut for a Metro Adult Single at £2.30
          **WHEN** the customer selects a Popular shortcut and pays
          **THEN** the shortcut product is printed as a ticket
          **AND** the fare charged matches the fares export for that product
          Data variations: payment {cash, card, contactless}
        expected: A product bought from the Popular Tickets shortcut is issued at its fares-export price.
      - title: Ticket Issue — Evening ticket
        refs: [FBD-100336]
        objective: This test is to confirm the customer can buy a Metro Evening ticket during the evening validity window.
        steps: |-
          **GIVEN** a TVM inside the Metro Evening validity window
          **AND** an example Metro Evening Adult ticket priced per the fares export
          **WHEN** the customer buys the Evening ticket and pays
          **THEN** an Evening ticket is printed
          **AND** the fare charged equals the fares-export Evening fare
          Data variations: passenger {Adult, Child}; payment {cash, card, contactless}
        expected: A Metro Evening ticket is issued at the Evening fare during its validity window.
      - title: Ticket Issue — Day and Day Return tickets
        refs: [FBD-100336]
        objective: This test is to confirm the customer can buy Day and Day Return tickets at the fares-export price.
        steps: |-
          **GIVEN** a TVM showing the Day and Day Return products
          **AND** an example Metro Adult Day ticket priced per the fares export
          **WHEN** the customer buys a Day or Day Return ticket and pays
          **THEN** the selected Day or Day Return ticket is printed
          **AND** the fare charged equals the fares-export price for that product
          Data variations: product {Day, Day Return, 1 Month Return}; passenger {Adult, Child}; payment {cash, card, contactless}
        expected: Day, Day Return and 1 Month Return tickets are issued at their fares-export prices.
      - title: Ticket Issue — Summer Bus Rambler ticket
        refs: [FBD-100336]
        objective: This test is to confirm the customer can buy a Summer Bus Rambler ticket at the fares-export price.
        steps: |-
          **GIVEN** a TVM showing the Summer Bus Rambler product within its seasonal availability
          **AND** an example Summer Bus Rambler Adult ticket priced per the fares export
          **WHEN** the customer buys the Bus Rambler ticket and pays
          **THEN** a Bus Rambler ticket is printed
          **AND** the fare charged equals the fares-export Bus Rambler fare
          Data variations: passenger {Adult, Child}; payment {cash, card, contactless}
        expected: A Summer Bus Rambler ticket is issued at its fares-export price for Adult or Child.
      - title: Ticket Issue — concessionary half-fare single
        refs: [FBD-100336, FBD-100207]
        objective: This test is to confirm the customer can buy a half-fare concessionary single at the half-fare price.
        steps: |-
          **GIVEN** a TVM showing the concessionary product range
          **AND** an example half-fare concessionary single at half the Adult fares-export single fare
          **WHEN** the customer buys the concessionary single and pays
          **THEN** a concessionary single ticket is printed
          **AND** the fare charged equals the half-fare price from the fares export
          Data variations: mode {Ulsterbus, Metro}; payment {cash, card, contactless}
        expected: A half-fare concessionary single is issued at the half-fare price.
      - title: Ticket Issue — buy a product in a different language
        refs: [FBD-100336]
        objective: This test is to confirm a product can be bought after switching the interface language, with the ticket unaffected.
        steps: |-
          **GIVEN** a TVM on the multi-modal home screen
          **AND** the interface language has been switched from English to an alternative language
          **WHEN** the customer buys a Metro Adult Single and pays
          **THEN** the product is issued in the selected language flow
          **AND** the printed ticket content matches the standard ticket format
        expected: A product can be purchased in an alternative interface language and the ticket prints as normal.
      - title: Ticket Issue — issued ticket carries a single-use barcode
        refs: [FBD-100167, FBD-100317]
        objective: This test is to confirm a printed ticket carries a single-use barcode when the ticket type has barcode printing enabled.
        steps: |-
          **GIVEN** a TVM issuing a product whose ticket type has barcode printing enabled in CloudFare
          **AND** an example Metro Adult Single from 10A (IN) Casement Park to City Hall
          **WHEN** the customer completes the purchase
          **THEN** a single-use barcode is printed at the end of the ticket
        expected: A ticket for a barcode-enabled product prints a single-use barcode at the end of the ticket (TVM prints single-use only).
      - title: Ticket Issue — a single ticket for multiple passengers carries no barcode
        refs: [FBD-100167]
        objective: This test is to confirm no barcode is printed when one ticket is issued covering multiple passengers.
        steps: |-
          **GIVEN** a TVM issuing one ticket that covers multiple passengers
          **AND** an example Family and Friends day ticket covering a group on one ticket
          **WHEN** the customer completes the purchase
          **THEN** no barcode is printed on the multi-passenger ticket
        expected: A single ticket covering multiple passengers is printed without a barcode.
      - title: Ticket Issue — the sale posts an audit record to the back office
        refs: [FBD-100341]
        objective: This test is to confirm a completed sale posts a conformant transaction record to the back office.
        steps: |-
          **GIVEN** a TVM that has completed a Metro Adult Single sale at £2.30
          **WHEN** the transaction is sent to the back office
          **THEN** the record shows the sold product with its fare
          **AND** the record is visible in CloudFare
          **AND** the record is carried through to MERIT
        expected: A completed sale posts a transaction carrying the product and fare, visible in CloudFare and carried to MERIT (FBD-100341 apportionment).

  # ═══════════════════════════════════════════════════════════════════
  #  Advance & 3-Day (SHARED bus/generic; rail 3-Day Select lives in the Rail leaf)
  # ═══════════════════════════════════════════════════════════════════
  - path: [Functional, Sales - Tickets, Advance & 3-Day]
    cases:
      - title: 3-Day — a 3-day ticket is issued
        refs: [FBD-100336]
        objective: This test is to confirm the customer can buy a 3-day ticket at the fares-export price.
        steps: |-
          **GIVEN** a TVM showing the 3-day product
          **AND** an example Adult 3-Day ticket priced per the fares export
          **WHEN** the customer buys the 3-day ticket and pays
          **THEN** a 3-day ticket is printed
          **AND** the fare charged equals the fares-export 3-day price
          Data variations: passenger {Adult, Child}; payment {cash, card, contactless}
        expected: A 3-day ticket is issued at its fares-export price for Adult or Child.
      - title: 3-Day — the ticket is valid across three consecutive days
        refs: [FBD-100336]
        objective: This test is to confirm a 3-day ticket prints validity spanning three consecutive days from the start date.
        steps: |-
          **GIVEN** a TVM issuing an Adult 3-Day ticket with today as the start date
          **WHEN** the ticket is printed
          **THEN** the printed validity spans three consecutive days from the start date
        expected: A 3-day ticket prints a three-consecutive-day validity window from its start date.

  # ═══════════════════════════════════════════════════════════════════
  #  Rail & Cross-Border (Kiosk) — KIOSK-ONLY LEAF (NIR-Rail mode; Astreo has no rail sales)
  # ═══════════════════════════════════════════════════════════════════
  - path: [Functional, Sales - Tickets, Rail & Cross-Border (Kiosk)]
    cases:
      - title: NI Rail — Adult single between two stations
        refs: [FBD-100450, FBD-100207]
        objective: This test is to confirm a Kiosk in NIR-Rail mode issues an Adult rail single between the selected from and to stations.
        steps: |-
          **GIVEN** a Kiosk in NIR-Rail mode showing the rail from/to station selection
          **AND** an example Adult single from Belfast Lanyon Place to Portadown priced per the NIR fares export (FBD-100450)
          **WHEN** the customer selects the from and to stations and pays
          **THEN** an Adult rail single is printed for the selected stations
          **AND** the fare charged equals the NIR fares-export single fare
          Data variations: passenger {Adult, Child}; payment {cash, card, contactless}
        expected: A Kiosk issues an Adult (or Child) NI rail single between the selected stations at the NIR fares-export fare.
      - title: NI Rail — Day Return, Weekly and Monthly products
        refs: [FBD-100450]
        objective: This test is to confirm a Kiosk issues NI rail Day Return, Weekly and Monthly products at the fares-export price.
        steps: |-
          **GIVEN** a Kiosk in NIR-Rail mode with stations selected
          **AND** an example Adult Day Return from Belfast Lanyon Place to Portadown priced per the NIR fares export
          **WHEN** the customer selects a Day Return, Weekly or Monthly product and pays
          **THEN** the selected rail product is printed for the stations
          **AND** the fare charged equals the NIR fares-export price for that product
          Data variations: product {Day Return, Weekly, Monthly, 1/3 off Day Return, Day Tracker}; passenger {Adult, Child}
        expected: NI rail Day Return / Weekly / Monthly / 1-3-off Day Return / Day Tracker products are issued at their NIR fares-export prices.
      - title: NI Rail — 3-Day Select ticket
        refs: [FBD-100450, FBD-100167]
        objective: This test is to confirm a Kiosk issues a rail 3-Day Select ticket valid on three selected dates.
        steps: |-
          **GIVEN** a Kiosk in NIR-Rail mode showing the 3-Day Select product
          **AND** an example Adult 3-Day Select between Belfast Lanyon Place and Portadown priced per the NIR fares export
          **WHEN** the customer buys the 3-Day Select ticket and pays
          **THEN** a 3-Day Select ticket is printed
          **AND** the printed validity reflects the 3-Day Select date rule
          Data variations: passenger {Adult, Child}; payment {cash, card, contactless}
        expected: A rail 3-Day Select ticket is issued with its selectable-date validity.
      - title: Cross-Border — Adult single
        refs: [FBD-100450, FBD-100207]
        objective: This test is to confirm a Kiosk issues a Cross-Border Adult single between a NI and a cross-border station.
        steps: |-
          **GIVEN** a Kiosk in NIR-Rail mode showing cross-border stations
          **AND** an example Cross-Border Adult single from Newry to Dundalk priced per the NIR fares export
          **WHEN** the customer selects the cross-border stations and pays
          **THEN** a Cross-Border Adult single is printed for the selected stations
          **AND** the fare charged equals the NIR fares-export cross-border single fare
          Data variations: passenger {Adult, Child}; payment {cash, card, contactless}
        expected: A Cross-Border single is issued between the selected NI and cross-border stations at the fares-export fare.
      - title: Cross-Border — Return, Monthly and 1-Month-Return products
        refs: [FBD-100450]
        objective: This test is to confirm a Kiosk issues Cross-Border Return, Monthly and 1-Month-Return products at the fares-export price.
        steps: |-
          **GIVEN** a Kiosk in NIR-Rail mode with cross-border stations selected
          **AND** an example Cross-Border Adult Day Return from Newry to Dundalk priced per the NIR fares export
          **WHEN** the customer selects a Return, Monthly or 1-Month-Return product and pays
          **THEN** the selected cross-border product is printed
          **AND** the fare charged equals the NIR fares-export price for that product
          Data variations: product {Day Return, Weekly, Monthly, 1 Month Return}; passenger {Adult, Child}
        expected: Cross-Border Return / Monthly / 1-Month-Return products are issued at their fares-export prices.
      - title: Cross-Border — 1st Class ticket
        refs: [FBD-100450]
        objective: This test is to confirm a Kiosk issues a 1st Class Cross-Border ticket at the 1st Class fares-export price.
        steps: |-
          **GIVEN** a Kiosk in NIR-Rail mode showing 1st Class cross-border products
          **AND** an example 1st Class Cross-Border Adult 1 Month Return priced per the NIR fares export
          **WHEN** the customer buys a 1st Class cross-border product and pays
          **THEN** a 1st Class Cross-Border ticket is printed
          **AND** the fare charged equals the NIR fares-export 1st Class price
          Data variations: product {Single, 1 Month Return}; passenger {Adult, Child}
        expected: A 1st Class Cross-Border ticket is issued at the 1st Class fares-export price.
      - title: NI Rail — concessionary single
        refs: [FBD-100450]
        objective: This test is to confirm a Kiosk issues a rail concessionary single at the concessionary price.
        steps: |-
          **GIVEN** a Kiosk in NIR-Rail mode showing rail concessionary products
          **AND** an example Senior concessionary single from Belfast Lanyon Place to Portadown priced per the NIR fares export
          **WHEN** the customer buys a concessionary single and pays
          **THEN** a concessionary single ticket is printed
          **AND** the fare charged equals the NIR fares-export concessionary price
          Data variations: concession {Senior, ROI Senior, Blind, War Pensioner, 60+}
        expected: A rail concessionary single is issued at its fares-export concessionary price across concession types.
      - title: NI Rail — grouped-station area name prints on a cross-border ticket
        refs: [FBD-100515, FBD-100450]
        objective: This test is to confirm a grouped rail area name selected on a Kiosk prints on the issued ticket.
        steps: |-
          **GIVEN** a Kiosk in NIR-Rail mode whose station belongs to a configured grouped Area (rail stations only)
          **AND** an example Belfast-stations Area grouping Lanyon Place with linked city stations
          **WHEN** the customer buys a ticket from the grouped Area boarding stop
          **THEN** the Area group name is printed as the boarding stop on the ticket
        expected: A grouped rail Area name is used as the boarding stop and printed on the ticket (FBD-100515, rail-only group).

  # ═══════════════════════════════════════════════════════════════════
  #  Basket (SHARED — add / remove / amend, quantity, family & friends, identical)
  # ═══════════════════════════════════════════════════════════════════
  - path: [Functional, Sales - Tickets, Basket]
    cases:
      - title: Basket — adding a product increases the basket quantity
        refs: [FBD-100336]
        objective: This test is to confirm adding a product to the basket increases the basket quantity and running total.
        steps: |-
          **GIVEN** a TVM with an empty basket
          **AND** an example Metro Adult Single at £2.30
          **WHEN** the customer adds the product to the basket
          **THEN** the basket quantity increases by one
          **AND** the basket total increases by the product fare
        expected: Adding a product raises the basket quantity by one and the total by the product fare.
      - title: Basket — adding more of the same product increases the quantity
        refs: [FBD-100336]
        objective: This test is to confirm adding more of a product already in the basket increases that line's quantity.
        steps: |-
          **GIVEN** a TVM with one Metro Adult Single already in the basket
          **WHEN** the customer adds more of the same Adult Single
          **THEN** the Adult Single line quantity increases
          **AND** the basket total increases accordingly
        expected: Adding more of an existing product increases its line quantity and the basket total.
      - title: Basket — an identical product merges into the existing basket line
        refs: [FBD-100336]
        objective: This test is to confirm adding an identical product (same stages) merges into the existing line rather than creating a new one.
        steps: |-
          **GIVEN** a TVM with a Metro Adult Single (Casement Park to City Hall) in the basket
          **WHEN** the customer adds an identical Adult Single with the same boarding and alighting stages
          **THEN** the quantity of the existing basket line increases
          **AND** no separate basket line is created
        expected: An identical product increments the existing line and does not create a duplicate line.
      - title: Basket — the same product with different stages is a separate line
        refs: [FBD-100336, FBD-100207]
        objective: This test is to confirm the same product with a different boarding or alighting stage is held as a separate basket line.
        steps: |-
          **GIVEN** a TVM with a Metro Adult Single (Casement Park to City Hall) in the basket
          **WHEN** the customer adds an Adult Single with a different alighting stage
          **THEN** a separate basket line is created for the different-stage ticket
          **AND** its fare reflects the different alighting stage
        expected: The same product with a different stage forms its own basket line priced for that stage.
      - title: Basket — reducing an item quantity lowers the total
        refs: [FBD-100336]
        objective: This test is to confirm reducing an item's quantity in the basket lowers the basket total.
        steps: |-
          **GIVEN** a TVM with two Metro Adult Singles in one basket line
          **WHEN** the customer reduces the line quantity to one
          **THEN** the line quantity shows one
          **AND** the basket total drops by one Adult single fare
        expected: Reducing a line quantity lowers the quantity and total by the corresponding fare.
      - title: Basket — removing a product with the bin icon deletes the line
        refs: [FBD-100336]
        objective: This test is to confirm removing a product with the bin icon deletes the whole line from the basket.
        steps: |-
          **GIVEN** a TVM with a basket line holding two or more of a product
          **WHEN** the customer removes the line with the bin icon
          **THEN** the line is deleted from the basket
          **AND** the basket total drops by that line's value
        expected: The bin icon removes the entire line regardless of its quantity and reduces the total.
      - title: Basket — removing the final product empties the basket
        refs: [FBD-100336]
        objective: This test is to confirm removing the last remaining product returns the basket to empty.
        steps: |-
          **GIVEN** a TVM with a single product remaining in the basket
          **WHEN** the customer removes that product
          **THEN** the basket is empty
          **AND** the customer is returned to product selection
        expected: Removing the final product empties the basket and returns to product selection.
      - title: Basket — remaining ticket numbers are contiguous after a removal
        refs: [FBD-100336]
        objective: This test is to confirm the remaining tickets keep contiguous ticket numbering after a basket product is removed.
        steps: |-
          **GIVEN** a TVM with three products in the basket
          **WHEN** the customer removes one product and completes the purchase
          **THEN** the remaining tickets are numbered contiguously
        expected: After removing a basket product, the remaining tickets print with contiguous numbering.
      - title: Basket — amending the boarding stage reduces the fare
        refs: [FBD-100207, FBD-100336]
        objective: This test is to confirm amending a basket ticket's boarding stage to a nearer stage reduces its fare.
        steps: |-
          **GIVEN** a TVM with a single ticket in the basket
          **AND** an example ticket whose boarding stage is amended to one closer to the alighting stage
          **WHEN** the customer amends the boarding stage
          **THEN** the ticket fare is reduced
          **AND** the basket total is reduced accordingly
        expected: Amending the boarding stage nearer reduces the ticket fare and the basket total.
      - title: Basket — amending the alighting stage increases the fare
        refs: [FBD-100207, FBD-100336]
        objective: This test is to confirm amending a basket ticket's alighting stage to a farther stage increases its fare.
        steps: |-
          **GIVEN** a TVM with a single ticket in the basket
          **AND** an example ticket whose alighting stage is amended to one farther from the boarding stage
          **WHEN** the customer amends the alighting stage
          **THEN** the ticket fare is increased
          **AND** the basket total is increased accordingly
        expected: Amending the alighting stage farther increases the ticket fare and the basket total.
      - title: Basket — Family and Friends quantity set to zero removes the line
        refs: [FBD-100336]
        objective: This test is to confirm setting a Family and Friends product quantity to zero removes it from the basket.
        steps: |-
          **GIVEN** a TVM with one or more Family and Friends products in the basket
          **WHEN** the customer alters the Family and Friends quantity to zero
          **THEN** the Family and Friends line is removed from the basket
        expected: Setting a Family and Friends quantity to zero removes the line from the basket.
      - title: Basket — increasing the Family and Friends quantity raises the total
        refs: [FBD-100336]
        objective: This test is to confirm increasing a Family and Friends quantity raises the basket quantity and total.
        steps: |-
          **GIVEN** a TVM with one Family and Friends product in the basket
          **WHEN** the customer increases the Family and Friends quantity
          **THEN** the Family and Friends line quantity increases
          **AND** the basket total increases accordingly
        expected: Increasing the Family and Friends quantity raises its line quantity and the basket total.
      - title: Basket — cash overpayment is handled after amending the basket
        refs: [FBD-100336]
        objective: This test is to confirm a basket paid by cash handles overpayment correctly after items are added and amended.
        steps: |-
          **GIVEN** a TVM with a basket that has had items added and amended
          **AND** an example basket total below the cash tendered
          **WHEN** the customer pays with cash exceeding the basket total
          **THEN** all basket tickets are printed
          **AND** the overpayment is handled per the change-giving rules
        expected: A cash overpayment on an amended basket prints all tickets and handles the overpayment correctly.

  # ═══════════════════════════════════════════════════════════════════
  #  Ticket Numbering (SHARED — regression from 6160 folded here)
  # ═══════════════════════════════════════════════════════════════════
  - path: [Functional, Sales - Tickets, Ticket Numbering]
    cases:
      - title: Ticket Numbering — identical products in separate transactions
        refs: [FBD-100336, "regression: 6160 Ticket Numbering"]
        objective: This test is to confirm two tickets of an identical product bought in separate transactions receive sequential ticket numbers.
        steps: |-
          **GIVEN** a TVM that has issued one Metro Adult Single
          **WHEN** the customer buys a second identical Metro Adult Single in a separate transaction
          **THEN** the second ticket's number follows sequentially from the first
        expected: Identical products bought in separate transactions get sequential ticket numbers.
      - title: Ticket Numbering — different products in separate transactions
        refs: [FBD-100336, "regression: 6160 Ticket Numbering"]
        objective: This test is to confirm two tickets of different products bought in separate transactions receive sequential ticket numbers.
        steps: |-
          **GIVEN** a TVM that has issued a Metro Adult Single
          **WHEN** the customer buys a different product in a separate transaction
          **THEN** the second ticket's number follows sequentially from the first
        expected: Different products bought in separate transactions get sequential ticket numbers.
      - title: Ticket Numbering — identical products in a single transaction
        refs: [FBD-100336, "regression: 6160 Ticket Numbering"]
        objective: This test is to confirm multiple tickets of an identical product in one transaction receive sequential ticket numbers.
        steps: |-
          **GIVEN** a TVM with several identical Metro Adult Singles in the basket
          **WHEN** the customer completes the single transaction
          **THEN** the printed tickets are numbered sequentially
        expected: Identical products in one transaction print with sequential ticket numbers.
      - title: Ticket Numbering — different products in a single transaction
        refs: [FBD-100336, "regression: 6160 Ticket Numbering"]
        objective: This test is to confirm multiple tickets of different products in one transaction receive sequential ticket numbers.
        steps: |-
          **GIVEN** a TVM with several different products in the basket
          **WHEN** the customer completes the single transaction
          **THEN** the printed tickets are numbered sequentially
        expected: Different products in one transaction print with sequential ticket numbers.
      - title: Ticket Numbering — cancelling a selection does not skip a number
        refs: [FBD-100336, "regression: 6160 Ticket Numbering"]
        objective: This test is to confirm cancelling an initial ticket selection for another does not consume a ticket number.
        steps: |-
          **GIVEN** a TVM with an initial product selected but not paid
          **WHEN** the customer cancels the selection and chooses another product
          **THEN** the issued ticket takes the next number in sequence
          **AND** no ticket number is skipped for the cancelled selection
        expected: Cancelling a selection for another does not skip a ticket number.

  # ═══════════════════════════════════════════════════════════════════
  #  Grouped Stops — cheapest-fare boarding rule (SHARED; FBD-100515)
  # ═══════════════════════════════════════════════════════════════════
  - path: [Functional, Sales - Tickets, Grouped Stops]
    cases:
      - title: Grouped Stops — a grouped TVM defaults to the group boarding stage
        refs: [FBD-100515]
        objective: This test is to confirm a TVM whose farestage belongs to a group defaults to the group as its boarding stage.
        steps: |-
          **GIVEN** a TVM whose farestage belongs to a configured Area group
          **AND** an example Area grouping several city-centre bus stages under one Area name (bus-only group)
          **WHEN** the customer starts a purchase
          **THEN** the TVM defaults its boarding stage to the group Area
        expected: A grouped TVM defaults its boarding stage to the group Area name rather than its single physical stage.
      - title: Grouped Stops — alighting list spans all stops in the group
        refs: [FBD-100515]
        objective: This test is to confirm the alighting list includes stops reachable from every boarding stop in the group.
        steps: |-
          **GIVEN** a TVM defaulted to a group boarding Area
          **WHEN** the customer opens the alighting selection
          **THEN** the alighting list includes stops reachable from all boarding stops in the group
        expected: The alighting list is expanded to cover all boarding stops in the group, not just the TVM's own stage.
      - title: Grouped Stops — the cheapest non-zero fare combination is selected
        refs: [FBD-100515, FBD-100336]
        objective: This test is to confirm that when several boarding/alighting combinations have fares, the lowest non-zero fare is selected.
        steps: |-
          **GIVEN** a TVM with a grouped boarding Area and a chosen alighting stop
          **AND** an example where two boarding/alighting combinations carry different valid fares
          **WHEN** the product is priced
          **THEN** the lowest non-zero fare combination is selected for the ticket
        expected: Pricing filters to the lowest non-zero fare among the group's boarding/alighting combinations.
      - title: Grouped Stops — a fare tie is broken by the first combination
        refs: [FBD-100515]
        objective: This test is to confirm that when multiple combinations share the lowest fare, the first combination in the list is chosen.
        steps: |-
          **GIVEN** a TVM with a grouped boarding Area and a chosen alighting stop
          **AND** an example where two combinations share the same lowest fare
          **WHEN** the product is priced
          **THEN** the first combination in the list is chosen for the ticket
        expected: A fare tie among group combinations is broken by picking the first combination in the list.
      - title: Grouped Stops — the printed boarding stop need not be nearest the TVM
        refs: [FBD-100515]
        objective: This test is to confirm the printed boarding stop follows the cheapest-fare rule and may not be the stop nearest the TVM.
        steps: |-
          **GIVEN** a TVM with a grouped boarding Area where the cheapest combination is not the TVM's physical stage
          **WHEN** the ticket is priced and printed
          **THEN** the printed boarding stop is the cheapest-fare stop
          **AND** the printed boarding stop is not necessarily the stop nearest the TVM
        expected: The printed boarding stop is the cheapest-fare stop and may differ from the nearest stop (expected behaviour, not a defect).
      - title: Grouped Stops — the group name shows on screen and prints on the ticket
        refs: [FBD-100515]
        objective: This test is to confirm the group Area name is displayed on screen and printed on the customer's ticket.
        steps: |-
          **GIVEN** a TVM defaulted to a group boarding Area
          **WHEN** the customer buys a ticket from the group
          **THEN** the group Area name is shown on the TVM screen
          **AND** the group Area name is printed on the ticket
        expected: The group Area name appears on the TVM screen and on the printed ticket.
      - title: Grouped Stops — no valid fare shows an error screen
        refs: [FBD-100515]
        objective: This test is to confirm the TVM shows an error screen when no boarding/alighting combination in the group has a valid fare.
        steps: |-
          **GIVEN** a TVM with a grouped boarding Area and a chosen alighting stop
          **AND** an example where no combination in the group has a valid fare
          **WHEN** the product is priced
          **THEN** an error screen is shown
          **AND** no ticket is issued
        expected: When no group combination has a valid fare, the TVM shows an error screen and issues no ticket.

  # ═══════════════════════════════════════════════════════════════════
  #  Ticket Collection & pre-booked reference (SHARED)
  # ═══════════════════════════════════════════════════════════════════
  - path: [Functional, Sales - Tickets, Ticket Collection]
    cases:
      - title: Ticket Collection — collect a pre-paid ticket using a BRID
        refs: [FBD-100336]
        objective: This test is to confirm a customer can collect a pre-paid ticket by entering a valid Booking Reference ID.
        steps: |-
          **GIVEN** a TVM on the ticket collection screen
          **AND** an example valid Booking Reference ID for a pre-paid ticket
          **WHEN** the customer enters the valid BRID
          **THEN** the pre-paid ticket is printed
        expected: A valid BRID collects and prints the pre-paid ticket.
      - title: Ticket Collection — an incomplete booking reference is rejected
        refs: [FBD-100336, "regression: 6160 Pre-Booked Tickets"]
        objective: This test is to confirm an incomplete booking reference entry is rejected.
        steps: |-
          **GIVEN** a TVM on the ticket collection screen
          **AND** an example partial booking reference shorter than the required length
          **WHEN** the customer submits the incomplete reference
          **THEN** the reference is rejected
          **AND** no ticket is printed
        expected: An incomplete booking reference is rejected and no ticket is printed.
      - title: Ticket Collection — an invalid-character booking reference is rejected
        refs: [FBD-100336, "regression: 6160 Pre-Booked Tickets"]
        objective: This test is to confirm a booking reference containing invalid characters is rejected.
        steps: |-
          **GIVEN** a TVM on the ticket collection screen
          **AND** an example booking reference containing an invalid character
          **WHEN** the customer submits the reference
          **THEN** the reference is rejected
          **AND** no ticket is printed
        expected: A booking reference with invalid characters is rejected and no ticket is printed.
      - title: Ticket Collection — a full-length valid reference is accepted
        refs: [FBD-100336, "regression: 6160 Pre-Booked Tickets"]
        objective: This test is to confirm a booking reference at the maximum permitted length is accepted and collected.
        steps: |-
          **GIVEN** a TVM on the ticket collection screen
          **AND** an example valid booking reference at the maximum character length
          **WHEN** the customer submits the full-length reference
          **THEN** the pre-paid ticket is printed
        expected: A valid maximum-length booking reference is accepted and the ticket printed.

