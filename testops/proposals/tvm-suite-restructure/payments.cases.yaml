# TVM Payments — Cash + EMV/Contactless (suite 30284)
# Consolidated NEW-suite cases for the restructured **NEW** TVM Test Suite.
# Blueprint: proposals/tvm-suite-restructure/structure.md ; evidence: cross-tab.md.
#
# Shared-vs-model decisions (from cross-tab.md, proven — author ONCE, do NOT duplicate per model):
#   * EMV / contactless is IDENTICAL on Kiosk and Astreo (same matrix) -> one shared section, no model split.
#   * Cash coin/note acceptance is shared (same bank/denomination matrix both models).
#   * Astreo-only divergence -> BNR note-recycler error flows + change-giving/Refuse Change Voucher.
#   * Kiosk-only divergence  -> coin-recycler-hopper cash handling.
# Only those two genuine divergences get explicit "(Astreo only)" / "(Kiosk only)" leaves.
#
# Grounding: old suites 6160 (R2 functional, both models), 22272/22273 (Kiosk Rail/Bus),
# 22276 (Astreo Cash & EMV); specs FBD-100320 (TID/EMV, TVM = embedded Ingenico, Terminal Group TVM),
# FBD-100341 (revenue apportionment / CloudFare audit). Cash-acceptance cases have no in-scope FBD
# (hardware-acceptance behaviour) so carry no refs; they are grounded in the old suites above.
# Worked examples use real products (Glider/Metro) and the card/limit values from the old cases;
# where an exact fare is not confirmed it is flagged as an example against the loaded fares table.
suite_id: 30284
defaults:
  template_id: 1
  custom_devtypes: [1]            # TVM
  custom_autoconfirmation: false
  custom_revstatus: 2
sections:
  # ------------------------------------------------------------------ #
  # PAYMENTS — CASH (shared across Kiosk & Astreo)
  # ------------------------------------------------------------------ #
  - path: [Functional, Payments - Cash]
    cases:
      - title: Coins — valid coins pay for a transaction and change is returned
        objective: This test is to confirm the TVM accepts valid sterling coins as payment and returns the correct change.
        steps: |-
          **GIVEN** a TVM is at the payment screen for a Glider Adult Single of £2.20 (example fare against the loaded fares table)
          **AND** cash payment is enabled and change is available
          **WHEN** the customer inserts a £2.00 coin and a 50p coin
          **THEN** the £2.50 tendered is accepted
          **AND** the outstanding balance is cleared
          **AND** 30p change is returned
          **AND** the ticket is printed
        expected: Valid coins are accepted, the ticket prints and the correct change is returned.
      - title: Coins — a valid coin is accepted after an invalid coin is inserted
        objective: This test is to confirm the TVM continues to accept valid coins after rejecting an invalid coin in the same transaction.
        steps: |-
          **GIVEN** a TVM is at the payment screen for a cash transaction
          **AND** an invalid coin has just been rejected and returned to the tray
          **WHEN** the customer inserts a valid £1.00 coin
          **THEN** the valid coin is accepted
          **AND** the amount paid increases by £1.00
        expected: The TVM keeps accepting valid coins after an invalid coin has been rejected.
      - title: Coins — coins inserted during the "More Time Required" screen complete the payment
        objective: This test is to confirm coins inserted after the "More Time Required" prompt still count towards the transaction.
        steps: |-
          **GIVEN** a TVM has a part-paid cash transaction showing the "More Time Required" screen
          **WHEN** the customer inserts the remaining coins during that screen
          **THEN** the coins are accepted towards the balance
          **AND** the transaction completes once the fare is met
        expected: Coins added during the "More Time Required" screen are accepted and complete the sale.
      - title: Coins — out-of-circulation and sub-value coins are rejected
        objective: This test is to confirm the TVM rejects sterling coins that are out of circulation or below the accepted denominations.
        steps: |-
          **GIVEN** a TVM is at the payment screen for a cash transaction
          **WHEN** the customer inserts an out-of-circulation round £1 coin, a 2p coin and a 1p coin
          **THEN** each coin is rejected
          **AND** each coin is returned to the tray
          **AND** the amount paid is unchanged
        expected: Out-of-circulation £1 and sub-5p (1p/2p) coins are rejected and returned. Data variations —old round £1, 2p, 1p.
      - title: Coins — foreign coins are rejected
        objective: This test is to confirm the TVM rejects coins that are not sterling currency.
        steps: |-
          **GIVEN** a TVM is at the payment screen for a cash transaction
          **WHEN** the customer inserts a Euro coin
          **THEN** the coin is rejected
          **AND** the coin is returned to the tray
          **AND** the amount paid is unchanged
        expected: Non-sterling coins are rejected and returned. Data variations —Euro coins, any other currency coins.
      - title: Banknotes — a valid banknote in any orientation pays for a transaction
        objective: This test is to confirm the TVM accepts valid UK banknotes from every issuing bank in all four insertion orientations.
        steps: |-
          **GIVEN** a TVM is at the payment screen for a cash transaction
          **AND** a valid Bank of England £5 polymer banknote is to be used
          **WHEN** the customer inserts the banknote
          **THEN** the banknote is accepted in any of the four orientations
          **AND** the amount paid increases by £5.00
        expected: Valid banknotes are accepted in all four orientations. Data variations —Bank of England, Bank of Ireland, Ulster Bank, Danske/Northern Bank, First Trust; £5/£10/£20; paper and polymer series.
      - title: Banknotes — withdrawn paper notes are rejected
        objective: This test is to confirm the TVM rejects sterling banknotes that are no longer legal tender.
        steps: |-
          **GIVEN** a TVM is at the payment screen for a cash transaction
          **WHEN** the customer inserts an old paper £10 note that has been withdrawn
          **THEN** the note is rejected
          **AND** the note is returned to the customer
          **AND** the customer can complete payment with valid currency
        expected: Withdrawn paper notes are rejected while valid currency still completes the sale. Data variations —old paper £5/£10/£20.
      - title: Banknotes — foreign notes are rejected
        objective: This test is to confirm the TVM rejects banknotes that are not sterling currency.
        steps: |-
          **GIVEN** a TVM is at the payment screen for a cash transaction
          **WHEN** the customer inserts a Scottish banknote
          **THEN** the note is rejected
          **AND** the note is returned
          **AND** the amount paid is unchanged
        expected: Non-sterling notes are rejected and returned. Data variations —Scottish notes, Euros, any other currency.
      - title: Cash — mixed coins and banknotes pay for a transaction
        objective: This test is to confirm the TVM accepts a mixture of coins and banknotes within one transaction.
        steps: |-
          **GIVEN** a TVM is at the payment screen for a Metro Adult Day Ticket of £3.90 (example fare against the loaded fares table)
          **WHEN** the customer inserts a £5.00 note and then coins
          **THEN** the full mixed-tender amount is accepted towards the balance
          **AND** the transaction completes once the fare is met
        expected: A mixture of banknotes and coins is accepted in a single transaction.
      - title: Cash — overpayment returns the correct change
        objective: This test is to confirm the TVM returns the correct change when the customer overpays a cash transaction.
        steps: |-
          **GIVEN** a TVM is at the payment screen for a Glider Adult Single of £2.20 (example fare against the loaded fares table)
          **WHEN** the customer inserts a £5.00 note
          **THEN** the ticket is printed
          **AND** £2.80 change is returned in coins
        expected: Overpayment is accepted and the correct change is returned in coins.
      - title: Cash — pressing Back returns the inserted cash before the escrow limit
        objective: This test is to confirm inserted cash is returned when the customer presses Back before an escrow limit is reached.
        steps: |-
          **GIVEN** a TVM has a part-paid cash transaction with coins and notes held in escrow
          **AND** neither the coin nor the banknote escrow limit has been reached
          **WHEN** the customer presses Back
          **THEN** all inserted coins and notes are returned
          **AND** the transaction is cancelled
        expected: Pressing Back before the escrow limit returns all inserted cash and cancels the sale.
      - title: Cash — pressing Cancel returns the inserted cash after the escrow limit
        objective: This test is to confirm inserted cash is returned when the customer presses Cancel after an escrow limit has been reached.
        steps: |-
          **GIVEN** a TVM has a part-paid cash transaction where the coin escrow limit has been reached
          **WHEN** the customer presses Cancel
          **THEN** all inserted coins and notes are returned
          **AND** the transaction is cancelled
        expected: Pressing Cancel after the escrow limit returns all inserted cash and cancels the sale.
      - title: Cash — the coin escrow limit stops further coins being accepted
        objective: This test is to confirm the TVM stops accepting coins once the coin escrow limit is reached.
        steps: |-
          **GIVEN** a TVM has a cash transaction where the coin escrow limit has been reached
          **WHEN** the customer attempts to insert a further coin
          **THEN** the coin is not accepted
          **AND** the "no more coins accepted" message is shown
        expected: Once the coin escrow limit is reached no further coins are accepted.
      - title: Cash — the banknote escrow limit stops further notes being accepted
        objective: This test is to confirm the TVM stops accepting banknotes once the banknote escrow limit is reached.
        steps: |-
          **GIVEN** a TVM has a cash transaction where the banknote escrow limit has been reached
          **WHEN** the customer attempts to insert a further note
          **THEN** the note is not accepted
          **AND** the "no more notes accepted" message is shown
        expected: Once the banknote escrow limit is reached no further notes are accepted.
      - title: Cash — a print failure returns the inserted cash
        objective: This test is to confirm the TVM returns the customer's cash when the ticket fails to print on a cash sale.
        steps: |-
          **GIVEN** a TVM has taken full cash payment for a ticket
          **WHEN** the ticket fails to print
          **THEN** the inserted cash is returned to the customer
          **AND** no ticket is issued
        expected: A print failure on a cash sale returns the customer's cash and issues no ticket.
      - title: Cash — a completed cash sale posts audit data to CloudFare
        refs: [FBD-100341]
        objective: This test is to confirm a completed cash transaction posts conformant audit data to the back office.
        steps: |-
          **GIVEN** a TVM has completed a cash sale of a Glider Adult Single (example product)
          **WHEN** the transaction is sent to CloudFare
          **THEN** the record shows the payment method as cash
          **AND** the record carries the route-derived operating unit for the sale
          **AND** the device home location is present for pay-in reconciliation
        expected: A completed cash sale posts an audit record to CloudFare with cash payment method, route operating unit and device home location.
  # ------------------------------------------------------------------ #
  # PAYMENTS — CASH / Note Recycler & Change (ASTREO ONLY)
  # BNR note-recycler error flows + change-giving / Refuse Change Voucher.
  # ------------------------------------------------------------------ #
  - path: [Functional, Payments - Cash, Note Recycler & Change (Astreo only)]
    cases:
      - title: BNR — a note left in the exit beak leaves the recycler non-functional
        objective: This test is to confirm the Astreo BNR is reported non-functional when a dispensed note is left in the exit beak.
        steps: |-
          **GIVEN** an Astreo TVM has a note presented at the BNR exit beak during a cash transaction
          **WHEN** the customer selects Cancel and leaves the note in the exit beak
          **THEN** the BNR is reported as non-functional
          **AND** note payment becomes unavailable until the note is cleared
        expected: A note left in the exit beak leaves the BNR non-functional and note payment unavailable. Data variations —Cancel, Back.
      - title: BNR — a rejected invalid note left hanging from the exit beak leaves the recycler non-functional
        objective: This test is to confirm the Astreo BNR is reported non-functional when a rejected invalid note is left hanging from the exit beak.
        steps: |-
          **GIVEN** an Astreo TVM has rejected an invalid banknote
          **AND** the rejected note is left hanging from the BNR exit beak
          **WHEN** the customer does not remove the note
          **THEN** the BNR is reported as non-functional
          **AND** note payment becomes unavailable until the note is cleared
        expected: A rejected note left hanging from the exit beak leaves the BNR non-functional until cleared.
      - title: BNA — a note-acceptor error makes note payment unavailable
        objective: This test is to confirm the Astreo TVM handles a bank note acceptor error and disables note payment.
        steps: |-
          **GIVEN** an Astreo TVM is at the payment screen for a cash transaction
          **WHEN** the bank note acceptor reports a hardware error
          **THEN** note payment is shown as unavailable
          **AND** the customer can still pay by coins or by card
        expected: A BNA error disables note payment while coin and card payment remain available.
      - title: Change — insufficient change prints a Refuse Change Voucher for the balance
        refs: [FBD-100341]
        objective: This test is to confirm the Astreo TVM prints a Refuse Change Voucher when it cannot return the full change due.
        steps: |-
          **GIVEN** an Astreo TVM is in a low-change state and cannot return the full change due
          **AND** a Glider Adult Single of £2.20 is being paid with a £5.00 note (example fare)
          **WHEN** the transaction completes
          **THEN** the ticket is printed
          **AND** a Refuse Change Voucher is printed for the outstanding change
          **AND** a ChangeVoucher issued event is posted to CloudFare
        expected: When change is insufficient the ticket prints and a Refuse Change Voucher is issued for the balance, with a ChangeVoucher event to CloudFare.
      - title: Change — a Refuse Change Voucher is printed when cash is inserted during the "More Time Required" screen
        objective: This test is to confirm the Refuse Change Voucher is issued for a low-change transaction whose cash is inserted during the "More Time Required" screen.
        steps: |-
          **GIVEN** an Astreo TVM is in a low-change state and cannot return the full change due
          **AND** the customer inserts coins during the "More Time Required" screen
          **WHEN** the transaction completes
          **THEN** the ticket is printed
          **AND** a Refuse Change Voucher is printed for the outstanding change
        expected: A low-change transaction paid during the "More Time Required" screen still prints the ticket and a Refuse Change Voucher.
  # ------------------------------------------------------------------ #
  # PAYMENTS — CASH / Coin Recycler Hopper (KIOSK ONLY)
  # Kiosk cash unit uses coin recycler hoppers.
  # ------------------------------------------------------------------ #
  - path: [Functional, Payments - Cash, Coin Recycler Hopper (Kiosk only)]
    cases:
      - title: Coin recycler — a Cash Content Report is produced after a hopper is replaced
        objective: This test is to confirm a Kiosk TVM produces a correct Cash Content Report after a coin recycler hopper is replaced.
        steps: |-
          **GIVEN** a Kiosk TVM has had a coin recycler hopper replaced by an engineer
          **WHEN** the engineer prints a Cash Content Report from the EMS menu
          **THEN** the report shows the coin content of the replaced hopper
          **AND** the hopper level reflects the newly fitted hopper
        expected: After a coin recycler hopper is replaced the Cash Content Report shows the correct coin content for the new hopper.
      - title: Coin recycler — replenishing a hopper restores change-giving from a low-change state
        objective: This test is to confirm replenishing a Kiosk coin recycler hopper returns the TVM to a normal change-giving state.
        steps: |-
          **GIVEN** a Kiosk TVM is in a low-change state because a coin recycler hopper is depleted
          **WHEN** the engineer replenishes the coin recycler hopper and updates the levels
          **THEN** the TVM returns to a green change-giving state
          **AND** subsequent overpayments return coin change normally
        expected: Replenishing a depleted coin recycler hopper clears the low-change state and restores normal coin change-giving.
  # ------------------------------------------------------------------ #
  # PAYMENTS — EMV & CONTACTLESS (shared across Kiosk & Astreo; authored ONCE)
  # TVM = embedded Ingenico, NMI Terminal Group "TVM" (FBD-100320).
  # ------------------------------------------------------------------ #
  - path: [Functional, Payments - EMV & Contactless]
    cases:
      - title: Chip & PIN — a valid card completes payment and prints the ticket
        refs: [FBD-100320]
        objective: This test is to confirm the TVM completes a Chip & PIN payment with a valid card and prints the ticket.
        steps: |-
          **GIVEN** a TVM is at the payment screen for a Glider Adult Single of £2.20 (example fare against the loaded fares table)
          **AND** a valid Visa Debit Chip & PIN card is to be used
          **WHEN** the customer inserts the card and enters the correct PIN
          **THEN** the payment is approved
          **AND** the ticket is printed
        expected: A valid Chip & PIN card is approved and the ticket prints. Data variations —Visa credit/debit, Mastercard credit/debit.
      - title: Chip & PIN — a payment with no PIN entered does not complete
        refs: [FBD-100320]
        objective: This test is to confirm a Chip & PIN payment does not complete when the customer enters no PIN.
        steps: |-
          **GIVEN** a TVM is at the Chip & PIN payment screen with a valid card inserted
          **WHEN** the customer enters no PIN and the pinpad times out
          **THEN** the payment does not complete
          **AND** no ticket is issued
        expected: With no PIN entered the Chip & PIN payment does not complete and no ticket is issued.
      - title: Chip & PIN — American Express and Diners cards are accepted
        refs: [FBD-100320]
        objective: This test is to confirm the TVM accepts American Express and Diners Club Chip & PIN cards.
        steps: |-
          **GIVEN** a TVM is at the payment screen for a cash-or-card transaction
          **AND** a valid American Express credit Chip & PIN card is to be used
          **WHEN** the customer inserts the card and enters the correct PIN
          **THEN** the payment is approved
          **AND** the ticket is printed
        expected: American Express and Diners Chip & PIN cards are accepted. Data variations —Amex credit/debit, Diners Club.
      - title: Chip & PIN — transaction value limits are enforced
        refs: [FBD-100320]
        objective: This test is to confirm the TVM enforces the minimum and maximum Chip & PIN transaction values.
        steps: |-
          **GIVEN** a TVM is at the Chip & PIN payment screen
          **WHEN** the customer attempts a transaction valued at 15p and separately at £500.05
          **THEN** each transaction outside the accepted range is not allowed
          **AND** a transaction of 20p and a transaction of £500.00 within the range are accepted
        expected: Chip & PIN transactions below 20p or above £500.00 are rejected while values within range are accepted.
      - title: Contactless — a tap at or below the contactless limit is approved
        refs: [FBD-100320]
        objective: This test is to confirm the TVM approves a contactless payment at or below the configured contactless limit.
        steps: |-
          **GIVEN** a TVM is at the payment screen with the contactless limit set to £100.00 (loaded configuration)
          **AND** a valid Visa contactless card is to be used
          **WHEN** the customer taps the card for a £100.00 transaction
          **THEN** the payment is approved without a PIN
          **AND** the ticket is printed
        expected: A contactless tap at or below the limit is approved without a PIN. Data variations —Visa/Mastercard credit/debit; legacy £30.00 limit.
      - title: Contactless — a tap above the contactless limit falls back to Chip & PIN
        refs: [FBD-100320]
        objective: This test is to confirm a contactless tap above the configured limit falls back to Chip & PIN.
        steps: |-
          **GIVEN** a TVM is at the payment screen with the contactless limit set to £100.00 (loaded configuration)
          **WHEN** the customer taps a valid card for a £100.01 transaction
          **THEN** the contactless tap is not approved on its own
          **AND** the customer is prompted to insert the card and enter a PIN
        expected: A tap above the contactless limit is declined for contactless and falls back to Chip & PIN.
      - title: Contactless — a mobile wallet payment is approved
        refs: [FBD-100320]
        objective: This test is to confirm the TVM approves a mobile wallet contactless payment.
        steps: |-
          **GIVEN** a TVM is at the payment screen for a £30.00 transaction
          **AND** an Apple Pay Mastercard credit device is to be used
          **WHEN** the customer taps the mobile device
          **THEN** the payment is approved
          **AND** the ticket is printed
        expected: A mobile wallet payment is approved and the ticket prints. Data variations —Apple/Google/Samsung Pay; Mastercard/Visa credit/debit.
      - title: EMV — a declined card offers retry or cancel
        refs: [FBD-100320]
        objective: This test is to confirm a declined EMV payment offers the customer a retry or cancel option and issues no ticket.
        steps: |-
          **GIVEN** a TVM is at the EMV payment screen with a card that will be declined
          **WHEN** the payment is declined by the acquirer
          **THEN** the customer is offered retry or cancel
          **AND** no ticket is issued
        expected: A declined card is handled with a retry/cancel prompt and no ticket is issued.
      - title: EMV — cancelling at the pinpad ends the payment without a ticket
        refs: [FBD-100320]
        objective: This test is to confirm cancelling at the pinpad ends the EMV payment and issues no ticket.
        steps: |-
          **GIVEN** a TVM has an EMV payment in progress at the pinpad
          **WHEN** the customer cancels at the pinpad
          **THEN** the payment is not completed
          **AND** no ticket is issued
        expected: Cancelling at the pinpad ends the payment and no ticket is issued.
      - title: EMV — a payment that times out is not completed
        refs: [FBD-100320]
        objective: This test is to confirm an EMV payment that times out is not completed and issues no ticket.
        steps: |-
          **GIVEN** a TVM has an EMV payment in progress
          **WHEN** the payment process times out with no card action
          **THEN** the payment is not completed
          **AND** no ticket is issued
        expected: A timed-out EMV payment is not completed and no ticket is issued.
      - title: EMV — a print failure voids the card payment
        refs: [FBD-100320]
        objective: This test is to confirm a print failure during a card sale voids the card payment.
        steps: |-
          **GIVEN** a TVM has taken an approved card payment for a ticket
          **WHEN** the ticket fails to print
          **THEN** the card payment is voided
          **AND** no ticket is issued
        expected: A print failure during a card sale voids the card payment and issues no ticket.
      - title: EMV — an expired or blocked card is rejected
        refs: [FBD-100320]
        objective: This test is to confirm the TVM rejects an expired or blocked payment card.
        steps: |-
          **GIVEN** a TVM is at the EMV payment screen
          **WHEN** the customer presents an expired payment card
          **THEN** the card is rejected
          **AND** no ticket is issued
        expected: An expired or blocked card is rejected and no ticket is issued. Data variations —expired card, blocked card.
      - title: EMV — the PAN is masked on the receipt and back-office systems
        refs: [FBD-100320]
        objective: This test is to confirm the full card PAN is never shown on the receipt, device or back-office systems.
        steps: |-
          **GIVEN** a TVM has completed a Chip & PIN card sale
          **WHEN** the receipt and the back-office records are inspected
          **THEN** the full PAN is not shown on the card receipt
          **AND** the full PAN is not shown on the Ingenico device
          **AND** the full PAN is not shown in CloudFare, MERIT or Smartrack
        expected: The full card PAN is masked on the receipt, the Ingenico device, CloudFare, MERIT and Smartrack.
      - title: EMV — selecting card after a cash transaction returns any inserted cash and pays by card
        refs: [FBD-100320]
        objective: This test is to confirm the customer can switch a started cash transaction to EMV and any inserted cash is returned.
        steps: |-
          **GIVEN** a TVM has a cash transaction selected with coins already inserted
          **WHEN** the customer switches to pay by card and completes the EMV payment
          **THEN** the inserted cash is returned
          **AND** the payment is taken by card
          **AND** the ticket is printed
        expected: Switching a started cash transaction to card returns the inserted cash and completes payment by card. Data variations —before cash inserted, after cash inserted.
      - title: EMV — a completed card sale posts audit data to CloudFare under the TVM terminal ID
        refs: [FBD-100320, FBD-100341]
        objective: This test is to confirm a completed card sale posts conformant audit data referencing the TVM payment terminal ID.
        steps: |-
          **GIVEN** a TVM has completed a card sale using its allocated TID from the NMI "TVM" terminal group
          **WHEN** the transaction is sent to CloudFare
          **THEN** the record shows the payment method as card
          **AND** the record is auditable against the device's TID
          **AND** the record carries the route-derived operating unit for the sale
        expected: A completed card sale posts an audit record to CloudFare with card payment method, the TVM TID and the route operating unit.
      - title: EMV — a card payment receipt is printed when selected
        refs: [FBD-100320]
        objective: This test is to confirm the TVM prints a card payment receipt when the customer requests one.
        steps: |-
          **GIVEN** a TVM has an approved card sale with the receipt option selected
          **WHEN** the transaction completes
          **THEN** a card payment receipt is printed
        expected: When a receipt is requested the TVM prints a card payment receipt for the sale.
