suite_id: 30284
defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [6]
  custom_autoconfirmation: false

sections:
  - path: [Functional, Sales - Tickets, Basket]
    cases:
      - title: "Basket — editing a Single/Return item opens its edit screen"
        refs: MODE-ALL
        objective: |
          This test is to confirm opting to edit a Single/Return item in the basket opens the
          Single/Return edit screen for that item.
        steps: |
          **GIVEN** the Basket screen is displayed with a Single/Return ticket item in the basket
          **WHEN** the customer opts to edit that item
          **THEN** the "Edit Basket Item Single/Return" screen is displayed
        expected: "Editing a Single/Return basket item opens the Single/Return edit screen."

      - title: "Basket — editing a Day Ticket item opens its edit screen"
        refs: MODE-ALL
        objective: |
          This test is to confirm opting to edit a Day Ticket item in the basket opens the Day
          Ticket edit screen for that item.
        steps: |
          **GIVEN** the Basket screen is displayed with a Day Ticket item in the basket
          **WHEN** the customer opts to edit that Day travel item
          **THEN** the "Edit Basket Item Day Ticket" screen is displayed
        expected: "Editing a Day Ticket basket item opens the Day Ticket edit screen."

      - title: "Basket — Pay Now reaches the Payment Process after a payment type is selected"
        refs: MODE-ALL
        objective: |
          This test is to confirm pressing Pay Now from the Basket reaches the Payment Process once
          a payment type is selected.
        steps: |
          **GIVEN** the Basket screen is displayed with at least one item and "Pay Now" available
          **WHEN** the customer presses Pay Now, then selects a payment type on the "Select Payment
          Type" screen
          **THEN** the Payment Process begins
        expected: "Pressing Pay Now and selecting a payment type from the basket starts the Payment Process."

      - title: "Basket — Pay Now (Basket - 2025 variant) continues the payment flow"
        refs: MODE-ALL
        objective: |
          This test is to confirm pressing Pay Now from the Basket, where the "Select Payment Type
          (Basket - 2025)" variant screen is shown, continues the payment flow as normal.
        steps: |
          **GIVEN** the Basket screen is displayed with at least one item and "Pay Now" available
          **WHEN** the customer presses Pay Now and the "Select Payment Type (Basket - 2025)" screen
          is shown
          **THEN** the payment flow continues as normal
        expected: "From the Basket - 2025 variant of Select Payment Type, the payment flow continues as normal."

      - title: "Select Payment Type (Basket - 2025) — Back returns to Select tickets with tickets selected"
        refs: MODE-ALL
        objective: |
          This test is to confirm pressing Back on the "Select Payment Type (Basket - 2025)" screen
          returns to the "Select tickets - with tickets selected (Basket)" screen.
        steps: |
          **GIVEN** the "Select Payment Type (Basket - 2025)" screen is displayed
          **WHEN** the customer presses Back
          **THEN** the "Select tickets - with tickets selected (Basket)" screen is displayed
        expected: "Back from the Basket - 2025 payment type screen returns to the tickets-selected screen."

      - title: "Select Payment Type (Basket - 2025) — Back or View Basket returns to the Basket"
        refs: MODE-ALL
        objective: |
          This test is to confirm pressing Back or 'View Basket' on the "Select Payment Type
          (Basket - 2025)" screen returns to the Basket screen.
        steps: |
          **GIVEN** the "Select Payment Type (Basket - 2025)" screen is displayed
          **WHEN** the customer presses Back or 'View Basket'
          **THEN** the Basket screen is displayed
        expected: "Back or View Basket from the Basket - 2025 payment type screen returns to the Basket."

      - title: "Basket — Add More Items reaches the destination selection screen"
        refs: MODE-ALL
        objective: |
          This test is to confirm selecting 'Add More Items' from the Basket reaches the destination
          selection screen.
        steps: |
          **GIVEN** the Basket screen is displayed
          **WHEN** the customer selects 'Add More Items'
          **THEN** the "Choose destination station - Main Screen (Basket)" screen is displayed
        expected: "Add More Items from the Basket reaches the destination selection screen."

      - title: "Basket — Add More Items reaches Operator Selection for another ticket"
        refs: MODE-ALL
        objective: |
          This test is to confirm selecting 'Add More Items' from the Basket reaches Operator
          Selection to select another ticket.
        steps: |
          **GIVEN** the Basket screen is displayed
          **WHEN** the customer presses 'Add More Items'
          **THEN** the flow proceeds to Operator Selection for selecting another ticket
        expected: "Add More Items from the Basket can proceed to Operator Selection to select another ticket."

      - title: "Destination selection (Basket) — selecting a destination reaches Single-Return Ulsterbus"
        refs: MODE-ALL
        objective: |
          This test is to confirm selecting a destination on the "Choose destination station - Main
          Screen (Basket)" screen reaches the "Single-Return - Ulsterbus (Basket)" screen.
        steps: |
          **GIVEN** the "Choose destination station - Main Screen (Basket)" screen is displayed
          **WHEN** the customer selects a destination
          **THEN** the "Single-Return - Ulsterbus (Basket)" screen is displayed
        expected: "Selecting a destination from the basket's Main Screen reaches Single-Return - Ulsterbus (Basket)."

      - title: "Destination selection (Basket) — Search Bar opens destination search"
        refs: MODE-ALL
        objective: |
          This test is to confirm tapping the Search Bar on the "Choose destination station - Main
          Screen (Basket)" screen opens the destination search screen.
        steps: |
          **GIVEN** the "Choose destination station - Main Screen (Basket)" screen is displayed
          **WHEN** the customer taps the Search Bar
          **THEN** the "Choose destination station - search for station - Basket" screen is displayed
        expected: "Tapping the Search Bar on the basket's Main Screen opens the destination search screen."

      - title: "Destination search (Basket) — selecting a destination reaches Single-Return Ulsterbus"
        refs: MODE-ALL
        objective: |
          This test is to confirm selecting a destination on the "Choose destination station -
          search for station - Basket" screen reaches the "Single-Return - Ulsterbus (Basket)" screen.
        steps: |
          **GIVEN** the "Choose destination station - search for station - Basket" screen is
          displayed
          **WHEN** the customer selects a destination
          **THEN** the "Single-Return - Ulsterbus (Basket)" screen is displayed
        expected: "Selecting a destination from the basket's destination search reaches Single-Return - Ulsterbus (Basket)."

      - title: "Destination search (Basket) — Back returns to the Main Screen"
        refs: MODE-ALL
        objective: |
          This test is to confirm pressing Back on the "Choose destination station - search for
          station - Basket" screen returns to the "Choose destination station - Main Screen
          (Basket)" screen.
        steps: |
          **GIVEN** the "Choose destination station - search for station - Basket" screen is
          displayed
          **WHEN** the customer presses Back
          **THEN** the "Choose destination station - Main Screen (Basket)" screen is displayed
        expected: "Back from the basket's destination search returns to the destination Main Screen."

      - title: "Destination search (Basket) — View Basket returns to the prior screen"
        refs: MODE-ALL
        objective: |
          This test is to confirm pressing 'View Basket' on the "Choose destination station - search
          for station - Basket" screen returns the customer to the screen they were on before.
        steps: |
          **GIVEN** the "Choose destination station - search for station - Basket" screen is
          displayed
          **WHEN** the customer presses 'View Basket'
          **THEN** the customer is returned to the screen they were on before pressing 'View Basket'
        expected: "View Basket from the basket's destination search returns the customer to the prior screen."

      - title: "Single-Return - Ulsterbus (Basket) — proceeds to Select Tickets"
        refs: MODE-ALL
        objective: |
          This test is to confirm the "Single-Return - Ulsterbus (Basket)" screen proceeds to the
          "Select Tickets (Basket)" screen.
        steps: |
          **GIVEN** the "Single-Return - Ulsterbus (Basket)" screen is displayed
          **WHEN** the customer proceeds from this screen
          **THEN** the "Select Tickets (Basket)" screen is displayed
        expected: "Proceeding from Single-Return - Ulsterbus (Basket) reaches Select Tickets (Basket)."

      - title: "Single-Return - Ulsterbus (Basket) — Back returns to destination selection"
        refs: MODE-ALL
        objective: |
          This test is to confirm pressing Back on the "Single-Return - Ulsterbus (Basket)" screen
          returns to the "Choose destination station - Main Screen (Basket)" screen.
        steps: |
          **GIVEN** the "Single-Return - Ulsterbus (Basket)" screen is displayed
          **WHEN** the customer presses Back
          **THEN** the "Choose destination station - Main Screen (Basket)" screen is displayed
        expected: "Back from Single-Return - Ulsterbus (Basket) returns to the destination Main Screen."

      - title: "Select Tickets (Basket) — Arrow Buttons select a ticket count and confirm"
        refs: MODE-ALL
        objective: |
          This test is to confirm selecting a number of tickets via the Arrow Buttons on "Select
          Tickets (Basket)" reaches the tickets-selected screen.
        steps: |
          **GIVEN** the "Select Tickets (Basket)" screen is displayed
          **WHEN** the customer selects a number of tickets by tapping the Arrow Buttons
          **THEN** the "Select tickets - with tickets selected (Basket)" screen is displayed
        expected: "Selecting a ticket count via the Arrow Buttons reaches the tickets-selected basket screen."

      - title: "Select Tickets (Basket) — Back returns to Single-Return Ulsterbus"
        refs: MODE-ALL
        objective: |
          This test is to confirm pressing Back on the "Select Tickets (Basket)" screen returns to
          the "Single-Return - Ulsterbus (Basket)" screen.
        steps: |
          **GIVEN** the "Select Tickets (Basket)" screen is displayed
          **WHEN** the customer presses Back
          **THEN** the "Single-Return - Ulsterbus (Basket)" screen is displayed
        expected: "Back from Select Tickets (Basket) returns to Single-Return - Ulsterbus (Basket)."

      - title: "Select tickets with tickets selected (Basket) — Back returns to Single-Return Ulsterbus"
        refs: MODE-ALL
        objective: |
          This test is to confirm pressing Back on the "Select tickets - with tickets selected
          (Basket)" screen returns to the "Single-Return - Ulsterbus (Basket)" screen.
        steps: |
          **GIVEN** the "Select tickets - with tickets selected (Basket)" screen is displayed
          **WHEN** the customer presses Back
          **THEN** the "Single-Return - Ulsterbus (Basket)" screen is displayed
        expected: "Back from the tickets-selected basket screen returns to Single-Return - Ulsterbus (Basket)."

      - title: "Select tickets with tickets selected (Basket) — reaches the Basket"
        refs: MODE-ALL
        objective: |
          This test is to confirm the "Select tickets - with tickets selected (Basket)" screen can
          reach the Basket screen.
        steps: |
          **GIVEN** the "Select tickets - with tickets selected (Basket)" screen is displayed
          **WHEN** the customer proceeds from this screen
          (**GAP** — exact trigger/button not labelled in the flow-map source; confirm on live system)
          **THEN** the Basket screen is displayed
        expected: "From the tickets-selected basket screen, the customer can reach the Basket."

      - title: "Select tickets with tickets selected (Basket) — reaches Select Payment Type (Basket - 2025)"
        refs: MODE-ALL
        objective: |
          This test is to confirm the "Select tickets - with tickets selected (Basket)" screen can
          reach the "Select Payment Type (Basket - 2025)" screen.
        steps: |
          **GIVEN** the "Select tickets - with tickets selected (Basket)" screen is displayed
          **WHEN** the customer proceeds from this screen
          (**GAP** — exact trigger/button not labelled in the flow-map source; confirm on live system)
          **THEN** the "Select Payment Type (Basket - 2025)" screen is displayed
        expected: "From the tickets-selected basket screen, the customer can reach Select Payment Type (Basket - 2025)."

      - title: "Basket — Cancel with items in the basket returns to the Home Screen and empties the basket"
        refs: MODE-ALL
        objective: |
          This test is to confirm pressing Cancel while items are in the basket returns the customer
          to the Home Screen and removes all items from the basket.
        steps: |
          **GIVEN** the Basket screen is displayed with one or more items in the basket
          **WHEN** the customer presses Cancel
          **THEN** the Home Screen is displayed
          **AND** all items are removed from the basket
        expected: "Cancelling with items in the basket returns to the Home Screen with the basket emptied."
