  - match: Booking Reference — an invalid booking reference is rejected
    title: Booking Reference — an invalid booking reference is rejected (invalid To Station)
    refs:
    - FBD-100483
    objective: This test is to confirm a booking reference with an invalid To Station is rejected with
      the standard message.
    steps: '**GIVEN** a customer is at the TVM Collect Tickets screen

      **AND** a booking reference whose To Station does not match the product

      **WHEN** the customer submits the booking reference

      **THEN** the message "Booking reference entered is invalid" is displayed

      **AND** a logfailure message is posted to the back office'
    expected: 'An invalid To Station on a booking reference is rejected with "Booking reference entered
      is invalid" and a logfailure is posted.


