  - title: Ticket Collection — a redemption above the barcode ceiling limit cannot validate offline
    refs:
    - FBD-100483
    - FBD-100317
    objective: This test is to confirm a collection whose value exceeds the offline ceiling limit is not
      validated offline.
    steps: '**GIVEN** a customer is at the TVM Collect Tickets screen with no back-office connection

      **AND** a booking reference whose ticket value exceeds the configured barcode ceiling limit

      **WHEN** the customer submits the booking reference

      **THEN** the collection is refused offline

      **AND** a value-exceeds-offline-limit message is displayed'
    expected: 'A collection above the offline ceiling limit is refused offline with a value-exceeds-limit
      message.


      [Automatable: Partial]'
  - title: Ticket Collection — a redemption below the barcode ceiling limit validates offline
    refs:
    - FBD-100483
    - FBD-100317
    objective: This test is to confirm a collection whose value is within the offline ceiling limit validates
      and completes offline.
    steps: '**GIVEN** a customer is at the TVM Collect Tickets screen with no back-office connection

      **AND** a booking reference whose ticket value is below the configured barcode ceiling limit

      **WHEN** the customer submits the booking reference

      **THEN** the collection is validated offline

      **AND** the pre-paid ticket is printed'
    expected: 'A collection below the offline ceiling limit validates offline and the ticket prints.


