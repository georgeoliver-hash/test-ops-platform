  cases:
  - match: Ticket Collection — a valid booking reference collects and prints the pre-paid ticket
    title: Ticket Collection — a valid booking reference collects and prints the pre-paid ticket (barcode
      Type B)
    refs:
    - FBD-100483
    - FBD-100317
    objective: This test is to confirm a customer can collect a pre-paid single-use ticket on the TVM
      using a Type B booking reference.
    steps: '**GIVEN** a customer is at the TVM Collect Tickets screen

      **AND** a valid Type B single-use booking reference for a Rail Adult Single

      **WHEN** the customer keys the booking reference and confirms collection

      **THEN** the pre-paid ticket is printed

      **AND** the "Take Your Tickets" prompt is displayed'
    expected: 'A valid Type B booking reference collects the pre-paid single-use ticket, prints it, and
      prompts the customer to take it.


