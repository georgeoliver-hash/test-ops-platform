  - match: Booking Reference — a malformed reference entry is rejected before submission
    title: Booking Reference — a malformed reference entry is rejected before submission (incomplete entry)
    refs:
    - FBD-100483
    objective: This test is to confirm the TVM rejects a booking-reference entry that is incomplete entry.
    steps: '**GIVEN** a customer is at the TVM Collect Tickets entry screen

      **AND** an incomplete booking reference shorter than the required length

      **WHEN** the customer attempts to submit the reference

      **THEN** the entry is not accepted

      **AND** the customer is prompted to correct the reference'
    expected: 'A booking-reference entry that is incomplete entry is not accepted and the customer is
      prompted to correct it.


