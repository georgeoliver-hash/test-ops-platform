  - match: Ticket Collection — a collection against a legacy stage resolves the legacy stage name
    title: Ticket Collection — a collection against a legacy stage resolves the legacy stage name (Type
      B)
    refs:
    - FBD-100483
    objective: This test is to confirm a Type B booking reference using a legacy stage resolves it via
      the legacy stages file.
    steps: '**GIVEN** a customer is at the TVM Collect Tickets screen

      **AND** a Type B booking reference whose alighting point is the legacy stage "Any NIR Station"

      **WHEN** the customer submits the booking reference

      **THEN** the legacy stage is resolved to its stage name from the legacy stages file

      **AND** the ticket is printed for that legacy stage'
    expected: 'A Type B legacy-stage booking reference resolves the stage name from the legacy stages
      file and the ticket prints.


