# TVM consolidation-COMPLETENESS audit, 2026-07-23 — genuine live-suite additions.
# Target: **NEW** TVM Test Suite (30284), project 42. Read-only source suites: 5602, 6160, 22270,
# 22272, 22273, 22274, 22275, 22276, 22278, 22279.
#
# Each case here is a scenario proven real by an OLD-SUITE case (cited in `refs`) that is named
# NOWHERE in the live 30284 suite — not its own case, not a Data variations line. Full family-by-
# family accounting (including families that were NOT gaps — Kiosk×Astreo×mode triplication that
# was correctly removed, and the whole Smartcard/ABT area that is capability-blocked per George's
# 2026-07-21 live confirmation, not a completeness defect) is in
# `tvm-consolidation-completeness.changelog.md`.

suite: "**NEW** TVM Test Suite"
suite_id: 30284

defaults:
  template_id: 1
  custom_devtypes: [1]
  custom_revstatus: 2
  custom_autoconfirmation: false

sections:
  - path: [Functional, Payments - Cash, Note Recycler & Change (Kiosk only)]
    cases:
      - title: BNR — a note left in the exit beak remains functional on Kiosk
        refs: [old-suite C1831504]
        objective: This test is to confirm the Kiosk BNR remains functional when a dispensed note is left in the exit beak, unlike the Astreo BNR which is reported non-functional in the same scenario (see the Astreo-only sibling case).
        steps: |-
          **GIVEN** a Kiosk TVM has a note presented at the BNR exit beak during a cash transaction
          **WHEN** the customer selects Cancel or Back and leaves the note in the exit beak
          **THEN** the BNR remains functional
          **AND** note payment stays available
        expected: |-
          A note left in the exit beak does not disable the Kiosk BNR. Data variations: Cancel, Back.

          [Automatable: Partial — Cross-check: CloudFare / MERIT]
      - title: BNR — a rejected note left hanging from the exit beak remains functional on Kiosk
        refs: [old-suite C1831506]
        objective: This test is to confirm the Kiosk BNR remains functional when a rejected invalid banknote is left hanging from the exit beak, unlike the Astreo BNR which is reported non-functional in the same scenario.
        steps: |-
          **GIVEN** a Kiosk TVM has rejected an invalid banknote
          **AND** the rejected note is left hanging from the BNR exit beak
          **WHEN** the customer does not remove the note
          **THEN** the BNR remains functional
          **AND** note payment stays available
        expected: |-
          A rejected note left hanging from the exit beak does not disable the Kiosk BNR.

          [Automatable: Partial — Cross-check: CloudFare / MERIT]

  - path: [Functional, Payments - EMV & Contactless]
    cases:
      - title: EMV — a card removed before the transaction completes is handled safely
        refs: [old-suite C3544878, old-suite C3544882]
        objective: This test is to confirm the TVM handles a payment card physically removed before the transaction completes, for both Chip & PIN and contactless.
        steps: |-
          **GIVEN** a TVM transaction is at the EMV payment step
          **WHEN** the customer removes the payment card before the transaction completes
          **THEN** the transaction is not completed
          **AND** no ticket is issued
        expected: |-
          Removing the card mid-transaction leaves the purchase incomplete and issues no ticket. Data variations: Chip & PIN (insert reader), contactless (tap reader).

          [Automatable: Partial — Cross-check: CloudFare / MERIT]

  - path: [Functional, Payments - Cash]
    cases:
      - title: Cash — a coin or note jam is cleared successfully during payment or change
        refs: [old-suite C1831511, old-suite C1831513, old-suite C1831515]
        objective: This test is to confirm the TVM successfully clears a coin or note jam occurring during payment insertion or during the issuing of change, and the transaction continues.
        steps: |-
          **GIVEN** a customer has commenced inserting coins or notes, or is receiving change, for a product purchase
          **WHEN** a coin or note becomes jammed and the TVM successfully clears the jam
          **THEN** the insertion slot reopens
          **AND** the transaction continues normally
        expected: |-
          A successfully-cleared coin/note jam does not abort the transaction. Data variations: coin jam during payment, note jam during payment, coin jam during change.

          [Automatable: Partial — Cross-check: CloudFare / MERIT]
      - title: Cash — a coin or note jam that cannot be cleared fails the transaction cleanly
        refs: [old-suite C1831512, old-suite C1831514, old-suite C1831516]
        objective: This test is to confirm the TVM fails a transaction cleanly (no ticket issued, no fare charged) when a coin or note jam occurring during payment or change cannot be cleared.
        steps: |-
          **GIVEN** a customer has commenced inserting coins or notes, or is receiving change, for a product purchase
          **WHEN** a coin or note becomes jammed and the TVM cannot clear the jam
          **THEN** the transaction fails without issuing a ticket
          **AND** any inserted tender is returned or accounted for per the current cash-handling config
        expected: |-
          An unrecoverable coin/note jam fails the transaction cleanly, with no ticket issued. Data variations: coin jam during payment, note jam during payment, coin jam during change.

          [Automatable: Partial — Cross-check: CloudFare / MERIT]

  - path: [Non-Functional, EMS & TMS Maintenance]
    cases:
      - title: Security — unauthorised door access or repeated failed EMS logins raises a burglary event
        refs: [old-suite C1831725, old-suite C1831215, old-suite C1831216, old-suite C1831218]
        objective: This test is to confirm the TVM raises the correct burglary event for unauthorised physical access — the hopper door opened without authorisation, and the TVM door opened either after repeated failed EMS logins or without any EMS login attempt.
        steps: |-
          **GIVEN** the TVM is in service and not integrated with CloudFare
          **WHEN** the hopper door is opened without authorisation
          **THEN** the TVM raises the correct burglary event
        expected: |-
          Unauthorised physical access raises a burglary event. Data variations: hopper door opened without authorisation; 3 failed EMS login attempts (burglary state entered); TVM door opened after 3 failed EMS logins; TVM door opened without any EMS login attempt.

          [Automatable: Partial — Cross-check: CloudFare]
      - title: EMS — Battery Saver Mode is maintained during a mains power failure
        refs: [old-suite C2691863]
        objective: This test is to confirm the TVM maintains EMS access while running on internal batteries during a mains power failure.
        steps: |-
          **GIVEN** the TVM is disconnected from mains power and running on internal batteries, showing the Home screen
          **WHEN** both door locks are rotated and the TVM door is opened
          **THEN** EMS is displayed and accessible on battery power
        expected: |-
          EMS remains accessible on battery power during a mains outage.

          [Automatable: Partial — Cross-check: CloudFare]
      - title: Cash vault — swapping coin and note vaults on power-up raises no panic event
        refs: [old-suite C2038477]
        objective: This test is to confirm no panic event is raised on Kiosk power-up after the coin and note vaults have been swapped during a power cut.
        steps: |-
          **GIVEN** a Kiosk TVM has powered down out of service after a mains outage and its coin and note vaults have been swapped
          **WHEN** the TVM powers back up
          **THEN** the TVM returns to service normally
          **AND** no panic event is raised
        expected: |-
          A coin/note vault swap during a power cut does not trigger a false panic event on power-up.

          [Automatable: Partial — Cross-check: CloudFare]
      - title: EMS — exit returns to Sales with or without a General Reboot
        refs: [old-suite C4041250, old-suite C4041251, old-suite C4041252, old-suite C4041253]
        objective: This test is to confirm an Engineer can return the TVM from EMS to Sales mode both with and without a General Reboot.
        steps: |-
          **GIVEN** an Engineer is signed into EMS with no other activity taken place
          **WHEN** the Engineer selects "Back to sales without Reboot"
          **THEN** the TVM returns to Sales mode without rebooting
        expected: |-
          EMS exit returns the TVM to Sales mode. Data variations: without General Reboot, with General Reboot.

          [Automatable: Partial — Cross-check: CloudFare]

  - path: [Non-Functional, EMS & TMS Maintenance, Alarmboard & Enclosure / Kiosk only]
    cases:
      - title: Alarmboard — an Engineer requests the alarmboard firmware version
        refs: [old-suite C1857325]
        objective: This test is to confirm an Engineer can request and view the alarmboard software and hardware version details from the Kiosk EMS Maintenance menu.
        steps: |-
          **GIVEN** an Engineer signed into EMS Maintenance on a Kiosk TVM with alarmboard functions
          **WHEN** the Engineer selects the Request Version option
          **THEN** the alarmboard software and hardware version details are shown
        expected: |-
          The alarmboard version details are displayed on request.

          [Automatable: Partial]

  - path: [Functional, Commissioning & Deployment]
    cases:
      - title: Commissioning — the ticket-collection server address is configured via TMS
        refs: [old-suite C3544768]
        objective: This test is to confirm the TVM's ticket-collection (Corethree) server address is configured from the back office via TMS, per the General - Ticket Collection - Server Address setting.
        steps: |-
          **GIVEN** TMS has a ticket-collection server address configured for the TVM
          **WHEN** the configuration is deployed to the TVM
          **THEN** the TVM uses the configured server address for ticket-collection API calls
        expected: |-
          The ticket-collection server address is correctly sourced from TMS configuration.

          [Automatable: Partial — Cross-check: CloudFare/TMS]
      - title: Topology — a device rejects topology intended for another device type
        refs: [old-suite C1785735, old-suite C1831898]
        objective: This test is to confirm the TVM remains stable and unaffected when topology intended for another device type (HHD, PV, Glider or Rail-specific) is sent to it in error.
        steps: |-
          **GIVEN** topology relating to another device/service has been published and made available
          **WHEN** that topology is sent to the TVM
          **THEN** the TVM does not regress and remains stable and functional
        expected: |-
          Receiving out-of-scope topology does not destabilise the TVM.

          [Automatable: Partial — Cross-check: CloudFare]
