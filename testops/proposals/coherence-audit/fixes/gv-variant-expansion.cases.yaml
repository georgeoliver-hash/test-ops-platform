      # ---- Family 4: 3-Day Select date logic (C4104046 reused as Start date; 2 new) ----
      - match: Barcode — a 3-Day Select ticket is valid on its start, additional and end dates
        title: Barcode — a 3-Day Select ticket is valid on its start date
        refs: [FBD-100167]
        objective: This test is to confirm a 3-Day Select barcode validates on its start date.
        steps: |-
          **GIVEN** an NIR GV head is in service on a rail route
          **AND** a 3-Day Select barcode whose current date equals its Start date is presented
          **WHEN** the passenger presents the 3-Day Select barcode
          **THEN** a green tick result is displayed
          **AND** the gate opens
        expected: A 3-Day Select barcode is valid when the current date equals its Start date.
      - title: Barcode — a 3-Day Select ticket is valid on an additional date within its validity
        refs: [FBD-100167]
        objective: This test is to confirm a 3-Day Select barcode validates on an Additional-Dates offset date.
        steps: |-
          **GIVEN** an NIR GV head is in service on a rail route
          **AND** a 3-Day Select barcode whose current date equals one of its Additional Dates offset from its Start date is presented
          **WHEN** the passenger presents the 3-Day Select barcode
          **THEN** a green tick result is displayed
          **AND** the gate opens
        expected: A 3-Day Select barcode is valid when the current date equals an Additional-Dates offset date.
      - title: Barcode — a 3-Day Select ticket is valid on its end date
