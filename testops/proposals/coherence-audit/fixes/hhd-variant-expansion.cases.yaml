  - path: [Functional, Annulment & Reversal]
    cases:
      - title: "Annul — a 24+ Discount sale is annulled"
        refs: "FBD-100373,HHD-Product-Mapping"
        objective: "This test is to confirm the Operator can annul a 24+ Discount sale on the HHD."
        steps: |-
          **GIVEN** an Operator is signed on to an HHD
          **AND** a 24+ Discount sale was just completed by cash
          **WHEN** the Operator annuls that sale
          **THEN** the sale is annulled
          **AND** the annulment is recorded against the shift
        expected: |-
          A 24+ Discount sale is annulled and recorded against the shift.
          
          **GAP** — a 24+-specific requirement id was not located this pass (old suite C1706672/C2598723 test it distinctly, cash vs card); confirm the product still exists before running.

  - path: [Functional, Sales - Paper Tickets, Ticket Issue]
    cases:
      - title: "Ticket Issue — a selected product is issued and printed (warrant payment)"
        refs: "FBD-100336,FBD-100207,REQ-0113.3,HHD-Product-Mapping"
        objective: "This test is to confirm an Operator can select a product, take payment by warrant, and issue a printed paper ticket."
        steps: |-
