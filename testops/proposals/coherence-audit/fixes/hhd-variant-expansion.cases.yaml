  - path: [Functional, Revenue Inspection (cEMV/RID)]
    cases:
      - title: "Revenue Inspection — a valid Visa Credit card inspection succeeds and emits event 5008"
        refs: "FBD-100716"
        objective: "This test is to confirm a valid inspected Visa Credit card returns success, a success tone, and event 5008."
        steps: |-
          **GIVEN** the HHD is in Inspection Mode on a Glider Tap-On-Only route with a live connection
          **AND** a valid Visa Credit contactless EMV card not on the RID List is presented
          **WHEN** the customer taps the card on the M020
          **THEN** a success screen is displayed
          **AND** a success audio tone is played
          **AND** a cEMV Inspection Success event 5008 is recorded with the client shift id
        expected: "A valid Visa Credit inspection shows success with the success tone and records event 5008."
