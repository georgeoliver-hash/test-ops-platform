# HHD variant expansion — 2026-07-24
# Expands every 'Data variations:' line found in suite 30285 (43 cases) into one separate,
# individually-executable case per named card scheme / smartcard-entitlement type / payment
# method / ticket product / format, per George's 2026-07-24 rule (docs/gherkin-standard.md,
# docs/test-practices.md). Genuine operating-mode variation (NIR-Rail/Glider) is UNCHANGED —
# still a TestRail Configuration, not split into cases.
suite_id: 30285
defaults:
  template_id: 1
  custom_devtypes: [30]          # HHD
  custom_autoconfirmation: false
  custom_revstatus: 2
sections:
  - path: [Functional, Card Payment (M020)]
    cases:
      - title: "Chip and PIN — a Visa debit sale completes and prints a ticket"
        refs: "FBD-100320,FBD-100183,REQ-0163.0,REQ-0163.3,REQ-0163.4,REQ-1384.0,REQ-1488.0,REQ-1489.0,REQ-1491.0,REQ-1514.0,REQ-1514.1,REQ-1516.0,REQ-1630.0,REQ-1630.2,REQ-1722.0,REQ-1723.0"
        objective: "This test is to confirm a chip-and-PIN Visa debit card sale completes and issues a ticket on the HHD."
        steps: |-
          **GIVEN** an Operator is signed on to an HHD with a paired M020 and a live payment connection
          **AND** a paper ticket priced at an Adult single of £2.90 is in the basket (example fare, confirm against the NIR fares export)
          **WHEN** the passenger inserts a Visa debit card and enters a correct PIN
          **THEN** the payment is approved
          **AND** the paper ticket is printed
        expected: "The chip-and-PIN Visa debit sale is approved and the ticket prints."
      - title: "Chip and PIN — a Mastercard credit sale completes and prints a ticket"
        refs: "FBD-100320,FBD-100183,REQ-0163.0,REQ-0163.3,REQ-0163.4,REQ-1384.0,REQ-1488.0,REQ-1489.0,REQ-1491.0,REQ-1514.0,REQ-1514.1,REQ-1516.0,REQ-1630.0,REQ-1630.2,REQ-1722.0,REQ-1723.0"
        objective: "This test is to confirm a chip-and-PIN Mastercard credit card sale completes and issues a ticket on the HHD."
        steps: |-
          **GIVEN** an Operator is signed on to an HHD with a paired M020 and a live payment connection
          **AND** a paper ticket priced at an Adult single of £2.90 is in the basket (example fare, confirm against the NIR fares export)
          **WHEN** the passenger inserts a Mastercard credit card and enters a correct PIN
          **THEN** the payment is approved
          **AND** the paper ticket is printed
        expected: "The chip-and-PIN Mastercard credit sale is approved and the ticket prints."
      - title: "Chip and PIN — a Maestro sale completes and prints a ticket"
        refs: "FBD-100320,FBD-100183,REQ-0163.0,REQ-0163.3,REQ-0163.4,REQ-1384.0,REQ-1488.0,REQ-1489.0,REQ-1491.0,REQ-1514.0,REQ-1514.1,REQ-1516.0,REQ-1630.0,REQ-1630.2,REQ-1722.0,REQ-1723.0"
        objective: "This test is to confirm a chip-and-PIN Maestro card sale completes and issues a ticket on the HHD."
        steps: |-
          **GIVEN** an Operator is signed on to an HHD with a paired M020 and a live payment connection
