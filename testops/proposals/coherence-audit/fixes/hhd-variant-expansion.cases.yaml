  - path: [Functional, Sign On & Session]
    cases:
      - title: "Break-Mode Sign On — HHD resumes Validation Mode after an operator break"
        refs: "FBD-100651,FBD-100690,REQ-0305.0,REQ-0305.1"
        objective: "This test is to confirm that after an operator break (driver break or enforced driver break) the HHD resumes Validation Mode if that was the pre-break mode."
        steps: |-
          **GIVEN** an Operator is signed on to the HHD in Glider Validation Mode
          **WHEN** the operator returns from a driver break and signs back on
          **THEN** the HHD resumes Validation Mode
          **WHEN** the operator returns from an enforced driver break and signs back on
          **THEN** the HHD resumes Validation Mode
        expected: |-
          After both a driver break and an enforced driver break the HHD resumes Validation Mode when that was the pre-break mode.
          
          **UNCONFIRMED** — CR78 naming/mode-preservation nuance not fully confirmed this pass.
      - title: "Operator — take an operator break and resume in Inspection Mode"
        refs: "FBD-100651,FBD-100690,REQ-0305.0,REQ-0305.1"
        objective: "This test is to confirm the operator can start an operator break in Inspection Mode and, on resuming, the HHD returns to Inspection Mode."
        steps: |-
          **GIVEN** an Operator is signed on in Glider Inspection Mode
          **WHEN** the operator starts an operator break
          **THEN** the HHD enters the break state
          **WHEN** the operator resumes from the break
          **THEN** the HHD returns to Inspection Mode
        expected: "The operator can start a break from Inspection Mode and resume back into Inspection Mode."

