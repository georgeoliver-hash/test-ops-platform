      - title: "Contactless — a Mastercard contactless sale completes"
        refs: "FBD-100320,FBD-100183,REQ-0163.0,REQ-0163.3,REQ-0163.4,REQ-1384.0,REQ-1488.0,REQ-1489.0,REQ-1491.0,REQ-1514.0,REQ-1514.1,REQ-1516.0,REQ-1630.0,REQ-1630.2,REQ-1722.0,REQ-1723.0,REQ-1854.0,REQ-2519.0"
        objective: "This test is to confirm a contactless Mastercard card sale completes on the HHD."
        steps: |-
          **GIVEN** an Operator is signed on to an HHD with a paired M020 and a live payment connection
          **AND** a paper ticket priced at £2.90 is in the basket (example fare, confirm against the NIR fares export)
          **WHEN** the passenger taps a Mastercard contactless card on the M020
          **THEN** the payment is approved
          **AND** the paper ticket is printed
        expected: "The contactless Mastercard sale is approved and the ticket prints."
      - title: "Card Declined — an unsupported-scheme card is declined without a PIN prompt"
        refs: "FBD-100320,FBD-100183,REQ-0163.0,REQ-0163.3,REQ-0163.4,REQ-0890.0,REQ-1384.0,REQ-1488.0,REQ-1489.0,REQ-1491.0,REQ-1514.0,REQ-1514.1,REQ-1630.0,REQ-1630.2,REQ-1722.0"
        objective: "This test is to confirm a card of an unsupported scheme is declined at the payment screen before a PIN prompt."
        steps: |-
          **GIVEN** an Operator is signed on to an HHD with a paired M020 and a live payment connection
          **AND** a paper ticket priced at £2.90 is in the basket (example fare, confirm against the NIR fares export)
          **WHEN** the passenger presents an unsupported-scheme card (e.g. Diners)
          **THEN** a decline message is displayed before any PIN prompt
          **AND** no ticket is printed
        expected: "An unsupported-scheme card is declined at the payment screen before a PIN prompt and no ticket issues."

