      **THEN** the TVM transitions to a degraded amber status

      **AND** the affected payment method is no longer offered'
    expected: 'A coin selector failure moves the TVM to amber and withdraws the affected payment method.


      [Automatable: No]'
  - title: Degraded Service — banknote acceptor failure transitions to amber
    refs: []
    objective: This test is to confirm the TVM enters a degraded (amber) state and disables the affected
      payment method when the banknote acceptor fails.
    steps: '**GIVEN** a TVM in service accepting cash and card

