  - match: Screen Brightness — backlight change persists into the Sales App
    title: Screen Brightness — a backlight increase persists into the Sales App
    refs:
    - REQ-0511.0
    - REQ-0511.1 (TFTS Requirements Matrix, Signed-Off; Q34 resolved)
    objective: This test is to confirm an Engineer's backlight increase made in EMS is maintained when
      the Sales App reloads.
    steps: '**GIVEN** an Engineer signed into the EMS control panel

      **WHEN** the Engineer increases the screen backlight brightness and returns to the Sales App

      **THEN** the Sales App displays at the adjusted brightness'
    expected: 'A backlight increase made in EMS carries through to the Sales App.


      [Automatable: No · Cross-check: CloudFare]'
