# TVM variant expansion, follow-up batch 2026-07-24 — Non-Functional: EMS & TMS Maintenance
# (887793), Alarmboard & Enclosure / Kiosk only (887794), Coin Recycler Hopper / Kiosk only
# (887795), Resilience (887796). See tvm-variant-expansion-2.changelog.md for the rationale.
suite: '**NEW** TVM Test Suite'
suite_id: 30284
defaults:
  template_id: 1
  custom_devtypes:
  - 1
  custom_revstatus: 2
  custom_autoconfirmation: false
sections:
- path:
  - Non-Functional
  - EMS & TMS Maintenance
  cases:
  - match: Remote Control — remote reboot, de-activate and re-activate
    title: Remote Control — remote reboot
    refs:
    - FBD-100266
    objective: This test is to confirm an operator can remotely reboot a TVM from CloudFare.
    steps: '**GIVEN** a commissioned TVM in service

      **WHEN** an operator issues a remote reboot command from CloudFare

      **THEN** the TVM performs the commanded action

      **AND** the resulting state is reported back to CloudFare'
    expected: 'A remote reboot command drives the TVM to the expected state and reports back.


      [Automatable: No · Cross-check: CloudFare]'
  - title: Remote Control — remote de-activate
    refs:
    - FBD-100266
    objective: This test is to confirm an operator can remotely de-activate a TVM from CloudFare.
    steps: '**GIVEN** a commissioned TVM in service

      **WHEN** an operator issues a remote de-activate command from CloudFare

      **THEN** the TVM performs the commanded action

      **AND** the resulting state is reported back to CloudFare'
    expected: 'A remote de-activate command drives the TVM to the expected state and reports back.


      [Automatable: No · Cross-check: CloudFare]'
  - title: Remote Control — remote re-activate
    refs:
    - FBD-100266
    objective: This test is to confirm an operator can remotely re-activate a TVM from CloudFare.
    steps: '**GIVEN** a commissioned TVM in service

      **WHEN** an operator issues a remote re-activate command from CloudFare

      **THEN** the TVM performs the commanded action

      **AND** the resulting state is reported back to CloudFare'
    expected: 'A remote re-activate command drives the TVM to the expected state and reports back.


      [Automatable: No · Cross-check: CloudFare]'
