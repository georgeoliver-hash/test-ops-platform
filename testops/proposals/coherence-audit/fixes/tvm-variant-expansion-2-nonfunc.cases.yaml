  - Resilience
  cases:
  - match: Degraded Service — payment hardware failure transitions to amber
    title: Degraded Service — Ingenico card reader failure transitions to amber
    refs: []
    objective: This test is to confirm the TVM enters a degraded (amber) state and disables the affected
      payment method when the Ingenico card reader fails.
    steps: '**GIVEN** a TVM in service accepting cash and card

      **WHEN** the Ingenico card reader fails

      **THEN** the TVM transitions to a degraded amber status

      **AND** the affected payment method is no longer offered'
    expected: 'A Ingenico card reader failure moves the TVM to amber and withdraws the affected payment
      method.


      [Automatable: No]'
  - title: Degraded Service — coin selector failure transitions to amber
    refs: []
    objective: This test is to confirm the TVM enters a degraded (amber) state and disables the affected
      payment method when the coin selector fails.
    steps: '**GIVEN** a TVM in service accepting cash and card

