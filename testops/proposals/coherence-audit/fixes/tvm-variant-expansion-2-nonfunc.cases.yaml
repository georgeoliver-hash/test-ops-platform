  - match: Device Lockout — cash sale at the lockout limit goes Out of Service
    title: Device Lockout — a paper ticket cash sale at the lockout limit goes Out of Service
    refs:
    - REQ-2690.0 (TFTS Requirements Matrix, Signed-Off; Q34 resolved)
    objective: This test is to confirm the TVM goes Out of Service when a paper ticket cash transaction
      meets or exceeds the configured lockout sales limit.
    steps: '**GIVEN** a TVM whose cumulative cash sales are just below the configured lockout sales limit
      (example limit £250)

      **WHEN** a paper ticket cash sale takes the cumulative total to the lockout limit

      **THEN** the sale completes

      **AND** the TVM goes Out of Service'
    expected: 'A paper ticket cash sale that reaches the configured lockout limit completes, then the
      TVM locks out of service.


      [Automatable: Partial · Cross-check: CloudFare / MERIT / SmartTrack]'
  - title: Device Lockout — a discounted ticket cash sale at the lockout limit goes Out of Service
    refs:
    - REQ-2690.0 (TFTS Requirements Matrix, Signed-Off; Q34 resolved)
    objective: This test is to confirm the TVM goes Out of Service when a discounted ticket cash transaction
      meets or exceeds the configured lockout sales limit.
    steps: '**GIVEN** a TVM whose cumulative cash sales are just below the configured lockout sales limit
