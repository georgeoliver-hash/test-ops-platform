- path:
  - Non-Functional
  - EMS & TMS Maintenance
  - Coin Recycler Hopper / Kiosk only
  cases:
  - match: Coin Recycler Hopper — reloading updates recorded cash content
    title: Coin Recycler Hopper — reloading updates recorded cash content (set to full cassette)
    refs:
    - REQ-2720.6 (TFTS Requirements Matrix, Signed-Off; Q34 resolved)
    objective: This test is to confirm reloading a coin recycler hopper, set to full cassette, updates
      the TVM's recorded coin content.
    steps: '**GIVEN** a Kiosk TVM with an Engineer signed into EMS at the Load Hoppers screen

      **WHEN** the Engineer reloads a coin hopper and sets the hopper level to a full cassette (value
      taken from TMS)

      **THEN** the recorded coin content is updated to the set level'
    expected: 'Reloading a coin recycler hopper (set to full cassette) updates the TVM''s recorded coin
      content to the set level.


      [Automatable: Partial · Cross-check: CloudFare / MERIT]'
  - title: Coin Recycler Hopper — reloading updates recorded cash content (set to empty then manually
      corrected)
    refs:
    - REQ-2720.6 (TFTS Requirements Matrix, Signed-Off; Q34 resolved)
    objective: This test is to confirm reloading a coin recycler hopper, set to empty then manually corrected,
      updates the TVM's recorded coin content.
    steps: '**GIVEN** a Kiosk TVM with an Engineer signed into EMS at the Load Hoppers screen

      **WHEN** the Engineer reloads a coin hopper and sets the hopper level to empty and then manually
      corrects it

      **THEN** the recorded coin content is updated to the set level'
    expected: 'Reloading a coin recycler hopper (set to empty then manually corrected) updates the TVM''s
      recorded coin content to the set level.


      [Automatable: Partial · Cross-check: CloudFare / MERIT]'
- path:
