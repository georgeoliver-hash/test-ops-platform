    title: Ticket Issue — a selected product is issued and printed (cash)
    refs: &id001
    - FBD-100336
    - FBD-100207
    objective: This test is to confirm the customer can select a valid product, pay by cash, and receive
      a printed ticket.
    steps: '**GIVEN** a TVM at its home stage on the multi-modal home screen

      **AND** an example product of a Metro Adult Single from 10A (IN) Casement Park to City Hall at £2.30
      (fares export FBD-100336)

      **WHEN** the customer pays by cash

      **THEN** a ticket is printed for the selected product

      **AND** the paid fare on the ticket matches the fares export'
    expected: 'The chosen product is issued and a ticket printed at the fares-export price, paying by
      cash.


      [Automatable: Partial · Cross-check: CloudFare / MERIT]'
