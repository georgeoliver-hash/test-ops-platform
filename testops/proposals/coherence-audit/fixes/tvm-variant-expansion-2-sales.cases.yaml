      standard product (see the sibling single-use-barcode case).
    steps: '**GIVEN** a TVM issuing a Cross Border, Family & Friends or concession rail product whose
      ticket type has barcode printing enabled in CloudFare

      **AND** an example NI Rail Cross-Border Adult single from Newry to Dundalk

      **WHEN** the customer completes the purchase

      **THEN** a multi-use-type barcode is printed at the end of the ticket

      **AND** the TVM cannot itself validate that multi-use barcode presented back to it (the restriction
      is on read-back, not on printing)'
    expected: 'A Cross Border / Family & Friends / concession rail product prints a multi-use barcode
      for redemption elsewhere; the TVM does not read that barcode type back.


