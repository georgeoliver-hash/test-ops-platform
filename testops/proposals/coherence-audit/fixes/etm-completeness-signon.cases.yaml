# ETM consolidation-completeness audit (2026-07-23) — Sign On & Session family.
# Two genuinely distinct old-suite behaviours were folded away with no case and no explicit
# "Data variations" line anywhere in the new suite. Both grounded in old suite 4943 (read-only,
# not modified) — added here as new, additive cases. No existing case edited by this file.
suite_id: 30254
defaults:
  template_id: 1
  custom_autoconfirmation: false
  custom_devtypes: [25]
  custom_revstatus: 2

sections:
  - path: Functional / Sign On & Session / Driver
    cases:
      - title: Driver Sign On — abandoning is cancellable and resumes at the same screen
        objective: This test is to confirm that the Sign-Off/abandon prompt available during sign-on can itself be cancelled, resuming sign-on at the screen it was raised from, as well as confirmed to abandon.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** the seeded test Driver is mid sign-on to Metro route 10A (IN), stopped at the Duty Number screen
          **WHEN** you raise the Sign-Off/abandon prompt and cancel it
          **THEN** sign-on resumes at the Duty Number screen unchanged
          **WHEN** you advance to the Route Selection, Journey Number and Route Summary screens in turn, raising and cancelling the Sign-Off/abandon prompt at each
          **THEN** each cancel resumes sign-on at the exact screen it was raised from
          **WHEN** you raise the Sign-Off/abandon prompt again and confirm it
          **THEN** sign-on abandons per the existing abandon behaviour (no shift before route selection; End-of-Shift and a Driver Waybill after Duty entry)
        expected: The Sign-Off/abandon prompt can be cancelled at any screen during sign-on, resuming exactly where it was raised, as well as confirmed to abandon.
        refs: "old suite 4943 C1521889, C2543141"

      - title: Driver Sign On — Journey screen pages more than 5 journeys with the closest highlighted
        objective: This test is to confirm the Journey screen displays more than 5 journey options for a duty across pages, with the journey closest to the current time highlighted.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** the seeded test Driver has entered a valid duty number with more than 5 journeys available
          **WHEN** the Journey screen is displayed
          **THEN** the journey closest to the current time is highlighted
          **WHEN** you press arrow down
          **THEN** the next page of journeys is displayed
          **WHEN** you press arrow up
          **THEN** the previous page of journeys is displayed
        expected: The Journey screen pages through more than 5 journeys with the closest-to-current-time journey highlighted.
        refs: "old suite 4943 C1547359"
