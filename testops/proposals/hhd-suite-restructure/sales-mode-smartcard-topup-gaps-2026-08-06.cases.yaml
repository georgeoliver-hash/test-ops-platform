suite_id: 30285
defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [7]
  custom_autoconfirmation: false

sections:
  - path: [Functional, Top-Ups]
    cases:
      - title: "Smartcard Top-Up — unreadable card at Present Smart Card retries"
        refs: MODE-ALL
        objective: |
          This test is to confirm an unreadable smartcard at Present Smart Card shows a Critical
          Error and Retry returns to Present Smart Card.
        steps: |
          **GIVEN** the HHD is at the 4.1 Present Smart Card screen for a top-up
          **WHEN** an unreadable smartcard is presented
          **THEN** the Critical Error screen is displayed
          **AND** tapping Retry returns to the Present Smart Card screen
        expected: "An unreadable card shows Critical Error; Retry returns to Present Smart Card."

      - title: "Smartcard Top-Up — unreadable card at Present Smart Card cancels to Sales"
        refs: MODE-ALL
        objective: |
          This test is to confirm cancelling the Critical Error for an unreadable card at Present
          Smart Card returns to the Sales screen.
        steps: |
          **GIVEN** the HHD is showing the Critical Error screen for an unreadable card at Present
          Smart Card
          **WHEN** the operator taps Cancel
          **THEN** the HHD returns to the Sales screen
        expected: "Cancelling the unreadable-card error at Present Smart Card returns to Sales."

      - title: "Smartcard Top-Up — invalid card retry prompts Represent Smartcard"
        refs: MODE-ALL
        objective: |
          This test is to confirm retrying the Invalid Card critical error moves the operator to
          Represent Smartcard.
        steps: |
          **GIVEN** the HHD is showing the 4.1.2 Critical Error - Invalid Card screen for a
          readable card that is not valid for top-up
          **WHEN** the operator taps Retry
          **THEN** the 4.4 Represent Smartcard screen is displayed
        expected: "Retrying an Invalid Card error moves to Represent Smartcard."

      - title: "Smartcard Top-Up — invalid card cancel voids prior card payment"
        refs: MODE-ALL
        objective: |
          This test is to confirm cancelling the Invalid Card critical error after a card payment
          was already taken routes to Voiding Last Card Transaction.
        steps: |
          **GIVEN** the HHD is showing the 4.1.2 Critical Error - Invalid Card screen
          **AND** a payment card was already used for this top-up
          **WHEN** the operator taps Cancel
          **THEN** the 4.6 Voiding Last Card Transaction screen is displayed
        expected: "Cancelling Invalid Card after a card payment routes to Voiding Last Card Transaction."

      - title: "Smartcard Top-Up — invalid card cancel returns to Sales when no card payment taken"
        refs: MODE-ALL
        objective: |
          This test is to confirm cancelling the Invalid Card critical error with no prior card
          payment returns to the Sales screen.
        steps: |
          **GIVEN** the HHD is showing the 4.1.2 Critical Error - Invalid Card screen
          **AND** no payment card was used for this top-up
          **WHEN** the operator taps Cancel
          **THEN** the HHD returns to the Sales screen
        expected: "Cancelling Invalid Card with no card payment taken returns to Sales."

      - title: "Smartcard Top-Up — no eligible products returns to Present Smart Card"
        refs: MODE-ALL
        objective: |
          This test is to confirm a top-up card with no eligible products shows the No products
          available screen and the HHD back button returns to Present Smart Card.
        steps: |
          **GIVEN** a valid top-up smartcard with no eligible top-up products is presented
          **WHEN** the 4.2.1 Top Up - No products available screen is displayed
          **AND** the operator taps the HHD back button
          **THEN** the 4.1 Present Smart Card screen is displayed
        expected: "A no-product top-up card returns to Present Smart Card via the HHD back button."

      - title: "Smartcard Top-Up — unreadable card at Represent Smartcard retries"
        refs: MODE-ALL
        objective: |
          This test is to confirm an unreadable smartcard at Represent Smartcard shows a Critical
          Error and Retry returns to Represent Smartcard.
        steps: |
          **GIVEN** the HHD is at the 4.4 Represent Smartcard screen during a top-up
          **WHEN** the represented smartcard is unreadable
          **THEN** the Critical Error screen is displayed
          **AND** tapping Retry returns to the Represent Smartcard screen
        expected: "An unreadable card at Represent Smartcard shows Critical Error; Retry returns to Represent Smartcard."

      - title: "Smartcard Top-Up — Represent Smartcard critical error cancel voids prior card payment"
        refs: MODE-ALL
        objective: |
          This test is to confirm cancelling the unreadable-card critical error at Represent
          Smartcard after a card payment was already taken routes to Voiding Last Card Transaction.
        steps: |
          **GIVEN** the HHD is showing the Critical Error screen for an unreadable card at Represent
          Smartcard
          **AND** a payment card was already used for this top-up
          **WHEN** the operator taps Cancel
          **THEN** the 4.6 Voiding Last Card Transaction screen is displayed
        expected: "Cancelling the Represent Smartcard read error after a card payment routes to Voiding Last Card Transaction."
