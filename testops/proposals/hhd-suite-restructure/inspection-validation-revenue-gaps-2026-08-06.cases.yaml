suite_id: 30285
defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [7]
  custom_autoconfirmation: false

sections:
  - path: [Functional, Revenue Inspection (cEMV/RID)]
    cases:
      - title: "Revenue Inspection — Connecting screen times out back to Sales"
        refs: MODE-ALL
        objective: |
          This test is to confirm the Revenue Inspect - Connecting screen times out back to the
          Sales screen if the payment device does not connect in time.
        steps: |
          **GIVEN** the HHD is at the Revenue Inspect - Connecting screen
          **WHEN** 60 seconds elapse without the payment device connecting
          **THEN** the HHD returns to the Sales screen
        expected: "The Revenue Inspect - Connecting screen times out after 60s back to the Sales screen."

      - title: "Revenue Inspection — Success times out to the next card prompt"
        refs: MODE-ALL
        objective: |
          This test is to confirm the Revenue Inspect - Success screen times out to the Card Prompt
          screen so the inspector can perform the next sequential inspection.
        steps: |
          **GIVEN** the HHD is showing the Revenue Inspect - Success screen after a successful
          EMV card inspection
          **WHEN** 3 seconds elapse
          **THEN** the HHD returns to the Revenue Inspect - Card Prompt screen
        expected: "Revenue Inspect - Success times out after 3s to the Card Prompt screen, ready for the next inspection."

      - title: "Revenue Inspection — Denylist failure times out to the next card prompt"
        refs: MODE-ALL
        objective: |
          This test is to confirm the Revenue Inspect - Failure - Denylist screen times out to the
          Card Prompt screen so the inspector can perform the next sequential inspection.
        steps: |
          **GIVEN** the HHD is showing the Revenue Inspect - Failure - Denylist screen after a
          denylisted EMV card inspection
          **WHEN** 3 seconds elapse
          **THEN** the HHD returns to the Revenue Inspect - Card Prompt screen
        expected: "Revenue Inspect - Failure - Denylist times out after 3s to the Card Prompt screen, ready for the next inspection."

      - title: "Revenue Inspection — change boarding location via numerical search"
        refs: MODE-ALL
        objective: |
          This test is to confirm the inspector can change boarding location during Revenue
          Inspection via the numerical search screen without leaving Revenue Inspection mode.
        steps: |
          **GIVEN** the HHD is at the Revenue Inspect - Card Prompt screen
          **WHEN** the inspector selects the stage number, enters a search value on the Select
          Boarding - Numerical Search screen, and confirms it
          **AND** the inspector selects a new boarding location from the resulting Select Boarding
          - HHD Screen Size list
          **THEN** the HHD returns to the Revenue Inspect - Card Prompt screen at the newly selected
          boarding location
          **AND** barcode scanning and smartcard validation remain disabled
        expected: "Changing boarding location via numerical search returns to Card Prompt at the new location, with barcode/smartcard still disabled."

      - title: "Revenue Inspection — change boarding location via boarding list"
        refs: MODE-ALL
        objective: |
          This test is to confirm the inspector can change boarding location during Revenue
          Inspection directly from the boarding list screen without leaving Revenue Inspection mode.
        steps: |
          **GIVEN** the HHD is at the Revenue Inspect - Card Prompt screen
          **WHEN** the inspector opens the Select Boarding - HHD Screen Size list and selects a new
          boarding location
          **THEN** the HHD returns to the Revenue Inspect - Card Prompt screen at the newly selected
          boarding location
          **AND** barcode scanning and smartcard validation remain disabled
        expected: "Changing boarding location via the boarding list returns to Card Prompt at the new location, with barcode/smartcard still disabled."
