suite_id: 30285
defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [7]
  custom_autoconfirmation: false

sections:
  - path: [Functional, Supervisor]
    cases:
      - title: "Supervisor Menu — Start Duty reaches the Signed in On Duty screen"
        refs: MODE-ALL
        objective: |
          This test is to confirm starting a duty from the Supervisor Menu reaches the Supervisor Menu - Signed in On Duty (Glider) screen with its extra operator functions available.
        steps: |
          **GIVEN** the Supervisor Menu is displayed
          **WHEN** the supervisor selects Start Duty and completes the Duty Selection flow
          **THEN** the Supervisor Menu - Signed in On Duty - Glider screen is displayed
          **AND** Break Mode, Annul Previous Ticket, Issue Penalty Fare, Issue Penalty Warning, Mini Statement, and Totals options are available
        expected: "Starting a duty from the Supervisor Menu reaches the Signed in On Duty (Glider) screen showing the extra supervisor operator functions."

      - title: "Supervisor Menu — End Duty starts the Waybill Print flow"
        refs: MODE-ALL
        objective: |
          This test is to confirm ending a duty from the Supervisor Menu - Signed in On Duty screen starts the Waybill Print flow.
        steps: |
          **GIVEN** the Supervisor Menu - Signed in On Duty - Glider screen is displayed
          **WHEN** the supervisor selects End Duty
          **THEN** the Waybill Print flow starts
        expected: "Ending a duty from the Signed in On Duty screen starts the Waybill Print flow."

  - path: [Functional, Technician]
    cases:
      - title: "Technician Mode — Apply Printer Firmware starts the firmware update"
        refs: MODE-ALL
        objective: |
          This test is to confirm selecting Apply Printer Firmware from Technician Mode starts the printer firmware update.
        steps: |
          **GIVEN** Technician Mode is displayed
          **WHEN** the technician selects Apply Printer Firmware
          **THEN** the Printer Firmware - Applying screen is displayed
        expected: "Selecting Apply Printer Firmware from Technician Mode starts the printer firmware update."

      - title: "Technician Mode — Configure Penalty Fare Application opens the third-party app"
        refs: MODE-ALL
        objective: |
          This test is to confirm selecting Configure Penalty Fare Application from Technician Mode opens the third-party Penalty Fare application.
        steps: |
          **GIVEN** Technician Mode is displayed
          **WHEN** the technician selects Configure Penalty Fare Application
          **THEN** the third-party Penalty Fare application opens
        expected: "Selecting Configure Penalty Fare Application from Technician Mode opens the third-party Penalty Fare application."
