defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [7]
  custom_autoconfirmation: false

sections:
  - path: [Functional, Sales - Paper Tickets, Ticket Issue]
    cases:
      - title: "Favourites — using a favourite during an active time band shows Unavailable"
        refs: MODE-ALL
        objective: |
          This test is to confirm using a saved favourite while a time band is in effect for its
          product shows the Favourites Unavailable screen instead of adding it to the basket.
        steps: |
          **GIVEN** the HHD is showing Tabbed Navigation - Favourites - Full with a favourite saved
          **AND** a time band is in effect for that favourite's product
          **WHEN** the operator taps the favourite to use it
          **THEN** the Tabbed Navigation - Tickets - Favourites Unavailable screen is displayed
        expected: "Using a favourite while its product's time band is in effect shows Favourites Unavailable, not the basket."

      - title: "Favourites — using a favourite adds it to the basket"
        refs: MODE-ALL
        objective: |
          This test is to confirm using a saved favourite, when no time band is in effect and the
          maximum revenue limit has not been surpassed, adds the favourite to the basket.
        steps: |
          **GIVEN** the HHD is showing Tabbed Navigation - Favourites - Full with a favourite saved
          **AND** no time band is in effect for that favourite's product
          **AND** the maximum revenue limit has not been surpassed
          **WHEN** the operator taps the favourite to use it
          **THEN** the Tabbed Navigation - Tickets - Favourite Chosen screen is displayed
          **AND** the favourite is added to the basket
        expected: "Using a favourite with no time band and under the revenue limit adds it to the basket via Favourite Chosen."

      - title: "Favourites — using a favourite past the maximum revenue limit shows Max Revenue Exceeded"
        refs: MODE-ALL
        objective: |
          This test is to confirm using a saved favourite, when no time band is in effect but the
          maximum revenue limit has been surpassed, shows the Max Revenue Exceeded error screen.
        steps: |
          **GIVEN** the HHD is showing Tabbed Navigation - Favourites - Full with a favourite saved
          **AND** no time band is in effect for that favourite's product
          **AND** the maximum revenue limit has been surpassed
          **WHEN** the operator taps the favourite to use it
          **THEN** the Tabbed Navigation - Tickets - Max Revenue Exceeded error screen is displayed
          **AND** the favourite is not added to the basket
        expected: "Using a favourite past the maximum revenue limit shows Max Revenue Exceeded and does not add it to the basket."

      - title: "Favourites — no available Passenger Type for a chosen Ticket Type"
        refs: MODE-ALL
        objective: |
          This test is to confirm that, on the Glider Add Favourite flow, choosing a Ticket Type with
          no available Passenger Types shows the No Passenger Type Available screen and lets the
          operator go back and choose a different Ticket Type.
        steps: |
          **GIVEN** the HHD is on the Glider Add Favourite flow with Boarding and Alighting stages selected
          **WHEN** the operator chooses a Ticket Type that has no available Passenger Types
          **THEN** the Tabbed Navigation - Favourites - Add - No Passenger Type Available screen is displayed
          **AND** pressing 'Back' returns to Select Ticket Type so the operator can choose a different Ticket Type
        expected: "Choosing a Ticket Type with no available Passenger Types (Glider) shows No Passenger Type Available and allows returning to pick a different Ticket Type."
