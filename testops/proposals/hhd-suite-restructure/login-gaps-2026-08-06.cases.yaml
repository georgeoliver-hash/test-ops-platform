suite_id: 30285
defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [7]
  custom_autoconfirmation: false

sections:
  - path: [Functional, Sign On & Session]
    cases:
      - title: "Sign On — hotlisted or invalid supervisor card during unlock returns to Device Locked"
        refs: MODE-ALL
        objective: |
          This test is to confirm presenting a hotlisted or invalid supervisor smartcard during an
          unlock attempt shows Card Error and returns to the Device Locked screen.
        steps: |
          **GIVEN** the HHD is at the Device Locked screen
          **WHEN** the supervisor presents a hotlisted or invalid smartcard
          **THEN** the Card Error screen is shown, reading "Card Hotlisted" or "Invalid Card"
          **AND** after the timeout (2s Invalid / 5s Hotlisted) the HHD returns to the Device Locked screen
        expected: "A hotlisted or invalid supervisor card during unlock shows Card Error then returns to Device Locked."

      - title: "Sign On — hotlisted or invalid card at login start returns to Login Start"
        refs: MODE-ALL
        objective: |
          This test is to confirm presenting a hotlisted or invalid smartcard at the start of the
          Login flow shows Card Error and returns to the start of the Login flow.
        steps: |
          **GIVEN** the HHD is at the Login Start screen, signed off
          **WHEN** the operator presents a hotlisted or invalid smartcard
          **THEN** the Card Error screen is shown, reading "Card Hotlisted" or "Invalid Card"
          **AND** after the timeout (2s Invalid / 5s Hotlisted) the HHD returns to the start of the Login flow
        expected: "A hotlisted or invalid card at login start shows Card Error then returns to the Login Start screen."

      - title: "Sign On — Test Printer failure Retry returns to Test Printer"
        refs: MODE-ALL
        objective: |
          This test is to confirm that on a Test Printer failure during login, tapping Retry returns
          to the Test Printer screen.
        steps: |
          **GIVEN** the HHD login flow has reached the Test Printer screen and the print fails
          **WHEN** the operator taps 'Retry'
          **THEN** the Test Printer screen is shown again
        expected: "Tapping Retry after a failed test print returns to the Test Printer screen."

      - title: "Sign On — Test Printer failure Continue Without Printing proceeds to login flow"
        refs: MODE-ALL
        objective: |
          This test is to confirm that on a Test Printer failure during login, tapping Continue
          Without Printing proceeds to the Glider/Rail routing decision.
        steps: |
          **GIVEN** the HHD login flow has reached the Test Printer screen and the print fails
          **WHEN** the operator taps 'Continue Without Printing'
          **THEN** the login flow proceeds to the Glider-login decision
          **AND** a Glider login continues to Select Route, and a non-Glider (Rail) login continues to the Sales Screen - Rail Login
        expected: "Continue Without Printing after a failed test print proceeds to the Glider/Rail routing decision regardless of print outcome."

      - title: "Select Route — Menu icon opens Select Route - Menu"
        refs: MODE-ALL
        objective: |
          This test is to confirm tapping the Menu icon on the Select Route screen opens the Select
          Route - Menu screen.
        steps: |
          **GIVEN** the HHD is on the Select Route screen (Glider login)
          **WHEN** the operator taps the Menu icon
          **THEN** the Select Route - Menu screen is displayed
        expected: "Tapping the Menu icon on Select Route opens the Select Route - Menu screen."
