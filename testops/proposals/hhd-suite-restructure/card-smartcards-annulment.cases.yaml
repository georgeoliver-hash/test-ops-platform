# Translink HHD suite (30285) — consolidated NEW cases
# Three FUNCTIONAL areas authored to the strengthened Gherkin standard
# (docs/gherkin-standard.md — objective "This test is to confirm", GIVEN/AND/WHEN/AND/THEN/AND,
# one predicate per THEN/AND line, a concrete worked example in the GIVEN, refs = FBD id(s)).
#
# Scope of this file: Card Payment (Miura M020) + NIR reference-number station leaf, Smartcards & ABT,
# Annulment & Reversal. Grounded in the old-suite titles (5446 AA-HHD-Acceptance, 13958 HHD Master) and
# the specs in knowledge/translink/specs/ (FBD-100320 M020/TID/pairing/Terminal Group; FBD-100373 PRN
# format + HHD sells+reverses, NO refund; FBD-100236/100250/100271 card formats/transfer/passback;
# FBD-100261 smartcard issue is POS-only; FBD-100658 ABT tap audit structure/events).
#
# DECISIONS carried from structure.md / old-suite-audit.md:
#  * Modes NIR-Rail / Glider are TestRail Run Configurations — shared behaviour authored ONCE.
#    Only the proven NIR-only reference-number station set gets a named per-mode leaf here.
#  * HHD card reader = Miura M020, Bluetooth-paired, NMI Terminal Group "HHD Retailing" (FBD-100320).
#  * HHD PRN = "H" + last-8-of-IMEI + ticks + 2-digit operator code (FBD-100373).
#  * HHD does NOT refund — it does sales + reversals; the negative is asserted explicitly (FBD-100373).
#
# NOT pushed. Existing cases NOT edited. New-suite-only.
suite_id: 30285
defaults:
  template_id: 1
  custom_devtypes: [30]
  custom_autoconfirmation: false
  custom_revstatus: 2
sections:
  # =====================================================================================
  - path: [Functional, Card Payment (M020)]
    cases:
      - title: M020 Pairing — Bluetooth pairing completes and enables card payment
        refs: [FBD-100320]
        objective: This test is to confirm the HHD can take card payment only after its Miura M020 reader is Bluetooth-paired.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD whose Miura M020 reader is not yet paired
          **AND** the M020 is powered on and in Bluetooth pairing range
          **WHEN** the Operator completes the M020 Bluetooth pairing flow
          **THEN** the M020 is shown as paired to the HHD
          **AND** the card-payment option becomes available for a sale
        expected: The M020 pairs over Bluetooth and card payment becomes available on the HHD.
      - title: M020 Commissioning — TID and TK download from TMS by serial after pairing
        refs: [FBD-100320]
        objective: This test is to confirm the HHD receives its TID and TK from TMS configuration keyed on serial number, after M020 pairing, with no manual keying.
        steps: |-
          **GIVEN** an HHD is being commissioned with its M020 already Bluetooth-paired
          **AND** TMS holds the device's TID and TK against its serial number
          **WHEN** the HHD downloads its configuration from TMS
          **THEN** the allocated TID and TK are applied to the device
          **AND** no manual entry of the TID or TK is required
        expected: The HHD downloads its TID and TK from TMS by serial after pairing, with no manual keying.
      - title: Terminal Group — the M020 settles under the "HHD Retailing" group
        refs: [FBD-100320]
        objective: This test is to confirm HHD retail card payments settle under the NMI Terminal Group "HHD Retailing".
        steps: |-
          **GIVEN** an Operator is signed on to a commissioned HHD with a paired M020
          **AND** the device's TID is boarded to the NMI Terminal Group "HHD Retailing"
          **WHEN** the Operator completes a card sale on the M020
          **THEN** the transaction settles against the "HHD Retailing" Terminal Group
        expected: The HHD retail card payment settles under the "HHD Retailing" NMI Terminal Group.
      - title: Payment Device Swap — a replacement M020 keeps the existing TID and TK
        refs: [FBD-100320]
        objective: This test is to confirm replacing the M020 does not change the HHD's in-use TID and TK.
        steps: |-
          **GIVEN** an HHD with an allocated TID and TK whose M020 has failed
          **AND** a replacement M020 is available to pair
          **WHEN** the Operator pairs the replacement M020 to the HHD
          **THEN** the HHD retains its existing TID and TK
          **AND** a card sale on the replacement M020 settles against the same TID
        expected: Swapping the M020 leaves the HHD's TID and TK unchanged and sales settle against the same TID.
      - title: Chip and PIN — a Visa credit sale completes and prints a ticket
        refs: [FBD-100320, FBD-100373]
        objective: This test is to confirm a chip-and-PIN card sale completes and issues a ticket on the HHD.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD with a paired M020 and a live payment connection
          **AND** a paper ticket priced at an Adult single of £2.90 is in the basket (example fare, confirm against the NIR fares export)
          **WHEN** the passenger inserts a Visa credit card and enters a correct PIN
          **THEN** the payment is approved
          **AND** the paper ticket is printed
        expected: The chip-and-PIN Visa credit sale is approved and the ticket prints.
      - title: Chip and PIN — a Mastercard debit sale completes
        refs: [FBD-100320, FBD-100373]
        objective: This test is to confirm a chip-and-PIN Mastercard debit sale completes on the HHD.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD with a paired M020 and a live payment connection
          **AND** a paper ticket priced at £2.90 is in the basket (example fare, confirm against the NIR fares export)
          **WHEN** the passenger inserts a Mastercard debit card and enters a correct PIN
          **THEN** the payment is approved
          **AND** the paper ticket is printed
        expected: The chip-and-PIN Mastercard debit sale is approved and the ticket prints.
      - title: Contactless — a Visa contactless sale completes
        refs: [FBD-100320, FBD-100373]
        objective: This test is to confirm a contactless card sale completes on the HHD.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD with a paired M020 and a live payment connection
          **AND** a paper ticket priced at £2.90 is in the basket (example fare, confirm against the NIR fares export)
          **WHEN** the passenger taps a Visa contactless card on the M020
          **THEN** the payment is approved
          **AND** the paper ticket is printed
        expected: The contactless Visa sale is approved and the ticket prints.
      - title: Contactless — a mobile wallet sale completes
        refs: [FBD-100320, FBD-100373]
        objective: This test is to confirm a mobile-wallet contactless sale completes on the HHD.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD with a paired M020 and a live payment connection
          **AND** a paper ticket priced at £2.90 is in the basket (example fare, confirm against the NIR fares export)
          **WHEN** the passenger taps a phone wallet (Apple Pay or Google Pay) on the M020
          **THEN** the payment is approved
          **AND** the paper ticket is printed
        expected: The mobile-wallet contactless sale is approved and the ticket prints.
      - title: Card Declined — a declined card does not issue a ticket
        refs: [FBD-100320, FBD-100373]
        objective: This test is to confirm a card declined by the payment provider does not issue a ticket.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD with a paired M020 and a live payment connection
          **AND** a paper ticket priced at £2.90 is in the basket (example fare, confirm against the NIR fares export)
          **WHEN** the passenger presents a card that the provider declines
          **THEN** a decline message is displayed
          **AND** no ticket is printed
        expected: A declined card shows a decline message and no ticket is issued.
      - title: Card Declined — an expired card is rejected
        refs: [FBD-100320, FBD-100373]
        objective: This test is to confirm an expired card is rejected at card payment.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD with a paired M020 and a live payment connection
          **AND** an expired card is to be presented for a £2.90 sale (example fare, confirm against the NIR fares export)
          **WHEN** the passenger presents the expired card
          **THEN** a card-rejected message is displayed
          **AND** no ticket is printed
        expected: An expired card is rejected with a message and no ticket is issued.
      - title: Card Declined — a blocked card is rejected
        refs: [FBD-100320, FBD-100373]
        objective: This test is to confirm a blocked card is rejected at card payment.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD with a paired M020 and a live payment connection
          **AND** a blocked card is to be presented for a £2.90 sale (example fare, confirm against the NIR fares export)
          **WHEN** the passenger presents the blocked card
          **THEN** a card-rejected message is displayed
          **AND** no ticket is printed
        expected: A blocked card is rejected with a message and no ticket is issued.
      - title: EMV Timeout — no card presented within the timeout ends the sale
        refs: [FBD-100320, FBD-100373]
        objective: This test is to confirm the sale ends when no card is presented within the payment timeout.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD with a paired M020 and a card sale started for £2.90 (example fare, confirm against the NIR fares export)
          **WHEN** no card is presented before the payment timeout elapses
          **THEN** the payment is abandoned
          **AND** no ticket is printed
        expected: With no card presented before the timeout, the payment is abandoned and no ticket is issued.
      - title: Cancel EMV — the Operator cancels before the card is presented
        refs: [FBD-100320, FBD-100373]
        objective: This test is to confirm the Operator can cancel an EMV transaction before a card is presented.
        steps: |-
          **GIVEN** an Operator has started a card sale for £2.90 on an HHD with a paired M020 (example fare, confirm against the NIR fares export)
          **AND** no card has yet been presented
          **WHEN** the Operator cancels the EMV transaction
          **THEN** the sale is cancelled
          **AND** no payment is taken
        expected: The EMV transaction is cancelled before card presentation and no payment is taken.
      - title: Cancel EMV — the sale cannot be cancelled after the card is presented
        refs: [FBD-100320, FBD-100373]
        objective: This test is to confirm an EMV transaction cannot be cancelled once the card has been presented.
        steps: |-
          **GIVEN** an Operator has started a card sale for £2.90 on an HHD with a paired M020 (example fare, confirm against the NIR fares export)
          **AND** the passenger has already presented the card to the M020
          **WHEN** the Operator attempts to cancel the EMV transaction
          **THEN** the cancel action is refused
        expected: Once the card is presented the EMV transaction can no longer be cancelled.
      - title: EMV Unavailable — payment resumes after communications re-establish
        refs: [FBD-100320]
        objective: This test is to confirm card payment becomes available again after payment communications are re-established.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD whose M020 payment communications are down
          **WHEN** the Operator retries card payment after communications are re-established
          **THEN** the card-payment option becomes available again
        expected: After communications re-establish, the HHD can take card payment again.
      - title: PAN Masking — the printed ticket shows only a masked PAN
        refs: [FBD-100373, FBD-100658]
        objective: This test is to confirm the card PAN is masked wherever it is printed or recorded on the HHD.
        steps: |-
          **GIVEN** an Operator has completed a Visa card sale for £2.90 on an HHD (example fare, confirm against the NIR fares export)
          **WHEN** the Operator views the printed ticket and receipt
          **THEN** only a masked PAN is shown
          **AND** the full card number is not printed
        expected: Only a masked PAN appears on the printed output; the full card number is never shown.
      - title: PRN — a card sale prints a PRN in the H + IMEI + ticks + operator format
        refs: [FBD-100373]
        objective: This test is to confirm an HHD card sale prints a Payment Reference Number in the HHD format.
        steps: |-
          **GIVEN** an Operator with operator code YG has completed a card sale for £2.90 on an HHD (example fare, confirm against the NIR fares export)
          **WHEN** the Operator inspects the printed ticket
          **THEN** a PRN is printed in the format "H" + last 8 IMEI digits + transaction ticks + 2-digit operator code (e.g. H81069695637665422474655130YG)
        expected: The card sale prints a PRN in the HHD "H" + IMEI + ticks + operator-code format.
      - title: Payment Device On Charge — a card sale completes while the M020 is on charge
        refs: [FBD-100320, FBD-100373]
        objective: This test is to confirm a card sale completes while the paired M020 is on charge.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD whose paired M020 is on charge
          **AND** a paper ticket priced at £2.90 is in the basket (example fare, confirm against the NIR fares export)
          **WHEN** the passenger completes a card payment on the M020
          **THEN** the payment is approved
          **AND** the paper ticket is printed
        expected: A card sale completes normally while the M020 is on charge.
  # =====================================================================================
  - path: [Functional, Card Payment (M020), Reference-Number Stations]
    cases:
      - title: Reference-Number Station — a card sale is keyed to the station reference number (NIR only)
        refs: [FBD-100320, FBD-100373]
        objective: This test is to confirm a NIR card sale at a reference-number station is keyed to that station's reference number.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD in NIR-Rail mode at a reference-number station (e.g. Yorkgate)
          **AND** a paper ticket priced at £2.90 is in the basket (example fare, confirm against the NIR fares export)
          **WHEN** the Operator selects the station reference number and takes card payment
          **THEN** the sale is recorded against the selected station reference number
          **AND** the paper ticket is printed
        expected: The NIR card sale is recorded against the chosen reference-number station and the ticket prints.
      - title: Reference-Number Station — the sale settles while the payment device is on charge (NIR only)
        refs: [FBD-100320, FBD-100373]
        objective: This test is to confirm a NIR reference-number-station card sale completes while the M020 is on charge.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD in NIR-Rail mode at a reference-number station (e.g. Carrickfergus) with the M020 on charge
          **AND** a paper ticket priced at £2.90 is in the basket (example fare, confirm against the NIR fares export)
          **WHEN** the Operator selects the station reference number and takes card payment
          **THEN** the sale is recorded against the selected station reference number
          **AND** the paper ticket is printed
        expected: A NIR reference-number-station card sale completes and records the reference number with the M020 on charge.
  # =====================================================================================
  - path: [Functional, Smartcards & ABT]
    cases:
      - title: Validate — an Adult iLink is accepted for a boarding within its zone
        refs: [FBD-100250, FBD-100271]
        objective: This test is to confirm an Adult iLink smartcard validates for a boarding stage inside its purchased zone.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD
          **AND** an Adult iLink Zone 3 smartcard is presented for a boarding at a Zone 3 stage
          **WHEN** the Operator validates the smartcard
          **THEN** the smartcard is accepted
          **AND** a valid-journey result is displayed
        expected: An Adult iLink Zone 3 card validates successfully for a Zone 3 boarding.
      - title: Validate — an Adult iLink is rejected for a boarding outside its zone
        refs: [FBD-100250]
        objective: This test is to confirm an Adult iLink smartcard is rejected for a boarding stage outside its purchased zone.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD
          **AND** an Adult iLink Zone 1 smartcard is presented for a boarding at a Zone 3 stage
          **WHEN** the Operator validates the smartcard
          **THEN** the smartcard is rejected
          **AND** a not-valid-at-this-location result is displayed
        expected: An Adult iLink Zone 1 card is rejected for a Zone 3 boarding outside its zone.
      - title: Validate — a Senior Smartpass concession is accepted
        refs: [FBD-100250]
        objective: This test is to confirm a Senior Smartpass concessionary smartcard validates on the HHD.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD
          **AND** a valid Senior Smartpass smartcard is presented
          **WHEN** the Operator validates the smartcard
          **THEN** the smartcard is accepted
          **AND** a valid-journey result is displayed
        expected: A valid Senior Smartpass concession validates successfully on the HHD.
      - title: Validate — an expired Smartpass is rejected
        refs: [FBD-100250]
        objective: This test is to confirm an expired concessionary Smartpass is rejected at validation.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD
          **AND** a Senior Smartpass smartcard past its expiry date is presented
          **WHEN** the Operator validates the smartcard
          **THEN** the smartcard is rejected
          **AND** an expired-pass result is displayed
        expected: An expired Senior Smartpass is rejected with an expired-pass result.
      - title: Validate — a hotlisted Smartpass is rejected
        refs: [FBD-100250]
        objective: This test is to confirm a hotlisted smartcard is rejected at validation.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD with a current hotlist loaded
          **AND** a smartcard present on the hotlist is presented
          **WHEN** the Operator validates the smartcard
          **THEN** the smartcard is rejected
          **AND** a hotlisted-card result is displayed
        expected: A hotlisted smartcard is rejected with a hotlisted-card result.
      - title: Validate — an unreadable smartcard is rejected
        refs: [FBD-100250]
        objective: This test is to confirm an unreadable or faulty smartcard is rejected at validation.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD
          **AND** a faulty smartcard whose data cannot be read is presented
          **WHEN** the Operator attempts to validate the smartcard
          **THEN** the smartcard is rejected
          **AND** a card-read-failure result is displayed
        expected: A faulty, unreadable smartcard is rejected with a read-failure result.
      - title: Validate — a Staff Pass is accepted
        refs: [FBD-100250]
        objective: This test is to confirm a Translink Staff Pass smartcard validates on the HHD.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD
          **AND** a valid Translink Employee Staff Pass smartcard is presented
          **WHEN** the Operator validates the smartcard
          **THEN** the smartcard is accepted
          **AND** a valid-journey result is displayed
        expected: A valid Staff Pass validates successfully on the HHD.
      - title: Validate — a passback re-tap within the window is rejected
        refs: [FBD-100271]
        objective: This test is to confirm a re-validation of the same smartcard inside the passback window is treated as passback and rejected.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD
          **AND** an Adult iLink smartcard has just been validated on this device
          **WHEN** the same smartcard is presented again within the passback window
          **THEN** the re-validation is rejected as passback
          **AND** no second journey is deducted
        expected: A re-tap within the passback window is rejected as passback with no second journey deducted.
      - title: Validate — a successful validation posts an ABT audit record
        refs: [FBD-100658]
        objective: This test is to confirm a successful smartcard validation posts a conformant audit record to CloudFare.
        steps: |-
          **GIVEN** an Operator has validated a valid Adult iLink smartcard on an HHD
          **WHEN** the validation is sent to CloudFare
          **THEN** an audit record is posted for the validation
          **AND** the record is communicated on to Merit
        expected: A successful validation posts an audit record to CloudFare and is communicated to Merit.
      - title: Top-Up — a cash top-up adds value to an Adult iLink and prints a receipt
        refs: [FBD-100261]
        objective: This test is to confirm the Operator can top up an Adult iLink smartcard by cash on the HHD.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD
          **AND** a valid Adult iLink smartcard is presented for a £20.00 top-up (example amount, confirm against the product configuration)
          **WHEN** the Operator completes the top-up paid by cash
          **THEN** the added value is written to the smartcard
          **AND** a top-up receipt is printed
        expected: A cash top-up adds value to the Adult iLink and prints a receipt.
      - title: Top-Up — a card top-up adds value to a Child iLink
        refs: [FBD-100261]
        objective: This test is to confirm the Operator can top up a Child iLink smartcard by card on the HHD.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD with a paired M020 and a live payment connection
          **AND** a valid Child iLink smartcard is presented for a £10.00 top-up (example amount, confirm against the product configuration)
          **WHEN** the Operator completes the top-up paid by card
          **THEN** the added value is written to the smartcard
          **AND** a top-up receipt is printed
        expected: A card top-up adds value to the Child iLink and prints a receipt.
      - title: Top-Up — a top-up on an expired card is rejected
        refs: [FBD-100261]
        objective: This test is to confirm a top-up is rejected when the presented smartcard has expired.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD
          **AND** an expired Adult iLink smartcard is presented for a top-up
          **WHEN** the Operator attempts the top-up
          **THEN** the top-up is refused
          **AND** an expired-card message is displayed
        expected: A top-up on an expired smartcard is refused with an expired-card message.
      - title: Issue — issuing a new smartcard is not available on the HHD
        refs: [FBD-100261]
        objective: This test is to confirm the HHD does not issue new smartcard products, which are issued on the POS only.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD
          **WHEN** the Operator opens the smartcard functions
          **THEN** no option to issue a new smartcard product is offered
        expected: The HHD offers no smartcard-issue function; issuing a new smartcard is a POS-only operation.
      - title: ABT Tap — a Glider inspection tap audits as an inspection with product 5001
        refs: [FBD-100658]
        objective: This test is to confirm a Glider inspection tap on the HHD posts an ABT audit record flagged as an inspection.
        steps: |-
          **GIVEN** an HHD is in Glider mode Inspector Mode with a paired M020
          **AND** a valid EMV card is tapped for inspection
          **WHEN** the inspection tap is sent to CloudFare
          **THEN** the audit record has IsInspection set true
          **AND** the audit record carries product id 5001
          **AND** the audit record carries a TID of "0"
        expected: A Glider inspection tap audits with IsInspection true, product 5001 and TID "0".
      - title: ABT Tap — an HHD tap carries a CardDetails block with a masked PAN
        refs: [FBD-100658]
        objective: This test is to confirm an HHD ABT tap audit carries a CardDetails block rather than raw card data.
        steps: |-
          **GIVEN** an HHD in Inspector Mode has taken a valid EMV inspection tap
          **WHEN** the tap audit record is inspected
          **THEN** the record contains a CardDetails block
          **AND** the CardDetails MaskedPan is populated
          **AND** no raw CardData is present
        expected: An HHD tap audit carries a CardDetails block with a masked PAN and no raw card data.
      - title: ABT Tap — a card-expired inspection maps DeclinedReason to 1
        refs: [FBD-100658]
        objective: This test is to confirm an inspection tap of an expired card records the correct DeclinedReason in the audit.
        steps: |-
          **GIVEN** an HHD in Inspector Mode with a paired M020
          **AND** an expired EMV card is tapped for inspection
          **WHEN** the inspection tap is sent to CloudFare
          **THEN** the audit record has DeclinedReason set to 1 for Card Expired
        expected: An expired-card inspection tap records DeclinedReason 1 (Card Expired) in the audit.
  # =====================================================================================
  - path: [Functional, Annulment & Reversal]
    cases:
      - title: Annul — a cash paper-ticket sale is annulled before sign-off
        refs: [FBD-100373]
        objective: This test is to confirm the Operator can annul a cash paper-ticket sale on the HHD.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD
          **AND** a paper ticket was just sold for £2.90 by cash (example fare, confirm against the NIR fares export)
          **WHEN** the Operator annuls that sale
          **THEN** the sale is annulled
          **AND** the annulment is recorded against the shift
        expected: A cash paper-ticket sale is annulled and recorded against the shift.
      - title: Annul — a card paper-ticket sale is annulled
        refs: [FBD-100373]
        objective: This test is to confirm the Operator can annul a card paper-ticket sale on the HHD.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD with a paired M020
          **AND** a paper ticket was just sold for £2.90 by card (example fare, confirm against the NIR fares export)
          **WHEN** the Operator annuls that sale
          **THEN** the sale is annulled
          **AND** the annulment is recorded against the shift
        expected: A card paper-ticket sale is annulled and recorded against the shift.
      - title: Annul — an iLink top-up paid by cash is annulled
        refs: [FBD-100373]
        objective: This test is to confirm the Operator can annul a cash-paid iLink top-up on the HHD.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD
          **AND** an Adult iLink top-up of £20.00 was just completed by cash (example amount, confirm against the product configuration)
          **WHEN** the Operator annuls that top-up
          **THEN** the top-up is annulled
          **AND** the added value is not left on the smartcard
        expected: A cash iLink top-up is annulled and the added value is reversed off the card.
      - title: Annul — an iLink top-up paid by card is annulled
        refs: [FBD-100373]
        objective: This test is to confirm the Operator can annul a card-paid iLink top-up on the HHD.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD with a paired M020
          **AND** a Child iLink top-up of £10.00 was just completed by card (example amount, confirm against the product configuration)
          **WHEN** the Operator annuls that top-up
          **THEN** the top-up is annulled
          **AND** the card payment is reversed
        expected: A card iLink top-up is annulled and the card payment is reversed.
      - title: Annul — a yLink discount sale is annulled
        refs: [FBD-100373]
        objective: This test is to confirm the Operator can annul a yLink discount sale on the HHD.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD
          **AND** a yLink discount sale was just completed by cash
          **WHEN** the Operator annuls that sale
          **THEN** the sale is annulled
          **AND** the annulment is recorded against the shift
        expected: A yLink discount sale is annulled and recorded against the shift.
      - title: Annul — nothing to annul shows a message
        refs: [FBD-100373]
        objective: This test is to confirm the HHD reports when there is no transaction available to annul.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD with no annullable transaction in the shift
          **WHEN** the Operator selects Annul
          **THEN** a nothing-to-annul message is displayed
        expected: With no annullable transaction, the HHD shows a nothing-to-annul message.
      - title: Annul — outstanding sales are annulled at sign-off
        refs: [FBD-100373]
        objective: This test is to confirm the Operator can annul the last transaction as part of signing off.
        steps: |-
          **GIVEN** an Operator with a just-completed sale is signing off an HHD
          **WHEN** the Operator annuls the sale during the sign-off flow
          **THEN** the sale is annulled
          **AND** the sign-off completes
        expected: An outstanding sale is annulled during sign-off and the sign-off completes.
      - title: Reversal — a card sale is reversed on the M020 before settlement
        refs: [FBD-100373]
        objective: This test is to confirm an HHD card sale can be reversed through the M020 before settlement.
        steps: |-
          **GIVEN** an Operator has just completed a card sale of £2.90 on an HHD with a paired M020 (example fare, confirm against the NIR fares export)
          **AND** the transaction has not yet settled
          **WHEN** the Operator reverses the card payment
          **THEN** the card payment is reversed on the M020
          **AND** the associated ticket sale is voided
        expected: An unsettled HHD card sale is reversed on the M020 and the ticket sale is voided.
      - title: Annul Unique Reference — a card transaction is annulled by its PRN
        refs: [FBD-100373]
        objective: This test is to confirm the Operator can annul a card transaction by keying its unique PRN.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD with a paired M020
          **AND** a card sale printed a PRN in the H + IMEI + ticks + operator format (e.g. H81069695637665422474655130YG)
          **WHEN** the Operator annuls the transaction by its printed PRN
          **THEN** the referenced transaction is annulled
        expected: A card transaction is annulled by keying its unique PRN.
      - title: No Refund — the HHD offers no refund function
        refs: [FBD-100373]
        objective: This test is to confirm the HHD provides no refund function, as it performs sales and reversals only.
        steps: |-
          **GIVEN** an Operator is signed on to an HHD
          **WHEN** the Operator opens the Operator Menu
          **THEN** no Issue Refund option is offered
        expected: The HHD Operator Menu offers no refund option; the HHD does sales and reversals only (REQ-1630.0).
      - title: No Refund — a refund of an HHD sale is performed on the POS only
        refs: [FBD-100373]
        objective: This test is to confirm a refund of an HHD-originated sale is carried out on the POS, not the HHD, and only when cross-device refunds are enabled.
        steps: |-
          **GIVEN** a paper-ticket sale was originally made on an HHD
          **AND** cross-device refunds are enabled on the POS (CR115)
          **WHEN** an Operator issues a refund against that HHD sale's printed reference on a POS
          **THEN** the refund is performed on the POS
          **AND** the HHD itself performs no part of the refund
        expected: A refund of an HHD sale is performed on the POS under CR115; the HHD never refunds. (Deselect if CR115 is not shipped.)
