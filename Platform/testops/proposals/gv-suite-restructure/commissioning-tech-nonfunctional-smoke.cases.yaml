# Translink GV (Gate Validator) — Commissioning / Technician / Non-Functional / Smoke
# NEW consolidated coverage for suite 30286 (**NEW** GV Test Suite). Propose-first: DO NOT push.
#
# Scope of THIS file (see structure.md for the whole tree):
#   [Functional, Commissioning & Router]   FBD-100653/100654  (field procedure, low auto value)
#   [Functional, Technician Menu]           grounded in the old suite Technician Menu section
#   [Non-Functional, HMI Screens]           per-screen validation layer, terse, titles mirror UI screens
#   [Non-Functional, Resilience]            power / comms / SaaS / heartbeat / throughput
#   [Smoke]                                 thin critical path, both heads
#
# Decision applied: gate DIRECTION (Entry / Exit / Bi-di A->B / Bi-di B->A) is a TestRail Run
#   Configuration, not a section. Every case here is shared across directions unless noted.
#
# Grounding key (also flagged inline):
#   [grounded]     tied to an issued distilled spec
#   [pending]      FBD-100348 rows marked "to be validated on integration of Validator" — author as
#                  pending-integration, NOT validated acceptance
#   [needs-spec]   no issued GV spec — carried as flagged scaffolding, do not assert as validated
#
# SECRETS: router / SkyLane / Maintenance / GV admin passwords are secrets. Cases assert only that a
#   password IS SET (not blank) or that sign-on succeeds with the seeded technician card — never a value.
#
# Section counts: Commissioning & Router 11 | Technician Menu 12 | HMI Screens 15 | Resilience 11 | Smoke 5  = 54

suite_id: 30286
defaults:
  template_id: 1
  custom_devtypes: [15]          # GV — CONFIRM via `discover-fields --project 42 --sample-case <gv_case_id>` before pushing
  custom_autoconfirmation: false
  custom_revstatus: 2

sections:

  # ============================================================================
  # FUNCTIONAL / COMMISSIONING & ROUTER   [grounded FBD-100653/100654]
  # Field/commissioning procedure — mostly post-commission verification checks.
  # ============================================================================
  - path: [Functional, Commissioning & Router]
    cases:
      - title: Commissioning — both GV heads boot into service after live software load
        refs: [FBD-100654]
        objective: This test is to confirm both GV heads on a commissioned lane self-extract the live software and enter service.
        steps: |-
          **GIVEN** a lane commissioned per FBD-100654 with the primary app zip on the P microSD and the secondary app zip on the S microSD
          **AND** an example lane at York Street with the current live app pair loaded
          **WHEN** each head boots for the first time and the operator taps Allow on the three Android permission prompts
          **THEN** each head completes its first-boot self-extract
          **AND** the gate enters service on both heads
        expected: Both heads self-extract the live software, accept the permission prompts, and the gate reaches service.

      - title: Commissioning — Primary head is Entry/unpaid and Secondary head is Exit/paid (roles not swapped)
        refs: [FBD-100654]
        objective: This test is to confirm the commissioned lane has the Primary head on the entry/unpaid side and the Secondary head on the exit/paid side.
        steps: |-
          **GIVEN** a commissioned lane with the P image on one head and the S image on the other
          **AND** the entry/unpaid side is physically the approach side of an example York Street lane
          **WHEN** the technician verifies which image booted on each side
          **THEN** the Primary (P) head is on the entry/unpaid side
          **AND** the Secondary (S) head is on the exit/paid side
        expected: The Primary head serves the entry/unpaid side and the Secondary head the exit/paid side, confirming the images were not swapped.

      - title: Commissioning — SkyLane interface firmware is HF03
        refs: [FBD-100653, FBD-100654]
        objective: This test is to confirm the SkyLane interface board of a commissioned lane runs firmware HF03.
        steps: |-
          **GIVEN** a commissioned lane whose SkyLane interface board is reachable at 192.168.0.200
          **WHEN** the technician logs in to the SkyLane board and reads the firmware version
          **THEN** the firmware version is HF03
        expected: The SkyLane interface board reports HF03 firmware, which enables the front-most plinth sensors.

      - title: Commissioning — correct gate width variant (Standard vs Wide) is installed
        refs: [FBD-100654]
        objective: This test is to confirm the SkyLane firmware variant matches the physical gate aisle width.
        steps: |-
          **GIVEN** a commissioned lane that is physically a Standard 600 mm aisle
          **AND** the SkyLane firmware ships in distinct Standard and Wide (disabled-access) variants
          **WHEN** the technician reads the installed firmware variant
          **THEN** the installed variant is the Standard variant
        expected: The installed firmware variant matches the physical aisle width (Standard for a 600 mm aisle, Wide for a 900 mm aisle).

      - title: Commissioning — one-wire homeLocation and zoneNo match the install spreadsheet
        refs: [FBD-100654]
        objective: This test is to confirm each head's minimal one-wire parameters were programmed to the values in the per-location install spreadsheet.
        steps: |-
          **GIVEN** a commissioned head whose one-wire chip was programmed in Maintenance Mode
          **AND** the example install spreadsheet row gives homeLocation "RA" and zoneNo "128"
          **WHEN** the technician reads the stored one-wire parameters on the head
          **THEN** homeLocation reads "RA"
          **AND** zoneNo reads "128"
        expected: The head's one-wire homeLocation and zoneNo match the install-spreadsheet values for that lane.

      - title: Commissioning — Technician Location Settings match the install spreadsheet
        refs: [FBD-100654]
        objective: This test is to confirm the Location Settings on each head match the per-location install spreadsheet.
        steps: |-
          **GIVEN** a commissioned head signed in to the Technician Location Settings screen
          **AND** an example install-spreadsheet row for the York Street lane giving Home Location, Stop Location, Zone Number, Install Point ID and ID
          **WHEN** the technician reads the Home Location, Stop Location, Zone Number, Install Point ID and ID
          **THEN** each field matches the install-spreadsheet row for that lane
        expected: Home Location, Stop Location, Zone Number, Install Point ID and ID all match the install spreadsheet for the lane.

      - title: Router — each lane has a unique static WAN IP per the install spreadsheet
        refs: [FBD-100653]
        objective: This test is to confirm the lane router is configured with the static WAN IP allocated to that lane.
        steps: |-
          **GIVEN** a commissioned lane whose MicroTik router WAN is set to Mode Router, Address Acquisition Static
          **AND** an example install-spreadsheet row allocating a unique WAN IP, netmask and gateway to the York Street lane
          **WHEN** the technician reads the router WAN address configuration
          **THEN** the WAN IP matches the unique static address allocated to that lane
        expected: The lane router uses the unique static WAN IP, netmask and gateway from the install spreadsheet.

      - title: Router — SkyLane at .200 with eth0 gateway .0.1 and a port-80 NAT rule
        refs: [FBD-100653]
        objective: This test is to confirm the router addressing lets the gate interface board be reached over port 80 from the corporate network.
        steps: |-
          **GIVEN** a commissioned lane with the SkyLane board at 192.168.0.200 and its eth0 gateway set to 192.168.0.1
          **AND** a NAT rule redirecting the router WAN IP port 80 to the interface board port 80
          **WHEN** authorised staff browse to the router WAN IP on port 80 from the corporate network
          **THEN** the gate interface web service is reached
        expected: With SkyLane at .200, gateway .0.1 and the port-80 NAT rule present, the gate interface is reachable from the corporate LAN. (Transitional stop-gap — target is CloudFare/Station Manager control.)

      - title: Router — the router admin password is set (not blank)
        refs: [FBD-100653]
        objective: This test is to confirm the lane router does not retain its blank default admin password.
        steps: |-
          **GIVEN** a commissioned lane router managed over SSH
          **WHEN** the technician attempts to reach the router admin account with a blank password
          **THEN** the blank-password login is refused
          **AND** login succeeds only with the configured admin password
        expected: The router admin password is set and the blank default is rejected. (Security note — a single shared password is used across all lanes — raise with the team. Never record the value.)

      - title: Software Distribution — a software / configuration / barcode-data file downloads to the GV
        refs: [FBD-100654]
        objective: This test is to confirm the GV downloads a distributed software, configuration or barcode-data file from the back office.
        steps: |-
          **GIVEN** a GV in service with a new software, configuration or barcode-data file staged for it in the back office
          **WHEN** the GV performs its scheduled file download
          **THEN** the file is downloaded to the GV
          **AND** the new version is reported on the Software Versions or Configuration Versions screen
        expected: The distributed file downloads to the GV and the new version shows on the relevant versions screen. (needs-spec — GV distribution mechanics are not fully specced, cross-ref ETM analog.)

      - title: Software Distribution — a configuration file with a future activation date applies on that date
        refs: [FBD-100654]
        objective: This test is to confirm a configuration file carrying a future activation date is held and applied only on that date.
        steps: |-
          **GIVEN** a GV that has downloaded a configuration file with an example activation date of tomorrow
          **WHEN** the current date reaches the activation date
          **THEN** the configuration becomes active on the activation date
          **AND** the active configuration version updates on the Configuration Versions screen
        expected: The future-dated configuration is held until its activation date, then becomes active. (needs-spec — distribution mechanics.)

  # ============================================================================
  # FUNCTIONAL / TECHNICIAN MENU   [grounded — old-suite Technician Menu section]
  # ============================================================================
  - path: [Functional, Technician Menu]
    cases:
      - title: Technician Sign On — valid technician card reaches the Technician Menu
        refs: [FBD-100654]
        objective: This test is to confirm a technician can sign on to a GV with a valid technician card and PIN.
        steps: |-
          **GIVEN** a GV in service showing the idle Present Card or Barcode screen
          **AND** the seeded technician card and PIN are available
          **WHEN** the technician presents the seeded card and enters the seeded PIN
          **THEN** the Technician Menu is displayed
        expected: A valid technician card and PIN sign the technician on and open the Technician Menu.

      - title: Technician Sign On — an invalid PIN is rejected
        refs: [FBD-100654]
        objective: This test is to confirm a technician sign-on with an incorrect PIN is refused.
        steps: |-
          **GIVEN** a GV showing the technician PIN entry screen after a valid technician card
          **WHEN** the technician enters an incorrect PIN
          **THEN** the sign-on is refused
          **AND** the technician is not signed on
        expected: An incorrect PIN is refused and the technician is not signed on.

      - title: Technician Sign On — an abandoned sign-on returns to the idle screen
        refs: [FBD-100654]
        objective: This test is to confirm abandoning technician sign-on returns the GV to its idle screen.
        steps: |-
          **GIVEN** a GV showing the technician PIN entry screen after a valid technician card
          **WHEN** the technician cancels the sign-on without completing PIN entry
          **THEN** the GV returns to the idle Present Card or Barcode screen
        expected: Abandoning sign-on returns the GV to the idle screen with no session started.

      - title: Technician Menu — the session auto signs off after the inactivity timeout
        refs: [FBD-100654]
        objective: This test is to confirm the Technician Menu automatically signs the technician off after a period of inactivity.
        steps: |-
          **GIVEN** a technician signed on to the Technician Menu
          **AND** the configured inactivity timeout is in force
          **WHEN** the menu is left idle beyond the inactivity timeout
          **THEN** the technician is signed off automatically
          **AND** the GV returns to service on the idle screen
        expected: After the inactivity timeout the technician is auto signed off and the GV returns to service.

      - title: Technician Menu — a technician navigates the menu pages
        refs: [FBD-100654]
        objective: This test is to confirm a technician can navigate between the Technician Menu pages.
        steps: |-
          **GIVEN** a technician signed on to the Technician Menu
          **WHEN** the technician navigates through the menu pages
          **THEN** each selected page is displayed
        expected: The technician can move between the Technician Menu pages and each page displays.

      - title: Location Settings — a technician sets the GV location
        refs: [FBD-100654]
        objective: This test is to confirm a technician can set the GV location from the Location Settings screen.
        steps: |-
          **GIVEN** a technician on the Location Settings screen with comms to the back office
          **AND** an example install-spreadsheet row giving Home Location, Stop Location, Zone Number, Install Point ID and ID
          **WHEN** the technician enters and saves the location values
          **THEN** the saved Location Settings show the entered values
        expected: The technician sets and saves the GV location and the values persist on the Location Settings screen.

      - title: Location Settings — location cannot be changed while comms to the back office is lost
        refs: [FBD-100654]
        objective: This test is to confirm the Location Settings screen behaves correctly when the GV has no back-office comms.
        steps: |-
          **GIVEN** a technician on the Location Settings screen with no comms to the back office
          **WHEN** the technician attempts to change the location
          **THEN** a no-comms condition is indicated on the Location Settings screen
        expected: With no back-office comms the Location Settings screen indicates the no-comms condition rather than silently saving.

      - title: Software Versions — the Software Versions screen lists all software versions
        refs: [FBD-100654]
        objective: This test is to confirm the Software Versions screen shows the GV software version information.
        steps: |-
          **GIVEN** a technician signed on to the Technician Menu
          **WHEN** the technician opens the Software Versions screen
          **THEN** the software version information is displayed
        expected: The Software Versions screen lists the GV software versions.

      - title: Configuration Versions — the Configuration Versions screen lists all configuration versions
        refs: [FBD-100654]
        objective: This test is to confirm the Configuration Versions screen shows the GV configuration version information.
        steps: |-
          **GIVEN** a technician signed on to the Technician Menu
          **WHEN** the technician opens the Configuration Versions screen
          **THEN** the configuration version information is displayed
        expected: The Configuration Versions screen lists the GV configuration versions.

      - title: Display Brightness — a technician adjusts the screen brightness
        refs: [FBD-100654]
        objective: This test is to confirm a technician can adjust the GV screen brightness from the Technician Menu.
        steps: |-
          **GIVEN** a technician on the Display Brightness screen
          **WHEN** the technician changes the brightness setting
          **THEN** the screen brightness changes to the selected level
        expected: The technician changes the screen brightness and the display updates to the selected level.

      - title: Audio Volume — a technician adjusts the audio volume
        refs: [FBD-100654]
        objective: This test is to confirm a technician can adjust the GV audio volume from the Technician Menu.
        steps: |-
          **GIVEN** a technician on the Audio Volume screen
          **WHEN** the technician changes the audio volume setting
          **THEN** the validation tone plays at the selected volume
        expected: The technician changes the audio volume and the validation tone plays at the selected level.

      - title: Force Communications — a technician forces a comms session with the back office
        refs: [FBD-100654, FBD-100266]
        objective: This test is to confirm a technician can force a communications session with the back office from the Technician Menu.
        steps: |-
          **GIVEN** a technician on the Force Communications screen with a reachable back office
          **WHEN** the technician forces communications
          **THEN** the GV establishes a comms session with the back office
          **AND** the GV Last Communication time updates in CloudFare
        expected: Forcing comms opens a session with the back office and updates the GV Last Communication time in CloudFare.

  # ============================================================================
  # NON-FUNCTIONAL / HMI SCREENS   per-screen validation layer (terse, titles mirror UI screens)
  # Titles deliberately mirror the exact UI screen names (advisory titles per the audit).
  # Smartcard idle/result screen content is [needs-spec] Project-3 UI carried as scaffolding;
  # barcode screens are [grounded FBD-100167]. Screens carry the Overflow link + image filename
  # in TestRail (attachments cannot be added via API).
  # ============================================================================
  - path: [Non-Functional, HMI Screens]
    cases:
      - title: Idle Screen — Present Card or Barcode
        refs: [FBD-100348]
        objective: This test is to confirm an in-service GV displays the idle Present Card or Barcode screen.
        steps: |-
          **GIVEN** a GV in service with no card or barcode presented
          **WHEN** the operator views the idle screen
          **THEN** the screen matches the approved Present Card or Barcode design
        expected: The idle screen shows the approved Present Card or Barcode content. (needs-spec — Project-3 screen content.)

      - title: Idle Screen — Not In Service
        refs: [FBD-100348]
        objective: This test is to confirm a GV that is out of service displays the Not In Service screen.
        steps: |-
          **GIVEN** a GV that is out of service
          **WHEN** the operator views the screen
          **THEN** the screen matches the approved Not In Service design
        expected: An out-of-service GV shows the approved Not In Service screen. (needs-spec.)

      - title: Error Screen — Re-present Card
        refs: [FBD-100348]
        objective: This test is to confirm the GV shows the Re-present Card screen when a card read must be retried.
        steps: |-
          **GIVEN** a GV in service
          **WHEN** a card read cannot complete and must be retried
          **THEN** the screen matches the approved Re-present Card design
        expected: The GV shows the approved Re-present Card screen on a failed read. (needs-spec.)

      - title: Error Screen — Not Valid At This Location
        refs: [FBD-100348]
        objective: This test is to confirm the GV shows the Not Valid At This Location screen for a card invalid at the current location.
        steps: |-
          **GIVEN** a GV in service at an example location where the presented product is not valid
          **WHEN** the card is presented
          **THEN** the screen matches the approved Not Valid At This Location design
        expected: The GV shows the approved Not Valid At This Location screen. (needs-spec.)

      - title: Error Screen — Invalid Time Of Day
        refs: [FBD-100348]
        objective: This test is to confirm the GV shows the Invalid Time Of Day screen for a card presented outside its valid time.
        steps: |-
          **GIVEN** a GV in service and a card whose product is not valid at the current time of day
          **WHEN** the card is presented
          **THEN** the screen matches the approved Invalid Time Of Day design
        expected: The GV shows the approved Invalid Time Of Day screen. (needs-spec.)

      - title: Error Screen — Product Expired
        refs: [FBD-100348]
        objective: This test is to confirm the GV shows the Product Expired screen for an expired product.
        steps: |-
          **GIVEN** a GV in service and a card whose product has expired
          **WHEN** the card is presented
          **THEN** the screen matches the approved Product Expired design
        expected: The GV shows the approved Product Expired screen. (needs-spec.)

      - title: Error Screen — Faulty Card
        refs: [FBD-100348]
        objective: This test is to confirm the GV shows the Faulty Card screen for an unreadable/faulty card.
        steps: |-
          **GIVEN** a GV in service and an example faulty (unreadable) card
          **WHEN** the card is presented
          **THEN** the screen matches the approved Faulty Card design
        expected: The GV shows the approved Faulty Card screen. (needs-spec.)

      - title: Error Screen — Not Accepted
        refs: [FBD-100348]
        objective: This test is to confirm the GV shows the Not Accepted screen for a card that is not accepted.
        steps: |-
          **GIVEN** a GV in service and a card that is not accepted
          **WHEN** the card is presented
          **THEN** the screen matches the approved Not Accepted design
        expected: The GV shows the approved Not Accepted screen. (needs-spec.)

      - title: Passback Screen — Card Already Validated
        refs: [FBD-100167, FBD-100690]
        objective: This test is to confirm the GV shows the Card Already Validated screen when a card is re-presented within the passback window.
        steps: |-
          **GIVEN** a GV in service and a card already validated within the passback window
          **WHEN** the card is re-presented
          **THEN** the screen matches the approved Card Already Validated design
        expected: Re-presenting a card within the passback window shows the approved Card Already Validated screen.

      - title: Success Screen — Successful
        refs: [FBD-100348]
        objective: This test is to confirm the GV shows the success screen on a successful validation.
        steps: |-
          **GIVEN** a GV in service and a valid card
          **WHEN** the card is validated successfully
          **THEN** the screen matches the approved success design
        expected: A successful validation shows the approved success screen. (needs-spec — Project-3 screen content.)

      - title: Barcode Error Screen — Barcode Already Validated
        refs: [FBD-100167]
        objective: This test is to confirm the GV shows the Barcode Already Validated screen when a used barcode is re-presented.
        steps: |-
          **GIVEN** a GV in service and a multi-use barcode already validated within its passback window
          **WHEN** the barcode is re-presented
          **THEN** the screen matches the approved Barcode Already Validated design
        expected: Re-presenting a used barcode shows the approved Barcode Already Validated screen.

      - title: Barcode Error Screen — Barcode Has Expired
        refs: [FBD-100167]
        objective: This test is to confirm the GV shows the Barcode Has Expired screen for an expired barcode.
        steps: |-
          **GIVEN** a GV in service and an expired multi-use barcode
          **WHEN** the barcode is presented
          **THEN** the screen matches the approved Barcode Has Expired design
        expected: The GV shows the approved Barcode Has Expired screen for an expired barcode.

      - title: Barcode Error Screen — Barcode Not Valid At This Location
        refs: [FBD-100167]
        objective: This test is to confirm the GV shows the Barcode Not Valid At This Location screen for an out-of-location barcode.
        steps: |-
          **GIVEN** a GV at an example location where the presented barcode product is not valid
          **WHEN** the barcode is presented
          **THEN** the screen matches the approved Barcode Not Valid At This Location design
        expected: The GV shows the approved Barcode Not Valid At This Location screen.

      - title: Barcode Error Screen — Barcode Type Invalid
        refs: [FBD-100167]
        objective: This test is to confirm the GV shows the Barcode Type Invalid screen for an unrecognised barcode type.
        steps: |-
          **GIVEN** a GV in service and an example barcode of an unrecognised type
          **WHEN** the barcode is presented
          **THEN** the screen matches the approved Barcode Type Invalid design
        expected: The GV shows the approved Barcode Type Invalid screen for an unrecognised barcode.

      - title: Barcode Success Screen — Barcode Use
        refs: [FBD-100167]
        objective: This test is to confirm the GV shows the barcode success screen on a successful barcode validation.
        steps: |-
          **GIVEN** a GV in service and a valid multi-use barcode
          **WHEN** the barcode is validated successfully
          **THEN** the screen matches the approved barcode success design
        expected: A successful barcode validation shows the approved Barcode Use success screen.

  # ============================================================================
  # NON-FUNCTIONAL / RESILIENCE   power / comms / SaaS / heartbeat / throughput
  # ============================================================================
  - path: [Non-Functional, Resilience]
    cases:
      - title: Power — the gate stays open when mains fails with a user inside the aisle
        refs: [FBD-100348]
        objective: This test is to confirm a mains power failure with a user inside the aisle leaves the gate open for safe egress.
        steps: |-
          **GIVEN** a lane in service with a user positioned inside the aisle
          **WHEN** mains power fails
          **THEN** the gate remains open
        expected: On mains failure with a user in the aisle the gate remains open. (pending integration — FBD-100348 FUN.)

      - title: Power — a power loss of two seconds or less does not force a reboot
        refs: [FBD-100348, TIBU-14160]
        objective: This test is to confirm the GV resumes without rebooting after a power loss of two seconds or less.
        steps: |-
          **GIVEN** a lane in service
          **WHEN** mains power is lost for two seconds or less and then restored
          **THEN** the gate resumes service without rebooting
        expected: A power loss of two seconds or less is ridden through and the gate resumes without a reboot. (Folds TIBU-14160.)

      - title: Emergency Release — the Emergency Release Button opens the gate
        refs: [FBD-100348, TIBU-16813, TIBU-18635]
        objective: This test is to confirm operating the Emergency Release Button opens the gate.
        steps: |-
          **GIVEN** a lane in service in a controlled mode
          **WHEN** the Emergency Release Button is operated
          **THEN** the gate opens in the evacuation direction
          **AND** the gate returns to its configured mode after the emergency clears without requiring a reboot
        expected: The Emergency Release Button opens the gate and it recovers to its configured mode without a reboot. (pending integration; folds TIBU-16813/18635.)

      - title: Heartbeat — loss of a validator heartbeat raises a major fault
        refs: [FBD-100348, FBD-100266]
        objective: This test is to confirm loss of the heartbeat from either validator for the configured period raises a major fault.
        steps: |-
          **GIVEN** a lane in service with the gate-to-validator heartbeat running at its configured rate of at least one per second
          **WHEN** the heartbeat from one validator is absent for the configured period
          **THEN** the gate declares a major fault
        expected: Losing a validator heartbeat for the configured period raises a major fault. (pending integration — FBD-100348 INT.)

      - title: Power-up — the gate is Out of Service until both validators communicate
        refs: [FBD-100348]
        objective: This test is to confirm the gate powers up Out of Service and enters service only once both validators communicate and BIST passes.
        steps: |-
          **GIVEN** a lane powered off
          **WHEN** the gate is powered up
          **THEN** the gate is Out of Service on power-up
          **AND** the gate enters service only once both validators communicate and BIST passes
        expected: The gate powers up Out of Service and enters service only when both validators are communicating and BIST has passed. (pending integration.)

      - title: Mains restore — the gate returns to its previous operational mode
        refs: [FBD-100348]
        objective: This test is to confirm the gate returns to its previous operational mode when mains power is restored, absent a major fault.
        steps: |-
          **GIVEN** a lane that was in an example Exit controlled mode when mains power failed
          **WHEN** mains power is restored and no major fault is present
          **THEN** the gate returns to the Exit controlled mode it held before the failure
        expected: On mains restore the gate returns to its previous operational mode when no major fault is present. (pending integration.)

      - title: BOS Comms — the GV keeps validating and queues audit data while the back office is unreachable
        refs: [FBD-100359, FBD-100263]
        objective: This test is to confirm a GV continues validating and queues its audit data when it cannot reach the back office.
        steps: |-
          **GIVEN** a GV in service that has lost comms to the back office
          **WHEN** a valid card or barcode is presented during the outage
          **THEN** the validation completes
          **AND** the resulting audit data is queued on the GV for later upload
        expected: During a back-office outage the GV keeps validating and queues its audit data locally. (Soft-failure principle, FBD-100359.)

      - title: BOS Comms — queued audit data uploads to CloudFare when comms is restored
        refs: [FBD-100359, FBD-100263]
        objective: This test is to confirm audit data queued during an outage uploads to CloudFare once comms is restored, with no data loss.
        steps: |-
          **GIVEN** a GV holding audit data queued during a back-office outage
          **WHEN** comms to the back office is restored
          **THEN** the queued audit data uploads to CloudFare
          **AND** the GV Last Communication time updates in CloudFare
        expected: On comms restore the queued audit data uploads to CloudFare with no loss and Last Communication updates. (Folds TIBU-16455/17104/18566.)

      - title: SaaS — a sustained Translink-network outage drives the GV to a communication-locked Out of Service state
        refs: [FBD-100359]
        objective: This test is to confirm a sustained Translink-network outage eventually places the Ethernet-connected GV in a communication-locked Out of Service state.
        steps: |-
          **GIVEN** a GV routed to AWS through the Translink network
          **WHEN** the Translink network is unavailable for a sustained period
          **THEN** the GV operates offline initially
          **AND** the GV enters a communication-locked Out of Service state after the significant offline period
        expected: A sustained network outage takes the Ethernet GV offline and then to a communication-locked Out of Service state. (FBD-100359 hard-failure.)

      - title: Heartbeat — the GV updates CloudFare Last Communication at least every 15 minutes
        refs: [FBD-100266]
        objective: This test is to confirm the GV updates its CloudFare Last Communication time at least every 15 minutes via the staff-list check, even with no validations.
        steps: |-
          **GIVEN** a GV in service with no validations occurring
          **WHEN** the fixed 15-minute staff-list refresh check runs
          **THEN** a StaffList message updates the GV Last Communication time in CloudFare
          **AND** Hours Since Last Communication resets to zero for the GV
        expected: The 15-minute staff-list check updates Last Communication and resets Hours Since Last Communication, even with no validations. (Folds TIBU-18310 spamming theme.)

      - title: Throughput — Primary and Secondary heads sustain back-to-back validations
        refs: [FBD-100348, TIBU-18597, TIBU-21005]
        objective: This test is to confirm each head sustains a quick succession of card and barcode validations without dropping or blocking taps.
        steps: |-
          **GIVEN** a lane in service with both heads accepting validations
          **AND** an example burst of valid cards and barcodes presented in quick succession to one head
          **WHEN** the burst is presented to the Primary head and then the Secondary head
          **THEN** each valid card and barcode in the burst is validated
        expected: Both heads sustain a quick succession of card and barcode validations without dropping or blocking valid taps. (needs-spec throughput; folds TIBU-18597/21005/16221 quick-succession theme.)

  # ============================================================================
  # SMOKE   thin critical path, both heads
  # ============================================================================
  - path: [Smoke]
    cases:
      - title: Smoke — both heads boot into service
        refs: [FBD-100654, FBD-100348]
        objective: This test is to confirm both GV heads on a lane boot into service.
        steps: |-
          **GIVEN** a commissioned lane powered off
          **WHEN** the lane is powered up and both validators communicate
          **THEN** both heads reach the idle Present Card or Barcode screen in service
        expected: Both heads boot into service and show the idle screen.

      - title: Smoke — a valid card opens the gate with a success screen and beep
        refs: [FBD-100690, FBD-100348]
        objective: This test is to confirm a valid card presented to an in-service head opens the gate with a success screen and beep.
        steps: |-
          **GIVEN** a lane in service and an example valid card
          **WHEN** the card is presented to the entry head
          **THEN** the success screen is shown
          **AND** a success beep is played
          **AND** the gate opens
        expected: A valid card gives a success screen, a beep, and an open gate.

      - title: Smoke — a valid multi-use barcode opens the gate with a success screen
        refs: [FBD-100167]
        objective: This test is to confirm a valid multi-use barcode presented to an in-service head opens the gate with a success screen.
        steps: |-
          **GIVEN** a lane in service and an example valid multi-use barcode
          **WHEN** the barcode is presented to the entry head
          **THEN** the barcode success screen is shown
          **AND** the gate opens
        expected: A valid multi-use barcode gives the barcode success screen and an open gate.

      - title: Smoke — an immediate re-present of the same card is rejected as passback
        refs: [FBD-100167, FBD-100690]
        objective: This test is to confirm re-presenting the same card within the passback window is rejected.
        steps: |-
          **GIVEN** a lane in service and a card just validated on the entry head
          **WHEN** the same card is re-presented within the passback window
          **THEN** the Card Already Validated screen is shown
          **AND** the gate does not open a second time
        expected: An immediate re-present of the same card is rejected as passback and the gate does not re-open.

      - title: Smoke — a technician can sign on to the Technician Menu
        refs: [FBD-100654]
        objective: This test is to confirm a technician can reach the Technician Menu on an in-service head.
        steps: |-
          **GIVEN** a head in service showing the idle screen
          **AND** the seeded technician card and PIN are available
          **WHEN** the technician presents the seeded card and enters the seeded PIN
          **THEN** the Technician Menu is displayed
        expected: A technician reaches the Technician Menu on an in-service head.
