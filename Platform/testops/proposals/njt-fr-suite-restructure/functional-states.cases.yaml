suite: NJT - SystemTestOps
suite_id: 30295

defaults:
  template_id: 1
  custom_autoconfirmation: false
  custom_devtypes: [1]   # 1 = ETM in this project's field config

sections:
  - path: ["Fare Register", "Functional States", "State Management", "Communications lock"]
    cases:
      - title: "Communications Lock - not entered directly from Screen Saver or Low Power"
        objective: "This test is to confirm the FR does not transition to the Comms Locked state directly from Screen Saver or Low Power - Comms Locked is only enterable from Idle."
        steps: |
          **GIVEN** the FR is in the Screen Saver functional state
          **AND** the FR has no communication with CloudFare
          **WHEN** the configured comms lock period elapses
          **THEN** the FR remains in the Screen Saver state
          **AND** the FR does not enter the Comms Locked state

          **GIVEN** the FR is in the Low Power functional state
          **AND** the FR has no communication with CloudFare
          **WHEN** the configured comms lock period elapses
          **THEN** the FR remains in the Low Power state
          **AND** the FR does not enter the Comms Locked state
        expected: "Comms Locked is only reachable from Idle; a device sitting in Screen Saver or Low Power while comms are down must not transition to Comms Locked directly. (Source: NJT_FRFRP_FS002 p.11, 3.1.2)"

      - title: "Communications Lock - timeout of 0 hours disables the lock"
        objective: "This test is to confirm a Comms Lock timeout configured to 0 hours disables the lock entirely."
        steps: |
          **GIVEN** the FR's comms lock timeout is configured to 0 hours
          **AND** the FR is in the Idle functional state
          **WHEN** the FR is unable to communicate with CloudFare for an extended period
          **THEN** the FR remains in the Idle state
          **AND** the FR does not enter the Comms Locked state
        expected: "0 hours is the documented value that disables the comms lock entirely - the FR must never lock regardless of comms outage duration. (Source: NJT_FRFRP_FS002 p.11, 3.1.2)"

      - title: "Communications Lock - mid-range configured timeout locks after the period elapses"
        objective: "This test is to confirm the FR enters Comms Locked once a mid-range configured comms lock timeout elapses."
        steps: |
          **GIVEN** the tester knows the currently configured comms lock timeout (a mid-range value between 0 and 99,999 hours)
          **AND** the FR is in the Idle functional state
          **WHEN** the FR is unable to communicate with CloudFare for the configured timeout period
          **THEN** the FR enters the Comms Locked state
        expected: "The comms lock timeout is configurable in hours, range 0 (disabled) to 99,999; a mid-range value must lock the device once elapsed. (Source: NJT_FRFRP_FS002 p.11, 3.1.2)"

      - title: "Communications Lock - maximum timeout of 99999 hours"
        objective: "This test is to confirm the FR accepts and honours the maximum configurable comms lock timeout of 99,999 hours."
        steps: |
          **GIVEN** the FR's comms lock timeout is configured to 99999 hours
          **AND** the FR is in the Idle functional state
          **WHEN** the FR is unable to communicate with CloudFare for less than 99999 hours
          **THEN** the FR remains in the Idle state
          **AND** the FR does not enter the Comms Locked state
        expected: "99,999 hours is the documented maximum configurable value; the device must not lock before that full period has elapsed. (Source: NJT_FRFRP_FS002 p.11, 3.1.2)"

  - path: ["Fare Register", "Functional States", "State Management", "Low power mode"]
    cases:
      - title: "Low Power Mode - not entered directly from Idle"
        objective: "This test is to confirm the FR does not transition directly from Idle to Low Power without first passing through Screen Saver."
        steps: |
          **GIVEN** the FR is in the Idle functional state
          **WHEN** the FR is inactive for the configured Screen Saver inactivity period
          **THEN** the FR enters the Screen Saver state
          **AND** the FR does not enter the Low Power state directly
        expected: "Low Power is only enterable from Screen Saver, never directly from Idle - the device must pass through Screen Saver first. (Source: NJT_FRFRP_FS002 p.11-12, 3.1.3)"

  - path: ["Fare Register", "Functional States", "State Management", "Initialisation"]
    cases:
      - title: "Initialisation - inactivity chain progresses Idle to Screen Saver to Low Power in order"
        objective: "This test is to confirm sustained inactivity moves the FR through the Idle -> Screen Saver -> Low Power chain in the correct order."
        steps: |
          **GIVEN** the FR is in the Idle functional state
          **AND** no user interaction occurs
          **WHEN** the configured Screen Saver inactivity period elapses
          **THEN** the FR enters the Screen Saver state

          **WHEN** inactivity continues for the configured Low Power inactivity period
          **THEN** the FR enters the Low Power state
        expected: "Sustained inactivity from Idle must produce Screen Saver then Low Power in that order (Screen Saver only from Idle; Low Power only from Screen Saver) - exact timeout values are a separate configured setting, not asserted here. (Source: NJT_FRFRP_FS002 p.11-12, 3.1.3-3.1.4)"

  - path: ["Fare Register HMI", "Signed Off (Section 6)", "Idle - Non Operational", "Screen Layout Verification - Idle Non-Operational (Section 6.4)"]
    cases:
      - title: "Idle - Non Operational - Memory Full error text"
        objective: "This test is to confirm the Idle - Non Operational screen displays the correct error text when the Fare Register has a Memory Full condition."
        steps: |
          **GIVEN** the Fare Register is in a "Non Operational" state due to "Memory Full"
          **WHEN** the operator views the Idle - Non Operational screen
          **THEN** the Driver Display shows the primary header message "Out of Service"
          **AND** the sub-text reads "Memory full, please upload memory to the server"
          **AND** the footer prompt reads "Please notify a Supervisor"
        expected: "The Memory Full error variant of the Idle - Non Operational screen must show its own defined header/sub-text/footer, distinct from the other three error variants. (Source: NJT_FRFRP_HMI01 p.19-20, Section 6.4)"

      - title: "Idle - Non Operational - Other fault error text"
        objective: "This test is to confirm the Idle - Non Operational screen displays the correct error text for a generic (Other) fault condition."
        steps: |
          **GIVEN** the Fare Register is in a "Non Operational" state due to an unclassified fault
          **WHEN** the operator views the Idle - Non Operational screen
          **THEN** the Driver Display shows the primary header message "Out of Service"
          **AND** the sub-text reads "This device has a fault"
          **AND** the footer prompt reads "Please notify a Supervisor"
        expected: "The Other-fault error variant of the Idle - Non Operational screen must show its own defined header/sub-text/footer, distinct from the other three error variants. (Source: NJT_FRFRP_HMI01 p.19-20, Section 6.4)"
