suite: NJT - SystemTestOps
suite_id: 30295

defaults:
  template_id: 1
  custom_autoconfirmation: false
  custom_devtypes: [1]

sections:
  - path: ["Fare Register", "OBV Functionality", "Barcode", "Receipts/Fare Media"]
    cases:
      - title: "Receipts/Fare Media - OBV Validation Prefix and Zone Source"
        objective: "This test is to confirm the receipt/fare media printed for an accepted barcode transaction is marked as OBV-validated and prints the zones supplied by the OBV, distinguishing it from a directly-issued (non-barcode) ticket."
        steps: |
          **GIVEN** a barcode ticket is scanned by the OBV and validated as acceptable for travel
          **WHEN** the driver presses Issue to accept the transaction
          **THEN** the Fare Register prints the receipt/fare media using the equivalent paper product's ticket template
            **AND** the printed product information carries a "*" prefix indicating OBV validation
            **AND** the zones printed are the boarding/alighting zones received in the Transaction ($F1) message from the OBV
        expected: "A barcode-validated receipt is marked with a '*' prefix and prints the OBV-supplied ($F1) zones, unlike a directly-issued ticket which prints the Fare Register's default zone. (Source: NJT_FRFRP_FS002 p.53, GR-12)"

  - path: ["Fare Register", "OBV Functionality", "Barcode", "Transaction Process", "Waiting for Driver"]
    cases:
      - title: "Waiting for Driver - Transaction Modified - Continued Trip - Multiple Passengers"
        objective: "This test is to confirm that in a multi-passenger barcode transaction requiring Continued Trip modification, the driver sets the product parameter and presses Issue individually for each passenger."
        steps: |
          **GIVEN** the user transacts a barcode with a continue trip required
            **AND** the transaction involves multiple passengers
          **WHEN** the driver presses the C button for the first passenger
          **THEN** the Fare Register sends a transaction acknowledgement to the OBV
            **AND** the Fare Register returns to the ticket issue screen
          **WHEN** the driver sets the continued trip product parameter and selects Issue for the first passenger
            **AND** repeats setting the continued trip product parameter and selecting Issue for each remaining passenger in turn
          **THEN** the Fare Register prints the required receipt or fare media for each passenger individually
            **AND** the Fare Register sends a separate transaction acknowledgement to the OBV for each passenger
        expected: "Each passenger in a multi-passenger, Continued-Trip-modified barcode transaction is issued and audited separately, not as a single batch. (Source: NJT_FRFRP_FS002 p.51-52, GR-3/FRT-1/GR-12)"

      - title: "Waiting for Driver - Transaction Modified - Transfer - Multiple Passengers"
        objective: "This test is to confirm that in a multi-passenger barcode transaction requiring Transfer modification, the driver sets the product parameter and presses Issue individually for each passenger."
        steps: |
          **GIVEN** the user transacts a barcode with a transfer required
            **AND** the transaction involves multiple passengers
          **WHEN** the driver presses the C button for the first passenger
          **THEN** the Fare Register sends a transaction acknowledgement to the OBV
            **AND** the Fare Register returns to the ticket issue screen
          **WHEN** the driver sets the transfer product parameter and selects Issue for the first passenger
            **AND** repeats setting the transfer product parameter and selecting Issue for each remaining passenger in turn
          **THEN** the Fare Register prints the required receipt or fare media for each passenger individually
            **AND** the Fare Register sends a separate transaction acknowledgement to the OBV for each passenger
        expected: "Each passenger in a multi-passenger, Transfer-modified barcode transaction is issued and audited separately, not as a single batch. (Source: NJT_FRFRP_FS002 p.51-52, GR-3/FRT-1/GR-12)"

      - title: "Waiting for Driver - Transaction Modified - Override - Multiple Passengers"
        objective: "This test is to confirm that in a multi-passenger barcode transaction requiring Override, the driver sets the product parameter and presses Issue individually for each passenger."
        steps: |
          **GIVEN** the user transacts a barcode with an override required
            **AND** the transaction involves multiple passengers
          **WHEN** the driver presses the C button for the first passenger
          **THEN** the Fare Register sends a transaction acknowledgement to the OBV
            **AND** the Fare Register returns to the ticket issue screen
          **WHEN** the driver sets the override product parameter and selects Issue for the first passenger
            **AND** repeats setting the override product parameter and selecting Issue for each remaining passenger in turn
          **THEN** the Fare Register prints the required receipt or fare media for each passenger individually
            **AND** the Fare Register sends a separate transaction acknowledgement to the OBV for each passenger
        expected: "Each passenger in a multi-passenger, Override-modified barcode transaction is issued and audited separately, not as a single batch. (Source: NJT_FRFRP_FS002 p.51-52, GR-3/FRT-1/GR-12)"

  - path: ["Fare Register", "OBV Functionality", "EMV Transactions", "Transaction Process", "Waiting for EMV Validation Information"]
    cases:
      - title: "Waiting for EMV Validation Information - Card Accepted - Student Disabled on Route"
        objective: "This test is to confirm the Student rider classification is not available for selection when Student is disabled on the current route."
        steps: |
          **GIVEN** the user transacts an EMV Waiting for EMV Validation Information transaction
            **AND** the OBV has accepted the card as valid
            **AND** Student rider classification is disabled on the current route
          **WHEN** the driver attempts to change the Rider Classification to Student
          **THEN** the Student option is not offered/selectable on the Rider Classification selection
            **AND** the Rider Classification remains unchanged
        expected: "Student is excluded from the Rider Classification selection when disabled on the current route, per the route-level rider-classification-availability rule. (Source: NJT_FRFRP_FS002 p.57-58)"
