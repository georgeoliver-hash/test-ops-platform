sections:
  - path: [ABT, Duplicate Detection]
    cases:
      - title: Annulling a tap reverses a Same Location duplicate marking where applicable
        objective: This test is to confirm that annulling a tap causes the system to retrospectively re-check Same Location logic at that stop, and reverse any duplicate marking on another tap where applicable.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card, with its account open in the Operator Portal Journey History to verify
          **AND** the card has two taps at the same boarding stage within the configured Same Location Time, the second marked a duplicate and not charged
          **WHEN** the driver annuls the first (original) tap at that stage
          **THEN** the system re-checks Same Location logic for that stop
          **AND** the second tap's duplicate marking is reversed where applicable
          **WHEN** you open the card's Journey History
          **THEN** the previously-duplicate tap is now shown as a genuine, chargeable journey
        expected: Annulling the original tap causes the same-location duplicate marking on the later tap to be reversed and re-evaluated as a genuine journey.
        refs: FBD-100651 7.3 para 324
