          **WHEN** in the Operator Portal you correct the tap's alighting to a higher-fare stop (e.g. Greys Farm → Armagh Bus Centre, ref.60, £4.50)
          **AND** you run the overnight EndOfDay settlement in CloudFare
          **AND** you open the card's Journey History in the Operator Portal
          **THEN** Journey History shows the amended alighting stop charged at the higher fare £4.50
          **AND** an auto-settlement in CloudFare collects the £2.60 additional balance
        expected: The corrected tap is charged the higher fare £4.50 and the £2.60 difference is auto-settled.
      - title: Single uncapped tap lowered refunds the difference
        refs: [CR122]
        objective: This test is to confirm that correcting a single uncapped tap to a lower fare refunds the difference.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card on the Translink test account (CloudFare env5)
          **AND** you are signed in to the Operator Portal, with the Passenger Portal open to verify
          **AND** the card has a single settled tap to which no cap applies: 72b (IN) Greys Farm → Armagh Bus Centre at 09:00, ref.60, £4.50
          **WHEN** in the Operator Portal you correct the tap's alighting to a lower-fare stop (e.g. Greys Farm → Grange Brigde, ref.10, £1.90)
          **AND** you run the overnight EndOfDay settlement in CloudFare
          **AND** you open the card's Journey History in the Operator Portal
          **THEN** Journey History shows the amended alighting stop charged at the lower fare £1.90
          **AND** an auto-refund in CloudFare returns the £2.60 difference
        expected: The corrected tap is charged the lower fare £1.90 and the £2.60 difference is refunded.
      - title: Aligning two different-ref taps to the same ref applies the cap and refunds
        refs: [CR122]
        objective: This test is to confirm that correcting two different-ref taps onto the same ref brings the reference cap into play and refunds.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card on the Translink test account (CloudFare env5)
          **AND** you are signed in to the Operator Portal, with the Passenger Portal open to verify
          **AND** zonal capping is disabled
          **AND** the card has two taps on different reference fares, so no cap applies at settlement: 72b (IN) Greys Farm → Armagh Bus Centre (ref.60, £4.50) and Greys Farm → Allens Corner (Dark Lane) (ref.55, £4.00), charged £8.50 in total
          **WHEN** in the Operator Portal you correct the ref.55 tap's alighting so both taps share ref.60 (e.g. → Armagh Bus Centre, £4.50)
          **AND** you run the overnight EndOfDay settlement in CloudFare
          **AND** you open the card's Journey History in the Operator Portal
          **THEN** Journey History shows the ref.60 cap now applied
          **AND** the total is the capped £7.20
          **AND** an auto-refund in CloudFare returns the £1.30 above the cap
        expected: The shared ref.60 cap applies; the total is capped at £7.20 and the £1.30 difference is refunded.
      - title: Lowering the higher-ref tap to match applies the lower cap and refunds
        refs: [CR122]
        objective: This test is to confirm that correcting the higher-ref tap down to match the other applies the lower reference cap and refunds.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card on the Translink test account (CloudFare env5)
          **AND** you are signed in to the Operator Portal, with the Passenger Portal open to verify
          **AND** zonal capping is disabled
          **AND** the card has two taps on different reference fares, so no cap applies at settlement: 72b (IN) Greys Farm → Allens Corner (Dark Lane) (ref.55, £4.00) and Greys Farm → Armagh Bus Centre (ref.60, £4.50), charged £8.50 in total
          **WHEN** in the Operator Portal you correct the higher-fare ref.60 tap down to match the other's ref.55 (e.g. → Allens Corner (Dark Lane), £4.00)
          **AND** you run the overnight EndOfDay settlement in CloudFare
          **AND** you open the card's Journey History in the Operator Portal
          **THEN** Journey History shows the lower ref.55 cap now applied
          **AND** the total is the ref.55 cap of £6.40
          **AND** an auto-refund in CloudFare returns the £2.10 difference
        expected: The lower ref.55 cap applies; the total is capped at £6.40 and the £2.10 difference is refunded.

  # ═════════════════════════ Town Service Cap ═════════════════════════
  - path: [ABT, Tap Correction, Town Service Cap]
    cases:
      - title: Correction within the town service zone holds the cap
        refs: [CR122]
        objective: This test is to confirm that an alighting correction within the town service zone leaves the town service cap unchanged.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card on the Translink test account (CloudFare env5)
          **AND** you are signed in to the Operator Portal, with the Passenger Portal open to verify
          **AND** the Bangor town service cap is £2.50 (Bus mode)
          **AND** the card has reached the cap on 203b (IN) Bangor TS taps: Groomsport Roundabout → Gransha Road Roundabout at 09:00 (£2.30) and Carolhill/ Dixon Rd → Kilcooley at 12:00 (£2.90), capped to £2.50, day total £2.50
          **WHEN** in the Operator Portal you correct one tap's alighting to another stop within the Bangor TS zone (e.g. Groomsport Roundabout → Kilcooley, £3.10)
          **AND** you run the overnight EndOfDay settlement in CloudFare
          **AND** you open the card's Journey History in the Operator Portal
          **THEN** Journey History shows the town service cap still applied
          **AND** the day total stays £2.50
          **AND** no auto-settlement is raised in CloudFare
          **AND** no refund is raised in CloudFare
        expected: The £2.50 Bangor town service cap holds; the total stays £2.50 with no settlement or refund.
      - title: Correction outside the town to a higher fare removes the cap and charges the difference
        refs: [CR122]
        objective: This test is to confirm that correcting a tap outside the town area to a higher fare removes the town service cap and charges the difference.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card on the Translink test account (CloudFare env5)
          **AND** you are signed in to the Operator Portal, with the Passenger Portal open to verify
          **AND** the Bangor town service cap is £2.50 (Bus mode), reached on 203b (IN) Bangor TS taps (Groomsport Roundabout → Gransha Road Roundabout £2.30 and Carolhill/ Dixon Rd → Kilcooley £2.90, capped to £2.50)
          **WHEN** in the Operator Portal you correct one tap's alighting to a higher-fare stop outside the Bangor TS zone (e.g. Groomsport Roundabout → City Hall, ref.70, £5.10)
          **AND** you run the overnight EndOfDay settlement in CloudFare
          **AND** you open the card's Journey History in the Operator Portal
          **THEN** Journey History shows the town service cap no longer applied, as both taps are no longer in-zone
          **AND** the corrected tap is charged the higher fare £5.10
          **AND** an auto-settlement in CloudFare collects the difference
          **AND** the day total rises above £2.50
        expected: The town service cap is removed; the higher fare £5.10 is charged and the difference is auto-settled above £2.50.
      - title: Correction outside the town to a lower fare removes the cap and refunds
        refs: [CR122]
        objective: This test is to confirm that correcting a tap outside the town area to a lower fare removes the town service cap and refunds the difference.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card on the Translink test account (CloudFare env5)
          **AND** you are signed in to the Operator Portal, with the Passenger Portal open to verify
          **AND** the Bangor town service cap is £2.50 (Bus mode), reached on 203b (IN) Bangor TS taps
          **AND** a stop just outside the Bangor TS zone exists at a single fare below £2.50 — confirm the exact stop in the portal, as the reference's listed 203b (IN) out-of-zone pairs are all £4.50 or higher
          **WHEN** in the Operator Portal you correct one tap's alighting to that lower-fare stop outside the town area
          **AND** you run the overnight EndOfDay settlement in CloudFare
          **AND** you open the card's Journey History in the Operator Portal
          **THEN** Journey History shows the town service cap no longer applied
          **AND** the corrected tap is charged the lower fare
          **AND** an auto-refund in CloudFare returns the difference
        expected: The town service cap is removed; the lower fare is charged and the difference is refunded.
