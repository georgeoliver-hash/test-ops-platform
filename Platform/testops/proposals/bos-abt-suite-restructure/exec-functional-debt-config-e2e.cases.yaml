# ABT — executable walk-through rewrite of Functional (NIR TOTO, Capping Timing,
# Shift Board, Access & Claims, Daily Capping, Correction Limits), Debt Recovery,
# Configuration & Setup and End to End — BOS & ABT Suite (30279).
#
# Same test intent as the existing cases; only sharpened to the "Executable — walk
# the tester through it" bar in docs/gherkin-standard.md: concrete GIVEN setup
# (card/account, portal signed in, config, cap values, prior state), each WHEN a
# real ordered action, each THEN an observation naming WHERE + value, grouped into
# 1–3 action-and-check steps. Updates in place (push --update); titles preserved
# verbatim except two vague Config titles tightened via `match:`.
#
# Grounded in: knowledge/ABT/ABT_FARE_REFERENCE.md; FBD-100690 (NIR TOTO),
# FBD-100307 (data flow — deny-list/re-auth timing, next-business-day capping),
# FBD-100389 (ABT scenarios — 04:00 operating-day boundary), FBD-100831 (Shift
# Board), FBD-100342 (User Claims), FBD-100383 (Operator Hierarchy).
suite_id: 30279
defaults:
  template_id: 1
  custom_devtypes: [200]
  custom_autoconfirmation: false
  custom_revstatus: 2
sections:

  # ═════════════════════════ Debt Recovery ═════════════════════════
  - path: [ABT, Debt Recovery]
    cases:
      - title: A recoverable debt is recovered and the card returns to Active
        refs: [TODEV-24990]
        objective: This test is to confirm that a recoverable debt is settled and the linked cards return to Active in the Operator Portal.
        steps: |-
          **GIVEN** the seeded ABT test card carries a recoverable debt (an EndOfDay authorisation that can be re-collected)
          **AND** that card is linked on the same account to a second card, and both are currently Blocked
          **AND** you are signed in to the ABT Operator Portal on the Customers page
          **WHEN** you open the account and note the status of both linked cards
          **THEN** both cards show status "Blocked" before recovery runs
          **WHEN** the scheduled debt recovery process runs and you refresh the account
          **THEN** both cards show status "Active" in the Operator Portal
          **AND** each card shows its expected number of authorisation requests
        expected: Debt recovery re-collects the outstanding amount; both linked cards move from Blocked to Active with the expected authorisation-request counts.
      - title: An unrecoverable debt leaves the cards Blocked
        refs: [TODEV-24990]
        objective: This test is to confirm that an unrecoverable debt leaves the linked cards Blocked in the Operator Portal.
        steps: |-
          **GIVEN** the seeded ABT test card carries an unrecoverable debt (an authorisation that cannot be re-collected)
          **AND** that card is linked on the same account to a second card, and both are currently Blocked
          **AND** you are signed in to the ABT Operator Portal on the Customers page
          **WHEN** the scheduled debt recovery process runs against the account
          **AND** you refresh the account in the Operator Portal
          **THEN** both cards still show status "Blocked"
          **AND** each card shows its expected number of authorisation requests
        expected: The unrecoverable debt is not re-collected; both linked cards stay Blocked with the expected authorisation-request counts.
      - title: Visa MIT recovery clears a recoverable issuer-liability debt
        refs: [TODEV-24990]
        objective: This test is to confirm that scheduled Visa MIT recovery clears a recoverable issuer-liability debt.
        steps: |-
          **GIVEN** the seeded Visa test account has an EndOfDay authorisation failure and a recoverable issuer-liability debt
          **AND** the account is currently blocked and its token is on the ABT Deny List
          **AND** you are signed in to the ABT Operator Portal on the Customers page
          **WHEN** the scheduled Visa MIT (merchant-initiated) recovery cycles run and re-collect the debt
          **AND** you refresh the account in the Operator Portal
          **THEN** the Visa account is no longer blocked in the Operator Portal
          **AND** the account's token no longer appears on the Deny List
        expected: Scheduled Visa MIT recovery re-collects the issuer-liability debt; the account is unblocked and removed from the Deny List.
      - title: A successful recovery removes the card from the Deny List
        refs: [TODEV-24990]
        objective: This test is to confirm that a successful debt recovery removes the card from the Deny List and returns it to Active.
        steps: |-
          **GIVEN** the seeded ABT test card is on the Deny List with a recoverable debt
          **AND** you are signed in to the ABT Operator Portal on the Customers page
          **WHEN** you locate the card and confirm it appears on the Deny List
          **THEN** the card is listed on the Deny List with a status other than Active
          **WHEN** the debt recovery process runs, recovers the debt, and you refresh the account
          **THEN** the card is no longer on the Deny List
          **AND** its status is "Active"
        expected: Successful recovery removes the card from the Deny List and sets its status to Active.
      - title: The recovered account is visible in the Operator Portal with the correct status
        refs: [TODEV-24990]
        objective: This test is to confirm that a recovered account is visible on the Customers page with the correct status.
        steps: |-
          **GIVEN** a debt recovery has completed for the seeded ABT test card (masked PAN)
          **AND** you are signed in to the ABT Operator Portal
          **WHEN** you open the Customers page and search for the card's masked PAN
          **THEN** the account record for that masked PAN is shown
          **AND** its status is "ACCEPTED"
        expected: 'The recovered account is found on the Customers page by masked PAN with status "ACCEPTED".'
      - title: Recovery behaviour is observable in the Operator Portal, logging verified by dev tests
        refs: [TODEV-24990]
        objective: This test is to confirm that manual QA covers the observable recovery behaviour while the open-payment-bs logging is verified by automated dev tests.
        steps: |-
          **GIVEN** manual QA has no access to the open-payment-bs service logs
          **AND** a debt recovery has completed for the seeded ABT test card
          **AND** you are signed in to the ABT Operator Portal on the Customers page
          **WHEN** you check the card's recovery outcome on the Customers page
          **THEN** the recovery is confirmed by the card's status change from Blocked to Active
          **AND** the corresponding open-payment-bs log entries are confirmed separately by the automated dev tests, not this manual pack
        expected: Recovery is confirmed by the card's Blocked-to-Active status change in the Operator Portal; the open-payment-bs log entries are covered by the automated dev tests, not this manual pack.
      - title: A card is added to the Deny List when it fails payment authorisation
        objective: This test is to confirm that a card that fails payment authorisation is automatically added to the Deny List.
        steps: |-
          **GIVEN** the seeded ABT test card is NOT on the Deny List
          **AND** you are signed in to the ABT Operator Portal on the Customers page
          **WHEN** the card fails payment authorisation at EndOfDay settlement
          **AND** you open the card on the Customers page and check the Deny List
          **THEN** the card is automatically added to the Deny List
          **AND** the card's status reflects the failed authorisation
        expected: A card that fails payment authorisation is automatically added to the Deny List, visible on the Customers page.
      - title: A card on the Deny List is prevented from future travel until resolved
        objective: This test is to confirm that a card on the Deny List is blocked from further travel until its outstanding issue is resolved.
        steps: |-
          **GIVEN** the seeded ABT test card is on the Deny List
          **AND** the target validator has pulled the latest Deny List delta file
          **AND** the card is otherwise valid (not expired, supported scheme)
          **WHEN** the customer taps the blocked card at the validator
          **THEN** the tap is declined at the validator
          **AND** travel is not permitted
          **AND** the tap is audited with Declined Reason 2 (On Deny List)
        expected: A Deny-Listed card is refused at the validator (travel not permitted) and audited with Declined Reason 2.
      - title: A card is removed from the Deny List when its debt is recovered
        objective: This test is to confirm that a card is removed from the Deny List and re-enabled for travel when its debt is recovered through any recovery channel.
        steps: |-
          **GIVEN** the seeded ABT test card is on the Deny List with an outstanding debt
          **AND** you are signed in to the ABT Operator Portal on the Customers page
          **WHEN** the debt is recovered via one of the four channels — back-office automatic retry, customer tap-initiated re-auth, customer online, or operator online recovery
          **AND** you refresh the card on the Customers page
          **THEN** the card is automatically removed from the Deny List
          **AND** the card is re-enabled for future travel
        expected: Debt recovery via any of the four channels removes the card from the Deny List and re-enables travel.

  # ═════════════════════════ End to End ═════════════════════════
  - path: [ABT, End to End]
    cases:
      - title: ETM Metro Tap-On-Only — end to end
        objective: This test is to confirm an end-to-end Metro Tap-On-Only journey from an ETM through to CloudFare, MERIT and the ABT portals.
        steps: |-
          **GIVEN** an ETM signed on to a Metro route and resting on the FLU (fare look-up) screen
          **AND** the seeded ABT test cEMV card, presented as Tap-On-Only
          **AND** you are signed in to CloudFare, MERIT and the ABT Operator and Passenger portals to verify
          **AND** example: board 10A (IN) Casement Park, Metro £4.00 cap / £2.30 single
          **WHEN** the customer taps the card on the ETM to make a Metro Tap-On-Only journey
          **THEN** the ETM shows an accepted tap
          **WHEN** the overnight EndOfDay settlement runs and you open the card's Journey History
          **THEN** the journey is charged per the Metro capping rules
          **AND** the day is capped at £4.00
          **AND** the same journey is visible in CloudFare, MERIT and the ABT Operator and Passenger portals
        expected: The Metro Tap-On-Only journey settles and caps correctly and is visible in CloudFare, MERIT and the ABT Operator and Passenger portals.
      - title: ETM Metro retail transaction — end to end
        objective: This test is to confirm an end-to-end Metro retail transaction from an ETM through to CloudFare, MERIT and the ABT portals.
        steps: |-
          **GIVEN** an ETM signed on to a Metro route and resting on the FLU screen
          **AND** the seeded ABT test cEMV card
          **AND** you are signed in to CloudFare, MERIT and the ABT portals to verify
          **WHEN** the operator sells a retail ticket on the ETM and takes payment on the card
          **THEN** the ETM records the sale
          **AND** it shows an accepted payment
          **WHEN** the overnight EndOfDay settlement runs and you open the transaction in the portals
          **THEN** the retail transaction is charged its correct amount
          **AND** it is visible in CloudFare, MERIT and the ABT portals
        expected: The Metro retail transaction settles at the correct amount and is visible across CloudFare, MERIT and the ABT portals.
      - title: HHD Glider Tap-On-Only — end to end
        objective: This test is to confirm an end-to-end Glider Tap-On-Only journey from an HHD through to CloudFare, MERIT and the ABT portals.
        steps: |-
          **GIVEN** an HHD signed on to Glider and resting on the Sales screen
          **AND** the seeded ABT test cEMV card, presented as Tap-On-Only
          **AND** you are signed in to CloudFare, MERIT and the ABT Operator and Passenger portals to verify
          **WHEN** the customer taps the card on the HHD to make a Glider Tap-On-Only journey
          **THEN** the HHD shows an accepted tap
          **WHEN** the overnight EndOfDay settlement runs and you open the card's Journey History
          **THEN** the journey is charged per the Glider rules
          **AND** it is capped per the Glider daily cap
          **AND** it is visible in CloudFare, MERIT and the ABT Operator and Passenger portals
        expected: The Glider Tap-On-Only journey settles and caps correctly and is visible across the back-office systems.
      - title: HHD Glider retail transaction — end to end
        objective: This test is to confirm an end-to-end Glider retail transaction from an HHD through to CloudFare, MERIT and the ABT portals.
        steps: |-
          **GIVEN** an HHD signed on to Glider and resting on the Sales screen
          **AND** the seeded ABT test cEMV card
          **AND** you are signed in to CloudFare, MERIT and the ABT portals to verify
          **WHEN** the operator sells a retail ticket on the HHD and takes payment on the card
          **THEN** the HHD records the sale
          **AND** it shows an accepted payment
          **WHEN** the overnight EndOfDay settlement runs and you open the transaction in the portals
          **THEN** the retail transaction is charged its correct amount
          **AND** it is visible in CloudFare, MERIT and the ABT portals
        expected: The Glider retail transaction settles at the correct amount and is visible across the back-office systems.
      - title: HHD Rail retail transaction — end to end
        objective: This test is to confirm an end-to-end Rail retail transaction from an HHD through to CloudFare, MERIT and the ABT portals.
        steps: |-
          **GIVEN** an HHD signed on to Rail and resting on the Sales screen
          **AND** the seeded ABT test cEMV card
          **AND** you are signed in to CloudFare, MERIT and the ABT portals to verify
          **WHEN** the operator sells a retail ticket on the HHD and takes payment on the card
          **THEN** the HHD records the sale
          **AND** it shows an accepted payment
          **WHEN** the overnight EndOfDay settlement runs and you open the transaction in the portals
          **THEN** the retail transaction is charged its correct amount
          **AND** it is visible in CloudFare, MERIT and the ABT portals
        expected: The Rail retail transaction settles at the correct amount and is visible across the back-office systems.

  # ═════════════════════════ Configuration & Setup ═════════════════════════
  - path: [ABT, Configuration & Setup]
    cases:
      - match: Support multiple travel zones for a stop
        title: A multi-zone stop is capped against each of its travel zones
        objective: This test is to confirm that a stop belonging to more than one travel zone is recognised in each and evaluated by capping against each zone.
        steps: |-
          **GIVEN** you are signed in to the ABT Operator Portal with rights to add daily capping rules (BusinessRules CreateEdit)
          **AND** a stop that belongs to more than one travel zone (e.g. a 403 (IN) stop carrying both a Magherafelt Town Service zone code and an iLink Zone 4 code)
          **WHEN** you configure that stop and save it within the capping rules
          **THEN** the stop is listed as a member of each of its travel zones
          **WHEN** a card makes qualifying taps at that stop and the EndOfDay settlement runs
          **THEN** the capping engine evaluates the stop against each of its zones' caps
        expected: The multi-zone stop is recognised in each of its travel zones and capping evaluates it against each.
      - match: Add new decline reasons
        title: Declined taps are recorded with their decline reason on the Declined Taps Report
        objective: This test is to confirm that each decline reason is recorded against its tap and shown on the Declined Taps Report.
        steps: |-
          **GIVEN** declined card taps have occurred for each reason — an expired card, an ODA/authenticity failure, a BIN-listed card and a Deny-listed card
          **AND** you are signed in to the ABT Operator Portal with the DeclinedCardTap report claim
          **WHEN** you open the Declined Taps Report for the test period
          **THEN** each declined tap is listed with its decline reason (Expired, Declined/ODA, On BIN List, On Deny List)
          **AND** the reason recorded matches the failure that caused each decline
        expected: Every declined tap is listed on the Declined Taps Report with the reason matching its failure (Expired, Declined/ODA, On BIN List, On Deny List).
      - title: Capping-rule products load from the fares engine
        objective: This test is to confirm that capping-rule base products are loaded from the fares engine products rather than the topology business service.
        steps: |-
          **GIVEN** you are signed in to the ABT Operator Portal configuring a base product on the Price Capping screen
          **WHEN** you open the base-product picker for a capping rule
          **THEN** the product list is populated from the fares engine products
          **AND** it is not sourced from the topology business service
        expected: The capping-rule base-product list is sourced from the fares engine products, not the topology business service.

  # ═════════════════════════ Functional / Daily Capping ═════════════════════════
  - path: [ABT, Functional, Daily Capping]
    cases:
      - title: Metro daily cap is reached and applied
        refs: [UB-TOO]
        objective: This test is to confirm that a day of Metro-zone taps reaches and holds the £4.00 Metro daily cap.
        steps: |-
          **GIVEN** the seeded ABT test card starts a fresh Tap-On-Only operating day (no prior taps since 04:00)
          **AND** the Metro daily cap is £4.00 and the Metro single fare is £2.30 (ref.20)
          **AND** you are signed in to both the ABT Operator and Passenger portals to verify the card's Journey History
          **AND** example taps: 10A (IN) Casement Park → City Hall at ~09:00, then 10A (IN) Slievegallion Drive → Falls Park at ~12:00, then a third Metro tap
          **WHEN** you make the two Metro-zone taps more than 15 minutes apart, then a third Metro tap later the same day
          **THEN** each tap is accepted at the device
          **AND** the tap is recorded against the card
          **WHEN** the overnight EndOfDay settlement runs and you open the card's Journey History
          **THEN** the first tap is charged the full £2.30
          **AND** the second tap is charged £1.70, completing the £4.00 Metro cap
          **AND** the third and any further Metro tap that day is charged £0.00
        expected: The Metro day caps at £4.00 — first tap £2.30, second £1.70, later taps £0.00.
      - title: Ulsterbus reference-fare cap is reached within a fare band
        refs: [UB-TOO]
        objective: This test is to confirm that same-reference Ulsterbus taps reach and hold the reference-fare daily cap for their band.
        steps: |-
          **GIVEN** the seeded ABT test card starts a fresh Tap-On-Only operating day with zonal capping disabled so the reference cap governs
          **AND** the ref.60 daily cap is £7.20 and the ref.60 single fare is £4.50
          **AND** you are signed in to both the ABT Operator and Passenger portals to verify the card's Journey History
          **AND** example taps: 72b (IN) Moygashel Busby Shop → Armagh Bus Centre (ref.60, £4.50) at ~09:00, again at ~12:00, then a third ref.60 tap
          **WHEN** you make the two same-ref taps more than 15 minutes apart, then a third ref.60 tap later that day
          **THEN** each tap is accepted at the device
          **AND** the tap is recorded against the card
          **WHEN** the overnight EndOfDay settlement runs and you open the card's Journey History
          **THEN** the first tap is charged the full £4.50 single fare
          **AND** the second tap is charged £2.70, completing the £7.20 reference cap
          **AND** the third and any further ref.60 tap that day is charged £0.00
        expected: The ref.60 band caps at £7.20 — first tap £4.50, second £2.70, later same-ref taps £0.00.
      - title: Metro cap and Ulsterbus reference cap both apply on the same day
        refs: [UB-TOO]
        objective: This test is to confirm that the Metro daily cap and an Ulsterbus reference-fare cap are calculated independently on the same card-day.
        steps: |-
          **GIVEN** the seeded ABT test card starts a fresh operating day
          **AND** the Metro cap is £4.00 (£2.30 single) and the ref.60 cap is £7.20 (£4.50 single)
          **AND** you are signed in to the ABT Operator and Passenger portals to verify the card's Journey History
          **AND** example taps: Metro 10A (IN) Casement Park → City Hall ×2, plus Ulsterbus 72b (IN) Moygashel Busby Shop → Armagh Bus Centre ×2 (ref.60)
          **WHEN** you make enough Metro-zone taps to reach £4.00 and enough ref.60 taps to reach £7.20 on the same day
          **THEN** each tap is accepted at the device
          **AND** the tap is recorded against the card
          **WHEN** the overnight EndOfDay settlement runs and you open the card's Journey History
          **THEN** the Metro-zone taps cap at £4.00
          **AND** the Ulsterbus ref.60 taps cap at £7.20
          **AND** the two caps are totalled independently of each other
        expected: Both caps apply independently on the same day — Metro £4.00 and ref.60 £7.20.
      - title: Metro and Ulsterbus caps evaluate independently when taps are interleaved
        refs: [UB-TOO]
        objective: This test is to confirm that interleaving Metro and Ulsterbus taps does not change either daily cap total.
        steps: |-
          **GIVEN** the seeded ABT test card starts a fresh operating day
          **AND** the Metro cap is £4.00 and the ref.60 cap is £7.20
          **AND** you are signed in to the ABT Operator and Passenger portals to verify the card's Journey History
          **AND** example order: 10A (IN) Casement Park → City Hall, 72b (IN) Moygashel Busby Shop → Armagh, 10A (IN) Slievegallion Drive → Falls Park, 72b (IN) Greys Farm → Armagh
          **WHEN** you make the Metro and ref.60 taps alternately, in that interleaved order
          **THEN** each tap is accepted at the device
          **AND** the tap is recorded against the card
          **WHEN** the overnight EndOfDay settlement runs and you open the card's Journey History
          **THEN** the Metro-zone taps still cap at £4.00
          **AND** the ref.60 taps still cap at £7.20
          **AND** the interleaved order changes neither cap total
        expected: Interleaving the taps changes neither cap; Metro still £4.00 and ref.60 still £7.20.
      - title: Two reference-fare bands cap independently on the same day
        refs: [UB-TOO]
        objective: This test is to confirm that two Ulsterbus reference bands each cap at their own value without borrowing the other's.
        steps: |-
          **GIVEN** the seeded ABT test card starts a fresh operating day with zonal capping disabled
          **AND** the ref.60 cap is £7.20 and the ref.61 cap is £8.20
          **AND** you are signed in to the ABT Operator and Passenger portals to verify the card's Journey History
          **AND** example taps: ref.60 = 72b (IN) Moygashel Busby Shop → Armagh Bus Centre ×2 (£4.50); ref.61 = 302d (OUT) Stand 7 → Newtownards (Transfer) ×2
          **WHEN** you make enough taps in each band to reach both caps
          **THEN** each tap is accepted at the device
          **AND** the tap is recorded against the card
          **WHEN** the overnight EndOfDay settlement runs and you open the card's Journey History
          **THEN** the ref.60 band caps at £7.20
          **AND** the ref.61 band caps at £8.20
          **AND** neither band borrows the other band's cap value
        expected: Each reference band caps at its own value independently — ref.60 £7.20 and ref.61 £8.20.
      - title: A single Metro tap does not trigger the Metro cap
        refs: [UB-TOO]
        objective: This test is to confirm that a lone Metro-zone tap is charged in full because the cap needs two in-zone taps.
        steps: |-
          **GIVEN** the seeded ABT test card makes only one Metro-zone tap on the operating day
          **AND** the Metro cap is £4.00 and requires two in-zone taps; the single fare is £2.30
          **AND** you are signed in to the ABT Operator and Passenger portals to verify the card's Journey History
          **AND** example: a single 10A (IN) Casement Park → City Hall tap
          **WHEN** the overnight EndOfDay settlement runs and you open the card's Journey History
          **THEN** the tap is charged the full £2.30 single fare
          **AND** no Metro daily cap is applied
        expected: A lone Metro tap is charged the full £2.30 with no cap applied.
      - title: Single taps in different reference bands are each charged in full
        refs: [UB-TOO]
        objective: This test is to confirm that one tap per reference band incurs no cap and each is charged its full single fare.
        steps: |-
          **GIVEN** the seeded ABT test card makes one tap in each of several reference bands, with zonal capping disabled
          **AND** you are signed in to the ABT Operator and Passenger portals to verify the card's Journey History
          **AND** example taps on 72b (IN) from Greys Farm: → Grange Brigde (ref.10, £1.90), → Currans Brae (ref.20, £2.30), → Allens Corner Dark Lane (ref.55, £4.00)
          **WHEN** the overnight EndOfDay settlement runs and you open the card's Journey History
          **THEN** each tap is charged its full single fare (£1.90, £2.30, £4.00)
          **AND** no reference-fare cap is applied to any band
        expected: With one tap per band, each is charged its full single fare and no reference cap applies.

  # ═════════════════════════ Functional / Correction Limits ═════════════════════════
  - path: [ABT, Functional, Correction Limits]
    cases:
      - title: First alighting-stop correction in the month is accepted
        refs: [CR122]
        objective: This test is to confirm that a passenger's first alighting-stop correction in a calendar month is accepted.
        steps: |-
          **GIVEN** a settled Tap-On-Only journey on the seeded card with no prior alighting-stop correction this calendar month (passenger limit 1/month, 3/year)
          **AND** you are signed in to the ABT Passenger Portal viewing the card's Journey History
          **AND** example: 72b (IN) Moygashel Busby Shop → Armagh Bus Centre (£4.50), to be corrected to alight earlier at Greys Farm (£1.90)
          **WHEN** you open the journey, correct the alighting stop to Greys Farm and confirm
          **THEN** the correction is accepted
          **WHEN** the next EndOfDay settlement runs and you re-open the journey
          **THEN** the journey fare is recalculated for the new alighting stop
        expected: The first correction of the month is accepted and the fare recalculates for the new stop.
      - title: A second correction in the same calendar month is refused
        refs: [CR122]
        objective: This test is to confirm that a second alighting-stop correction in the same calendar month is refused.
        steps: |-
          **GIVEN** the seeded card has already had one accepted alighting-stop correction this calendar month
          **AND** you are signed in to the ABT Passenger Portal viewing the card's Journey History
          **AND** example: a second correction attempted on a settled 72b (IN) Greys Farm → Armagh Bus Centre journey (£4.50) in the same month
          **WHEN** you attempt a second alighting-stop correction in the same calendar month and confirm
          **THEN** the correction is refused because the monthly limit of one is reached
          **AND** the journey keeps its previous alighting stop and fare
        expected: A second correction in the same month is refused; the journey keeps its stop and fare.
      - title: A correction in a new calendar month is accepted
        refs: [CR122]
        objective: This test is to confirm that the monthly correction allowance resets so a correction in a new month is accepted within the annual limit.
        steps: |-
          **GIVEN** the seeded card used its one correction in the previous calendar month and is still within the annual limit of three
          **AND** you are signed in to the ABT Passenger Portal viewing the card's Journey History
          **AND** example: a 72b (IN) Moygashel Busby Shop → Armagh Bus Centre journey corrected in the new month
          **WHEN** you make an alighting-stop correction in the new calendar month and confirm
          **THEN** the correction is accepted because the monthly allowance has reset
          **WHEN** the next EndOfDay settlement runs and you re-open the journey
          **THEN** the journey fare is recalculated for the new alighting stop
        expected: A correction in a new month is accepted as the monthly allowance resets, within the annual limit of three.
      - title: A fourth correction in the year is refused
        refs: [CR122]
        objective: This test is to confirm that the annual limit of three corrections is enforced even across different calendar months.
        steps: |-
          **GIVEN** the seeded card has already made three accepted corrections this year
          **AND** you are signed in to the ABT Passenger Portal viewing the card's Journey History
          **AND** example: a fourth correction attempted in a fresh calendar month on a settled 72b (IN) journey
          **WHEN** you attempt a fourth alighting-stop correction and confirm
          **THEN** the correction is refused even though it is a new month
          **AND** the annual limit of three corrections is enforced
        expected: The fourth correction of the year is refused even in a new month.
      - title: Boundary — the third yearly correction is accepted and an immediate fourth is refused
        refs: [CR122]
        objective: This test is to confirm the annual boundary, where the third correction of the year is accepted and a further attempt is refused.
        steps: |-
          **GIVEN** the seeded card has made two accepted corrections earlier in the year
          **AND** you are signed in to the ABT Passenger Portal viewing the card's Journey History
          **AND** example: a third correction on a settled 72b (IN) journey in a fresh month, then an immediate fourth attempt
          **WHEN** you make the third correction of the year and confirm
          **THEN** the third correction is accepted
          **WHEN** you immediately attempt a fourth correction and confirm
          **THEN** the fourth correction is refused at the annual limit of three
        expected: The third yearly correction is accepted; an immediate fourth is refused at the annual limit.

  # ═════════════════════════ Functional / NIR Tap-On-Tap-Off ═════════════════════════
  - path: [ABT, Functional, NIR Tap-On-Tap-Off]
    cases:
      - title: A matched tap-on and tap-off within PJT is charged the point-to-point fare
        refs: [FBD-100690, FBD-100698]
        objective: This test is to confirm that a rail tap-on followed by a tap-off within the Programmed Journey Time is charged the single point-to-point fare.
        steps: |-
          **GIVEN** the seeded cEMV card taps on at a NIR station and taps off at a later station within that pair's Programmed Journey Time (PJT)
          **AND** the ABT back office prices the matched rail journey via AreaFare (service "Rail", RouteType 0)
          **AND** you are signed in to the ABT Operator Portal to verify the card's Journey History
          **AND** example: tap-on Lanyon Place, tap-off Portadown on the Portadown line within the Lanyon Place→Portadown PJT (fare and PJT from CloudFare topology, exact values need confirming)
          **WHEN** the two taps are matched after the Maximum Journey Time (MJT) window expires and the overnight EndOfDay settlement runs
          **AND** you open the card's Journey History
          **THEN** the journey is charged the single Lanyon Place→Portadown point-to-point fare
          **AND** the journey is recorded with the real tap-off station and time
        expected: A matched tap-on/tap-off within PJT is charged the single point-to-point fare and recorded with the real tap-off.
      - title: A missing tap-off is charged the maximum fare
        refs: [FBD-100690, FBD-100307]
        objective: This test is to confirm that a rail tap-on with no tap-off within the Maximum Journey Time is charged the maximum fare.
        steps: |-
          **GIVEN** the seeded cEMV card taps on at a NIR station and never taps off within the Maximum Journey Time (MJT)
          **AND** you are signed in to the ABT Operator Portal to verify the card's Journey History
          **AND** example: a Lanyon Place tap-on on the Portadown line with no subsequent tap-off before the MJT expires
          **WHEN** the MJT window expires with no matching tap-off and the overnight EndOfDay settlement runs
          **AND** you open the card's Journey History
          **THEN** the journey is charged the maximum fare from CloudFare topology
          **AND** the charge type shows as "Travel (Max Fare)"
          **AND** the journey is flagged "Missing Tap" in Journey History
        expected: 'A tap-on with no tap-off within the MJT is charged the maximum fare, shown as "Travel (Max Fare)" and flagged Missing Tap.'
      - title: A maximum-fare journey is excluded from capping
        refs: [FBD-100690, FBD-100389]
        objective: This test is to confirm that a maximum-fare (missing-tap) rail journey does not count toward the daily cap.
        steps: |-
          **GIVEN** the seeded card has, on one operating day, one missing-tap-off rail journey plus further matched rail journeys
          **AND** you are signed in to the ABT Operator Portal to verify the card's Journey History
          **AND** example: one missing-tap-off max fare on the Portadown line plus two matched Lanyon Place→Portadown journeys the same day
          **WHEN** the day's journeys are settled at EndOfDay and you open the card's Journey History
          **THEN** the maximum-fare journey is excluded from the daily cap total
          **AND** the daily cap is calculated only from the matched, non-max-fare journeys
        expected: The max-fare journey is excluded from the cap; only matched journeys count toward the daily cap total.
      - title: A same-location re-tap within the Same Location Time is suppressed
        refs: [FBD-100690]
        objective: This test is to confirm that a duplicate tap at the same location within the Same Location Time is ignored so the journey is charged the correct point-to-point fare.
        steps: |-
          **GIVEN** the seeded card taps twice at the same boarding station within the configured Same Location Time, then taps off later within the MJT
          **AND** you are signed in to the ABT Operator Portal to verify the card's Journey History
          **AND** example (Scenario 1): a tap at Botanic, a second tap at Botanic within the Same Location Time, then a tap-off at Bangor within the MJT
          **WHEN** the taps are matched after the MJT expires and the overnight EndOfDay settlement runs
          **AND** you open the card's Journey History
          **THEN** the duplicate second Botanic tap is ignored (listed under "Show More", not charged)
          **AND** the journey is charged the single Botanic→Bangor point-to-point fare
        expected: The same-location re-tap is suppressed and the journey is charged the single Botanic to Bangor fare.
      - title: A free bus-to-rail transfer within the window leaves the bus leg uncharged
        refs: [FBD-100690]
        objective: This test is to confirm that a bus leg is not charged when it transfers to a consecutive rail journey within the transfer window at a free-transfer station.
        steps: |-
          **GIVEN** the seeded card makes a bus journey then a consecutive rail journey, where the bus alighting stop and the rail boarding station share a Bus-to-Rail free-transfer zone (CR133/CR064)
          **AND** the two boarding taps fall within the MJT (measured boarding-tap to boarding-tap)
          **AND** you are signed in to the ABT Operator Portal and MERIT to verify
          **AND** example: an Ulsterbus tap at Lisburn, then a consecutive rail tap-on at Lisburn station within the MJT
          **WHEN** the two journeys are matched as a transfer and the overnight EndOfDay settlement runs
          **AND** you open the card's Journey History and the MERIT records
          **THEN** the bus leg is charged zero fare
          **AND** the bus leg is recorded in MERIT with a Full Fare Equivalent
          **AND** the rail leg is charged its normal fare
        expected: The bus leg of a valid bus-to-rail transfer is free with a Full Fare Equivalent in MERIT, while the rail leg is charged normally.
      - title: A missing-tap correction recalculates the journey and refunds the difference
        refs: [FBD-100690]
        objective: This test is to confirm that correcting a missing rail tap recalculates the journey and refunds the max-fare difference.
        steps: |-
          **GIVEN** a settled rail journey on the seeded card charged the maximum fare for a missing tap-off, correctable within the MJT of the known tap-on
          **AND** you are signed in to the ABT Passenger Portal viewing the card's Journey History (passenger limit 1/month, 3/calendar year)
          **AND** example: a Lanyon Place tap-on charged max fare, corrected to a Portadown tap-off within the MJT
          **WHEN** you correct the missing tap-off in the portal and confirm
          **THEN** the correction is accepted for the journey
          **WHEN** the next EndOfDay settlement runs and you re-open the journey
          **THEN** the journey is recalculated to the Lanyon Place→Portadown single fare
          **AND** the difference from the maximum fare is refunded
        expected: Correcting the missing tap recalculates to the point-to-point fare and refunds the max-fare difference.
      - title: The 3-Day cap applies within one Monday-to-Sunday week
        refs: [FBD-100690]
        objective: This test is to confirm that the 3-Day cap applies across any three operating days within one Monday-to-Sunday week and does not span weeks.
        steps: |-
          **GIVEN** the seeded card makes matched rail journeys on three operating days within one Monday-to-Sunday week (NIR 3-Day Cap product)
          **AND** each operating day runs 04:00 to 03:59
          **AND** you are signed in to the ABT Operator Portal to verify the card's Journey History
          **AND** example: matched rail journeys on the Tuesday, Thursday and Saturday of one week, then journeys the following week
          **WHEN** the third day's journeys are settled at EndOfDay and you open the card's Journey History
          **THEN** the charge across the three days is held at the NIR 3-Day cap value
          **WHEN** journeys are made in the following Monday-to-Sunday week and settled
          **THEN** those journeys start a fresh 3-Day cap
          **AND** the previous week's total is not carried over
        expected: Three qualifying days in one Mon-Sun week reach the 3-Day cap; the next week starts a fresh cap with no carry-over.

  # ═════════════════════════ Functional / Capping Timing ═════════════════════════
  - path: [ABT, Functional, Capping Timing]
    cases:
      - title: A newly configured capping rule activates the next business day
        refs: [FBD-100307]
        objective: This test is to confirm that a newly configured capping rule takes effect no earlier than the next business day.
        steps: |-
          **GIVEN** you are signed in to CloudFare with a NIR Daily Cap rule newly configured today
          **AND** the seeded card will travel both today and tomorrow
          **AND** you are signed in to the ABT Operator Portal to verify the card's Journey History
          **WHEN** the card travels on the same day the rule was configured and that day's EndOfDay settlement runs
          **THEN** the new cap is NOT applied to that same day's journeys
          **WHEN** the card travels the next business day and that day's settlement runs
          **THEN** the new cap first applies to the next business day's journeys
        expected: A newly configured cap never applies the same day; its earliest effect is the next business day.
      - title: Taps either side of the 04:00 operating-day boundary fall into different cap days
        refs: [FBD-100389]
        objective: This test is to confirm that taps either side of the 04:00 operating-day boundary are counted in different capping days.
        steps: |-
          **GIVEN** the seeded card taps just before and just after the 04:00 operating-day boundary (operating day = 04:00:00 to 03:59:59)
          **AND** you are signed in to the ABT Operator Portal to verify the card's Journey History
          **AND** example: a tap at 03:59 and a tap at 04:01
          **WHEN** the journeys are settled and you open the card's Journey History
          **THEN** the 03:59 tap is counted in the previous operating day's cap
          **AND** the 04:01 tap is counted in the new operating day's cap
          **AND** the two days' caps are totalled separately
        expected: The 03:59 tap belongs to the previous operating day and the 04:01 tap to the new one; their caps total separately.
      - title: A newly deny-listed token starts being denied within about 30 minutes
        refs: [FBD-100307, FBD-100690]
        objective: This test is to confirm that a token added to the Deny List starts being denied at devices within about 30 minutes.
        steps: |-
          **GIVEN** a card token newly added to the ABT Deny List in CloudFare after the last full-list build
          **AND** the Deny List propagates via 15-minute delta files (full list pulled at least once/day, delta every 15 minutes)
          **AND** you have a validator on which to tap the card
          **WHEN** the device pulls the next delta file after the token is added, and the card taps at the validator
          **THEN** the tap is declined with Declined Reason 2 (On Deny List)
          **AND** the token is being denied within about 30 minutes of being added
        expected: A newly deny-listed token is refused with Declined Reason 2 within about 30 minutes via the 15-minute delta files.
      - title: A tap-initiated re-authorisation removes a card within about 15 minutes
        refs: [FBD-100307]
        objective: This test is to confirm that a denied card that re-authorises on tap is removed from the Deny List within about 15 minutes.
        steps: |-
          **GIVEN** the seeded card is on the Deny List from an earlier failed authorisation
          **AND** you are signed in to the ABT Operator Portal to verify the card's status
          **AND** example: a deny-listed cEMV card tapping at a NIR validator, triggering a near-real-time online re-authorisation
          **WHEN** the tap-initiated re-authorisation is approved online
          **THEN** the card is removed from the Deny List within about 15 minutes
          **WHEN** the card taps again at the validator after removal
          **THEN** the subsequent tap is accepted
        expected: An approved tap-initiated re-auth clears the card from the Deny List within about 15 minutes and later taps succeed.

  # ═════════════════════════ Functional / Shift Board ═════════════════════════
  - path: [ABT, Functional, Shift Board]
    cases:
      - title: Shift Board CSV import rejects a malformed row
        refs: [FBD-100831]
        objective: This test is to confirm that the Import Shift Board Data screen rejects a headerless CSV whose rows fail validation.
        steps: |-
          **GIVEN** you are on the CloudFare Schedule Management "Import Shift Board Data" screen with a headerless CSV to import
          **AND** the CSV columns are 0 Shift Number, 4 Journey Number (4-digit), 5 Days-of-Operation (Sun→Sat bitmask), 6 Journey Start Time (HHMM), 8 Route Reference
          **AND** example bad row: Shift Number blank and Days-of-Operation "0111112" (not a 0/1 bitmask)
          **WHEN** you import the malformed CSV
          **THEN** a red banner is shown naming the bad rows
          **AND** the shift board is not imported
        expected: A CSV with an empty Shift Number and a non-0/1 bitmask is rejected with a red banner naming the bad rows; nothing imports.
      - title: A Sunday-start CSV bitmask is stored and filtered as the Monday-start DB order
        refs: [FBD-100831]
        objective: This test is to confirm that a CSV Sunday-to-Saturday day bitmask is stored and filtered as the schedule DB's Monday-to-Sunday order.
        steps: |-
          **GIVEN** a valid shift board CSV whose Days-of-Operation column is ordered Sunday→Saturday
          **AND** you are on the CloudFare "Import Shift Board Data" screen, importing for a Metro depot journey
          **AND** an ETM with that home location on which to check the Journey List
          **AND** example row: Days-of-Operation "0111110" (Mon–Fri in Sun→Sat order)
          **WHEN** you import the CSV and open the Shift Board Viewer
          **THEN** the schedule DB stores the days in Monday→Sunday order as "1111100"
          **WHEN** the ETM filters its Journey List by day of week
          **THEN** the journey appears on Monday to Friday only
        expected: 'The Sun to Sat CSV bitmask "0111110" is stored Mon to Sun as "1111100" and the journey shows Monday to Friday in the ETM Journey List.'
      - title: A Shift Board re-import sets Valid-From at 4am and purges after 7 days
        refs: [FBD-100831]
        objective: This test is to confirm that a re-import sets Valid-From to 4am local and purges entries older than the 7-day retention.
        steps: |-
          **GIVEN** a shift board already imported for a depot, now being re-imported
          **AND** the default 7-day retention is configured
          **AND** you are on the CloudFare "Import Shift Board Data" screen with the Shift Board Viewer available to verify
          **WHEN** you re-import the shift board and open the Shift Board Viewer
          **THEN** the imported entries show Valid From = 4am local on the import day
          **AND** the superseded entries show Valid To = 4am local on the import day
          **AND** entries whose Valid To is older than the 7-day retention are deleted
        expected: A re-import stamps Valid From/To at 4am local and purges entries whose Valid To is older than the 7-day retention.

  # ═════════════════════════ Functional / Access & Claims ═════════════════════════
  - path: [ABT, Functional, Access & Claims]
    cases:
      - title: A first-login user with no claims is denied the Operator Portal and CloudFare
        refs: [FBD-100342]
        objective: This test is to confirm that a first-login user with no assigned claims is denied access to both the Operator Portal and CloudFare.
        steps: |-
          **GIVEN** a user pulled from Active Directory into KeyCloak realm "Translink" but not yet added to any user group (no base or composite claims)
          **AND** the target clients are operator-react-client (Operator Portal) and CloudfareWeb (CloudFare)
          **WHEN** the user signs in to the Operator Portal
          **THEN** access to the Operator Portal is denied
          **WHEN** the same user signs in to CloudFare
          **THEN** access to CloudFare is denied
        expected: A first-login user with no claims is denied both the Operator Portal and CloudFare until an admin adds them to a group.
      - title: An operator sees own and descendant data but not a sibling branch's
        refs: [FBD-100383, FBD-100342]
        objective: This test is to confirm that an operator-scoped user sees their own operator and its descendants but not a sibling branch's data.
        steps: |-
          **GIVEN** a user scoped to the Metro operator in the operator hierarchy (Metro's descendants: Glider, Metro Bus, Falls (Metro); Ulsterbus is a sibling branch under Translink)
          **AND** you are signed in to the ABT Operator Portal as that Metro-scoped user
          **WHEN** you open operator-scoped data (e.g. the Customers page or an operator report) in the portal
          **THEN** the Metro branch is visible, including its descendant operators (Glider, Metro Bus, Falls)
          **AND** the sibling Ulsterbus branch's data is not visible
        expected: A Metro-scoped user sees Metro and its descendants (Glider, Metro Bus, Falls) but not the sibling Ulsterbus branch.
