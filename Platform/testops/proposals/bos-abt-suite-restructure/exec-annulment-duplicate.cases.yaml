  # ═══════════════════════════ Duplicate Detection ═══════════════════════════
  - path: [ABT, Duplicate Detection]
    cases:
      - title: Second tap after a same-stage retail transaction is flagged duplicate
        refs: [TODEV-24258]
        objective: This test is to confirm that a second tap remains a duplicate even after an intervening same-stage retail transaction.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card, with its account open in the Operator Portal Journey History to verify
          **AND** the duplicate-detection window is 15 minutes
          **AND** Metro capping is £4.00 with a £2.30 single fare on 10A (IN)
          **AND** the card has no prior taps today
          **WHEN** you tap the card at Casement Park (10A IN) at 09:00
          **AND** you make a same-stage retail (Model 1 / KFT ticket) transaction on the device at 09:02
          **AND** you tap again at Casement Park (10A IN) at 09:06
          **AND** you run the EndOfDay settlement
          **THEN** in Journey History the 09:00 tap is charged the full £2.30
          **AND** the 09:02 retail transaction is recorded and charged its own ticket price
          **AND** the 09:06 tap shows £0.00, marked Duplicate against the 09:00 original
          **AND** the tap day total is £2.30
        expected: The intervening 09:02 retail transaction does not reset detection; the 09:06 same-stage tap is still a duplicate at £0.00.
      - title: Later taps including an out-of-order timestamp are flagged duplicates
        refs: [TODEV-24258]
        objective: This test is to confirm that later same-stage taps, including one timestamped before the original, are flagged as duplicates.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card, with its account open in the Operator Portal Journey History to verify
          **AND** the duplicate-detection window is 15 minutes
          **AND** Metro capping is £4.00 with a £2.30 single fare on 10A (IN)
          **AND** the card has no prior taps today
          **AND** a second validator was briefly offline (or its clock was skewed), so a tap it buffered uploads late — carrying a timestamp earlier than taps the back office has already processed
          **WHEN** you tap the card at Casement Park (10A IN) at 09:00
          **AND** you make a same-stage retail transaction on the device at 09:02
          **AND** you tap again at Casement Park (10A IN) at 09:06
          **AND** the buffered same-stage tap from the offline device then uploads with an 08:58 timestamp — earlier than the 09:00 original but arriving after it (out of order), inside the 15-minute window
          **AND** you run the EndOfDay settlement
          **THEN** in Journey History the 09:06 tap shows £0.00, marked Duplicate
          **AND** the 08:58 out-of-order tap shows £0.00, marked Duplicate
          **AND** both are linked to the 09:00 original
          **AND** the day total is unchanged at £2.30
        expected: Both later same-stage taps — the 09:06 and the out-of-order 08:58 — are duplicates at £0.00 linked to the 09:00 original, leaving the day total unchanged.
      - title: Multiple interleaved retail transactions never reset the duplicate reference
        refs: [TODEV-24258]
        objective: This test is to confirm that every same-stage tap after the first is a duplicate of the original regardless of interleaved retail transactions.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card, with its account open in the Operator Portal Journey History to verify
          **AND** the duplicate-detection window is 15 minutes
          **AND** Metro capping is £4.00 with a £2.30 single fare on 10A (IN)
          **AND** the card has no prior taps today
          **WHEN** you tap the card at Casement Park (10A IN) at 09:00
          **AND** you make a same-stage retail transaction at 09:02
          **AND** you tap again at Casement Park (10A IN) at 09:05
          **AND** you make another same-stage retail transaction at 09:07
          **AND** you tap again at Casement Park (10A IN) at 09:10
          **AND** you run the EndOfDay settlement
          **THEN** in Journey History the 09:05 tap shows £0.00, marked Duplicate against the 09:00 original
          **AND** the 09:10 tap shows £0.00, marked Duplicate against the same 09:00 original
          **AND** the tap day total is unchanged at £2.30
        expected: No matter how many retail transactions are interleaved, every later same-stage tap stays a duplicate at £0.00 against the original 09:00 tap.
      - title: A retail transaction from a different stage still allows the duplicate
        refs: [TODEV-24258]
        objective: This test is to confirm that the previously-working different-stage retail path still flags the later tap as a duplicate.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card, with its account open in the Operator Portal Journey History to verify
          **AND** the duplicate-detection window is 15 minutes
          **AND** Metro capping is £4.00 with a £2.30 single fare on 10A (IN)
          **AND** the card has no prior taps today
          **WHEN** you tap the card at Casement Park (10A IN) at 09:00
          **AND** you make a retail transaction from a different stage (Slievegallion Drive, 10A IN) at 09:02
          **AND** you tap again at Casement Park (10A IN) at 09:06
          **AND** you run the EndOfDay settlement
          **THEN** in Journey History the 09:00 tap is charged the full £2.30
          **AND** the 09:06 same-stage tap shows £0.00, marked Duplicate against the 09:00 original
          **AND** the tap day total is £2.30
        expected: A retail transaction from a different stage does not reset detection; the 09:06 same-stage tap is still a duplicate at £0.00.
      - title: A same-stage tap outside the duplicate window is not a duplicate
        refs: [TODEV-24258]
        objective: This test is to confirm that a same-stage tap beyond the 15-minute window is a genuine new tap.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card, with its account open in the Operator Portal Journey History to verify
          **AND** the duplicate-detection window is 15 minutes
          **AND** Metro capping is £4.00 with a £2.30 single fare on 10A (IN)
          **AND** the card has no prior taps today
          **WHEN** you tap the card at Casement Park (10A IN) at 09:00
          **AND** you make a same-stage retail transaction at 09:02
          **AND** you tap again at Casement Park (10A IN) at 09:16, more than 15 minutes after the first tap
          **AND** you run the EndOfDay settlement
          **THEN** in Journey History the 09:00 tap is charged the full £2.30
          **AND** the 09:16 tap is a genuine second tap, not marked Duplicate
          **AND** the 09:16 tap is charged £1.70 to complete the £4.00 Metro cap
          **AND** the day total is £4.00
        expected: Beyond the 15-minute window the 09:16 same-stage tap is a genuine second tap (charged, not a duplicate), and the Metro day caps at £4.00.
      - title: The retail transaction itself is never flagged a duplicate of a tap
        refs: [TODEV-24258]
        objective: This test is to confirm that a retail transaction is recorded correctly and is not cross-flagged as a duplicate of a TOO tap.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card, with its account open in the Operator Portal Journey History to verify
          **AND** the duplicate-detection window is 15 minutes
          **AND** Metro capping is £4.00 with a £2.30 single fare on 10A (IN)
          **AND** the card has no prior taps today
          **WHEN** you tap the card at Casement Park (10A IN) at 09:00
          **AND** you make a same-stage retail (Model 1 / KFT ticket) transaction on the device at 09:06, inside the window
          **AND** you run the EndOfDay settlement
          **THEN** in Journey History the 09:00 tap is charged the full £2.30
          **AND** the 09:06 retail transaction is recorded and charged its own ticket price
          **AND** the retail transaction is not marked Duplicate of the 09:00 tap
        expected: The retail transaction is recorded and charged correctly on its own and is never cross-flagged as a duplicate of the TOO tap.
      - title: A later tap from a different boarding stage is a genuine new tap
        refs: [TODEV-24258]
        objective: This test is to confirm that duplicate detection is per boarding stage, so a different-stage tap charges normally.
        steps: |-
          **GIVEN** the seeded ABT test cEMV card, with its account open in the Operator Portal Journey History to verify
          **AND** the duplicate-detection window is 15 minutes
          **AND** Metro capping is £4.00 with a £2.30 single fare on 10A (IN)
          **AND** the card has no prior taps today
          **WHEN** you tap the card at Casement Park (10A IN) at 09:00
          **AND** you make a same-stage retail transaction at 09:02
          **AND** you tap at Slievegallion Drive (10A IN) → Falls Park at 09:06, a different boarding stage
          **AND** you run the EndOfDay settlement
          **THEN** in Journey History the 09:00 Casement Park tap is charged the full £2.30
          **AND** the 09:06 Slievegallion Drive tap is a genuine second tap, not marked Duplicate
          **AND** the 09:06 tap is charged £1.70 to complete the £4.00 Metro cap
          **AND** the day total is £4.00
        expected: Detection is per boarding stage, so the different-stage 09:06 tap is a genuine second tap charged normally, and the Metro day caps at £4.00.
