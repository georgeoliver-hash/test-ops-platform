# CloudFare (BOS) — Estate Management.
# Consolidated from old suite 14441 (~86 cases): Activity Log filter/barcode micro-cases
# folded; menu-navigation cases folded into their area; Staff Manager add/modify/disable
# folded. devtype [100]. House style, single-predicate THENs.
suite_id: 30279
defaults:
  template_id: 1
  custom_devtypes: [100]
  custom_autoconfirmation: false
  custom_revstatus: 2
sections:
  - path: [CloudFare, Functional, Estate Management, Activity Log]
    cases:
      - title: Filter the activity log by activity, device, date and time
        objective: This test is to confirm that a user can filter the activity log by activity, device, date and time.
        steps: |-
          **GIVEN** the All Activities page is displayed with communicated data to filter
          **WHEN** the user filters by activity, device, date and time
          **THEN** only the activities matching the selected filters are shown
        expected: The activity log shows only activities matching the activity, device, date and time filters.
      - title: Page through the activity log
        objective: This test is to confirm that a user can page through the activity log results.
        steps: |-
          **GIVEN** the All Activities page is displayed with more results than one page
          **WHEN** the user navigates between pages
          **THEN** the next and previous pages of activities are shown
        expected: The activity log pages through its results.
      - title: View transactions, events and staff activity
        objective: This test is to confirm that the activity log shows transactions, events and staff activity.
        steps: |-
          **GIVEN** the All Activities page is displayed with communicated data
          **WHEN** the user views transactions, events and staff activity
          **THEN** each activity type is shown with its detail
        expected: Transactions, events and staff activity are shown in the activity log.
      - title: Filter the activity log by barcode ID
        objective: This test is to confirm that a user can filter the activity log by validated, printed, failed and invalid barcode IDs.
        steps: |-
          **GIVEN** a HHD is commissioned and communicating with CloudFare
          **AND** the All Activities page is displayed
          **WHEN** the user filters by a validated, printed, failed or invalid barcode ID
          **THEN** only the activities matching that barcode ID are shown
        expected: The activity log filters correctly by validated, printed, failed and invalid barcode IDs.
      - title: Failed validations and payments appear in the activity log
        objective: This test is to confirm that failed barcode validations, failed ABT taps and failed bank-card payments are identified in the activity log.
        steps: |-
          **GIVEN** the All Activities page is displayed with communicated data
          **WHEN** the user reviews failed barcode validations, failed ABT taps on an ETM and failed bank-card retail payments
          **THEN** each failure is identified in the activity log with its reason
        expected: Failed validations, ABT taps and bank-card payments are identified in the activity log.

  - path: [CloudFare, Functional, Estate Management, Asset Manager]
    cases:
      - title: View and edit device information
        objective: This test is to confirm that a user can view and edit device information in Asset Manager.
        steps: |-
          **GIVEN** the Device Information page is displayed with a list of existing devices
          **WHEN** the user views and edits a device's information
          **THEN** the device information is updated
        expected: Device information can be viewed and edited.
      - title: Disable and enable a device
        objective: This test is to confirm that a user can disable a device and re-enable a disabled device in Asset Manager.
        steps: |-
          **GIVEN** the Device Information page is displayed with a list of existing devices
          **WHEN** the user disables a device and later enables it
          **THEN** the device's enabled state is updated accordingly
        expected: A device can be disabled and re-enabled.
      - title: Quick Product Assignment — add, remove and abandon products
        objective: This test is to confirm that a user can add and remove products via Quick Product Assignment and abandon unsaved changes.
        steps: |-
          **GIVEN** the Quick Product Assignment page is displayed with the operator level set
          **WHEN** the user adds products, removes products, or abandons the changes
          **THEN** the product changes are saved
          **AND** abandoned changes are discarded
        expected: Products can be added and removed via Quick Product Assignment, and changes can be abandoned.

  - path: [CloudFare, Functional, Estate Management, Comms Monitor]
    cases:
      - title: Comms Monitor — recent activity, search, filter and report
        objective: This test is to confirm that the Comms Monitor shows recent activity and supports search, filter and report.
        steps: |-
          **GIVEN** the Comms Monitor page is displayed with a dynamic device list
          **WHEN** the user views recent activity and uses search, filter and report
          **THEN** the recent activity table updates to the search and filter
          **AND** the communications report is produced
        expected: Comms Monitor shows recent activity and supports search, filter and report.
      - title: Comms Monitor — change of operating company
        objective: This test is to confirm that the Comms Monitor reflects a change of operating company.
        steps: |-
          **GIVEN** the Comms Monitor page is displayed
          **WHEN** the operating company of a device changes
          **THEN** the Comms Monitor reflects the new operating company
        expected: The Comms Monitor reflects a change of operating company.

  - path: [CloudFare, Functional, Estate Management, Device Dataset Deployment]
    cases:
      - title: Create and modify a device dataset version
        objective: This test is to confirm that a user can create a device dataset version and modify its details.
        steps: |-
          **GIVEN** the Device Datasets page is displayed with existing versions
          **WHEN** the user creates a new dataset version and modifies its details
          **THEN** the dataset version is saved with the modified details
        expected: A device dataset version can be created and its details modified.
      - title: Upload and configure device software
        objective: This test is to confirm that a user can upload a new software version and configure its parameters.
        steps: |-
          **GIVEN** the Device Dataset Deployment software distribution page is displayed
          **WHEN** the user uploads a new software version and configures its parameters
          **THEN** the software version is uploaded with the configured parameters
        expected: A new software version is uploaded and its parameters configured.
      - title: Manage device dataset version state and deployment
        objective: This test is to confirm that a user can change a dataset version's state and deploy it to devices.
        steps: |-
          **GIVEN** the Device Datasets page is displayed with a valid dataset version
          **WHEN** the user changes the version state and deploys it
          **THEN** the version state is updated
          **AND** the dataset is deployed to the target devices
        expected: A dataset version's state can be changed and deployed to devices.

  - path: [CloudFare, Functional, Estate Management, Staff Manager]
    cases:
      - title: Add, modify and disable a staff member
        objective: This test is to confirm that a user can add a new staff member, modify their details and disable them.
        steps: |-
          **GIVEN** the Staff Manager page is displayed with a list of existing staff
          **WHEN** the user adds a new staff member, modifies their details, or disables them
          **THEN** each change is saved against the staff record
        expected: A staff member can be added, modified and disabled.
      - title: Modify a staff member's PIN
        objective: This test is to confirm that a user can modify a staff member's PIN.
        steps: |-
          **GIVEN** the Staff Manager page is displayed with an existing staff member
          **WHEN** the user modifies the staff member's PIN
          **THEN** the new PIN is saved against the staff record
        expected: A staff member's PIN can be modified.
      - title: Modify a staff member's home and working location
        objective: This test is to confirm that a user can modify a staff member's home and working locations.
        steps: |-
          **GIVEN** the Staff Manager page is displayed with an existing staff member
          **WHEN** the user modifies the staff member's home and working locations
          **THEN** the updated locations are saved against the staff record
        expected: A staff member's home and working locations can be modified.
      - title: View staff history
        objective: This test is to confirm that a user can view a staff member's history.
        steps: |-
          **GIVEN** the Staff Manager module is available to the user
          **WHEN** the user views a staff member's history
          **THEN** the staff history is displayed
        expected: A staff member's history is displayed.

  - path: [CloudFare, Functional, Estate Management, Quarantined Data]
    cases:
      - title: Filter quarantined data by device
        objective: This test is to confirm that a user can filter quarantined data by device.
        steps: |-
          **GIVEN** the user is on the Quarantined Data section under Estate Management
          **WHEN** the user filters the quarantined data by device
          **THEN** only the quarantined data for that device is shown
        expected: Quarantined data is filtered by the selected device.
      - title: Edit and resubmit quarantined data
        objective: This test is to confirm that a user can edit quarantined data and resubmit it for processing.
        steps: |-
          **GIVEN** there is quarantined data in the table
          **WHEN** the user edits a quarantined record and submits it
          **THEN** the corrected record is resubmitted for processing
        expected: Quarantined data can be edited and resubmitted for processing.

  - path: [CloudFare, Functional, Estate Management, Commands Viewer]
    cases:
      - title: Navigate the Commands Viewer
        objective: This test is to confirm that a user can navigate to and view the Commands Viewer.
        steps: |-
          **GIVEN** a user is signed into CloudFare on the Estate Management page
          **AND** the Commands Viewer is available to the user
          **WHEN** the user opens the Commands Viewer
          **THEN** the Commands Viewer page is displayed
        expected: The Commands Viewer page is displayed.
