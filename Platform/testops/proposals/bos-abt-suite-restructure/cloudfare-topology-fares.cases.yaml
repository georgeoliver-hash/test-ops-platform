# CloudFare (BOS) — Topology & Fares Management.
# Consolidated from old suite 14441 (~115 cases): per-device FLU-group duplication
# folded to a variation; export XLSX/CSV variants folded; out-of-scope items
# (TransXchange import, promotions, circular routes, BV/HHD rail-substitute) omitted.
# devtype [100] = BOS / CloudFare. House style, single-predicate THENs.
suite_id: 30279
defaults:
  template_id: 1
  custom_devtypes: [100]
  custom_autoconfirmation: false
  custom_revstatus: 2
sections:
  - path: [CloudFare, Functional, Topology & Fares, Setup & Import]
    cases:
      - title: Navigate the Topology & Fares Management menu
        objective: This test is to confirm that a user can navigate the Topology & Fares Management menu.
        steps: |-
          **GIVEN** a user is signed into CloudFare with the Dashboard displayed
          **WHEN** the user opens Topology & Fares Management and selects each option
          **THEN** each Topology & Fares page opens
        expected: Each Topology & Fares Management menu option opens its page.
      - title: Filter topology by operator
        objective: This test is to confirm that services and routes can be filtered and managed separately by operator.
        steps: |-
          **GIVEN** a user is on the Topology & Fares Management page
          **WHEN** the user filters by a selected operator
          **THEN** only that operator's services and routes are shown
        expected: Topology is filtered to the selected operator's services and routes.
      - title: Export fares
        objective: This test is to confirm that a user can export the fares for a selected operator.
        steps: |-
          **GIVEN** a user is on the Topology & Fares Management page with fares to export
          **WHEN** the user exports the fares for a selected operator
          **THEN** the fares are exported
        expected: The fares for the selected operator are exported.
      - title: Import a map point file (CSV)
        objective: This test is to confirm that a user can import a map point CSV file to add and update stops.
        steps: |-
          **GIVEN** a user is on the Topology & Fares Management page
          **WHEN** the user imports a map point CSV file
          **THEN** stops not already present are added
          **AND** existing stops are updated from the file
        expected: New stops are added and existing stops updated from the imported map point file.
      - title: Import route data at parent and child level
        objective: This test is to confirm that a user can import route data XLSX files at parent operator and child operator level.
        steps: |-
          **GIVEN** a user is on the Topology & Fares Management page with an operator selected
          **WHEN** the user imports route data at parent level and at child operator level
          **THEN** the route data is imported at the selected level
        expected: Route data imports correctly at both parent and child operator levels.

  - path: [CloudFare, Functional, Topology & Fares, Drawing Tool]
    cases:
      - title: Add a new map point
        objective: This test is to confirm that a user can add a new map point, including a linked stop, with the Drawing Tool.
        steps: |-
          **GIVEN** a user is on the Topology & Fares Management Drawing Tool
          **WHEN** the user adds a new map point, including a linked stop
          **THEN** the map point is created
          **AND** it is shown on the map
        expected: A new map point, including a linked stop, is created.
      - title: Create, edit and delete a zone
        objective: This test is to confirm that a user can create, edit and delete a zone, with smaller zones layered above larger overlaid zones.
        steps: |-
          **GIVEN** a user is on the Topology & Fares Management Drawing Tool
          **WHEN** the user creates, edits and deletes a zone
          **THEN** each change is applied to the zone
          **AND** a smaller zone is layered above a larger overlaid zone so it stays accessible
        expected: Zones can be created, edited and deleted, with smaller zones layered above larger ones.
      - title: Configure positional points on a route
        objective: This test is to confirm that a user can configure positional points on a selected route.
        steps: |-
          **GIVEN** a user has selected an existing route and zoomed into the map
          **WHEN** the user configures positional points on the route
          **THEN** the positional points are saved to the route
        expected: Positional points are configured and saved to the route.
      - title: Export and edit map points via file
        objective: This test is to confirm that a user can export map points to CSV and re-import edits made in the file.
        steps: |-
          **GIVEN** a user is on the Topology & Fares Management Drawing Tool
          **WHEN** the user exports the map points to CSV, edits the file and re-imports it
          **THEN** the edited map points are updated in CloudFare
        expected: Map points can be exported, edited in the file and re-imported.
      - title: Search for a map point
        objective: This test is to confirm that a user can search for a map point in the Drawing Tool.
        steps: |-
          **GIVEN** a user is on the Topology & Fares Management Drawing Tool
          **WHEN** the user searches for a map point
          **THEN** the matching map point is located on the map
        expected: A searched map point is located on the map.

  - path: [CloudFare, Functional, Topology & Fares, Route Management]
    cases:
      - title: Create, amend, copy and delete a route
        objective: This test is to confirm that a user can create, amend, copy and delete a route.
        steps: |-
          **GIVEN** a user is on the Topology & Fares Management page
          **WHEN** the user creates, amends, copies or deletes a route
          **THEN** each change is applied to the route list
          **AND** a copied route retains its assigned fare area
        expected: Routes can be created, amended, copied and deleted; a copy retains its fare area.
      - title: Configure a route's service code and operator
        objective: This test is to confirm that a user can set a route's service code and assign it to an operator.
        steps: |-
          **GIVEN** a user has selected an operator and service on the Topology & Fares Management page
          **WHEN** the user sets the service code and assigns the operator
          **THEN** the route is saved with the service code and operator
        expected: The route's service code and operator assignment are saved.
      - title: Enable ABT flat fare on a route
        objective: This test is to confirm that a user can enable ABT flat fare on a route.
        steps: |-
          **GIVEN** a user has selected a route on the Topology & Fares Management page
          **WHEN** the user enables ABT flat fare on the route
          **THEN** the route is configured for ABT flat-fare travel
        expected: ABT flat fare is enabled on the route.
      - title: Enable transfers and set the transfer time on a route
        objective: This test is to confirm that a user can enable transfers on a route and set the transfer time so the correct fare is retrieved within the window.
        steps: |-
          **GIVEN** a user has selected an operator and service
          **WHEN** the user enables transfers on the route and sets the transfer time in minutes
          **THEN** transfers are enabled on the route
          **AND** a transfer within the configured time retrieves the correct fare
        expected: Transfers are enabled and a transfer within the set time retrieves the correct fare.
      - title: Configure a route's fares triangle and calculate a fare
        objective: This test is to confirm that a user can configure a route's fares triangle, create a new fare area and calculate a fare.
        steps: |-
          **GIVEN** a user has selected an operator and service
          **WHEN** the user configures the fares triangle, creates a new fare area and calculates a fare
          **THEN** the fares triangle is saved
          **AND** the calculated fare matches the configured fare area
        expected: The fares triangle and new area are saved and the calculated fare is correct.
      - title: Configure an ETM rail substitute route
        objective: This test is to confirm that a user can create an ETM rail substitution service route.
        steps: |-
          **GIVEN** a user has selected an ETM operator and created a rail replacement service
          **WHEN** the user configures the rail substitute route
          **THEN** the ETM rail substitute route is saved
        expected: The ETM rail substitute route is configured and saved.

  - path: [CloudFare, Functional, Topology & Fares, Products]
    cases:
      - title: Configure a product
        objective: This test is to confirm that a user can configure a product for an operator.
        steps: |-
          **GIVEN** a user is on the Topology & Fares Management screen with an operator selected
          **WHEN** the user configures a product
          **THEN** the product is saved with its configuration
        expected: A product is configured and saved.
      - title: Configure an ABT product
        objective: This test is to confirm that a user can configure an ABT product.
        steps: |-
          **GIVEN** a user is on the Topology & Fares Management screen with an operator selected
          **WHEN** the user configures an ABT product
          **THEN** the ABT product is saved with its configuration
        expected: An ABT product is configured and saved.
      - title: Configure an Open product
        objective: This test is to confirm that a user can configure an Open product.
        steps: |-
          **GIVEN** a user is on the CloudFare Topology Management page with an operator selected
          **WHEN** the user configures an Open product
          **THEN** the Open product is saved with its configuration
        expected: An Open product is configured and saved.
      - title: Configure a FLU product
        objective: This test is to confirm that a user can configure a fare look-up (FLU) product.
        steps: |-
          **GIVEN** a user is on the CloudFare Topology Management page with an operator selected
          **WHEN** the user configures a FLU product
          **THEN** the FLU product is saved with its configuration
        expected: A FLU product is configured and saved.
      - title: Configure a Preset Reverse FLU product
        objective: This test is to confirm that a user can configure a preset reverse fare look-up product.
        steps: |-
          **GIVEN** a user is on the CloudFare Topology Management page with an operator selected
          **WHEN** the user configures a preset reverse FLU product
          **THEN** the product is saved with its configuration
        expected: A preset reverse FLU product is configured and saved.
      - title: Configure a Reference Type product
        objective: This test is to confirm that a user can configure a reference type product.
        steps: |-
          **GIVEN** a user is on the CloudFare Topology Management page with an operator selected
          **WHEN** the user configures a reference type product
          **THEN** the product is saved with its configuration
        expected: A reference type product is configured and saved.
      - title: Configure an Excess product
        objective: This test is to confirm that a user can configure an excess product.
        steps: |-
          **GIVEN** a user is on the CloudFare Topology Management page with an operator selected
          **WHEN** the user configures an excess product
          **THEN** the excess product is saved with its configuration
        expected: An excess product is configured and saved.
      - title: Configure a Smartcard product
        objective: This test is to confirm that a user can configure a smartcard product, including WTS SmartRecharge and SmartCreate variants.
        steps: |-
          **GIVEN** a user is on the CloudFare Topology Management page with an operator selected
          **WHEN** the user configures a smartcard product, including the WTS SmartRecharge and SmartCreate variants
          **THEN** the smartcard product is saved with its configuration
        expected: A smartcard product, including WTS SmartRecharge and SmartCreate, is configured and saved.
      - title: Configure a Barcode product
        objective: This test is to confirm that a user can configure when a barcode is printed on a paper ticket product.
        steps: |-
          **GIVEN** a user is on the Topology & Fares Management screen with an operator selected
          **WHEN** the user configures barcode printing for a paper ticket product
          **THEN** the barcode product setting is saved
        expected: Barcode printing for a paper ticket product is configured and saved.
      - title: Configure the alighting stage for a product
        objective: This test is to confirm that a user can configure the alighting stage for a product.
        steps: |-
          **GIVEN** a user has selected fares for a product on the Topology & Fares Management screen
          **WHEN** the user configures the alighting stage for the product
          **THEN** the alighting stage is saved to the product
        expected: The alighting stage is configured and saved to the product.
      - title: Configure annulments per device for a product
        objective: This test is to confirm that a user can configure product annulments per device type.
        steps: |-
          **GIVEN** a product has been set up and the user is viewing its details
          **WHEN** the user configures annulments for the product per device type
          **THEN** the annulment settings are saved per device
        expected: Product annulment settings are saved per device type.
      - title: Configure the passback period for a product
        objective: This test is to confirm that a user can configure the passback period for a product.
        steps: |-
          **GIVEN** a user is viewing a product on the Topology & Fares Management screen
          **WHEN** the user configures the passback period for the product
          **THEN** the passback period is saved to the product
        expected: The passback period is configured and saved to the product.
      - title: Configure device keyboard buttons for products
        objective: This test is to confirm that a user can add, remove and toggle product device keyboard buttons, including per device type.
        steps: |-
          **GIVEN** a user is on the Topology & Fares Management screen with an operator selected
          **WHEN** the user adds, removes or toggles product keyboard buttons for a device
          **THEN** the device keyboard button configuration is saved
        expected: Product device keyboard buttons can be added, removed and toggled per device.
      - title: Create and edit a FLU product group
        objective: This test is to confirm that a user can create and edit a FLU product group for each device type.
        steps: |-
          **GIVEN** a user is on the Topology & Fares Management screen with toggle groups created
          **WHEN** the user creates or edits a FLU group for a device type (ETM, POS, HHD or TVM)
          **THEN** the FLU group is saved for that device
        expected: A FLU product group can be created and edited for ETM, POS, HHD and TVM.
      - title: Set a product assignment expiry
        objective: This test is to confirm that a user can set the expiry of a product assignment.
        steps: |-
          **GIVEN** a user is on the Topology & Fares Management screen with an operator selected
          **WHEN** the user sets the expiry of a product assignment
          **THEN** the product assignment expiry is saved
        expected: A product assignment expiry is configured and saved.

  - path: [CloudFare, Functional, Topology & Fares, Rules]
    cases:
      - title: Add a fares rule
        objective: This test is to confirm that a user can add a new fares rule.
        steps: |-
          **GIVEN** a user is on the Topology & Fares Management page
          **WHEN** the user adds a new fares rule
          **THEN** the rule is saved
        expected: A new fares rule is added and saved.
      - title: Configure an e-Purse single fares charge rule
        objective: This test is to confirm that a user can configure an e-Purse single fares charge rule.
        steps: |-
          **GIVEN** a user is on the Topology & Fares Management screen with an operator selected
          **WHEN** the user configures an e-Purse single fares charge rule
          **THEN** the rule is saved
          **AND** it is applied to e-Purse single fares
        expected: An e-Purse single fares charge rule is configured and applied.
      - title: Configure a fixed fare rule
        objective: This test is to confirm that a user can configure a fixed fare rule, including a smartcard fixed fare.
        steps: |-
          **GIVEN** a user is on the Topology & Fares Management screen with an operator selected
          **WHEN** the user configures a fixed fare rule, including a smartcard fixed fare
          **THEN** the fixed fare rule is saved
          **AND** it is applied
        expected: A fixed fare rule, including smartcard fixed fare, is configured and applied.

  - path: [CloudFare, Functional, Topology & Fares, Card Reference File]
    cases:
      - title: Card Reference File validates alighting stages across devices
        objective: This test is to confirm that the Card Reference File provides the correct alighting stages on each device (ETM, POS, PV, HHD).
        steps: |-
          **GIVEN** the latest Card Reference File is implemented on a commissioned ETM, POS, PV and HHD
          **WHEN** the device uses the Card Reference File to check alighting stages
          **THEN** the correct alighting stages are provided on each device
        expected: The Card Reference File provides the correct alighting stages on ETM, POS, PV and HHD.

  - path: [CloudFare, Functional, Topology & Fares, Labeling & Publishing]
    cases:
      - title: Label configuration data
        objective: This test is to confirm that a user can label prepared configuration data ready for publishing.
        steps: |-
          **GIVEN** a user is on the Topology & Fares page with prepared configuration data
          **WHEN** the user labels the configuration data
          **THEN** the configuration data is labelled
        expected: Prepared configuration data is labelled.
      - title: Publish configuration with a future transition date
        objective: This test is to confirm that an administrator can publish configuration and set when devices transition from current to future fares.
        steps: |-
          **GIVEN** a user is on the Topology & Fares page with labelled configuration data
          **WHEN** the administrator publishes the configuration with a future transition date and time
          **THEN** the configuration is published
          **AND** devices transition from current to future fares at the set date and time
        expected: Configuration is published and devices transition to the future fares at the set time.
      - title: Publish an old configuration
        objective: This test is to confirm that a user can re-publish an older configuration.
        steps: |-
          **GIVEN** a user is on the Topology & Fares page with appropriate configuration data prepared
          **WHEN** the user publishes an older configuration
          **THEN** the older configuration is published
        expected: An older configuration is re-published.
      - title: Delete a topology label
        objective: This test is to confirm that a user can delete an active published topology label.
        steps: |-
          **GIVEN** an active published topology label exists on the environment
          **WHEN** the user deletes the topology label
          **THEN** the topology label is deleted
        expected: An active published topology label is deleted.
