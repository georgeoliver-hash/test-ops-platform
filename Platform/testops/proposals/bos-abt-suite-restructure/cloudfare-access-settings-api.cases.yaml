# CloudFare (BOS) — Sign On & Access, Roles & Profiles, Settings, API.
# Consolidated from old suite 14441 Cloudfare areas (sign-off variations folded;
# Scheduled Tasks 6 purge cases folded by data-type; API date-range cases folded).
# devtype [100] = BOS / CloudFare. House style, single-predicate THENs.
suite_id: 30279
defaults:
  template_id: 1
  custom_devtypes: [100]
  custom_autoconfirmation: false
  custom_revstatus: 2
sections:
  - path: [CloudFare, Functional, Sign On & Access]
    cases:
      - title: Sign on with username and password
        objective: This test is to confirm that a user can sign on to CloudFare with a valid username and password.
        steps: |-
          **GIVEN** the CloudFare sign-on page is displayed
          **WHEN** the user signs on with a valid username and password
          **THEN** the user is signed in
          **AND** the Dashboard is displayed
        expected: A valid username and password signs the user in to CloudFare.
      - title: Sign on with a Google account
        objective: This test is to confirm that a user with an authorised Google account can sign on to CloudFare.
        steps: |-
          **GIVEN** the CloudFare sign-on page is displayed
          **AND** the user's Google account is authorised for the current environment
          **WHEN** the user signs on with their Google account
          **THEN** the user is signed in
          **AND** the Dashboard is displayed
        expected: An authorised Google account signs the user in to CloudFare.
      - title: Sign off
        objective: This test is to confirm that a user can sign off CloudFare, including via the sign-off button and the back button.
        steps: |-
          **GIVEN** a user is signed into CloudFare
          **WHEN** the user signs off using the sign-off button or the back button
          **THEN** the session ends
          **AND** the sign-on page is shown
        expected: The user is signed off and returned to the sign-on page.

  - path: [CloudFare, Functional, Roles & Profiles]
    cases:
      - title: Configure report access for a role
        objective: This test is to confirm that an administrator can manage which reports a role can access, including specific reports.
        steps: |-
          **GIVEN** an administrator is signed into CloudFare
          **WHEN** the administrator sets the report access for a role, including specific report access
          **THEN** the role can access only the permitted reports
        expected: A role's report access matches the administrator's configuration.
      - title: Configure module and group access for a role
        objective: This test is to confirm that an administrator can set a role's group access and Passenger Journey, Revenue Reporting and System Mining Tool access.
        steps: |-
          **GIVEN** an administrator is signed into CloudFare
          **WHEN** the administrator sets the group access and module access (Passenger Journey, Revenue Reporting, System Mining Tool) for a role
          **THEN** the role can access only the permitted groups and modules
        expected: A role's group and module access matches the administrator's configuration.

  - path: [CloudFare, Functional, Settings]
    cases:
      - title: Navigate the Settings menu
        objective: This test is to confirm that a user can navigate the CloudFare Settings menu.
        steps: |-
          **GIVEN** a user is signed into CloudFare with the Dashboard displayed
          **WHEN** the user opens Settings and selects each option
          **THEN** each Settings page opens
        expected: Each Settings menu option opens its page.
      - title: Event Codes — view, add, edit and import
        objective: This test is to confirm that a user can view, add, edit and import event codes in Settings.
        steps: |-
          **GIVEN** a user is signed into CloudFare on the Event Codes page
          **WHEN** the user selects an event code, edits it, adds a new one, or imports codes
          **THEN** the event codes table reflects each change
        expected: Event codes can be viewed, added, edited and imported.
      - title: Operating Units — add, edit and delete
        objective: This test is to confirm that a user can add, edit and delete operating units in Settings.
        steps: |-
          **GIVEN** a user is signed into CloudFare in Settings
          **WHEN** the user adds, edits or deletes an operating unit
          **THEN** the operating units list reflects each change
        expected: Operating units can be added, edited and deleted.
      - title: Scheduled Tasks — enable and disable purges
        objective: This test is to confirm that a user can enable and disable scheduled purges for quarantine messages, events and alerts, and communications data.
        steps: |-
          **GIVEN** a user is signed into CloudFare on the Scheduled Tasks settings page
          **WHEN** the user enables or disables purges for successful quarantine messages, events and alerts, or communications data
          **THEN** the purge schedule for that data type is updated accordingly
        expected: Scheduled purges can be enabled and disabled per data type.
      - title: System Settings — edit values, VAT and feature toggles
        objective: This test is to confirm that a user can edit system settings, add a VAT value and change feature toggles.
        steps: |-
          **GIVEN** a user is signed into CloudFare on the System Settings page
          **WHEN** the user edits a system setting value, adds a VAT value, or changes a feature toggle
          **THEN** the system setting is saved with the new value
        expected: System settings, VAT values and feature toggles can be edited and saved.
      - title: Notifications — edit a value
        objective: This test is to confirm that a user can edit a notifications value in Settings.
        steps: |-
          **GIVEN** a user is signed into CloudFare on the Notifications settings page
          **WHEN** the user edits a notifications value
          **THEN** the notifications value is saved
        expected: A notifications value can be edited and saved.
      - title: External Interface Settings — edit
        objective: This test is to confirm that a user can edit External Interface Settings in CloudFare.
        steps: |-
          **GIVEN** a user is signed into CloudFare on the External Interface Settings page
          **WHEN** the user edits an external interface setting
          **THEN** the setting is saved
        expected: An external interface setting can be edited and saved.
      - title: Scheduled Adherence — edit
        objective: This test is to confirm that a user can edit Scheduled Adherence thresholds in Settings.
        steps: |-
          **GIVEN** a user is signed into CloudFare on the Scheduled Adherence settings page
          **WHEN** the user edits a scheduled adherence threshold
          **THEN** the threshold is saved
        expected: A scheduled adherence threshold can be edited and saved.

  - path: [CloudFare, Functional, API]
    cases:
      - title: ExternalInfo/StaffCash API returns staff cash for a date range
        objective: This test is to confirm that the ExternalInfo/StaffCash API returns staff cash data for single-day, multi-day and current-day requests.
        steps: |-
          **GIVEN** the user is authenticated to the API tool
          **WHEN** the user sends a GET ExternalInfo/StaffCash request for a single past day, a multi-day past range, or the current day
          **THEN** the API returns the staff cash data for the requested period
        expected: The StaffCash API returns correct data for single-day, multi-day and current-day requests.
      - title: ExternalInfo/StaffCash API handles invalid requests and BST/GMT
        objective: This test is to confirm that the ExternalInfo/StaffCash API rejects invalid requests and returns correct results across the BST/GMT boundary.
        steps: |-
          **GIVEN** the user is authenticated to the API tool
          **WHEN** the user sends an invalid GET ExternalInfo/StaffCash request, or a request spanning the BST/GMT change
          **THEN** an invalid request is rejected with an error
          **AND** a BST/GMT request returns the correct staff cash data for the period
        expected: Invalid StaffCash requests are rejected; BST/GMT requests return correct data.
