# ABT / Functional / Operator Web Portal — BOS & ABT Suite (30279)
# Consolidated from old suite 14441 (151 cases): the 3 duplicate report campaigns
# (Reports Management + Product Specification Document + Spreadsheet Tests) fold to
# one case per distinct report; paging/scroll/show-more micro-cases fold into their
# parent flow. House style: concise titles, intent Gherkin, defects in Refs.
suite_id: 30279
defaults:
  template_id: 1
  custom_devtypes: [200]
  custom_autoconfirmation: false
  custom_revstatus: 2
sections:
  - path: [ABT, Functional, Operator Web Portal, Sign On & Access]
    cases:
      - title: Operator sign-on and navigation
        objective: This test is to confirm that an operator can sign on to the Operator Web Portal and navigate its menus.
        steps: |-
          **GIVEN** the Operator Web Portal sign-on page is displayed
          **AND** the user account has the required access rights
          **WHEN** the operator signs on with valid credentials
          **THEN** the operator is signed in
          **AND** the portal menus are available
          **AND** each menu option opens its page
        expected: The operator signs on successfully and can navigate the portal menus.
      - title: Access rights differ by user role
        objective: This test is to confirm that the tasks available in the Operator Web Portal depend on the signed-in user's access rights.
        steps: |-
          **GIVEN** users are configured with different access-right profiles
          **WHEN** each user signs on to the Operator Web Portal
          **THEN** each user sees only the tasks permitted by their profile
          **AND** restricted tasks are not available to them
        expected: Each user's available tasks match their configured access rights.
      - title: Operator can log out
        objective: This test is to confirm that an operator can log out of the Operator Web Portal.
        steps: |-
          **GIVEN** an operator is signed into the Operator Web Portal
          **WHEN** the operator logs out
          **THEN** the session ends
          **AND** the sign-on page is shown
        expected: The operator is logged out and returned to the sign-on page.

  - path: [ABT, Functional, Operator Web Portal, Customers]
    cases:
      - title: Search and filter customers
        objective: This test is to confirm that an operator can search and filter customers by account, card and journey/transaction criteria.
        steps: |-
          **GIVEN** an operator is on the Customer Information page
          **WHEN** the operator searches by Unique Account ID, masked PAN, card expiry, or journey/transaction date
          **THEN** the matching customer accounts are listed
          **AND** the results can be paged and filtered by user type
        expected: Customers matching the search and filters are listed, with paging and user-type filtering.
      - title: Select and view a customer account
        objective: This test is to confirm that an operator can select a customer's card account and view its account details.
        steps: |-
          **GIVEN** an operator has located a customer on the Customer Information page
          **WHEN** the operator selects the customer's card account
          **THEN** the account details are displayed
        expected: The selected customer's account details are displayed.
      - title: View and export a customer's Journey History
        objective: This test is to confirm that an operator can view, filter and export a customer's journey history with tap/journey details.
        steps: |-
          **GIVEN** a customer has performed tap journeys on a registered device
          **AND** the operator has selected the customer's card account
          **WHEN** the operator opens Journey History and applies filters
          **THEN** the tap/journey details are displayed
          **AND** paging and show-more detail are available
          **AND** the journey history can be exported
        expected: Journey history displays with filters, paging and detail, and can be exported.
      - title: View and export a customer's Transaction History
        objective: This test is to confirm that an operator can view, filter and export a customer's transaction history.
        steps: |-
          **GIVEN** a customer has performed tap transactions on a registered device
          **AND** the operator has selected the customer's card account
          **WHEN** the operator opens Transaction History and applies filters
          **THEN** the tap/transaction details are displayed with paging
          **AND** the transaction history can be exported
        expected: Transaction history displays with filters and paging, and can be exported.
      - title: Queue a refund from a transaction
        objective: This test is to confirm that an operator can queue a refund request from a transaction, rejecting amounts above the payment value.
        steps: |-
          **GIVEN** the transaction history for a card is displayed
          **AND** the operator has refund privileges
          **WHEN** the operator queues a refund for a transaction
          **THEN** the refund request is queued for authorisation
          **AND** a refund value above the original payment is rejected
        expected: The refund is queued for authorisation; an over-value refund is rejected.
      - title: Aftercare — operator queries and comments
        objective: This test is to confirm that an operator can raise, comment on and cancel aftercare queries on a customer account.
        steps: |-
          **GIVEN** an operator has selected a customer account with aftercare available
          **WHEN** the operator submits, comments on, or cancels an aftercare query
          **THEN** the query, comment or cancellation is recorded against the account
          **AND** the aftercare list can be paged
        expected: Aftercare queries, comments and cancellations are recorded; the list pages correctly.
      - title: Authorisations — approve, decline and reject a refund request
        objective: This test is to confirm that a second-level approver can approve, decline or reject a queued refund request.
        steps: |-
          **GIVEN** a refund request has been queued and requires second-level approval
          **AND** the approver is on the Authorisations page
          **WHEN** the approver approves, declines or rejects the request
          **THEN** the request outcome is applied
          **AND** recorded
          **AND** the Authorisations table reflects the result with paging
        expected: The refund request is approved, declined or rejected and the table updates.
      - title: Authorisations — accept all and reject all
        objective: This test is to confirm that an approver can bulk accept or reject all pending authorisation requests.
        steps: |-
          **GIVEN** the approver is on the Authorisations page with pending requests
          **WHEN** the approver selects Authorise All or Reject All
          **THEN** all pending requests are actioned accordingly
        expected: All pending authorisation requests are accepted or rejected in bulk.

  - path: [ABT, Functional, Operator Web Portal, Customer Services]
    cases:
      - title: View all taps including taps not valid for a journey
        objective: This test is to confirm that an operator can view all of a customer's taps, including invalid ones, over a date range.
        steps: |-
          **GIVEN** a customer has performed valid and invalid taps on a payment card
          **WHEN** the operator views the customer's transaction history for a date range
          **THEN** all taps are shown, including those not valid for a journey
        expected: All taps over the range are shown, including invalid ones.
      - title: Corrupt tap messages are rejected and quarantined
        objective: This test is to confirm that corrupt tap messages are rejected, quarantined and flagged for processing.
        steps: |-
          **GIVEN** a device is registered with CloudFare-ABT
          **WHEN** a corrupt tap message is received from the device
          **THEN** the journey tap service rejects the tap and places it in the quarantine queue
          **AND** it is flagged so it can be processed
        expected: The corrupt tap is rejected, quarantined and flagged for processing.

  - path: [ABT, Functional, Operator Web Portal, Capping Configuration]
    cases:
      - title: Configure a daily capping rule
        objective: This test is to confirm that an administrator can configure a daily capping rule that caps a customer's charges within an operating day.
        steps: |-
          **GIVEN** an operator is signed in and the End of the Operating Day is configured
          **WHEN** the administrator configures a daily capping rule
          **AND** a customer performs transactions within a single operating day
          **THEN** the customer's charges are capped at the configured daily cap
        expected: The daily capping rule caps the customer's charges within the operating day.
      - title: Configure weekly and monthly capping rules
        objective: This test is to confirm that an administrator can configure weekly and monthly capping rules.
        steps: |-
          **GIVEN** an operator is signed in and the operating week is configured
          **WHEN** the administrator configures a weekly or monthly capping rule
          **THEN** the rule is created
          **AND** caps charges over the configured period
        expected: Weekly and monthly capping rules are created and cap charges over their period.
      - title: Configure a transfer capping rule
        objective: This test is to confirm that an administrator can configure transfer capping rules.
        steps: |-
          **GIVEN** an operator is signed in and the Price Capping page Transfer Caps tab is selected
          **WHEN** the administrator configures a transfer cap
          **THEN** the transfer cap is created
          **AND** applied to qualifying transfers
        expected: The transfer capping rule is created and applied to transfers.
      - title: Add, edit and view a price cap
        objective: This test is to confirm that an operator can add, edit and view daily and weekly price caps.
        steps: |-
          **GIVEN** an operator is on the Price Capping page
          **WHEN** the operator adds, edits or views a daily or weekly price cap
          **THEN** the price cap is saved
          **AND** shown with its configured values
        expected: Price caps can be added, edited and viewed with their configured values.
      - title: Deactivate and archive a capping rule
        objective: This test is to confirm that an operator can deactivate an active capping rule and archive an inactive one.
        steps: |-
          **GIVEN** an operator has selected a capping rule on the Price Capping page
          **WHEN** the operator deactivates an active rule or archives an inactive rule
          **THEN** the rule's status is updated accordingly
        expected: The capping rule is deactivated or archived as selected.
      - title: Price Rule information icon
        objective: This test is to confirm that the Price Rule information icon explains the page's behaviour.
        steps: |-
          **GIVEN** an operator is signed in on the Price Rule page
          **WHEN** the operator selects the information icon
          **THEN** the price-rule guidance is displayed
        expected: The Price Rule information icon displays the guidance.
      - title: A capping rule's created date-time is not set an hour in the future
        objective: This test is to confirm that a newly created capping rule records the correct created date-time, not an hour in the future.
        steps: |-
          **GIVEN** an operator is on the Price Capping tab
          **WHEN** the operator creates a capping rule
          **THEN** the rule's created date-time matches the actual creation time
          **AND** it is not recorded an hour in the future
        expected: The capping rule's created date-time is correct, not an hour ahead.
      - title: Add a daily capping group
        objective: This test is to confirm that an operator can add a daily capping group from the Price Rule page.
        steps: |-
          **GIVEN** an operator has navigated to the ABT Price Rule page
          **WHEN** the operator adds a daily capping group
          **THEN** the daily capping group is created
        expected: The daily capping group is created.
      - title: Add a weekly capping group
        objective: This test is to confirm that an operator can add a weekly capping group from the Price Rule page.
        steps: |-
          **GIVEN** an operator has navigated to the ABT Price Rule page
          **WHEN** the operator adds a weekly capping group
          **THEN** the weekly capping group is created
        expected: The weekly capping group is created.

  - path: [ABT, Functional, Operator Web Portal, Administrator Settings]
    cases:
      - title: Configure the End of the Operational Day and Week
        objective: This test is to confirm that an administrator can set the End of the Operational Day and Week that define the capping periods.
        steps: |-
          **GIVEN** an administrator is signed into the Operator Portal
          **WHEN** the administrator sets the End of the Operational Day and the End of the Operational Week
          **THEN** each operational day is a 24-hour period anchored to that time
          **AND** the operational week is anchored to the configured day
        expected: Operational day and week boundaries are set and govern the capping periods.
      - title: Configure the maximum late data period
        objective: This test is to confirm that an administrator can set the maximum late data period used to process late tap data.
        steps: |-
          **GIVEN** an administrator is signed into the Operator Portal
          **WHEN** the administrator sets the maximum late data period
          **THEN** late tap data is processed according to that period
        expected: Late tap data is processed within the configured maximum late data period.
      - title: Configure the maximum journey duration
        objective: This test is to confirm that an administrator can set the maximum journey duration used to determine an incomplete journey.
        steps: |-
          **GIVEN** an administrator wants to configure the maximum journey duration
          **WHEN** the administrator sets the maximum journey duration
          **THEN** the duration is used to determine when a journey is treated as incomplete
        expected: The maximum journey duration governs incomplete-journey handling.
      - title: Configure debt-recovery retry attempts and message
        objective: This test is to confirm that an administrator can set the online and tap-initiated debt-recovery retry attempts and the unsuccessful-recovery message.
        steps: |-
          **GIVEN** an administrator is signed into the Operator Portal
          **AND** a customer's card is on the deny list
          **WHEN** the administrator sets the max online and tap-initiated retry attempts and the unsuccessful-recovery message
          **THEN** the customer is limited to that number of retries
          **AND** the configured message is shown on an unsuccessful recovery
        expected: Debt-recovery retry limits and the unsuccessful-recovery message are applied.
      - title: Configure a minimum fare for an e-Purse smartcard
        objective: This test is to confirm that an administrator can configure a minimum fare for a customer e-Purse smartcard.
        steps: |-
          **GIVEN** an administrator has rights to configure a minimum e-Purse fare
          **AND** the Admin tab is displayed on the Operator Portal
          **WHEN** the administrator sets a minimum fare for an e-Purse smartcard
          **THEN** the minimum fare is saved
          **AND** applied to e-Purse validation
        expected: The minimum e-Purse fare is saved and applied.

