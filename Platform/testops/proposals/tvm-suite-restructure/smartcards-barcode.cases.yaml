# TVM — Smartcards & ABT + Barcode Redemption (single-use) — new suite 30284
# Consolidated from old TVM suites (read-only source: 6160, Kiosk-Rail 22272, Kiosk-Bus 22273,
# Astreo-Glider 22278). Behaviour is authored ONCE: model (Kiosk / Astreo) and operating mode
# (NIR-Rail / Ulsterbus / Metro / Glider) are handled by TestRail Run Configurations, NOT by
# duplicate cases — the two models share these areas per cross-tab.md. NIR-Rail-only products
# (Cross Border, iLink, NIR barcode) simply land on the Kiosk configuration.
# Passenger types / products / payment methods / barcode types are folded into "Data variations:"
# lines, not multiplied into extra cases (Gherkin-standard Scenario-Outline principle).
#
# Grounded in knowledge/translink/specs: barcode = FBD-100167 / FBD-100317 / FBD-100483 / FBD-100318
# (TVM validates SINGLE-USE only — Collect Ticket Code / Booking Reference; NOT multiple-use);
# smartcards = FBD-100236 (DESFire ABT), FBD-100250 (pre-printed Mifare), FBD-100271 (transfer),
# FBD-100277 (card reference file), FBD-100261 / FBD-100293 / FBD-100260 (product config / groups /
# names), FBD-100658 (ABT audit).
#
# FLAG for George: Kiosk-Rail suite 22272 carries a "Multi-Use Barcodes" section
# (cases 3544955-3544968, "... Multi use Barcode") that CONTRADICTS FBD-100167 §"Scope" and
# FBD-100317 §"Device x barcode matrix" — both state the TVM validates SINGLE-USE only and rejects
# multiple-use ("This Barcode Type is not accepted on this device"). Those old cases are NOT carried
# over here; mark 22272 "Multi-Use Barcodes" for ZZ_DELETE / verify. See case
# "Single-Use only — a multiple-use barcode is rejected" below, which asserts the spec position.
suite_id: 30284
defaults:
  template_id: 1
  custom_devtypes: [1]          # TVM
  custom_autoconfirmation: false
  custom_revstatus: 2
sections:
  - path: [Functional, Smartcards & ABT]
    cases:
      - title: Buy a Smartcard — issuing a new journey-based card writes the product and prints a receipt
        refs: [FBD-100261, FBD-100250]
        objective: This test is to confirm a customer can buy and load a new journey-based smartcard on the TVM.
        steps: |-
          **GIVEN** a customer is at the TVM sales home screen
          **AND** a blank pre-encoded Smartlink card, buying a Metro City Multi-Journey product of 10 journeys (£20.00) per FBD-100261
          **WHEN** the customer selects the Multi-Journey product, the City zone and 10 journeys and pays
          **AND** presents the blank card when prompted
          **THEN** the 10-journey product is written to the card
          **AND** a smartcard issue receipt is printed
          **Data variations:** Metro Inner / City / Extended and Ulsterbus Multi-Journey; 5 / 10 / 20 / 40 journeys.
        expected: A new Multi-Journey smartcard is issued, the product is written to the card, and an issue receipt prints.
      - title: Smartcard Top-up — adding journeys to a Multi-Journey card updates the balance and prints a receipt
        refs: [FBD-100261, FBD-100260]
        objective: This test is to confirm a customer can top up an existing Multi-Journey smartcard with additional journeys.
        steps: |-
          **GIVEN** a customer is at the TVM sales home screen
          **AND** an existing Metro City Multi-Journey card with 2 journeys remaining, topping up 10 journeys (£20.00)
          **WHEN** the customer presents the card, selects a 10-journey top-up and pays
          **THEN** the card balance increases to 12 journeys
          **AND** a top-up receipt is printed showing the new balance
          **Data variations:** Multi-Journey (Metro / Ulsterbus); payment cash / debit / credit / contactless.
        expected: The Multi-Journey card is topped up, its balance increases by the purchased journeys, and a top-up receipt prints.
      - title: Smartcard Top-up — a Travelcard or Period Pass top-up adds a period and prints a receipt
        refs: [FBD-100277, FBD-100260]
        objective: This test is to confirm a customer can top up a period-based travelcard smartcard on the TVM.
        steps: |-
          **GIVEN** a customer is at the TVM sales home screen
          **AND** an existing Adult iLink Zone 4 card with 0 days remaining, topping up a 1 Week period
          **WHEN** the customer presents the card, selects the 1 Week top-up and pays
          **THEN** the period is added to the card
          **AND** the new expiry date is shown
          **AND** a period-pass top-up receipt is printed
          **Data variations:** iLink (Zones 1-4, NW) / Metro Travelcard / DayLink / Belfast Visitor Pass; 1 Week / 1 Month.
        expected: The travelcard is topped up with the selected period, the expiry updates, and a top-up receipt prints.
      - title: Smartcard Top-up — top-up amount labels come from the recharge product Display Descriptions
        refs: [FBD-100260]
        objective: This test is to confirm the top-up amount buttons are labelled from each SmartRecharge product's Display Description.
        steps: |-
          **GIVEN** a customer has presented a Multi-Journey smartcard to the TVM
          **AND** SmartRecharge products configured with Device Display Descriptions "5 Journeys" and "10 Journeys" per FBD-100260
          **WHEN** the customer views the top-up amount selection screen
          **THEN** the amount buttons read "5 Journeys" and "10 Journeys"
          **AND** the screen title reads the SmartUse product Display Description
        expected: Top-up amount labels are taken from the SmartRecharge Display Descriptions and the title from the SmartUse product.
      - title: Smartcard Details — presenting a card displays its details screen
        refs: [FBD-100277]
        objective: This test is to confirm the TVM reads a presented smartcard and displays its details.
        steps: |-
          **GIVEN** a customer is at the TVM sales home screen
          **AND** an Adult Metro City Multi-Journey card with 6 journeys remaining
          **WHEN** the customer presents the card and selects to view its details
          **THEN** the Smartcard Details screen displays the product name
          **AND** the screen displays the remaining balance
        expected: The TVM reads the card and shows its product and remaining balance on the Smartcard Details screen.
      - title: Mini Statement — a mini-statement prints the card balance after a top-up
        refs: [FBD-100260]
        objective: This test is to confirm the customer can print a mini-statement showing the smartcard balance.
        steps: |-
          **GIVEN** a customer has just completed a Multi-Journey top-up on the TVM
          **AND** the topped-up Adult Metro City Multi-Journey card now holds 12 journeys
          **WHEN** the customer selects Print Mini-Statement
          **THEN** a mini-statement receipt is printed
          **AND** the receipt lists the current balance of 12 journeys
          **Data variations:** after a top-up / after a validation; Multi-Journey / Period Pass / DayLink cards.
        expected: A mini-statement prints listing the current smartcard balance after the top-up.
      - title: Concession — a yLink smartcard prices a ticket at the yLink concessionary fare
        refs: [FBD-100260, FBD-100293]
        objective: This test is to confirm presenting a yLink smartcard applies the yLink concessionary fare to a ticket purchase.
        steps: |-
          **GIVEN** a customer is at the TVM sales home screen
          **AND** a valid yLink concession smartcard, buying a Metro yLink Single
          **WHEN** the customer presents the yLink card and selects a Metro Single and pays
          **THEN** the ticket is priced at the yLink concessionary fare
          **AND** a yLink single ticket is printed
        expected: The yLink smartcard applies the concessionary fare and a yLink single ticket prints.
      - title: Concession — a 24+ smartcard prices a ticket at the 24+ discounted fare
        refs: [FBD-100236, FBD-100260]
        objective: This test is to confirm presenting a 24+ smartcard applies the 24+ discounted fare.
        steps: |-
          **GIVEN** a customer is at the TVM sales home screen
          **AND** a valid personalised 24+ smartcard, buying a Metro Single
          **WHEN** the customer presents the 24+ card and selects a Metro Single and pays
          **THEN** the ticket is priced at the 24+ discounted fare
          **AND** a 24+ single ticket is printed
        expected: The 24+ smartcard applies the discounted fare and a 24+ single ticket prints.
      - title: Concession — a half-fare Smartpass prices a single at half fare
        refs: [FBD-100250]
        objective: This test is to confirm a half-fare Smartpass reduces a single ticket to the half-fare price.
        steps: |-
          **GIVEN** a customer is at the TVM sales home screen
          **AND** a valid Half-Fare Smartpass, buying an Ulsterbus single
          **WHEN** the customer presents the Smartpass and selects an Ulsterbus single and pays
          **THEN** the single is priced at half the adult fare
          **AND** a half-fare concession ticket is printed
        expected: The half-fare Smartpass halves the single fare and a half-fare concession ticket prints.
      - title: Concession — a free-concession Smartpass issues a free pass ticket
        refs: [FBD-100250]
        objective: This test is to confirm a Fare Foregone Smartpass issues a free concession ticket at zero fare.
        steps: |-
          **GIVEN** a customer is at the TVM sales home screen
          **AND** a valid Senior (Fare Foregone) Smartpass, requesting a concession single
          **WHEN** the customer presents the Smartpass and requests a single
          **THEN** a free concession pass ticket is printed at zero fare
          **AND** no payment is requested
          **Data variations:** Senior / War Pensioner / Blind / ROI Senior / 60+ Fare Foregone passes.
        expected: The Fare Foregone Smartpass issues a free concession ticket with no payment taken.
      - title: Concession — funded-disability Smartpasses are accepted for concessionary travel
        refs: [FBD-100250]
        objective: This test is to confirm the funded-disability Smartpass variants are accepted for concessionary fares.
        steps: |-
          **GIVEN** a customer is at the TVM sales home screen
          **AND** a valid Disability Living Allowance Smartpass, requesting a concession single
          **WHEN** the customer presents the Smartpass and requests a single
          **THEN** the concessionary fare is applied
          **AND** a concession ticket is printed
          **Data variations:** DLA / Learning Disability / No Driving Licence / Partially Sighted / PIPS Smartpasses.
        expected: Each funded-disability Smartpass variant is accepted and a concession ticket prints.
      - title: Staff Pass — a staff smartcard issues a staff free-travel ticket
        refs: [FBD-100250]
        objective: This test is to confirm a staff smartcard issues a staff free-travel ticket.
        steps: |-
          **GIVEN** a customer is at the TVM sales home screen
          **AND** a valid Staff Pass smartcard, requesting a free-travel ticket
          **WHEN** the customer presents the Staff Pass and requests a ticket
          **THEN** a staff free-travel ticket is printed
          **AND** no payment is requested
          **Data variations:** Staff / Staff Spouse / Retired Staff / External Staff passes.
        expected: The staff smartcard issues a free-travel ticket with no payment taken.
      - title: Invalid Smartcard — a faulty or unreadable card is rejected
        refs: [FBD-100250]
        objective: This test is to confirm the TVM rejects a faulty or unreadable smartcard with an error.
        steps: |-
          **GIVEN** a customer is at the TVM sales home screen
          **AND** a faulty smartcard whose LRC/CRC checksum fails to recompute
          **WHEN** the customer presents the faulty card
          **THEN** a card error message is displayed
          **AND** no product is written to the card
        expected: A faulty smartcard is rejected with a card error and nothing is written to it.
      - title: Invalid Smartcard — an expired card cannot be topped up
        refs: [FBD-100250]
        objective: This test is to confirm an expired smartcard cannot be topped up on the TVM.
        steps: |-
          **GIVEN** a customer is at the TVM sales home screen
          **AND** a Multi-Journey card whose expiry date has passed
          **WHEN** the customer presents the expired card for a top-up
          **THEN** an expired-card message is displayed
          **AND** the top-up is not offered
        expected: An expired smartcard is rejected for top-up with an expired-card message.
      - title: Invalid Smartcard — presenting two cards simultaneously is rejected
        refs: [FBD-100250]
        objective: This test is to confirm the TVM rejects two smartcards presented at the same time.
        steps: |-
          **GIVEN** a customer is at the TVM sales home screen
          **AND** two smartcards held together over the reader
          **WHEN** the customer presents both cards simultaneously
          **THEN** a message asking for a single card is displayed
          **AND** neither card is read for a transaction
        expected: Two cards presented together are rejected with a single-card prompt and neither is processed.
      - title: Invalid Smartcard — re-presenting a card within the passback period is rejected
        refs: [FBD-100250]
        objective: This test is to confirm a card re-presented inside its passback period is rejected.
        steps: |-
          **GIVEN** a customer has just used a concession smartcard at the TVM
          **AND** a 24+ smartcard re-presented before its passback window expires
          **WHEN** the customer re-presents the card inside the passback period
          **THEN** a passback message is displayed
          **AND** no second transaction is allowed
          **Data variations:** within passback rejected / outside passback accepted.
        expected: A card re-presented inside its passback window is rejected; outside the window it is accepted.
      - title: Smartcard Top-up — presenting a different card mid top-up aborts the top-up
        refs: [FBD-100250]
        objective: This test is to confirm swapping to a different card during a top-up aborts the transaction.
        steps: |-
          **GIVEN** a customer has started a Multi-Journey top-up with one card presented
          **AND** a different smartcard is offered before the top-up completes
          **WHEN** the customer presents the different card during the top-up
          **THEN** an error message is displayed
          **AND** the top-up is not written to either card
        expected: Presenting a different card mid top-up aborts the transaction and nothing is written.
      - title: Smartcard removed early — removing the card during payment cancels the transaction
        refs: [FBD-100250]
        objective: This test is to confirm removing the smartcard during payment cancels the top-up.
        steps: |-
          **GIVEN** a customer is paying for a Multi-Journey top-up with the card presented
          **AND** the card is removed from the reader before payment completes
          **WHEN** the customer removes the card during the payment process
          **THEN** the transaction is cancelled
          **AND** no value is written to the card
          **Data variations:** journey top-up / free journey transaction.
        expected: Removing the card during payment cancels the transaction and no value is written.
      - title: ABT — issuing an ABT smartcard registers a personalised card
        refs: [FBD-100236]
        objective: This test is to confirm the TVM issues a personalised ABT smartcard and registers it.
        steps: |-
          **GIVEN** a customer is at the TVM sales home screen
          **AND** a blank DESFire ABT card being issued as a personalised 24+ card with passenger name and email per FBD-100236
          **WHEN** the customer completes the ABT card issue with name and email
          **THEN** the ABT Data and SigFile are written to the card
          **AND** a registration record is sent to the ABT back office
          **Data variations:** 24+ (personalised) / yLink (personalised) / Child (registered only).
        expected: A personalised ABT card is issued, its ABT data is written, and a registration record is sent to the back office.
      - title: ABT — a card with the ABT application but no ABT Tracking application is rejected
        refs: [FBD-100236]
        objective: This test is to confirm the TVM rejects an ABT card missing the ABT Tracking application.
        steps: |-
          **GIVEN** a customer is at the TVM sales home screen
          **AND** a DESFire card carrying the ABT application (AID 0x414254) but missing the ABT Tracking application (AID 0x54524B)
          **WHEN** the customer presents the card
          **THEN** the card is rejected
          **AND** no ABT transaction is performed
        expected: An ABT card without the required ABT Tracking application is rejected and no transaction runs.
      - title: ABT — an ABT product top-up posts a transaction to the back office
        # NOTE: FBD-100658 tap-audit (paymentType=ABT, revenue=0) is a VALIDATOR behaviour
        # (Metro/Ulsterbus ETM, Glider PV/HHD, NIR GV/PV/HHD) — the TVM does not tap. On the TVM the
        # ABT audit surface is the issue/top-up SALE transaction. Verify TVM ABT-audit scope with George.
        refs: [FBD-100260, FBD-100236]
        objective: This test is to confirm an ABT product top-up on the TVM posts a transaction to the back office.
        steps: |-
          **GIVEN** a customer holds a valid personalised 24+ ABT card
          **AND** the customer tops up an ABT product and pays by card
          **WHEN** the top-up completes and is sent to CloudFare
          **THEN** a transaction is posted against the ABT product
          **AND** the ABT card balance reflects the top-up
        expected: An ABT top-up posts a transaction to CloudFare against the ABT product and the card balance updates.
  - path: [Functional, Barcode Redemption]
    cases:
      - title: Ticket Collection — a valid booking reference collects and prints the pre-paid ticket
        refs: [FBD-100483, FBD-100317]
        objective: This test is to confirm a customer can collect a pre-paid single-use ticket on the TVM using a booking reference.
        steps: |-
          **GIVEN** a customer is at the TVM Collect Tickets screen
          **AND** a valid Type B single-use booking reference for a Rail Adult Single per FBD-100483
          **WHEN** the customer keys the booking reference and confirms collection
          **THEN** the pre-paid ticket is printed
          **AND** the "Take Your Tickets" prompt is displayed
          **Data variations:** barcode Type B / D / E / H / S / U; Adult Single / yLink Single / 1 Month Return / 3 Day Select; Rail / Metro / Glider / Ulsterbus.
        expected: A valid booking reference collects the pre-paid single-use ticket, prints it, and prompts the customer to take it.
      - title: Ticket Collection — the booking reference is validated against the back office
        refs: [FBD-100483]
        objective: This test is to confirm the TVM validates the booking reference fields against the back office before printing.
        steps: |-
          **GIVEN** a customer is at the TVM Collect Tickets screen
          **AND** a valid Type B booking reference whose ProductId, StartPointId and EndPointId exist in CloudFare
          **WHEN** the customer submits the booking reference
          **THEN** the ProductId, StartPointId and EndPointId are validated against CloudFare across all products and stages
          **AND** the RouteId is not used for validation
        expected: The TVM validates ProductId, StartPointId and EndPointId against the back office and does not validate RouteId.
      - title: Ticket Collection — a successful redemption emits a Barcode Redemption event
        refs: [FBD-100483]
        objective: This test is to confirm a successful online collection emits the Barcode Redemption audit event.
        steps: |-
          **GIVEN** a customer is at the TVM Collect Tickets screen with a live connection to the back office
          **AND** a valid Type E booking reference for a Rail Adult Single
          **WHEN** the customer completes the collection and the ticket prints
          **THEN** the redemption is recorded against the back office
          **AND** event 1412 "Barcode Redemption" is emitted to CloudFare
        expected: A successful online collection records the redemption and emits event 1412 "Barcode Redemption".
      - title: Ticket Collection — an offline redemption still prints and queues an offline event
        refs: [FBD-100483]
        objective: This test is to confirm an offline collection still prints the ticket and queues an offline redemption event.
        steps: |-
          **GIVEN** a customer is at the TVM Collect Tickets screen with the redeem call timing out
          **AND** a valid Type B booking reference below the barcode ceiling limit
          **WHEN** the customer completes the collection while the redeem call fails
          **THEN** the ticket is still printed
          **AND** event 1417 "Offline Collect Tickets Redemption" is queued
        expected: With redeem offline the ticket still prints and an offline collect-tickets redemption event (1417) is queued.
      - title: Ticket Collection — a redemption above the barcode ceiling limit cannot validate offline
        refs: [FBD-100483, FBD-100317]
        objective: This test is to confirm a collection whose value exceeds the offline ceiling limit is not validated offline.
        steps: |-
          **GIVEN** a customer is at the TVM Collect Tickets screen with no back-office connection
          **AND** a booking reference whose ticket value exceeds the configured barcode ceiling limit
          **WHEN** the customer submits the booking reference
          **THEN** the collection is refused offline
          **AND** a value-exceeds-offline-limit message is displayed
          **Data variations:** value below limit validated offline / value above limit refused.
        expected: A collection above the offline ceiling limit is refused offline with a value-exceeds-limit message.
      - title: Booking Reference — an invalid booking reference is rejected
        refs: [FBD-100483]
        objective: This test is to confirm an invalid booking reference is rejected with the standard message.
        steps: |-
          **GIVEN** a customer is at the TVM Collect Tickets screen
          **AND** a booking reference whose station does not match the product per FBD-100483
          **WHEN** the customer submits the booking reference
          **THEN** the message "Booking reference entered is invalid" is displayed
          **AND** a logfailure message is posted to the back office
          **Data variations:** invalid To Station / invalid From Station / invalid Product Type / invalid dates.
        expected: An invalid booking reference is rejected with "Booking reference entered is invalid" and a logfailure is posted.
      - title: Booking Reference — a malformed reference entry is rejected before submission
        refs: [FBD-100483]
        objective: This test is to confirm the TVM rejects a malformed booking-reference entry.
        steps: |-
          **GIVEN** a customer is at the TVM Collect Tickets entry screen
          **AND** an incomplete booking reference shorter than the required length
          **WHEN** the customer attempts to submit the incomplete reference
          **THEN** the entry is not accepted
          **AND** the customer is prompted to correct the reference
          **Data variations:** no characters / incomplete entry / over-maximum length / invalid character.
        expected: A malformed booking-reference entry is not accepted and the customer is prompted to correct it.
      - title: Ticket Collection — a collection against a legacy stage resolves the legacy stage name
        refs: [FBD-100483]
        objective: This test is to confirm a booking reference using a legacy stage resolves it via the legacy stages file.
        steps: |-
          **GIVEN** a customer is at the TVM Collect Tickets screen
          **AND** a Type B booking reference whose alighting point is the legacy stage "Any NIR Station"
          **WHEN** the customer submits the booking reference
          **THEN** the legacy stage is resolved to its stage name from the legacy stages file
          **AND** the ticket is printed for that legacy stage
          **Data variations:** Type B / E / U legacy-stage references.
        expected: A legacy-stage booking reference resolves the stage name from the legacy stages file and the ticket prints.
      - title: Single-Use only — a multiple-use barcode is rejected
        # This case encodes the FBD-100167/FBD-100317 spec position that the TVM validates SINGLE-USE
        # barcodes ONLY. It is the counter-assertion to the Kiosk-Rail 22272 "Multi-Use Barcodes"
        # section, which is flagged for ZZ_DELETE / verify (see file header).
        refs: [FBD-100167, FBD-100317]
        objective: This test is to confirm the TVM rejects a multiple-use barcode, which it does not validate.
        steps: |-
          **GIVEN** a customer is at the TVM Collect Tickets screen
          **AND** a multiple-use (mLink/Flowbird) barcode that the TVM does not support per FBD-100167
          **WHEN** the multiple-use barcode is presented
          **THEN** the message "This Barcode Type is not accepted on this device" is displayed
          **AND** no redemption is performed
        expected: The TVM rejects a multiple-use barcode with "This Barcode Type is not accepted on this device" and does not redeem.
      - title: Single-Use only — collection accepts a booking reference and not a scanned barcode
        refs: [FBD-100317, FBD-100483]
        objective: This test is to confirm the TVM collects single-use tickets by booking reference entry, not by scanning a barcode or BRID.
        steps: |-
          **GIVEN** a customer is at the TVM Collect Tickets screen
          **AND** a manifest Collect Ticket Code that is only enterable as a booking reference
          **WHEN** the customer looks for how to redeem the ticket
          **THEN** the TVM offers booking-reference entry only
          **AND** no barcode or BRID scan input is offered
        expected: The TVM offers booking-reference entry only for single-use collection, with no barcode or BRID scan.
      - title: Ticket Collection — a business error shows an error screen and returns to Home after the timeout
        refs: [FBD-100483]
        objective: This test is to confirm a back-office business error is shown and the TVM returns to Home after the timeout.
        steps: |-
          **GIVEN** a customer is at the TVM Collect Tickets screen
          **AND** a booking reference that the back office answers with a 400-family business error
          **WHEN** the customer submits the booking reference
          **THEN** the corresponding error screen is displayed
          **AND** the TVM returns to Home after the 3-second timeout
        expected: A 400-family business error shows the error screen and the TVM returns to Home after the 3-second timeout.
      - title: Ticket Collection — repeated server errors retry and then fall back
        refs: [FBD-100483]
        objective: This test is to confirm repeated back-office server errors are retried before falling back.
        steps: |-
          **GIVEN** a customer is at the TVM Collect Tickets screen
          **AND** a booking reference for which the back office returns 500-family errors
          **WHEN** the customer submits the booking reference
          **THEN** the TVM retries after 3 seconds up to 3 attempts within 30 seconds
          **AND** it falls back to offline handling once the retries are exhausted
        expected: Repeated 500 errors are retried (3s, max 3 attempts / 30s) and then fall back to offline handling.
      - title: Ticket Collection — an already-redeemed booking reference is rejected as used
        refs: [FBD-100483]
        objective: This test is to confirm a booking reference that has already been redeemed is rejected.
        steps: |-
          **GIVEN** a customer is at the TVM Collect Tickets screen
          **AND** a booking reference that has already been redeemed and locally recorded
          **WHEN** the customer submits the already-used booking reference
          **THEN** the message "The ticket has already been used" is displayed
          **AND** no second ticket is printed
        expected: An already-redeemed booking reference is rejected with "The ticket has already been used" and prints nothing.
      - title: Barcode Ticket Format — a collected ticket prints in the barcode ticket layout
        refs: [FBD-100167, FBD-100318]
        objective: This test is to confirm a collected single-use ticket prints in the correct barcode ticket layout.
        steps: |-
          **GIVEN** a customer has collected a valid single-use ticket on the TVM
          **AND** a Rail Adult Single collected via a Type B booking reference
          **WHEN** the ticket is printed
          **THEN** the ticket prints in the barcode redemption layout
          **AND** the printed fields match the collected product
          **Data variations:** Single / Day Return / 3 Day Select / Cross Border / Half-fare / yLink / 24+ / Family layouts.
        expected: The collected ticket prints in the barcode redemption layout with fields matching the collected product.
