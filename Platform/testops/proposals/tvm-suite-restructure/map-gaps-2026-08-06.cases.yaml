suite_id: 30284
defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [6]
  custom_autoconfirmation: false

sections:
  - path: [Functional, Smartcards & ABT]
    cases:
      - title: "Smartcards — Home Screen navigates to the Smartcards screen"
        refs: MODE-ALL
        objective: |
          This test is to confirm the Home Screen navigates to the Smartcards screen.
        steps: |
          **GIVEN** the TVM is showing the Home Screen
          **WHEN** the customer presses the Smartcard button or presents a smartcard
          **THEN** the Smartcards screen is displayed
        expected: "Pressing the Smartcard button or presenting a smartcard from the Home Screen displays the Smartcards screen."

      - title: "Smartcards — Multi Modal Home Screen navigates to the Smartcards screen"
        refs: MODE-ALL
        objective: |
          This test is to confirm the Multi Modal Home Screen navigates to the Smartcards screen.
        steps: |
          **GIVEN** the TVM is showing the Multi Modal Home Screen
          **WHEN** the customer presses the Smartcard button or presents a smartcard
          **THEN** the Smartcards screen is displayed
        expected: "Pressing the Smartcard button or presenting a smartcard from the Multi Modal Home Screen displays the Smartcards screen."

  - path: [Functional, Sales - Tickets, Ticket Collection]
    cases:
      - title: "Ticket Collection — Multi Modal Home Screen reaches Ticket Printing via Collect Tickets by Reference"
        refs: MODE-ALL
        objective: |
          This test is to confirm the Multi Modal Home Screen can reach Ticket Printing through the
          ticket collection flow.
        steps: |
          **GIVEN** the TVM is showing the Multi Modal Home Screen
          **WHEN** the customer presses 'Collect Tickets' and identifies and confirms the tickets to
          collect
          **THEN** the Ticket Printing screen is displayed
        expected: "Collecting tickets by reference from the Multi Modal Home Screen reaches the Ticket Printing screen."

  - path: [Functional, Sales - Tickets, Ticket Issue]
    cases:
      - title: "Buy Tickets — Destination and Buy Tickets link to each other and to Choose Ticket Details"
        refs: MODE-ALL
        objective: |
          This test is to confirm Destination and Buy Tickets link directly to each other and each
          links directly to Choose Ticket Details.
        steps: |
          **GIVEN** the TVM is showing the Destination screen
          **WHEN** the customer navigates from Destination to Buy Tickets, then back to Destination
          **THEN** the Buy Tickets screen is displayed
          **AND** the Destination screen is displayed again
          **AND** Choose Ticket Details is displayed directly from either screen
        expected: "Destination and Buy Tickets navigate directly to each other and each reaches Choose Ticket Details without a fixed order."
