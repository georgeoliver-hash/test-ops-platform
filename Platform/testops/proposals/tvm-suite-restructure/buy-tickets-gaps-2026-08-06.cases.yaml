suite_id: 30284
defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [6]
  custom_autoconfirmation: false

sections:
  - path: [Functional, Sales - Tickets, Advance & 3-Day]
    cases:
      - title: "Three-Day Travel — changing the start date clears the selected day"
        refs: MODE-ALL
        objective: |
          This test is to confirm using 'Change start date' from the Three-Day Travel 1st
          selected screen returns to the Start Date screen with no date selected.
        steps: |
          **GIVEN** the Three-Day Travel - 1st selected screen is displayed with a start date chosen
          **WHEN** the customer selects 'Change start date'
          **THEN** the Three-Day Travel - Start Date screen is displayed
          **AND** no date is selected
        expected: "Choosing 'Change start date' returns to the Start Date screen with the previous selection cleared."
