# TVM — Buy ABT Card flow-map gap authoring (2026-08-06)
# Source: knowledge/flows/translink-tvm-buy-abt-card.md (Paths table, rows 1-2, both "MISSING").
# Both rows are the same 6-screen/2-decision board: Buy ABT card -> Select Payment Type -> Payment
# Process -> Printing unique code receipt -> Issuing card -> (Take card and receipt(s) | Card Jammed)
# -> Home Screen. No Metro/Ulsterbus/Rail branching on this board (per the flow-map's own Notes), so
# both cases are MODE-ALL.
suite_id: 30284
defaults:
  template_id: 1
  custom_devtypes: [1]           # TVM
  custom_autoconfirmation: false
  custom_revstatus: 2

sections:
  - path: [Functional, Smartcards & ABT]
    cases:
      # Row 1: Buy ABT card -> ... -> Take card and receipt(s) -> Home Screen
      - title: "Smartcards & ABT — buying an ABT card issues the card and receipts"
        refs: MODE-ALL
        objective: |
          This test is to confirm buying an ABT card at the TVM prints the unique code receipt,
          issues the card, and returns to the Home Screen once the customer takes the card and
          receipt(s).
        steps: |
          **GIVEN** a TVM showing the Buy ABT card screen with its pre-configured Top-Up amounts
          **WHEN** the customer selects a Top-Up amount, selects a payment type, and completes payment
          **THEN** the unique code receipt is printed
          **AND** the ABT card is issued
          **WHEN** the customer takes the card and receipt(s)
          **THEN** the TVM returns to the Home Screen
        expected: "Buying an ABT card prints the unique code receipt, issues the card, and the TVM returns to the Home Screen once the customer takes the card and receipt(s)."

      # Row 2: Buy ABT card -> ... -> Issuing card -> Card Jammed -> Home Screen
      - title: "Smartcards & ABT — a card jam during ABT card issuing returns to Home Screen"
        refs: MODE-ALL
        objective: |
          This test is to confirm a card jam while issuing an ABT card displays the jam message and
          returns the TVM to the Home Screen.
        steps: |
          **GIVEN** a TVM showing the Buy ABT card screen with its pre-configured Top-Up amounts
          **WHEN** the customer selects a Top-Up amount, selects a payment type, and completes payment
          **THEN** the unique code receipt is printed
          **WHEN** the card jams during issuing
          **THEN** the "Card Jammed" message is displayed
          **AND** the TVM returns to the Home Screen
        expected: "A card jam during ABT card issuing displays the Card Jammed message and the TVM returns to the Home Screen."
