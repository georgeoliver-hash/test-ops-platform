# TVM Smoke — Smoke (suite 30284)
# Thin critical-path smoke set for the **NEW** TVM Test Suite. Authored ONCE and run against
# every Model{Kiosk·Astreo} × Mode{NIR-Rail·Ulsterbus·Metro·Glider} Run Configuration — so every
# case reads model-agnostically ("a TVM (Kiosk or Astreo)") and uses only shared-mode products
# (Metro/Glider), never Kiosk-only Rail. Path: power-on → wake → sell (cash + card) → collect/print
# → EMS reachable → comms up. Grounding: TVM Sanity section of R2 6160 (C1831788/C1898219/C1831643/
# C1898221/C1898222), 5602 acceptance cases, FBD-100266 (heartbeat), FBD-100320/100353 (TID/EMV),
# FBD-100341 (revenue apportionment). Concrete example in each GIVEN. Read-only / propose-first:
# NOT pushed, NOT edited into any existing case.
suite_id: 30284
defaults:
  template_id: 1
  custom_devtypes: [1]            # TVM
  custom_autoconfirmation: false
  custom_revstatus: 2
sections:
  - path: [Smoke]
    cases:
      - title: Power-On — a cold boot reaches the Sales home screen
        refs: [C1831643, REQ-0326]
        objective: This test is to confirm a TVM powers on from cold to the customer Sales home screen.
        steps: |-
          **GIVEN** a commissioned TVM (Kiosk or Astreo) is powered off with its current configuration deployed
          **AND** an example device such as a Metro-mode Kiosk with the Sales app installed
          **WHEN** the TVM is powered on and completes its boot sequence
          **THEN** the customer Sales home screen is displayed
          **AND** the mode-of-transport selection is available on the home screen
        expected: From a cold power-on the TVM boots through to the Sales home screen with mode-of-transport selection available.
      - title: Screensaver Wake — touching the idle screen returns to the Sales home screen
        refs: [C1705882, REQ-0270, REQ-0277]
        objective: This test is to confirm a TVM in screensaver wakes to the Sales home screen when the screen is touched.
        steps: |-
          **GIVEN** a TVM (Kiosk or Astreo) is showing the screensaver after being left idle
          **AND** an example idle Metro-mode TVM displaying the multi-modal screensaver
          **WHEN** a customer touches the screen
          **THEN** the screensaver is dismissed
          **AND** the Sales home screen is displayed
        expected: Touching the idle screensaver wakes the TVM to the Sales home screen, ready for a sale.
      - title: Ticket Sale — a basic single ticket is issued and printed when paid by cash
        refs: [C1831788, C1705885, REQ-0782, REQ-1877]
        objective: This test is to confirm a customer can buy and collect a basic single ticket paying with cash.
        steps: |-
          **GIVEN** a TVM (Kiosk or Astreo) is at the Sales home screen with ticket paper loaded and coin change available
          **AND** an example product of a Metro Single Adult ticket (fare per the current fares export — needs confirming)
          **WHEN** the customer selects the Metro Single Adult ticket and inserts cash to cover the fare
          **AND** confirms the purchase
          **THEN** the ticket is printed and presented at the ticket chute
          **AND** any change due is returned
          **AND** the sale is recorded to CloudFare
        expected: A cash-paid single ticket is printed and presented, change due is returned, and the sale is audited to CloudFare.
      - title: Ticket Sale — a basic single ticket is issued and printed when paid by contactless card
        refs: [C1705893, FBD-100320, FBD-100353, REQ-0095, REQ-0097]
        objective: This test is to confirm a customer can buy and collect a basic single ticket paying by contactless card.
        steps: |-
          **GIVEN** a TVM (Kiosk or Astreo) is at the Sales home screen with a live connection to the payment provider
          **AND** an example product of a Metro Single Adult ticket paid by a contactless Mastercard
          **WHEN** the customer selects the ticket
          **AND** presents the contactless card to the reader
          **THEN** the payment is authorised by the payment provider
          **AND** the ticket is printed and presented at the ticket chute
          **AND** the sale is recorded to CloudFare
        expected: A contactless-paid single ticket is authorised by the provider, printed and presented, and the sale is audited to CloudFare.
      - title: Ticket Collection — a pre-paid ticket is collected and printed
        refs: [C1898219, REQ-1576]
        objective: This test is to confirm a customer can collect a pre-paid ticket and receive a printed ticket.
        steps: |-
          **GIVEN** a TVM (Kiosk or Astreo) is at the Sales home screen with ticket paper loaded
          **AND** an example pre-paid order identified by a valid collection barcode or booking code
          **WHEN** the customer selects Collect
          **AND** presents the collection reference
          **THEN** the pre-paid ticket is printed and presented at the ticket chute
          **AND** a confirmation of collection is displayed
        expected: A pre-paid ticket is collected against its reference, printed and presented, with an on-screen collection confirmation.
      - title: EMS Access — an engineer opens the EMS/TMS screen and returns to Sales
        refs: [C1898221]
        objective: This test is to confirm an engineer can reach the on-device EMS/TMS maintenance screen and return to the Sales app.
        steps: |-
          **GIVEN** a TVM (Kiosk or Astreo) is at the Sales home screen
          **AND** an example engineer holding the seeded technician credentials
          **WHEN** the engineer opens the EMS/TMS maintenance screen
          **AND** then exits it
          **THEN** the EMS/TMS maintenance screen is displayed on entry
          **AND** the TVM returns to the Sales home screen on exit
        expected: An engineer can open the on-device EMS/TMS maintenance screen and the TVM returns cleanly to the Sales home screen.
      - title: Comms — the TVM reports to CloudFare and updates Last Communication
        refs: [C1898222, FBD-100266, FBD-100341]
        objective: This test is to confirm a TVM communicates with the CloudFare back office and updates its Last Communication time.
        steps: |-
          **GIVEN** a commissioned TVM (Kiosk or Astreo) is powered on with a working network connection
          **AND** an example device visible in the CloudFare Comms Monitor
          **WHEN** the device performs its 15-minute staff-list check
          **THEN** a StaffList message is received by the CloudFare Comms Monitor
          **AND** the device Last Communication time is updated and Hours Since Last Communication resets to zero
        expected: The TVM's staff-list check reaches CloudFare, recording a StaffList message and resetting Hours Since Last Communication to zero.
