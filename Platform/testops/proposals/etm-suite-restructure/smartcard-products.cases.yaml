# ETM — per-product smartcard validation cases (George 2026-06-11: "one case per product, like POS").
# Re-expands the smartcard products that were folded into ~5 behaviour cases as variation lines, so
# each product is an executable case on a run. Adds the 7 that were absent entirely (Retired Staff,
# aLink, 24+, Metro Travelcard, Town Service, EA Bus, EA Rail). Grounded in smartcards-abt-crosstab.md
# + old suite 4943. Each carries the back-office verification STEPS (smartcard => CloudFare activity
# log + MERIT + SmartTrack), matching the old-suite phrasing. The shared mechanics (passback rules,
# invalid-card, faulty, hotlist, top-up) stay as their own behaviour cases.
# Mode: all shared (run under both Metro + Ulsterbus Configurations) EXCEPT Metro Travelcard (Metro)
# and Town Service Travelcard (Ulsterbus) — noted per the mode-coverage convention.
suite_id: 30254
defaults:
  template_id: 1
  custom_autoconfirmation: false
  custom_devtypes: [25]
  custom_revstatus: 2

sections:
  - path: Functional / Smartcards / Concessionary
    cases:
      - title: 60+ SmartPass — validation
        objective: This test is to confirm a 60+ SmartPass validates for free travel when valid and is rejected with the reason when invalid, and that the validation is recorded in the back office.
        steps: |
          **Given** the ETM is signed on and in service
          **WHEN** a valid 60+ SmartPass is presented
          **THEN** the free-travel journey is validated with the success tone
          **AND** passback is applied within the configured period
          **WHEN** an expired or hotlisted 60+ SmartPass is presented
          **THEN** the card is rejected with the specific reason shown
          **WHEN** the CloudFare activity log is checked
          **THEN** the validation event is recorded in the Back Office System (CloudFare) activity log
          **WHEN** the data is reviewed in MERIT
          **THEN** the validation transaction appears in MERIT
          **WHEN** the smartcard record is reviewed in SmartTrack
          **THEN** the updated smartcard record appears in SmartTrack
        expected: A 60+ SmartPass validates free travel when valid and rejects with a reason when invalid; the validation is recorded in the CloudFare activity log, MERIT and SmartTrack.
