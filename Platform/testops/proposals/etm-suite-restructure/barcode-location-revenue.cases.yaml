# ETM — Barcode Scanning + Location (GPS) + Revenue Limit (Functional, @mode(all))
# Grounded in the "Barcode Scanning" (6 notes), GPS cases, and "Revenue Limit" (3 notes) flows.
# Barcode reference entry is authored here (its home is the Driver Menu but the behaviour is barcode).
suite_id: 30254
defaults:
  template_id: 1
  custom_autoconfirmation: false
  custom_devtypes: [25]
  custom_revstatus: 2

sections:
  - path: Functional / Barcode Scanning
    cases:
      - title: Barcode — online validation successful
        objective: This test is to confirm a barcode ticket validates online and the correct ticket-validity detail is shown.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/barcode-scanning/12_5_1 - Barcode Scan - Ticket Valid inc. Date and Depart Time.png
        steps: |
          **Given** a Driver is signed on and barcode scanning is available
          **WHEN** a valid barcode ticket is scanned and validated online
          **THEN** the ticket is accepted
          **AND** the ticket validity detail is displayed (date and depart time, expiry, outbound and return, or use times as applicable)
        expected: A valid barcode validates online and shows the correct validity detail. Covers printed copy and mobile phone presentation.
      - title: Barcode — online validation failures
        objective: This test is to confirm barcode online validation is rejected with the correct reason.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/barcode-scanning/12_1_0 - Barcode Validation Failed.png
        steps: |
          **Given** a Driver is signed on and barcode scanning is available
          **WHEN** a barcode fails online validation
          **THEN** the transaction is cancelled with the failure reason shown
        expected: Online validation fails with the right reason — decryption failed, not valid, already used, not valid on this date, expired, exceeds offline limit, invalid product, or visual inspection not passed.
      - title: Barcode — offline validation
        objective: This test is to confirm barcode offline validation succeeds and is rejected when over the offline limit or invalid.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/barcode-scanning/12_2_1 - Barcode - Offline Check.png
        steps: |
          **Given** the ETM is validating a barcode offline
          **WHEN** a valid barcode is scanned within the offline validation limit
          **THEN** the ticket is accepted offline
          **WHEN** the barcode is over the offline validation limit or invalid
          **THEN** the barcode is rejected with the reason shown
        expected: Offline validation accepts within the limit and rejects when over the offline limit or invalid.
      - title: Barcode — multiple-use validation
        objective: This test is to confirm multiple-use barcode validation, including confirming multiple use and the failure reasons.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** a Driver is signed on and barcode scanning is available
          **WHEN** a multiple-use barcode is scanned and multiple use is confirmed
          **THEN** the multiple-use ticket is validated
          **WHEN** validation fails
          **THEN** the failure reason is shown (passback, incorrect zone, wrong start/end date, or wrong travel method)
        expected: Multiple-use barcodes validate with confirmation; failures show passback / incorrect zone / wrong dates / wrong travel method. Covers printed copy and mobile phone.
      - title: Barcode — mLink scan validation
        objective: This test is to confirm mLink barcode validation succeeds and rejects an expired mLink barcode.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** a Driver is signed on and barcode scanning is available
          **WHEN** a valid mLink barcode is scanned
          **THEN** the mLink barcode is validated
          **WHEN** an expired mLink barcode is scanned
          **THEN** the mLink barcode is rejected as expired
        expected: mLink barcodes validate when valid and reject when expired.
      - title: Barcode — reference entry via Driver Menu
        objective: This test is to confirm a Driver can enter a barcode reference manually for single and multiple use, with invalid references rejected.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/barcode-scanning/12_0_0 - Barcode Reference.png
        steps: |
          **Given** a Driver has opened the barcode reference entry from the Driver Menu
          **WHEN** the Driver enters a valid single-use or multiple-use barcode reference
          **THEN** the reference is accepted and validated
          **WHEN** the Driver enters an invalid reference
          **THEN** the reference is rejected as invalid
        expected: Manual barcode reference entry (single and multiple use) validates valid references and rejects invalid ones.
      - title: Barcode — printed tickets and print error
        objective: This test is to confirm a barcode-bearing ticket can be printed and that a print error during a barcode ticket is handled.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** a Driver issues a ticket that carries a barcode
          **WHEN** the ticket is printed
          **THEN** the ticket prints with its barcode
          **WHEN** a print error occurs
          **THEN** the barcode-ticket print error is handled
        expected: Tickets print with their barcode; a print error during a barcode ticket is handled. Legacy barcodes are also supported.

  - path: Functional / Location
    cases:
      - title: GPS — lock and new-location notifications
        objective: This test is to confirm the ETM notifies on GPS lock and on a new location.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** a Driver is signed on with GPS active
          **WHEN** the ETM acquires a GPS lock
          **THEN** a GPS lock notification is shown
          **WHEN** the ETM detects a new location
          **THEN** a new-location notification is shown
        expected: GPS lock and new-location notifications are shown.
      - title: GPS — arrival and departure at stops
        objective: This test is to confirm the ETM detects arrival at and departure from a stop.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** a Driver is signed on with GPS active on a route
          **WHEN** the bus arrives at a stop
          **THEN** arrival at the stop is detected
          **WHEN** the bus departs the stop
          **THEN** departure from the stop is detected
        expected: Arrival at and departure from stops are detected via GPS.
      - title: GPS — look ahead
        objective: This test is to confirm the ETM looks ahead to the next stop using GPS.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** a Driver is signed on with GPS active on a route
          **WHEN** the bus approaches the next stop
          **THEN** the ETM looks ahead and updates the current stage accordingly
        expected: GPS look-ahead updates the current stage as the bus approaches the next stop.
      - title: GPS — travelling mode brightness behaviour
        objective: This test is to confirm travelling-mode brightness behaviour at night and that a button press or smartcard restores the screen.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |
          **Given** a Driver is signed on and the bus is travelling
          **WHEN** the ETM is in travelling mode at night with the screen dimmed
          **THEN** the screen brightness is reduced for the driving condition
          **WHEN** a button is pressed or a smartcard is presented
          **THEN** the screen brightness is restored
        expected: Travelling mode dims the screen (incl. at night); a button press or smartcard restores brightness.

  - path: Functional / Revenue Limit
    cases:
      - title: Revenue Limit — approaching notification
        objective: This test is to confirm a header notification appears as the configured revenue limit is approaching.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/revenue-limit/02_9 _ Main Screen - Revenue Limit Approaching.png
        steps: |
          **Given** a Driver is signed on and taking cash fares
          **WHEN** the takings approach the pre-configured revenue limit
          **THEN** a revenue-limit-approaching notification appears in the header after the Transaction Complete banner
          **AND** the notification disappears after three seconds
        expected: A revenue-limit-approaching header notification shows after the Transaction Complete banner and clears after 3 seconds.
      - title: Revenue Limit — reached locks the ETM
        objective: This test is to confirm that reaching the maximum revenue signs the Driver off, prints a waybill and locks the ETM pending supervisor or technician action.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/revenue-limit/02_9_1 - Main Screen - Revenue Limit Reached.png
        steps: |
          **Given** a Driver is signed on and the takings reach the maximum revenue limit
          **WHEN** the revenue limit is reached
          **THEN** the Driver is automatically signed off
          **AND** a waybill is printed
          **AND** the ETM locks
          **AND** a Supervisor or Technician is required to resolve it
          **AND** the ETM retrieves its back-office connection in the background
        expected: Reaching max revenue auto-signs-off the Driver, prints a waybill, locks the ETM (needs Supervisor/Technician) and re-establishes the back-office connection in the background.
