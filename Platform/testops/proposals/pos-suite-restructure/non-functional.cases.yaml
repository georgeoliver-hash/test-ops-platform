# Non-Functional / resilience (flows 15.0 Printer Errors, 16.0 Power Interruption & Audio Tones,
# + Comms/CloudFare resilience). Shared across modes. Screen Validation already lives under Non-Functional.
suite: GG - POS - Claude Suite
suite_id: 30253

defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [5]
  custom_autoconfirmation: false

sections:
  - path: ["Non-Functional", "Printer"]
    cases:
      - title: "Printer — paper jam detected and recoverable"
        refs: ["TIBU-19311", "TIBU-20980", "TIBU-26723"]
        objective: "This test is to confirm a printer paper jam is detected, the operator can act on the jam screen, and the device recovers once the jam is cleared."
        steps: |
          **GIVEN** the operator completes a transaction that prints
          **WHEN** the printer experiences a paper jam
          **THEN** the Paper Jam screen is shown
          **AND** the Annul Transaction control responds
          **WHEN** the jam is cleared
          **THEN** the device returns to normal operation
        expected: "A paper jam is detected, the jam screen is actionable (annul works), and the device recovers cleanly once cleared (regression: TIBU-19311, TIBU-20980, TIBU-26723)."
      - title: "Printer — out of paper is handled"
        objective: "This test is to confirm the device handles an out-of-paper condition gracefully and recovers when paper is replaced."
        steps: |
          **GIVEN** the operator attempts to print
          **WHEN** the printer is out of paper
          **THEN** the device reports the out-of-paper condition
          **WHEN** paper is replaced
          **THEN** printing resumes normally
        expected: "Out-of-paper is reported and printing resumes once paper is replaced, with no crash."

  - path: ["Non-Functional", "Power & Audio"]
    cases:
      - title: "Power — recovery after interruption during a shift"
        refs: ["TIBU-29752"]
        objective: "This test is to confirm the device recovers cleanly to a valid state after a power interruption during an active shift."
        steps: |
          **GIVEN** an operator is signed on during an active shift
          **WHEN** power is interrupted and restored
          **THEN** the device restarts cleanly
          **AND** it recovers to a valid state
        expected: "After a power interruption the device restarts and recovers to a valid state (regression: TIBU-29752)."
      - title: "Audio — tones play for key actions"
        objective: "This test is to confirm the device plays the expected audio tones for key actions (e.g. validation, error)."
        steps: |
          **GIVEN** the device audio is enabled
          **WHEN** the operator performs an action that should produce a tone
          **THEN** the expected audio tone plays
        expected: "Audio tones play for the actions configured to produce them."

  - path: ["Non-Functional", "Comms (CloudFare)"]
    cases:
      - title: "Comms — loss enters Communication Locked"
        refs: ["TIBU-28530", "TIBU-27664"]
        objective: "This test is to confirm that sustained loss of CloudFare communication causes the device to enter Communication Locked, and that it does not lock spuriously."
        steps: |
          **GIVEN** the device is operating normally
          **WHEN** CloudFare communication is lost beyond the configured period
          **THEN** the device enters Communication Locked
          **AND** it does not enter Communication Locked while comms are healthy
        expected: "Sustained comms loss triggers Communication Locked at the configured threshold, with no spurious locks (regression: TIBU-28530, TIBU-27664)."
      - title: "Comms — recovery reconnects and syncs"
        objective: "This test is to confirm the device reconnects to CloudFare and syncs outstanding data once communication is restored."
        steps: |
          **GIVEN** the device has lost CloudFare communication
          **WHEN** communication is restored
          **THEN** the device reconnects to CloudFare
          **AND** outstanding transactions are synced
        expected: "On comms restoration the device reconnects and syncs any outstanding data."
      - title: "Comms — token loss does not force Out Of Service"
        refs: ["TIBU-21277"]
        objective: "This test is to confirm a lost authentication token is recovered without forcing the device Out Of Service."
        steps: |
          **GIVEN** the device is signed on and communicating
          **WHEN** the authentication token is lost
          **THEN** the device re-authenticates
          **AND** the device does not go Out Of Service unexpectedly
        expected: "A lost token is re-acquired without an unexpected Out Of Service (regression: TIBU-21277)."
      - title: "Comms — card-reader failures do not flood CloudFare"
        refs: ["TIBU-16106"]
        objective: "This test is to confirm card-reader failures are reported without spamming CloudFare with repeated messages."
        steps: |
          **GIVEN** the card reader is experiencing failures
          **WHEN** the failures occur repeatedly
          **THEN** the failures are reported to CloudFare at a sensible rate
          **AND** CloudFare is not flooded with duplicate messages
        expected: "Card-reader failures are reported without flooding CloudFare (regression: TIBU-16106)."
      - title: "Comms — device status and Tray ID reported correctly"
        refs: ["TIBU-24888", "TIBU-24889", "TIBU-25071"]
        objective: "This test is to confirm the device reports an accurate status and Tray ID to CloudFare (not 'Not Defined' or wrong values)."
        steps: |
          **GIVEN** the device is communicating with CloudFare
          **WHEN** the device reports its status
          **THEN** the device status is accurate
          **AND** the Tray ID is reported correctly
        expected: "Device status and Tray ID are reported accurately to CloudFare (regression: TIBU-24888, TIBU-24889, TIBU-25071)."
