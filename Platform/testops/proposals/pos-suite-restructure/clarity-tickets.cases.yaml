          **AND** the POS is communicating with CloudFare
          **AND** example: Family & Friends Day ticket, paid by cash
          **WHEN** the operator builds a Family & Friends Day ticket
          **AND** takes payment
          **THEN** the Family & Friends Day ticket is issued
