# POS Tickets — clarity pass (suite 30253)
# UPDATES 26 existing cases in place. Titles are verbatim (push --update matches by exact title).
# Same behaviour tested — only clarity improved: POS wording (no ETM), fuller objective,
# grounded preconditions (mode + a concrete product/passenger/payment worked example), one
# predicate per THEN/AND line, no compound THEN. No CloudFare audit step is added — none of the
# source Tickets cases carry one, and adding an assertion would change what they test. The
# Cross-Border cases keep their original two-line outcome (issued + banner, no receipt line).
# The [Automatable] tag line is stripped from Expected per instruction. Push with --update; do NOT
# create new cases. Worked-example routes/stations are illustrative and grounded in the specs
# (Ulsterbus routes per FBD-100662; NIR stations per FBD-100167); swap for seeded values on the rig.
suite_id: 30253
defaults:
  template_id: 1
  custom_devtypes: [5]
  custom_autoconfirmation: false
  custom_revstatus: 2
sections:
  - path: [Functional, Tickets]
    cases:
      - title: Single ticket
        objective: |-
          This test is to confirm the POS can sell and issue a Single ticket in either operating mode (NIR or Ulsterbus) — built via that mode's fare look-up, priced correctly for the passenger type, printed, and confirmed with the green success banner. Worked example: NIR Adult Single, Belfast Lanyon Place → Portadown, paid by cash.
        steps: |-
          **GIVEN** an operator is signed on (NIR or Ulsterbus mode)
          **AND** the POS is communicating with CloudFare
          **AND** example: NIR Adult Single, Belfast Lanyon Place → Portadown, paid by cash
          **WHEN** the operator builds a Single ticket via the mode's fare look-up
          **AND** takes payment for the passenger type
          **THEN** the Single ticket is issued at the correct price
          **AND** a receipt is printed
          **AND** a green success banner is displayed
        expected: |-
          A Single ticket issues at the correct price in NIR and Ulsterbus, prints a receipt, and shows the green success banner. Data variations: passenger type (Adult / Child / concession); payment (cash / card / warrant).
      - title: Day Return ticket
        objective: |-
          This test is to confirm the POS can sell and issue a Day Return ticket in either operating mode (NIR or Ulsterbus), priced correctly for the passenger type, printed, and confirmed with the green success banner. Worked example: NIR Adult Day Return, Belfast Lanyon Place → Portadown, paid by cash.
        steps: |-
          **GIVEN** an operator is signed on (NIR or Ulsterbus mode)
          **AND** the POS is communicating with CloudFare
          **AND** example: NIR Adult Day Return, Belfast Lanyon Place → Portadown, paid by cash
          **WHEN** the operator builds a Day Return ticket via the mode's fare look-up
          **AND** takes payment for the passenger type
          **THEN** the Day Return ticket is issued at the correct price
          **AND** a receipt is printed
          **AND** a green success banner is displayed
        expected: |-
          A Day Return issues at the correct price in NIR and Ulsterbus, prints a receipt, and shows the green success banner. Data variations: passenger type (Adult / Child).
      - title: iLink Single
        objective: |-
          This test is to confirm the POS can sell an iLink Single fare against a presented iLink smartcard in either operating mode (NIR or Ulsterbus), recording it against the card, printing a receipt, and confirming with the green success banner. Worked example: Adult iLink Single, iLink Zone 4, against a presented iLink smartcard, paid by cash.
        steps: |-
          **GIVEN** an operator is signed on (NIR or Ulsterbus mode)
          **AND** the POS is communicating with CloudFare
          **AND** example: Adult iLink Single, iLink Zone 4, against a presented iLink smartcard, paid by cash
          **WHEN** the operator sells an iLink Single fare against the presented iLink smartcard
          **THEN** the iLink Single is issued
          **AND** it is recorded against the presented card
          **AND** a receipt is printed
          **AND** a green success banner is displayed
        expected: |-
          An iLink Single is sold against the presented iLink smartcard in NIR and Ulsterbus, recorded against the card, and printed. Data variations: iLink zone; passenger type.
      - title: Warrant Return
        objective: |-
          This test is to confirm the POS can sell a Warrant Return against a warrant payment in either operating mode (NIR or Ulsterbus), printing a receipt and confirming with the green success banner. Worked example: Adult Warrant Return, Belfast Lanyon Place → Portadown, paid by warrant.
        steps: |-
          **GIVEN** an operator is signed on (NIR or Ulsterbus mode)
          **AND** the POS is communicating with CloudFare
          **AND** example: Adult Warrant Return, Belfast Lanyon Place → Portadown, paid by warrant
          **WHEN** the operator builds a Warrant Return
          **AND** completes the warrant payment
          **THEN** the Warrant Return ticket is issued
          **AND** a receipt is printed
          **AND** a green success banner is displayed
        expected: |-
          A Warrant Return issues against a warrant payment in NIR and Ulsterbus, prints a receipt, and shows the green success banner.
      - title: Family & Friends Day ticket
        objective: |-
          This test is to confirm the POS can sell and issue a Family & Friends Day ticket in either operating mode (NIR or Ulsterbus), printing a receipt and confirming with the green success banner. Worked example: Family & Friends Day ticket, paid by cash.
        steps: |-
