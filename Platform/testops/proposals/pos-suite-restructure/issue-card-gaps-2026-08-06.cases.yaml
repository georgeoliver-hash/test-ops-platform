suite_id: 30253
defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [5]
  custom_autoconfirmation: false

sections:
  - path: [Metro, Issue Card]
    cases:
      - title: "Issue Card — invalid smartcard shows Error screen (Metro)"
        refs: MODE-METRO-ONLY
        objective: |
          This test is to confirm presenting an invalid smartcard at the Metro Issue Card entry
          screen shows the Error screen.
        steps: |
          **GIVEN** the POS is at the Metro Please Present Smartcard screen
          **WHEN** an invalid smartcard is presented
          **THEN** the Smartcard/Error screen is shown
        expected: "Presenting an invalid smartcard at Metro card issue shows the Error screen."

      - title: "Issue Card — Card Write failure returns to basket to retry (Metro)"
        refs: MODE-METRO-ONLY
        objective: |
          This test is to confirm that after a failed card write during Metro card issue, choosing
          to try again returns to the same basket screen.
        steps: |
          **GIVEN** a Metro smartcard issue is at the Card Issue Error screen following a failed
          card write
          **WHEN** the operator tries again
          **THEN** the same basket screen is shown again
        expected: "Retrying after a Metro card write failure returns to the same basket screen."

      - title: "Issue Card — cancelling Card Issue Error voids the transaction (Metro)"
        refs: MODE-METRO-ONLY
        objective: |
          This test is to confirm cancelling out of the Card Issue Error screen during Metro card
          issue voids the transaction and returns to the previous screen.
        steps: |
          **GIVEN** a Metro smartcard issue is at the Card Issue Error screen
          **WHEN** the operator cancels
          **THEN** the transaction is voided
          **AND** the previous screen is shown
        expected: "Cancelling Card Issue Error on Metro voids the transaction and returns to the previous screen."

  - path: [Functional, Issue Card, Issue from Blank]
    cases:
      - title: "Issue Card — ABT Card Write failure returns to Basket/Expired to retry"
        refs: MODE-ALL
        objective: |
          This test is to confirm that after a failed card write during ABT card issue, choosing to
          try again returns to the Basket/Expired screen.
        steps: |
          **GIVEN** an ABT smartcard issue is at the Card Issue Error screen following a failed
          card write from Basket/Expired
          **WHEN** the operator tries again
          **THEN** the Basket/Expired screen is shown again
        expected: "Retrying after an ABT card write failure returns to the Basket/Expired screen."

      - title: "Issue Card — cancelling Card Issue Error voids the transaction (ABT)"
        refs: MODE-ALL
        objective: |
          This test is to confirm cancelling out of the Card Issue Error screen during ABT card
          issue voids the transaction and returns to the previous screen.
        steps: |
          **GIVEN** an ABT smartcard issue is at the Card Issue Error screen
          **WHEN** the operator cancels
          **THEN** the transaction is voided
          **AND** the previous screen is shown
        expected: "Cancelling Card Issue Error on ABT voids the transaction and returns to the previous screen."

  - path: [NIR (Rail), Issue Card]
    cases:
      - title: "Issue Card — invalid smartcard shows Error and returns to Main Screen"
        refs: MODE-ALL
        objective: |
          This test is to confirm presenting an invalid smartcard at the Issue Card entry screen
          shows the Error screen and, after a timeout or key press, returns to the Main Screen.
        steps: |
          **GIVEN** the POS is at the Please Present Smartcard screen
          **WHEN** an invalid smartcard is presented
          **THEN** the Smartcard/Error screen is shown
          **AND** after a timeout or any key press the POS returns to the Main Screen
        expected: "Presenting an invalid smartcard shows the Error screen then returns to Main Screen."

      - title: "Issue Card — Card Write failure returns to basket to retry"
        refs: MODE-ALL
        objective: |
          This test is to confirm that after a failed card write during smartcard issue, choosing
          to try again returns to the same basket/payment screen.
        steps: |
          **GIVEN** a smartcard issue is at the Card Issue Error screen following a failed card
          write
          **WHEN** the operator tries again
          **THEN** the same basket/payment screen is shown again
        expected: "Retrying after a card write failure returns to the same basket/payment screen."

      - title: "Issue Card — cancelling Card Issue Error voids the transaction"
        refs: MODE-ALL
        objective: |
          This test is to confirm cancelling out of the Card Issue Error screen during smartcard
          issue voids the transaction and returns to the previous screen.
        steps: |
          **GIVEN** a smartcard issue is at the Card Issue Error screen
          **WHEN** the operator cancels
          **THEN** the transaction is voided
          **AND** the previous screen is shown
        expected: "Cancelling Card Issue Error voids the transaction and returns to the previous screen."

  - path: [Ulsterbus, Issue Card]
    cases:
      - title: "Issue Card — invalid card reference number shows Reference Numbers/Invalid"
        refs: MODE-ULSTERBUS-ONLY
        objective: |
          This test is to confirm entering an invalid card reference number on the Reference
          Numbers screen shows the Reference Numbers/Invalid screen.
        steps: |
          **GIVEN** an Ulsterbus smartcard issue is at the Reference Numbers screen
          **WHEN** an invalid card reference number is entered
          **THEN** the Reference Numbers/Invalid screen is shown
        expected: "An invalid card reference number shows the Reference Numbers/Invalid screen."

      - title: "Issue Card — C button on Reference Numbers picks an alternative reference"
        refs: MODE-ULSTERBUS-ONLY
        objective: |
          This test is to confirm pressing the C button on the Reference Numbers screen returns
          the operator to the Issue Smartcard/Adult screen to pick an alternative reference number.
        steps: |
          **GIVEN** an Ulsterbus smartcard issue is at the Reference Numbers screen
          **WHEN** the operator presses the C button
          **THEN** the Issue Smartcard/Adult screen is shown
          **AND** the operator can select an alternative card reference number
        expected: "Pressing C on Reference Numbers returns to Issue Smartcard/Adult to pick an alternative reference."

      - title: "Issue Card — Ulsterbus Travelcard issue completes with a printed receipt"
        refs: MODE-ULSTERBUS-ONLY
        objective: |
          This test is to confirm issuing an Ulsterbus Travelcard completes the card write, prompts
          smartcard removal, and prints the Card Issue receipt.
        steps: |
          **GIVEN** an Ulsterbus Travelcard basket is ready to issue
          **WHEN** the operator completes the card write and removes the smartcard
          **THEN** the Card Issue receipt is printed
        expected: "Issuing an Ulsterbus Travelcard writes the card and prints the Card Issue receipt on removal."
