# Issue Card / Customer Displays / Barcode — reformatted. Shared issue stays in Functional - Shared;
# Metro-specific (Metro MJ, Metro Travelcard) -> Functional - Metro; Warrant (rail) -> NIR (move in UI).
suite: GG - POS - Claude Suite
suite_id: 30253

defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [5]
  custom_autoconfirmation: false

sections:
  - path: ["Functional", "Issue Card", "Issue from Blank"]
    cases:
      - title: "Issue Card — issue from blank"
        match: "Issue Card — issue a new card from a blank, take payment and print a receipt"
        refs: ["TIBU-26845", "TIBU-21266", "TIBU-26760", "TIBU-21208", "TIBU-24715", "TIBU-25890"]
        objective: "This test is to confirm the operator can issue a new card from blank: select card type, create the product with correct price, take payment, write the card and print a receipt, without sticking on 'Please wait' or 'Card Write Failed'."
        steps: |
          **GIVEN** an operator is signed on and presents a blank smartcard
          **WHEN** the operator selects the card type and creates the product
          **THEN** the product is created with the correct price
          **AND** the Top-Up option text is not cut short
          **WHEN** the operator takes payment
          **THEN** the card is written
          **AND** a receipt is printed
          **AND** the device does not get stuck on 'Please wait' or 'Card Write Failed'
        expected: "A blank card is issued end-to-end with correct pricing, written card, receipt and no stuck screens (regression: TIBU-26845, TIBU-21266, TIBU-26760, TIBU-21208, TIBU-24715, TIBU-25890)."
      - title: "Issue Card — blank card options"
        refs: ["TIBU-23963"]
        objective: "This test is to confirm that placing an Adult BVP or iLink Zone 1 'blank' card and selecting the Adult Belfast Visitors option offers the correct card options (not the iLink Zone options)."
        steps: |
          **GIVEN** the operator places an Adult BVP or iLink Zone 1 'blank' card on the POS
          **WHEN** the operator selects the Adult Belfast Visitors option
          **THEN** the correct Belfast Visitors options are offered
          **AND** the iLink Zone card options are not shown
        expected: "Selecting Adult Belfast Visitors on a blank BVP/iLink Zone 1 card shows the correct options, not the iLink Zone options (regression: TIBU-23963)."
      - title: "Issue Card — Multi-Journey"
        match: "Issue Card — issue an Ulsterbus / Adult / Child Multi-Journey card from blank"
        refs: ["TIBU-21430", "TIBU-21446"]
        objective: "This test is to confirm Adult and Child Multi-Journey cards can be created from blank."
        steps: |
          **GIVEN** the operator presents a blank card for a Multi-Journey product
          **WHEN** the operator creates the Adult or Child Multi-Journey product
          **THEN** the Multi-Journey card is created successfully
        expected: "Adult/Child Multi-Journey cards create from blank (regression: TIBU-21430, TIBU-21446)."
      - title: "Issue Card — DayLink"
        match: "Issue Card — issue a DayLink card from blank"
        refs: ["TIBU-25617", "TIBU-21441", "TIBU-26865", "TIBU-22548"]
        objective: "This test is to confirm a DayLink card can be created from blank with valid messaging and a single receipt."
        steps: |
          **GIVEN** the operator presents a blank card for a DayLink product
          **WHEN** the operator creates the DayLink product and adds days
          **THEN** the DayLink card is created with valid messaging
          **AND** a single receipt is printed
        expected: "DayLink cards create from blank with valid messaging and one receipt (regression: TIBU-25617, TIBU-21441, TIBU-26865, TIBU-22548)."
      - title: "Issue Card — iLink"
        match: "Issue Card — issue an iLink card from blank with the correct expiry date"
        refs: ["TIBU-26930", "TIBU-21264", "TIBU-23992", "TIBU-26872"]
        objective: "This test is to confirm an iLink card (incl. Child Zone 1) can be created from blank with the options offered and the expiry date set."
        steps: |
          **GIVEN** the operator presents a blank card for an iLink product
          **WHEN** the operator creates the iLink product
          **THEN** the iLink card is created with the correct options
          **AND** the expiry date is set and shown
        expected: "iLink cards create with the right options and a correct expiry (regression: TIBU-26930, TIBU-21264, TIBU-23992, TIBU-26872)."
      - title: "Issue Card — Belfast Visitor Pass"
        match: "Issue Card — issue a Belfast Visitor Pass from blank"
        refs: ["TIBU-22546", "TIBU-21264"]
        objective: "This test is to confirm a Belfast Visitor Pass can be created from blank with the Back button handled."
        steps: |
          **GIVEN** the operator presents a blank card for a Belfast Visitor Pass
          **WHEN** the operator creates the BVP product
          **THEN** the Belfast Visitor Pass is created successfully
        expected: "Belfast Visitor Passes create from blank with controls handled (regression: TIBU-22546, TIBU-21264)."
      - title: "Issue Card — recognised by other devices"
        match: "Issue Card — a card created on the POS is recognised by other devices"
        refs: ["TIBU-21446", "TIBU-22603", "TIBU-23996", "TIBU-26721", "TIBU-26722"]
        objective: "This test is to confirm a card created from blank on the POS is recognised on other devices (ETM/TVM) and can be topped up."
        steps: |
          **GIVEN** the operator has created a new card from blank on the POS
          **WHEN** the card is presented to another device (ETM/TVM) and back to the POS for top-up
          **THEN** the card is recognised as valid
          **AND** it can be topped up
        expected: "Cards created on the POS are recognised by other devices and can be topped up (regression: TIBU-21446, TIBU-22603, TIBU-23996, TIBU-26721, TIBU-26722)."

  - path: ["Metro", "Issue Card"]
    cases:
      - title: "Issue Card — Metro Multi-Journey"
        match: "Issue Card — issue a Metro Multi-Journey card from blank"
        refs: ["TIBU-22578", "TIBU-23996", "TIBU-25885", "TIBU-25891", "TIBU-21430", "TIBU-23009"]
        objective: "This test is to confirm an Adult or Child Metro Multi-Journey card can be created from blank per the UX flow, with a working Back button and correct journey naming. (Metro-only — move under Functional - Metro.)"
        steps: |
          **GIVEN** the operator presents a blank card for a Metro Multi-Journey product
          **WHEN** the operator creates the Multi-Journey product and completes issue
          **THEN** the Metro Multi-Journey card is created per the UX flow
          **AND** the Back button is responsive
          **AND** the journey naming (e.g. 40 Journey) is correct
        expected: "Metro Multi-Journey cards create per the UX flow with responsive controls and correct naming (regression: TIBU-22578, TIBU-23996, TIBU-25885, TIBU-25891, TIBU-21430, TIBU-23009)."
      - title: "Issue Card — Metro Travelcard"
        match: "Issue Card — issue a Metro Travelcard from blank with the correct expiry date"
        refs: ["TIBU-26931", "TIBU-26863"]
        objective: "This test is to confirm a Metro Travelcard can be created from blank with the expiry date set. (Metro-only — move under Functional - Metro.)"
        steps: |
          **GIVEN** the operator presents a blank card for a Metro Travelcard
          **WHEN** the operator creates the Travelcard product
          **THEN** the Metro Travelcard is created
          **AND** the expiry date is set and shown
        expected: "Metro Travelcards create with a correct expiry date (regression: TIBU-26931, TIBU-26863)."

  - path: ["NIR (Rail)", "Issue Card"]
    cases:
      - title: "Issue Card — Warrant option (rail)"
        match: "Issue Card — the Warrant option is available for ticket/smartcard issue (rail)"
        refs: ["TIBU-24778"]
        objective: "This test is to confirm the Warrant option is presented when issuing tickets/smartcards in rail mode. (Rail-only — move under Functional - NIR.)"
        steps: |
          **GIVEN** an operator is signed on in rail (NIR) mode issuing a ticket or smartcard
          **WHEN** the operator reaches the payment/issue options
          **THEN** the Warrant button is available
        expected: "The Warrant option is shown for rail ticket/smartcard issue (regression: TIBU-24778)."

  - path: ["Functional", "Customer Displays"]
    cases:
      - title: "Customer Display — passenger display"
        match: "Customer Display — the passenger display shows the fare and total to the customer"
        refs: ["TIBU-24845"]
        objective: "This test is to confirm the passenger display shows the fare and basket total and updates through the transaction."
        steps: |
          **GIVEN** an operator is building and paying for a fare
          **WHEN** the operator adds items and takes payment
          **THEN** the passenger display shows the fare and running total
          **AND** the passenger display updates as the transaction progresses
        expected: "The passenger display works, showing the fare/total and updating through the transaction (regression: TIBU-24845)."

  - path: ["Functional", "Barcode Scanning"]
    cases:
      - title: "Barcode — print barcode"
        match: "Barcode — the POS prints a barcode on a ticket"
        refs: ["TIBU-13180"]
        objective: "This test is to confirm the POS can print a barcode on a ticket."
        steps: |
          **GIVEN** an operator issues a ticket configured to carry a barcode
          **WHEN** the ticket prints
          **THEN** a scannable barcode is printed on the ticket
        expected: "The POS prints a scannable barcode on tickets that carry one (regression: TIBU-13180)."
      - title: "Barcode — scan barcode"
        match: "Barcode — the POS scans a barcode"
        objective: "This test is to confirm the POS can scan a barcode and act on it."
        steps: |
          **GIVEN** an operator is on a screen that accepts a barcode scan
          **WHEN** the operator scans a valid barcode
          **THEN** the barcode is read
          **AND** the corresponding action/product is recognised
        expected: "The POS reads scanned barcodes and acts on them correctly."
