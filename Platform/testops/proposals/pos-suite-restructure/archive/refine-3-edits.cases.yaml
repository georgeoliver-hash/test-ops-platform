# Refinement wave 3 — EDITs to tighten existing cases with annotation detail (+ 'C'-key case).
suite: GG - POS - Claude Suite
suite_id: 30253

defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [5]
  custom_autoconfirmation: false

sections:
  - path: ["Functional", "Sign On & Session", "Sign On"]
    cases:
      - title: "Sign On — field entry and the 'C' key"
        refs: ["TIBU-19341", "TIBU-22563"]
        objective: "This test is to confirm field entry on the Sign On screen and the 'C' key behaviour: delete a character, and step back to the previous field when empty."
        steps: |
          **GIVEN** the operator is entering the ID or PIN on the Sign On screen
          **WHEN** the operator presses the 'C' key with characters present
          **THEN** one character is deleted
          **WHEN** the operator presses the 'C' key with the field empty
          **THEN** the focus switches back to the previous field
        expected: "The 'C' key deletes one character at a time, and on an empty field steps back to the previous field (regression: TIBU-19341, TIBU-22563)."

  - path: ["Functional", "Sign On & Session", "Failures & Lockout"]
    cases:
      - title: "Sign On — device locks after 3 attempts"
        match: "Sign On — device locks after 3 attempts"
        refs: ["REQ-0050", "REQ-0099", "REQ-2821", "TIBU-22672", "TIBU-22003"]
        objective: "This test is to confirm the device locks after the configured number of incorrect sign-on attempts and that the lock survives a reboot."
        steps: |
          **GIVEN** the POS is showing the Sign On screen
          **WHEN** the operator enters incorrect credentials the configured maximum number of times
          **THEN** the "Device Locked" screen is shown with "The ID or PIN was entered incorrectly too many times"
          **AND** it instructs the operator to "Present Supervisor Card"
          **WHEN** the device is rebooted
          **THEN** the device is still locked
        expected: "After the configured max attempts (not hard-coded to 3) the device locks with the correct screen, and the lock persists across a reboot (regression: TIBU-22672, TIBU-22003)."

  - path: ["Functional", "Supervisor", "Reports & Information"]
    cases:
      - title: "Supervisor — Print & Zero"
        match: "Supervisor — Print & Zero"
        refs: ["TIBU-24786"]
        objective: "This test is to confirm Print & Zero (current and accumulated) asks for confirmation before zeroing, prints the full report contents, and resets the totals."
        steps: |
          **GIVEN** a supervisor is signed on
          **WHEN** the supervisor selects Print and Zero (Current or Accumulated)
          **THEN** a confirmation prompt asks whether to zero the totals after printing
          **WHEN** the supervisor confirms Yes
          **THEN** the report is printed
          **AND** the totals are reset to zero
          **AND** the printout includes operator no., POS no., sign-on/off times, tickets sold, revenue, misc revenue, smartcard validations, annulled tickets, first/last ticket numbers and per-ticket detail
        expected: "Print & Zero confirms before zeroing, prints the full report (operator/POS/times/tickets/revenue/validations/annulments/ticket detail) and resets the totals (regression: TIBU-24786)."

  - path: ["NIR (Rail)", "Fare Look-Up — Advance & Multi-day"]
    cases:
      - title: "Rail FLU — Advance Ticket"
        match: "Rail FLU — Advance Ticket"
        refs: ["TIBU-21792", "TIBU-22824", "TIBU-24826"]
        objective: "This test is to confirm an Advance Ticket accepts a valid date, rejects invalid/out-of-range dates, can only be one at a time (not with other basket items), and resets after inactivity."
        steps: |
          **GIVEN** the operator selects Advance Ticket on the Rail FLU
          **WHEN** the operator enters a valid future date in range
          **THEN** the advance ticket is added (basket shows 'Ticket Date DD/MM/YY')
          **WHEN** the operator enters an invalid date or one outside the valid advance range
          **THEN** an error is shown (3s timeout, override with any key)
          **AND** the device does not crash
          **AND** an advance ticket cannot be combined with other products in the basket (one at a time)
          **AND** the advance date, passenger and ticket type reset after 1 minute of inactivity
        expected: "Advance Ticket accepts valid in-range dates, rejects invalid/out-of-range with an error, is one-at-a-time (no other basket items), and resets after 1 min inactivity (regression: TIBU-21792, TIBU-22824, TIBU-24826)."
