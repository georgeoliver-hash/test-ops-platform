# Fare Look-Up — reformatted. Rail (NIR) cases live under Functional - NIR (Rail); Common under
# Functional - Shared. (Bus FLU now lives in Ulsterbus + Metro via bus-flu.cases.yaml.)
suite: GG - POS - Claude Suite
suite_id: 30253

defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [5]
  custom_autoconfirmation: false

sections:
  - path: ["NIR (Rail)", "Fare Look-Up"]
    cases:
      - title: "Rail FLU — sell a ticket"
        match: "Rail FLU — sell a ticket: boarding station, alighting station, passenger type, ticket type, basket"
        refs: ["TIBU-19374", "TIBU-24862", "TIBU-24853"]
        objective: "This test is to confirm the operator can build a rail fare (boarding station, alighting station, passenger type, ticket type) with the correct price and layout, add it to the basket, and that the correct stations are audited."
        steps: |
          **GIVEN** an operator is signed on with the POS in rail (NIR) mode on the Main Rail screen
          **WHEN** the operator selects a boarding station, an alighting station, a passenger type and a ticket type
          **THEN** the selected fare and price are shown with the correct field layout
          **AND** the correct price is used (including Cross-Border tickets)
          **WHEN** the operator adds the fare to the basket
          **THEN** the fare is added
          **AND** the correct boarding and alighting stations are audited
        expected: "A rail fare is built with correct price (incl. XB), correct layout, added to basket, and the right stations audited (regression: TIBU-19374, TIBU-24862, TIBU-24853). Stations/ticket types are data variations."
      - title: "Rail FLU — boarding = alighting rejected"
        match: "Rail FLU — boarding and alighting set the same is rejected"
        refs: ["TIBU-19292"]
        objective: "This test is to confirm the POS rejects a rail fare where the boarding and alighting stations are the same."
        steps: |
          **GIVEN** the operator is building a rail fare
          **WHEN** the operator sets the boarding and alighting stations to the same station
          **THEN** the fare is not accepted
          **AND** the screen does not offer issue buttons for it
        expected: "Setting boarding = alighting is blocked and no issue buttons are offered (regression: TIBU-19292)."
      - title: "Rail FLU — station lists & numeric select"
        match: "Rail FLU — boarding/alighting station lists display and accept numeric selection"
        refs: ["TIBU-22953", "TIBU-21771"]
        objective: "This test is to confirm the boarding/alighting station lists display and can be selected by numeric input."
        steps: |
          **GIVEN** the operator is building a rail fare
          **WHEN** the operator opens the station list and enters the station number
          **THEN** the station list is displayed
          **AND** the numeric selection chooses the station
        expected: "Station lists display and numeric input selects the stations (regression: TIBU-22953, TIBU-21771)."
      - title: "Rail FLU — function keys"
        match: "Rail FLU — function keys list passengers and ticket types without crashing"
        refs: ["TIBU-24774", "TIBU-24775", "TIBU-21779", "TIBU-24827", "TIBU-24828", "TIBU-21770"]
        objective: "This test is to confirm the rail FLU function keys list passengers/ticket types, do not crash the device, expose no disabled buttons, and show real labels."
        steps: |
          **GIVEN** the operator is on the Rail FLU screen
          **WHEN** the operator presses the function keys (e.g. R3 passengers, R4 ticket types)
          **THEN** the corresponding list is displayed with real labels (not "example")
          **AND** the device does not crash
          **AND** buttons that should be unavailable cannot be pressed
        expected: "Rail FLU function keys show the lists with real labels, never crash, and disabled buttons stay disabled (regression: TIBU-24774, TIBU-24775, TIBU-21779, TIBU-24827, TIBU-24828, TIBU-21770)."
      - title: "Rail FLU — C returns"
        match: "Rail FLU — pressing C returns to the previous FLU screen"
        refs: ["TIBU-24810"]
        objective: "This test is to confirm pressing 'C' on a Rail FLU screen returns to the previous screen."
        steps: |
          **GIVEN** the operator is on a Rail FLU sub-screen
          **WHEN** the operator presses the 'C' button
          **THEN** the operator is returned to the previous FLU screen
        expected: "The 'C' button steps back to the previous Rail FLU screen (regression: TIBU-24810)."
      - title: "Rail FLU — Main screen rail-only"
        match: "Rail FLU — Main Rail screen shows only rail options"
        refs: ["TIBU-24864"]
        objective: "This test is to confirm the Main Rail screen does not show Bus or Day Tours buttons."
        steps: |
          **GIVEN** the POS is in rail (NIR) mode on the Main Rail screen
          **WHEN** the operator views the screen
          **THEN** no 'Bus' or 'Day Tours' button is shown
        expected: "The Main Rail screen shows rail options only (regression: TIBU-24864)."
      - title: "Rail FLU — non-Adult-Single keeps state"
        match: "Rail FLU — issuing a non-Adult-Single ticket keeps the FLU state"
        refs: ["TIBU-24865"]
        objective: "This test is to confirm issuing a ticket other than Adult Single does not unexpectedly revert the Rail FLU screen."
        steps: |
          **GIVEN** the operator has built a non-Adult-Single rail fare
          **WHEN** the operator issues the ticket
          **THEN** the Rail FLU screen retains the correct state and does not revert
        expected: "Issuing a non-Adult-Single ticket leaves the Rail FLU in the correct state (regression: TIBU-24865)."
      - title: "Rail FLU — present smartcard"
        refs: ["TIBU-21933", "TIBU-21786"]
        objective: "This test is to confirm presenting a smartcard on the Rail FLU screen is handled without a fatal error and the operator can return to the FLU screen."
        steps: |
          **GIVEN** the operator is on the Rail FLU screen
          **WHEN** the operator presents a smartcard
          **THEN** the smartcard is handled without a fatal error
          **AND** the operator can return to the Rail FLU screen
        expected: "Presenting a smartcard on the Rail FLU screen does not crash and the operator can return to FLU (regression: TIBU-21933, TIBU-21786)."

  - path: ["NIR (Rail)", "Fare Look-Up — Favourites"]
    cases:
      - title: "Rail FLU — favourites: save & issue"
        match: "Rail FLU Favourites — save, list (with paging) and issue a favourite ticket"
        refs: ["TIBU-19371", "TIBU-24783", "TIBU-24781", "TIBU-19456"]
        objective: "This test is to confirm a favourite rail ticket can be saved, listed with paging, shows its details, and selecting it proceeds to payment."
        steps: |
          **GIVEN** the operator is on the Rail FLU screen
          **WHEN** the operator saves a fare as a favourite and opens the favourites list
          **THEN** the favourites list is shown with paging and correct alignment
          **WHEN** the operator selects a favourite
          **THEN** the favourite's ticket details are shown
          **AND** the flow proceeds to the payment screen
        expected: "Favourites can be saved, listed/paged, show details, and selecting one proceeds to payment (regression: TIBU-19371, TIBU-24783, TIBU-24781, TIBU-19456)."
      - title: "Rail FLU — favourites: overwrite"
        match: "Rail FLU Favourites — overwriting a favourite works and cancel aborts cleanly"
        refs: ["TIBU-24095", "TIBU-24776", "TIBU-24886"]
        objective: "This test is to confirm overwriting a favourite stores it in the correct slot without a fatal error, and cancelling the overwrite aborts cleanly."
        steps: |
          **GIVEN** the operator is overwriting an existing favourite
          **WHEN** the operator confirms the overwrite
          **THEN** the favourite is stored in the correct slot with no fatal error
          **WHEN** the operator instead cancels an overwrite
          **THEN** the overwrite is aborted and no change is made
        expected: "Overwriting saves to the right slot without crashing, and cancel aborts cleanly (regression: TIBU-24095, TIBU-24776, TIBU-24886)."

  - path: ["NIR (Rail)", "Fare Look-Up — Advance & Multi-day"]
    cases:
      - title: "Rail FLU — Advance Ticket"
        match: "Rail FLU — Advance Ticket: select a valid date, reject an invalid date, no crash"
        refs: ["TIBU-21792", "TIBU-22824", "TIBU-24826"]
        objective: "This test is to confirm an Advance Ticket can be added with a valid date, an invalid date is rejected, and the flow does not crash or allow adding more than allowed."
        steps: |
          **GIVEN** the operator selects Advance Ticket on the Rail FLU
          **WHEN** the operator enters a valid future date
          **THEN** the advance ticket is added to the basket
          **WHEN** the operator enters an invalid date
          **THEN** an invalid-date error is shown
          **AND** the device does not crash
        expected: "Advance Ticket accepts valid dates, rejects invalid ones, never crashes, and does not allow extra once added (regression: TIBU-21792, TIBU-22824, TIBU-24826)."
      - title: "Rail FLU — 3 Day Select"
        match: "Rail FLU — 3 Day Select ticket: choose the available days"
        refs: ["TIBU-24829", "TIBU-24837"]
        objective: "This test is to confirm the 3 Day Select ticket lets the operator choose the travel days, including using the + and - buttons."
        steps: |
          **GIVEN** the operator selects a 3 Day Select ticket on the Rail FLU
          **WHEN** the operator chooses the available days using the day list and the + / - buttons
          **THEN** the selected days are applied to the ticket
        expected: "The 3 Day Select ticket allows choosing the travel days via the list and +/- buttons (regression: TIBU-24829, TIBU-24837)."
      - title: "Rail FLU — Misc button"
        match: "Rail FLU — the Misc / open-fare button does not cause a fatal error"
        refs: ["TIBU-19454"]
        objective: "This test is to confirm pressing the Misc button on the Main Rail FLU screen does not cause a fatal error."
        steps: |
          **GIVEN** the operator is on the Main Rail FLU screen
          **WHEN** the operator presses the Misc button
          **THEN** the Misc option opens without a fatal error
        expected: "The Misc button opens cleanly with no fatal error (regression: TIBU-19454)."

  - path: ["Functional", "Fare Look-Up", "Common"]
    cases:
      - title: "FLU — passenger type"
        match: "FLU — selecting a passenger type applies it to the fare"
        objective: "This test is to confirm the operator can select a passenger type and it is applied to the fare."
        steps: |
          **GIVEN** the operator is building a fare
          **WHEN** the operator selects a passenger type
          **THEN** the passenger type is applied
          **AND** the price updates
        expected: "Selecting a passenger type applies it and updates the price. Each passenger type is a data variation."
      - title: "FLU — cash limit"
        match: "FLU — a fare over the cash limit shows the Cash Limit error"
        objective: "This test is to confirm building/paying a fare above the configured cash limit shows the Cash Limit error."
        steps: |
          **GIVEN** the operator is building a fare
          **WHEN** the basket total exceeds the configured cash limit
          **THEN** the Cash Limit error is shown
        expected: "Exceeding the configured cash limit shows the Cash Limit error and blocks the over-limit cash transaction."
