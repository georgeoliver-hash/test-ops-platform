# Top Up & Validation — reformatted. Shared cards stay in Functional - Shared. The two genuinely
# mode-exclusive ones (Metro Travelcard, Ulsterbus/Town Service) are tagged in their objective and
# should be moved in the UI: "Top Up — Metro Travelcard" -> Functional - Metro; "Top Up — Ulsterbus
# / Town Service" -> Functional - Ulsterbus.
suite: GG - POS - Claude Suite
suite_id: 30253

defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [5]
  custom_autoconfirmation: false

sections:
  - path: ["Functional", "Top Up & Validation", "Top Up"]
    cases:
      - title: "Top Up — top up a smartcard"
        match: "Top Up — present a smartcard, top it up, pay, remove card and print a receipt"
        refs: ["TIBU-23016", "TIBU-21280", "TIBU-21119", "TIBU-21184", "TIBU-22985"]
        objective: "This test is to confirm the operator can present a smartcard, select Top Up, choose a value, take payment, be prompted to remove the card, and have the top up applied with a receipt printed."
        steps: |
          **GIVEN** an operator is signed on
          **WHEN** the operator presents a smartcard and selects Top Up
          **THEN** the smartcard menu shows the correct card description and mini statement
          **WHEN** the operator selects a top-up value and takes payment
          **THEN** a "Please Remove Smartcard" prompt is shown
          **AND** the top up is applied to the card and appears on the mini statement
          **AND** a receipt is printed
        expected: "A smartcard is topped up end-to-end with correct description, applied balance, remove-card prompt and receipt (regression: TIBU-23016, TIBU-21280, TIBU-21119, TIBU-21184, TIBU-22985)."
      - title: "Top Up — cancel a top-up"
        match: "Top Up — cancelling a top-up returns to the previous screen cleanly"
        refs: ["TIBU-24858", "TIBU-25885", "TIBU-21786"]
        objective: "This test is to confirm cancelling/going back during a top-up returns to the previous screen with the screen responsive."
        steps: |
          **GIVEN** the operator has started a smartcard top-up
          **WHEN** the operator cancels or presses Back
          **THEN** the operator is returned to the previous screen
          **AND** the screen remains responsive
        expected: "Cancelling a top-up returns cleanly with a responsive screen (regression: TIBU-24858, TIBU-25885, TIBU-21786)."
      - title: "Top Up — Multi-Journey limit"
        match: "Top Up — Multi-Journey card respects the maximum journey limit"
        refs: ["TIBU-21133", "TIBU-21992", "TIBU-24051", "TIBU-25886"]
        objective: "This test is to confirm topping up a Multi-Journey smartcard adds and shows journeys, enforces the maximum, supports cards with expired journeys, and does not crash."
        steps: |
          **GIVEN** the operator presents a Multi-Journey smartcard
          **WHEN** the operator tops up journeys
          **THEN** the journeys are added
          **AND** the journeys are shown
          **AND** the card cannot exceed its maximum permitted journeys
          **AND** a card with expired journeys can still be topped up
          **AND** the device does not crash
        expected: "Multi-Journey top-up adds/shows journeys, enforces the max, handles expired journeys, and never crashes (regression: TIBU-21133, TIBU-21992, TIBU-24051, TIBU-25886)."
      - title: "Top Up — DayLink"
        match: "Top Up — DayLink card top up"
        refs: ["TIBU-26727", "TIBU-21117", "TIBU-26857", "TIBU-20868"]
        objective: "This test is to confirm a DayLink card tops up per its flow, with correct messaging and a correct Days-Left field."
        steps: |
          **GIVEN** the operator presents a DayLink card
          **WHEN** the operator tops it up
          **THEN** the top up completes following the DayLink flow
          **AND** the card messaging is correct (no incorrect 'Card Not Used')
          **AND** the Days-Left field shows the correct value
        expected: "DayLink tops up per its flow with correct messaging and Days-Left (regression: TIBU-26727, TIBU-21117, TIBU-26857, TIBU-20868)."
      - title: "Top Up — iLink"
        match: "Top Up — iLink card top up offers the correct values, including expired cards"
        refs: ["TIBU-23990", "TIBU-24328", "TIBU-26859", "TIBU-25148"]
        objective: "This test is to confirm an iLink card top up offers all valid values, handles expired cards, and shows no ghost buttons or stuck screens."
        steps: |
          **GIVEN** the operator presents an iLink smartcard
          **WHEN** the operator selects Top Up
          **THEN** the full set of valid top-up values is offered
          **AND** an expired iLink card is handled correctly
          **AND** the device does not stick on 'Please wait' and shows no ghost buttons
        expected: "iLink top-up offers all values, handles expiry, and avoids ghost buttons/stuck screens (regression: TIBU-23990, TIBU-24328, TIBU-26859, TIBU-25148)."
      - title: "Top Up — Belfast Visitor Pass"
        match: "Top Up — Belfast Visitor Pass top up, including expired passes"
        refs: ["TIBU-22546", "TIBU-26858"]
        objective: "This test is to confirm a Belfast Visitor Pass tops up per its flow, including expired passes and the Back button."
        steps: |
          **GIVEN** the operator presents a Belfast Visitor Pass
          **WHEN** the operator tops it up
          **THEN** the top up completes per its flow
          **AND** an expired pass is handled correctly
          **AND** the Back button is handled correctly
        expected: "Belfast Visitor Pass tops up per flow, handling expiry and Back (regression: TIBU-22546, TIBU-26858)."
      - title: "Top Up — ABT smartcard"
        match: "Top Up — ABT smartcard top up and negative-list handling"
        objective: "This test is to confirm an ABT (account-based) smartcard tops up and a negative-listed ABT card is handled per the rules."
        steps: |
          **GIVEN** the operator presents an ABT smartcard
          **WHEN** the operator tops it up
          **THEN** the top up completes
          **AND** an ABT card on the negative list is handled per the negative-list rules
        expected: "ABT smartcards top up and negative-listed ABT cards are handled per the rules."
      - title: "Top Up — Monthly Season Pass"
        match: "Top Up — Monthly Season Pass shows the correct expiry (To) date"
        refs: ["TIBU-19299"]
        objective: "This test is to confirm a Monthly Season Pass shows the correct 'To' (expiry) date."
        steps: |
          **GIVEN** the operator tops up or issues a Monthly Season Pass
          **WHEN** the pass details are shown
          **THEN** the 'To' date is the correct expiry date
        expected: "The Monthly Season Pass shows the correct 'To'/expiry date (regression: TIBU-19299)."
      - title: "Top Up — mini statement"
        match: "Top Up — the mini statement shows the correct balance/journeys for each card type"
        refs: ["TIBU-21450", "TIBU-22398", "TIBU-25098", "TIBU-23989", "TIBU-22558"]
        objective: "This test is to confirm presenting a card shows a mini statement with the correct, up-to-date balance/journeys, card details and expiry."
        steps: |
          **GIVEN** the operator presents a topped-up smartcard
          **WHEN** the mini statement is shown
          **THEN** it shows the correct card type, number, balance/journeys, start date and expiry
          **AND** it reflects top-ups made on this and other devices
        expected: "Mini statements show correct, current details across devices (regression: TIBU-21450, TIBU-22398, TIBU-25098, TIBU-23989, TIBU-22558)."
      - title: "Top Up — half-fare / concession smartcard"
        refs: ["TIBU-24795"]
        objective: "This test is to confirm presenting a half-fare/concession smartcard is recognised rather than reported as 'card not recognised'."
        steps: |
          **GIVEN** the operator presents a half-fare or concession smartcard
          **WHEN** the card is read
          **THEN** the card is recognised as a valid half-fare/concession card
        expected: "Half-fare/concession smartcards are recognised correctly (regression: TIBU-24795)."
      - title: "Top Up — non-toppable card handled"
        refs: ["TIBU-21219"]
        objective: "This test is to confirm presenting a card that cannot be topped up is handled gracefully without crashing."
        steps: |
          **GIVEN** the operator presents a card that cannot be topped up
          **WHEN** the card is read
          **THEN** the POS reports that the card cannot be topped up
          **AND** the device does not crash
        expected: "A non-toppable card is reported gracefully with no crash (regression: TIBU-21219)."

  - path: ["Metro", "Top Up"]
    cases:
      - title: "Top Up — Metro Travelcard"
        match: "Top Up — Metro Travelcard top up"
        refs: ["TIBU-21115", "TIBU-24340", "TIBU-25099", "TIBU-25615", "TIBU-25078", "TIBU-25081"]
        objective: "This test is to confirm a Metro Travelcard tops up successfully, proceeds correctly, shows the right first-use/error screens and correct expiry text. (Metro-only — move this case under Functional - Metro.)"
        steps: |
          **GIVEN** the operator presents a Metro Travelcard
          **WHEN** the operator selects Top Up, chooses a value and pays
          **THEN** the top up completes
          **AND** the correct first-use/error screen is shown where applicable
          **AND** the mini-statement expiry text is correct
        expected: "Metro Travelcards top up successfully with correct screens and expiry text (regression: TIBU-21115, TIBU-24340, TIBU-25099, TIBU-25615, TIBU-25078, TIBU-25081)."

  - path: ["Ulsterbus", "Top Up"]
    cases:
      - title: "Top Up — Ulsterbus / Town Service"
        match: "Top Up — Ulsterbus Multi-Journey and Town Service Travelcard top up"
        refs: ["TIBU-26720", "TIBU-26861", "TIBU-26862", "TIBU-26713"]
        objective: "This test is to confirm Ulsterbus Multi-Journey and Town Service Travelcards top up per their UX flow, including first use. (Ulsterbus-only — move this case under Functional - Ulsterbus.)"
        steps: |
          **GIVEN** the operator presents an Ulsterbus Multi-Journey or Town Service Travelcard
          **WHEN** the operator selects Top Up, chooses a value and pays
          **THEN** the top up completes following the correct UX flow
          **AND** a card on first use is handled correctly
        expected: "Ulsterbus Multi-Journey and Town Service top-ups complete per the UX flow incl. first use (regression: TIBU-26720, TIBU-26861, TIBU-26862, TIBU-26713)."

  - path: ["Functional", "Top Up & Validation", "Validation"]
    cases:
      - title: "Validation — validate a smartcard"
        match: "Validation — validating a smartcard shows the validation confirmation"
        objective: "This test is to confirm presenting a valid smartcard for validation shows the validation confirmation screen."
        steps: |
          **GIVEN** the POS is on the main screen
          **WHEN** a valid smartcard is presented for validation
          **THEN** the validation confirmation screen is shown
        expected: "A valid smartcard validation shows the confirmation screen."
      - title: "Validation — already validated"
        match: "Validation — an already-validated card is detected"
        objective: "This test is to confirm a card that has already been validated is detected rather than re-validated."
        steps: |
          **GIVEN** a smartcard has already been validated
          **WHEN** the card is presented again
          **THEN** the 'Smartcard Already Validated' message is shown
        expected: "An already-validated card is detected and the Already Validated message is shown."
      - title: "Validation — hotlisted card"
        match: "Validation — a hotlisted card shows the Hotlisted Error"
        objective: "This test is to confirm a hotlisted smartcard is rejected with the Hotlisted Error."
        steps: |
          **GIVEN** a smartcard is on the hotlist
          **WHEN** the card is presented
          **THEN** the Hotlisted Error is shown
          **AND** the card is not accepted
        expected: "A hotlisted card is rejected with the Hotlisted Error."
      - title: "Validation — outside time band"
        match: "Validation — presentation outside the valid time band is handled"
        objective: "This test is to confirm presenting a card outside its valid time band is handled per the Outside Time Band rules."
        steps: |
          **GIVEN** a smartcard is presented outside its valid time band
          **WHEN** the card is read
          **THEN** the Outside Time Band handling is applied
        expected: "Cards presented outside the valid time band are handled per the rules."

  - path: ["Functional", "Top Up & Validation", "Faulty Card"]
    cases:
      - title: "Faulty Card — options"
        match: "Faulty Card — faulty smartcard offers Charge Full Fare, Issue Ticket and Select Card Type"
        refs: ["TIBU-25818", "TIBU-21256"]
        objective: "This test is to confirm a faulty smartcard offers Charge Full Fare, Issue Ticket and Select Card Type, can be cancelled, and Issue Receipt works."
        steps: |
          **GIVEN** the operator presents a faulty smartcard
          **WHEN** the faulty smartcard screen is shown
          **THEN** Charge Full Fare, Issue Ticket and Select Card Type are offered
          **AND** a Cancel option is available
          **WHEN** the operator chooses Issue Ticket then Issue Receipt
          **THEN** a ticket is produced
          **AND** its receipt is produced
        expected: "A faulty smartcard offers the options with a working Cancel and Issue Receipt (regression: TIBU-25818, TIBU-21256)."
      - title: "Faulty Card — invalid card removal"
        match: "Faulty Card — an invalid top-up card removal is detected"
        refs: ["TIBU-20851"]
        objective: "This test is to confirm that when an invalid top-up card is removed, the POS detects the removal."
        steps: |
          **GIVEN** an invalid top-up card is on the reader
          **WHEN** the card is removed
          **THEN** the POS detects that the card has been removed
        expected: "Removal of an invalid top-up card is detected (regression: TIBU-20851)."
