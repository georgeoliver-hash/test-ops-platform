suite_id: 30253
defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [5]
  custom_autoconfirmation: false

sections:
  - path: [Non-Functional, Printer]
    cases:
      - title: "Printer Error — operator annuls via Operator Board annulment flow"
        refs: MODE-ALL
        objective: |
          This test is to confirm the operator can enter the annulment flow, as seen in the
          Operator Board, from the Printer Error screen.
        steps: |
          **GIVEN** the POS is at the Error - Printer Error screen following a failed print
          **WHEN** the operator selects Annul Transaction
          **THEN** the annulment flow as seen in the Operator Board begins
        expected: "From Printer Error, selecting Annul Transaction opens the Operator Board annulment flow."

      - title: "Printer Error — successful reprint returns to the screen where print was attempted"
        refs: MODE-ALL
        objective: |
          This test is to confirm that when the print succeeds after a Printer Error, the POS
          returns to the screen where the print was originally attempted.
        steps: |
          **GIVEN** the POS is at the Error - Printer Error screen following a failed print
          **WHEN** the print attempt is retried and succeeds
          **THEN** the POS returns to the relevant screen where the print was attempted
        expected: "A successful reprint from Printer Error returns the POS to the screen where the print was attempted."

      - title: "Paper Jam — POS automatically reverses paper feed with no screen change"
        refs: MODE-ALL
        objective: |
          This test is to confirm that on a paper jam the POS automatically attempts to reverse
          the paper feed without any screen change.
        steps: |
          **GIVEN** the POS is at the Error - Paper Jam screen following a paper jam
          **WHEN** the POS attempts to reverse the paper feed to clear the jam
          **THEN** no screen change occurs during the attempt
          **AND** the POS remains on the Error - Paper Jam screen
        expected: "The automatic paper-feed reversal on Paper Jam produces no screen change."

      - title: "Printer Error / Paper Jam — non-transaction print shows Continue without Printing"
        refs: MODE-ALL
        objective: |
          This test is to confirm that on a Printer Error or Paper Jam caused by a non-transaction
          print, the annulment option is labelled "Continue without Printing" rather than "Annul
          Transaction".
        steps: |
          **GIVEN** the POS is at the Error - Printer Error or Error - Paper Jam screen following
          a failed non-transaction print (e.g. Mini Statement, Annul Ticket confirmation, Version
          Report, Waybill)
          **WHEN** the operator views the annulment option
          **THEN** the option reads "Continue without Printing"
          **AND** the option does not read "Annul Transaction"
        expected: "Non-transaction print failures show Continue without Printing in place of Annul Transaction."

      - title: "Printer Error / Paper Jam — repeated print failure loops until annulled"
        refs: MODE-ALL
        objective: |
          This test is to confirm that a print which keeps failing on retry keeps returning the
          POS to the same error screen until the operator annuls the transaction.
        steps: |
          **GIVEN** the POS is at the Error - Printer Error or Error - Paper Jam screen with the
          print already retried once
          **WHEN** the retried print fails again
          **THEN** the POS returns to the same error screen
          **AND** an event is sent to CloudFare for the retry
          **AND** this repeats until the operator annuls the transaction
        expected: "Repeated print failures keep looping the operator back to the same error screen until annulment."
