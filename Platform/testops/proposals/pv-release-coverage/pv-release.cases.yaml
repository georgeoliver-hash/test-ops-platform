# PV — new cases for TL Validators v5.0.0 / v5.0.1 / v5.0.3 release-coverage audit (2026-07-21).
# Two of these three are migrated from the OLD suite (10047, read-only) per George's instruction to
# cross-check 10047 before authoring anything new — their content is grounded on the real old-suite
# case, not invented. The third (remote log retrieval) has no old-suite content (the old stub
# C4091913 was empty), so it is grounded directly on the JIRA ticket's own reproduction steps, per
# the "ground on the ticket itself" convention already used for pv-future-release.cases.yaml.
suite_id: 30255
defaults:
  template_id: 1
  custom_autoconfirmation: false
  custom_devtypes: [10]
  custom_revstatus: 2

sections:
  - path: Functional / ABT (Glider)
    cases:
      - title: FEIG — update without TID/TK fails safely, PV app software still updates
        objective: This test is to confirm a FEIG firmware update fails safely (without bricking the reader or corrupting its state) when the device group lacks a TID/TK, while the PV application software update in the same distribution still completes.
        refs: "TIBU-22318"
        steps: |
          **Given** a PV/FEIG device group in CloudFare TMS lacks a TID and TK
          **AND** a dataset is staged with a new PV application software version and new FEIG Transparent/PCA/OS versions
          **WHEN** the dataset is deployed to the device group via TMS
          **THEN** the PV application software updates successfully
          **AND** the FEIG firmware update fails (does not apply) because the TID/TK are missing
          **AND** the FEIG remains on its previous version
          **AND** a failure status or exception is logged in CloudFare for the FEIG update
        expected: A FEIG update fails safely (no corruption, reader stays on its previous version, failure logged) when TID/TK are missing, while the PV application software in the same distribution updates as normal.
        # Migrated from OLD suite 10047 case C4073875 ("FEIG Update Fails if Device Group Lacks
        # TID/TK, but PV App Software Still Updates") — found via the old-suite cross-check before
        # authoring; not invented. Grounds TIBU-22318's TID/TK-from-device-group requirement by its
        # documented failure mode. A duplicate stub (C4073767, no content) exists in the old suite's
        # Delete section — C4073875 is the live, populated version used here.

  - path: Functional / Barcodes
    cases:
      - title: PV — barcode/smartcard reader disconnect shows the correct banner and raises an event
        objective: This test is to confirm the PV shows the correct not-accepted banner (matching the approved UI spec) and raises/clears a back-office event when the barcode or smartcard reader disconnects and reconnects.
        refs: "TIBU-21950, TIBU-27289"
        steps: |
          **Given** the PV is in service with both the barcode reader and smartcard reader connected
          **WHEN** the barcode reader is disconnected
          **THEN** the "barcode not available" banner is displayed on the idle screen, matching the approved UI spec (pins TIBU-21950)
          **AND** event code 941 is raised in the CloudFare Activity Log (pins TIBU-27289; migrated from old-suite C4091911)
          **WHEN** the barcode reader is reconnected
          **THEN** event code 941 is cleared in the Activity Log
          **AND** the banner fully disappears from the screen, with no residual fragment left showing (migrated from old-suite C4060881, TIBU-22250)
          **WHEN** the smartcard reader is disconnected
          **THEN** the "smartcard reader not available" banner is displayed, matching the approved UI spec
        expected: Disconnecting either reader shows the correct not-accepted banner per the UI spec; the barcode reader dropout raises event 941 and clears it on reconnect; banners fully clear on reconnect with no residual fragment.
        # Migrated/grounded from OLD suite 10047 cases C4091911 (TIBU-27289, "no event for barcode
        # reader dropouts" — full GIVEN/WHEN/THEN found) and C4060881 (TIBU-22250, banner-clear
        # glitch — full GIVEN/WHEN/THEN found), found via the old-suite cross-check. TIBU-21950
        # (banner content vs UI spec) has no direct old-suite case but is the same functional area,
        # so folded into one case rather than three near-duplicates, per test-practices consolidation.

  - path: Non-Functional / PV
    cases:
      - title: PV to BOS — Device Log Manager retrieves device logs on request
        objective: This test is to confirm the PV responds to a remote log request from Device Log Manager and makes its logs available for download.
        refs: "TIBU-28139"
        steps: |
          **Given** a PV connected to the back office
          **AND** you have access to Device Log Manager
          **WHEN** you select the PV's Device Type and Device ID in Device Log Manager and request its logs (Get Files, with the to-date set to cover today)
          **THEN** the requested logs become available to download from Device Log Manager after a short wait (refresh after a few minutes)
        expected: A remote log request for a PV via Device Log Manager returns downloadable logs within a reasonable wait, rather than never completing.
        # No old-suite equivalent: the closest old-suite case (C4091913, same TIBU-28139 title) is an
        # empty stub with no preface/preconditions/steps, so this is grounded directly on the JIRA
        # ticket's own reproduction steps (Device Log Manager: select device, Get Files, Show/Refresh,
        # wait, refresh again) rather than invented, per the "ground on the ticket itself" convention.
