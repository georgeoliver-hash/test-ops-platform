# Translink PV — MISSING-path authoring pass over knowledge/flows/translink-pv-barcode.md
# (Overflow board "4. Platform Validator-Barcode", suite 30255). Covers Paths table rows
# whose "Covered by" column was the literal "MISSING" only (rows 1, 6, 7, 8, 22). All other
# rows (real case ids, GAP, FRAGMENTED, STALE) were left untouched per the authoring brief.
suite_id: 30255
defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [24]
  custom_autoconfirmation: false

sections:
  - path: [Functional, Commissioning]
    cases:
      - title: "Boot — a fully commissioned PV boots to Present SmartCard or Barcode"
        refs: MODE-ALL
        objective: |
          This test is to confirm a fully commissioned PV completes Loading and reaches the
          Present SmartCard or Barcode screen.
        steps: |
          **GIVEN** the PV is powered on and fully commissioned
          **WHEN** the device completes the Loading sequence
          **THEN** the Present SmartCard or Barcode screen is displayed
        expected: "A fully commissioned PV boots through Loading to the Present SmartCard or Barcode screen."

  - path: [Non-Functional, PV]
    cases:
      - title: "Device Fault — Smartcard Reader fault reboot attempt returns to Loading"
        refs: MODE-ALL
        objective: |
          This test is to confirm a Smartcard Reader fault's reboot-recovery attempt returns the
          PV to the Loading screen.
        steps: |
          **GIVEN** the PV is showing Present Ticket no SmartCard due to a Smartcard Reader fault
          **WHEN** the device reboots in an attempt to recover the reader
          **THEN** the Loading screen is displayed
        expected: "A Smartcard Reader fault's reboot attempt returns the PV to the Loading screen."

      - title: "Device Fault — Machine Not in Service recovers to Present SmartCard or Barcode when corrected"
        refs: MODE-ALL
        objective: |
          This test is to confirm a Machine Not in Service fault returns the PV to Present
          SmartCard or Barcode once the fault is corrected.
        steps: |
          **GIVEN** the PV is showing Machine Not in Service due to both readers being unavailable or another non-powerloss fault
          **WHEN** the fault is corrected
          **THEN** the Present SmartCard or Barcode screen is displayed
        expected: "A corrected Machine Not in Service fault returns the PV to Present SmartCard or Barcode."

      - title: "Device Fault — Machine Not in Service reboot attempt returns to Loading"
        refs: MODE-ALL
        objective: |
          This test is to confirm a Machine Not in Service fault's reboot-recovery attempt returns
          the PV to the Loading screen.
        steps: |
          **GIVEN** the PV is showing Machine Not in Service due to both readers being unavailable or another non-powerloss fault
          **WHEN** the device reboots in an attempt to recover the reader
          **THEN** the Loading screen is displayed
        expected: "A Machine Not in Service fault's reboot attempt returns the PV to the Loading screen."

  - path: [Functional, Smartcard Validation]
    cases:
      - title: "Operator Card — mismatched Technician ID leaves the device unresponsive"
        refs: MODE-ALL
        objective: |
          This test is to confirm the PV does not respond when a presented operator card's
          Operator ID does not match any Technician ID in the Stafflist.
        steps: |
          **GIVEN** the PV is in service showing Present SmartCard or Barcode
          **AND** an operator smartcard's Operator ID does not match any Technician ID in the Stafflist
          **WHEN** the operator card is presented to the reader
          **THEN** the device will not respond
        expected: "An operator card whose ID has no matching Technician in the Stafflist leaves the PV unresponsive."
