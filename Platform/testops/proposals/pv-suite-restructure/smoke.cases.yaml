# PV — Smoke (thin critical path). Run first on any build/config; each maps to a fuller Functional case.
suite_id: 30255
defaults:
  template_id: 1
  custom_autoconfirmation: false
  custom_devtypes: [10]
  custom_revstatus: 2
sections:
  - path: Smoke
    cases:
      - title: Smoke — valid smartcard validates
        objective: This test is to confirm a valid smartcard validates on the PV.
        steps: |
          **Given** the PV is in service showing the Present SmartCard or Barcode screen
          **WHEN** a valid smartcard is presented
          **THEN** the card is validated
          **AND** the success outcome is shown
        expected: A valid smartcard validates with a success outcome.
      - title: Smoke — invalid smartcard shows a reason
        objective: This test is to confirm an invalid smartcard is rejected with a reason on the PV.
        steps: |
          **Given** the PV is in service showing the Present SmartCard or Barcode screen
          **WHEN** an invalid smartcard is presented
          **THEN** the card is rejected with the specific reason shown
        expected: An invalid smartcard is rejected with the reason displayed.
      - title: Smoke — valid barcode validates
        objective: This test is to confirm a valid barcode validates on the PV.
        steps: |
          **Given** the PV is in service showing the Present SmartCard or Barcode screen
          **WHEN** a valid barcode is presented
          **THEN** the barcode is validated
        expected: A valid barcode validates.
      - title: Smoke — ABT contactless tap succeeds
        objective: This test is to confirm a valid ABT contactless tap is accepted on a Glider PV.
        steps: |
          **Given** a Glider PV has ABT enabled and is showing the Present screen
          **WHEN** a valid contactless card is tapped
          **THEN** the tap is accepted with a success outcome
        expected: A valid ABT tap is accepted.
      - title: Smoke — Technician Menu login
        objective: This test is to confirm a technician can access the Technician Menu by presenting a technician smartcard and entering a valid PIN.
        steps: |
          **Given** the PV is in service displaying the Technician Menu login screen
          **WHEN** a technician presents a valid technician smartcard and enters a valid PIN
          **THEN** the Technician Menu home screen is displayed
        expected: A valid technician smartcard and PIN reach the Technician Menu.
      - title: Smoke — PV communicates with the back office
        objective: This test is to confirm the PV can exchange data with the back office.
        steps: |
          **Given** the PV is in service
          **WHEN** communications with the back office are forced
          **THEN** the PV exchanges data with the back office successfully
        expected: The PV communicates with the back office on demand.
