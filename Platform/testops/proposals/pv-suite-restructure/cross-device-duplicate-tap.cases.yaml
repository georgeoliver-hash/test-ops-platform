sections:
  - path: [Functional, ABT (Glider)]
    cases:
      - title: Cross-device duplicate — a PV tap followed by an ETM tap at the same halt within the Same Location Time still shows Tap Successful
        objective: This test is to confirm the PV shows a normal successful-tap outcome when a customer taps the PV first and then taps the ETM at the same shared halt within the Same Location Time, even though the back office will treat the pair as a same-location duplicate.
        steps: |-
          **GIVEN** a Glider PV and a Metro ETM share a boarding halt
          **AND** the PV is showing the Present screen
          **AND** you can verify records in the CloudFare activity log and MERIT
          **WHEN** you tap a valid contactless payment card at the PV
          **THEN** the PV shows the ABT Tag successful screen to the passenger
          **AND** the success audio tone is played
          **WHEN** the same card is then tapped at the shared-halt ETM, within the configured Same Location Time
          **THEN** the ETM also shows its own normal successful-tap outcome
          **AND** neither device gives any indication that the other device's tap occurred
          **WHEN** you check the back office for both taps
          **THEN** the second (ETM) tap is recorded as a same-location duplicate and is not charged
          **AND** the PV tap's charge is unaffected
        expected: Both devices independently show a normal successful tap; the back office recognises the pair as a cross-device same-location duplicate and does not charge the second tap.
        refs: FBD-100651 7.3 paras 321-322,George-domain-knowledge-2026-07-27,MODE-GLIDER-ONLY
