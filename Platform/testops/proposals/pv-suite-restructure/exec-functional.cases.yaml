# PV (Platform Validator) — executable walk-through rewrite of the Functional +
# Non-Functional behaviour cases in suite 30255. Authored 2026-07-17. UPDATES the
# existing cases IN PLACE (push --update matches by verbatim title; where a title was
# weak it is renamed via `match:` -> new `title:`). Behaviour under test is UNCHANGED —
# each case is re-cut as a procedure a tester can follow start to finish on the axio4-PMV:
#   GIVEN = the PV state + a concrete seeded card/barcode/cEMV + the config that matters
#           + where you verify (the PV screen, then CloudFare activity log / MERIT /
#           SmartTrack, or the Technician Menu page).
#   WHEN  = the real, ordered actions (present the card/barcode, tap the cEMV, run the
#           settlement/upload, open the Technician page).
#   THEN  = what you observe and WHERE, with the named screen and value.
# 1-3 steps per case; each THEN capped at ~3 AND lines (checks split into their own step
# rather than a wall of ANDs). Single-predicate THEN/AND lines. No @tags, no [Automatable].
# EXCLUDES the HMI "Screen Validation" per-screen layer and the Smoke section (out of scope).
#
# Grounding: PV Overflow flow annotations (knowledge/flows/pv-flow-annotations.md — screens,
# LED/audio, NIR "Northern Ireland Travel Only" line, 00:00-04:00 barcode-expiry rule),
# device facts (axio4-PMV WinCE, FEIG reader, static IP 192.168.3.10 on the test rig), and
# the Translink specs FBD-100651 (Glider TOO), FBD-100690 (NIR TOTO), FBD-100167/100317
# (barcodes, CR116 early-expiry), FBD-100236/100271 (cards + legacy transfer), FBD-100720
# (pilot list), FBD-100359 (comms lock), FBD-100658 (ABT audit). refs preserved verbatim.
suite_id: 30255
defaults:
  template_id: 1
  custom_devtypes: [10]
  custom_autoconfirmation: false
  custom_revstatus: 2

sections:
  # ═════════════════════════ Smartcard Validation ═════════════════════════
  - path: Functional / Smartcard Validation
    cases:
      - title: Validate a Concession SmartPass
        objective: This test is to confirm a concession SmartPass validates when valid and is rejected with the correct reason when invalid.
        steps: |-
          **GIVEN** the axio4-PMV Platform Validator is in service showing the Present SmartCard or Barcode screen
          **AND** you have the seeded concession SmartPass test cards to hand — a valid 60+ SmartPass and an expired one
          **AND** you can verify back-office records in the CloudFare activity log, MERIT and SmartTrack
          **WHEN** you present the valid 60+ SmartPass to the reader
          **THEN** the PV shows the Tag successful screen
          **AND** the success audio tone is played
          **WHEN** you present the expired concession SmartPass
          **THEN** the PV shows the Product Expired reject screen
          **AND** no successful validation is recorded
          **WHEN** you check the back office for the accepted presentation
          **THEN** the validation appears in the CloudFare activity log
          **AND** the transaction appears in MERIT
          **AND** the updated smartcard record appears in SmartTrack
        expected: Concession SmartPasses validate (Tag successful) when valid and reject with the specific reason when invalid, recorded in CloudFare/MERIT/SmartTrack. Variation — 60+, Blind, Senior, ROI Senior, War Pensioner. Run under Glider and Rail.
      - title: Validate a Half-Fare SmartPass
        objective: This test is to confirm a Half-Fare SmartPass validates when valid and is rejected when invalid.
        steps: |-
          **GIVEN** the PV is in service showing the Present SmartCard or Barcode screen
          **AND** you have a valid DLA Half-Fare SmartPass and a Half-Fare SmartPass that is not valid at this location
          **AND** you can verify records in the CloudFare activity log, MERIT and SmartTrack
          **WHEN** you present the valid DLA Half-Fare SmartPass
          **THEN** the PV shows the Tag successful screen
          **AND** the success audio tone is played
          **WHEN** you present the Half-Fare SmartPass that is not valid here
          **THEN** the PV shows the Not Valid At This Location reject screen
          **WHEN** you check the back office for the accepted presentation
          **THEN** the validation appears in the CloudFare activity log
          **AND** the transaction appears in MERIT
          **AND** the updated smartcard record appears in SmartTrack
        expected: Half-Fare SmartPasses validate when valid and reject with the specific reason when invalid. Variation — DLA, Learning Disability, No Driving Licence, PIPS, Partially Sighted. Run under Glider and Rail.
      - title: Validate a Metro Daylink smartcard
        objective: This test is to confirm a Metro Daylink smartcard validates when valid and is rejected when invalid.
        steps: |-
          **GIVEN** the PV is in service showing the Present SmartCard or Barcode screen
          **AND** you have a valid in-date Adult Metro Daylink and an expired Metro Daylink
          **AND** you can verify records in the CloudFare activity log, MERIT and SmartTrack
          **WHEN** you present the valid Metro Daylink
          **THEN** the PV shows the Tag successful screen
          **AND** the success audio tone is played
          **WHEN** you present the expired Metro Daylink
          **THEN** the PV shows the Product Expired reject screen
          **WHEN** you check the back office for the accepted presentation
          **THEN** the validation appears in the CloudFare activity log
          **AND** the transaction appears in MERIT
          **AND** the updated smartcard record appears in SmartTrack
        expected: Metro Daylink validates (Tag successful) when valid and rejects with the reason when invalid. Run for Adult and Child, under Glider and Rail.
      - title: Validate a Metro Multi-Journey smartcard
        objective: This test is to confirm a Metro Multi-Journey smartcard validates in its zone (deducting a journey) and is rejected out of zone or when invalid.
        steps: |-
          **GIVEN** the PV is in service showing the Present SmartCard or Barcode screen, configured for the Metro City zone
          **AND** you have a City-zone Adult Metro Multi-Journey card with journeys remaining, and the same product configured for the Inner zone (out of zone here)
          **AND** you can verify records in the CloudFare activity log, MERIT and SmartTrack
          **WHEN** you present the City-zone Multi-Journey card within its zone
          **THEN** the PV shows the Tag successful screen
          **AND** one journey is deducted with the passback rules applied
          **WHEN** you present the out-of-zone (Inner) Multi-Journey card
          **THEN** the PV shows the Not Valid At This Location reject screen
          **WHEN** you check the back office for the accepted presentation
          **THEN** the validation and journey deduction appear in the CloudFare activity log
          **AND** the transaction appears in MERIT
          **AND** the updated smartcard record appears in SmartTrack
        expected: Metro Multi-Journey validates within its zone (one journey deducted, passback applied) and rejects out-of-zone/invalid. Variation — City, Inner, Extended zones; Adult and Child. Run under Glider and Rail.
      - title: Validate a Metro Travelcard
        objective: This test is to confirm a Metro Travelcard validates when valid and is rejected when invalid.
        steps: |-
          **GIVEN** the PV is in service showing the Present SmartCard or Barcode screen
          **AND** you have a valid in-date Adult Metro Travelcard and an expired Metro Travelcard
          **AND** you can verify records in the CloudFare activity log, MERIT and SmartTrack
          **WHEN** you present the valid Metro Travelcard
          **THEN** the PV shows the Tag successful screen
          **AND** the success audio tone is played
          **WHEN** you present the expired Metro Travelcard
          **THEN** the PV shows the Product Expired reject screen
          **WHEN** you check the back office for the accepted presentation
          **THEN** the validation appears in the CloudFare activity log
          **AND** the transaction appears in MERIT
          **AND** the updated smartcard record appears in SmartTrack
        expected: Metro Travelcard validates when valid and rejects with the reason when invalid. Run for Adult and Child, under Glider and Rail.
      - title: Validate an Ulsterbus Multi-Journey smartcard
        objective: This test is to confirm an Ulsterbus Multi-Journey smartcard validates (deducting a journey) when valid and is rejected when invalid.
        steps: |-
          **GIVEN** the PV is in service showing the Present SmartCard or Barcode screen
          **AND** you have an Adult Ulsterbus Multi-Journey card with journeys remaining, and one with no journeys left
          **AND** you can verify records in the CloudFare activity log, MERIT and SmartTrack
          **WHEN** you present the card with journeys remaining
          **THEN** the PV shows the Tag successful screen
          **AND** one journey is deducted with the passback rules applied
          **WHEN** you present the card with no journeys left
          **THEN** the PV shows the No Journeys Left reject screen
          **WHEN** you check the back office for the accepted presentation
          **THEN** the validation and journey deduction appear in the CloudFare activity log
          **AND** the transaction appears in MERIT
          **AND** the updated smartcard record appears in SmartTrack
        expected: Ulsterbus Multi-Journey validates (one journey deducted) when valid and rejects when invalid/exhausted. Run for Adult and Child, under Glider and Rail.
      - title: Validate an iLink smartcard
        objective: This test is to confirm an iLink smartcard (and Belfast Visitor Pass) validates in its zone and is rejected out of zone or when invalid.
        steps: |-
          **GIVEN** a Rail PV at Botanic is in service showing the Present SmartCard or Barcode screen
          **AND** you have a valid iLink Zone 4 smartcard (valid at Botanic) and an iLink card whose zone does not cover Botanic
          **AND** you can verify records in the CloudFare activity log, MERIT and SmartTrack
          **WHEN** you present the valid in-zone iLink card
          **THEN** the PV shows the Tag successful screen
          **AND** the success audio tone is played
          **WHEN** you present the out-of-zone iLink card
          **THEN** the PV shows the Not Valid At This Location reject screen
          **WHEN** you check the back office for the accepted presentation
          **THEN** the validation appears in the CloudFare activity log
          **AND** the transaction appears in MERIT
          **AND** the updated smartcard record appears in SmartTrack
        expected: iLink validates within its zone and rejects out-of-zone/invalid. Variation — Zones 1-4 and NW, plus Belfast Visitor Pass; Adult and Child. Run under Glider and Rail.
      - title: Validate an aLink smartcard
        objective: This test is to confirm an aLink smartcard validates when valid and is rejected when invalid.
        steps: |-
          **GIVEN** the PV is in service showing the Present SmartCard or Barcode screen
          **AND** you have a valid in-date aLink smartcard and an expired aLink smartcard
          **AND** you can verify records in the CloudFare activity log, MERIT and SmartTrack
          **WHEN** you present the valid aLink smartcard
          **THEN** the PV shows the Tag successful screen
          **AND** the success audio tone is played
          **WHEN** you present the expired aLink smartcard
          **THEN** the PV shows the Product Expired reject screen
          **WHEN** you check the back office for the accepted presentation
          **THEN** the validation appears in the CloudFare activity log
          **AND** the transaction appears in MERIT
          **AND** the updated smartcard record appears in SmartTrack
        expected: aLink validates when valid and rejects with the reason when invalid. Run under Glider and Rail.
      - title: Validate a yLink or 24+ smartcard
        objective: This test is to confirm a yLink/24+ smartcard validates within its valid time and is rejected outside it.
        steps: |-
          **GIVEN** the PV is in service showing the Present SmartCard or Barcode screen
          **AND** you have a valid yLink (or 24+) smartcard presented within its valid time band, and one presented outside its valid time band
          **AND** you can verify records in the CloudFare activity log, MERIT and SmartTrack
          **WHEN** you present the yLink/24+ card within its valid time
          **THEN** the PV shows the Tag successful screen
          **AND** the success audio tone is played
          **WHEN** you present the yLink/24+ card outside its valid time
          **THEN** the PV shows the Invalid Time Of Day reject screen
          **WHEN** you check the back office for the accepted presentation
          **THEN** the validation appears in the CloudFare activity log
          **AND** the transaction appears in MERIT
          **AND** the updated smartcard record appears in SmartTrack
        expected: yLink/24+ validates within its valid time and rejects (Invalid Time Of Day) outside it. Run under Glider and Rail.
      - title: Validate a Translink Employee smartcard
        objective: This test is to confirm a Translink employee smartcard validates when valid and is rejected when invalid.
        steps: |-
          **GIVEN** the PV is in service showing the Present SmartCard or Barcode screen
          **AND** you have a valid Staff employee smartcard and an expired/withdrawn employee smartcard
          **AND** you can verify records in the CloudFare activity log, MERIT and SmartTrack
          **WHEN** you present the valid Staff smartcard
          **THEN** the PV shows the Tag successful screen
          **AND** the success audio tone is played
          **WHEN** you present the expired/withdrawn employee smartcard
          **THEN** the PV shows the Product Expired reject screen
          **WHEN** you check the back office for the accepted presentation
          **THEN** the validation appears in the CloudFare activity log
          **AND** the transaction appears in MERIT
          **AND** the updated smartcard record appears in SmartTrack
        expected: Employee smartcards validate when valid and reject when invalid. Variation — Staff, Staff Partner, Retired Staff, External Staff, Dependents Pass. Run under Glider and Rail.
      - title: Validate an EA Smartpass (Pupil and Further Education)
        objective: This test is to confirm an EA Smartpass validates within its valid times and is rejected outside them.
        steps: |-
          **GIVEN** the PV is in service showing the Present SmartCard or Barcode screen
          **AND** you have a valid EA Pupil Smartpass presented on a school-term weekday within its valid time
          **AND** you have the same pass to present at a weekend (or during a school holiday, or before start / after expiry / outside the valid time)
          **AND** you can verify records in the CloudFare activity log, MERIT and SmartTrack
          **WHEN** you present the EA Smartpass within its valid time on a school day
          **THEN** the PV shows the Tag successful screen
          **WHEN** you present it at a weekend / holiday / outside the valid time
          **THEN** the PV shows the Invalid Time Of Day reject screen
          **WHEN** you check the back office for the accepted presentation
          **THEN** the validation appears in the CloudFare activity log
          **AND** the transaction appears in MERIT
          **AND** the updated smartcard record appears in SmartTrack
        expected: EA Smartpasses validate within valid times and reject outside them (before start, after expiry, outside time, weekend, school holiday). Variation — Pupil, Further Education; EA Bus (Glider) and EA Rail.
      - title: Smartcard — inter-device top-up then validate on PV
        objective: This test is to confirm a smartcard topped up on another device validates correctly on the PV, including the expiry edge cases.
        steps: |-
          **GIVEN** a Metro Travelcard has been topped up on a POS (or a legacy device), not on the PV
          **AND** the PV is in service showing the Present SmartCard or Barcode screen
          **AND** you also have a card that was topped up on its last day of travel and one with no days remaining
          **AND** you can verify records in the CloudFare activity log, MERIT and SmartTrack
          **WHEN** you present the card topped up elsewhere to the PV
          **THEN** the PV validates it (Tag successful) reflecting the top-up made on the other device
          **WHEN** you present the last-day-of-travel card and the no-days-remaining card
          **THEN** the PV applies the corresponding outcome (accepted on the last valid day; No Days Left when exhausted)
          **WHEN** you check the back office for the accepted presentation
          **THEN** the validation appears in the CloudFare activity log
          **AND** the transaction appears in MERIT
          **AND** the updated smartcard record appears in SmartTrack
        expected: A card topped up elsewhere (POS/legacy) validates on the PV; last-day / expired-journeys / no-days-remaining edge cases are handled. Run for Metro Travelcard and iLink Zones 1-4/NW, Adult and Child, under Glider and Rail.

  # ═════════════════════════ Validation Outcomes ═════════════════════════
  - path: Functional / Validation Outcomes
    cases:
      - title: Validation — invalid reasons displayed
        objective: This test is to confirm the PV shows the correct reason screen for each kind of invalid presentation.
        steps: |-
          **GIVEN** the PV is in service showing the Present SmartCard or Barcode screen
          **AND** you have a seeded card for each invalid condition (wrong location, wrong time band, expired product, hotlisted, wrong zone, unreadable)
          **AND** you can verify denied validations in the CloudFare activity log, MERIT and SmartTrack
          **WHEN** you present a card that cannot be validated for a given reason
          **THEN** the PV shows the matching reason screen for that condition
          **WHEN** you check the back office after the denied presentation
          **THEN** the denied validation is recorded in the CloudFare activity log, MERIT and SmartTrack
        expected: The correct reason screen is shown per condition — Not Valid At This Location, Invalid Time Of Day, Product Expired, hotlisted, wrong zone, Unable to Validate, Represent Card — and each denied validation is recorded in CloudFare/MERIT/SmartTrack.
      - title: Validation — passback
        objective: This test is to confirm passback is applied when a card is re-presented within the passback period, showing the journeys/period remaining.
        steps: |-
          **GIVEN** the PV is in service showing the Present SmartCard or Barcode screen
          **AND** a Metro Multi-Journey card has just been validated on the PV (so it is inside its passback period)
          **AND** you can verify records in the CloudFare activity log, MERIT and SmartTrack
          **WHEN** you present the same card again within the passback period
          **THEN** the PV shows the Passback Journeys Left screen (or Passback Days Left for a period product)
          **AND** passback is applied per the product rules with no extra journey deducted
          **WHEN** you check the back office for the passback event
          **THEN** the passback validation is recorded in CloudFare, MERIT and SmartTrack
        expected: On re-presentation within the passback period the PV applies passback (no extra deduction) and shows Passback Journeys Left / Passback Days Left, recorded in CloudFare/MERIT/SmartTrack.
      - title: Validation — machine not in service
        objective: This test is to confirm the PV shows Machine Not In Service and does not validate when it is out of service.
        steps: |-
          **GIVEN** the PV is out of service (outside operating times or manually taken out of service)
          **AND** the display shows the Machine Not In Service screen
          **WHEN** a passenger presents a valid smartcard
          **THEN** the PV continues to show the Machine Not In Service screen
          **AND** no validation occurs and no journey is deducted
        expected: An out-of-service PV shows Machine Not In Service and does not validate the presented card.
      - title: Validation — offline transaction
        objective: This test is to confirm the PV validates offline when back-office comms are unavailable and uploads the offline transactions once comms return.
        steps: |-
          **GIVEN** the PV is in service but has lost back-office communications
          **AND** you have a valid smartcard and can verify the CloudFare activity log once comms return
          **WHEN** you present the valid card while comms are down
          **THEN** the PV validates it offline within the offline rules (Tag successful) and queues the transaction on-device
          **WHEN** communications are restored and the PV next communicates
          **THEN** the queued offline transactions are uploaded and appear in the CloudFare activity log
        expected: The PV validates offline within limits while comms are down and uploads the queued offline transactions to CloudFare when comms return.

  # ═════════════════════════ Rail-specific ═════════════════════════
  - path: Functional / Rail-specific
    cases:
      - title: Rail — NIR transfer validation
        objective: This test is to confirm NIR transfer validation on a Rail PV across the transfer-eligible products.
        steps: |-
          **GIVEN** a Rail (NIR) PV is in service showing the Present SmartCard or Barcode screen
          **AND** you have a transfer-eligible iLink smartcard that has just made a first NIR journey (inside its transfer window) and a non-eligible smartcard
          **AND** you can verify records in the CloudFare activity log, MERIT and SmartTrack
          **WHEN** you present the transfer-eligible card for the connecting NIR journey inside the transfer window
          **THEN** the PV validates it as a transfer per the transfer rules (no new journey charged)
          **WHEN** you present the non-eligible card for the transfer
          **THEN** the PV rejects it with the specific reason shown
          **WHEN** you check the back office for the transfer
          **THEN** the transfer validation is recorded in CloudFare, MERIT and SmartTrack
        expected: NIR transfers validate for eligible products (recorded as a transfer) and reject otherwise. Variation — iLink, Belfast Visitor, Staff Smartpass, aLink, EA Pupil/FE; Adult and Child. (Rail mode.)
      - title: Rail — zone validation
        objective: This test is to confirm zone-based validation on a Rail PV.
        steps: |-
          **GIVEN** a Rail PV at a station within a defined zone is in service showing the Present SmartCard or Barcode screen
          **AND** you have a zonal smartcard valid for this station's zone and one whose zone does not cover this station
          **AND** you can verify records in the CloudFare activity log, MERIT and SmartTrack
          **WHEN** you present the in-zone zonal smartcard
          **THEN** the PV validates it for the zone (Tag successful)
          **WHEN** you present the out-of-zone smartcard
          **THEN** the PV rejects it as not valid for this zone (Not Valid At This Location)
          **WHEN** you check the back office for the accepted presentation
          **THEN** the validation is recorded in CloudFare, MERIT and SmartTrack
        expected: Zonal validation accepts an in-zone card and rejects an out-of-zone card. (Rail mode.)
      - title: Rail — ABT tap success shows the Northern Ireland travel line
        objective: This test is to confirm a successful ABT tap on a Rail/NIR PV displays the additional Northern Ireland travel line on the success screen.
        steps: |-
          **GIVEN** a Rail/NIR PV has ABT enabled and is showing the Present screen
          **AND** you have a valid contactless payment card accepted for an NIR tap
          **WHEN** you tap the valid contactless card and it is accepted
          **THEN** the PV shows the ABT Tag successful screen
          **AND** the success screen displays the additional line "Northern Ireland Travel Only"
        expected: On a Rail/NIR PV a successful ABT tap shows the ABT Tag successful screen with the additional "Northern Ireland Travel Only" line.

  # ═════════════════════════ ABT (Glider) ═════════════════════════
  - path: Functional / ABT (Glider)
    cases:
      - title: ABT — contactless tap validation
        objective: This test is to confirm a valid contactless payment card is accepted for an ABT tap on a Glider PV.
        steps: |-
          **GIVEN** a Glider PV on a Tap-On-Only route has ABT/cEMV enabled and is showing the Present screen
          **AND** you have a valid contactless Visa payment card (or Mastercard / mobile wallet)
          **AND** you can verify records in the CloudFare activity log and MERIT
          **WHEN** you tap the valid contactless card at the reader
          **THEN** the PV shows the ABT Tag successful screen to the passenger
          **AND** the success audio tone is played
          **WHEN** you check the back office for the tap
          **THEN** the accepted tap appears in the CloudFare activity log
          **AND** the transaction appears in MERIT
        expected: A valid contactless tap is accepted (ABT Tag successful) and recorded in CloudFare/MERIT. Variation — Visa, Mastercard, mobile wallet.
      - title: ABT — declined or errored tap
        objective: This test is to confirm a declined or errored ABT tap shows the correct outcome.
        steps: |-
          **GIVEN** a Glider PV has ABT/cEMV enabled and is showing the Present screen
          **AND** you have a card that is declined, expired or deliberately mis-read
          **AND** you can verify records in the CloudFare activity log and MERIT
          **WHEN** you tap the declined/expired/mis-read card
          **THEN** the PV rejects the tap
          **AND** the Please Try Again / decline outcome is shown
          **WHEN** you check the back office for the tap
          **THEN** the declined tap is recorded in the CloudFare activity log
          **AND** the transaction appears in MERIT
        expected: Declined/errored taps are rejected with the Please Try Again / decline outcome and recorded in CloudFare/MERIT.
      - title: ABT — BIN, Deny and Pilot list handling
        objective: This test is to confirm cards on the BIN, Deny and Pilot lists are handled correctly.
        steps: |-
          **GIVEN** a Glider PV has the BIN, Deny and Pilot lists applied via TMS
          **AND** you have a card on the Deny list, a card whose BIN is blocked, and a card governed by the Pilot list
          **AND** you can verify records in the CloudFare activity log
          **WHEN** you present the Deny-listed or BIN-blocked card
          **THEN** the PV rejects the tap per the list rules
          **WHEN** you present the Pilot-list card
          **THEN** the PV handles the tap per the pilot rules (accepted if enrolled, rejected if not)
          **WHEN** you check the back office
          **THEN** the outcomes are recorded in the CloudFare activity log
        expected: Deny/BIN-listed cards are rejected; Pilot-list cards follow the pilot rules; outcomes recorded in CloudFare.
      - title: cEMV — tap enablement by route, location and fare
        objective: This test is to confirm cEMV taps are enabled only where the route attribute, location and fare checks all permit.
        steps: |-
          **GIVEN** a Glider PV uses route-attribute, location and fare checks to enable cEMV
          **AND** you can place the PV in a context where all three checks pass, and one where a check fails
          **AND** you can verify records in the CloudFare activity log and MERIT
          **WHEN** the PV is in a context where the route attribute, location and fare checks all pass
          **THEN** cEMV taps are enabled
          **AND** a tap is accepted
          **WHEN** any of the route, location or fare checks fail
          **THEN** cEMV taps are disabled in that context and no cEMV tap is taken
          **WHEN** you check the back office for the accepted tap
          **THEN** the tap appears in the CloudFare activity log and MERIT
        expected: cEMV is enabled only when route/location/fare checks all pass, and disabled otherwise; accepted taps recorded in CloudFare/MERIT.
      - title: Glider TOO — tap-on-only flat-fare journeys
        objective: This test is to confirm tap-on-only flat-fare journeys and daily/duplicate tap rules on a Glider PV.
        steps: |-
          **GIVEN** a Glider PV is on a Tap-On-Only flat-fare route (e.g. Glider G1) and is showing the Present screen
          **AND** you have a valid contactless card
          **AND** you can verify records in the CloudFare activity log and MERIT
          **WHEN** the passenger taps on for a journey
          **THEN** the PV records a flat-fare journey (ABT Tag successful)
          **WHEN** the same card taps again shortly after, and multiple times across the day
          **THEN** the duplicate-tap and daily-tap rules are applied (the immediate re-tap is treated as passback, not a second fare)
          **WHEN** you check the back office for the journeys
          **THEN** the flat-fare journey appears in the CloudFare activity log and MERIT
        expected: TOO flat-fare journeys record correctly; daily-tap and duplicate-tap rules apply; recorded in CloudFare/MERIT.
      - title: Glider — transfers
        objective: This test is to confirm Glider transfer journeys are recognised within the transfer window.
        steps: |-
          **GIVEN** a Glider PV has ABT enabled and is showing the Present screen
          **AND** a contactless card has just tapped a first Glider journey (inside its transfer window)
          **AND** you can verify records in the CloudFare activity log and MERIT
          **WHEN** the card taps a connecting Glider journey within the transfer window
          **THEN** the PV recognises the tap as a transfer per the transfer rules (no second fare)
          **WHEN** you check the back office for the connecting tap
          **THEN** the transfer appears in the CloudFare activity log and MERIT
        expected: Glider transfers are recognised within the transfer window (no second fare) and recorded in CloudFare/MERIT.
      - title: ABT — end-to-end journey to back office
        objective: This test is to confirm an ABT journey is recorded and sent to the back office end-to-end.
        steps: |-
          **GIVEN** a Glider PV with ABT enabled and back-office comms available is showing the Present screen
          **AND** you have a valid contactless card and can verify the CloudFare activity log and MERIT
          **WHEN** the passenger completes an ABT journey by tapping the card
          **THEN** the PV records the journey (ABT Tag successful)
          **AND** the journey is sent to the back office for settlement
          **WHEN** you check the back office end-to-end
          **THEN** the journey appears in the CloudFare activity log and in MERIT
        expected: An ABT journey is recorded on the PV and reaches the back office end-to-end (CloudFare, MERIT).
      - title: ABT — Pilot List management and validation
        objective: This test is to confirm the cEMV Pilot List can be configured and applied, and that EMV cards are handled per their pilot-list membership.
        steps: |-
          **GIVEN** a Glider PV with cEMV is configured for the Pilot List via TMS
          **AND** you have a pilotlist.zip to apply (including registration mode), an EMV card on the list and one not on the list
          **AND** you can verify records in the CloudFare activity log and export via Device Log Manager
          **WHEN** you apply the pilot list (pilotlist.zip) to the PV via TMS, including registration mode
          **THEN** the PV applies the pilot list configuration
          **WHEN** you present an EMV card that is on the Pilot List, then one that is not
          **THEN** the on-list card is accepted per the pilot rules
          **AND** the not-on-list card is handled per the not-included rule
          **WHEN** you export the pilot list
          **THEN** it converts from CSV to DAT and downloads as CSV from Device Log Manager
        expected: Pilot List TMS config + registration mode apply; on-list EMV accepted, not-on-list handled; CSV-to-DAT conversion and Device Log Manager CSV download supported; recorded in CloudFare.
      - title: ABT — Deny and BIN list updates
        refs: TIBU-26320, TIBU-25745
        objective: This test is to confirm the PV downloads and applies delta and full Deny/BIN list updates, retries on failure, and validates against them.
        steps: |-
          **GIVEN** a Glider PV with cEMV and back-office comms is showing the Present screen
          **AND** the back office can publish delta and full Deny/BIN list updates
          **AND** you have a card on the Deny/BIN list and can verify the CloudFare activity log
          **WHEN** delta and full Deny/BIN list updates are published
          **THEN** the PV downloads and applies them, taking the full lists at end of day and deltas on schedule
          **WHEN** a list download is forced to fail
          **THEN** the PV retries the download and application
          **WHEN** you present a Deny/BIN-listed card, then re-present it after it is removed from the list
          **THEN** the listed card is rejected
          **AND** the removed card is accepted
        expected: Delta + full Deny/BIN updates download and apply (full at end-of-day, delta scheduled) with retries; listed cards rejected, removed cards accepted. Pins TIBU-26320 (Deny download fail) and TIBU-25745 (BIN download fail).
      - title: FEIG — reader software management
        objective: This test is to confirm the FEIG reader software and OS can be deployed and viewed via CloudFare TMS.
        steps: |-
          **GIVEN** a Glider PV with a FEIG reader is connected to CloudFare TMS
          **AND** newer Transparent, PCA and FEIG OS versions are staged for deployment
          **WHEN** you deploy the FEIG software over the air via TMS
          **THEN** only the newest Transparent, PCA and FEIG OS versions are deployed to the reader
          **WHEN** the technician views the FEIG software versions on the PV
          **THEN** the current FEIG software versions are displayed
        expected: FEIG software/OS deploys OTA via TMS (newest Transparent/PCA/OS only); the current FEIG versions are viewable on the PV.
      - title: FEIG — card reading
        objective: This test is to confirm the FEIG reader reads ITSO smartcards and accepts valid / rejects invalid EMV taps.
        steps: |-
          **GIVEN** a Glider PV with a FEIG reader is in service
          **AND** you have an ITSO smartcard, a valid EMV card and an invalid EMV card
          **AND** you can verify records in the CloudFare activity log and MERIT
          **WHEN** you tap the ITSO smartcard
          **THEN** the FEIG reads and validates the smartcard
          **WHEN** you tap the valid EMV card, then the invalid EMV card
          **THEN** the valid EMV tap is accepted
          **AND** the invalid one is rejected with the reason
          **WHEN** you check the back office
          **THEN** the taps are recorded in the CloudFare activity log and MERIT
        expected: The FEIG reads ITSO smartcards and accepts valid / rejects invalid EMV taps, recorded in CloudFare/MERIT.
      - title: cEMV — decline reasons and route-type enablement
        objective: This test is to confirm cEMV decline reasons show Please Try Again, and that taps enable per route type and are disabled where they should be.
        steps: |-
          **GIVEN** a Glider PV with cEMV is showing the Present screen
          **AND** you have cards for each decline condition (ODA fail, unsupported scheme e.g. AMEX, expired, invalid BIN, AID fail, card clash, deny/negative list, unreadable)
          **AND** you can verify records in the CloudFare activity log
          **WHEN** you present a card that hits one of those decline conditions
          **THEN** the PV shows the Please Try Again outcome with the corresponding decline reason
          **WHEN** the route is "Tap On Only (Flat Fare)" or "Tap On Tap Off"
          **THEN** cEMV taps are enabled for that route type
          **WHEN** no valid fare is found, the boarding location is outside the configured area, or cEMV is disabled in the Technician Menu
          **THEN** cEMV taps are disabled
        expected: cEMV declines on ODA fail / unsupported scheme (AMEX) / expired / invalid BIN / AID fail / card clash / deny or negative list / unread, showing Please Try Again with the reason; enables for Tap-On-Only and Tap-On-Tap-Off routes; disables on no-fare / out-of-area / Technician-Menu-disable.
      - title: cEMV — JourneyTap audit and alighting-stage derivation
        objective: This test is to confirm a successful cEMV tap is audited as a JourneyTap and that the alighting stage is derived correctly.
        steps: |-
          **GIVEN** a Glider PV with cEMV on a Tap-On-Only route is showing the Present screen
          **AND** you have a valid contactless card and can verify the CloudFare activity log and MERIT
          **WHEN** you make a successful cEMV tap
          **THEN** the tap is audited as a "JourneyTap" in CloudFare
          **AND** the alighting stage is derived from the Furthest Alighting Point file
          **WHEN** you review the data in MERIT
          **THEN** the transaction appears in MERIT
        expected: A successful cEMV tap is audited as a JourneyTap, with the alighting stage derived from the Furthest Alighting Point file; appears in MERIT.
      - title: cEMV — tap audit content (JourneyTap, stop/stage, direction, payment method)
        refs: TIBU-22332, TIBU-30476, TIBU-28856, TIBU-28645
        objective: This test is to confirm a successful Glider TOO cEMV tap audits the correct content to the back office.
        steps: |-
          **GIVEN** a Glider PV with cEMV on a Tap On Only route is showing the Present screen
          **AND** you have a valid contactless card and can inspect the audit record in CloudFare and the transaction in MERIT
          **WHEN** you make a successful cEMV tap
          **THEN** the tap is audited as a "JourneyTap" in CloudFare
          **AND** the audit records both the stop id and the stage id
          **AND** the tap direction is audited correctly as IN
          **AND** the payment method is audited correctly for the Glider TOO transaction
          **WHEN** you review the data in MERIT
          **THEN** the transaction appears in MERIT
        expected: A cEMV TOO tap audits as a JourneyTap with both stop id and stage id, the correct direction (IN, not OUT) and the correct payment method; appears in MERIT.
      - title: cEMV — EMV result screens and transaction generation
        refs: TIBU-25700, TIBU-25702, TIBU-25704, TIBU-25705
        objective: This test is to confirm the EMV success, failure and passback screens behave correctly and that failed taps still generate a transaction.
        steps: |-
          **GIVEN** a Glider PV with cEMV is showing the Present screen
          **AND** you have a contactless card that can succeed and one that fails, plus a smartcard
          **AND** you can verify records in the CloudFare activity log and MERIT
          **WHEN** you make a cEMV tap that succeeds and one that fails
          **THEN** the correct EMV success or failure screen is shown
          **AND** the EMV result screen times out after the configured period rather than persisting
          **WHEN** you present a smartcard while an EMV success/failure screen is shown, and re-present a card for EMV passback
          **THEN** the smartcard tap is accepted
          **AND** the correct EMV passback screen is shown
          **WHEN** you inspect the back office for a failed EMV tap
          **THEN** a transaction is still generated for the failed tap
          **AND** it is recorded in CloudFare/MERIT
        expected: EMV success/failure/passback screens are correct and time out (do not persist); smartcards tap on those screens; failed EMV taps still generate a transaction, recorded in CloudFare/MERIT.

  # ═════════════════════════ ABT Audit ═════════════════════════
  - path: Functional / ABT Audit
    cases:
      - title: NIR Audit — a rail TOTO tap posts a conformant PV audit record
        refs: FBD-100690,FBD-100658
        objective: This test is to confirm a rail tap on a NIR PV posts an ABT audit record with the TOTO structure, single location and the constant ABT fields.
        steps: |-
          **GIVEN** a NIR PV whose home-location first route carries ABT Type "Tap On Tap Off" and whose boarding location is within the Northern Ireland Zone
          **AND** example tap: a cEMV card tapped at Lanyon Place against the configured "ABT Tap Product Name" product (product id 6000)
          **AND** you can inspect the audit record in the CloudFare activity log
          **WHEN** the tap posts its ABT audit record to CloudFare
          **THEN** the record uses the TotoTap/Location structure with a single tap location
          **AND** the product id is 6000
          **AND** the paymentType is "ABT"
          **AND** the revenue is 0
        expected: A NIR PV rail tap audits as a TOTO record with a single Location, product id 6000, paymentType "ABT" and revenue 0.

  # ═════════════════════════ Barcode Validation ═════════════════════════
  - path: Functional / Barcode Validation
    cases:
      - title: Single-Use Barcode — rejected as not accepted on this device
        refs: FBD-100167,FBD-100317
        objective: This test is to confirm the PV rejects a single-use barcode because the PV validates multiple-use barcodes only.
        steps: |-
          **GIVEN** a PV is in service with its barcode reader armed
          **AND** the PV validates multiple-use barcodes only (single-use is validated by POS and TVM, never the PV)
          **AND** example media: a Corethree single-use Walk-up (type W) barcode, Scheme ID 5720
          **WHEN** a passenger presents the single-use barcode to the PV reader
          **THEN** the barcode is rejected
          **AND** the screen shows "This Barcode Type is not accepted on this device"
          **AND** no successful validation is recorded
        expected: A single-use barcode is rejected on the PV with "This Barcode Type is not accepted on this device"; the PV validates multiple-use only. This is the correct behaviour that supersedes C4101005.
      - title: Multiple-Use Barcode — a valid barcode shows the green success result
        refs: FBD-100167
        objective: This test is to confirm the PV validates a valid multiple-use barcode and shows the green success result state.
        steps: |-
          **GIVEN** a PV is in service with its barcode reader armed
          **AND** example media: a Corethree mLink multiple-use barcode (format 02, Scheme ID 5720, mode BUS 0001) for a valid in-date product, presented on the signed-on route between its boarding and alighting stops
          **WHEN** the passenger presents the valid multiple-use barcode
          **THEN** the PV displays a green-tick success result
          **AND** a success audio tone is played
        expected: A valid multiple-use barcode validates on the PV with a green-tick result and success tone.
      - title: Multiple-Use Barcode — an invalid barcode shows the red failure result
        refs: FBD-100167
        objective: This test is to confirm the PV rejects an invalid multiple-use barcode and shows the red failure result state.
        steps: |-
          **GIVEN** a PV is in service with its barcode reader armed
          **AND** example media: a Corethree multiple-use barcode (format 02, Scheme ID 5720) whose expiry has passed, so the current time is later than its encoded End time
          **WHEN** the passenger presents the expired multiple-use barcode
          **THEN** the PV displays a red-cross failure result
          **AND** the screen shows the failure reason
        expected: An expired (invalid) multiple-use barcode is rejected on the PV with a red-cross result and a stated reason.

  # ═════════════════════════ Barcodes (legacy section) ═════════════════════════
  - path: Functional / Barcodes
    cases:
      - title: Barcode — single-use validation
        objective: This test is to confirm a single-use barcode validates when valid and is rejected with the reason when invalid.
        steps: |-
          **GIVEN** the PV is in service showing the Present SmartCard or Barcode screen with its barcode reader armed
          **AND** you have a valid single-use barcode and an invalid one (already used / expired / decryption failed / invalid product)
          **AND** you can verify records in the CloudFare activity log and MERIT
          **WHEN** you present the valid single-use barcode
          **THEN** the PV validates it
          **AND** the PV shows the barcode success result
          **WHEN** you present the invalid single-use barcode
          **THEN** the PV rejects it with the specific reason shown
          **WHEN** you check the back office for the validation
          **THEN** the validation is recorded in the CloudFare activity log and MERIT
        expected: Single-use barcodes validate when valid and reject with the reason when invalid (already used, expired, decryption failed, invalid product); recorded in CloudFare/MERIT.
      - title: Barcode — multi-use validation
        objective: This test is to confirm a multi-use barcode validates and tracks its remaining uses, for HHD- and TVM-produced barcodes.
        steps: |-
          **GIVEN** the PV is in service showing the Present SmartCard or Barcode screen with its barcode reader armed
          **AND** you have a valid multi-use barcode with uses remaining and one presented beyond its allowed uses
          **AND** you can verify records in the CloudFare activity log and MERIT
          **WHEN** you present the valid multi-use barcode
          **THEN** the PV validates it
          **AND** the PV shows the success result
          **AND** one use is recorded (remaining uses decremented)
          **WHEN** you present the barcode beyond its allowed uses or an invalid one
          **THEN** the PV rejects it with the specific reason shown
          **WHEN** you check the back office for the validation
          **THEN** the validation is recorded in the CloudFare activity log and MERIT
        expected: Multi-use barcodes validate and decrement remaining uses; reject when exhausted/invalid; recorded in CloudFare/MERIT. Variation — HHD-produced and TVM-produced. (In the live NIR regression.)
      - title: Barcode — early-morning expiry displays the previous day
        objective: This test is to confirm a barcode whose expiry time falls between 00:00 and 04:00 shows the previous day as the expiry date on the validation success screen.
        steps: |-
          **GIVEN** the PV is in service showing the Present SmartCard or Barcode screen
          **AND** example media: a valid multiple-use barcode whose encoded expiry time falls between 00:00 and 04:00 (per the CR116 early-expiry rule)
          **AND** you can verify records in the CloudFare activity log and MERIT
          **WHEN** you present the barcode with the early-morning expiry
          **THEN** the PV validates it
          **AND** the PV shows the barcode success screen
          **AND** the success screen displays the previous day as the expiry date
          **WHEN** you check the back office for the validation
          **THEN** the validation is recorded in the CloudFare activity log and MERIT
        expected: A barcode expiring between 00:00 and 04:00 validates and the success screen shows the previous day as the expiry date; recorded in CloudFare/MERIT.

  # ═════════════════════════ Commissioning ═════════════════════════
  - path: Functional / Commissioning
    cases:
      - title: PV commissioning — uncommissioned until location programmed
        objective: This test is to confirm an uncommissioned PV shows unprogrammed status-bar values until a technician signs in with comms and programs the location details.
        steps: |-
          **GIVEN** an uncommissioned PV with an unprogrammed Plinth-ID
          **AND** you have a technician smartcard + PIN and the PV has back-office comms available
          **WHEN** the device starts up before any location is programmed
          **THEN** the status bar shows no programmed Device ID, Sub Location or Location values
          **WHEN** the technician signs in (with comms) and programs the location details
          **THEN** the status bar displays the programmed Device ID, Sub Location and Location
          **WHEN** you check the back office
          **THEN** the commissioning is reflected in the CloudFare activity log
        expected: An uncommissioned PV shows unprogrammed status-bar values; once a technician signs in (with comms) and programs the location, the Device ID, Sub Location and Location are displayed and reflected in CloudFare.

  # ═════════════════════════ Legacy & Card Tech ═════════════════════════
  - path: Functional / Legacy & Card Tech
    cases:
      - title: Legacy Smartcard — journey- and time-based cards validate
        match: Legacy smartcard support
        objective: This test is to confirm the PV validates legacy journey-based and time-based smartcards and rejects invalid ones.
        steps: |-
          **GIVEN** the PV is in service showing the Present SmartCard or Barcode screen
          **AND** you have a valid legacy journey-based smartcard, a valid legacy time-based smartcard and an invalid legacy smartcard
          **AND** you can verify records in the CloudFare activity log, MERIT and SmartTrack
          **WHEN** you present the valid legacy journey-based or time-based smartcard
          **THEN** the PV validates it per its legacy rules (Tag successful)
          **WHEN** you present the invalid legacy smartcard
          **THEN** the PV rejects it with the specific reason shown
          **WHEN** you check the back office for the accepted presentation
          **THEN** the validation is recorded in CloudFare, MERIT and SmartTrack
        expected: Legacy journey-based and time-based smartcards validate per their legacy rules and reject when invalid; recorded in CloudFare/MERIT/SmartTrack.
      - title: Card technology — MIFARE and DESFire
        objective: This test is to confirm the PV reads and validates the supported card technologies.
        steps: |-
          **GIVEN** the PV is in service showing the Present SmartCard or Barcode screen
          **AND** you have a MIFARE Classic EV1 card and a DESFire card, both carrying valid products
          **AND** you can verify records in the CloudFare activity log, MERIT and SmartTrack
          **WHEN** you present the MIFARE Classic EV1 card, then the DESFire card
          **THEN** the FEIG reads each card
          **AND** the PV validates each card per its type (Tag successful)
          **WHEN** you check the back office for the presentations
          **THEN** the validations are recorded in CloudFare, MERIT and SmartTrack
        expected: The PV reads and validates the supported card technologies (MIFARE Classic EV1 and DESFire); recorded in CloudFare/MERIT/SmartTrack.
      - title: Passback — re-presentation within the window is handled per product rules
        match: Passback handling
        objective: This test is to confirm passback is applied when a card is re-presented at the PV within the passback window.
        steps: |-
          **GIVEN** the PV is in service showing the Present SmartCard or Barcode screen
          **AND** a card (smartcard or payment card) has just been validated at the PV, so it is inside its passback window
          **AND** you can verify records in the CloudFare activity log and MERIT
          **WHEN** you present the same card again within the passback window
          **THEN** the PV applies passback per the product rules (no extra fare/journey)
          **WHEN** you check the back office for the passback event
          **THEN** the passback is recorded in the CloudFare activity log and MERIT
        expected: On re-presentation within the passback window the PV applies passback (no extra charge) for both smartcard and payment card; recorded in CloudFare/MERIT.
      - title: Operating Times — validates in-hours, out of service outside them
        match: PV operating times
        objective: This test is to confirm the PV validates within its configured operating times and is out of service outside them.
        steps: |-
          **GIVEN** the PV has configured operating times
          **AND** you have a valid smartcard to present inside and outside the operating window
          **WHEN** you present the valid card within the operating times
          **THEN** the PV validates it normally (Tag successful)
          **WHEN** you present the card outside the operating times
          **THEN** the PV does not validate
          **AND** it shows the Machine Not In Service (out-of-service) state
        expected: The PV validates within its operating times and shows Machine Not In Service (does not validate) outside them.

  # ═════════════════════════ Legacy Transfer ═════════════════════════
  - path: Functional / Legacy Transfer
    cases:
      - title: Legacy Transfer — decided by the product Transfer Time, not a route property
        refs: FBD-100271
        objective: This test is to confirm the PV decides transfer-versus-journey using the PRODUCT Transfer Time property, not a route property.
        steps: |-
          **GIVEN** a PV validating a legacy rail smartcard whose product Transfer Time is 90 minutes
          **AND** example card: an iLink Zone 4 smartcard first validated at Botanic, then re-presented at Lanyon Place 20 minutes later, inside the LastValidated + Transfer Time window
          **AND** you can inspect the audited transaction in the CloudFare activity log
          **WHEN** the card is re-presented inside the transfer window
          **THEN** the PV records a transfer with no journey deducted
          **AND** a WTS SmartTransfer transaction is audited
        expected: Inside the product Transfer Time window the PV records a transfer (no journey deducted) and audits a WTS SmartTransfer transaction, using the product property.
      - title: Legacy Transfer — re-validation outside the product Transfer Time counts as a journey
        refs: FBD-100271
        objective: This test is to confirm a re-validation outside the product Transfer Time window is charged as a journey on the PV.
        steps: |-
          **GIVEN** a PV validating a legacy rail smartcard whose product Transfer Time is 90 minutes
          **AND** example card: an iLink Zone 4 smartcard first validated at Botanic, then re-presented at Lanyon Place 100 minutes later, outside the LastValidated + Transfer Time window
          **AND** you can inspect the audited transaction in the CloudFare activity log
          **WHEN** the card is re-presented outside the transfer window
          **THEN** the PV deducts a journey
          **AND** a WTS SmartUse transaction is audited
        expected: Outside the product Transfer Time window the PV deducts a journey and audits a WTS SmartUse transaction.

  # ═════════════════════════ Pilot List ═════════════════════════
  - path: Functional / Pilot List
    cases:
      - title: Pilot List — an enrolled FEIG token validates and audits normally
        refs: FBD-100720
        objective: This test is to confirm a PV in pilot mode validates an enrolled cEMV card and audits it via the normal ABT flow.
        steps: |-
          **GIVEN** a PV deployed with Enable Pilot List = True and a topology that has ABT enabled via the ABT Type route attribute
          **AND** example media: a cEMV card whose FEIG token is present in the imported pilotlist.dat
          **AND** you can verify the audit record in the CloudFare activity log and MERIT
          **WHEN** the passenger taps the enrolled card
          **THEN** the PV proceeds down the normal cEMV success flow
          **AND** an ABT audit record is generated for the tap
        expected: An enrolled FEIG token passes the pilot-list check and follows the normal cEMV success-and-audit flow; recorded in CloudFare/MERIT.
      - title: Pilot List — a non-enrolled token is rejected with no audit event
        refs: FBD-100720
        objective: This test is to confirm a PV in pilot mode rejects a card whose FEIG token is not on the pilot list and performs no auditing.
        steps: |-
          **GIVEN** a PV deployed with Enable Pilot List = True and ABT enabled via the ABT Type route attribute
          **AND** example media: a cEMV card whose FEIG token is NOT in the imported pilotlist.dat
          **AND** you can confirm the absence of an audit event in the CloudFare activity log
          **WHEN** the passenger taps the non-enrolled card
          **THEN** the PV shows the standard rejection screen
          **AND** no ABT audit event is generated for the tap
        expected: A non-enrolled FEIG token is rejected with the standard rejection screen and NO audit event — the key negative assertion.
      - title: Pilot Registration — the registration file uploads once per day at End-of-Day
        refs: FBD-100720
        objective: This test is to confirm the PV uploads its pilot registration file once per day at End-of-Day rather than in real time.
        steps: |-
          **GIVEN** a PV in registration mode (Enable Registration Mode = True, Enable Pilot List = False)
          **AND** example: several cEMV cards tapped during the day, each capturing its FEIG token into the on-device pilot registration file
          **AND** you can verify uploads in CloudFare Device Logging
          **WHEN** the configured End-of-Day time is reached
          **THEN** the registration file is uploaded as a zip to CloudFare Device Logging
          **AND** the file is not uploaded in real time as tokens are captured
        expected: The pilot registration file uploads as a zip to CloudFare Device Logging once per day at End-of-Day, not in real time.

  # ═════════════════════════ Technician Menu ═════════════════════════
  - path: Functional / Technician Menu
    cases:
      - title: Technician Menu — login
        objective: This test is to confirm a technician can access the menu with a technician smartcard and PIN, and is rejected on invalid credentials.
        steps: |-
          **GIVEN** the PV is in service displaying the Technician Menu login screen
          **AND** you have a valid technician smartcard with its correct PIN, and an invalid card / wrong PIN
          **WHEN** you present the valid technician smartcard and enter the correct PIN
          **THEN** the Technician Menu home screen is displayed
          **WHEN** you present an invalid technician smartcard or enter an incorrect PIN
          **THEN** the incorrect-details message is shown
          **AND** access to the Technician Menu is refused
        expected: A valid technician smartcard + PIN reaches the menu (the PV requires the card, unlike ETM/POS which are PIN-only); invalid credentials are refused.
      - title: Technician Menu — location settings
        objective: This test is to confirm a technician can view and change the PV home location, that applying a new home location reboots the device, and that clearing and a failed update are handled.
        steps: |-
          **GIVEN** a technician is signed in to the Technician Menu with back-office comms available
          **AND** you can view the current home location and select a new one from the server list
          **WHEN** you open Location Settings and view the current home location
          **THEN** the current home location is displayed
          **WHEN** you select a new home location and confirm
          **THEN** the home location is updated
          **AND** the device reboots to apply the new home location
          **WHEN** you clear the entry during editing, then repeat with comms unavailable so the server list cannot be retrieved
          **THEN** the location field is cleared during editing
          **AND** a "Failed to retrieve locations from server" error is shown when the list cannot be retrieved
        expected: The home location can be viewed and changed; applying a new home location reboots the device; the field can be cleared during editing; a no-comms failure shows "Failed to retrieve locations from server".
      - title: Technician Menu — display settings
        objective: This test is to confirm a technician can adjust the screen backlight brightness, including ambient mode.
        steps: |-
          **GIVEN** a technician is signed in to the Technician Menu
          **AND** you are on the Brightness page (Mode shows Manual or Ambient)
          **WHEN** you adjust the screen backlight brightness manually
          **THEN** the brightness indicator moves
          **AND** the backlight changes accordingly
          **WHEN** you enable ambient mode and change the surrounding light
          **THEN** the backlight adjusts automatically to the ambient light without manual input
        expected: Screen backlight brightness adjusts manually, and ambient mode auto-adjusts the backlight from the built-in light sensor when enabled.
      - title: Technician Menu — software and configuration versions
        objective: This test is to confirm a technician can view the full software and configuration version lists.
        steps: |-
          **GIVEN** a technician is signed in to the Technician Menu
          **WHEN** you open the Software Versions page
          **THEN** the software versions are listed (OS, BSP, EBoot, Configuration Version, application software and operating files)
          **WHEN** you open the Configuration Versions page
          **THEN** the configuration versions are listed (Configuration Version, Furthest Alighting file, TD.Product, TD.Topology, Staff List)
        expected: The Software Versions page lists OS/BSP/EBoot/config/application/operating files; the Configuration Versions page lists Configuration Version, Furthest Alighting file, TD.Product, TD.Topology and Staff List.
      - title: Technician Menu — force communications
        objective: This test is to confirm the Force Communications page summarises comms status and that Call Now and Refresh work.
        steps: |-
          **GIVEN** a technician is signed in to the Technician Menu
          **AND** the PV has pending audit records and pending download files
          **WHEN** you open the Force Communications page
          **THEN** the page summarises the comms status — pending audit-record count, last successful audit send, last manifest download attempt, last successful manifest download and pending software/configuration file count
          **WHEN** you press Call Now
          **THEN** the PV checks the back-office manifest and attempts to send any pending audit records
          **WHEN** you press Refresh
          **THEN** the displayed values update to the most recent information
        expected: The Force Communications page summarises pending audit count, last successful audit send, last manifest attempt, last successful manifest download and pending file count; Call Now triggers a manifest check and audit send; Refresh updates the values.
      - title: Technician Menu — network settings
        objective: This test is to confirm a technician can view and edit the PV network settings.
        steps: |-
          **GIVEN** a technician is signed in to the Technician Menu
          **AND** the PV network interface shows its static IP (192.168.3.10 on the test rig)
          **WHEN** you open the Network Interfaces page, edit a network setting and confirm
          **THEN** the network settings are updated to the new values
        expected: Network settings can be viewed and edited from the Technician Menu, and the updated values are applied.
      - title: Technician Menu — operating times
        objective: This test is to confirm a technician can reconfigure the PV operating times and that the PV goes out of and back into service accordingly.
        steps: |-
          **GIVEN** a technician is signed in to the Technician Menu
          **WHEN** you reconfigure the operating start time and apply it
          **THEN** the new operating times are applied
          **AND** the PV goes out of service and then into service per the configured times
        expected: Reconfiguring the operating times applies them and the PV transitions out of service then into service per the schedule.
      - title: Technician Menu — backup, layout and audible feedback
        objective: This test is to confirm the engineer can enable data mirroring/backup and amend the main-screen background, and that audible feedback plays on card presentation.
        steps: |-
          **GIVEN** an engineer is signed in to the Technician Menu
          **WHEN** you enable data mirroring (backup)
          **THEN** data mirroring is enabled
          **WHEN** you amend the main-screen background colour
          **THEN** the main-screen background is updated
          **WHEN** a card is presented to the PV
          **THEN** the configured audible feedback is played
        expected: Data mirroring/backup can be enabled, the main-screen background can be changed, and audible feedback plays on card presentation.
      - title: Technician Menu — sign off
        objective: This test is to confirm a technician can sign off from the Technician Menu.
        steps: |-
          **GIVEN** a technician is signed in to the Technician Menu with comms available
          **AND** you can verify the CloudFare activity log
          **WHEN** you select Sign Off and confirm
          **THEN** the technician is signed off
          **AND** the PV returns to its in-service state
          **WHEN** you check the back office
          **THEN** the sign-off is recorded in the CloudFare activity log
        expected: A technician can sign off; the PV returns to service and the sign-off is recorded in CloudFare.
      - title: Technician Menu — reboot
        objective: This test is to confirm a technician can reboot the PV from the Technician Menu.
        steps: |-
          **GIVEN** a technician is signed in to the Technician Menu with comms available
          **AND** you can verify the CloudFare activity log
          **WHEN** you select Reboot
          **THEN** the PV reboots
          **AND** the PV returns to service after the reboot
          **WHEN** you check the back office
          **THEN** the reboot is recorded in the CloudFare activity log
        expected: A technician can reboot the PV, which returns to service after the reboot; recorded in CloudFare.
      - title: Technician Menu — audio settings
        objective: This test is to confirm a technician can adjust the audio volume.
        steps: |-
          **GIVEN** a technician is signed in to the Technician Menu on the Audio page
          **WHEN** you adjust the audio volume and play the test tone
          **THEN** the audio volume changes accordingly
        expected: Audio volume adjusts from the Technician Menu.
      - title: Technician Menu — auto sign-off and page timeouts
        objective: This test is to confirm the Technician Menu times out inactive pages to the home screen and auto signs the technician off on inactivity.
        steps: |-
          **GIVEN** a technician is signed in to the Technician Menu with comms available
          **AND** you can verify the CloudFare activity log
          **WHEN** you leave a page with no input until it times out
          **THEN** the PV returns to the Technician Menu home screen
          **WHEN** the inactivity period then elapses on the home screen
          **THEN** the PV auto signs the technician off with a tone
          **AND** the sign-off is recorded in the CloudFare activity log
        expected: Inactive pages time out to the Technician Menu home; continued inactivity auto signs-off the technician (with a tone) and records the sign-off in CloudFare.

  # ═════════════════════════ Non-Functional / PV ═════════════════════════
  - path: Non-Functional / PV
    cases:
      - title: Power — recovers to service with transactions intact
        match: Power interruption and recovery
        objective: This test is to confirm the PV handles a power interruption and recovers to service with stored transactions intact.
        steps: |-
          **GIVEN** the PV is in service with recorded (not-yet-uploaded) transactions on-device
          **WHEN** power is interrupted
          **THEN** the PV shuts down safely without corrupting the stored transactions
          **WHEN** power is restored
          **THEN** the PV restarts and returns to service
          **AND** the stored transactions are intact and still upload to the back office
        expected: The PV survives a power interruption and recovers to service with stored transactions intact and still uploadable.
      - title: PV to BOS — software and FEIG update via CloudFare TMS
        objective: This test is to confirm the PV and its FEIG reader can be updated via CloudFare TMS.
        steps: |-
          **GIVEN** a PV software or FEIG firmware update is available from CloudFare TMS
          **AND** you can verify the reported version in the CloudFare activity log
          **WHEN** the update is distributed to the PV
          **THEN** the PV applies the update
          **AND** the new version is reported to the back office
          **WHEN** you check the back office
          **THEN** the new version is visible in CloudFare
        expected: PV/FEIG software updates apply via CloudFare TMS and the new version is reported and visible in CloudFare.
      - title: PV to BOS — Deny and BIN list download
        objective: This test is to confirm the PV downloads and applies the Deny and BIN lists to its FEIG.
        steps: |-
          **GIVEN** the back office has updated Deny and BIN lists
          **AND** the PV has cEMV and back-office comms
          **AND** you can verify the download in the CloudFare activity log
          **WHEN** the PV downloads the updated lists
          **THEN** the lists are applied to the PV FEIG for cEMV validation
          **WHEN** you check the back office
          **THEN** the list download is recorded in CloudFare
        expected: The Deny and BIN lists download and apply to the PV FEIG for cEMV validation; recorded in CloudFare.
      - title: PV to BOS — transaction upload
        objective: This test is to confirm the PV uploads its validation and tap transactions to the back office.
        steps: |-
          **GIVEN** the PV has recorded validation and tap transactions on-device
          **AND** you can verify the CloudFare activity log
          **WHEN** the PV communicates with the back office
          **THEN** the transactions are uploaded to the back office
          **WHEN** you check the back office
          **THEN** the uploaded transactions appear in the CloudFare activity log
        expected: The PV uploads its validation and tap transactions to the back office; they appear in CloudFare.
      - title: Clock — GMT/BST change carries into time-based validation
        match: Daylight Saving Time change
        objective: This test is to confirm the PV applies daylight saving time changes correctly for the clock and time-based validation.
        steps: |-
          **GIVEN** the PV clock is approaching a daylight saving transition (GMT-to-BST or BST-to-GMT)
          **AND** you have a time-limited product to validate after the change
          **WHEN** the daylight saving change occurs
          **THEN** the PV clock adjusts to the new time
          **WHEN** you present the time-limited card after the change
          **THEN** time-based validation uses the new (adjusted) time
        expected: The PV applies GMT/BST changes correctly, and time-based validation uses the adjusted time after the change.
      - title: PV to BOS — MERIT heartbeat
        objective: This test is to confirm the PV sends a MERIT heartbeat transaction periodically and after a technician signs out.
        steps: |-
          **GIVEN** a PV is in service with comms available
          **AND** you can verify heartbeats in CloudFare / MERIT
          **WHEN** the configured 24-hour period elapses
          **THEN** a MERIT heartbeat transaction is sent to the back office
          **WHEN** a technician signs out of the Technician Menu
          **THEN** a heartbeat occurs
        expected: A MERIT 24-hour heartbeat transaction is sent, and a heartbeat occurs after technician sign-out; visible in CloudFare/MERIT.
      - title: PV — scheduled reboot
        objective: This test is to confirm the PV reboots automatically at its configured scheduled time and returns to service.
        steps: |-
          **GIVEN** a PV has a scheduled reboot time configured
          **AND** you can verify the CloudFare activity log
          **WHEN** the configured reboot time is reached
          **THEN** the device reboots
          **AND** the PV returns to service after the reboot
          **WHEN** you check the back office
          **THEN** the scheduled reboot is recorded in CloudFare
        expected: The PV reboots at its configured scheduled time and returns to service; recorded in CloudFare.
      - title: PV to BOS — configuration and topology distribution
        objective: This test is to confirm the PV downloads and applies configuration and topology updates, including future-activation and corrupt-file handling.
        steps: |-
          **GIVEN** the back office has configuration and topology updates for the PV
          **AND** you have an immediate update, a future-dated update and a deliberately corrupt configuration file
          **WHEN** the PV downloads a configuration or topology update for immediate activation
          **THEN** the update is applied
          **WHEN** the update has a future activation date
          **THEN** it is stored and activated on that date
          **WHEN** a corrupt configuration file is downloaded
          **THEN** it is rejected
          **AND** the current configuration is retained
        expected: Config/topology updates apply immediately or on a future date; corrupt files are rejected without disrupting the live config.
      - title: PV to BOS — communications resilience and failover
        objective: This test is to confirm the PV keeps working when back-office comms are interrupted or lost, and uses the secondary failover channel.
        steps: |-
          **GIVEN** a PV in service communicating with the back office over its primary channel
          **AND** you can verify the CloudFare activity log
          **WHEN** communications are interrupted or lost
          **THEN** the PV continues to validate and queues data to upload
          **AND** data due for download is retrieved once comms return
          **WHEN** the primary comms channel fails
          **THEN** the PV fails over to the secondary communication method
          **WHEN** you check the back office after recovery
          **THEN** the queued data appears in the CloudFare activity log
        expected: The PV keeps validating with comms interrupted/lost (queuing uploads, catching up downloads) and fails over to the secondary channel; queued data appears in CloudFare.
      - title: PV — scheduled maintenance
        objective: This test is to confirm the PV performs scheduled maintenance from idle and resumes when coming out of the suspended state.
        steps: |-
          **GIVEN** a scheduled maintenance window is configured
          **AND** the PV is in idle mode during the window
          **WHEN** the maintenance window is reached while the PV is idle
          **THEN** the scheduled maintenance is performed
          **WHEN** the PV comes out of the suspended state
          **THEN** the PV resumes to service
        expected: Scheduled maintenance runs from idle; the PV resumes cleanly out of the suspended state.
      - title: PV — validation and barcode performance timings
        objective: This test is to confirm smartcard validation and barcode reading complete within the acceptable performance timings.
        steps: |-
          **GIVEN** a PV in service showing the Present SmartCard or Barcode screen
          **AND** you have a smartcard and a batch of barcodes with a stopwatch / captured timings
          **WHEN** you present a smartcard for validation
          **THEN** the validation completes within the acceptable timing
          **WHEN** you validate barcodes at throughput
          **THEN** each barcode reads within the acceptable timing and throughput
        expected: Smartcard validation and barcode reading meet their performance timing and throughput targets.
      - title: PV — stability and recovery
        refs: TIBU-25842, TIBU-26302, TIBU-28453, TIBU-28770, TIBU-29165, TIBU-29602
        objective: This test is to confirm the PV stays responsive and recovers from failure conditions without manual intervention.
        steps: |-
          **GIVEN** a PV in service connected to CloudFare TMS
          **AND** you can force a failed boot and a white-startup-screen freeze, and run the PV over an extended period
          **WHEN** the device fails to boot
          **THEN** the recovery mechanism restarts it to a working state
          **WHEN** the device would otherwise freeze on the white startup screen
          **THEN** it recovers to service
          **WHEN** the PV runs over an extended period
          **THEN** the transaction service stays responsive
          **AND** the PV continues to download and apply new distributions
          **AND** deployments via TMS succeed
        expected: The PV recovers from a failed boot and white-screen freeze; the transaction service stays responsive; it keeps downloading distributions and accepting TMS deployments.
      - title: PV — asset and version reporting
        refs: TIBU-24260, TIBU-26053, TIBU-25548, TIBU-26054
        objective: This test is to confirm the PV reports its software, PCA and FEIG versions and identifiers to the back office and on the version page.
        steps: |-
          **GIVEN** a PV connected to the back office
          **AND** you can view the software version page and inspect CloudFare Asset Manager
          **WHEN** you view the software version page
          **THEN** the Application version is displayed
          **AND** the PCA application version is displayed
          **WHEN** the PV reports to CloudFare
          **THEN** the SIM ID is sent to CloudFare and visible in Asset Manager
          **AND** the FEIG Device ID is displayed in Asset Manager associated assets
        expected: The version page shows the Application and PCA versions; the SIM ID and FEIG Device ID are reported to CloudFare / Asset Manager.

  # ═════════════════════════ Non-Functional / Comms ═════════════════════════
  - path: Non-Functional / Comms
    cases:
      - title: Comms Lock — a sustained network outage drives the PV out of service
        refs: FBD-100359
        objective: This test is to confirm an Ethernet PV enters a communication-locked, out-of-service state after a sustained Translink-network loss.
        steps: |-
          **GIVEN** an Ethernet PV routed to AWS through the Translink network (static IP 192.168.3.10)
          **AND** the Translink-network connection is lost and stays down for a significant period
          **WHEN** the outage is sustained beyond the device's offline tolerance
          **THEN** the PV enters a communication-locked, out-of-service state
          **AND** the PV stops accepting taps
        expected: A sustained Translink-network outage drives the Ethernet PV into a communication-locked, out-of-service state.
      - title: Comms Recovery — transactions queued during an outage are delivered on restore
        refs: FBD-100359
        objective: This test is to confirm the PV queues transactions taken during a network outage and delivers them once the network is restored.
        steps: |-
          **GIVEN** an Ethernet PV that took taps while the Translink-network connection was down
          **AND** the taps were queued on-device with no data loss
          **WHEN** the Translink-network connection is restored
          **THEN** the queued transactions are delivered to the back office
          **AND** no queued transaction is lost
        expected: Transactions queued on the PV during the outage are delivered to the back office on network restore with no data loss.
