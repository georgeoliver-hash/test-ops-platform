sections:
  - path: [Functional, ABT (Glider)]
    cases:
      - title: Duplicate tap — a same-stage re-tap within the Same Location Time still shows Tap Successful
        objective: This test is to confirm the PV shows a normal successful-tap outcome at the device even when the back office will treat the re-tap as a duplicate and not charge it.
        steps: |-
          **GIVEN** a Glider PV on a Tap-On-Only route has ABT/cEMV enabled and is showing the Present screen
          **AND** you have already tapped a valid contactless payment card at this boarding stage today
          **AND** you can verify records in the CloudFare activity log and MERIT
          **WHEN** you tap the same card again at the same boarding stage, within the configured Same Location Time
          **THEN** the PV shows the ABT Tag successful screen to the passenger
          **AND** the success audio tone is played
          **AND** the PV gives no different indication that this is a repeat tap
          **WHEN** you check the back office for the second tap
          **THEN** the second tap is recorded as a duplicate and is not charged
          **AND** the first tap's charge is unaffected
        expected: The PV shows a normal Tap Successful outcome on the re-tap; the back office marks the second tap a duplicate and does not charge it.
        refs: FBD-100690,George-domain-knowledge-2026-07-27

      - title: Duplicate tap — a same-stage re-tap outside the Same Location Time is a genuine new tap
        objective: This test is to confirm a re-tap at the same boarding stage, once outside the Same Location Time window, is treated as a genuine new tap rather than a duplicate.
        steps: |-
          **GIVEN** a Glider PV on a Tap-On-Only route has ABT/cEMV enabled and is showing the Present screen
          **AND** you have already tapped a valid contactless payment card at this boarding stage earlier today, longer ago than the configured Same Location Time
          **AND** you can verify records in the CloudFare activity log and MERIT
          **WHEN** you tap the same card again at the same boarding stage
          **THEN** the PV shows the ABT Tag successful screen to the passenger
          **AND** the success audio tone is played
          **WHEN** you check the back office for the second tap
          **THEN** the second tap is recorded as a genuine new journey and is charged
        expected: Once outside the Same Location Time, a repeat tap at the same stage is a genuine new tap and is charged.
        refs: FBD-100690,George-domain-knowledge-2026-07-27
