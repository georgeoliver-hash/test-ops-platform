# PV — additions wave 2: gaps found by the full case-title sweep of all 1,144 old cases (behaviours
# the section structure + run data hid). Ensures complete coverage for BOTH Glider and Rail.
suite_id: 30255
defaults:
  template_id: 1
  custom_autoconfirmation: false
  custom_devtypes: [10]
  custom_revstatus: 2

sections:
  - path: Non-Functional / PV
    cases:
      - title: PV to BOS — configuration and topology distribution
        objective: This test is to confirm the PV downloads and applies configuration and topology updates, including future-activation and corrupt-file handling.
        steps: |
          **Given** the back office has a configuration or topology update for the PV
          **WHEN** the PV downloads a configuration or topology update for immediate activation
          **THEN** the update is applied
          **WHEN** the update has a future activation date
          **THEN** it is stored and activated on that date
          **WHEN** a corrupt configuration file is downloaded
          **THEN** it is rejected
          **AND** the current configuration is retained
        expected: Config/topology updates apply immediately or on a future date; corrupt files are rejected without disrupting the live config.
      - title: PV to BOS — communications resilience and failover
        objective: This test is to confirm the PV keeps working when back-office comms are interrupted or lost, and uses the secondary failover channel.
        steps: |
          **Given** a PV in service communicating with the back office
          **WHEN** communications are interrupted or lost
          **THEN** the PV continues to validate and queues data to upload
          **AND** data due for download is retrieved once comms return
          **WHEN** the primary comms channel fails
          **THEN** the PV fails over to the secondary communication method
        expected: The PV keeps validating with comms interrupted/lost (queuing upload, catching up download) and fails over to the secondary channel.
      - title: PV — scheduled maintenance
        objective: This test is to confirm the PV performs scheduled maintenance from idle and resumes when coming out of the suspended state.
        steps: |
          **Given** a scheduled maintenance window is configured
          **WHEN** the PV is in idle mode during the window
          **THEN** the scheduled maintenance is performed
          **WHEN** the PV comes out of the suspended state
          **THEN** the PV resumes to service
        expected: Scheduled maintenance runs from idle; the PV resumes cleanly out of suspend.
      - title: PV — validation and barcode performance timings
        objective: This test is to confirm smartcard validation and barcode reading complete within the acceptable performance timings.
        steps: |
          **Given** a PV in service
          **WHEN** a smartcard is presented for validation
          **THEN** the validation completes within the acceptable timing
          **WHEN** barcodes are validated at throughput
          **THEN** each barcode reads within the acceptable timing and throughput
        expected: Smartcard validation and barcode reading meet their performance timing/throughput targets.

  - path: Functional / ABT (Glider)
    cases:
      - title: cEMV — decline reasons and route-type enablement
        objective: This test is to confirm cEMV decline reasons and that taps enable per route type and are disabled where they should be.
        steps: |
          **Given** a Glider PV with cEMV
          **WHEN** a card fails Offline Data Authentication, is from an invalid scheme, is expired or is not read successfully
          **THEN** the tap is declined with the corresponding reason
          **WHEN** the route is "Tap On Only (Flat Fare)" or "Tap On Tap Off"
          **THEN** cEMV taps are enabled for that route type
          **WHEN** no valid fare is found, the boarding location is outside the configured area, or cEMV is disabled in the Technician Menu
          **THEN** cEMV taps are disabled
        expected: cEMV declines on ODA fail / invalid scheme / expired / unread; enables for TOO and Tap-On-Tap-Off route types; disables on no-fare / out-of-area / Technician-Menu-disable.
      - title: cEMV — JourneyTap audit and alighting-stage derivation
        objective: This test is to confirm a successful cEMV tap is audited as a JourneyTap and that the alighting stage is derived correctly.
        steps: |
          **Given** a Glider PV with cEMV on a Tap-On-Only route
          **WHEN** a successful cEMV tap is made
          **THEN** the tap is audited as a "JourneyTap" in CloudFare
          **AND** the alighting stage is derived from the Furthest Alighting Point file
        expected: A successful cEMV tap is audited as a JourneyTap, with the alighting stage derived from the Furthest Alighting Point file.

  - path: Functional / Smartcard Validation
    cases:
      - title: Smartcard — inter-device top-up then validate on PV
        objective: This test is to confirm a smartcard topped up on another device validates correctly on the PV, including expiry edge cases.
        steps: |
          **Given** a smartcard has been topped up on another device (e.g. POS) or a legacy device
          **WHEN** the card is presented to the PV for validation
          **THEN** the PV validates the card reflecting the top-up made elsewhere
          **WHEN** the card was topped up on its last day of travel, with expired journeys, or with no days remaining
          **THEN** the PV applies the corresponding outcome
        expected: A card topped up elsewhere (POS/legacy) validates on the PV; last-day / expired-journeys / no-days-remaining edge cases handled. Run for Metro Travelcard and iLink Zones 1-4/NW, Adult and Child, under Glider and Rail.

  - path: Functional / Technician Menu
    cases:
      - title: Technician Menu — backup, layout and audible feedback
        objective: This test is to confirm the engineer can enable data mirroring/backup and amend the main-screen background, and that audible feedback plays on card presentation.
        steps: |
          **Given** an engineer is in the Technician Menu
          **WHEN** the engineer enables data mirroring (backup)
          **THEN** data mirroring is enabled
          **WHEN** the engineer amends the main-screen background colour
          **THEN** the main-screen background is updated
          **WHEN** a card is presented to the PV
          **THEN** the configured audible feedback is played
        expected: Data mirroring/backup can be enabled, the main-screen background can be changed, and audible feedback plays on card presentation.
