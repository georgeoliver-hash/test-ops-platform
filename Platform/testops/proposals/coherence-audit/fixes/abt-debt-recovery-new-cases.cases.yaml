# ABT (30279) — debt-recovery scenarios authored from George's own domain knowledge, 2026-07-24.
#
# Scenario (George, verbatim intent): a card taps £5.00, the payment fails and the card goes onto
# the Deny List. Two recovery paths, each needing Visa AND Mastercard coverage:
#   1. Automated recovery later runs and recovers a DIFFERENT amount than the original tap
#      (George's example: £4.49, not £5.00) — recovery succeeds, card comes off the Deny List.
#   2. Instead of waiting for automated recovery, the debt is manually retried via a portal —
#      both the Operator Portal and the Passenger Portal.
#
# Practical setup (George): the tester has DB access to adjust the original tap's timestamp and
# recovery amount directly to reach the scenario, rather than a real-time wait — this is how the
# case is actually meant to be executed, so it's stated as the GIVEN.
#
# Existing-coverage check done first (per docs/test-practices.md rubric) before authoring:
#   - C4102852 / C4104540 (automated Visa / Mastercard recovery, section ABT/Debt Recovery) already
#     test "automated recovery clears a recoverable debt" generically, with no concrete worked
#     example and no different-amount detail. EXTENDED in place (match: below) with George's
#     £5.00 -> £4.49 example and the DB-access setup, rather than duplicated.
#   - C4102934 (Account Functions — retry a declined payment, section ABT/Passenger Web
#     Portal/Account Functions) already tests passenger manual retry, but scheme-neutral (no
#     Visa/Mastercard split, no worked example). EXTENDED in place for Visa; a new sibling case
#     added for Mastercard (same pattern the suite already uses for the automated-recovery family:
#     one scheme-neutral case split into named per-scheme siblings).
#   - No Operator Portal equivalent existed anywhere in the suite (checked section
#     ABT/Operator Web Portal/Customer Services, the operator-side analogue of Account Functions,
#     and the whole suite for "operator" + "retry" + "debt") — genuinely new, grounded in
#     PSPEC-0015 §4.9.3 (para ~11826-11837: "the operator agent can trigger the debt recovery
#     process by clicking retry in the Operator portal"). 2 new cases (Visa, Mastercard).
#
# Refs on every case: George (domain knowledge), 2026-07-24 for the scenario itself, plus
# PSPEC-0015 for the mechanism (automated recovery cadence already cited on the existing cases;
# §4.9.3 Customer Online Debt Recovery for the manual-retry mechanism, both customer- and
# operator-initiated).
suite_id: 30279
defaults:
  template_id: 1
  custom_devtypes: [200]
  custom_autoconfirmation: false
  custom_revstatus: 2
sections:

  # ═══════════════════ Debt Recovery — automated recovery at a different amount ═══════════════════
  - path: [ABT, Debt Recovery]
    cases:
      - match: Debt Recovery — automated Visa recovery clears a recoverable issuer-liability debt
        title: Debt Recovery — automated Visa recovery clears a debt at a different amount
        refs: [PSPEC-0015 (Automatic Debt Recovery cadence, para ~11493-11504), TODEV-24990, "George (domain knowledge), 2026-07-24"]
        objective: This test is to confirm that automated Visa debt recovery can succeed at a different amount than the original failed tap and still remove the card from the Deny List.
        steps: |-
          **GIVEN** the seeded Visa test card taps £5.00, the payment fails, and the card goes onto the Deny List
          **AND** the tester has DB access to adjust the original tap's timestamp and recovery amount to accelerate/simulate the recovery window
          **AND** you are signed in to the ABT Operator Portal on the Customers page
          **WHEN** the scheduled automated Visa recovery cycle runs and recovers a different amount than the original tap, e.g. £4.49 not £5.00
          **AND** you refresh the account in the Operator Portal
          **THEN** the recovery is recorded at the recovered amount, not the original £5.00 tap amount
          **AND** the card is removed from the Deny List and shows status Active
        expected: Automated Visa recovery succeeds at a different amount than the original £5.00 tap (e.g. £4.49); the card comes off the Deny List and returns to Active.
      - match: Debt Recovery — automated Mastercard recovery clears a recoverable issuer-liability debt
        title: Debt Recovery — automated Mastercard recovery clears a debt at a different amount
        refs: [PSPEC-0015 (Automatic Debt Recovery cadence, para ~11493-11504), TODEV-24990, "George (domain knowledge), 2026-07-24"]
        objective: This test is to confirm that automated Mastercard debt recovery can succeed at a different amount than the original failed tap and still remove the card from the Deny List.
        steps: |-
          **GIVEN** the seeded Mastercard test card taps £5.00, the payment fails, and the card goes onto the Deny List
          **AND** the tester has DB access to adjust the original tap's timestamp and recovery amount to accelerate/simulate the recovery window
          **AND** you are signed in to the ABT Operator Portal on the Customers page
          **WHEN** the scheduled automated Mastercard recovery cycle runs and recovers a different amount than the original tap, e.g. £4.49 not £5.00
          **AND** you refresh the account in the Operator Portal
          **THEN** the recovery is recorded at the recovered amount, not the original £5.00 tap amount
          **AND** the card is removed from the Deny List and shows status Active
        expected: Automated Mastercard recovery succeeds at a different amount than the original £5.00 tap (e.g. £4.49); the card comes off the Deny List and returns to Active.

  # ═══════════════════ Passenger Web Portal — manual retry ═══════════════════
  - path: [ABT, Passenger Web Portal, Account Functions]
    cases:
      - match: Account Functions — retry a declined payment
        title: Account Functions — retry a declined payment (Visa)
        refs: ["PSPEC-0015 §4.9.3 Customer Online Debt Recovery", "George (domain knowledge), 2026-07-24"]
        objective: This test is to confirm that a customer can manually retry a declined Visa payment from the Passenger Web Portal instead of waiting for automated recovery, clearing the card from the Deny List.
        steps: |-
          **GIVEN** the seeded Visa test card taps £5.00, the payment fails, and the card goes onto the Deny List
          **AND** the tester has DB access to adjust the original tap's timestamp and amount to simulate the recovery window
          **AND** the customer is signed on to the Passenger Web Portal with the declined payment showing on their account
          **WHEN** the customer retries the payment from the Passenger Web Portal
          **THEN** a web-initiated re-authorisation is attempted
          **AND** on a successful retry the outstanding amount is cleared and the card is removed from the Deny List
        expected: The customer's manual retry via the Passenger Web Portal clears the declined Visa payment and removes the card from the Deny List.
      - title: Account Functions — retry a declined payment (Mastercard)
        refs: ["PSPEC-0015 §4.9.3 Customer Online Debt Recovery", "George (domain knowledge), 2026-07-24"]
        objective: This test is to confirm that a customer can manually retry a declined Mastercard payment from the Passenger Web Portal instead of waiting for automated recovery, clearing the card from the Deny List.
        steps: |-
          **GIVEN** the seeded Mastercard test card taps £5.00, the payment fails, and the card goes onto the Deny List
          **AND** the tester has DB access to adjust the original tap's timestamp and amount to simulate the recovery window
          **AND** the customer is signed on to the Passenger Web Portal with the declined payment showing on their account
          **WHEN** the customer retries the payment from the Passenger Web Portal
          **THEN** a web-initiated re-authorisation is attempted
          **AND** on a successful retry the outstanding amount is cleared and the card is removed from the Deny List
        expected: The customer's manual retry via the Passenger Web Portal clears the declined Mastercard payment and removes the card from the Deny List.

  # ═══════════════════ Operator Web Portal — manual retry on the customer's behalf ═══════════════════
  - path: [ABT, Operator Web Portal, Customer Services]
    cases:
      - title: Customer Services — operator retries a customer's declined payment (Visa)
        refs: ["PSPEC-0015 §4.9.3 Customer Online Debt Recovery (para ~11826-11837, operator-triggered retry)", "George (domain knowledge), 2026-07-24"]
        objective: This test is to confirm that an operator can manually retry a customer's declined Visa payment from the Operator Portal on the customer's behalf instead of waiting for automated recovery, clearing the card from the Deny List.
        steps: |-
          **GIVEN** the seeded Visa test card taps £5.00, the payment fails, and the card goes onto the Deny List
          **AND** the tester has DB access to adjust the original tap's timestamp and amount to simulate the recovery window
          **AND** you are signed in to the ABT Operator Portal and have located the customer's account by masked PAN
          **WHEN** you click retry against the declined payment in the Operator Portal
          **THEN** a debt-recovery re-authorisation is attempted
          **AND** on success the card is removed from the Deny List and returns to Active
        expected: The operator's manual retry via the Operator Portal clears the customer's declined Visa payment and removes the card from the Deny List.
      - title: Customer Services — operator retries a customer's declined payment (Mastercard)
        refs: ["PSPEC-0015 §4.9.3 Customer Online Debt Recovery (para ~11826-11837, operator-triggered retry)", "George (domain knowledge), 2026-07-24"]
        objective: This test is to confirm that an operator can manually retry a customer's declined Mastercard payment from the Operator Portal on the customer's behalf instead of waiting for automated recovery, clearing the card from the Deny List.
        steps: |-
          **GIVEN** the seeded Mastercard test card taps £5.00, the payment fails, and the card goes onto the Deny List
          **AND** the tester has DB access to adjust the original tap's timestamp and amount to simulate the recovery window
          **AND** you are signed in to the ABT Operator Portal and have located the customer's account by masked PAN
          **WHEN** you click retry against the declined payment in the Operator Portal
          **THEN** a debt-recovery re-authorisation is attempted
          **AND** on success the card is removed from the Deny List and returns to Active
        expected: The operator's manual retry via the Operator Portal clears the customer's declined Mastercard payment and removes the card from the Deny List.
