        objective: This test is to confirm the TVM completes a Chip & PIN payment with a valid Visa Debit card and prints the ticket.
        steps: |-
          **GIVEN** a TVM is at the payment screen for a Glider Adult Single of £2.20 (example fare against the loaded fares table)
          **AND** a valid Visa Debit Chip & PIN card is to be used
          **WHEN** the customer inserts the card and enters the correct PIN
          **THEN** the payment is approved
          **AND** the ticket is printed
        expected: |-
          A valid Visa Debit Chip & PIN card is approved and the ticket prints.

