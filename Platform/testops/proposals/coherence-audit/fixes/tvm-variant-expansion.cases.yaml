# TVM variant expansion, 2026-07-24 — George's hard rule: "no test should tell someone to test
# multiple variants... we should have a test for each." Every case in the suite carrying a trailing
# "Data variations:" list is expanded here into one separate, individually-executable case per named
# variant (mirrors the Operator/Passenger portal split done earlier today). Kiosk/Astreo model and
# route-mode (NIR-Rail/Ulsterbus/Metro/Glider/Ulsterbus) axes are UNCHANGED — those stay covered via
# TestRail Configurations, per George's explicit carve-out; only in-body data-value variant lists
# (card scheme, entry method, entitlement/concession type) are split here.
#
# SCOPE OF THIS BATCH: the "Payments - EMV & Contactless" section (887780) — the family the task
# explicitly named (C4103658 no-PIN scheme split, C4103662 contactless-above-limit scheme split,
# C4103665/4103666/4103667 entry-method + Magnetic Stripe list, and the 2 new Magnetic Stripe cases
# C4104129/C4104130 checked and confirmed to need a further scheme split). A full suite-wide sweep
# found 48 more "Data variations" cases across Barcode Redemption, Payments - Cash, Sales - Tickets /
# Rail & Cross-Border, and Non-Functional — see tvm-variant-expansion.changelog.md for the complete
# family-by-family breakdown (axis chosen per family, variant counts) proposed as a follow-up batch.
#
# Each first/primary variant reuses the original case id via `match:` (retitled with the variant in
# brackets); remaining variants are new cases in the same section.

suite: "**NEW** TVM Test Suite"
suite_id: 30284

defaults:
  template_id: 1
  custom_devtypes: [1]
  custom_revstatus: 2
  custom_autoconfirmation: false

