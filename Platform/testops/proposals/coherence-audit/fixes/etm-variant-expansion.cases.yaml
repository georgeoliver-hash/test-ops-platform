        objective: This test is to confirm a card topped up on a POS (TGX150) validates correctly on the ETM.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** a smartcard has been topped up on a POS (TGX150) and has synced to the back office
          **AND** a Driver is signed on to Metro route 10A at the FLU screen
          **WHEN** you present the card on the ETM to validate
          **THEN** the card validates on the ETM with the topped-up product recognised
          **WHEN** you open the CloudFare activity log
          **THEN** the validation appears in the CloudFare activity log
          **AND** the validation flows to MERIT and SmartTrack
        expected: A card topped up on a POS (TGX150) validates on the ETM; recorded in CloudFare, MERIT and SmartTrack.
