  - path: Functional / Barcode Scanning
    cases:
      - title: Barcode — online validation succeeds (printed copy)
        match: Barcode — online validation (pass and fail)
        objective: This test is to confirm a valid printed-copy barcode validates online with the validity detail.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** a Driver is signed on to route 72b (IN) and barcode scanning is available online
