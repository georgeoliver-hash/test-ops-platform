  # ------------------------------------------------------------------ #
  # Family: Smartcard — invalid card presented (5 named decline reasons)
  # ------------------------------------------------------------------ #
  - path: Functional / Smartcards / Validation
    cases:
      - title: Smartcard — invalid card presented (wrong zone, Metro)
        match: Smartcard — invalid card presented
        objective: This test is to confirm the ETM rejects a smartcard presented in the wrong Metro zone, with the reason shown.
        overflow: https://overflow.io/s/NDLGF6NF/
        attach: knowledge/flows/etm/flu/05_0_0 - Hotlisted Error.png
        steps: |-
          **GIVEN** a Driver is signed on to Metro route 10A at the FLU screen
          **AND** a seeded smartcard valid only for a different Metro zone is available
          **WHEN** you present the wrong-zone card
          **THEN** the ETM rejects the card
          **AND** the ETM shows "wrong zone" on screen
        expected: A wrong-zone smartcard is rejected with the reason shown, recorded in CloudFare, MERIT and SmartTrack.
      - title: Smartcard — invalid card presented (invalid boarding stage, Ulsterbus)
        objective: This test is to confirm the ETM rejects a smartcard presented with an invalid Ulsterbus boarding stage, with the reason shown.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** a Driver is signed on to Ulsterbus route 72b (IN) at the FLU screen
          **AND** a seeded smartcard with an invalid boarding stage for the route is available
          **WHEN** you present the invalid-boarding-stage card
          **THEN** the ETM rejects the card
          **AND** the ETM shows "invalid boarding stage" on screen
        expected: A smartcard with an invalid boarding stage is rejected with the reason shown, recorded in CloudFare, MERIT and SmartTrack.
      - title: Smartcard — invalid card presented (outside time band)
        objective: This test is to confirm the ETM rejects a smartcard presented outside its valid time band, with the reason shown.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** a Driver is signed on to Metro route 10A at the FLU screen
          **AND** a seeded smartcard valid only within a specific time band is available, presented outside it
          **WHEN** you present the outside-time-band card
          **THEN** the ETM rejects the card
          **AND** the ETM shows "outside time band" on screen
        expected: A smartcard presented outside its time band is rejected with the reason shown, recorded in CloudFare, MERIT and SmartTrack.
