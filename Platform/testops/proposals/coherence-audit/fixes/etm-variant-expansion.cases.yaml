  - path: Functional / Ticket Issue
    cases:
      - title: Ticket Issue — issue a single ticket (Metro Single)
        match: Ticket Issue — issue a single ticket
        objective: This test is to confirm a Metro Single ticket builds via fare look-up, takes payment and issues, printing a change receipt when change is due.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** a Driver is signed on to Ulsterbus route 72b (IN) at the FLU screen
          **AND** an Adult Moygashel Busby Shop to Armagh Bus Centre Metro Single is £4.50 (ref.60)
          **WHEN** you build the ticket via fare look-up, tender more than the fare and take payment
          **THEN** the ticket prints for the selected product and fare
          **AND** a change receipt prints for the change due
          **WHEN** you check the printouts and open the CloudFare activity log
          **THEN** the sale appears in the CloudFare activity log
          **AND** the sale flows to MERIT and SmartTrack
        expected: A ticket builds, pays and issues with a printed Metro Single ticket; when change is due a change receipt prints; recorded in CloudFare, MERIT and SmartTrack.
