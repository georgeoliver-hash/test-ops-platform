# ETM variant expansion, 2026-07-24 — George's hard rule: "no test should tell someone to test
# multiple variants... we should have a test for each." Every case found carrying a "Data
# variations: X, Y, Z" list of card/smartcard/product/entitlement-type names is expanded into one
# separate, individually-executable case per named variant. The first-listed variant reuses the
# original case id (retitled via `match`); the rest are new cases in the same section. Genuine
# operating-mode-only notes (Metro/Ulsterbus mode) and generic Adult/Child equivalence-class
# mentions are NOT split (see etm-variant-expansion.changelog.md for the full rationale per family;
# those cases are handled by the companion etm-variant-expansion.rewrite.json instead — tidy the
# text, no new case). Target: **NEW** ETM-Acceptance Suite (30254), project 42.

suite_id: 30254
defaults:
  template_id: 1
  custom_autoconfirmation: false
  custom_devtypes: [25]
  custom_revstatus: 2

sections:
  # ------------------------------------------------------------------ #
  # Family: Driver Sign On — first use with defects recorded (Manual / Smartcard)
  # ------------------------------------------------------------------ #
  - path: Functional / Sign On & Session / Driver
    cases:
      - title: Driver Sign On — first use with defects recorded (Manual)
        match: Driver Sign On — first use with defects recorded
        refs: ["old-suite C2481159"]
        objective: This test is to confirm a Driver can record vehicle defects during first-use sign-on (Manual entry) and that the defect record is audited to CloudFare.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** the seeded test Driver is mid first-use sign-on to Metro route 10A (IN) via Manual ID/PIN entry, stopped at the Any Defects screen
          **AND** the device's Activity Log is open in CloudFare Estate Management to verify
          **WHEN** you select Yes to record that the bus has defects and enter the defect detail (e.g. "offside mirror cracked")
          **THEN** the defect is recorded against the shift
          **AND** sign-on continues to the Duty Number entry screen
          **WHEN** you open the shift in CloudFare Estate Management
          **THEN** the defect record can be identified against the Driver and vehicle
        expected: |-
          The recorded defect is captured against the shift and is visible against the Driver and vehicle in the CloudFare Activity Log.

          [Automatable: Yes · Cross-check: CloudFare]
      - title: Driver Sign On — first use with defects recorded (Smartcard)
        refs: ["old-suite C2481159"]
        objective: This test is to confirm a Driver can record vehicle defects during first-use sign-on (Smartcard sign-on) and that the defect record is audited to CloudFare.
        overflow: https://overflow.io/s/NDLGF6NF/
        steps: |-
          **GIVEN** the seeded test Driver is mid first-use sign-on to Metro route 10A (IN) via Smartcard presentation, stopped at the Any Defects screen
          **AND** the device's Activity Log is open in CloudFare Estate Management to verify
          **WHEN** you select Yes to record that the bus has defects and enter the defect detail (e.g. "offside mirror cracked")
          **THEN** the defect is recorded against the shift
          **AND** sign-on continues to the Duty Number entry screen
          **WHEN** you open the shift in CloudFare Estate Management
          **THEN** the defect record can be identified against the Driver and vehicle
        expected: |-
          The recorded defect is captured against the shift and is visible against the Driver and vehicle in the CloudFare Activity Log.

          [Automatable: Yes · Cross-check: CloudFare]

