# TVM card/credential-variant sweep, 2026-07-23 — narrow follow-up to today's consolidation-
# completeness audit, modeled on the PV suite's card-scheme miss (13 old scheme-specific cases
# folded into one generic "Visa, Mastercard, mobile wallet" line, silently dropping Debit/Credit
# and Maestro). Target: **NEW** TVM Test Suite (30284), project 42. Read-only source suites: 5602,
# 6160, 22270, 22272, 22273, 22274, 22275, 22276, 22278, 22279.
#
# Finding: Magnetic Stripe is a whole payment MECHANISM (not just a card scheme) mandated by
# REQ-0340.0 / REQ-1515.0 ("The TVM payment terminal shall support contact, contactless and
# magnetic stripe cards with an integrated Payment Card Device" — both Signed-Off/Deployed, TVM
# All) and covered by 15 cases in the old base suite (6160), but has ZERO representation anywhere
# in the live suite (section 887780 "Payments - EMV & Contactless" only has Chip & PIN and
# Contactless). Old suite proves the positive path is scheme-dependent: Visa/Mastercard
# credit+debit are ACCEPTED via magnetic stripe swipe; American Express and Diners Club are
# DECLINED via magnetic stripe (the opposite of their Chip & PIN acceptance in C4103659) — a
# genuinely distinct, spec-relevant behaviour, not a duplicate of the Chip & PIN case.
# See tvm-card-variant-sweep.changelog.md for the full family-by-family accounting.

suite: "**NEW** TVM Test Suite"
suite_id: 30284

defaults:
  template_id: 1
  custom_devtypes: [1]
  custom_revstatus: 2
  custom_autoconfirmation: false

sections:
  - path: [Functional, Payments - EMV & Contactless]
    cases:
      - title: Magnetic Stripe — a valid card completes payment and prints the ticket
        refs: [REQ-0340.0, REQ-0340.1, REQ-0340.2, REQ-1515.0, "old-suite C1831413", "old-suite C1831414", "old-suite C1831415", "old-suite C1831416"]
        objective: This test is to confirm the TVM completes payment and prints the ticket when a valid card is swiped using the magnetic stripe reader.
        steps: |-
          **GIVEN** a TVM is at the payment screen for a Glider Adult Single of £2.20 (example fare against the loaded fares table)
          **AND** a valid Visa Credit magnetic stripe card is to be used
          **WHEN** the customer swipes the card and presses the green ENTER button on the reader
          **THEN** the payment is approved
          **AND** the ticket is printed
        expected: |-
          A valid magnetic stripe card is approved and the ticket prints. Data variations: Visa credit/debit, Mastercard credit/debit.

          [Automatable: Partial — Cross-check: CloudFare / MERIT]
      - title: Magnetic Stripe — American Express and Diners cards are declined
        refs: [REQ-0340.0, REQ-0340.1, "old-suite C1831437", "old-suite C1831438", "old-suite C1831554"]
        objective: This test is to confirm the TVM declines American Express and Diners Club cards presented via the magnetic stripe reader, unlike their acceptance via Chip & PIN.
        steps: |-
          **GIVEN** a TVM is at the payment screen for a cash-or-card transaction
          **AND** a valid American Express credit magnetic stripe card is to be used
          **WHEN** the customer swipes the card and presses the green ENTER button on the reader
          **THEN** the payment is declined
          **AND** no ticket is issued
        expected: |-
          American Express and Diners magnetic stripe cards are declined, in contrast to their Chip & PIN acceptance (see the Chip & PIN Amex/Diners case). Data variations: Amex credit/debit, Diners Club.

          [Automatable: Partial — Cross-check: CloudFare / MERIT]
