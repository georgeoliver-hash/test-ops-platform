  - match: Coins — out-of-circulation and sub-value coins are rejected
    title: Coins — out-of-circulation and sub-value coins are rejected (old round £1)
    refs:
    - REQ-0339.12 (TFTS Requirements Matrix, Signed-Off; Q34 resolved)
    objective: This test is to confirm the TVM rejects a old round £1 coin as out of circulation or below
      the accepted denominations.
    steps: '**GIVEN** a TVM is at the payment screen for a cash transaction

      **WHEN** the customer inserts an out-of-circulation round £1 coin

      **THEN** the coin is rejected

      **AND** the coin is returned to the tray

      **AND** the amount paid is unchanged'
    expected: 'A old round £1 coin is rejected and returned; the amount paid is unchanged.


      [Automatable: Partial · Cross-check: CloudFare / MERIT]'
