    - old-suite C1831513
    - old-suite C1831515
    objective: This test is to confirm the TVM successfully clears a coin jam during payment and the transaction
      continues.
    steps: '**GIVEN** a customer has commenced inserting coins or notes, or is receiving change, for a
      product purchase

      **WHEN** a coin becomes jammed while the customer is inserting coins for payment and the TVM successfully
      clears the jam

      **THEN** the insertion slot reopens

      **AND** the transaction continues normally'
    expected: 'A successfully-cleared coin jam during payment does not abort the transaction.


