    - old-suite C1831516
    objective: This test is to confirm the TVM fails a transaction cleanly (no ticket issued, no fare
      charged) when a coin jam during payment cannot be cleared.
    steps: '**GIVEN** a customer has commenced inserting coins or notes, or is receiving change, for a
      product purchase

