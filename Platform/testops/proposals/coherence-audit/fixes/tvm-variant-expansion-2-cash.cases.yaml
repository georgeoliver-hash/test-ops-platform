- path:
  - Functional
  - Payments - Cash
  - Note Recycler & Change (Astreo only)
  cases:
  - match: BNR — a note left in the exit beak leaves the recycler non-functional
    title: BNR — a note left in the exit beak leaves the recycler non-functional (Cancel)
    refs: []
    objective: This test is to confirm the Astreo BNR is reported non-functional when a dispensed note
      is left in the exit beak after the customer selects Cancel.
    steps: '**GIVEN** an Astreo TVM has a note presented at the BNR exit beak during a cash transaction

      **WHEN** the customer selects Cancel and leaves the note in the exit beak

      **THEN** the BNR is reported as non-functional

      **AND** note payment becomes unavailable until the note is cleared'
    expected: 'A note left in the exit beak after Cancel leaves the BNR non-functional and note payment
      unavailable.


      [Automatable: Partial · Cross-check: CloudFare / MERIT]'
