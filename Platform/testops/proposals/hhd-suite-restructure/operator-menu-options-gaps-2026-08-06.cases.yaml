suite_id: 30285
defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [7]
  custom_autoconfirmation: false

sections:
  - path: [Functional, Operator]
    cases:
      - title: "Mini Statement — invalid smartcard shows Critical Error"
        refs: MODE-ALL
        objective: |
          This test is to confirm presenting an invalid smartcard during Mini Statement shows the Critical Error - Invalid Card screen.
        steps: |
          **GIVEN** the Operator Menu (Glider) is displayed
          **WHEN** the operator selects Mini Statement and presents an invalid smartcard at the Present Smart Card screen
          **THEN** the Critical Error - Invalid Card screen is displayed
        expected: "Presenting an invalid smartcard during Mini Statement shows the Critical Error - Invalid Card screen."
