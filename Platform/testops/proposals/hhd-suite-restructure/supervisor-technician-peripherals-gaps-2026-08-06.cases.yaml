suite_id: 30285
defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [7]
  custom_autoconfirmation: false

sections:
  - path: [Functional, Supervisor]
    cases:
      - title: "Connect Printer — invalid barcode scan for MAC address returns to Enter MAC Address"
        refs: MODE-ALL
        objective: |
          This test is to confirm scanning an invalid barcode while connecting a printer shows MAC
          Address Invalid and returns to the Enter MAC Address screen.
        steps: |
          **GIVEN** the HHD is on the Enter MAC Address screen from Connect Printer
          **WHEN** the operator scans an invalid barcode for the MAC address
          **THEN** the MAC Address Invalid screen is shown
          **AND** after a 3 second timeout the HHD returns to the Enter MAC Address screen
        expected: "Scanning an invalid barcode for the printer MAC address shows MAC Address Invalid then returns to Enter MAC Address."

      - title: "Connect Printer — connection failure shows Unable to Connect"
        refs: MODE-ALL
        objective: |
          This test is to confirm a failed printer connection attempt shows Unable to Connect and
          returns to the Enter MAC Address screen.
        steps: |
          **GIVEN** the HHD is on the Connecting to printer screen after entering or scanning a MAC address
          **WHEN** the connection to the printer does not succeed
          **THEN** the Unable to Connect screen is shown
          **AND** after a 3 second timeout, or the operator taps the cross, the HHD returns to the Enter MAC Address screen
        expected: "A failed printer connection shows Unable to Connect then returns to Enter MAC Address."

      - title: "Pair with Payment Device — pairing failure shows Card_Reader_Not_Connected"
        refs: MODE-ALL
        objective: |
          This test is to confirm a failed payment device pairing attempt shows
          Card_Reader_Not_Connected and returns to the Bluetooth connection screen.
        steps: |
          **GIVEN** the HHD is on the Connecting to card_reader screen pairing with a payment device via Bluetooth
          **WHEN** the pairing with the payment device does not succeed
          **THEN** the Card_Reader_Not_Connected screen is shown
          **AND** the operator taps the red cross, or after a 2 second timeout, the HHD returns to the Connecting to card_reader - Connect via Bluetooth screen
        expected: "A failed payment device pairing shows Card_Reader_Not_Connected then returns to the Connect via Bluetooth screen."
