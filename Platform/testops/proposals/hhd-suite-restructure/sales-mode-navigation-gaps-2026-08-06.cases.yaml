suite_id: 30285
defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [7]
  custom_autoconfirmation: false

sections:
  - path: [Functional, Sales - Paper Tickets, Ticket Issue]
    cases:
      - title: "Ticket Issue — retyping a corrected Alighting Stage search finds the stage"
        refs: MODE-ALL
        objective: |
          This test is to confirm that, after an Alighting Stage search finds no matches, clearing
          and retyping a correct stage name finds and selects it, returning to the Sales screen.
        steps: |
          **GIVEN** the HHD is on "Select Alighting - List - Search Tapped"
          **WHEN** the operator enters an incorrect stage name and ticks, then clears the search,
          retypes the correct stage name and ticks
          **THEN** the incorrect entry shows "Search Tapped - Search Entered - No Matches"
          **AND** the corrected entry finds and selects the Alighting Stage
          **AND** the HHD returns to the Sales screen
        expected: "Retyping a corrected Alighting Stage search after a No Matches result finds and selects the stage, returning to Sales."

      - title: "Ticket Issue — Rail Family & Friends selection reaches product selection"
        refs: MODE-ALL
        objective: |
          This test is to confirm choosing Family & Friends from the Rail Edit Passengers screen
          reaches the Rail product selection screen.
        steps: |
          **GIVEN** the HHD Sales screen (Rail) shows '1 Adult' as the passenger type
          **WHEN** the operator taps '1 Adult', taps 'Family', then taps 'Family & Friends'
          **THEN** the "Select Product - Rail" screen is displayed
        expected: "Selecting Family & Friends on the Rail Edit Passengers screen reaches Select Product - Rail."

      - title: "Ticket Issue — Glider passenger adjustment selects a Child"
        refs: MODE-ALL
        objective: |
          This test is to confirm decreasing Adult and increasing Child on the Glider Edit
          Passengers screen, then confirming, selects a Child passenger.
        steps: |
          **GIVEN** the HHD Sales screen (Glider) shows '1 Adult' as the passenger type
          **WHEN** the operator taps '1 Adult', taps '-' Adult and '+' Child, then taps 'Confirm'
          **THEN** the "Child Selected Glider" screen is displayed
        expected: "Adjusting passengers on the Glider Edit Passengers screen and confirming selects a Child passenger."

      - title: "Ticket Issue — choosing a different Glider product updates the Sales screen"
        refs: MODE-ALL
        objective: |
          This test is to confirm choosing 'Adult Return' from the Glider Select Product screen
          updates the Sales screen with the newly selected ticket type.
        steps: |
          **GIVEN** the HHD Sales screen (Glider) shows 'Single' as the ticket type
          **WHEN** the operator taps 'Single', opens "Select Product - Glider", then taps 'Adult Return'
          **THEN** the Sales screen shows "Different Ticket Type Selected" with Adult Return as the ticket type
        expected: "Choosing Adult Return on the Glider Select Product screen returns to Sales with the different ticket type selected."

      - title: "Ticket Issue — an invalid Boarding/Alighting combination shows No Valid Tickets"
        refs: MODE-ALL
        objective: |
          This test is to confirm selecting a Boarding and Alighting stage combination with no valid
          ticket shows the No Valid Tickets error and disables ticket/passenger selection.
        steps: |
          **GIVEN** the HHD Sales screen has a Boarding and Alighting stage combination with no valid ticket
          **WHEN** the operator confirms that combination
          **THEN** "Error - No Valid Tickets Available" is displayed
          **AND** after 3 seconds it changes to "No Valid Tickets - Sales" with the Boarding/Alighting stages retained
          **AND** the Ticket Type and Passenger Type controls are disabled
        expected: "An invalid Boarding/Alighting combination shows No Valid Tickets Available, then No Valid Tickets - Sales with stage selection retained and Ticket/Passenger Type disabled."

      - title: "Ticket Issue — cancelling Three-Day Travel date selection returns to Sales"
        refs: MODE-ALL
        objective: |
          This test is to confirm tapping Cancel during Three-Day Travel date selection returns to
          the Sales screen without a Three-Day product selected.
        steps: |
          **GIVEN** the HHD is on "3 Day Travel Chosen" with dates being selected
          **WHEN** the operator taps 'Cancel'
          **THEN** the HHD returns to the Sales screen
          **AND** no Three-Day Travel product is selected
        expected: "Cancelling Three-Day Travel date selection returns to Sales without a product selected."

      - title: "Ticket Issue — acting on an issued Advanced Ticket shows Are you sure?"
        refs: MODE-ALL
        objective: |
          This test is to confirm attempting to add more to basket, duplicate a product, or edit a
          product after issuing an Advanced Ticket shows an Are you sure? confirmation.
        steps: |
          **GIVEN** the HHD is on "Issue Advanced Ticket" with an Advanced Ticket already issued
          **WHEN** the operator taps 'Add More to Basket', attempts to duplicate a product, or attempts to edit a product
          **THEN** an "Are you sure?" confirmation is displayed
        expected: "Acting on an issued Advanced Ticket (add more/duplicate/edit) shows an Are you sure? confirmation."

  - path: [Functional, Sales - Paper Tickets, Basket]
    cases:
      - title: "Basket — duplicating a basket item adds a copy"
        refs: MODE-ALL
        objective: |
          This test is to confirm swiping right on a basket item and choosing Duplicate adds a copy
          of that item to the basket.
        steps: |
          **GIVEN** the HHD shows "Items in Basket" with at least one item
          **WHEN** the operator swipes right on a basket item and taps 'Duplicate'
          **THEN** a duplicate of that item is added to the basket
        expected: "Duplicating a basket item via swipe-right adds a copy of it to the basket."

      - title: "Basket — adding a favourite to a full basket shows Basket Full"
        refs: MODE-ALL
        objective: |
          This test is to confirm adding a favourite while the basket already holds 9 ticket lines
          shows the Basket Full screen.
        steps: |
          **GIVEN** the HHD basket already holds 9 ticket lines
          **WHEN** the operator adds a favourite to the basket
          **THEN** the "Basket Full" screen is displayed
          **AND** it dismisses after 3 seconds or when the operator taps 'Back to Basket'
        expected: "Adding a favourite to a full (9-line) basket shows Basket Full, dismissing after 3 seconds or on Back to Basket."
