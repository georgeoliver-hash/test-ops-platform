suite_id: 30285
defaults:
  template_id: 1
  custom_revstatus: 1
  custom_devtypes: [7]
  custom_autoconfirmation: false

sections:
  - path: [Functional, Annulment & Reversal]
    cases:
      - title: "Annulment — exiting Annul Transaction (Glider) returns to Operator Menu"
        refs: MODE-ALL
        objective: |
          This test is to confirm exiting the Annul Transaction (Glider) screen returns to the
          Operator Menu - Glider screen.
        steps: |
          **GIVEN** the Annul Transaction (Glider) screen is displayed
          **WHEN** the operator exits the Annul Transaction screen
          **THEN** the Operator Menu - Glider screen is displayed
          **AND** **GAP** — the control that triggers this return (e.g. Cancel/Back) is not captured in source; confirm on the live system before running
        expected: "Exiting Annul Transaction (Glider) returns to Operator Menu - Glider; the exact control used is unconfirmed."

      - title: "Annulment — Rail ticket search locates a transaction to annul"
        refs: MODE-ALL
        objective: |
          This test is to confirm searching by ticket number on Rail's Annul - List of Transactions
          locates a ticket and opens Annul Transaction - Rail.
        steps: |
          **GIVEN** the Operator Menu (Rail) is displayed
          **WHEN** the operator selects Annul Ticket, taps the search bar, enters a ticket number, and confirms on the numerical keypad
          **THEN** the Annul - List of Transactions - Search Done screen shows the matching ticket
          **AND** selecting the ticket opens the Annul Transaction - Rail screen
        expected: "Searching by ticket number on Rail's transaction list locates the ticket and opens Annul Transaction - Rail."

      - title: "Annulment — Cancel on Annul Transaction (Rail) returns to the transaction list"
        refs: MODE-ALL
        objective: |
          This test is to confirm pressing Cancel on the Annul Transaction - Rail screen returns to
          the Annul - List of Transactions screen.
        steps: |
          **GIVEN** the Annul Transaction - Rail screen is displayed
          **WHEN** the operator selects Cancel
          **THEN** the Annul - List of Transactions screen is displayed
        expected: "Cancel on Annul Transaction - Rail returns to the Annul - List of Transactions screen."

      - title: "Annulment — annulling a non-latest Rail top-up shows Invalid Transaction Selected"
        refs: MODE-ALL
        objective: |
          This test is to confirm attempting to annul a Rail top-up that is not the most recent
          top-up on the smartcard shows the Critical Error - Invalid Transaction Selected screen.
        steps: |
          **GIVEN** the Annul Transaction - Rail screen is displayed for a top-up transaction that is not the smartcard's most recent top-up
          **WHEN** the operator selects Annul
          **THEN** the Critical Error - Invalid Transaction Selected screen is displayed
        expected: "Annulling a Rail top-up that is not the smartcard's most recent top-up shows Critical Error - Invalid Transaction Selected."

      - title: "Annulment — unreadable smartcard Retry returns to Present Smart Card"
        refs: MODE-ALL
        objective: |
          This test is to confirm that when a smartcard cannot be read during annulment, selecting
          Retry on the resulting Critical Error returns to the Present Smart Card screen.
        steps: |
          **GIVEN** the Present Smart Card screen is displayed during annulment and a smartcard presented cannot be read
          **WHEN** the operator selects Retry on the Critical Error screen
          **THEN** the Present Smart Card screen is displayed
        expected: "Retry on the Critical Error (card unreadable) screen returns to Present Smart Card."

      - title: "Annulment — unreadable smartcard Cancel returns to Operator Menu"
        refs: MODE-ALL
        objective: |
          This test is to confirm that when a smartcard cannot be read during annulment, selecting
          Cancel on the resulting Critical Error returns to the Operator Menu screen.
        steps: |
          **GIVEN** the Present Smart Card screen is displayed during annulment and a smartcard presented cannot be read
          **WHEN** the operator selects Cancel on the Critical Error screen
          **THEN** the Operator Menu screen is displayed
        expected: "Cancel on the Critical Error (card unreadable) screen returns to the Operator Menu screen."

      - title: "Annulment — invalid smartcard shows Critical Error - Invalid Card"
        refs: MODE-ALL
        objective: |
          This test is to confirm presenting an invalid smartcard during annulment, after the card is
          successfully read, shows the Critical Error - Invalid Card screen.
        steps: |
          **GIVEN** the Present Smart Card screen is displayed during annulment and the presented smartcard is read successfully
          **WHEN** the HHD checks whether the card is valid and it is not
          **THEN** the Critical Error - Invalid Card screen is displayed
        expected: "An invalid but readable smartcard presented during annulment shows Critical Error - Invalid Card."

      - title: "Annulment — last operation a discount card validation routes to the print annulment flow"
        refs: MODE-ALL
        objective: |
          This test is to confirm that when the smartcard is valid and its last operation was a
          discount card validation, annulment routes to the relevant print annulment flow.
        steps: |
          **GIVEN** a valid smartcard has been presented for annulment and its last operation was a discount card validation
          **WHEN** the HHD checks the last operation type
          **THEN** the relevant print annulment flow is started
        expected: "A valid smartcard whose last operation was a discount card validation routes annulment to the print annulment flow."

      - title: "Annulment — last operation a top-up routes to the print annulment flow"
        refs: MODE-ALL
        objective: |
          This test is to confirm that when the smartcard is valid and its last operation was a
          top-up (not a discount card validation), annulment routes to the relevant print annulment
          flow.
        steps: |
          **GIVEN** a valid smartcard has been presented for annulment, its last operation was not a discount card validation, and its last operation was a top-up
          **WHEN** the HHD checks the last operation type
          **THEN** the relevant print annulment flow is started
        expected: "A valid smartcard whose last operation was a top-up routes annulment to the print annulment flow."

      - title: "Annulment — last operation not a top-up shows Critical Error"
        refs: MODE-ALL
        objective: |
          This test is to confirm that when the smartcard is valid and its last operation was
          neither a discount card validation nor a top-up, annulment shows the Critical Error - Last
          Operation Not Top-Up screen.
        steps: |
          **GIVEN** a valid smartcard has been presented for annulment, its last operation was not a discount card validation, and its last operation was not a top-up
          **WHEN** the HHD checks the last operation type
          **THEN** the Critical Error - Last Operation Not Top-Up screen is displayed
        expected: "A valid smartcard whose last operation was neither a discount card validation nor a top-up shows Critical Error - Last Operation Not Top-Up."

      - title: "Annulment — failed EMV receipt print, Continue without Printing returns to Operator Menu"
        refs: MODE-ALL
        objective: |
          This test is to confirm that after a successful refund print, choosing to print the EMV
          receipt, a failed EMV receipt print followed by Continue without Printing returns to the
          Operator Menu screen.
        steps: |
          **GIVEN** Printing Refund has printed successfully and the operator has chosen Yes to Print EMV Receipt?
          **WHEN** the Printing Refund - Card Payment Receipt print fails and the operator selects Continue without Printing
          **THEN** the Operator Menu screen is displayed
        expected: "Continue without Printing after a failed EMV receipt print returns to the Operator Menu screen."

      - title: "Annulment — failed EMV receipt print Retry reprints the card receipt"
        refs: MODE-ALL
        objective: |
          This test is to confirm that selecting Retry after a failed EMV receipt print returns to
          the Printing Refund - Card Payment Receipt screen.
        steps: |
          **GIVEN** the Print Failed - Card Receipt screen is displayed
          **WHEN** the operator selects Retry
          **THEN** the Printing Refund - Card Payment Receipt screen is displayed
        expected: "Retry on the failed EMV receipt print screen returns to Printing Refund - Card Payment Receipt."

      - title: "Annulment — declining the EMV receipt print returns to Sales"
        refs: MODE-ALL
        objective: |
          This test is to confirm that, after a successful refund print, selecting No on Print EMV
          Receipt? returns to the Sales screen.
        steps: |
          **GIVEN** Printing Refund has printed successfully and the Print EMV Receipt? screen is displayed
          **WHEN** the operator selects No
          **THEN** the Sales screen is displayed
        expected: "Selecting No on Print EMV Receipt? returns to the Sales screen."

      - title: "Annulment — successful refund print shows Printing Refund - Confirm"
        refs: MODE-ALL
        objective: |
          This test is to confirm that a successful refund print shows the Printing Refund - Confirm
          screen and returns to Sales.
        steps: |
          **GIVEN** the Printing Refund screen is displayed for an annulment
          **WHEN** the refund print succeeds
          **THEN** the Printing Refund - Confirm screen is displayed
          **AND** the Sales screen is displayed
        expected: "A successful refund print shows Printing Refund - Confirm, then returns to the Sales screen."

      - title: "Annulment — failed refund print, before the third attempt, retries the print"
        refs: MODE-ALL
        objective: |
          This test is to confirm that a failed refund print, before the third print attempt, returns
          to Printing Refund to retry.
        steps: |
          **GIVEN** the Printing Refund screen is displayed for an annulment and this is not the third print attempt
          **WHEN** the refund print fails
          **THEN** the Printing Failed - Annulment screen is displayed
          **AND** the Printing Refund screen is displayed again
        expected: "A failed refund print before the third attempt returns to Printing Refund to retry."

      - title: "Annulment — third failed refund print routes to Contact Ticket Office"
        refs: MODE-ALL
        objective: |
          This test is to confirm that a third failed refund print, followed by Continue Without
          Printing, routes to Contact Ticket Office and then returns to Sales after a timeout.
        steps: |
          **GIVEN** the Printing Failed - Annulment screen is displayed on the third print attempt
          **WHEN** the operator selects Continue Without Printing on the Print Failed - Annulment - Continue without Print screen
          **THEN** the Contact Ticket Office screen is displayed
          **AND** the Sales screen is displayed after the configured timeout
          **AND** **GAP** — the exact timeout duration is inconsistent in source (3s vs 5s recorded for the same edge); confirm on the live system before running
        expected: "A third failed refund print, then Continue Without Printing, shows Contact Ticket Office and returns to Sales after a timeout. GAP: exact timeout duration unconfirmed."

      - title: "Annulment — Retry from Continue without Print retries the refund print"
        refs: MODE-ALL
        objective: |
          This test is to confirm that selecting Retry on the Print Failed - Annulment - Continue
          without Print screen returns to Printing Refund.
        steps: |
          **GIVEN** the Print Failed - Annulment - Continue without Print screen is displayed
          **WHEN** the operator selects Retry
          **THEN** the Printing Refund screen is displayed
        expected: "Retry on Print Failed - Annulment - Continue without Print returns to Printing Refund."

      - title: "Annulment — Performing Card Refund feeds into the shared Printing Refund flow"
        refs: MODE-ALL
        objective: |
          This test is to confirm that a card refund performed during annulment proceeds into the
          shared Printing Refund screen.
        steps: |
          **GIVEN** a card refund is being performed as part of an annulment
          **WHEN** the card refund completes
          **THEN** the Printing Refund screen is displayed
        expected: "Performing a card refund during annulment proceeds into the Printing Refund screen."
