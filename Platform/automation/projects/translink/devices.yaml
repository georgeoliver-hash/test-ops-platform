project: translink
description: Translink — Android POS terminals (way6.std, UK env5) + Windows-CE ETM4 ticket machines (GFTS/SRSService, UK env7).
bos_base_url: https://device-uktest-tl-env5.albedo-gen.co.uk
identity_provider_uri: https://auth-uktest-tl-env4.albedo-gen.co.uk/auth/realms/TranslinkDevices/
comms_group_id: PKN
common_modules:
  - gtfs
  - bos_config
  - keycloak
devices:
  # Translink way6 POS terminal — fingerprinted from builds/External-SD on 2026-05-07.
  # Customer code INF212 per linux-bsp.dtalias (way6.std + LF10714 mainboard, modem+wifi).
  - id: translink-pos-inf212-01
    type: POS
    os: android
    ui: android_app
    transport:
      kind: adb
      serial: 192.168.3.151:5555
    build:
      variant: way6.std
      package: pos.STE11
      version: 1.0.572.20749   # live as of 2026-06-11; was 1.0.571.25500
    appium_app_package: com.flowbird.pos
    bos_device_id: POS
    bos_device_type: POS_WAY6
    customer_code: INF212
    metadata:
      operator_id: "300051"
      operator_pin: "1234"
      # Physical keypad → Android keycode map (getevent-verified 2026-06-12)
      # Use pos_nav.l1()…r5(), pos_nav.enter(), etc. — never send keycodes directly.
      keypad_keycodes:
        L1: 131   # KEY_F1
        L2: 132   # KEY_F2
        L3: 133   # KEY_F3
        L4: 134   # KEY_F4
        L5: 135   # KEY_F5
        R1: 136   # KEY_F6
        R2: 137   # KEY_F7
        R3: 138   # KEY_F8
        R4: 139   # KEY_F9
        R5: 140   # KEY_F10
        MENU: 142  # KEY_F12 — settings/menu button
        UP: 19
        DOWN: 20
        LEFT: 21
        RIGHT: 22
        ENTER: 66
        ESC: 111   # KEY_ESC
        CLEAR: 67  # KEY_BACKSPACE — C key
        PLUS: 157  # KEY_KPPLUS
        MINUS: 156 # KEY_KPMINUS
        STAR: 155  # KEY_KPASTERISK

  # Translink ETM4 ticket machine — fingerprinted from builds/etm/ on 2026-06-03.
  # Windows Embedded Compact 2013; GFTS/SRSService app stack; SSH/SFTP transport.
  # Customer code INF211 (sibling to the INF212 POS). No automatable UI — tests
  # drive via RemoteCommand + assert on file state (DeviceEvents.json, BOSRecords).
  # NOTE: this device is on BOS UK env7, NOT the project-level env5 used by the POS.
  # Per-device BOS override is a Stage-3 task; bos_* below records its real identity.
  - id: translink-etm-inf211-01
    type: ETMS
    os: wince
    ui: none
    transport:
      kind: ssh
      host: 192.168.3.1    # live via lab router 2026-06-05 (dual 22/23 Rebex FileServer); device logs itself as .10
      port: 22
      user: root
      env_password_var: TRANSLINK_ETM_INF211_PASSWORD
    build:
      variant: ETM4        # BackOfficeAgentConfig DeviceType "Way6S"
      version: 9.10.974.25769
    bos_device_id: ETM1-2903199    # DeviceSSN
    bos_device_type: Way6S
    customer_code: INF211
    metadata:
      bos_base_url: https://device-uktest-tl-env7.albedo-gen.co.uk
      identity_provider_uri: https://auth-uktest-tl-env6.albedo-gen.co.uk/auth/realms/TranslinkDevices/
      terminal_id: "99941001"
      device_identifier: "044592"
      device_uuid: 286db898-e703-4460-abc0-bf8a07138c1d
      id_prefix: ET
      sd_root: "\\SD Memory\\GFTS"
      bosrecords_path: "\\SD Memory\\GFTS\\BOSRecords"

  # Placeholder TVM — Translink has TVMs per George; details TBD.
  - id: translink-tvm-01
    type: TVM
    os: linux
    ui: web
    transport:
      kind: ssh
      host: 10.0.0.50
      port: 22
      user: root
      env_password_var: TRANSLINK_TVM_01_PASSWORD
    build:
      version: TBD
    web_ui_url: http://10.0.0.50/
