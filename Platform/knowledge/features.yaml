    note: "Translink's CloudFare integration is zone/capping-centric, not remote-command-centric."
    citation: {source_kind: spec, source_ref: "FBD-100229 (Translink CloudFare Zone Configuration)", confidence: confirmed}

  - feature_key: driver.sign_on
