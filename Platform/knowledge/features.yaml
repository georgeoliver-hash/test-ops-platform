- feature_key: backoffice.cloudfare_comm
  project: translink
  device_type: ETM
  variant_name: ETM CloudFare comms-loss lockout at Idle
  note: If comms fail at the Idle screen the device shows an Idle-Bad-Comms state; if comms are restored
    it returns to Idle, but if the failure persists it moves to a Communications Locked screen (the exact
    hours threshold is not stated in the source and is flagged as a gap). Sign-on/shift/defect activity
    is otherwise auditable up through CloudFare.
  citation:
    source_kind: flow_map
    source_ref: knowledge/flows/translink-etm-driver-signon.md
    confidence: unconfirmed
- feature_key: ticket_issue.fare_sale
  project: translink
  device_type: ETM
  variant_name: ETM FLU product selection, payment and ticket print
  note: From FLU Home the driver selects a product and alighting stage (directly, via a toggle group,
    a preset button, or menu-type selection), confirms, and on successful payment a ticket prints and
    the device returns to FLU Home. Cash payment shows a 'Last Transaction 200 - Success' banner that
    auto-times-out after 3 seconds and persists as a small indicator. This sub-flow is mode-generic (no
    Metro/Ulsterbus/Rail branching) since ETM has no Rail mode.
  citation:
    source_kind: flow_map
    source_ref: knowledge/flows/translink-etm-flu-ticket-issue.md
    confidence: confirmed
- feature_key: transaction.annulment
  project: translink
  device_type: ETM
  variant_name: ETM Driver Menu annulment (tickets/top-up/yLink/ABT TOO)
  note: From the Driver Menu, annulment is typed by transaction kind (ticket/product issue, top-up, discount/yLink
    card, ABT TOO product); only the last transaction, and only if it occurred less than a minute ago,
    can be annulled, and a stage change clears the annulment list entirely. A basket sale annuls as a
    single whole transaction, not per line item. An incorrect card presented for a top-up/discount annulment
    re-prompts for the same card rather than returning to FLU.
  citation:
    source_kind: flow_map
    source_ref: knowledge/flows/translink-etm-driver-menu-annulment.md
    confidence: confirmed
- feature_key: device.power_interruption
  project: translink
  device_type: ETM
  variant_name: ETM Power Interruption screen (short backup, temporary vs longer loss)
  note: Per the board's annotations, the ETM has only a short battery backup after losing power; timeouts
    are tuned so system state can be saved safely before shutdown. A temporary interruption returns the
    device to the screen it was originally on; a longer interruption leads to the device shutting down.
    The Overflow board itself records zero screen-to-screen connections, so this sequence is stated only
    in annotation prose, not a confirmed graph edge.
  citation:
    source_kind: flow_map
    source_ref: knowledge/flows/translink-etm-power-interruption.md
    confidence: unconfirmed
- feature_key: revenue.limit_lockout
  project: translink
  device_type: ETM
  variant_name: ETM Revenue Limit Approaching/Reached banners and auto sign-off
  note: A pre-configured approaching-amount threshold shows a 'Revenue Limit Approaching' header banner
    (appears after a Transaction Complete banner disappears, then self-clears after 3 seconds). When the
    max revenue is reached, the driver is automatically signed off, a waybill prints, and the ETM locks
    pending Supervisor/Technician intervention; the ETM also re-establishes its back-office connection
    in the background. The exact clearing mechanism for the locked state is not documented in this board.
  citation:
    source_kind: flow_map
    source_ref: knowledge/flows/translink-etm-revenue-limit.md
    confidence: unconfirmed
- feature_key: printer.error_recovery
  project: translink
  device_type: ETM
  variant_name: ETM FLU Printer Error (retry/annul, paper jam, paper low)
  note: A Printer Error during ticket issue offers retry (looping back to the same error on repeated failure)
    or lets the driver annul the transaction instead; the recovery button reads 'Annul Transaction' for
    a failed ticket print but 'Cancel' for a non-ticket printout (e.g. a Technician Menu version printout).
    A Paper Jam variant adds a 'Reverse Paper Feed' option without dismissing the screen, and a Paper
    Low warning appears only immediately after a successful ticket print, auto-clearing after 5 seconds.
  citation:
    source_kind: flow_map
    source_ref: knowledge/flows/translink-etm-flu-printer-travel-mode.md
    confidence: confirmed
- feature_key: barcode.multi_use_validation
  project: translink
  device_type: ETM
  variant_name: ETM barcode scan/reference validation with online and offline checks
  note: A scanned barcode (or a manually entered Barcode Reference from the Driver Menu) is decrypted/parsed,
    checked against prior offline validation, then validated online if available or against an offline
    value/product limit if not; failures of any check route to a shared 'Barcode Validation Failed' screen.
    A separate mLink path validates a customer-presented mLink ticket via offline encryption keys and
    a date check. The board is explicitly flagged provisional, pending a post-R2.0 review of the Corethree
    barcode approach and multi-use barcodes.
  citation:
    source_kind: flow_map
    source_ref: knowledge/flows/translink-etm-barcode-scanning.md
    confidence: unconfirmed
- feature_key: smartcard.topup
  project: translink
  device_type: ETM
  variant_name: ETM smartcard top-up (journeys/days/period) via Smart Card Menu
  note: From the Smart Card Menu the driver selects a top-up amount; on card write success a Top Up Confirmation
    is shown until the card is removed, on failure a Top Up Error is shown instead. Per the annotation
    this same flow template is shared across DayLink (shows 'Days'), iLink and Metro Travelcard (shows
    periods of time) top-ups, and a successfully topped-up day/journey is immediately auto-validated for
    DayLink, iLink and Ulsterbus Town Service cards.
  citation:
    source_kind: flow_map
    source_ref: knowledge/flows/translink-etm-flu-smartcard.md
    confidence: confirmed
- feature_key: driver.sign_on
  project: translink
  device_type: POS
  variant_name: POS ID+PIN / Admin-card sign-on with MotD and Word & Colour
  note: Operator signs on via ID+PIN (or an Administrator smartcard which auto-fills ID and activates
    the PIN field) at the Idle screen; a valid sign-on passes through 'Please Wait...', then conditionally
    shows Message of the Day and Word & Colour of the Day (each has its own 'Unavailable' fallback screen)
