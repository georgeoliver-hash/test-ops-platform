    a Supervisor card. Rail-mode operators land on the Main Screen; Metro operators land on the Present
    Smartcard screen instead.
  citation:
    source_kind: flow_map
    source_ref: knowledge/flows/translink-pos-signon.md
    confidence: confirmed
