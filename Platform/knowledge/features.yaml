# Common features vs. bespoke project variants — see model/features.py's module docstring.
#
# Manually curated, cited seed data. Every variant below traces to a real TestRail case and/or
# spec paragraph/flow-map already in system-test-ops — nothing here is invented. Original 5
# entries sourced 2026-08-26; comprehensively extended 2026-09-08 by mining ~90 flow-annotation
# files + ~55 cited FBD spec notes + 12 NJT spec notes (all real, already in system-test-ops'
# knowledge/) via parallel extraction agents, one per device cluster, each instructed to trace
# every fact to a real source and mark GAP/UNCONFIRMED exactly as the source does.
#
# Add to this file the same way: find the real case/spec/flow-map, cite it, don't guess.

features:
- key: card_reading.tap
  name: Tap a card/credential at a reader
  description: 'Present a card or credential at a device''s reader; the reader identifies the technology
    and routes to the matching validation. The behaviour (present -> identify -> validate) is the same
    regardless of which credential technology a given project actually issues.

    '
- key: backoffice.cloudfare_comm
  name: Device communicates with the CloudFare back-office
  description: 'Every device talks to the shared CloudFare back-office product — the same underlying channel
    — but what each project actually configures/uses it for differs.

    '
- key: driver.sign_on
  name: Driver/operator signs on before operating the device
  description: 'Same conceptual behaviour (credential entry -> device unlocks for operation) across every
    project; the exact sign-on method and screens are project/device-specific.

    '
- key: ticket_issue.fare_sale
  name: Fare/ticket sale and payment
  description: Selecting a fare product (with boarding/alighting stage) and completing payment to issue
    a paper ticket.
- key: transaction.annulment
  name: Annul/reverse a recent transaction
  description: Voiding a recently completed ticket, top-up, discount-card, card-issue, or ABT transaction
    shortly after it occurred, subject to a per-project eligibility window.
- key: device.power_interruption
  name: Power interruption / backup battery recovery
  description: Device behaviour when mains power is lost, using a short battery backup to save state before
    shutting down, and how it recovers on power resumption.
- key: revenue.limit_lockout
  name: Revenue limit approaching/reached lockout
  description: Warning and hard-lockout behaviour when cash/revenue taken on a device approaches or reaches
    a configured ceiling.
- key: printer.error_recovery
  name: Printer error/paper-jam handling and retry/annul recovery
  description: Device response to a failed or jammed print during a transaction, offering retry, reverse-paper-feed,
    or a cancel/annul path back to the prior flow.
- key: barcode.multi_use_validation
  name: Offline multiple-use barcode validation
  description: Devices that support multi-use barcodes validate them offline against on-device business
    rules (time, mode, zone, route/location) rather than contacting a back-office service in real time.
- key: smartcard.topup
  name: Top up a stored-value/period smartcard
  description: Adding journeys/days/time-based value to a presented smartcard, with confirmation on success
    or an error on write failure.
- key: card_payment.bank_card
  name: Bank card payment via attached terminal
  description: Taking a customer bank-card payment on an attached payment terminal (insert/tap/swipe,
    PIN entry, approve/decline, signature, receipt).
- key: smartcard.issue
  name: Issue new smartcard
  description: Writing a new smartcard product onto a blank/presented card and printing an issue receipt.
- key: smartcard.entitlement_validation
  name: Discount/entitlement smartcard validation
  description: Validating a presented discount or entitlement pass per-transaction (rather than top-up)
    to set a ticket type, and handling faulty/hotlisted/passback cards.
- key: barcode.single_use_validation
  name: Online single-use barcode validation
  description: Devices that support single-use (Corethree-generated) barcodes validate them online against
    the Corethree/MMT-Being service, scoped by device type and barcode type, with an offline fallback
    under a value ceiling.
- key: transaction.basket_payment
  name: Multi-item basket & payment
  description: Accumulating multiple ticket items into a basket before taking one combined payment, with
    a payment-method gate on card availability.
- key: pos.refund
  name: POS refund of prior ticket sales
  description: The POS device can refund a qualifying prior ticket sale by cash or card, with role gating
    and validation before the audit record is written.
- key: panic_mode.covert_alert
  name: Panic mode (covert backoffice alert)
  description: A hidden operator trigger that raises a covert alert to the backoffice and temporarily
    disables normal operator functions.
- key: smartcard.inspection_validation
  name: Smartcard inspection & validation
  description: Reading a presented smartcard and determining whether the journey it represents is valid,
    based on passback, prior validation, and transfer-period/direction-of-travel checks.
- key: revenue_inspection.emv_check
  name: Revenue inspection (EMV/payment-card tap check)
  description: An inspector taps a customer's EMV bank card against the device's payment reader to check
    it against the backoffice denylist/inspection record, independent of ticket/smartcard checks.
- key: payment.card_transaction
  name: Bank card payment via attached terminal (chip & PIN / contactless)
  description: Taking a bank-card payment on the device's attached payment reader, covering contactless/chip-and-PIN
    selection, PIN entry, decline handling, and signature/void handling.
- key: printing.receipt_ticket
  name: Shared print-success/print-failed pattern across receipts
  description: A common pattern across many print contexts (ticket, receipt, waybill, mini statement)
    offering retry-or-cancel on failure and, for payment-linked prints, requiring an annulment if printing
    cannot complete.
- key: ticket_issue.purchase
  name: Ticket purchase (destination + type + payment + print)
  description: The end-to-end behaviour of selecting a destination/ticket type, confirming details, paying,
    and receiving a printed ticket.
- key: payment.process_tender
  name: Self-service payment tender (cash/card)
  description: Accepting cash or card payment for a transaction on a self-service kiosk, including cancellation
    and failure handling at the point of tender.
- key: ticket_printing.dispense
  name: Post-payment ticket/change dispensing
  description: Printing and dispensing tickets (and any change/voucher/receipt) once payment has completed.
- key: session_timeout.idle
  name: Idle/inactivity session timeout
  description: Handling of a device screen timing out from user inactivity, including any resume/cancel
    behaviour and partial-transaction cleanup.
- key: ticket_collection.by_reference
  name: Collect pre-purchased ticket by reference
  description: Retrieving and printing a previously booked/paid ticket using a booking reference number
    rather than a fresh purchase.
- key: basket.multi_item
  name: Multi-item basket before payment
  description: Collecting more than one ticket item into a basket before a single payment, with the ability
    to edit or remove items and add more before paying.
- key: device_fault_handling.reader_unavailable
  name: Reader-unavailable fault handling
  description: When a card or barcode reader becomes unavailable (or another non-powerloss fault occurs),
    the device shows a degraded present-screen or goes out of service, and may attempt a reboot to recover
    the reader.
- key: gate_access.mode_operation
  name: Gate in-service mode operation
  description: While in an operating mode (Entry, Exit, Bi-Directional, Emergency, Fully Free, Closed),
    the gate presents readers to travellers, validates cards/barcodes presented, and can degrade to card-only
    or code-only when a reader fails.
- key: gate_access.remote_mode_change
  name: Gate remote mode change
  description: A gate's operating mode can be remotely changed (Fully Free, Emergency, Entry, Exit, Locked),
    and the gate's own Primary/Secured-side role determines whether the change results in Please Proceed,
    No Entry, or Emergency Exit.
- key: technician_menu.sign_on
  name: Technician menu sign-on
  description: A technician signs into the device's technician menu by presenting a technician card (or
    ID) and entering a PIN, reaching a Home Screen hub on success or an error screen on an invalid PIN.
- key: technician_menu.location_settings
  name: Technician location settings
  description: A technician can edit the device's location fields and change its Home Location from a
    Back-Office-supplied list; changing the Home Location requires a device reboot to apply.
- key: technician_menu.force_communications
  name: Technician force communications
  description: A technician can view pending back-office communication status (audit records, manifest
    downloads) and manually trigger a comms check.
- key: abt_emv.fare_validation
  name: ABT EMV card fare validation
  description: A presented ABT EMV bank card is checked through AID acceptance, expiry, ODA, BIN list,
    deny/negative list, and passback-period rules before being accepted or rejected.
- key: device.functional_state_machine
  name: Device functional state machine
  description: The device's internal functional states (e.g. Idle, Comms Locked, Low Power, Screen Saver,
    Out of Service) and the rules governing transitions between them.
- key: fare_structure.class_transaction_model
  name: Rider class and transaction type fare model
  description: The fare system's model of a transaction as a rider class plus a transaction type, with
    only certain class/transaction combinations valid and the selectable list configurable per route.
- key: farepay.stored_value_card
  name: Stored-value fare card transaction
  description: Processing a tap of the project's own stored-value/prepaid fare card, including balance/threshold
    checks distinct from a ticket-product card tap.
- key: driver.operator_menu_functions
  name: Operator/driver menu functions
  description: The set of in-shift administrative actions a driver performs from an operator menu (e.g.
    ending a trip/run, taking a break, requesting relief, cancelling a ticket), each producing device
    state changes and back-office audit records.
- key: special_user.supervisor_admin_mode
  name: Special user (Supervisor/Administrator) mode
  description: A privileged sign-on path, separate from normal driver sign-on, that grants access to device-management
    functions gated by a staff-list-defined role.
- key: device.emergency_mode_handling
  name: Emergency mode entry/exit handling
  description: The device's driver-facing messaging when a connected validator signals an active emergency
    scenario, and when that scenario clears.
- key: comms.transaction_timeout_resolution
  name: In-flight transaction resolution on comms loss/timeout
  description: How a transaction awaiting driver confirmation is automatically resolved when the peripheral
    link drops out or the driver takes too long to respond.
- key: device.warnings_errors_faults
  name: Device warning and error/fault handling
  description: The device's warning and error states for resource exhaustion (memory, paper) and connected-peripheral
    faults, including driver-facing messaging and recovery paths.
- key: card_validation.format_checksum
  name: Smartcard format & integrity validation
  description: A device reading a smartcard must parse its format-specific structure and verify integrity/security
    checks before accepting the card.
- key: comms.device_heartbeat
  name: Device heartbeat / last-communication reporting
  description: Every device type periodically calls in to the back office so CloudFare can track when
    it was last seen, independent of any ticket transaction.
- key: fare.transfer_detection
  name: Journey vs. transfer detection on re-validation
  description: On re-presenting a card, a device decides whether to charge a new journey or record a fare-free
    transfer based on a configured transfer window and direction.
- key: fare.card_reference_lookup
  name: Card-reference-number fare/alighting lookup
  description: For products carrying a card reference number, a device-distributed lookup file combined
    with the boarding stop determines the permitted alighting point/fare.
- key: gate.acceptance_control
  name: Automatic gate open/close acceptance control
  description: A gate device only opens on an explicit validator authorisation signal, monitors for obstruction,
    and falls back to Out of Service on repeated failures.
- key: fare.tap_on_only
  name: Tap-on-only (TOO) card validation
  description: A device validates a contactless bank card on boarding only (no tap-off), running route/location/product
    gating and card checks, then charges a flat or driver-selected fare via the back office.
- key: audit.abt_audit_schema
  name: ABT tap audit record structure
  description: Every ABT-related card tap (TOO or TOTO) emits an audit record to the back office with
    a common set of constant fields and a device-specific structure, since fare charging happens back-office
    rather than on-device.
- key: fare.tap_on_tap_off
  name: Tap-on-tap-off (TOTO) card validation and journey matching
  description: A device validates a contactless bank card at both boarding and alighting; the back office
    matches the pair of taps against a programmed journey time to decide the fare, falling back to a maximum
    fare when a tap is missing or out of time.
