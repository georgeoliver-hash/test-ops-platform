    the passback period) before a mode branch: Metro mode validates the tap directly (EMV Validated, zone/flat-fare,
    no alighting-stage step); Ulsterbus mode requires the driver to select an alighting stage before the
    tap completes. Invalid cards show an EMV Validation Failure that clears after 2s, on card removal,
    or the L6 key.'
  citation:
