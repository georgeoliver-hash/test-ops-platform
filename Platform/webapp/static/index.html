<title>Test-Ops Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --p1:#5F016F; --p1-900:#38003D; --p1-700:#8704AF;
    --p2:#FF33BB; --p3:#FF80D4; --p4:#FFADE4;
    --p4-200:#FFC7EC; --p4-100:#FFE5F7;
    --off-white:#F9F5F4;
    --n900:#201E1D; --n700:#545050; --n500:#716C6A; --n300:#C3BDBC; --n200:#E3DFDD;

    --bg: var(--off-white); --surface:#FFFFFF;
    --sidebar-bg: var(--p1-900); --sidebar-ink: var(--p4); --sidebar-ink-dim:#C9A0C7;
    --sidebar-active-bg: var(--p1);
    --ink: var(--n900); --ink-soft: var(--n500); --line: var(--n200);
    --accent: var(--p1); --accent-soft-bg: var(--p4-100); --accent-soft-border: var(--p4-200);
    --ok:#1F7A3D; --ok-bg:#E4F5E9; --warn:#9A6A00; --warn-bg:#FDF1DC; --bad:#B23A3A; --bad-bg:#FBE4E4;
    --ai:#8704AF; --ai-bg:#F3E3F7; --code:#0F7A6E; --code-bg:#E1F5F2; --gate:#5C4A8C; --gate-bg:#E9E3F4; --human:#716C6A; --human-bg:#E3DFDD;
    --shadow: 0 1px 2px rgba(56,0,61,.04), 0 6px 20px rgba(56,0,61,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#201E1D; --surface:#2B2827; --ink:#F9F5F4; --ink-soft:#C3BDBC; --line:#3E3A38;
      --accent: var(--p4); --accent-soft-bg:#3D2A3B; --accent-soft-border:#5C3E58;
      --ok:#4FBE72; --ok-bg:#1D3324; --warn:#D9A441; --warn-bg:#332B14; --bad:#E27272; --bad-bg:#3A2323;
      --ai:#D89AE8; --ai-bg:#3A2A3E; --code:#5FC9B6; --code-bg:#17332E; --gate:#B7A2E4; --gate-bg:#2B2440; --human:#AEB8AE; --human-bg:#2C332C;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif;font-size:14.5px;line-height:1.5;}
  h1,h2,h3,.brand-font{font-family:"Poppins","Inter",sans-serif;}
  .shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh;transition:grid-template-columns .15s;}
  .shell.sidebar-collapsed{grid-template-columns:0 1fr;}
  @media (max-width:860px){.shell{grid-template-columns:1fr;} .sidebar{display:none;}}

  .sidebar{background:var(--sidebar-bg);color:var(--sidebar-ink);display:flex;flex-direction:column;padding:22px 16px 18px;position:sticky;top:0;height:100vh;transition:margin-left .15s;overflow:hidden;}
  .sidebar.collapsed{margin-left:-248px;}
  /* George changed his mind back (ISSUES.md, round after centring): logo + title left-
     aligned, in line with the nav items below, not centred. Tidied sidebar generally --
     smaller/tighter type throughout (round-2 ask: "clunky, needs smaller text"). */
  .sidebar .logo-row{display:flex;align-items:center;gap:10px;padding:4px 6px 18px;}
  .sidebar .logo-row img{height:34px;width:auto;filter:brightness(0) invert(1);display:block;}
  .sidebar .tool-name{font-family:"Poppins";font-size:13px;font-weight:700;letter-spacing:.02em;color:#fff;}
  .hamburger-btn{background:none;border:none;color:var(--ink);font-size:18px;cursor:pointer;padding:4px 8px;margin-right:4px;border-radius:6px;}
  .hamburger-btn:hover{background:var(--bg);}
  nav.navgroups{flex:1;overflow-y:auto;}
  .navgroup{margin-bottom:14px;}
  .navgroup .label{font-size:14px;font-weight:600;color:var(--sidebar-ink);padding:0 10px 6px;}
  .navitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:12.5px;color:var(--sidebar-ink);text-decoration:none;cursor:pointer;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;font-family:inherit;}
  .navitem:hover{background:rgba(255,255,255,.06);}
  .navitem.active{background:var(--sidebar-active-bg);color:#fff;font-weight:600;}
  .navitem .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex:none;}
  .navitem .skel{opacity:.4;}
  .sidebar-foot{border-top:1px solid rgba(255,255,255,.12);padding-top:14px;margin-top:6px;font-size:12px;color:var(--sidebar-ink-dim);display:flex;align-items:center;gap:8px;}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--p2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex:none;}

  main{padding:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 28px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5;}
  .target-chip{display:flex;align-items:center;gap:8px;font-size:13px;background:var(--accent-soft-bg);border:1px solid var(--accent-soft-border);color:var(--accent);padding:6px 12px;border-radius:99px;font-weight:600;}
  .target-chip .seg{opacity:.55;font-weight:500;margin:0 2px;}
  .btn{font-family:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;}
  .btn.primary{background:var(--p1);border-color:var(--p1);color:#fff;}

  .content{padding:26px 28px 60px;width:100%;max-width:1600px;}
  .page-head{margin-bottom:16px;}
  .page-head h1{font-size:22px;margin:0 0 4px;font-weight:600;}
  .page-head p{color:var(--ink-soft);margin:0;font-size:13.5px;}
  /* Global title-row pattern (2026-09-18, ISSUES.md): a page's title stays put, but its
     "meta" line (generated date, warnings, quick facts) renders as small pills to the right
     of the title instead of a paragraph underneath -- tighter to the title, still tidy.
     Opt-in via pageHeadPills(title, subtitle, pills[]) rather than a blanket rewrite of every
     view, so pages keep a plain descriptive subtitle where that's genuinely what they have. */
  .page-head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px;}
  .page-head-row h1{font-size:22px;margin:0;font-weight:600;}
  .page-head-pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .sync-btn{display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid var(--p1);background:var(--p1);color:#fff;cursor:pointer;}
  .sync-btn:hover{background:var(--p1-700);border-color:var(--p1-700);}
  .sync-btn:disabled{opacity:.6;cursor:default;}
  .sync-btn .spin{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .fixture-note{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--warn);background:var(--warn-bg);padding:4px 10px;border-radius:99px;margin-bottom:16px;}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);}
  .stat .n{font-family:"Poppins";font-size:24px;font-weight:600;display:block;font-variant-numeric:tabular-nums;}
  .stat .l{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}
  .stat.ok .n{color:var(--ok);} .stat.warn .n{color:var(--warn);} .stat.bad .n{color:var(--bad);}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px;position:relative;}
  .card .corner-link{position:absolute;top:14px;right:16px;font-size:11px;font-weight:500;padding:3px 10px;border:1px solid var(--line);border-radius:5px;color:var(--ink);text-decoration:none;background:var(--bg);}
  .card .corner-link:hover{border-color:var(--accent, var(--ink));}
  .card h2{font-size:15px;margin:0 0 12px;font-weight:600;padding-right:70px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;}
  .pill.ok{background:var(--ok-bg);color:var(--ok);} .pill.warn{background:var(--warn-bg);color:var(--warn);} .pill.bad{background:var(--bad-bg);color:var(--bad);}
  .pill.ai{background:var(--ai-bg);color:var(--ai);} .pill.code{background:var(--code-bg);color:var(--code);}
  .pill.gate{background:var(--gate-bg);color:var(--gate);} .pill.human{background:var(--human-bg);color:var(--human);}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}

  /* --- Pipelines: simplified list + flow-underneath, replacing the dense FigJam board --- */
  .pipeline-row{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;background:var(--surface);}
  .pipeline-row .head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;cursor:pointer;gap:12px;}
  .pipeline-row .head:hover{background:var(--bg);}
  .pipeline-row .head .name{font-weight:600;font-size:14px;}
  .pipeline-row .head .name code{font-size:11.5px;color:var(--ink-soft);font-weight:400;margin-left:6px;}
  .pipeline-row .density{display:flex;gap:6px;align-items:center;}
  .density-chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;}
  .chevron{transition:transform .15s;color:var(--ink-soft);}
  .pipeline-row.open .chevron{transform:rotate(90deg);}
  .pipeline-row .flow{display:none;padding:4px 16px 16px;border-top:1px solid var(--line);}
  .pipeline-row.open .flow{display:block;}
  .flow-step{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px;position:relative;}
  .flow-step:not(:last-child){border-bottom:1px dashed var(--line);}
  .flow-step .stepkind{width:78px;flex:none;}
  .flow-step .stepid{font-weight:600;}
  .flow-step .stepdetail{color:var(--ink-soft);font-size:12.5px;}
  .flow-step .steploop{margin-left:auto;font-size:11px;color:var(--accent);background:var(--accent-soft-bg);padding:2px 8px;border-radius:99px;white-space:nowrap;}

  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .legend .chip{display:flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);color:var(--ink-soft);}
  .legend .chip .sw{width:9px;height:9px;border-radius:3px;flex:none;}

  .tab-bar{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line);}
  .tab-btn{font-family:inherit;font-size:13.5px;font-weight:600;padding:9px 4px;margin-right:18px;border:none;background:none;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;}
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--accent, var(--ink));}

  .stage-group{margin-bottom:14px;}
  .stage-header{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;}
  .stage-header:hover{background:var(--bg);}
  .stage-header .chevron{margin-left:8px;}
  .stage-group.open .stage-header .chevron{transform:rotate(90deg);}
  .stage-body{display:none;padding-top:10px;}
  .stage-group.open .stage-body{display:block;}

  .activity{list-style:none;margin:0;padding:0;}
  .activity li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .activity li:last-child{border-bottom:none;}

  .loading{color:var(--ink-soft);font-size:13px;padding:20px 0;}
  .errbox{color:var(--bad);background:var(--bad-bg);padding:12px 14px;border-radius:8px;font-size:13px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(32,30,29,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface);border-radius:14px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(56,0,61,.25);overflow:hidden;}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .modal-head h3{margin:0;font-size:16px;font-weight:600;}
  .modal-close{background:none;border:none;font-size:18px;color:var(--ink-soft);cursor:pointer;line-height:1;padding:2px 6px;}
  .modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:14px;}
  .field label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);margin-bottom:5px;}
  .field select{width:100%;font-family:inherit;font-size:13.5px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);}
  .suite-readout{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;}
  .suite-readout.missing{color:var(--warn);background:var(--warn-bg);border-color:transparent;}
  .suite-readout .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);display:block;margin-bottom:3px;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}

  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;}
  @media (max-width:960px){.grid2{grid-template-columns:1fr;}}
  .tooltip-wrap{position:relative;display:inline-block;}
  .tooltip-wrap .tip{visibility:hidden;opacity:0;position:absolute;bottom:calc(100% + 8px);left:50%;
    transform:translateX(-50%);background:var(--n900);color:#fff;font-size:11.5px;padding:6px 10px;
    border-radius:6px;white-space:nowrap;transition:opacity .12s;z-index:10;}
  .tooltip-wrap:hover .tip{visibility:visible;opacity:1;}
  .pipeline-detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;}
  .pipeline-detail-head p{color:var(--ink-soft);font-size:13.5px;margin:4px 0 0;max-width:64ch;}

  /* --- Step & variant accordions: a small "what it does" panel under each row --- */
  .flow-step.clickable{cursor:pointer;}
  .flow-step.clickable:hover{background:var(--bg);border-radius:6px;}
  .step-chevron{margin-left:auto;transition:transform .15s;color:var(--ink-soft);flex:none;}
  .flow-step-wrap.step-open .step-chevron{transform:rotate(90deg);}
  .step-detail{display:none;padding:2px 0 12px 88px;font-size:12.5px;color:var(--ink-soft);}
  .flow-step-wrap.step-open .step-detail{display:block;}
  .step-detail-line{margin-bottom:5px;}
  .step-detail-line b{font-weight:600;margin-right:5px;padding:1px 7px;border-radius:5px;font-size:11.5px;display:inline-block;}
  .step-detail-line code{font-size:11.5px;background:var(--bg);padding:1px 5px;border-radius:5px;}
  .step-detail-empty{font-style:italic;}
  .step-detail-line.plain{font-size:13px;color:var(--ink);margin-bottom:8px;}
  /* Key labels tinted the same as the kind pill they belong to (AI/code/gate/human) — so the
     same colour means the same thing everywhere on the page, not just on the top-level badge. */
  .step-detail-line b.k-code{background:var(--code-bg);color:var(--code);}
  .step-detail-line b.k-ai{background:var(--ai-bg);color:var(--ai);}
  .step-detail-line b.k-gate{background:var(--gate-bg);color:var(--gate);}
  .step-detail-line b.k-human{background:var(--human-bg);color:var(--human);}

  .variant-row{cursor:pointer;}
  .variant-row:hover{background:var(--bg);}
  .variant-row .chevron{display:inline-block;font-size:11px;}
  .variant-row.open .chevron{transform:rotate(90deg);}
  .chevron-cell{width:20px;}
  .variant-detail-body{padding:8px 2px 6px;}
  .variant-detail-body p{margin:0 0 8px;color:var(--ink-soft);}
  .variant-detail-body .step-detail-empty{color:var(--ink-soft);}

  /* Collapsible sidebar groups (Start/Build/Audit/Maintain) — accordion, not a flat wall. */
  .navgroup.collapsible .navgroup-header{display:flex;align-items:center;justify-content:space-between;padding:0 10px 6px;cursor:pointer;}
  .navgroup.collapsible .navgroup-header:hover .label{color:var(--sidebar-ink);}
  .navgroup.collapsible .navgroup-header .chevron{font-size:10px;transition:transform .15s;}
  .navgroup.collapsible.open .navgroup-header .chevron{transform:rotate(90deg);}
  .navgroup.collapsible .navgroup-items{display:none;}
  .navgroup.collapsible.open .navgroup-items{display:block;}
  .navitem.disabled{opacity:.4;cursor:not-allowed;pointer-events:none;}
  /* Bug fix (2026-09-17): toggled on gated nav groups (navBuild/navAudit/navMaintain) by
     refreshSetupGate() but this rule never existed, so the group label itself never visibly
     dimmed -- only the individual .navitem.disabled buttons inside it did. */
  .navgroup.setup-gated > .navgroup-header .label{opacity:.5;}

  /* 2x2 pill grid (ISSUES.md ask): Test-Ops / Automation / Project / Reports. The last two
     are real, deliberate placeholders for a future phase -- shown disabled with a "soon"
     tag rather than hidden, so the intended shape of the console is visible now. */
  .console-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:0 8px 16px;}
  .console-tab{font-family:inherit;font-size:12px;font-weight:600;padding:7px 0;border-radius:7px;border:none;background:none;color:var(--sidebar-ink-dim);cursor:pointer;}
  .console-tab:hover{color:var(--sidebar-ink);}
  .console-tab.active{background:rgba(255,255,255,.1);color:#fff;}
  .console-tab.placeholder{opacity:.45;cursor:default;}
  .console-tab.placeholder:hover{color:var(--sidebar-ink-dim);}
  .console-tab .soon{font-size:9px;display:block;font-weight:500;letter-spacing:.03em;opacity:.8;}

  /* Sidebar parent-group headers as a pill/tab (2026-09-18, ISSUES.md ask: "pills or tabs,
     clearer arrows, more obvious to open/close") -- a soft background block instead of bare
     text, chevron kept but a touch bigger. */
  .navgroup.collapsible .navgroup-header{background:rgba(255,255,255,.05);border-radius:8px;padding:8px 10px;margin-bottom:2px;}
  .navgroup.collapsible .navgroup-header:hover{background:rgba(255,255,255,.09);}
  .navgroup.collapsible.open .navgroup-header{background:rgba(255,255,255,.1);}
  /* More prominent accordion arrows (ISSUES.md round 2): bigger, bolder, brighter than the
     surrounding dimmed label so open/close state reads at a glance. */
  .navgroup.collapsible .navgroup-header .chevron{font-size:15px;font-weight:700;color:#fff;opacity:.85;}
  .navgroup .navgroup-header .chevron{font-size:15px;font-weight:700;}
  /* "How to get started" stage styled Arrive purple with numbered pill sub-items
     (2026-09-18, ISSUES.md ask) -- opt-in class applied only to that one stage-group so
     the other stages (Once set up / Maintenance / Human led) keep today's plain look. */
  .stage-group.stage-featured .stage-header{background:var(--p1);color:#fff;}
  .stage-group.stage-featured .stage-header .chevron{color:#fff;}
  .stage-group.stage-featured .pipeline-row{border:1px solid var(--accent-soft-border);border-radius:10px;margin-bottom:8px;overflow:hidden;}
  .step-order-pill{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--p1);color:#fff;font-size:11px;font-weight:700;flex:none;margin-right:8px;}

  /* Repo map: nested folder tree (2026-09-18, ISSUES.md ask for a GitHub-style browser) */
  .repo-tree-folder{margin:2px 0;}
  .repo-tree-folder-head{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;}
  .repo-tree-folder-head:hover{background:var(--bg);}
  .repo-tree-folder-head .chevron{font-size:10px;transition:transform .15s;}
  .repo-tree-folder.open > .repo-tree-folder-head .chevron{transform:rotate(90deg);}
  .repo-tree-folder-body{display:none;margin-left:18px;border-left:1px solid var(--line);padding-left:10px;}
  .repo-tree-folder.open > .repo-tree-folder-body{display:block;}

  /* Gap register: click-a-gap modal (2026-09-18, ISSUES.md ask) */
  .gap-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:center;justify-content:center;}
  .gap-modal-overlay.open{display:flex;}
  .gap-modal{background:var(--surface);border-radius:12px;max-width:560px;width:92%;max-height:85vh;overflow-y:auto;padding:20px;}

  /* Repo map: folder tree content now rendered inside a pill-styled card, matching the
     rest of the app's "pill" visual language instead of a bare nested list (ISSUES.md
     round 2: "don't understand the pill look... inside content should be in the same pill
     div area"). */
  .repo-tree-pillbox{background:var(--accent-soft-bg);border:1px solid var(--accent-soft-border);border-radius:10px;padding:10px 12px;margin-top:4px;}

  /* Real "still working" activity animation on a running step/pipeline -- no fabricated %
     or ETA (ISSUES.md round 2 ask for a progress bar; decided against faking a number the
     app genuinely doesn't know -- see ISSUES.md status note). Three pulsing dots, honest
     about "alive", not about "how much is left". */
  .working-dots{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle;}
  .working-dots span{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.3;animation:workingPulse 1.1s infinite ease-in-out;}
  .working-dots span:nth-child(2){animation-delay:.15s;} .working-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes workingPulse{0%,80%,100%{opacity:.25;transform:scale(.85);} 40%{opacity:1;transform:scale(1);}}

  /* Wider, more responsive Change Target modal (ISSUES.md round 2: "the responsive of this

  #targetModal .modal{max-width:min(920px, 65vw);}

<script>
const KIND_META = {
  cli:   {label: 'CODE',  cls: 'code'},
  agent: {label: 'AI',    cls: 'ai'},
  gate:  {label: 'GATE',  cls: 'gate'},
  human: {label: 'HUMAN', cls: 'human'},
  composite_ref: {label: 'SUB-FLOW', cls: 'human'},
};

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) { const body = await res.json().catch(() => ({})); throw new Error(body.detail || res.statusText); }
  return res.json();
}

function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

/* Plain-language glosses -- every entry here is sourced from a real doc, simplified, never
   invented. CLI subcommands come verbatim from system-test-ops CLAUDE.md's "CLI quick
   reference"; agent roles from the same file's "The team" table (also each agent's own
   .claude/agents/<name>.md). Kept as a lookup, not a generator, so nothing here can drift
   into asserting behaviour that isn't actually documented. */
const CLI_SUBCOMMAND_GLOSS = {
  doctor: 'Checks the environment is ready — credentials, connectivity.',
  check: 'Confirms TestRail credentials work and lists visible projects.',
  'discover-fields': "Prints the exact settings this TestRail project needs before pushing cases to it.",
  cases: 'Pulls the suite’s cases from TestRail as a plain data file.',
  runs: 'Pulls the last N test runs for this suite from TestRail.',
  push: 'Writes cases to the new suite only — old/source suites are never touched.',
  audit: 'Checks a suite’s cases against the house Gherkin standard, read-only.',
  'coverage-prefilter': 'Narrows down which cases might already cover a JIRA item, before a person/agent looks closer.',
  'render-report': 'Turns the raw findings into the readable report file.',
  'gap-register': 'Scans for GAP/UNCONFIRMED markers left in cases and notes.',
  'build-stats': 'Snapshots the suite: what changed since last time, and current health.',
};
// Plain-language gloss per pipeline, one level simpler than its real `description:` field
// (shown alongside it, never instead of it) -- simplified wording only, no new claims.
const PIPELINE_PLAIN = {
  start: 'The front door — checks your setup is ready, asks what you want to do, and points you to the right process.',
  'add-feature': 'Adds test coverage for a new feature by extending the flow it changes.',
  'audit-coverage': "Checks whether the suite already covers a given JIRA release, and drafts what's missing. Doesn't change TestRail.",
  // Answered on ISSUES.md, 2026-09-18: "what is it auditing, an uploaded doc, or the SIT
  // flows?" -- neither, exactly. Its inputs (per audit-flows.yaml) are knowledge/flows/
  // {project}-{device}-*.md -- transcribed Overflow UX exports, NOT a raw doc you upload
  // here, and NOT the same thing as the SIT screenflow_map.jsonc graphs shown under
  // Automation > Screen flows (a different, device-behaviour-level flow map entirely).
  'audit-flows': "Compares a device's UX flow map (knowledge/flows/*.md, transcribed from Overflow — not an uploaded doc, and not the same as SIT's own screen-flow graphs) against the live suite, and fills in what's already covered.",
  audit: "Checks a suite's cases follow the house test-writing standard. Doesn't change anything.",
  consolidate: 'Merges near-duplicate cases that test the same thing into one clean case.',
  'export-automation': "Hands off cases marked automatable to the automation-tests repo, as a to-do list.",
  'fold-defect': 'Folds a found-and-fixed bug into the test case that should have caught it, so it stays covered.',
  'ingest-docs': "Turns a project's raw requirement docs into short, cited notes the team can work from.",
  maintain: 'Periodic health check — run history, standards compliance, and duplicate cases.',
  'new-suite-from-docs': "Chains Ingest + Onboarding in one run. Real, but not offered as a button -- for a project the size of Translink it expands to 136 steps, 65 AI calls and 59 approval gates; run the two separately instead.",
  'onboard-suite': 'Builds (or rebuilds) a suite for a device from scratch, checking real sources first.',
  'resolve-gaps': 'Turns open questions (GAP/UNCONFIRMED markers) into confirmed, cited facts.',
  'review-runs': "Looks at recent test runs and recommends what to add, edit, remove, or reorganise. Doesn't change TestRail.",
};
const AGENT_PLAIN = {
  'test-lead': 'The orchestrator — runs the other specialists and pulls their findings into one report.',
  'coverage-analyst': 'Checks whether TestRail cases actually cover what a JIRA fix version asked for.',
  'run-historian': 'Looks at recent test runs and flags cases that are always failing, flaky, or never run.',
  'gherkin-author': 'Drafts new or edited test case text in the house format — never writes to TestRail directly.',
  'standards-keeper': 'Reviews drafts and existing cases for consistent style and wording.',
};
// Per-step overrides, keyed `<pipeline-id>:<step-id>` — for steps whose real YAML has no
// `command:`/`agent:` for plainGlossFor to key off (e.g. start.yaml's `intake`/`route`,
// see app.py's own note on `route` having no real `command:`). Wording sourced from each
// step's real `collects:`/`note:` field, just put in plain language — nothing invented.
const STEP_PLAIN = {
  'start:intake': 'Asks you what you want to do, and which project/device/suite it’s for.',
  'start:route': 'Looks up what you chose and starts the matching process automatically.',
};
function plainGlossFor(s, pipelineId) {
  if (pipelineId && STEP_PLAIN[`${pipelineId}:${s.id}`]) return STEP_PLAIN[`${pipelineId}:${s.id}`];
  if (s.kind === 'cli' && s.command) {
    const m = s.command.match(/system_test_ops\s+([a-z-]+)/);
    if (m && CLI_SUBCOMMAND_GLOSS[m[1]]) return CLI_SUBCOMMAND_GLOSS[m[1]];
  }
  if (s.kind === 'agent' && s.agent && AGENT_PLAIN[s.agent]) return AGENT_PLAIN[s.agent];
  if (s.is_composite_ref || s.ref_pipeline || s.ref) return `Runs another whole process (${s.ref_pipeline || s.ref}) at this point, then continues.`;
  if (s.kind === 'gate') return 'A checkpoint — the process only continues if this condition holds.';
  if (s.kind === 'human') return 'Needs a person to do this directly — not automated.';
  return null;
}
// Renamed labels for specific step ids, same pattern as PIPELINE_DISPLAY_NAME below — the
// real step `id` (used by dispatch/YAML/`when:` expressions) is untouched, only the shown
// label changes; the real id is kept alongside in parens so nothing's hidden.
const STEP_DISPLAY_NAME = {
  preflight: 'Check setup',
  fix_ready_items: 'Running installs',
  human_setup: 'Things for you to do',
};

/* ---------------- Shared step renderer: accordion "what it does" panel per step ----------------
   Line order (George's ask, ISSUES.md): plain-language "what it does" first, then the files
   this step touches (reads/produces), THEN the heavier technical/command wording, then the
   rest (when/rule/gate/etc.) last. */
function renderStep(s, pipelineId) {
  const meta = KIND_META[s.kind] || KIND_META.human;
  const asText = (v) => Array.isArray(v) ? v.join(', ') : v;
  const lines = [];
  const gloss = plainGlossFor(s, pipelineId);
  if (gloss) lines.push(`<div class="step-detail-line plain">${esc(gloss)}</div>`);
  if (s.collects) lines.push(`<div class="step-detail-line"><b class="k-human">Asks you for</b> ${esc(asText(s.collects))}</div>`);
  if (s.actions && s.actions.length) lines.push(`<div class="step-detail-line"><b class="k-human">Things to do</b><ul style="margin:4px 0 0 18px;padding:0;">${s.actions.map(a => `<li>${esc(a)}</li>`).join('')}</ul></div>`);
  if (s.reads) lines.push(`<div class="step-detail-line"><b class="k-code">Reads</b> ${esc(asText(s.reads))}</div>`);
  if (s.produces) lines.push(`<div class="step-detail-line"><b class="k-code">Produces</b> ${esc(asText(s.produces))}</div>`);
  if (s.command) lines.push(`<div class="step-detail-line"><b class="k-code">Command</b> <code>${esc(s.command)}</code></div>`);
  if (s.note) lines.push(`<div class="step-detail-line"><b class="k-human">Detail</b> ${esc(s.note)}</div>`);
  if (s.agent) lines.push(`<div class="step-detail-line"><b class="k-ai">Agent</b> ${esc(s.agent)}</div>`);
  if (s.reviewer) lines.push(`<div class="step-detail-line"><b class="k-ai">Reviewer</b> ${esc(s.reviewer)}</div>`);
  if (s.ref_pipeline || s.ref) lines.push(`<div class="step-detail-line"><b class="k-human">Runs pipeline</b> ${esc(s.ref_pipeline || s.ref)}</div>`);
  if (s.when) lines.push(`<div class="step-detail-line"><b class="k-gate">When</b> ${esc(s.when)}</div>`);
  if (s.rule) lines.push(`<div class="step-detail-line"><b class="k-gate">Rule</b> ${esc(s.rule)}</div>`);
  if (s.gate) lines.push(`<div class="step-detail-line"><b class="k-gate">Gate</b> ${esc(s.gate)}</div>`);
  if (s.must_be) lines.push(`<div class="step-detail-line"><b class="k-gate">Must be</b> ${esc(s.must_be)}</div>`);
  if (s.parallel) lines.push(`<div class="step-detail-line"><b class="k-ai">Runs in parallel with</b> ${esc(asText(s.parallel))}</div>`);
  if (s.guardrails && s.guardrails.length) lines.push(`<div class="step-detail-line"><b class="k-gate">Guardrails</b> ${s.guardrails.map(esc).join(', ')}</div>`);
  const hasDetail = lines.length > 0;
  const shownId = STEP_DISPLAY_NAME[s.id] || s.id;
  return `<div class="flow-step-wrap">
    <div class="flow-step ${hasDetail ? 'clickable' : ''}">
      <span class="stepkind pill ${meta.cls}">${meta.label}</span>
      <span class="stepid">${esc(shownId)}${STEP_DISPLAY_NAME[s.id] ? ` <span style="color:var(--ink-soft);font-weight:400;">(${esc(s.id)})</span>` : ''}</span>
      <span class="stepdetail">${esc(s.agent || s.command || s.ref || s.ref_pipeline || '')}</span>
      ${s.loop ? `<span class="steploop">${esc(s.loop)}</span>` : ''}
      ${hasDetail ? '<span class="step-chevron chevron">▸</span>' : ''}
    </div>
    ${hasDetail ? `<div class="step-detail">${lines.join('')}</div>` : ''}
  </div>`;
}

const content = document.getElementById('content');
function setContent(html) { content.innerHTML = html; }
function loading() { setContent('<div class="loading">Loading real data…</div>'); }
function errbox(msg) { setContent(`<div class="errbox">${esc(msg)}</div>`); }

/* Delegated clicks: step accordions + feature-variant accordions, works across all views
   since content.innerHTML is replaced wholesale on every render (a listener bound directly
   to a row would be destroyed with it; delegation from the stable `content` element survives). */
content.addEventListener('click', (e) => {
  const gotoLink = e.target.closest('[data-goto-view]');
  if (gotoLink) {
    e.preventDefault();
    const view = gotoLink.dataset.gotoView;
    const navBtn = document.querySelector(`.navitem[data-view="${view}"]`);
    if (navBtn) { setActiveNav(navBtn); ACTIVE_VIEW = view; CURRENT_RERENDER = () => VIEWS[view](); CURRENT_RERENDER(); }
    return;
  }
  const gotoPipeline = e.target.closest('[data-goto-pipeline]');
  if (gotoPipeline) {
    e.preventDefault();
    renderPipelineDetail(gotoPipeline.dataset.gotoPipeline);
    return;
  }
  const gotoAview = e.target.closest('[data-goto-aview]');
  if (gotoAview) {
    e.preventDefault();
    const view = gotoAview.dataset.gotoAview;
    const navBtn = document.querySelector(`.navitem[data-aview="${view}"]`);
    if (navBtn) { setActiveNav(navBtn); AUTOMATION_VIEWS[view](); }
    return;
  }
  const stepHead = e.target.closest('.flow-step.clickable');
  if (stepHead) { stepHead.parentElement.classList.toggle('step-open'); return; }
  const vRow = e.target.closest('.variant-row');
  if (vRow) {
    vRow.classList.toggle('open');
    const detail = vRow.nextElementSibling;
    if (detail && detail.classList.contains('variant-detail')) {
      detail.style.display = detail.style.display === 'table-row' ? 'none' : 'table-row';
    }
  }
});

// to the current target -- renders regardless of which project/device is selected, and

function renderAiUsageWidget() {

function wirePipelineRows(root) {

          const detail = await fetchJSON(`/api/pipelines/${row.dataset.id}`);
          flowEl.innerHTML = detail.steps.map(renderStep).join('');

// GLOBALLY: opening one accordion closes its siblings within the same root (ISSUES.md
// round 2). Scoped to `root`'s own top-level stage-groups, not the whole page, so this
// stays correct across every place wireStageAccordions is reused (Processes, Features
// grouped-by-feature, Repo map).
function wireStageAccordions(root) {
  const groups = Array.from(root.querySelectorAll(':scope > .stage-group'));
  root.querySelectorAll('.stage-header').forEach(header => {
    header.addEventListener('click', () => {
      const group = header.parentElement;
      const willOpen = !group.classList.contains('open');
      if (willOpen) groups.forEach(g => { if (g !== group) g.classList.remove('open'); });
      group.classList.toggle('open');
    });
  });
}

// A pasted JIRA browser URL (e.g. https://yourorg.atlassian.net/browse/PROJ-123, or the
// same with a query string/#comment suffix) -> just the key. Anything that doesn't match
// is returned unchanged -- a bare key, a fix-version label, or free text all pass through
// as-is (George, 2026-09-22: "i just wanna be able to have the ability to maybe even just
// copy and paste the jira url... and it just knows what it's doing").
const JIRA_URL_KEY_RE = /\/browse\/([A-Z][A-Z0-9]+-\d+)\b/i;
function extractJiraKey(raw) {
  const m = raw.match(JIRA_URL_KEY_RE);
  return m ? m[1].toUpperCase() : raw;
}

// targeted-run's real section checkbox tree -- keeps the hidden `areas` extra-input in
// sync with whichever boxes are checked, comma-joined by real section NAME (matching
// exactly what `create-run --areas` substring-matches against each case's section_path
// server-side -- no client-side translation, the value sent is the value TestRail
// already uses).
function wireAreasTree(root) {
  root.querySelectorAll('[data-areas-tree]').forEach(tree => {
    const hidden = tree.parentElement.querySelector('[data-extra-input="areas"]');
    if (!hidden) return;
    const sync = () => {
      const checked = Array.from(tree.querySelectorAll('[data-area-checkbox]:checked')).map(el => el.value);
      hidden.value = checked.join(', ');
    };
    tree.querySelectorAll('[data-area-checkbox]').forEach(cb => cb.addEventListener('change', sync));
  });
}

// Repeatable chip/tag input for a multi-value pipeline input (fix_version /
// feature_or_jira_key -- ISSUES.md round 4: "need a way to tell it multiple jiras").
// Renders removable chips + an add box; keeps the real submitted value as one
// comma-joined string in the sibling hidden `[data-extra-input]`, so runPipeline's
// existing generic collection loop needs no changes at all.
function wireChipFields(root) {
  root.querySelectorAll('[data-chip-field]').forEach(field => {
    const list = field.querySelector('[data-chip-list]');
    const hidden = field.querySelector('[data-extra-input]');
    const textInput = field.querySelector('[data-chip-text-input]');
    const addBtn = field.querySelector('[data-chip-add]');
    let values = [];
    function render() {
      hidden.value = values.join(', ');
      list.innerHTML = values.map((v, idx) => `
        <span class="chip" style="display:inline-flex;align-items:center;gap:6px;">${esc(v)}
          <button type="button" data-chip-remove="${idx}" style="background:none;border:none;cursor:pointer;color:inherit;font-size:13px;line-height:1;padding:0;">×</button>
        </span>`).join('');
    }
    function addFromInput() {
      const v = extractJiraKey(textInput.value.trim());
      if (!v) return;
      values.push(v);
      textInput.value = '';
      render();
      textInput.focus();
    }
    addBtn.addEventListener('click', addFromInput);
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addFromInput(); }
    });
    list.addEventListener('click', (e) => {
      const rm = e.target.closest('[data-chip-remove]');
      if (!rm) return;
      values.splice(Number(rm.dataset.chipRemove), 1);
      render();
    });
    render();
  });
}

/* ---------------- Features (common vs bespoke) ---------------- */
let FEATURES_DATA = null;

// A variant_name is "common" for a feature if 2+ different projects share that exact
// name for it (real cross-project reuse, not a guess) -- otherwise it's bespoke to the
// one project that has it. George's ask (2026-09-11): differentiate common vs bespoke
// visually on the cited-source pill.
function commonVariantNames(d, featureKey) {
  const byName = {};
  d.variants.filter(v => v.feature_key === featureKey).forEach(v => {
    (byName[v.variant_name] ||= new Set()).add(v.project);
  });
  return new Set(Object.entries(byName).filter(([, projects]) => projects.size > 1).map(([name]) => name));
}


// Full layout rebuild (ISSUES.md round 2, real ask): one flat, sortable, searchable list
// of every variant across every project/device -- a real Feature column shows what each
// row relates to, instead of the old grouped-by-feature (or grouped-by-device) cards. Row
// order is genuinely re-sortable (click a column header), not just re-filterable. Common/
// bespoke and the search/project/device filters all still apply -- same real predicates as
// before, just producing rows in one table instead of nested cards.
let featSort = {key: 'feature', dir: 1};
function featSortValue(row, key) {
  if (key === 'feature') return row.feature.name.toLowerCase();
  if (key === 'scope') return row.isCommon ? 'common' : 'bespoke';
  if (key === 'variant') return (row.v.variant_name || '').toLowerCase();
  if (key === 'source') return (row.v.citation.source_ref || '').toLowerCase();
  return (row.v[key] || '').toLowerCase();
}
function renderFeatureCards() {
  const d = FEATURES_DATA;
  const project = document.getElementById('featProjectFilter')?.value || '';
  const device = document.getElementById('featDeviceFilter')?.value || '';
  const q = (document.getElementById('featSearch')?.value || '').toLowerCase().trim();
  const scope = document.querySelector('.feat-scope-btn.active')?.dataset.scope || 'all'; // all|common|bespoke
  const filtering = !!(project || device || q || scope !== 'all');
  const matchesSearch = (...fields) => !q || fields.some(f => (f || '').toLowerCase().includes(q));

  const rows = [];
  d.variants.forEach(v => {
    const feature = d.features.find(f => f.key === v.feature_key) || {key: v.feature_key, name: v.feature_key, description: ''};
    if (!(!project || v.project.toLowerCase() === project.toLowerCase())) return;
    if (!(!device || (v.device_type || '').toLowerCase() === device.toLowerCase())) return;
    if (!(matchesSearch(v.variant_name, v.note, v.citation.source_ref) || matchesSearch(feature.name, feature.description, feature.key))) return;
    const isCommon = commonVariantNames(d, feature.key).has(v.variant_name);
    if (!(scope === 'all' || (scope === 'common') === isCommon)) return;
    rows.push({feature, v, isCommon});
  });
  rows.sort((a, b) => {
    const av = featSortValue(a, featSort.key), bv = featSortValue(b, featSort.key);
    return av < bv ? -featSort.dir : av > bv ? featSort.dir : 0;
  });

  const arrow = (key) => featSort.key === key ? (featSort.dir === 1 ? ' ▲' : ' ▼') : '';
  const th = (key, label) => `<th data-sort="${key}" style="cursor:pointer;user-select:none;">${esc(label)}${arrow(key)}</th>`;
  const tableRows = rows.map(({feature, v, isCommon}, i) => {
    const confPill = v.citation.confidence === 'confirmed' ? 'ok' : v.citation.confidence === 'gap' ? 'bad' : 'warn';
    return `<tr class="variant-row" data-frow="${i}">
      <td class="chevron-cell"><span class="chevron">▸</span></td>
      <td>${esc(feature.name)} <code style="font-size:10.5px;color:var(--ink-soft);font-weight:400;">${esc(feature.key)}</code></td>
      <td>${esc(v.project)}</td><td>${esc(v.device_type || '—')}</td><td>${esc(v.variant_name)}</td>
      <td><span class="pill ${isCommon ? 'gate' : 'human'}">${isCommon ? 'Common' : 'Bespoke'}</span></td>
      <td><span class="pill ${isCommon ? 'gate' : 'code'}">${esc(v.citation.source_ref)}</span></td>
    </tr>
    <tr class="variant-detail" style="display:none">
      <td></td>
      <td colspan="6">
        <div class="variant-detail-body">
          <p>${feature.description ? esc(feature.description) + ' — ' : ''}${v.note ? esc(v.note) : (feature.description ? '' : '<span class="step-detail-empty">No description recorded for this variant yet.</span>')}</p>
          <div class="legend" style="margin:0;">
            <span class="chip"><span class="sw" style="background:var(--code)"></span>${esc(v.citation.source_kind)}</span>
            <span class="pill ${confPill}">${esc(v.citation.confidence)}</span>
          </div>
        </div>
      </td>
    </tr>`;
  }).join('');

  const cardsEl = document.getElementById('featureCards');
  cardsEl.innerHTML = rows.length ? `
    <div class="card">
      <table>
        <tr>${th('feature', 'Feature')}${th('project', 'Project')}${th('device_type', 'Device')}${th('variant', 'Variant')}${th('scope', 'Scope')}${th('source', 'Cited source')}</tr>
        ${tableRows}
      </table>
    </div>` : '<div class="card"><p style="color:var(--ink-soft);font-size:13px;">No features/variants match this filter.</p></div>';

  cardsEl.querySelectorAll('[data-sort]').forEach(header => {
    header.addEventListener('click', () => {
      const key = header.dataset.sort;
      featSort = {key, dir: featSort.key === key ? -featSort.dir : 1};
      renderFeatureCards();
    });
  });
  cardsEl.querySelectorAll('tr[data-frow]').forEach(row => {
    row.addEventListener('click', () => {
      row.classList.toggle('open');
      row.nextElementSibling.style.display = row.classList.contains('open') ? '' : 'none';
    });
  });
  const countEl = document.getElementById('featureFilterCount');
  if (countEl) countEl.textContent = filtering
    ? `Showing ${rows.length} variant(s) matching this filter.` : `${rows.length} variant(s) total — click a row to expand it, click a column header to sort.`;
}

// Plain-English gloss per section -- the API only has file-level purpose (docstring/
// frontmatter), nothing section-level. George's ask (2026-09-11): "what is this, what
// are these files, how are they used" at the section-header level.
const REPO_MAP_SECTION_PLAIN = {
  'system-test-ops — deterministic core (system_test_ops/)': 'The real installed Python package — TestRail client, CLI commands, case-writing logic. Every pipeline this console runs shells out to code in here.',
  'system-test-ops — scripts (tools/)': 'Standalone one-off scripts (repo-map generation, mirrors, data sweeps) — not part of the installed package, run directly with `python tools/...`.',
  'system-test-ops — agents (.claude/agents/)': 'Claude Code subagent definitions the pipelines delegate judgement-calls to (e.g. a coverage-analyst agent inside /audit-coverage).',
  'system-test-ops — commands (.claude/commands/)': 'The real /slash-command definitions (e.g. /audit, /onboard-suite) — this console\'s Processes page mirrors these, it doesn\'t reimplement them.',
  'test-ops-platform — model/ schema': 'This console\'s own data layer — devices, features, flows, pipelines, automation tests — everything the webapp reads from the real sibling repos.',
  'test-ops-platform — scripts (tools/)': 'This console\'s own standalone scripts, including the repo-map generator that builds this very page\'s data.',
};

// Real GitHub links -- both sibling repos are real, checked-in remotes (georgeoliver-hash/
// system-test-ops on `main`, georgeoliver-hash/test-ops-platform on `master`). Section title
// prefix says which repo a file belongs to; strip the leading "<repo-name>\" path segment
// build_sections() adds and turn backslashes into a real GitHub blob URL.
function repoLinkFor(sectionTitle, filePath) {
  const isSTO = sectionTitle.startsWith('system-test-ops');
  const repo = isSTO ? 'system-test-ops' : 'test-ops-platform';
  const branch = isSTO ? 'main' : 'master';
  const rel = filePath.replace(/\\/g, '/').replace(/^[^/]+\//, '');
  return `https://github.com/georgeoliver-hash/${repo}/blob/${branch}/${rel}`;
}

// GitHub-style expandable folder tree (2026-09-18, ISSUES.md ask), built client-side from
// the real file paths /api/repo-map already returns -- no backend change needed, since each
// file's `path` already carries its real folder structure.
function buildFileTreeHTML(sectionTitle, files) {
  const root = {};
  files.forEach(f => {
    const parts = f.path.replace(/\\/g, '/').split('/');
    let node = root;
    parts.slice(0, -1).forEach(seg => { node.children ||= {}; node = (node.children[seg] ||= {}); });
    (node.files ||= []).push({...f, name: parts[parts.length - 1]});
  });
  function renderNode(node, depth) {
    const folderHTML = Object.entries(node.children || {}).map(([name, child]) => `
      <div class="repo-tree-folder ${depth === 0 ? 'open' : ''}">
        <div class="repo-tree-folder-head"><span class="chevron">▸</span>📁 ${esc(name)}</div>
        <div class="repo-tree-folder-body">${renderNode(child, depth + 1)}</div>
      </div>`).join('');
    const fileRows = (node.files || []).map(f => `
      <tr><td><a href="${esc(repoLinkFor(sectionTitle, f.path))}" target="_blank" rel="noopener" style="font-size:12px;font-family:monospace;">${esc(f.name)}</a></td><td>${esc(f.purpose)}</td><td>${f.lines}</td></tr>`).join('');
    const fileTable = fileRows ? `<table><tr><th>File</th><th>Purpose</th><th>Lines</th></tr>${fileRows}</table>` : '';
    return folderHTML + fileTable;
  }
  return renderNode(root, 0);
}

// Restructured 2026-09-18 (ISSUES.md): promoted to its own top-level sidebar item (see the
// #navGapRegisterTop block), split into Project/Device/Common/Bespoke scopes (backed by the
// real /api/gap-register `scope` param -- see app.py), click-a-row opens a modal to answer
// it instead of scrolling to a free-standing form, and a direct "Resolve gaps" button.
// NOT built here, flagged honestly rather than faked: a real "sync" that pushes an answered
// gap back into a fresh audit/re-authoring pipeline run. resolve-gaps (the real pipeline)
// already turns GAP/UNCONFIRMED markers into cited facts, but wiring "I answered this in the
// console" through to "a pipeline run picks it up and edits the actual case" is genuinely
// more than a UI change -- it's the same pipeline-execution-from-the-console wiring the
// "Run" buttons elsewhere are already waiting on, not something to fake with a spinner here.
const GAP_PAGE_SIZE = 25;
let gapOffset = 0;
let gapScope = 'project';
const ENTRY_TYPE_LABEL = {answer: 'Answer', clarification_request: 'Clarification requested', conflict: 'Conflicts with spec'};
const GAP_SCOPE_TABS = [
  {key: 'project', label: 'Project gaps'},
  {key: 'device', label: 'Device gaps'},
  {key: 'common', label: 'Common gaps'},
  {key: 'bespoke', label: 'Bespoke gaps'},
];

function openGapModal(marker) {
  const overlay = document.getElementById('gapModalOverlay');
  const body = document.getElementById('gapModalBody');
  const target = window.CURRENT_TARGET || {};
  body.innerHTML = `
    <div class="modal-head" style="padding:0 0 12px;"><h3 style="margin:0;">${esc(marker.kind)} — <code style="font-size:12px;">${esc(marker.file)}:${marker.line}</code></h3><button class="modal-close" id="gapModalClose">&times;</button></div>
    <p style="font-size:13.5px;">${esc(marker.text)}</p>
    ${marker.project ? `<p style="font-size:12px;color:var(--ink-soft);">Project: <b>${esc(marker.project)}</b>${marker.device ? ` · Device: <b>${esc(marker.device)}</b>` : ''}</p>` : ''}
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px;">
      <input id="gapModalQuestion" placeholder="Question (what needs confirming?)" style="font-family:inherit;font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);">
      <textarea id="gapModalAnswer" placeholder="Your answer" rows="3" style="font-family:inherit;font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical;"></textarea>
      <div style="display:flex;gap:8px;">
        <select id="gapModalEntryType" style="font-family:inherit;font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);">
          <option value="answer">Answer</option>
          <option value="clarification_request">Clarification requested</option>
          <option value="conflict">Conflicts with spec</option>
        </select>
        <input id="gapModalDevice" placeholder="Device (optional)" value="${esc(marker.device || target.device || '')}" style="flex:1;font-family:inherit;font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);">
      </div>
      <div id="gapModalMsg" style="font-size:12.5px;"></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button class="btn" id="gapModalCancel">Cancel</button>
        <button class="btn primary" id="gapModalSave">Log entry</button>
      </div>
    </div>`;
  overlay.classList.add('open');
  const close = () => overlay.classList.remove('open');
  document.getElementById('gapModalClose').addEventListener('click', close);
  document.getElementById('gapModalCancel').addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); }, {once: true});
  document.getElementById('gapModalSave').addEventListener('click', async () => {
    const question = document.getElementById('gapModalQuestion').value.trim();
    const answer = document.getElementById('gapModalAnswer').value.trim();
    const device = document.getElementById('gapModalDevice').value.trim();
    const entry_type = document.getElementById('gapModalEntryType').value;
    const msg = document.getElementById('gapModalMsg');
    if (!question || !answer) { msg.textContent = 'Question and answer are both required.'; return; }
    try {
      const res = await fetch('/api/gap-answers', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({project: marker.project || target.project, device: device || null, gap_ref: `${marker.file}:${marker.line}`, question, answer, entry_type}),
      });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
      close();
      renderGaps();
    } catch (e) { msg.textContent = 'Could not save: ' + e.message; }
  });
}

// Page renamed "Gap Register" -> "Gaps" (ISSUES.md round 2). Split into a "Gaps" tab (the
// marker table, click-to-answer -- unchanged mechanism) and a "Log" tab (everything about
// what's been answered/asked/synced so far) -- the old quick-add form fields at the bottom
// are gone; a gap is answered by clicking its row, full stop, per George's ask ("no need
// for the answer log form fields bit now if you just click and can answer").
let gapPageTab = 'gaps';

async function renderGaps() {
  loading();
  const target = window.CURRENT_TARGET || {};
  const project = (target.project || '').toLowerCase();
  const device = (target.device || '').toUpperCase();
  try {
    const params = new URLSearchParams({limit: GAP_PAGE_SIZE, offset: gapOffset, scope: gapScope});
    if (project) params.set('project', project);
    if (device) params.set('device', device);
    const [d, answers, lastResolve] = await Promise.all([
      fetchJSON(`/api/gap-register?${params}`),
      fetchJSON(`/api/gap-answers?project=${encodeURIComponent(target.project || '')}`).catch(() => []),
      target.project && target.device
        ? fetchJSON(`/api/pipelines/resolve-gaps/last-run?project=${encodeURIComponent(target.project)}&device=${encodeURIComponent(target.device)}`).catch(() => null)
        : Promise.resolve(null),
    ]);
    const rows = d.shown.map((g, i) => `<tr class="variant-row" data-gap-idx="${i}"><td>${esc(g.kind)}</td><td><code style="font-size:12px">${esc(g.file)}:${g.line}</code></td><td>${esc(g.text.slice(0, 100))}</td><td>${g.project ? `<span class="pill gate">${esc(g.project)}${g.device ? '/' + esc(g.device) : ''}</span>` : `<span class="pill human">common</span>`}</td></tr>`).join('');
    const pageStart = d.total ? d.offset + 1 : 0;
    const pageEnd = Math.min(d.offset + d.shown.length, d.total);
    const scopeNote = {
      project: `for ${esc(target.project || '(no target)')}, all devices`,
      device: `for ${esc(target.project || '(no target)')} / ${esc(target.device || '(no device)')}`,
      common: 'shared/cross-cutting content, not any one project\'s',
      bespoke: `for ${esc(target.project || '(no target)')} — everything tagged to it`,
    }[gapScope];

    const gapsTabHTML = `
      <div class="tab-bar">${GAP_SCOPE_TABS.map(t => `<button class="tab-btn gap-scope-btn ${t.key === gapScope ? 'active' : ''}" data-scope="${t.key}">${esc(t.label)}</button>`).join('')}</div>
      <p style="color:var(--ink-soft);font-size:12.5px;margin:8px 0 12px;">${scopeNote}, showing ${pageStart}-${pageEnd}. Click a row to answer it.</p>
      ${d.is_fixture ? `<div class="fixture-note">⚠ Fixture data from a real gap-register run, 2026-09-07 — not live.</div>` : ''}
      <div class="card">
        <table><tr><th>Kind</th><th>Location</th><th>Text</th><th>Scope</th></tr>${rows || `<tr><td colspan="4" style="color:var(--ink-soft);">No markers in this scope.</td></tr>`}</table>
        <div style="display:flex;gap:8px;align-items:center;margin-top:10px;">
          <button class="btn" id="gapPrevBtn" ${gapOffset === 0 ? 'disabled' : ''}>← Prev</button>
          <button class="btn" id="gapNextBtn" ${pageEnd >= d.total ? 'disabled' : ''}>Next →</button>
          <span style="color:var(--ink-soft);font-size:12px;">${pageStart}-${pageEnd} of ${d.total}</span>
        </div>
      </div>`;

    // Log tab: every real, dated fact about this target's gap activity -- answers logged
    // (with date/time), clarifications requested, spec conflicts, and the last resolve-gaps
    // sync (date/time + real status) -- George's ask (ISSUES.md round 2). Read-only; the
    // click-to-answer flow (Gaps tab) is the only way to add an entry now.
    const answerList = (type) => answers.filter(a => (a.entry_type || 'answer') === type).map(a => `
      <li>
        <b>${esc(a.gap_ref)}</b> — ${esc(a.answer)}
        <button class="btn" data-del-answer="${a.id}" style="font-size:11px;padding:3px 8px;margin-left:6px;">Remove</button>
        <span style="color:var(--ink-soft);font-size:11px;display:block;">Q: ${esc(a.question)} — answered by ${esc(a.answered_by)}, ${esc(new Date(a.created_at + 'Z').toLocaleString())}${a.device ? ` (${esc(a.device)})` : ''}</span>
      </li>`).join('');
    const answerSection = (type, label) => {
      const items = answerList(type);
      return `<div><h3 style="font-size:13px;margin:10px 0 6px;">${esc(label)}</h3>${items ? `<ul class="activity">${items}</ul>` : `<p style="color:var(--ink-soft);font-size:13px;">None logged yet.</p>`}</div>`;
    };
    const lastSyncLine = lastResolve && lastResolve.status
      ? `<span class="pill ${lastResolve.status === 'succeeded' ? 'ok' : lastResolve.status === 'failed' ? 'bad' : 'warn'}">${esc(lastResolve.status)}</span> ${lastResolve.updated_at ? esc(new Date(lastResolve.updated_at + 'Z').toLocaleString()) : ''}`
      : `<span style="color:var(--ink-soft);">Never run for ${esc(target.project || '(no target)')}/${esc(target.device || '')} yet.</span>`;
    const logTabHTML = `
      <div class="card">
        <h2>Last sync (resolve-gaps) <a href="#" data-goto-pipeline="resolve-gaps" style="font-size:11.5px;font-weight:400;">Run →</a></h2>
        <p style="font-size:13.5px;margin:0;">${lastSyncLine}</p>
      </div>
      <div class="card">
        <h2>Answer log — ${esc(target.project || 'no target')}</h2>
        <p style="color:var(--ink-soft);font-size:12.5px;margin:0 0 10px;">A real, dated, code-only record — plain storage, never AI-written. Answering a gap here does not automatically re-audit or re-edit the suite yet (needs the same pipeline-execution-from-console wiring flagged in the carried-forward list); this is the decision trail in the meantime.</p>
        ${answerSection('answer', 'Answers')}
        ${answerSection('clarification_request', 'Clarifications requested')}
        ${answerSection('conflict', 'Conflicts with spec')}
      </div>`;

    setContent(`
      <div class="page-head-row">
        <h1>Gaps</h1>
        <div class="page-head-pills">
          <span class="pill code">${d.total} marker(s)</span>
        </div>
      </div>
      <div class="tab-bar">
        <button class="tab-btn gap-page-tab ${gapPageTab === 'gaps' ? 'active' : ''}" data-gpt="gaps">Gaps</button>
        <button class="tab-btn gap-page-tab ${gapPageTab === 'log' ? 'active' : ''}" data-gpt="log">Log</button>
      </div>
      <div id="gapPageBody">${gapPageTab === 'gaps' ? gapsTabHTML : logTabHTML}</div>`);

    content.querySelectorAll('.gap-page-tab').forEach(btn => btn.addEventListener('click', () => {
      gapPageTab = btn.dataset.gpt; renderGaps();
    }));
    content.querySelectorAll('.gap-scope-btn').forEach(btn => btn.addEventListener('click', () => {
      gapScope = btn.dataset.scope; gapOffset = 0; renderGaps();
    }));
    content.querySelectorAll('tr[data-gap-idx]').forEach(row => {
      row.style.cursor = 'pointer';
      row.addEventListener('click', () => openGapModal(d.shown[Number(row.dataset.gapIdx)]));
    });
    document.getElementById('gapPrevBtn')?.addEventListener('click', () => { gapOffset = Math.max(0, gapOffset - GAP_PAGE_SIZE); renderGaps(); });
    document.getElementById('gapNextBtn')?.addEventListener('click', () => { gapOffset += GAP_PAGE_SIZE; renderGaps(); });
    content.querySelectorAll('[data-del-answer]').forEach(btn => {
      btn.addEventListener('click', async () => {
        await fetch(`/api/gap-answers/${btn.dataset.delAnswer}`, {method: 'DELETE'});
        renderGaps();
      });
    });
  } catch (e) { errbox('Could not load gap register: ' + e.message); }
}

/* ---------------- Docs intake (for a future ingest-docs/add-feature run) ---------------- */
/* ---------------- Upload review gate (2026-09-23) -- uploaded docs are staged and
   classified first (archived folders, superseded versions, non-document noise) so a
   human decides what's kept BEFORE it's stored and distilled. Uses ingest_docs.py's own
   rules server-side, so this agrees with what the ingest itself would do. ------------ */
async function commitStagedUpload(token, skip) {
  const res = await fetch('/api/docs/bulk/commit', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({token, skip}),
  });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  const body = await res.json();
  if (body.errors.length) alert('Kept ' + body.saved.length + '. ' + body.errors.length + ' problem(s): ' + body.errors.join('; '));
  document.getElementById('uploadReviewOverlay').classList.remove('open');
  renderDocs();
  refreshSetupGate();  // the readiness banner only ever refreshed on load/target-apply
  return body;
}

function openUploadReview(staged) {
  const overlay = document.getElementById('uploadReviewOverlay');
  const body = document.getElementById('uploadReviewBody');
  const row = (file, note, checked) => `
    <label style="display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:12.5px;border-bottom:1px solid var(--line);">
      <input type="checkbox" data-skip-file="${esc(file)}" ${checked ? 'checked' : ''} style="margin-top:3px;">
      <span><span style="overflow-wrap:anywhere;">${esc(file)}</span><br><span style="color:var(--ink-soft);font-size:11.5px;">${esc(note)}</span></span>
    </label>`;
  body.innerHTML = `
    <h2 style="margin-top:0;">Review before keeping</h2>
    <p style="color:var(--ink-soft);font-size:12.5px;">${staged.keep.length} file(s) look current and will be kept. These ${staged.superseded.length + staged.excluded.length} look like they shouldn't be — <b>ticked means skip</b>. Untick anything you actually want.</p>
    <div style="max-height:320px;overflow:auto;margin:10px 0;">
      ${staged.excluded.map(e => row(e.file, 'Excluded: ' + e.reason, true)).join('')}
      ${staged.superseded.map(s => row(s.file, 'Superseded by ' + s.superseded_by.split('/').pop(), true)).join('')}
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="btn" id="uploadReviewCancel">Cancel</button>
      <button class="btn primary" id="uploadReviewConfirm">Keep the rest</button>
    </div>`;
  overlay.classList.add('open');
  document.getElementById('uploadReviewCancel').addEventListener('click', () => overlay.classList.remove('open'));
  document.getElementById('uploadReviewConfirm').addEventListener('click', async () => {
    const skip = Array.from(body.querySelectorAll('[data-skip-file]:checked')).map(el => el.dataset.skipFile);
    try { await commitStagedUpload(staged.token, skip); }
    catch (e) { alert('Could not save: ' + e.message); }
  });
}

async function renderDocs() {
  loading();
  const {project, device} = window.CURRENT_TARGET || {};
  if (!project || !device) { errbox('No target selected — use "Change target" first.'); return; }
  try {
    const docs = await fetchJSON(`/api/docs?project=${encodeURIComponent(project)}&device=${encodeURIComponent(device)}`);
    // Which folder Ingest will ACTUALLY read for this project -- the synced requirements
    // library if there is one, else this upload folder. Surfaced here because the page
    // previously implied uploading was the only route in, which sent George trying to
    // push a 660MB zip of a library already sitting on disk (2026-09-23).
    let source = null, sourcePath = null;
    try {
      const f = await fetchJSON(`/api/docs/folder?project=${encodeURIComponent(project)}&device=${encodeURIComponent(device)}`);
      source = f.source; sourcePath = f.path;
    } catch (e) { /* best-effort only */ }
    const rows = docs.map(d => `
      <tr>
        <td>${esc(d.filename)}</td>
        <td>${(d.size_bytes / 1024).toFixed(1)} KB</td>
        <td>${new Date(d.uploaded_at * 1000).toLocaleString()}</td>
        <td><button class="btn" data-del-doc="${esc(d.filename)}" style="font-size:12px;padding:5px 10px;">Remove</button></td>
      </tr>`).join('');
    setContent(`
      <div class="page-head"><h1>Docs — ${esc(project)} / ${esc(device)}</h1><p>Where Ingest reads this project's requirement docs from, and somewhere to attach the odd extra file.</p></div>
      ${source === 'requirements_folder' ? `
      <div class="fixture-note" style="background:var(--accent-soft-bg);color:var(--accent);">
        ✓ Ingest reads <b>${esc(project)}</b> straight from your synced requirements folder — <code>${esc(sourcePath)}</code>.
        Nothing to upload: keep that folder up to date (Google Drive for Desktop) and Ingest picks it up.
        The upload below is only for the odd extra file that isn't in there.
      </div>` : `
      <div class="fixture-note">
        ⚠ No synced requirements folder found for <b>${esc(project)}</b>, so Ingest will fall back to the uploads below
        (<code>${esc(sourcePath || '')}</code>). For a full project library, sync it to
        <code>%USERPROFILE%\TestOpsRequirements\${esc(project.toLowerCase())}\_current\</code> instead of uploading it —
        far quicker than pushing it through the browser.
      </div>`}
      <div class="card">
        <h2>Upload docs</h2>
        <ol style="color:var(--ink-soft);font-size:12.5px;margin:0 0 10px;padding-left:18px;line-height:1.55;">
          <li>Gather the <b>latest version of each spec</b> you want covered — one folder is easiest.</li>
          <li>Leave out anything archived, superseded, or not a requirement doc (drawings, videos, CAD, MS Project). If some slip in, the next step catches them.</li>
          <li>Zip that folder (or pick the files directly — several at once is fine). Up to 3GB unzipped, 5000 files.</li>
          <li>Upload. You'll get a <b>review step</b> listing anything that looks archived or superseded, so you decide what's kept before it's stored.</li>
        </ol>
        <input type="file" id="docFileInput" multiple style="margin-bottom:10px;">
        <button class="btn primary" id="docUploadBtn">Upload</button>
        <div id="docUploadMsg" style="margin-top:8px;font-size:12.5px;"></div>
      </div>
      <div class="card">
        <h2>Docs on file for this target</h2>
        ${docs.length ? `<table><tr><th>File</th><th>Size</th><th>Uploaded</th><th></th></tr>${rows}</table>` : '<p style="color:var(--ink-soft);font-size:13px;">No docs uploaded for this project/device yet.</p>'}
      </div>
      <div class="card">
        <h2>Requirement docs — check for changes</h2>
        <p style="color:var(--ink-soft);font-size:12.5px;margin:0 0 10px;">Compares <code>%USERPROFILE%\\TestOpsRequirements\\${esc(project.toLowerCase())}\\</code> against the last time you checked — real file changes, not a guess. Doesn't re-parse anything into knowledge notes yet (that needs the same pipeline-execution wiring "Run" is waiting on) — this just makes sure nothing silently goes stale in the meantime.</p>
        <button class="btn" id="docsRefreshCheckBtn">Check for changes</button>
        <div id="docsRefreshResult" style="margin-top:10px;"></div>
      </div>`);

    document.getElementById('docsRefreshCheckBtn').addEventListener('click', async () => {
      const resultEl = document.getElementById('docsRefreshResult');
      resultEl.innerHTML = '<div class="loading">Checking…</div>';
      try {
        const res = await fetch(`/api/docs/${encodeURIComponent(project)}/refresh-check`, {method: 'POST'});
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
        const d = await res.json();
        if (!d.exists) {
          resultEl.innerHTML = `<p style="color:var(--ink-soft);font-size:13px;">No local requirements folder found for ${esc(project)} yet.</p>`;
          return;
        }
        const list = (label, cls, items) => items.length
          ? `<li><span class="pill ${cls}">${label}</span> ${items.length}: ${items.slice(0,8).map(esc).join(', ')}${items.length>8?` …+${items.length-8} more`:''}</li>` : '';
        const lines = [list('New', 'ok', d.new), list('Changed', 'warn', d.changed), list('Removed', 'bad', d.removed)].filter(Boolean);
        resultEl.innerHTML = lines.length
          ? `<ul class="activity">${lines.join('')}</ul><p style="color:var(--ink-soft);font-size:12px;margin-top:8px;">${d.unchanged_count} unchanged, ${d.total_files} files total. Marked as checked — next check compares against right now.</p>`
          : `<p style="font-size:13px;">No changes since last check — ${d.total_files} files, all unchanged.</p>`;
      } catch (e) { resultEl.innerHTML = `<div class="errbox">${esc(e.message)}</div>`; }
    });

    document.getElementById('docUploadBtn').addEventListener('click', async () => {
      const input = document.getElementById('docFileInput');
      const msg = document.getElementById('docUploadMsg');
      if (!input.files.length) { msg.textContent = 'Choose a file (or files, or a .zip) first.'; return; }
      const fd = new FormData();
      for (const f of input.files) fd.append('files', f);
      msg.textContent = 'Uploading and checking…';
      try {
        // Stage -> review -> commit, so archived/superseded docs are caught BEFORE they
        // are stored, rather than after they've been distilled into knowledge (George,
        // 2026-09-23 -- his Archieve/ folders had been ingested as current specs).
        const res = await fetch(`/api/docs/bulk/stage?project=${encodeURIComponent(project)}&device=${encodeURIComponent(device)}`, {method: 'POST', body: fd});
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
        const staged = await res.json();
        if (staged.errors.length) alert(staged.errors.length + ' problem(s): ' + staged.errors.join('; '));
        if (staged.superseded.length + staged.excluded.length) { openUploadReview(staged); return; }
        await commitStagedUpload(staged.token, []);
      } catch (e) { msg.textContent = 'Upload failed: ' + e.message; }
    });
    content.querySelectorAll('[data-del-doc]').forEach(btn => {
      btn.addEventListener('click', async () => {
        try {
          const res = await fetch(`/api/docs/${encodeURIComponent(project)}/${encodeURIComponent(device)}/${encodeURIComponent(btn.dataset.delDoc)}`, {method: 'DELETE'});
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
          renderDocs();
          refreshSetupGate();  // same reasoning as upload -- deleting the last doc should re-fade it
        } catch (e) { alert('Could not remove: ' + e.message); }
      });
    });
  } catch (e) { errbox('Could not load docs: ' + e.message); }
}

/* ---------------- Scheduled checks (2026-09-22): periodic, read-only doc-change watcher
   per target -- George: "does our tool need to automatically read the docs... make
   suggestions... do we need a way of seeing this automation happening". Opt-in per
   target (nothing scanned by default); every real run is the same scheduled-scan
   pipeline everything else here already tracks (cost, Log tab), just triggered either by
   the background poller or this page's "Run now". ---------------- */
function _scheduledDueCount(settings) {
  const now = Date.now();
  return settings.filter(s => {
    if (!s.enabled) return false;
    if (!s.last_run_at) return true;
    return new Date(s.last_run_at + 'Z').getTime() + s.interval_days * 86400000 <= now;
  }).length;
}

// Populates the sidebar badge without needing the whole page open (George: "a way of
// seeing this automation happening") -- called once at startup and again whenever the
// Scheduled checks page itself refreshes. Counts unreviewed SUGGESTIONS, not overdue
// targets -- that's the number that's actually actionable ("something is waiting for a
// decision"), overdue-but-not-yet-run is just internal scheduling state.
function refreshScheduledBadge() {
  fetchJSON('/api/scheduled-checks/suggestions').then(suggestions => {
    const badge = document.getElementById('scheduledBadge');
    if (!badge) return;
    const n = suggestions.length;
    badge.style.display = n ? '' : 'none';
    badge.textContent = ` ${n}`;
    badge.className = 'pill warn';
    badge.style.marginLeft = '6px'; badge.style.fontSize = '10px';
  }).catch(() => {});
}

// The actionable report itself (George, 2026-09-22: "a good report to get going with
// actionables... display the checks status and suggestions... make decisions from
// there"). Each card is one completed scheduled-scan run's real suggest_next output,
// with Dismiss (marks it reviewed -- never shown again) and a link to the full run log
// for the real detail (steps, cost, what changed) behind the summary.
async function renderSuggestionsPanel(container) {
  container.innerHTML = '<div class="loading">Loading suggestions…</div>';
  try {
    const suggestions = await fetchJSON('/api/scheduled-checks/suggestions');
    if (!suggestions.length) {
      container.innerHTML = `<p style="color:var(--ink-soft);font-size:13px;">No open suggestions right now.</p>`;
      return;
    }
    container.innerHTML = suggestions.map(s => `
      <div class="card" data-suggestion-run="${esc(s.id)}" style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;">
          <b>${esc(s.project)} / ${esc(s.device)}</b>
          <span style="font-size:11.5px;color:var(--ink-soft);">${s.created_at ? esc(new Date(s.created_at + 'Z').toLocaleString()) : ''}</span>
        </div>
        <p style="font-size:13px;margin:8px 0;">${esc(s.summary || '(no summary recorded)')}</p>
        <div style="display:flex;gap:10px;">
          <button class="btn" data-suggestion-dismiss>Dismiss</button>
          <a href="#" data-suggestion-log>View full log →</a>
        </div>
      </div>`).join('');
    container.querySelectorAll('[data-suggestion-run]').forEach(card => {
      const runId = card.dataset.suggestionRun;
      const row = suggestions.find(s => s.id === runId);
      card.querySelector('[data-suggestion-dismiss]').addEventListener('click', async () => {
        await fetch(`/api/scheduled-checks/suggestions/${encodeURIComponent(runId)}/review`, {method: 'POST'}).catch(() => {});
        card.remove();
        refreshScheduledBadge();
      });
      card.querySelector('[data-suggestion-log]').addEventListener('click', (e) => {
        e.preventDefault();
        window.CURRENT_TARGET = {project: row.project, device: row.device};
        saveLastTarget(window.CURRENT_TARGET);
        renderPipelineDetail('scheduled-scan');
      });
    });
  } catch (e) { container.innerHTML = `<div class="errbox">Could not load suggestions: ${esc(e.message)}</div>`; }
}

async function renderScheduledPage() {
  loading();
  try {
    const [settings, taxonomy] = await Promise.all([fetchJSON('/api/scheduled-checks'), fetchJSON('/api/taxonomy')]);
    const byKey = Object.fromEntries(settings.map(s => [`${s.project}|${s.device}`, s]));
    const allTargets = [];
    for (const p of Object.keys(taxonomy)) for (const d of Object.keys(taxonomy[p] || {})) allTargets.push([p, d]);
    // Any configured target not in the live taxonomy (a project/device since renamed or
    // removed) still shows -- real stored state, never silently hidden.
    for (const s of settings) if (!allTargets.some(([p, d]) => p === s.project && d === s.device)) allTargets.push([s.project, s.device]);
    const now = Date.now();
    const rows = allTargets.map(([p, d]) => {
      const s = byKey[`${p}|${d}`];
      const enabled = s ? !!s.enabled : false;
      const interval = s ? s.interval_days : 7;
      let dueText = '<span style="color:var(--ink-soft);">—</span>';
      if (enabled) {
        if (!s.last_run_at) dueText = `<span class="pill warn">due now</span>`;
        else {
          const dueAt = new Date(s.last_run_at + 'Z').getTime() + interval * 86400000;
          dueText = dueAt <= now ? `<span class="pill warn">due now</span>` : `due ${new Date(dueAt).toLocaleDateString()}`;
        }
      }
      return `<tr data-sched-row="${esc(p)}|${esc(d)}">
        <td>${esc(p)}</td><td>${esc(d)}</td>
        <td><input type="checkbox" data-sched-enabled ${enabled ? 'checked' : ''}></td>
        <td><input type="number" min="1" value="${interval}" data-sched-interval style="width:60px;" ${enabled ? '' : 'disabled'}></td>
        <td style="font-size:12px;color:var(--ink-soft);">${s && s.last_run_at ? esc(new Date(s.last_run_at + 'Z').toLocaleString()) : 'Never'}</td>
        <td style="font-size:12px;">${dueText}</td>
        <td><button class="btn" data-sched-run>Run now</button> ${s && s.last_run_id ? `<a href="#" data-sched-log>View log →</a>` : ''}</td>
      </tr>`;
    }).join('');
    refreshScheduledBadge();
    setContent(`
      <div class="page-head"><h1>Scheduled checks</h1><p>Watches each opted-in project/device's local requirements docs on an interval. When something's changed, it ingests and suggests what to do next — it never applies anything itself. This app isn't a 24/7 service, so "scheduled" means checked on the next time it's running after the interval elapses, or click Run now any time.</p></div>
      <h2 style="font-size:15px;margin:4px 0 10px;">Open suggestions</h2>
      <div id="suggestionsPanel"><div class="loading">Loading…</div></div>
      <h2 style="font-size:15px;margin:18px 0 10px;">Settings</h2>
      <div class="card">
        <table><tr><th>Project</th><th>Device</th><th>Enabled</th><th>Interval (days)</th><th>Last run</th><th>Status</th><th></th></tr>${rows}</table>
      </div>`);
    renderSuggestionsPanel(document.getElementById('suggestionsPanel'));
    content.querySelectorAll('[data-sched-row]').forEach(row => {
      const [project, device] = row.dataset.schedRow.split('|');
      const enabledEl = row.querySelector('[data-sched-enabled]');
      const intervalEl = row.querySelector('[data-sched-interval]');
      const save = () => {
        intervalEl.disabled = !enabledEl.checked;
        fetch('/api/scheduled-checks', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({project, device, enabled: enabledEl.checked, interval_days: Number(intervalEl.value) || 7}),
        }).catch(() => {});
      };
      enabledEl.addEventListener('change', save);
      intervalEl.addEventListener('change', save);
      row.querySelector('[data-sched-run]')?.addEventListener('click', async () => {
        try {
          const res = await fetch('/api/scheduled-checks/run-now', {
            method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({project, device}),
          });
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
          renderScheduledPage();
        } catch (e) { alert('Could not start: ' + e.message); }
      });
      row.querySelector('[data-sched-log]')?.addEventListener('click', (e) => {
        e.preventDefault();
        window.CURRENT_TARGET = {project, device};
        saveLastTarget(window.CURRENT_TARGET);
        renderPipelineDetail('scheduled-scan');
      });
    });
  } catch (e) { errbox('Could not load Scheduled checks: ' + e.message); }
}
