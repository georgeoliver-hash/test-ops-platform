/* ---------------- Single pipeline detail (used by grouped Build/Audit/Maintain nav) ---------------- */
async function renderPipelineDetail(id) {
  CURRENT_RERENDER = () => renderPipelineDetail(id);
  loading();
  try {
    const [list, detail] = await Promise.all([
      fetchJSON('/api/pipelines'),
      fetchJSON(`/api/pipelines/${id}`),
    ]);
    const meta = list.find(p => p.id === id) || {};
    const steps = detail.steps.map(s => renderStep(s, id)).join('');
    const target = window.CURRENT_TARGET || {};
    // Any input the pipeline itself declares beyond project/device (e.g. ingest-docs'
    // required docs_path) needs a real value before Run is meaningful — render one text
    // field per such input, pre-filled with a sensible default where we have one.
    // project/device/old_suite_id/new_suite_id/suite_id are all resolved automatically
    // (top-level target fields, or derived from the suite mapping) — only inputs outside
    // that system-derived set (e.g. ingest-docs' docs_path) need a real text field here.
    const SYSTEM_DERIVED_INPUTS = ['project', 'device', 'old_suite_id', 'new_suite_id', 'suite_id'];
    const extraInputs = (detail.inputs || []).filter(i => !SYSTEM_DERIVED_INPUTS.includes(i.name));
    let docsFolder = null;
    let docsSource = null;
    let docsOptions = [];
    const isIngestDocs = extraInputs.some(i => i.name === 'docs_path');
    if (isIngestDocs && target.project && target.device) {
      try {
        const r = await fetchJSON(`/api/docs/folder?project=${encodeURIComponent(target.project)}&device=${encodeURIComponent(target.device)}`);
        docsFolder = r.path; docsSource = r.source; docsOptions = r.options || [];
      } catch (e) { /* best-effort default only */ }
    }
    // George's ask (ISSUES.md round 4): "ingest docs page needs overview of the current
    // documents uploaded for the target area" -- this data already existed (the separate
    // Docs settings page's own `/api/docs` table), just wasn't surfaced ON the ingest-docs
    // pipeline page itself, right where you'd actually want to check before running it.
    let currentDocs = null;
    if (isIngestDocs && target.project && target.device) {
      try { currentDocs = await fetchJSON(`/api/docs?project=${encodeURIComponent(target.project)}&device=${encodeURIComponent(target.device)}`); }
      catch (e) { /* best-effort only */ }
    }
    // targeted-run's real section tree (George, 2026-09-22) -- fetched here, same
    // pattern as docsFolder/currentDocs above, so the checkbox list renders with real
    // data on first paint rather than a placeholder needing a second async fill.
    let suiteSections = null;
    if (id === 'targeted-run' && target.project && target.device) {
      try {
        const res = await fetchJSON(`/api/suite-sections?project=${encodeURIComponent(target.project)}&device=${encodeURIComponent(target.device)}`);
        if (res.available) suiteSections = res.sections;
      } catch (e) { /* best-effort only */ }
    }
    // Fixed 2026-09-22: this used to always show the console's small per-target upload
    // list, even when docsFolder had actually resolved to the real synced requirements
    // library instead -- said "no docs uploaded" for Translink/POS while 352 real docs
    // sat untouched in TestOpsRequirements/translink/_current/. Now honest about which
    // source docs_path actually is.
    // When both a synced library and console uploads exist, let the user pick which one
    // this run reads -- otherwise the synced folder silently wins and uploaded docs are
    // ignored with no hint (2026-09-23). Defaults to the synced folder, as before.
    const docsSourcePickerHtml = (isIngestDocs && docsOptions.length > 1) ? `
      <div class="card" style="margin-top:10px;">
        <b style="font-size:13px;">Which docs should this run read?</b>
        <select class="input" id="docsSourcePicker" style="display:block;margin-top:6px;">
          ${docsOptions.map((o, idx) => `<option value="${esc(o.path)}" ${idx === 0 ? 'selected' : ''}>${esc(o.label)} — ${o.file_count} file(s)</option>`).join('')}
        </select>
        <p style="color:var(--ink-soft);font-size:12px;margin:6px 0 0;">Both exist for this target, so pick one. The docs path below updates to match.</p>
      </div>` : '';
    const currentDocsHtml = isIngestDocs ? (
      docsSource === 'requirements_folder' ? `
      <div class="card" style="margin-top:10px;">
        <b style="font-size:13px;">Using your synced requirements folder</b>
        <p style="color:var(--ink-soft);font-size:12.5px;margin:6px 0 0;">${esc(docsFolder)}</p>
        <p style="color:var(--ink-soft);font-size:12px;margin:4px 0 0;">This is the real, Google-Drive-synced library for this project — nothing to upload here. The Docs page's upload is only for attaching a few extra one-off files.</p>

      </div>`
    ) : '';
    // Real preview, before committing to a tracked run (George, 2026-09-22: "an initial

    const INPUT_HELP_TEXT = {

    // knowledge/flows/README.md process (Overflow is genuinely the only documented source

    const flowGuideHtml = id === 'audit-flows' ? `
      <div class="card" style="margin-top:10px;">

    const JIRA_CHIP_FIELDS = new Set(['fix_version', 'feature_or_jira_key']);
    const extraInputsHtml = extraInputs.length ? `

          // targeted-run's `areas` (George, 2026-09-22: "select EMV, no sign on stuff,

          // section per docs/gherkin-standard.md, so this is exactly what create-run
          // --areas matches against.
          if (id === 'targeted-run' && i.name === 'areas') {
            const byParent = {};
            (suiteSections || []).forEach(s => { (byParent[s.parent_id] = byParent[s.parent_id] || []).push(s); });
            const renderLevel = (parentId, depth) => (byParent[parentId] || []).map(s => `
              <div style="margin-left:${depth * 18}px;">
                <label style="font-size:13px;display:flex;align-items:center;gap:6px;padding:2px 0;">
                  <input type="checkbox" data-area-checkbox value="${esc(s.name)}"> ${esc(s.name)}
                </label>
                ${renderLevel(s.id, depth + 1)}
              </div>`).join('');
            const treeHtml = suiteSections === null
              ? `<p style="color:var(--ink-soft);font-size:12.5px;">No suite configured for this target yet, or the live TestRail call failed — set a project/device target first.</p>`
              : suiteSections.length === 0
                ? `<p style="color:var(--ink-soft);font-size:12.5px;">This suite has no sections yet.</p>`
                : renderLevel(null, 0);
            return `
          <label style="display:block;font-size:13px;margin-bottom:6px;">
            Areas${i.required ? ' *' : ''}
            ${help ? `<div style="color:var(--ink-soft);font-size:12px;margin:2px 0 4px;">${esc(help)}</div>` : ''}
          </label>
          <div id="areasTree" data-areas-tree style="margin-bottom:6px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:8px;">${treeHtml}</div>
          <input type="hidden" data-extra-input="areas" value="" />`;
          }
          if (JIRA_CHIP_FIELDS.has(i.name)) {
            return `
          <label style="display:block;font-size:13px;margin-bottom:6px;">
            ${esc(i.name)}${i.required ? ' *' : ''}${i.note ? ` <span style="color:var(--ink-soft);">— ${esc(i.note)}</span>` : ''}
            ${help ? `<div style="color:var(--ink-soft);font-size:12px;margin:2px 0 4px;">${esc(help)}</div>` : ''}
          </label>
          <div class="jira-chip-field" data-chip-field="${esc(i.name)}" style="margin-bottom:6px;">
            <div class="jira-chip-list" data-chip-list style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;"></div>
            <div style="display:flex;gap:6px;">
              <input type="text" class="input" data-chip-text-input placeholder="${i.name === 'fix_version' ? 'e.g. 4.2.0, or an epic/ticket key or URL, then Add' : 'PROJ-123, an epic key, or a pasted JIRA URL, then Add'}" style="flex:1;" />
              <button type="button" class="btn" data-chip-add>Add</button>
            </div>
            <input type="hidden" data-extra-input="${esc(i.name)}" value="" />
          </div>`;
          }
          // George's ask (ISSUES.md round 4): review-runs' `last_n` was a plain free-text
          // number — a real dropdown of sane choices is clearer than "type a number and
          // hope," and the pipeline already accepts any of these as a real `--last N`.
          if (i.name === 'last_n') {
            const opts = [5, 10, 15, 25, 50];
            const current = Number(i.default) || 10;
            return `
          <label style="display:block;font-size:13px;margin-bottom:6px;">
            How many recent runs to review${i.note ? ` <span style="color:var(--ink-soft);">— ${esc(i.note)}</span>` : ''}
            <select class="input" data-extra-input="last_n" style="display:block;width:auto;margin-top:2px;">
              ${opts.map(n => `<option value="${n}" ${n === current ? 'selected' : ''}>${n} runs</option>`).join('')}
            </select>
          </label>`;
          }
          return `
          <label style="display:block;font-size:13px;margin-bottom:6px;">
            ${esc(i.name)}${i.required ? ' *' : ''}${i.note ? ` <span style="color:var(--ink-soft);">— ${esc(i.note)}</span>` : ''}
            ${isDocsPath ? `<span style="color:var(--ink-soft);"> — fixed by your current project/device target, not editable here</span>` : ''}
            ${help ? `<div style="color:var(--ink-soft);font-size:12px;margin:2px 0 4px;">${esc(help)}</div>` : ''}
            <input type="text" class="input" data-extra-input="${esc(i.name)}" style="display:block;width:100%;margin-top:2px;"
              ${locked ? 'readonly title="Set via Change target, not here"' : ''}
              value="${esc(value)}" />
            ${isDocsPath && !docsFolder ? `<div style="color:var(--warn);font-size:12px;margin-top:2px;">No docs folder resolved yet for this target — set project/device via Change target first.</div>` : ''}
          </label>`;
        }).join('')}
      </div>` : '';
    // Universal "what are you trying to achieve" field (George, 2026-09-24) -- unlike
    // extraInputsHtml above, NOT built from this pipeline's own declared `inputs:` list, so
    // it shows up for every pipeline regardless of what that pipeline declares. Submission
    // needs no extra wiring: runPipeline() already collects every `[data-extra-input]`
    // element on the page into extra_inputs, and run history already renders whatever lands
    // in extra_inputs (see loadRunHistory), so `intent` just rides both of those for free.
    const intentHtml = `
      <div class="card" style="margin-top:10px;">
        <label style="display:block;font-size:13px;margin-bottom:6px;">
          What are you trying to achieve with this run? <span style="color:var(--ink-soft);">(optional)</span>
          <div style="color:var(--ink-soft);font-size:12px;margin:2px 0 4px;">Extra context for the agent steps in this run -- e.g. "I need this grounded for back-office comms testing, not just device navigation." Doesn't override the pipeline's own steps, just helps it make better judgment calls.</div>
        </label>
        <textarea class="input" data-extra-input="intent" rows="3" style="display:block;width:100%;margin-top:2px;resize:vertical;"></textarea>
      </div>`;
    const runButton = detail.runnable
      ? `<button class="btn primary" id="pipelineRunBtn">Run</button>`
      : `<div class="tooltip-wrap"><button class="btn primary" disabled>Run</button><span class="tip">Not wired yet — only read-only pipelines are, so far</span></div>`;
    setContent(`
      <div class="pipeline-detail-head">
        <div>
          <h1 style="font-size:20px;margin:0;">${esc(PIPELINE_DISPLAY_NAME[id] || id)} ${meta.slash_command ? `<code style="font-size:12px;color:var(--ink-soft);font-weight:400;">${esc(meta.slash_command)}</code>` : ''} ${PIPELINE_DISPLAY_NAME[id] ? `<span style="color:var(--ink-soft);font-weight:400;font-size:12px;">(${esc(id)})</span>` : ''}</h1>
          ${PIPELINE_PLAIN[id] ? `<p style="font-size:14px;font-weight:500;margin:6px 0 2px;">${esc(PIPELINE_PLAIN[id])}</p>` : ''}
          <p>${esc(detail.description)}</p>
        </div>
        ${runButton}
      </div>
      <div id="pipelineAlreadyDone"></div>
      <div class="legend">
        ${detail.guardrails.map(g => `<span class="chip"><span class="sw" style="background:var(--gate)"></span>${esc(g)}</span>`).join('')}
      </div>
      <div class="tab-row" style="display:flex;gap:8px;margin:14px 0 10px;">
        <button class="tab-btn active" id="pipelineTabDetails" data-ptab="details">Details</button>
        <button class="tab-btn" id="pipelineTabLog" data-ptab="log">Log</button>
      </div>
      <div id="pipelineDetailsBody">
        ${flowGuideHtml}
        ${extraInputsHtml}
        ${intentHtml}
        ${docsSourcePickerHtml}
        ${currentDocsHtml}
        ${relevancePreviewHtml}
        <div class="card"><div class="flow" style="display:block;">${steps}</div></div>
        <div id="pipelineStepList" class="card" style="margin-top:10px;display:none;"></div>
        <div id="pipelineRunResult"></div>
      </div>
      <div id="pipelineLogBody" style="display:none;"></div>`);
    wireChipFields(content);
    wireAreasTree(content);
    document.getElementById('docsSourcePicker')?.addEventListener('change', (e) => {
      const el = content.querySelector('[data-extra-input="docs_path"]');
      if (el) el.value = e.target.value;
    });
    document.getElementById('relevancePreviewBtn')?.addEventListener('click', async () => {
      const resultEl = document.getElementById('relevancePreviewResult');
      const docsPathEl = content.querySelector('[data-extra-input="docs_path"]');
      const projectVal = target.project;
      const docsPathVal = docsPathEl ? docsPathEl.value : '';
      if (!projectVal || !docsPathVal) {
        resultEl.innerHTML = `<p style="color:var(--warn);font-size:12.5px;">Need a project target and a resolved docs path first.</p>`;
        return;
      }
      resultEl.innerHTML = `<div class="loading">Converting and checking relevance…</div>`;
      try {
        const res = await fetch('/api/docs/relevance-preview', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({project: projectVal, docs_path: docsPathVal}),
        });
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
        const body = await res.json();
        resultEl.innerHTML = body.ok
          ? `<p style="font-size:13px;"><span class="pill ok">Clean</span> Every doc looks relevant — safe to Run.</p><pre style="white-space:pre-wrap;font-size:12px;color:var(--ink-soft);max-height:200px;overflow:auto;">${esc(body.output)}</pre>`
          : `<p style="font-size:13px;"><span class="pill bad">${esc(body.stage)}</span> Fix this before running — the real run would stop here too.</p><pre style="white-space:pre-wrap;font-size:12px;color:var(--ink-soft);max-height:240px;overflow:auto;">${esc(body.output)}</pre>`;
      } catch (e) { resultEl.innerHTML = `<div class="errbox">${esc(e.message)}</div>`; }
    });
    document.getElementById('pipelineTabDetails')?.addEventListener('click', (e) => {
      e.currentTarget.classList.add('active');
      document.getElementById('pipelineTabLog')?.classList.remove('active');
      document.getElementById('pipelineDetailsBody').style.display = '';
      document.getElementById('pipelineLogBody').style.display = 'none';
    });
    document.getElementById('pipelineTabLog')?.addEventListener('click', (e) => {
      e.currentTarget.classList.add('active');
      document.getElementById('pipelineTabDetails')?.classList.remove('active');
      document.getElementById('pipelineDetailsBody').style.display = 'none';
      const logBody = document.getElementById('pipelineLogBody');
      logBody.style.display = '';
      renderPipelineLog(id, target, logBody);
    });

    // "Already Done" / setup-complete badges — real, from the same last-run + setup-status
    // data the Suite Health page already uses, not a guess. George's ask (onboard-suite):
    // "if a suite has already been onboarded... a highlighted 'Already Done' state instead
    // of the plain run button" -- and (Start): "a tick + highlighted 'you're all set' state".
    const alreadyDoneEl = document.getElementById('pipelineAlreadyDone');
    if (alreadyDoneEl && target.project && target.device) {
      if (id === 'start') {
        // ISSUES.md round 2: this message was wrongly requiring docs/knowledge too --
        // "Getting set up" is genuinely just credentials + a suite target; docs/knowledge
        // is a separate, later concern (and is what actually gates Build/Audit/Maintain
        // via the SAME /api/setup-status call's `status.ready`, correctly, further down --
        // only THIS one message was over-scoped). Checks the two narrower flags directly.
        fetchJSON(`/api/setup-status?project=${encodeURIComponent(target.project)}&device=${encodeURIComponent(target.device)}`)
          .then(status => {
            if (status.credentials_configured && status.suite_configured) {
              alreadyDoneEl.innerHTML = `<div class="card" style="border-color:var(--ok);background:var(--ok-bg);color:var(--ok);margin-bottom:0;">✓ ${esc(target.project)}/${esc(target.device)} is set up — credentials and a suite target are configured. Nothing left to do here.</div>`;
            }
          }).catch(() => {});
      } else {
        fetchJSON(`/api/pipelines/${id}/last-run?project=${encodeURIComponent(target.project)}&device=${encodeURIComponent(target.device)}`)
          .then(last => {
            if (last && last.status === 'succeeded') {
              const when = last.updated_at ? new Date(last.updated_at + 'Z').toLocaleString() : '';
              alreadyDoneEl.innerHTML = `<div class="card" style="border-color:var(--ok);background:var(--ok-bg);color:var(--ok);margin-bottom:0;">✓ Already done for ${esc(target.project)}/${esc(target.device)} — last succeeded ${esc(when)}. Re-run only if something's changed.</div>`;
            }
          }).catch(() => {});
      }
    }

    document.getElementById('pipelineRunBtn')?.addEventListener('click', () => runPipeline(id, target));
    // Delegated listener, attached once — the step list's innerHTML gets replaced on every
    // poll tick, so a per-row addEventListener would just be discarded each time.
    document.getElementById('pipelineStepList')?.addEventListener('click', onStepActionClick);

    // Resume an in-progress run after a page reload/navigation-away-and-back -- the run
    // itself lives entirely server-side (pipeline_runs/pipeline_run_steps), only the
    // browser's in-memory run_id was ever lost on refresh (found live: George's onboard-
    // suite run was still sitting at waiting_human on the server the whole time, but the
    // page just showed a fresh "Run" button with no way back to it).
    if (target.project && target.device) {
      try {
        const last = await fetchJSON(`/api/pipelines/${id}/last-run?project=${encodeURIComponent(target.project)}&device=${encodeURIComponent(target.device)}`);
        if (last && last.id && (last.status === 'running' || last.status === 'waiting_human' || last.status === 'failed')) {
          const resultEl = document.getElementById('pipelineRunResult');
          const stepListEl = document.getElementById('pipelineStepList');
          const btn = document.getElementById('pipelineRunBtn');
          if (btn) btn.disabled = true;
          pollPipelineRun(last.id, resultEl, btn, stepListEl);
        }
      } catch (e) { /* best-effort resume only -- a fresh Run click still works either way */ }
    }
  } catch (e) { errbox('Could not load this pipeline: ' + e.message); }
}

// Per-pipeline run history (ISSUES.md round 4: "each pipeline needs a log tab to keep any
// info of previous runs, data, uploads" -- and specifically, for JIRA-bearing pipelines,
// "a log of previous date and time of specific JIRAs already reviewed against"). Real rows
// from /api/pipelines/{id}/runs; extra_inputs (fix_version/feature_or_jira_key/etc) shown
// per-run where it was actually recorded -- a run from before this feature existed just
// says "not recorded", never backfilled or guessed.
async function renderPipelineLog(id, target, container) {
  if (!target.project || !target.device) {
    container.innerHTML = `<div class="card"><p style="color:var(--ink-soft);font-size:13px;">Set a project/device target to see this pipeline's run history.</p></div>`;
    return;
  }
  container.innerHTML = '<div class="card"><div class="loading">Loading run history…</div></div>';
  try {
    const runs = await fetchJSON(`/api/pipelines/${id}/runs?project=${encodeURIComponent(target.project)}&device=${encodeURIComponent(target.device)}&limit=20`);
    if (!runs.length) {
      container.innerHTML = `<div class="card"><p style="color:var(--ink-soft);font-size:13px;">No runs yet for ${esc(target.project)}/${esc(target.device)}.</p></div>`;
      return;
    }
    // Same status->pill-colour mapping renderRunStep already uses for a live run's steps.
    const RUN_PILL_CLASS = {pending: 'muted', running: 'info', waiting_human: 'warn', succeeded: 'ok', failed: 'err', skipped: 'muted'};
    // Real per-run AI cost (George, 2026-09-22: token/cost visibility) -- best-effort, one
    // call per run; a run with no cost-tracked steps just shows "—", never a fabricated 0.
    const costs = await Promise.all(runs.map(r => fetchJSON(`/api/pipelines/runs/${r.id}/cost`).catch(() => ({available: false}))));
    const rows = runs.map((r, i) => {
      const when = r.created_at ? new Date(r.created_at + 'Z').toLocaleString() : '';
      const given = r.extra_inputs && Object.keys(r.extra_inputs).length
        ? Object.entries(r.extra_inputs).filter(([, v]) => v).map(([k, v]) => `<b>${esc(k)}:</b> ${esc(v)}`).join('<br>')
        : '<span style="color:var(--ink-soft);">not recorded</span>';
      const c = costs[i];
      const costCell = c.available
        ? `$${c.cost_usd.toFixed(3)} <span style="color:var(--ink-soft);">(${(c.input_tokens + c.output_tokens).toLocaleString()} tok)</span>`
        : `<span style="color:var(--ink-soft);">—</span>`;
      return `<tr>
        <td style="white-space:nowrap;">${esc(when)}</td>
        <td><span class="pill ${RUN_PILL_CLASS[r.status] || 'muted'}">${esc(r.status)}</span></td>
        <td style="font-size:12.5px;">${given}</td>
        <td style="font-size:12.5px;white-space:nowrap;">${costCell}</td>
        <td style="font-size:12.5px;color:var(--ink-soft);">${esc(r.summary || '')}</td>
      </tr>`;
    }).join('');
    container.innerHTML = `
      <div class="card">
        <table style="width:100%;">
          <tr><th>When</th><th>Status</th><th>Given</th><th>AI cost</th><th>Summary</th></tr>
          ${rows}
        </table>
      </div>`;
  } catch (e) { container.innerHTML = `<div class="errbox">Could not load run history: ${esc(e.message)}</div>`; }
}

/* ---------------- Real pipeline execution (2026-09-14: every pipeline runs through the
   generic step-executor; a step that would push --commit always pauses as a human
   approval gate first — see runner.py) ---------------- */
async function runPipeline(id, target) {
  const resultEl = document.getElementById('pipelineRunResult');
  const stepListEl = document.getElementById('pipelineStepList');
  const btn = document.getElementById('pipelineRunBtn');
  const extra_inputs = {};
  for (const el of document.querySelectorAll('[data-extra-input]')) {
    extra_inputs[el.dataset.extraInput] = el.value.trim();
  }
  if (btn) btn.disabled = true;
  if (stepListEl) stepListEl.style.display = 'none';
  resultEl.innerHTML = `<div class="card"><div class="loading">Starting ${esc(id)} against ${esc(target.project)}/${esc(target.device)}…</div></div>`;
  try {
    const res = await fetch(`/api/pipelines/${id}/run`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({project: target.project, device: target.device, extra_inputs}),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
    const {run_id} = await res.json();
    pollPipelineRun(run_id, resultEl, btn, stepListEl);
  } catch (e) {
    resultEl.innerHTML = `<div class="errbox">Could not start run: ${esc(e.message)}</div>`;
    if (btn) btn.disabled = false;
  }
}

const WORKING_DOTS_HTML = '<span class="working-dots" title="Still working"><span></span><span></span><span></span></span>';
function renderRunStep(runId, step) {
  const pillClass = {pending: 'muted', running: 'info', waiting_human: 'warn', succeeded: 'ok', failed: 'err', skipped: 'muted'}[step.status] || 'muted';
  const isPushGate = step.status === 'waiting_human' && /push/.test(step.output || '') && /--commit/.test(step.output || '');
  const actionBtn = step.status === 'waiting_human'
    ? `<button class="btn ${isPushGate ? 'danger' : 'primary'} step-resolve-btn" data-run="${esc(runId)}" data-step="${esc(step.step_id)}">${isPushGate ? 'Approve & Push' : 'Continue'}</button>`
    : step.status === 'failed'
    ? `<button class="btn step-retry-btn" data-run="${esc(runId)}" data-step="${esc(step.step_id)}" title="Re-run from this step, not the whole pipeline">Retry from here</button>`
    : '';
  // Found live, repeatedly: with only a status pill per step, there was no way to see WHY
  // a step behaved oddly (wrote nothing, asked a clarifying question, etc.) without me
  // manually reading the SQLite db directly -- every step's real output is now one click
  // away instead, same info the top-level "Result" card shows but for THIS step specifically.
  const hasOutput = step.output && step.output.trim();
  // George's ask (ISSUES.md, onboard-suite): a highlighted warning right at the push gate,
  // not just the confirm() dialog, telling you to check the drafted doc/cases before this
  // makes a real, permanent TestRail write.
  const pushWarning = isPushGate
    ? `<div style="background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:6px 10px;font-size:12.5px;margin-top:6px;">⚠ This writes for real, permanently, to TestRail (<code>--commit</code>). Check what was drafted for this area above before approving.</div>`
    : '';
  return `
    <div class="run-step-row" style="padding:6px 0;border-bottom:1px solid var(--border);">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <div>
          <strong style="font-size:13px;">${esc(STEP_DISPLAY_NAME[step.step_id] || step.step_id)}</strong>
          <span class="chip" style="margin-left:8px;">${esc(step.status)}</span>
          ${step.status === 'running' ? WORKING_DOTS_HTML : ''}
        </div>
        ${actionBtn}
      </div>
      ${pushWarning}
      ${hasOutput ? `
        <details style="margin-top:4px;">
          <summary style="cursor:pointer;font-size:12px;color:var(--ink-soft);">View this step's output</summary>
          <pre style="white-space:pre-wrap;font-size:12px;background:var(--bg);padding:8px;border-radius:6px;margin-top:6px;max-height:400px;overflow:auto;">${esc(step.output)}</pre>
        </details>` : ''}
    </div>`;
}

async function onStepActionClick(e) {
  const resolveBtn = e.target.closest('.step-resolve-btn');
  const retryBtn = e.target.closest('.step-retry-btn');
  const btn = resolveBtn || retryBtn;
  if (!btn) return;
  const runId = btn.dataset.run;
  const stepId = btn.dataset.step;
  const endpoint = retryBtn ? 'retry' : 'resolve';
  if (resolveBtn && btn.textContent.includes('Approve') && !confirm(`This will actually push --commit to TestRail. Approve "${stepId}"?`)) return;
  btn.disabled = true;
  try {
    const res = await fetch(`/api/pipelines/runs/${encodeURIComponent(runId)}/steps/${encodeURIComponent(stepId)}/${endpoint}`, {method: 'POST'});
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
    const resultEl = document.getElementById('pipelineRunResult');
    const stepListEl = document.getElementById('pipelineStepList');
    const runBtn = document.getElementById('pipelineRunBtn');
    pollPipelineRun(runId, resultEl, runBtn, stepListEl);
  } catch (err) {
    alert(`Could not ${endpoint} step: ` + err.message);
    btn.disabled = false;
  }
}

// Global cancel button (ISSUES.md ask) — the backend endpoint already existed
// (`/api/pipelines/runs/{id}/cancel`, see runner.cancel_run), it just wasn't exposed
// anywhere in the UI; this wires the real thing, not a new mechanism.
function cancelRunButtonHtml(runId) {
  return `<button class="btn" data-cancel-run="${esc(runId)}" style="margin-top:10px;">Cancel run</button>`;
}
function bindCancelRunButton(runId, resultEl, btn, stepListEl) {
  resultEl.querySelector('[data-cancel-run]')?.addEventListener('click', async (e) => {
    if (!confirm('Cancel this run? Anything already pushed to TestRail stays pushed — this only stops what hasn\'t run yet.')) return;
    e.target.disabled = true;
    try {
      await fetch(`/api/pipelines/runs/${encodeURIComponent(runId)}/cancel`, {method: 'POST'});
      pollPipelineRun(runId, resultEl, btn, stepListEl);
    } catch (err) {
      alert('Could not cancel run: ' + err.message);
      e.target.disabled = false;
    }
  });
}

async function pollPipelineRun(runId, resultEl, btn, stepListEl) {
  try {
    const [run, steps] = await Promise.all([
      fetchJSON(`/api/pipelines/runs/${runId}`),
      fetchJSON(`/api/pipelines/runs/${runId}/steps`),
    ]);
    if (stepListEl && steps.length) {
      stepListEl.style.display = 'block';
      stepListEl.innerHTML = `<h2 style="margin-top:0;">Steps</h2>` + steps.map(s => renderRunStep(runId, s)).join('');
    }
    if (run.status === 'running') {
      resultEl.innerHTML = `<div class="card"><div class="loading">Running… (${esc(run.pipeline_id)} against ${esc(run.project)}/${esc(run.device)})${WORKING_DOTS_HTML}</div>${cancelRunButtonHtml(runId)}</div>`;
      bindCancelRunButton(runId, resultEl, btn, stepListEl);
      setTimeout(() => pollPipelineRun(runId, resultEl, btn, stepListEl), 2000);
      return;
    }
    if (run.status === 'waiting_human') {
      resultEl.innerHTML = `<div class="card"><h2>Waiting for you</h2><p style="font-size:14px;">This run is paused at a step that needs your confirmation — see the step list above.</p>${cancelRunButtonHtml(runId)}</div>`;
      bindCancelRunButton(runId, resultEl, btn, stepListEl);
      if (btn) btn.disabled = false;
      return;
    }
    if (btn) btn.disabled = false;
    if (run.status === 'failed') {
      resultEl.innerHTML = `<div class="card"><h2>Run failed</h2><div class="errbox">${esc(run.error || 'Unknown error')}</div>${run.cli_output ? `<pre style="white-space:pre-wrap;font-size:12px;background:var(--bg);padding:10px;border-radius:8px;margin-top:10px;">${esc(run.cli_output)}</pre>` : ''}</div>`;
      return;
    }
    resultEl.innerHTML = `
      <div class="card">
        <h2>Result</h2>
        ${run.summary ? `<p style="font-size:14px;">${esc(run.summary)}</p>` : ''}
        ${run.report_path ? `<p style="color:var(--ink-soft);font-size:12.5px;">Full report: <code>${esc(run.report_path)}</code></p>` : ''}
        <details style="margin-top:10px;"><summary style="cursor:pointer;font-size:12.5px;color:var(--ink-soft);">Raw CLI output</summary>
          <pre style="white-space:pre-wrap;font-size:12px;background:var(--bg);padding:10px;border-radius:8px;margin-top:8px;">${esc(run.cli_output || '')}</pre>
        </details>
      </div>`;
  } catch (e) {
    resultEl.innerHTML = `<div class="errbox">Lost track of this run: ${esc(e.message)}</div>`;
    if (btn) btn.disabled = false;
  }
}

// Every real pipeline in system-test-ops' .claude/pipelines/index.yaml MUST appear in
// exactly one group here -- `start` was missing for a while (found via ISSUES.md feedback,
// 2026-09-08): it's real, has a real /start slash command, but wasn't in any group, so it
// silently never showed up in the sidebar even though every other pipeline did.
// ingest-docs moved from Build into Start (2026-09-17, ISSUES.md): it's a genuine
// before-anything-else step (raw docs -> knowledge notes, no TestRail write, no suite
// target needed) and Start is deliberately the one group never setup-gated -- so it
// belongs alongside `start` itself, not behind the credentials/suite-target gate.
// write-automation found real, already wired end-to-end in runner.py (confirm_devices ->
// test-author agent -> commit_push, with real test coverage) but was never added to a nav
// group -- so it existed but had no way to reach it from the sidebar at all (2026-09-17).
// new-suite-from-docs removed from nav entirely (2026-09-18, ISSUES.md: "no need really...
// just get rid of entirely") -- pipeline/backend untouched, just not surfaced any more.
// resolve-gaps moved from Audit into Maintain (2026-09-18, ISSUES.md: "move to maintain
// i think") -- also gets its own button directly on the Gap Register page (see renderGaps).
// export-automation/write-automation moved out of the Build group entirely (ISSUES.md
// round 2: "move to Automation instead") -- real nav buttons now live in the Automation
// tab's own sidebar (see automationNavgroups in the HTML + wireAutomationPipelineNav()
// below), which jump to this exact same real pipeline-run screen. Pipeline id/backend
// untouched either way.
const GROUPS = {
  'Start': ['start', 'ingest-docs'],
  // new-suite-from-docs deliberately has NO button (2026-09-23). It IS real and runnable
  // -- it chains Ingest + Onboarding -- but once the detail page was fixed to show the
  // steps it really expands to, the cost was obvious: for Translink that's 136 steps, 65
  // AI calls and 59 separate Approve & Push gates in one click. Running Ingest, checking
  // the relevance gate and what distilled, THEN onboarding is both cheaper and safer, and
  // you click approve the same number of times either way. The pipeline file stays as
  // plumbing; it just isn't offered as a button.
  Build: ['onboard-suite', 'add-feature', 'consolidate', 'targeted-run'],
  Audit: ['audit-coverage', 'audit-flows', 'audit'],
  Maintain: ['fold-defect', 'review-runs', 'consolidation-check', 'traceability-check', 'maintain', 'resolve-gaps'],
};
// Display-only renames (round 2, ISSUES.md) -- never the real pipeline `id` or group DOM
// id, both of which stay exactly what system-test-ops' pipelines/slash-commands use.
// Resolved duplicate (was flagged, now settled by George): the Build group stays "Pipelines"
// here; the separate Overview nav item (renderProcessesTab) is "Pipeline Info" instead.
const GROUP_DISPLAY_NAME = {
  Start: 'Start', Build: 'Pipelines', Audit: 'Audit', Maintain: 'Health',
};
const PIPELINE_DISPLAY_NAME = {
  start: 'Setup',
  'onboard-suite': 'Onboarding',
  'add-feature': 'Feature',
  consolidate: 'Merge',
  'export-automation': 'Pull cases',
  'write-automation': 'Write',
  'draft-automation': 'Draft',
  'targeted-run': 'Targeted run',
  'audit-coverage': 'Release',
  'audit-flows': 'Design',
  audit: 'Standard',
  'fold-defect': 'Defect',
  'review-runs': 'History',
  'consolidation-check': 'Merge check',
  'traceability-check': 'Trace check',
  maintain: 'Checkup',
  'resolve-gaps': 'Resolve',
};
// "Proper English" rule (ISSUES.md round 2): a label the TOOL generates (this fallback,
// when a pipeline has no explicit display name above) must read as a normal sentence/
// title, not a raw slash-command's lowercase-with-dashes form. Real DATA the tool merely
// displays (file names, TestRail project names, device ids, etc.) is untouched elsewhere --
// this only reaches for the tool's own generated labels.
function titleCaseWords(s) { return s.replace(/\b\w/g, c => c.toUpperCase()); }
function pipelineDisplayName(p) {
  if (PIPELINE_DISPLAY_NAME[p.id]) return PIPELINE_DISPLAY_NAME[p.id];
  return p.slash_command ? titleCaseWords(p.slash_command.replace('/', '').replace(/-/g, ' ')) : p.id;
}

   (ISSUES.md round 2 ask; the same "close siblings" idea is applied separately to the
   Processes/Features stage groups and repo-map folders at their own toggle sites, since
   each renders into a fresh DOM subtree on every view change and needs its own listener). */
function closeSiblingNavGroups(openedGroup) {
  document.querySelectorAll('#navgroups .navgroup.collapsible.open').forEach(g => {

function wireCollapsibleNavHeader(header) {

/* ---------------- Automation dashboard: real test-count summary ---------------- */
async function renderAutomationDashboard(project, device_type) {
  loading();
  try {
    const params = new URLSearchParams();
    if (project) params.set('project', project);
    if (device_type) params.set('device_type', device_type);
    const d = await fetchJSON(`/api/automation/tests${params.toString() ? '?' + params : ''}`);
    const s = d.summary;
    // Horizontal bar, one hue, sorted high->low -- the right form for "compare magnitude"
    // with long category names (feature names like sso_etm_to_ivn_interface). Rebuilt
    // 2026-09-23: was a flex row with a hard 100px label that long names overflowed,
    // wrapping to two lines while the bar and value stayed on the first -- George: "with
    // a like bar, but overlaps the text... will always look weird for all projects".
    // A grid keeps label / track / value in their own columns at any name length, and
    // scales to any project's feature set. (Not a pie: pie is for a single ratio against
    // a limit, not 10+ ranked magnitudes.)
    // GAP stubs are excluded from this data entirely (George, 2026-09-23: "a complete gap
    // stub just doesn't need to be included in the data until written properly") -- the
    // parser still identifies them, purely so they can be left out. A written test that
    // merely needs a small assertion tweak still counts; a pure skip-stub doesn't exist yet.
    const barRow = (label, obj, cls) => {
      const entries = Object.entries(obj).sort((a, b) => b[1] - a[1]);
      const max = Math.max(1, ...entries.map(([, v]) => v));
      if (!entries.length) return '<p style="color:var(--ink-soft);font-size:13px;">No tests match this filter.</p>';
      return entries.map(([k, v]) => `
      <div style="display:grid;grid-template-columns:minmax(0,34%) 1fr auto;align-items:center;gap:10px;margin-bottom:7px;" title="${esc(k)}: ${v}">
        <span style="font-size:12.5px;overflow-wrap:anywhere;line-height:1.3;">${esc(k)}</span>
        <div style="background:var(--bg);border-radius:4px;height:8px;overflow:hidden;">
          <div style="height:100%;width:${Math.max(2, v / max * 100)}%;background:var(--${cls});border-radius:4px;"></div>
        </div>
        <span style="font-size:12px;color:var(--ink-soft);text-align:right;white-space:nowrap;">${v}</span>
      </div>`).join('');
    };
    setContent(`
      <div class="page-head"><h1>Automation dashboard</h1><p>Real counts, parsed live from test-automation-sit's own .robot files — not SIT keywords, actual written tests.</p></div>
      <div class="card">
        <div style="display:flex;gap:10px;">
          <select id="adProjectFilter" style="font-family:inherit;font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);">
            <option value="">All projects</option>
            ${d.projects.map(p => `<option value="${esc(p)}" ${p===project?'selected':''}>${esc(p)}</option>`).join('')}
          </select>
          <select id="adDeviceFilter" style="font-family:inherit;font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);">
            <option value="">All devices</option>
            ${d.device_types.map(dv => `<option value="${esc(dv)}" ${dv===device_type?'selected':''}>${esc(dv)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="stat-row">
        <div class="stat"><span class="n">${s.total_tests}</span><span class="l">tests written</span></div>
        <div class="stat"><span class="n">${s.total_suites}</span><span class="l">suites</span></div>
        <div class="stat"><span class="n">${Object.keys(s.by_project).length}</span><span class="l">projects</span></div>
        <div class="stat"><span class="n">${Object.keys(s.by_feature).length}</span><span class="l">functions/features</span></div>
      </div>
      <div class="grid2">
        <div class="card"><h2>By project</h2>${barRow('', s.by_project, 'ai')}</div>
        <div class="card"><h2>By device type</h2>${barRow('', s.by_device_type, 'code')}</div>
      </div>
      <div class="card"><h2>By function/feature <a href="#" data-goto-aview="tests" style="font-size:11.5px;font-weight:400;">See all tests →</a></h2>${barRow('', s.by_feature, 'gate')}</div>
      <div class="card" id="exportAutomationCard"></div>`);
    document.getElementById('adProjectFilter').addEventListener('change', (e) => renderAutomationDashboard(e.target.value, document.getElementById('adDeviceFilter').value));
    document.getElementById('adDeviceFilter').addEventListener('change', (e) => renderAutomationDashboard(document.getElementById('adProjectFilter').value, e.target.value));

    // Surfaces export-automation's last run here too (George's ask: "this should export
    // into the automation tab somewhere... last date and time of the export") -- tied to
    // the console's current suite target, not this dashboard's own project/device filters
    // above (export-automation runs per suite target, not per automation-test filter).
    const cur = window.CURRENT_TARGET || {};
    const exportEl = document.getElementById('exportAutomationCard');
    if (exportEl && cur.project && cur.device) {
      fetchJSON(`/api/pipelines/export-automation/last-run?project=${encodeURIComponent(cur.project)}&device=${encodeURIComponent(cur.device)}`)
        .then(last => {
          exportEl.innerHTML = `<h2>export-automation — ${esc(cur.project)}/${esc(cur.device)} <a href="#" data-goto-pipeline="export-automation" class="corner-link">Run →</a></h2>
            ${last.status ? `<p style="font-size:13.5px;margin:0;"><span class="pill ${last.status==='succeeded'?'ok':last.status==='failed'?'bad':'warn'}">${esc(last.status)}</span> — ${esc(last.updated_at ? new Date(last.updated_at+'Z').toLocaleString() : '')}</p>${last.summary ? `<p style="color:var(--ink-soft);font-size:12.5px;margin-top:6px;">${esc(last.summary)}</p>` : ''}<p style="margin-top:8px;"><a href="#" data-goto-pipeline="write-automation" style="font-size:12.5px;">Write automation from this backlog →</a></p>`
                        : `<p style="color:var(--ink-soft);font-size:13px;">Never run for ${esc(cur.project)}/${esc(cur.device)} yet.</p>`}`;
        }).catch(() => { exportEl.innerHTML = ''; });
    } else if (exportEl) { exportEl.innerHTML = ''; }
  } catch (e) { errbox('Could not load automation dashboard: ' + e.message); }
}

/* ---------------- Project tab (2026-09-22): a real per-project rollup -- which devices
   are onboarded, suite health at a glance, open gaps, last audit -- built entirely from
   existing endpoints (taxonomy, suite-mappings, setup-status, gap-register, last-run).
   No new backend needed; this is a landing page over data that already exists but was
   only ever visible one project/device at a time via Change target. ---------------- */
async function renderProjectPage() {
  loading();
  try {
    const [taxonomy, mappings] = await Promise.all([fetchJSON('/api/taxonomy'), fetchJSON('/api/suite-mappings')]);
    const mapByKey = Object.fromEntries(mappings.map(m => [`${m.project}|${m.device}`, m]));
    const projects = Object.keys(taxonomy).sort();
    const cardsHtml = projects.map(p => {
      const devices = Object.keys(taxonomy[p] || {}).sort();
      const rows = devices.map(d => {
        const m = mapByKey[`${p}|${d}`];
        const onboarded = m && m.new_suite_id;
        return `<tr data-proj-row="${esc(p)}|${esc(d)}" style="cursor:pointer;">
          <td>${esc(d)}</td>
          <td>${onboarded ? `<span class="pill ok">Onboarded</span>` : `<span class="pill warn">Not set up</span>`}</td>
          <td style="font-size:12px;color:var(--ink-soft);" data-proj-audit="${esc(p)}|${esc(d)}">…</td>
          <td style="font-size:12px;color:var(--ink-soft);" data-proj-gaps="${esc(p)}|${esc(d)}">…</td>
        </tr>`;
      }).join('');
      return `<div class="card">
        <h2>${esc(p)}</h2>
        <table><tr><th>Device</th><th>Status</th><th>Last audit</th><th>Open gaps</th></tr>${rows}</table>
      </div>`;
    }).join('');
    setContent(`<div class="page-head"><h1>Project</h1><p>Every project/device this console knows about, at a glance.</p></div>
      <div class="grid2">${cardsHtml}</div>`);
    content.querySelectorAll('[data-proj-row]').forEach(row => {
      row.addEventListener('click', () => {
        const [project, device] = row.dataset.projRow.split('|');
        window.CURRENT_TARGET = {project, device};
        saveLastTarget(window.CURRENT_TARGET);
        const healthBtn = document.querySelector('.navitem[data-view="health"]');
        if (healthBtn) setActiveNav(healthBtn); // tabTestOps's own click handler re-renders whichever navitem is active
        document.getElementById('tabTestOps').click();
      });
    });
    // Best-effort per-device live fills -- last audit + open-gap count. Fire-and-forget,
    // each cell independently; one slow/failed lookup never blocks the rest of the page.
    for (const p of projects) {
      for (const d of Object.keys(taxonomy[p] || {})) {
        fetchJSON(`/api/pipelines/audit/last-run?project=${encodeURIComponent(p)}&device=${encodeURIComponent(d)}`)
          .then(r => { const el = content.querySelector(`[data-proj-audit="${p}|${d}"]`); if (el) el.textContent = r.status ? `${r.status} — ${new Date(r.updated_at + 'Z').toLocaleDateString()}` : 'Never run'; })
          .catch(() => {});
        fetchJSON(`/api/gap-register?project=${encodeURIComponent(p)}&device=${encodeURIComponent(d)}&scope=device&limit=1`)
          .then(r => { const el = content.querySelector(`[data-proj-gaps="${p}|${d}"]`); if (el) el.textContent = String(r.total ?? 0); })
          .catch(() => {});
      }
    }
  } catch (e) { errbox('Could not load Project: ' + e.message); }
}

/* ---------------- Reports tab (2026-09-22): real generated report files (coverage.md,
   run-health-report.md, build-complete.md, etc.) plus the SAME live numbers the Status
   page already computes for whichever target is current -- a live dashboard view, not
   just a stale file list (George: "integrate those reports into a real live view of the
   data... as well as a link to the reports"). ---------------- */
async function renderReportsPage() {
  loading();
  const target = window.CURRENT_TARGET || {};
  try {
    const [reports, liveSummary] = await Promise.all([
      fetchJSON('/api/reports'),
      target.project && target.device
        ? fetchJSON('/api/build-stats').catch(() => null)
        : Promise.resolve(null),
    ]);
    const liveHtml = liveSummary ? `
      <div class="card">
        <h2>Live — ${esc(target.project)}/${esc(target.device)}</h2>
        <div class="stat-row">
          <div class="stat"><span class="n">${liveSummary.cases_total}</span><span class="l">cases total</span></div>
          <div class="stat ok"><span class="n">${liveSummary.delta.added.length}</span><span class="l">added</span></div>
          <div class="stat warn"><span class="n">${liveSummary.delta.edited.length}</span><span class="l">edited</span></div>
          ${liveSummary.gap_open_count !== null ? `<div class="stat bad"><span class="n">${liveSummary.gap_open_count}</span><span class="l">open gap Qs</span></div>` : ''}
        </div>
      </div>` : `<div class="card"><h2>Live data</h2><p style="color:var(--ink-soft);font-size:12.5px;">Set a project/device target (Change target) to see live numbers here too.</p></div>`;
    const rows = reports.map((r, i) => `<tr data-report-idx="${i}" style="cursor:pointer;">
      <td>${esc(r.project)}</td>
      <td style="font-size:12.5px;">${esc(r.path)}</td>
      <td style="font-size:12px;color:var(--ink-soft);white-space:nowrap;">${new Date(r.modified_at * 1000).toLocaleString()}</td>
      <td style="font-size:12px;color:var(--ink-soft);">${(r.size / 1024).toFixed(1)} KB</td>
    </tr>`).join('');
    setContent(`
      <div class="page-head"><h1>Reports</h1><p>Every real report this console/system-test-ops has generated, plus a live view of the current target.</p></div>
      ${liveHtml}
      <div class="card">
        <h2>Generated reports${reports.length ? ` (${reports.length})` : ''}</h2>
        ${reports.length
          ? `<table><tr><th>Project</th><th>Path</th><th>Generated</th><th>Size</th></tr>${rows}</table>`
          : `<p style="color:var(--ink-soft);font-size:13px;">No report files found under system-test-ops/reports/ yet.</p>`}
      </div>
      <div id="reportPreview"></div>`);
    content.querySelectorAll('[data-report-idx]').forEach(row => {
      row.addEventListener('click', async () => {
        const r = reports[Number(row.dataset.reportIdx)];
        const el = document.getElementById('reportPreview');
        el.innerHTML = `<div class="card"><div class="loading">Loading ${esc(r.filename)}…</div></div>`;
        try {
          const body = await fetchJSON(`/api/reports/content?path=${encodeURIComponent(r.path)}`);
          el.innerHTML = `<div class="card"><h2>${esc(r.path)}</h2><pre style="white-space:pre-wrap;font-size:12.5px;max-height:480px;overflow:auto;">${esc(body.text)}</pre></div>`;
        } catch (e) { el.innerHTML = `<div class="errbox">Could not load: ${esc(e.message)}</div>`; }
      });
    });
  } catch (e) { errbox('Could not load Reports: ' + e.message); }
}

/* ---------------- Target switcher — real taxonomy + real, API-backed suite mappings ---------------- */
let TAXONOMY = {};
// Keyed by "project|device" -- every pair has its OWN old (read-only source)/new (write
// target) suite; never assume one carries over from another combination. Loaded from the
// real store (/api/suite-mappings) -- never hardcoded here, so adding a pair in the UI is
// the only source of truth, no code change needed for a new project/device.
let SUITE_MAPPINGS = {};
// The console's current working target -- read by other views (e.g. Docs) so an upload or
// a future pipeline run always lands against the project/device actually selected, not a
// stale default.
// Persisted across reloads (ISSUES.md round 2, real bug: "after onboarding or refreshing
// it snaps to a default translink target... should always be the last selected, not snap
// to a default"). Root cause was exactly that -- this was a hardcoded literal with nothing
// ever writing to or reading from storage. Now the last APPLIED target (via "Approve &
// apply target" below) is saved, and restored here before first render.
const LAST_TARGET_KEY = 'testops.lastTarget';
function loadLastTarget() {
  try {
    const raw = localStorage.getItem(LAST_TARGET_KEY);
    if (!raw) return null;
    const t = JSON.parse(raw);
    if (t && t.project && t.device) return t;
  } catch (e) { /* corrupt/blocked storage -- fall through to the default below */ }
  return null;
}
function saveLastTarget(t) {
  try { localStorage.setItem(LAST_TARGET_KEY, JSON.stringify(t)); } catch (e) { /* private window / blocked storage -- non-fatal */ }
}
window.CURRENT_TARGET = loadLastTarget() || {project: 'Translink', device: 'POS'};

/* ---------------- Setup-status gate: fade Start/Build/Audit/Maintain until this target is
   actually ready (credentials + suite mapping + docs/knowledge). Docs/Settings stay live —
   that's where setup happens. ---------------- */
// Start deliberately excluded (George, 2026-09-11): it's the onboarding entry point
// itself -- gating it behind "setup complete" would make it unreachable exactly when
// it's needed most. Automation tab is a separate top-level tab entirely, never gated.
const GATED_GROUP_IDS = ['navBuild', 'navAudit', 'navMaintain'];
async function refreshSetupGate() {
  const {project, device} = window.CURRENT_TARGET || {};
  if (!project || !device) return;
  let status;
  try {
    status = await fetchJSON(`/api/setup-status?project=${encodeURIComponent(project)}&device=${encodeURIComponent(device)}`);
  } catch (e) { return; } // leave whatever gating state we had rather than guess
  GATED_GROUP_IDS.forEach(gid => {
    const el = document.getElementById(gid);
    if (!el) return;
    el.classList.toggle('setup-gated', !status.ready);
    el.querySelectorAll('.navitem[data-pipeline]').forEach(btn => btn.classList.toggle('disabled', !status.ready));
  });
  const banner = document.getElementById('setupGateBanner');
  if (banner) {
    banner.style.display = status.ready ? 'none' : 'flex';
    if (!status.ready) {
      const missing = [];
      if (!status.credentials_configured) missing.push('TestRail credentials');
      if (!status.suite_configured) missing.push('a suite target');
      if (!status.docs_configured) missing.push('docs/knowledge');
      banner.querySelector('span').textContent = `${project}/${device} isn't fully set up yet — missing: ${missing.join(', ')}. Build/Audit/Maintain are faded until this is complete.`;
    }
  }
}

async function loadSuiteMappings() {
  try {
    const rows = await fetchJSON('/api/suite-mappings');
    SUITE_MAPPINGS = {};
    rows.forEach(r => { SUITE_MAPPINGS[`${r.project}|${r.device}`] = {old: r.old_suite, new: r.new_suite, old_suite_id: r.old_suite_id, new_suite_id: r.new_suite_id, testrail_project_id: r.testrail_project_id, approved_by: r.approved_by, approved_at: r.approved_at}; });
    if (Object.keys(TAXONOMY).length && typeof refreshDevices === 'function') refreshDevices(); // pick up TestRail-only devices (e.g. BOS) that just loaded
  } catch (e) { /* leave whatever we had; readout will show "not configured" worst case */ }
  refreshTargetsGitStatus();
}

// This target list (system-test-ops/knowledge/suite_targets.yaml -- the ONE canonical copy,
// read/written directly on the sibling checkout, not a separate copy in this repo) is
// git-tracked so a colleague's own console/CLI can pick up a target you add -- but only once
// you actually commit+push it; this app never does that automatically. Surfaces that state so
// an addition doesn't feel "done" when it's still only sitting on this machine.
async function refreshTargetsGitStatus() {
  const el = document.getElementById('targetsGitStatus');
  if (!el) return;
  try {
    const s = await fetchJSON('/api/suite-mappings/git-status');
    const messages = {
      clean: 'Target list is committed and pushed — up to date with origin.',
      uncommitted: 'Target list has local changes not yet committed — commit system-test-ops/knowledge/suite_targets.yaml so others can see any target you added.',
      unpushed: 'Target list is committed locally but not pushed yet — push so a colleague’s console picks it up on their next pull.',
      unknown: 'Could not determine whether the shared target list is up to date' + (s.detail ? ` (${s.detail})` : '') + '.',
    };
    el.textContent = messages[s.status] || '';
  } catch (e) { el.textContent = ''; }
}

// Restores the persisted target chip text (and Project/Device selects, once loaded) --
// previously this text was a hardcoded literal in the HTML, never updated on reload.
function applyRestoredTargetToUI() {
  const t = window.CURRENT_TARGET || {};
  if (!t.project || !t.device) return;
  const pair = SUITE_MAPPINGS[`${t.project}|${t.device}`];
  const chip = document.getElementById('targetChip');
  if (chip) {
    chip.innerHTML = pair
      ? `${esc(t.project)} <span class="seg">/</span> ${esc(t.device)} <span class="seg">/</span> ${pair.old ? `old: ${esc(pair.old)}` : `<i>fresh build</i>`} <span class="seg">/</span> new: ${esc(pair.new)}`
      : `${esc(t.project)} <span class="seg">/</span> ${esc(t.device)}`;
  }
  if (selProject && Array.from(selProject.options).some(o => o.value === t.project)) {
    selProject.value = t.project;
    fillSelect(selDevice, devicesForProject(t.project));
    if (Array.from(selDevice.options).some(o => o.value === t.device)) selDevice.value = t.device;
    refreshSuiteReadout();
  }
  refreshSetupGate();
}

fetchJSON('/api/taxonomy').then(t => { TAXONOMY = t; refreshDevices(); applyRestoredTargetToUI(); }).catch(() => {});
loadSuiteMappings().then(applyRestoredTargetToUI);

const selProject = document.getElementById('selProject');
const selDevice = document.getElementById('selDevice');
const suiteReadout = document.getElementById('suiteReadout');
const approveCheck = document.getElementById('approveCheck');
const modalApply = document.getElementById('modalApply');
const suiteEditBtn = document.getElementById('suiteEditBtn');
const suiteDeleteBtn = document.getElementById('suiteDeleteBtn');
const suiteEditForm = document.getElementById('suiteEditForm');
const editOldSuite = document.getElementById('editOldSuite');
const editNewSuite = document.getElementById('editNewSuite');

function fillSelect(sel, items) { sel.innerHTML = items.map(i => `<option value="${esc(i)}">${esc(i.replace(/_/g,' '))}</option>`).join(''); }
// Devices come from real SIT taxonomy, UNIONED with any device that has a real suite
// mapping but isn't a SIT device_type at all (e.g. BOS/ABT -- checked EquipmentTypes.json
// directly: SIT only knows ETM/TVM/POS/BV/PV/GV/HHD/Sub-components/P+R for Translink, no
// BOS. It's a real TestRail concept George wants modelled as a device-under-project
// anyway, so it's surfaced here from the suite-mappings store, never invented into the
// taxonomy endpoint itself which stays 100% SIT-derived).
function devicesForProject(project) {
  const fromTaxonomy = Object.keys(TAXONOMY[project] || {});
  const fromMappings = Object.keys(SUITE_MAPPINGS)
    .filter(k => k.startsWith(project + '|'))
    .map(k => k.split('|')[1]);
  return [...new Set([...fromTaxonomy, ...fromMappings])].sort();
}
function projectsWithMappings() {
  const fromMappings = Object.keys(SUITE_MAPPINGS).map(k => k.split('|')[0]);
  return [...new Set([...Object.keys(TAXONOMY), ...fromMappings])].sort();
}
function refreshDevices() { fillSelect(selProject, projectsWithMappings()); fillSelect(selDevice, devicesForProject(selProject.value)); refreshSuiteReadout(); }
// Any TestRail project id already known for this project name, from any existing pair --
// so adding a new pair under an already-known project never re-asks for its parent
// TestRail project (ISSUES.md round 2 ask).
function projectTestrailId(project) {
  for (const [key, pair] of Object.entries(SUITE_MAPPINGS)) {
    if (key.split('|')[0] === project && pair.testrail_project_id != null) return pair.testrail_project_id;
  }
  return null;
}

function currentPairKey() { return `${selProject.value}|${selDevice.value}`; }

const approveStatus = document.getElementById('approveStatus');
const approveCheckLabel = document.getElementById('approveCheckLabel');

function refreshSuiteReadout() {
  const pair = SUITE_MAPPINGS[currentPairKey()];
  const approved = !!(pair && pair.approved_by);
  approveCheck.checked = approved;
  approveCheck.disabled = !pair;
  approveCheckLabel.textContent = approved
    ? 'Approved — target sign-off is persisted (uncheck to revoke locally; re-check to re-approve).'
    : 'I approve pointing this console at the suites shown above — this is a real, persisted sign-off. Any push --commit step also refuses to run until this is set, independent of that step\'s own confirmation.';
  approveStatus.textContent = approved
    ? `Approved by ${pair.approved_by} on ${new Date(pair.approved_at).toLocaleString()}.`
    : '';
  suiteEditForm.style.display = 'none';
  suiteDeleteBtn.style.display = pair ? '' : 'none';
  suiteEditBtn.textContent = pair ? 'Edit this pair' : 'Add this pair';
  updateApplyEnabled();
  if (pair) {
    suiteReadout.className = 'suite-readout';
    // Shortened copy (ISSUES.md round 2: "no need to bulk our the jargon... make it simpler").
    const oldLine = pair.old
      ? `<span class="k">Old</span>${esc(pair.old)}`
      : `<span class="k">Old</span><span style="font-style:italic;">Fresh build — no old suite</span>`;
    suiteReadout.innerHTML = `${oldLine}<br><span class="k" style="margin-top:8px;display:block;">New</span>${esc(pair.new)}`;
  } else {
    suiteReadout.className = 'suite-readout missing';
    suiteReadout.innerHTML = `<span class="k">Not set up yet</span>No suite pair for ${esc(selProject.value)} / ${esc(selDevice.value)} — add it below.`;
  }
}

function updateApplyEnabled() {
  modalApply.disabled = !(SUITE_MAPPINGS[currentPairKey()] && approveCheck.checked);
}

selProject?.addEventListener('change', () => { fillSelect(selDevice, devicesForProject(selProject.value)); refreshSuiteReadout(); });
selDevice?.addEventListener('change', refreshSuiteReadout);
approveCheck.addEventListener('change', async () => {
  const pair = SUITE_MAPPINGS[currentPairKey()];
  if (!pair) { updateApplyEnabled(); return; }
  if (!approveCheck.checked) { updateApplyEnabled(); return; } // unchecking is local-only; no "un-approve" endpoint
  const [project, device] = currentPairKey().split('|');
  try {
    const res = await fetch(`/api/suite-mappings/${encodeURIComponent(project)}/${encodeURIComponent(device)}/approve`, {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({}),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
    const updated = await res.json();
    pair.approved_by = updated.approved_by;
    pair.approved_at = updated.approved_at;
  } catch (e) {
    approveCheck.checked = false;
    approveStatus.textContent = 'Could not save approval — try again.';
  }
  refreshSuiteReadout();
});

const editFreshBuild = document.getElementById('editFreshBuild');
const editOldSuiteField = document.getElementById('editOldSuiteField');
editFreshBuild.addEventListener('change', () => { editOldSuiteField.style.display = editFreshBuild.checked ? 'none' : ''; });

const editOldSuiteId = document.getElementById('editOldSuiteId');
const editNewSuiteId = document.getElementById('editNewSuiteId');
const editNewProject = document.getElementById('editNewProject');
const editNewDevice = document.getElementById('editNewDevice');
const editTestrailProject = document.getElementById('editTestrailProject');
const editTestrailProjectError = document.getElementById('editTestrailProjectError');
const editOldSuiteSelect = document.getElementById('editOldSuiteSelect');
const editNewSuiteSelect = document.getElementById('editNewSuiteSelect');
let CURRENT_TESTRAIL_PROJECT_ID = null;

// Real dropdowns fed from TestRail itself -- added 2026-09-14 after a target got pointed
// at the wrong real TestRail project (a hand-typed id has no way to catch that mistake).
// Falls back to the existing free-text suite name/id inputs if TestRail can't be reached.
async function loadTestrailProjectsDropdown(preselectId) {
  try {
    const projects = await fetchJSON('/api/testrail/projects');
    editTestrailProject.innerHTML = '<option value="">— pick a TestRail project —</option>' +
      projects.map(p => `<option value="${p.id}">${esc(p.name)} (${p.id})</option>`).join('');
    editTestrailProject.disabled = false;
    editTestrailProjectError.style.display = 'none';
    if (preselectId) { editTestrailProject.value = String(preselectId); await loadTestrailSuitesDropdowns(preselectId); }
  } catch (e) {
    editTestrailProject.innerHTML = '<option value="">(unavailable)</option>';
    editTestrailProject.disabled = true;
    editTestrailProjectError.style.display = 'block';
  }
}
async function loadTestrailSuitesDropdowns(projectId) {
  editOldSuiteSelect.style.display = 'none';
  editNewSuiteSelect.style.display = 'none';
  if (!projectId) return;
  try {
    const suites = await fetchJSON(`/api/testrail/suites?project_id=${encodeURIComponent(projectId)}`);
    const options = '<option value="">— pick a suite, or type one below —</option>' +
      suites.map(s => `<option value="${s.id}" data-name="${esc(s.name)}">${esc(s.name)} (${s.id})</option>`).join('');
    editOldSuiteSelect.innerHTML = options;
    editNewSuiteSelect.innerHTML = options;
    editOldSuiteSelect.style.display = '';
    editNewSuiteSelect.style.display = '';
  } catch (e) { /* leave the free-text inputs as the only option */ }
}
editTestrailProject.addEventListener('change', () => {
  CURRENT_TESTRAIL_PROJECT_ID = editTestrailProject.value ? parseInt(editTestrailProject.value, 10) : null;
  loadTestrailSuitesDropdowns(CURRENT_TESTRAIL_PROJECT_ID);
});
editOldSuiteSelect.addEventListener('change', () => {
  const opt = editOldSuiteSelect.selectedOptions[0];
  if (!opt || !opt.value) return;
  editOldSuite.value = opt.dataset.name || '';
  editOldSuiteId.value = opt.value;
});
editNewSuiteSelect.addEventListener('change', () => {
  const opt = editNewSuiteSelect.selectedOptions[0];
  if (!opt || !opt.value) return;
  editNewSuite.value = opt.dataset.name || '';
  editNewSuiteId.value = opt.value;
});

const editNewProjectField = document.getElementById('editNewProjectField');
const editTestrailProjectField = document.getElementById('editTestrailProjectField');
const editTestrailProjectLocked = document.getElementById('editTestrailProjectLocked');
let ADDING_NEW_PROJECT = false;

// Shared open-the-form logic. `addingNewProject` = true only via the dedicated "Add
// project" button -- the ordinary "Add/edit this pair" button always targets the
// currently-selected Project, and if that project already has a known parent TestRail
// project (from any earlier pair), that step is skipped entirely and reused instead
// (ISSUES.md round 2 ask: don't re-ask for a project's parent TestRail project every time).
function openSuiteEditForm(addingNewProject) {
  ADDING_NEW_PROJECT = addingNewProject;
  const pair = addingNewProject ? null : SUITE_MAPPINGS[currentPairKey()];
  const isFresh = !!pair && !pair.old;
  editFreshBuild.checked = isFresh;
  editOldSuiteField.style.display = isFresh ? 'none' : '';
  editOldSuite.value = pair ? pair.old : '';
  editOldSuiteId.value = pair && pair.old_suite_id != null ? pair.old_suite_id : '';
  editNewSuite.value = pair ? pair.new : '';
  editNewSuiteId.value = pair && pair.new_suite_id != null ? pair.new_suite_id : '';
  editNewProject.value = '';
  editNewDevice.value = addingNewProject ? '' : selDevice.value;
  editNewProjectField.style.display = addingNewProject ? '' : 'none';

  const knownTestrailId = addingNewProject ? null : projectTestrailId(selProject.value);
  CURRENT_TESTRAIL_PROJECT_ID = pair && pair.testrail_project_id != null ? pair.testrail_project_id : knownTestrailId;
  if (knownTestrailId != null) {
    // Reused silently -- no re-picking a parent TestRail project for a project we already know.
    editTestrailProjectField.style.display = 'none';
    editTestrailProjectLocked.style.display = 'block';
    editTestrailProjectLocked.textContent = `TestRail project already set for ${selProject.value} (id ${knownTestrailId}) — reused automatically.`;
    loadTestrailSuitesDropdowns(knownTestrailId);
  } else {
    editTestrailProjectField.style.display = '';
    editTestrailProjectLocked.style.display = 'none';
    loadTestrailProjectsDropdown(CURRENT_TESTRAIL_PROJECT_ID);
  }
  suiteEditForm.style.display = 'flex';
}
suiteEditBtn.addEventListener('click', () => openSuiteEditForm(false));
document.getElementById('suiteAddProjectBtn').addEventListener('click', () => openSuiteEditForm(true));
document.getElementById('suiteEditCancel').addEventListener('click', () => { suiteEditForm.style.display = 'none'; });
document.getElementById('suiteEditSave').addEventListener('click', async () => {
  const fresh_build = editFreshBuild.checked;
  const old_suite = fresh_build ? '' : editOldSuite.value.trim();
  const new_suite = editNewSuite.value.trim();
  const new_suite_id = editNewSuiteId.value.trim() ? parseInt(editNewSuiteId.value.trim(), 10) : null;
  const old_suite_id = (!fresh_build && editOldSuiteId.value.trim()) ? parseInt(editOldSuiteId.value.trim(), 10) : null;
  if (ADDING_NEW_PROJECT && !editNewProject.value.trim()) { alert('New project name is required.'); return; }
  const project = ADDING_NEW_PROJECT ? editNewProject.value.trim() : selProject.value;
  const device = editNewDevice.value.trim() || selDevice.value;
  if (!project || !device) { alert('Project and device are both required.'); return; }
  if (!fresh_build && !old_suite) { alert('Old suite is required, or tick "Fresh build" if there genuinely is no old suite.'); return; }
  if (!new_suite) { alert('New suite is required.'); return; }
  if (!new_suite_id) { alert('New suite ID (the numeric TestRail suite id) is required — without it, pipelines have no --suite value to run against.'); return; }
  try {
    const res = await fetch('/api/suite-mappings', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({project, device, old_suite, new_suite, new_suite_id, old_suite_id, fresh_build, testrail_project_id: CURRENT_TESTRAIL_PROJECT_ID}),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
    await loadSuiteMappings();
    // Point the outer Project/Device dropdowns at what was JUST saved -- otherwise the
    // approve checkbox / "Approve & apply target" button keep checking whatever pair was
    // selected before (e.g. Translink/POS), which never matches the new pair, so ticking
    // approve silently does nothing. Found live: George's colleague added NJT/ETM via the
    // free-text fields while Translink/POS was still the outer selection.
    refreshDevices();
    selProject.value = project;
    fillSelect(selDevice, devicesForProject(project));
    selDevice.value = device;
    refreshSuiteReadout();
    suiteEditForm.style.display = 'none';
    updateApplyEnabled();
  } catch (e) { alert('Could not save: ' + e.message); }
});
suiteDeleteBtn.addEventListener('click', async () => {
  if (!confirm(`Remove the suite mapping for ${selProject.value} / ${selDevice.value}?`)) return;
  try {
    const res = await fetch(`/api/suite-mappings/${encodeURIComponent(selProject.value)}/${encodeURIComponent(selDevice.value)}`, {method: 'DELETE'});
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
    await loadSuiteMappings();
    refreshSuiteReadout();
  } catch (e) { alert('Could not remove: ' + e.message); }
});

const targetModal = document.getElementById('targetModal');
document.getElementById('changeTargetBtn').addEventListener('click', () => targetModal.classList.add('open'));
document.getElementById('modalClose').addEventListener('click', () => targetModal.classList.remove('open'));
document.getElementById('modalCancel').addEventListener('click', () => targetModal.classList.remove('open'));
modalApply.addEventListener('click', () => {
  const pair = SUITE_MAPPINGS[currentPairKey()];
  if (!pair) return; // belt-and-braces; button is disabled in this state anyway
  window.CURRENT_TARGET = {project: selProject.value, device: selDevice.value};
  saveLastTarget(window.CURRENT_TARGET);
  document.getElementById('targetChip').innerHTML =
    `${esc(selProject.value)} <span class="seg">/</span> ${esc(selDevice.value)} ` +
    `<span class="seg">/</span> ${pair.old ? `old: ${esc(pair.old)}` : `<i>fresh build</i>`} <span class="seg">/</span> new: ${esc(pair.new)}`;
  targetModal.classList.remove('open');
  if (typeof CURRENT_RERENDER === 'function') CURRENT_RERENDER();
  refreshSetupGate();
});

document.querySelectorAll('#setupGateBanner [data-goto-view]').forEach(btn => {
  btn.addEventListener('click', () => {
    const view = btn.dataset.gotoView;
    const navBtn = document.querySelector(`.navitem[data-view="${view}"]`);
    if (navBtn) { setActiveNav(navBtn); ACTIVE_VIEW = view; CURRENT_RERENDER = () => VIEWS[view](); CURRENT_RERENDER(); }
  });
});
refreshSetupGate();
</script>
