<title>Test-Ops Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --p1:#5F016F; --p1-900:#38003D; --p1-700:#8704AF;
    --p2:#FF33BB; --p3:#FF80D4; --p4:#FFADE4;
    --p4-200:#FFC7EC; --p4-100:#FFE5F7;
    --off-white:#F9F5F4;
    --n900:#201E1D; --n700:#545050; --n500:#716C6A; --n300:#C3BDBC; --n200:#E3DFDD;

    --bg: var(--off-white); --surface:#FFFFFF;
    --sidebar-bg: var(--p1-900); --sidebar-ink: var(--p4); --sidebar-ink-dim:#C9A0C7;
    --sidebar-active-bg: var(--p1);
    --ink: var(--n900); --ink-soft: var(--n500); --line: var(--n200);
    --accent: var(--p1); --accent-soft-bg: var(--p4-100); --accent-soft-border: var(--p4-200);
    --ok:#1F7A3D; --ok-bg:#E4F5E9; --warn:#9A6A00; --warn-bg:#FDF1DC; --bad:#B23A3A; --bad-bg:#FBE4E4;
    --ai:#8704AF; --ai-bg:#F3E3F7; --code:#0F7A6E; --code-bg:#E1F5F2; --gate:#5C4A8C; --gate-bg:#E9E3F4; --human:#716C6A; --human-bg:#E3DFDD;
    --shadow: 0 1px 2px rgba(56,0,61,.04), 0 6px 20px rgba(56,0,61,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#201E1D; --surface:#2B2827; --ink:#F9F5F4; --ink-soft:#C3BDBC; --line:#3E3A38;
      --accent: var(--p4); --accent-soft-bg:#3D2A3B; --accent-soft-border:#5C3E58;
      --ok:#4FBE72; --ok-bg:#1D3324; --warn:#D9A441; --warn-bg:#332B14; --bad:#E27272; --bad-bg:#3A2323;
      --ai:#D89AE8; --ai-bg:#3A2A3E; --code:#5FC9B6; --code-bg:#17332E; --gate:#B7A2E4; --gate-bg:#2B2440; --human:#AEB8AE; --human-bg:#2C332C;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif;font-size:14.5px;line-height:1.5;}
  h1,h2,h3,.brand-font{font-family:"Poppins","Inter",sans-serif;}
  .shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh;}
  @media (max-width:860px){.shell{grid-template-columns:1fr;} .sidebar{display:none;}}

  .sidebar{background:var(--sidebar-bg);color:var(--sidebar-ink);display:flex;flex-direction:column;padding:22px 16px 18px;position:sticky;top:0;height:100vh;}
  .sidebar .logo-row{display:flex;align-items:center;gap:8px;padding:4px 8px 24px;}
  .sidebar .logo-row img{height:36px;width:auto;filter:brightness(0) invert(1);display:block;}
  .sidebar .tool-name{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sidebar-ink-dim);padding:0 8px 16px;}
  nav.navgroups{flex:1;overflow-y:auto;}
  .navgroup{margin-bottom:18px;}
  .navgroup .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--sidebar-ink-dim);padding:0 10px 6px;}
  .navitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13.5px;color:var(--sidebar-ink);text-decoration:none;cursor:pointer;margin-bottom:2px;border:none;background:none;width:100%;text-align:left;font-family:inherit;}
  .navitem:hover{background:rgba(255,255,255,.06);}
  .navitem.active{background:var(--sidebar-active-bg);color:#fff;font-weight:600;}
  .navitem .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55;flex:none;}
  .navitem .skel{opacity:.4;}
  .sidebar-foot{border-top:1px solid rgba(255,255,255,.12);padding-top:14px;margin-top:6px;font-size:12px;color:var(--sidebar-ink-dim);display:flex;align-items:center;gap:8px;}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--p2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex:none;}

  main{padding:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 28px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5;}
  .target-chip{display:flex;align-items:center;gap:8px;font-size:13px;background:var(--accent-soft-bg);border:1px solid var(--accent-soft-border);color:var(--accent);padding:6px 12px;border-radius:99px;font-weight:600;}
  .target-chip .seg{opacity:.55;font-weight:500;margin:0 2px;}
  .btn{font-family:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;}
  .btn.primary{background:var(--p1);border-color:var(--p1);color:#fff;}

  .content{padding:26px 28px 60px;width:100%;max-width:1600px;}
  .page-head{margin-bottom:22px;}
  .page-head h1{font-size:22px;margin:0 0 4px;font-weight:600;}
  .page-head p{color:var(--ink-soft);margin:0;font-size:13.5px;}

  .fixture-note{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--warn);background:var(--warn-bg);padding:4px 10px;border-radius:99px;margin-bottom:16px;}

  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);}
  .stat .n{font-family:"Poppins";font-size:24px;font-weight:600;display:block;font-variant-numeric:tabular-nums;}
  .stat .l{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}
  .stat.ok .n{color:var(--ok);} .stat.warn .n{color:var(--warn);} .stat.bad .n{color:var(--bad);}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:18px;}
  .card h2{font-size:15px;margin:0 0 12px;font-weight:600;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;}
  .pill.ok{background:var(--ok-bg);color:var(--ok);} .pill.warn{background:var(--warn-bg);color:var(--warn);} .pill.bad{background:var(--bad-bg);color:var(--bad);}
  .pill.ai{background:var(--ai-bg);color:var(--ai);} .pill.code{background:var(--code-bg);color:var(--code);}
  .pill.gate{background:var(--gate-bg);color:var(--gate);} .pill.human{background:var(--human-bg);color:var(--human);}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}

  /* --- Pipelines: simplified list + flow-underneath, replacing the dense FigJam board --- */
  .pipeline-row{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;background:var(--surface);}
  .pipeline-row .head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;cursor:pointer;gap:12px;}
  .pipeline-row .head:hover{background:var(--bg);}
  .pipeline-row .head .name{font-weight:600;font-size:14px;}
  .pipeline-row .head .name code{font-size:11.5px;color:var(--ink-soft);font-weight:400;margin-left:6px;}
  .pipeline-row .density{display:flex;gap:6px;align-items:center;}
  .density-chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;}
  .chevron{transition:transform .15s;color:var(--ink-soft);}
  .pipeline-row.open .chevron{transform:rotate(90deg);}
  .pipeline-row .flow{display:none;padding:4px 16px 16px;border-top:1px solid var(--line);}
  .pipeline-row.open .flow{display:block;}
  .flow-step{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px;position:relative;}
  .flow-step:not(:last-child){border-bottom:1px dashed var(--line);}
  .flow-step .stepkind{width:78px;flex:none;}
  .flow-step .stepid{font-weight:600;}
  .flow-step .stepdetail{color:var(--ink-soft);font-size:12.5px;}
  .flow-step .steploop{margin-left:auto;font-size:11px;color:var(--accent);background:var(--accent-soft-bg);padding:2px 8px;border-radius:99px;white-space:nowrap;}

  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .legend .chip{display:flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);color:var(--ink-soft);}
  .legend .chip .sw{width:9px;height:9px;border-radius:3px;flex:none;}

  .activity{list-style:none;margin:0;padding:0;}
  .activity li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .activity li:last-child{border-bottom:none;}

  .loading{color:var(--ink-soft);font-size:13px;padding:20px 0;}
  .errbox{color:var(--bad);background:var(--bad-bg);padding:12px 14px;border-radius:8px;font-size:13px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(32,30,29,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface);border-radius:14px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(56,0,61,.25);overflow:hidden;}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .modal-head h3{margin:0;font-size:16px;font-weight:600;}
  .modal-close{background:none;border:none;font-size:18px;color:var(--ink-soft);cursor:pointer;line-height:1;padding:2px 6px;}
  .modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:14px;}
  .field label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);margin-bottom:5px;}
  .field select{width:100%;font-family:inherit;font-size:13.5px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);}
  .suite-readout{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;}
  .suite-readout.missing{color:var(--warn);background:var(--warn-bg);border-color:transparent;}
  .suite-readout .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);display:block;margin-bottom:3px;}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}

  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;}
  @media (max-width:960px){.grid2{grid-template-columns:1fr;}}
  .tooltip-wrap{position:relative;display:inline-block;}
  .tooltip-wrap .tip{visibility:hidden;opacity:0;position:absolute;bottom:calc(100% + 8px);left:50%;
    transform:translateX(-50%);background:var(--n900);color:#fff;font-size:11.5px;padding:6px 10px;
    border-radius:6px;white-space:nowrap;transition:opacity .12s;z-index:10;}
  .tooltip-wrap:hover .tip{visibility:visible;opacity:1;}
  .pipeline-detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px;}
  .pipeline-detail-head p{color:var(--ink-soft);font-size:13.5px;margin:4px 0 0;max-width:64ch;}

  /* --- Step & variant accordions: a small "what it does" panel under each row --- */
  .flow-step.clickable{cursor:pointer;}
  .flow-step.clickable:hover{background:var(--bg);border-radius:6px;}
  .step-chevron{margin-left:auto;transition:transform .15s;color:var(--ink-soft);flex:none;}
  .flow-step-wrap.step-open .step-chevron{transform:rotate(90deg);}
  .step-detail{display:none;padding:2px 0 12px 88px;font-size:12.5px;color:var(--ink-soft);}
  .flow-step-wrap.step-open .step-detail{display:block;}
  .step-detail-line{margin-bottom:5px;}
  .step-detail-line b{font-weight:600;margin-right:5px;padding:1px 7px;border-radius:5px;font-size:11.5px;display:inline-block;}
  .step-detail-line code{font-size:11.5px;background:var(--bg);padding:1px 5px;border-radius:5px;}
  .step-detail-empty{font-style:italic;}
  .step-detail-line.plain{font-size:13px;color:var(--ink);margin-bottom:8px;}
  /* Key labels tinted the same as the kind pill they belong to (AI/code/gate/human) — so the
     same colour means the same thing everywhere on the page, not just on the top-level badge. */
  .step-detail-line b.k-code{background:var(--code-bg);color:var(--code);}
  .step-detail-line b.k-ai{background:var(--ai-bg);color:var(--ai);}
  .step-detail-line b.k-gate{background:var(--gate-bg);color:var(--gate);}
  .step-detail-line b.k-human{background:var(--human-bg);color:var(--human);}

  .variant-row{cursor:pointer;}
  .variant-row:hover{background:var(--bg);}
  .variant-row .chevron{display:inline-block;font-size:11px;}
  .variant-row.open .chevron{transform:rotate(90deg);}
  .chevron-cell{width:20px;}
  .variant-detail-body{padding:8px 2px 6px;}
  .variant-detail-body p{margin:0 0 8px;color:var(--ink-soft);}
  .variant-detail-body .step-detail-empty{color:var(--ink-soft);}

  /* Collapsible sidebar groups (Start/Build/Audit/Maintain) — accordion, not a flat wall. */
  .navgroup.collapsible .navgroup-header{display:flex;align-items:center;justify-content:space-between;padding:0 10px 6px;cursor:pointer;}
  .navgroup.collapsible .navgroup-header:hover .label{color:var(--sidebar-ink);}
  .navgroup.collapsible .navgroup-header .chevron{font-size:10px;transition:transform .15s;}
  .navgroup.collapsible.open .navgroup-header .chevron{transform:rotate(90deg);}
  .navgroup.collapsible .navgroup-items{display:none;}
  .navgroup.collapsible.open .navgroup-items{display:block;}
  .navitem.disabled{opacity:.4;cursor:not-allowed;pointer-events:none;}
</style>

<div class="shell">
  <aside class="sidebar">
    <div class="logo-row"><img src="/assets/arrive-logo.png" alt="Arrive"></div>
    <div class="tool-name">Test-Ops Console</div>
    <nav class="navgroups" id="navgroups">
      <div class="navgroup">
        <div class="label">Overview</div>
        <button class="navitem active" data-view="health"><span class="dot"></span>Suite health</button>
        <button class="navitem" data-view="pipelines"><span class="dot"></span>All processes</button>
        <button class="navitem" data-view="features"><span class="dot"></span>Features</button>
        <button class="navitem" data-view="repomap"><span class="dot"></span>Repo map</button>
        <button class="navitem" data-view="gaps"><span class="dot"></span>Gap register</button>
      </div>
      <div class="navgroup collapsible" id="navStart"></div>
      <div class="navgroup collapsible" id="navBuild">
        <div class="navgroup-header"><div class="label">Build</div><span class="chevron">▸</span></div>
        <div class="navgroup-items"><span class="navitem skel">Loading…</span></div>
      </div>
      <div class="navgroup collapsible" id="navAudit"></div>
      <div class="navgroup collapsible" id="navMaintain"></div>
      <div class="navgroup">
        <div class="label">Console</div>
        <button class="navitem" data-view="docs"><span class="dot"></span>Docs</button>
        <button class="navitem" data-view="settings"><span class="dot"></span>Settings</button>
      </div>
    </nav>
    <div class="sidebar-foot">
      <div class="avatar">GO</div>
      <div>George Oliver</div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div class="target-chip" id="targetChip">Translink <span class="seg">/</span> POS <span class="seg">/</span> POS_Way6 <span class="seg">/</span> old: AA-POS Acceptance Test <span class="seg">/</span> new: GG - POS - Claude Suite</div>
      <div>
        <button class="btn" id="changeTargetBtn">Change target</button>
      </div>
    </div>
    <div id="setupGateBanner" class="fixture-note" style="display:none;margin:14px 28px 0;background:var(--warn-bg);color:var(--warn);align-items:center;justify-content:space-between;gap:12px;">
      <span></span>
      <div style="display:flex;gap:6px;flex:none;">
        <button class="btn" data-goto-view="settings" style="font-size:12px;padding:5px 10px;">Settings</button>
        <button class="btn" data-goto-view="docs" style="font-size:12px;padding:5px 10px;">Docs</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="modal-overlay" id="targetModal">
  <div class="modal">
    <div class="modal-head"><h3>Change target</h3><button class="modal-close" id="modalClose">&times;</button></div>
    <div class="modal-body">
      <div class="field"><label>Project</label><select id="selProject"></select></div>
      <div class="field"><label>Device</label><select id="selDevice"></select></div>
      <div class="field"><label>Model / build</label><select id="selModel"></select></div>
      <div class="field">
        <label>Suites — old (read-only source) &amp; new (write target)</label>
        <div class="suite-readout" id="suiteReadout"></div>
        <div id="suiteEditRow" style="display:flex;gap:8px;margin-top:8px;">
          <button class="btn" id="suiteEditBtn" type="button" style="font-size:12px;padding:6px 10px;">Add / edit this pair</button>
          <button class="btn" id="suiteDeleteBtn" type="button" style="font-size:12px;padding:6px 10px;display:none;">Remove pair</button>
        </div>
        <div id="suiteEditForm" style="display:none;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);gap:8px;flex-direction:column;">
          <div class="field" style="margin:0;"><label>Old suite (read-only source)</label><input type="text" id="editOldSuite" style="width:100%;font-family:inherit;font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);"></div>
          <div class="field" style="margin:0;"><label>New suite (write target)</label><input type="text" id="editNewSuite" style="width:100%;font-family:inherit;font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);"></div>
          <div style="display:flex;gap:8px;justify-content:flex-end;">
            <button class="btn" id="suiteEditCancel" type="button" style="font-size:12px;">Cancel</button>
            <button class="btn primary" id="suiteEditSave" type="button" style="font-size:12px;">Save pair</button>
          </div>
        </div>
      </div>
      <label id="approveRow" style="display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--ink-soft);">
        <input type="checkbox" id="approveCheck" style="margin-top:2px;">
        <span>I approve pointing this console at the suites shown above. (Today: you are the sole approver — this checkbox is the whole gate. Once writes are wired in, this becomes a real sign-off before anything can be pushed.)</span>
      </label>
    </div>
    <div class="modal-foot"><button class="btn" id="modalCancel">Cancel</button><button class="btn primary" id="modalApply" disabled>Approve &amp; apply target</button></div>
  </div>
</div>

<script>
const KIND_META = {
  cli:   {label: 'CODE',  cls: 'code'},
  agent: {label: 'AI',    cls: 'ai'},
  gate:  {label: 'GATE',  cls: 'gate'},
  human: {label: 'HUMAN', cls: 'human'},
  composite_ref: {label: 'SUB-FLOW', cls: 'human'},
};

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) { const body = await res.json().catch(() => ({})); throw new Error(body.detail || res.statusText); }
  return res.json();
}

function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

/* Plain-language glosses -- every entry here is sourced from a real doc, simplified, never
   invented. CLI subcommands come verbatim from system-test-ops CLAUDE.md's "CLI quick
   reference"; agent roles from the same file's "The team" table (also each agent's own
   .claude/agents/<name>.md). Kept as a lookup, not a generator, so nothing here can drift
   into asserting behaviour that isn't actually documented. */
const CLI_SUBCOMMAND_GLOSS = {
  doctor: 'Checks the environment is ready — credentials, connectivity.',
  check: 'Confirms TestRail credentials work and lists visible projects.',
  'discover-fields': "Prints the exact settings this TestRail project needs before pushing cases to it.",
  cases: 'Pulls the suite’s cases from TestRail as a plain data file.',
  runs: 'Pulls the last N test runs for this suite from TestRail.',
  push: 'Writes cases to the new suite only — old/source suites are never touched.',
  audit: 'Checks a suite’s cases against the house Gherkin standard, read-only.',
  'coverage-prefilter': 'Narrows down which cases might already cover a JIRA item, before a person/agent looks closer.',
  'render-report': 'Turns the raw findings into the readable report file.',
  'gap-register': 'Scans for GAP/UNCONFIRMED markers left in cases and notes.',
  'build-stats': 'Snapshots the suite: what changed since last time, and current health.',
};
// Plain-language gloss per pipeline, one level simpler than its real `description:` field
// (shown alongside it, never instead of it) -- simplified wording only, no new claims.
const PIPELINE_PLAIN = {
  start: 'The front door — checks your setup is ready, asks what you want to do, and points you to the right process.',
  'add-feature': 'Adds test coverage for a new feature by extending the flow it changes.',
  'audit-coverage': "Checks whether the suite already covers a given JIRA release, and drafts what's missing. Doesn't change TestRail.",
  'audit-flows': "Compares a device's real user-flow map against the suite, and fills in what's already covered.",
  audit: "Checks a suite's cases follow the house test-writing standard. Doesn't change anything.",
  consolidate: 'Merges near-duplicate cases that test the same thing into one clean case.',
  'export-automation': "Hands off cases marked automatable to the automation-tests repo, as a to-do list.",
  'fold-defect': 'Folds a found-and-fixed bug into the test case that should have caught it, so it stays covered.',
  'ingest-docs': "Turns a project's raw requirement docs into short, cited notes the team can work from.",
  maintain: 'Periodic health check — run history, standards compliance, and duplicate cases.',
  'new-suite-from-docs': "You upload requirement/design docs for a device, and it builds a suite grounded in them. The main 'build' button.",
  'onboard-suite': 'Builds (or rebuilds) a suite for a device from scratch, checking real sources first.',
  'resolve-gaps': 'Turns open questions (GAP/UNCONFIRMED markers) into confirmed, cited facts.',
  'review-runs': "Looks at recent test runs and recommends what to add, edit, remove, or reorganise. Doesn't change TestRail.",
};
const AGENT_PLAIN = {
  'test-lead': 'The orchestrator — runs the other specialists and pulls their findings into one report.',
  'coverage-analyst': 'Checks whether TestRail cases actually cover what a JIRA fix version asked for.',
  'run-historian': 'Looks at recent test runs and flags cases that are always failing, flaky, or never run.',
  'gherkin-author': 'Drafts new or edited test case text in the house format — never writes to TestRail directly.',
  'standards-keeper': 'Reviews drafts and existing cases for consistent style and wording.',
};
function plainGlossFor(s) {
  if (s.kind === 'cli' && s.command) {
    const m = s.command.match(/system_test_ops\s+([a-z-]+)/);
    if (m && CLI_SUBCOMMAND_GLOSS[m[1]]) return CLI_SUBCOMMAND_GLOSS[m[1]];
  }
  if (s.kind === 'agent' && s.agent && AGENT_PLAIN[s.agent]) return AGENT_PLAIN[s.agent];
  if (s.is_composite_ref || s.ref_pipeline || s.ref) return `Runs another whole process (${s.ref_pipeline || s.ref}) at this point, then continues.`;
  if (s.kind === 'gate') return 'A checkpoint — the process only continues if this condition holds.';
  if (s.kind === 'human') return 'Needs a person to do this directly — not automated.';
  return null;
}

/* ---------------- Shared step renderer: accordion "what it does" panel per step ---------------- */
function renderStep(s) {
  const meta = KIND_META[s.kind] || KIND_META.human;
  const asText = (v) => Array.isArray(v) ? v.join(', ') : v;
  const lines = [];
  const gloss = plainGlossFor(s);
  if (gloss) lines.push(`<div class="step-detail-line plain">${esc(gloss)}</div>`);
  if (s.note) lines.push(`<div class="step-detail-line"><b class="k-human">What it does</b> ${esc(s.note)}</div>`);
  if (s.command) lines.push(`<div class="step-detail-line"><b class="k-code">Command</b> <code>${esc(s.command)}</code></div>`);
  if (s.agent) lines.push(`<div class="step-detail-line"><b class="k-ai">Agent</b> ${esc(s.agent)}</div>`);
  if (s.reviewer) lines.push(`<div class="step-detail-line"><b class="k-ai">Reviewer</b> ${esc(s.reviewer)}</div>`);
  if (s.ref_pipeline || s.ref) lines.push(`<div class="step-detail-line"><b class="k-human">Runs pipeline</b> ${esc(s.ref_pipeline || s.ref)}</div>`);
  if (s.produces) lines.push(`<div class="step-detail-line"><b class="k-code">Produces</b> ${esc(asText(s.produces))}</div>`);
  if (s.reads) lines.push(`<div class="step-detail-line"><b class="k-code">Reads</b> ${esc(asText(s.reads))}</div>`);
  if (s.when) lines.push(`<div class="step-detail-line"><b class="k-gate">When</b> ${esc(s.when)}</div>`);
  if (s.rule) lines.push(`<div class="step-detail-line"><b class="k-gate">Rule</b> ${esc(s.rule)}</div>`);
  if (s.gate) lines.push(`<div class="step-detail-line"><b class="k-gate">Gate</b> ${esc(s.gate)}</div>`);
  if (s.must_be) lines.push(`<div class="step-detail-line"><b class="k-gate">Must be</b> ${esc(s.must_be)}</div>`);
  if (s.parallel) lines.push(`<div class="step-detail-line"><b class="k-ai">Runs in parallel with</b> ${esc(asText(s.parallel))}</div>`);
  if (s.guardrails && s.guardrails.length) lines.push(`<div class="step-detail-line"><b class="k-gate">Guardrails</b> ${s.guardrails.map(esc).join(', ')}</div>`);
  const hasDetail = lines.length > 0;
  return `<div class="flow-step-wrap">
    <div class="flow-step ${hasDetail ? 'clickable' : ''}">
      <span class="stepkind pill ${meta.cls}">${meta.label}</span>
      <span class="stepid">${esc(s.id)}</span>
      <span class="stepdetail">${esc(s.agent || s.command || s.ref || s.ref_pipeline || '')}</span>
      ${s.loop ? `<span class="steploop">${esc(s.loop)}</span>` : ''}
      ${hasDetail ? '<span class="step-chevron chevron">▸</span>' : ''}
    </div>
    ${hasDetail ? `<div class="step-detail">${lines.join('')}</div>` : ''}
  </div>`;
}

const content = document.getElementById('content');
function setContent(html) { content.innerHTML = html; }
function loading() { setContent('<div class="loading">Loading real data…</div>'); }
function errbox(msg) { setContent(`<div class="errbox">${esc(msg)}</div>`); }

/* Delegated clicks: step accordions + feature-variant accordions, works across all views
   since content.innerHTML is replaced wholesale on every render (a listener bound directly
   to a row would be destroyed with it; delegation from the stable `content` element survives). */
content.addEventListener('click', (e) => {
  const gotoLink = e.target.closest('[data-goto-view]');
  if (gotoLink) {
    e.preventDefault();
    const view = gotoLink.dataset.gotoView;
    const navBtn = document.querySelector(`.navitem[data-view="${view}"]`);
    if (navBtn) { setActiveNav(navBtn); ACTIVE_VIEW = view; VIEWS[view](); }
    return;
  }
  const stepHead = e.target.closest('.flow-step.clickable');
  if (stepHead) { stepHead.parentElement.classList.toggle('step-open'); return; }
  const vRow = e.target.closest('.variant-row');
  if (vRow) {
    vRow.classList.toggle('open');
    const detail = vRow.nextElementSibling;
    if (detail && detail.classList.contains('variant-detail')) {
      detail.style.display = detail.style.display === 'table-row' ? 'none' : 'table-row';
    }
  }
});

        <div class="head">
          <div class="name">${esc(p.id)} ${p.slash_command ? `<code>${esc(p.slash_command)}</code>` : ''}</div>

            ${p.density.agent ? `<span class="density-chip pill ai">${p.density.agent} AI</span>` : ''}

            ${p.density.gate ? `<span class="density-chip pill gate">${p.density.gate} gate</span>` : ''}
            ${p.density.human ? `<span class="density-chip pill human">${p.density.human} human</span>` : ''}
            <span class="chevron">▸</span>
          </div>
        </div>
        ${PIPELINE_PLAIN[p.id] ? `<div style="padding:0 16px 10px;font-size:12.5px;color:var(--ink-soft);">${esc(PIPELINE_PLAIN[p.id])}</div>` : ''}
        <div class="flow"><div class="loading">Click to load steps…</div></div>
      </div>`).join('');
    setContent(`
      <div class="page-head"><h1>Processes &amp; flows</h1><p>Every pipeline, real step data — click a row to expand its flow underneath.</p></div>
      <div class="legend">
        <span class="chip"><span class="sw" style="background:var(--ai)"></span>AI / judgement</span>
        <span class="chip"><span class="sw" style="background:var(--code)"></span>Deterministic code</span>
        <span class="chip"><span class="sw" style="background:var(--gate)"></span>Gate / decision</span>
        <span class="chip"><span class="sw" style="background:var(--human)"></span>Human only</span>
      </div>
      ${rows}`);

    content.querySelectorAll('.pipeline-row .head').forEach(head => {
      head.addEventListener('click', async () => {
        const row = head.parentElement;
        const flowEl = row.querySelector('.flow');
        const wasOpen = row.classList.contains('open');
        row.classList.toggle('open');
        if (!wasOpen && flowEl.dataset.loaded !== '1') {
          try {
            const detail = await fetchJSON(`/api/pipelines/${row.dataset.id}`);
            flowEl.innerHTML = detail.steps.map(renderStep).join('');
            flowEl.dataset.loaded = '1';
          } catch (e) { flowEl.innerHTML = `<div class="errbox">${esc(e.message)}</div>`; }
        }
      });
    });
  } catch (e) { errbox('Could not load pipelines: ' + e.message); }
}

async function renderFeatures() {

  try {

    d.variants.forEach(v => byFeature[v.feature_key]?.variants.push(v));
    const cards = Object.values(byFeature).map(({feature, variants}) => `
      <div class="card">
        <h2>${esc(feature.name)} <code style="font-size:11px;color:var(--ink-soft)">${esc(feature.key)}</code></h2>
        <p style="color:var(--ink-soft);font-size:13px;margin:0 0 12px;">${esc(feature.description)}</p>
        <table>
          <tr><th></th><th>Project</th><th>Device</th><th>Variant</th><th>Cited source</th></tr>
          ${variants.map(v => {
            const confPill = v.citation.confidence === 'confirmed' ? 'ok' : v.citation.confidence === 'gap' ? 'bad' : 'warn';
            return `<tr class="variant-row">
              <td class="chevron-cell"><span class="chevron">▸</span></td>
              <td>${esc(v.project)}</td><td>${esc(v.device_type || '—')}</td><td>${esc(v.variant_name)}</td>
              <td><span class="pill code">${esc(v.citation.source_ref)}</span></td>
            </tr>
            <tr class="variant-detail" style="display:none">
              <td></td>
              <td colspan="4">
                <div class="variant-detail-body">
                  <p>${v.note ? esc(v.note) : '<span class="step-detail-empty">No description recorded for this variant yet.</span>'}</p>
                  <div class="legend" style="margin:0;">
                    <span class="chip"><span class="sw" style="background:var(--code)"></span>${esc(v.citation.source_kind)}</span>
                    <span class="pill ${confPill}">${esc(v.citation.confidence)}</span>
                  </div>
                </div>
              </td>
            </tr>`;
          }).join('')}
        </table>
      </div>`).join('');
    const gapRows = Object.entries(d.gaps).map(([proj, keys]) => keys.length
      ? `<li><b>${esc(proj)}</b> — no cited variant yet for: ${keys.map(esc).join(', ')}</li>` : '').join('');
    setContent(`
      <div class="page-head"><h1>Features — common vs. bespoke</h1><p>The functionality axis: same behaviour, cited per-project embodiment.</p></div>

        const lines = [list('New', 'ok', d.new), list('Changed', 'warn', d.changed), list('Removed', 'bad', d.removed)].filter(Boolean);
        resultEl.innerHTML = lines.length
          ? `<ul class="activity">${lines.join('')}</ul><p style="color:var(--ink-soft);font-size:12px;margin-top:8px;">${d.unchanged_count} unchanged, ${d.total_files} files total. Marked as checked — next check compares against right now.</p>`
          : `<p style="font-size:13px;">No changes since last check — ${d.total_files} files, all unchanged.</p>`;
      } catch (e) { resultEl.innerHTML = `<div class="errbox">${esc(e.message)}</div>`; }
    });

    document.getElementById('docUploadBtn').addEventListener('click', async () => {
      const input = document.getElementById('docFileInput');
      const msg = document.getElementById('docUploadMsg');
      if (!input.files.length) { msg.textContent = 'Choose a file first.'; return; }
      const fd = new FormData();
      fd.append('file', input.files[0]);
      msg.textContent = 'Uploading…';
      try {
        const res = await fetch(`/api/docs?project=${encodeURIComponent(project)}&device=${encodeURIComponent(device)}`, {method: 'POST', body: fd});
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
        renderDocs();
      } catch (e) { msg.textContent = 'Upload failed: ' + e.message; }
    });
    content.querySelectorAll('[data-del-doc]').forEach(btn => {
      btn.addEventListener('click', async () => {
        try {
          const res = await fetch(`/api/docs/${encodeURIComponent(project)}/${encodeURIComponent(device)}/${encodeURIComponent(btn.dataset.delDoc)}`, {method: 'DELETE'});
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
          renderDocs();
        } catch (e) { alert('Could not remove: ' + e.message); }
      });
    });
  } catch (e) { errbox('Could not load docs: ' + e.message); }
}

/* ---------------- Settings — TestRail credentials + all suite mappings, real API ---------------- */
async function renderSettings() {
  loading();
  try {
    const [status, mappings, envDetect] = await Promise.all([
      fetchJSON('/api/credentials/status'),
      fetchJSON('/api/suite-mappings'),
      fetchJSON('/api/credentials/detect-env').catch(() => ({found: false})),
    ]);
    const importCard = (!status.configured && envDetect && envDetect.found) ? `
      <div class="fixture-note" style="background:var(--accent-soft-bg);color:var(--accent);display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <span>ℹ Found existing TestRail credentials in <code>system-test-ops/.env</code> for <b>${esc(envDetect.testrail_user)}</b> at <code>${esc(envDetect.testrail_url)}</code> — import instead of retyping?</span>
        <button class="btn primary" id="credImportBtn" style="font-size:12px;padding:6px 12px;white-space:nowrap;">Import</button>
      </div>` : '';
    const credCard = `
      <div class="card">
        <h2>TestRail credentials</h2>
        <p style="color:var(--ink-soft);font-size:12.5px;margin:0 0 12px;">Stored locally, encrypted at rest on this machine only — never sent anywhere else, never shown again once saved.</p>
        ${status.configured
          ? `<p style="font-size:13.5px;margin:0 0 10px;">Configured for <b>${esc(status.testrail_user)}</b> at <code>${esc(status.testrail_url)}</code> (updated ${esc(status.updated_at)}).</p>
             <button class="btn" id="credRemoveBtn">Remove credentials</button>`
          : `<div style="display:flex;flex-direction:column;gap:10px;max-width:420px;">
               <div class="field" style="margin:0;"><label>TestRail URL</label><input type="text" id="credUrl" placeholder="https://yourorg.testrail.io" style="width:100%;font-family:inherit;font-size:13.5px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);"></div>
               <div class="field" style="margin:0;"><label>TestRail user (email)</label><input type="text" id="credUser" style="width:100%;font-family:inherit;font-size:13.5px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);"></div>
               <div class="field" style="margin:0;"><label>API key</label><input type="password" id="credKey" style="width:100%;font-family:inherit;font-size:13.5px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);"></div>
               <button class="btn primary" id="credSaveBtn" style="align-self:flex-start;">Save credentials</button>
             </div>`}
        <div id="credMsg" style="margin-top:8px;font-size:12.5px;"></div>
      </div>`;

    const connectionsCard = `
      <div class="card">
        <h2>Connections this console needs</h2>
        <p style="color:var(--ink-soft);font-size:12.5px;margin:0 0 12px;">What's actually checkable here vs. what lives at the Claude Code / agent layer, out of this app's sight.</p>
        <table>
          <tr><th>Integration</th><th>Used for</th><th>Status</th></tr>
          <tr><td>TestRail</td><td>Cases, runs, push (once wired)</td><td>${status.configured ? '<span class="pill ok">Configured</span>' : '<span class="pill warn">Not configured</span>'}</td></tr>
          <tr><td>JIRA (Atlassian Rovo MCP)</td><td>Fix versions, stories, epics, bugs for coverage audits</td><td><span class="pill human">Checked in Claude Code, not here</span></td></tr>
          <tr><td>Confluence (Atlassian Rovo MCP)</td><td>Release notes for scope/coverage context</td><td><span class="pill human">Checked in Claude Code, not here</span></td></tr>
        </table>
        <p style="color:var(--ink-soft);font-size:12px;margin:12px 0 0;">This app is a plain FastAPI server — it can't see which MCP servers your Claude Code session has authenticated. JIRA/Confluence access is per-engineer, connected in Claude Code itself (<code>mcp__claude_ai_Atlassian_Rovo__authenticate</code>), not something this console stores or checks. The pipelines that need them (audit-coverage, ingest-docs, etc.) run as Claude Code agents, not through this API — so "connected" for those means connected in your Claude Code session, checked there, not here.</p>
      </div>`;

    const mapRows = mappings.map(m => `
      <tr>
        <td>${esc(m.project)}</td><td>${esc(m.device)}</td>
        <td>${esc(m.old_suite)}</td><td>${esc(m.new_suite)}</td>
        <td><button class="btn" data-del-map="${esc(m.project)}|${esc(m.device)}" style="font-size:12px;padding:5px 10px;">Remove</button></td>
      </tr>`).join('');
    const mapCard = `
      <div class="card">
        <h2>Suite mappings — old (read-only) / new (write target)</h2>
        <p style="color:var(--ink-soft);font-size:12.5px;margin:0 0 12px;">Every project/device pair with a documented suite pair. Add or edit a pair from the "Change target" modal — this is a read-only view of the same store.</p>
        ${mappings.length ? `<table><tr><th>Project</th><th>Device</th><th>Old suite</th><th>New suite</th><th></th></tr>${mapRows}</table>` : '<p style="color:var(--ink-soft);font-size:13px;">No suite mappings configured yet.</p>'}
      </div>`;

    setContent(`<div class="page-head"><h1>Settings</h1><p>TestRail credentials and suite-mapping configuration for this console.</p></div>${importCard}${credCard}${connectionsCard}${mapCard}`);

    document.getElementById('credImportBtn')?.addEventListener('click', async () => {
      try {
        const res = await fetch('/api/credentials/import-env', {method: 'POST'});
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
        renderSettings();
      } catch (e) { alert('Could not import: ' + e.message); }
    });

    if (!status.configured) {
      document.getElementById('credSaveBtn').addEventListener('click', async () => {
        const testrail_url = document.getElementById('credUrl').value.trim();
        const testrail_user = document.getElementById('credUser').value.trim();
        const testrail_api_key = document.getElementById('credKey').value.trim();
        const msg = document.getElementById('credMsg');
        try {
          const res = await fetch('/api/credentials', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({testrail_url, testrail_user, testrail_api_key}),
          });
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
          renderSettings();
        } catch (e) { msg.textContent = 'Could not save: ' + e.message; }
      });
    } else {
      document.getElementById('credRemoveBtn').addEventListener('click', async () => {
        if (!confirm('Remove stored TestRail credentials?')) return;
        await fetch('/api/credentials', {method: 'DELETE'});
        renderSettings();
      });
    }
    content.querySelectorAll('[data-del-map]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const [project, device] = btn.dataset.delMap.split('|');
        if (!confirm(`Remove the suite mapping for ${project} / ${device}?`)) return;
        await fetch(`/api/suite-mappings/${encodeURIComponent(project)}/${encodeURIComponent(device)}`, {method: 'DELETE'});
        await loadSuiteMappings();
        renderSettings();
      });
    });
  } catch (e) { errbox('Could not load settings: ' + e.message); }
}

/* ---------------- Single pipeline detail (used by grouped Build/Audit/Maintain nav) ---------------- */
async function renderPipelineDetail(id) {
  loading();
  try {
    const [list, detail] = await Promise.all([
      fetchJSON('/api/pipelines'),
      fetchJSON(`/api/pipelines/${id}`),
    ]);
    const meta = list.find(p => p.id === id) || {};
    const steps = detail.steps.map(renderStep).join('');
    const target = window.CURRENT_TARGET || {};
    const runButton = detail.runnable
      ? `<button class="btn primary" id="pipelineRunBtn">Run</button>`
      : `<div class="tooltip-wrap"><button class="btn primary" disabled>Run</button><span class="tip">Not wired yet — only read-only pipelines are, so far</span></div>`;
    setContent(`
      <div class="pipeline-detail-head">
        <div>
          <h1 style="font-size:20px;margin:0;">${esc(id)} ${meta.slash_command ? `<code style="font-size:12px;color:var(--ink-soft);font-weight:400;">${esc(meta.slash_command)}</code>` : ''}</h1>
          ${PIPELINE_PLAIN[id] ? `<p style="font-size:14px;font-weight:500;margin:6px 0 2px;">${esc(PIPELINE_PLAIN[id])}</p>` : ''}
          <p>${esc(detail.description)}</p>
        </div>
        ${runButton}
      </div>
      <div class="legend">
        ${detail.guardrails.map(g => `<span class="chip"><span class="sw" style="background:var(--gate)"></span>${esc(g)}</span>`).join('')}
      </div>
      <div class="card"><div class="flow" style="display:block;">${steps}</div></div>
      <div id="pipelineRunResult"></div>`);

    document.getElementById('pipelineRunBtn')?.addEventListener('click', () => runPipeline(id, target));
  } catch (e) { errbox('Could not load this pipeline: ' + e.message); }
}

/* ---------------- Real pipeline execution (today: only `audit` is wired) ---------------- */
async function runPipeline(id, target) {
  const resultEl = document.getElementById('pipelineRunResult');
  const btn = document.getElementById('pipelineRunBtn');
  if (btn) btn.disabled = true;
  resultEl.innerHTML = `<div class="card"><div class="loading">Starting ${esc(id)} against ${esc(target.project)}/${esc(target.device)}…</div></div>`;
  try {
    const res = await fetch(`/api/pipelines/${id}/run`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({project: target.project, device: target.device}),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
    const {run_id} = await res.json();
    pollPipelineRun(run_id, resultEl, btn);
  } catch (e) {
    resultEl.innerHTML = `<div class="errbox">Could not start run: ${esc(e.message)}</div>`;
    if (btn) btn.disabled = false;
  }
}

async function pollPipelineRun(runId, resultEl, btn) {
  try {
    const run = await fetchJSON(`/api/pipelines/runs/${runId}`);
    if (run.status === 'running') {
      resultEl.innerHTML = `<div class="card"><div class="loading">Running… (${esc(run.pipeline_id)} against ${esc(run.project)}/${esc(run.device)})</div></div>`;
      setTimeout(() => pollPipelineRun(runId, resultEl, btn), 2000);
      return;
    }
    if (btn) btn.disabled = false;
    if (run.status === 'failed') {
      resultEl.innerHTML = `<div class="card"><h2>Run failed</h2><div class="errbox">${esc(run.error || 'Unknown error')}</div>${run.cli_output ? `<pre style="white-space:pre-wrap;font-size:12px;background:var(--bg);padding:10px;border-radius:8px;margin-top:10px;">${esc(run.cli_output)}</pre>` : ''}</div>`;
      return;
    }
    resultEl.innerHTML = `
      <div class="card">
        <h2>Result</h2>
        ${run.summary ? `<p style="font-size:14px;">${esc(run.summary)}</p>` : ''}
        ${run.report_path ? `<p style="color:var(--ink-soft);font-size:12.5px;">Full report: <code>${esc(run.report_path)}</code></p>` : ''}
        <details style="margin-top:10px;"><summary style="cursor:pointer;font-size:12.5px;color:var(--ink-soft);">Raw CLI output</summary>
          <pre style="white-space:pre-wrap;font-size:12px;background:var(--bg);padding:10px;border-radius:8px;margin-top:8px;">${esc(run.cli_output || '')}</pre>
        </details>
      </div>`;
  } catch (e) {
    resultEl.innerHTML = `<div class="errbox">Lost track of this run: ${esc(e.message)}</div>`;
    if (btn) btn.disabled = false;
  }
}

/* ---------------- Grouped nav (Build / Audit / Maintain) from real pipeline ids ---------------- */
// Every real pipeline in system-test-ops' .claude/pipelines/index.yaml MUST appear in
// exactly one group here -- `start` was missing for a while (found via ISSUES.md feedback,
// 2026-09-08): it's real, has a real /start slash command, but wasn't in any group, so it
// silently never showed up in the sidebar even though every other pipeline did.
const GROUPS = {
  'Start': ['start'],
  Build: ['onboard-suite', 'new-suite-from-docs', 'ingest-docs', 'add-feature', 'consolidate', 'export-automation'],
  Audit: ['audit-coverage', 'audit-flows', 'audit', 'resolve-gaps'],
  Maintain: ['fold-defect', 'review-runs', 'maintain'],
};

function setActiveNav(btn) {
  document.querySelectorAll('.navitem').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

async function populateGroupedNav() {
  try {
    const list = await fetchJSON('/api/pipelines');
    const byId = Object.fromEntries(list.map(p => [p.id, p]));
    for (const [groupName, ids] of Object.entries(GROUPS)) {
      const el = document.getElementById('nav' + groupName);
      const items = ids.filter(id => byId[id]).map(id => {
        const p = byId[id];
        return `<button class="navitem" data-pipeline="${esc(id)}"><span class="dot"></span>${esc(p.slash_command ? p.slash_command.replace('/', '').replace(/-/g,' ') : id)}</button>`;
      }).join('');
      el.innerHTML = `<div class="navgroup-header"><div class="label">${esc(groupName)}</div><span class="chevron">▸</span></div><div class="navgroup-items">${items}</div>`;
    }
    document.querySelectorAll('.navgroup.collapsible .navgroup-header').forEach(header => {
      header.addEventListener('click', () => header.parentElement.classList.toggle('open'));
    });
    document.querySelectorAll('.navitem[data-pipeline]').forEach(btn => {
      btn.addEventListener('click', () => { setActiveNav(btn); renderPipelineDetail(btn.dataset.pipeline); });
    });
    refreshSetupGate(); // items exist now; apply gating (may run again once CURRENT_TARGET's own load path fires too)
  } catch (e) { /* leave groups empty if this fails; Overview/All-processes still work */ }
}
populateGroupedNav();

const VIEWS = {health: renderHealth, pipelines: renderPipelines, features: renderFeatures, repomap: renderRepoMap, gaps: renderGaps, docs: renderDocs, settings: renderSettings};
let ACTIVE_VIEW = 'health';
document.querySelectorAll('.navitem[data-view]').forEach(btn => {
  btn.addEventListener('click', () => { setActiveNav(btn); ACTIVE_VIEW = btn.dataset.view; VIEWS[btn.dataset.view](); });
});
renderHealth();

/* ---------------- Target switcher — real taxonomy + real, API-backed suite mappings ---------------- */
let TAXONOMY = {};
// Keyed by "project|device" -- every pair has its OWN old (read-only source)/new (write
// target) suite; never assume one carries over from another combination. Loaded from the
// real store (/api/suite-mappings) -- never hardcoded here, so adding a pair in the UI is
// the only source of truth, no code change needed for a new project/device.
let SUITE_MAPPINGS = {};
// The console's current working target -- read by other views (e.g. Docs) so an upload or
// a future pipeline run always lands against the project/device actually selected, not a
// stale default.
window.CURRENT_TARGET = {project: 'Translink', device: 'POS', model: 'POS_Way6'};

/* ---------------- Setup-status gate: fade Start/Build/Audit/Maintain until this target is
   actually ready (credentials + suite mapping + docs/knowledge). Docs/Settings stay live —
   that's where setup happens. ---------------- */
const GATED_GROUP_IDS = ['navStart', 'navBuild', 'navAudit', 'navMaintain'];
async function refreshSetupGate() {
  const {project, device} = window.CURRENT_TARGET || {};
  if (!project || !device) return;
  let status;
  try {
    status = await fetchJSON(`/api/setup-status?project=${encodeURIComponent(project)}&device=${encodeURIComponent(device)}`);
  } catch (e) { return; } // leave whatever gating state we had rather than guess
  GATED_GROUP_IDS.forEach(gid => {
    const el = document.getElementById(gid);
    if (!el) return;
    el.classList.toggle('setup-gated', !status.ready);
    el.querySelectorAll('.navitem[data-pipeline]').forEach(btn => btn.classList.toggle('disabled', !status.ready));
  });
  const banner = document.getElementById('setupGateBanner');
  if (banner) {
    banner.style.display = status.ready ? 'none' : 'flex';
    if (!status.ready) {
      const missing = [];
      if (!status.credentials_configured) missing.push('TestRail credentials');
      if (!status.suite_configured) missing.push('a suite target');
      if (!status.docs_configured) missing.push('docs/knowledge');
      banner.querySelector('span').textContent = `${project}/${device} isn't fully set up yet — missing: ${missing.join(', ')}. Build/Audit/Maintain are faded until this is complete.`;
    }
  }
}

async function loadSuiteMappings() {
  try {
    const rows = await fetchJSON('/api/suite-mappings');
    SUITE_MAPPINGS = {};
    rows.forEach(r => { SUITE_MAPPINGS[`${r.project}|${r.device}`] = {old: r.old_suite, new: r.new_suite}; });
  } catch (e) { /* leave whatever we had; readout will show "not configured" worst case */ }
}

fetchJSON('/api/taxonomy').then(t => { TAXONOMY = t; refreshDevices(); }).catch(() => {});
loadSuiteMappings();

const selProject = document.getElementById('selProject');
const selDevice = document.getElementById('selDevice');
const selModel = document.getElementById('selModel');
const suiteReadout = document.getElementById('suiteReadout');
const approveCheck = document.getElementById('approveCheck');
const modalApply = document.getElementById('modalApply');
const suiteEditBtn = document.getElementById('suiteEditBtn');
const suiteDeleteBtn = document.getElementById('suiteDeleteBtn');
const suiteEditForm = document.getElementById('suiteEditForm');
const editOldSuite = document.getElementById('editOldSuite');
const editNewSuite = document.getElementById('editNewSuite');

function fillSelect(sel, items) { sel.innerHTML = items.map(i => `<option value="${esc(i)}">${esc(i.replace(/_/g,' '))}</option>`).join(''); }
function refreshDevices() { fillSelect(selProject, Object.keys(TAXONOMY)); fillSelect(selDevice, Object.keys(TAXONOMY[selProject.value] || {})); refreshModels(); }
function refreshModels() { fillSelect(selModel, (TAXONOMY[selProject.value] || {})[selDevice.value] || []); refreshSuiteReadout(); }

function currentPairKey() { return `${selProject.value}|${selDevice.value}`; }

function refreshSuiteReadout() {
  const pair = SUITE_MAPPINGS[currentPairKey()];
  approveCheck.checked = false;
  suiteEditForm.style.display = 'none';
  suiteDeleteBtn.style.display = pair ? '' : 'none';
  suiteEditBtn.textContent = pair ? 'Edit this pair' : 'Add this pair';
  updateApplyEnabled();
  if (pair) {
    suiteReadout.className = 'suite-readout';
    suiteReadout.innerHTML = `<span class="k">Old (read-only source)</span>${esc(pair.old)}<br><span class="k" style="margin-top:8px;display:block;">New (write target)</span>${esc(pair.new)}`;
  } else {
    suiteReadout.className = 'suite-readout missing';
    suiteReadout.innerHTML = `<span class="k">Not configured</span>No documented old/new suite pair for ${esc(selProject.value)} / ${esc(selDevice.value)} yet — add it below before targeting this combination.`;
  }
}

function updateApplyEnabled() {
  modalApply.disabled = !(SUITE_MAPPINGS[currentPairKey()] && approveCheck.checked);
}

selProject?.addEventListener('change', () => { fillSelect(selDevice, Object.keys(TAXONOMY[selProject.value] || {})); refreshModels(); });
selDevice?.addEventListener('change', refreshModels);
selModel?.addEventListener('change', updateApplyEnabled);
approveCheck.addEventListener('change', updateApplyEnabled);

suiteEditBtn.addEventListener('click', () => {
  const pair = SUITE_MAPPINGS[currentPairKey()];
  editOldSuite.value = pair ? pair.old : '';
  editNewSuite.value = pair ? pair.new : '';
  suiteEditForm.style.display = 'flex';
});
document.getElementById('suiteEditCancel').addEventListener('click', () => { suiteEditForm.style.display = 'none'; });
document.getElementById('suiteEditSave').addEventListener('click', async () => {
  const old_suite = editOldSuite.value.trim(), new_suite = editNewSuite.value.trim();
  if (!old_suite || !new_suite) { alert('Both old and new suite names are required.'); return; }
  try {
    const res = await fetch('/api/suite-mappings', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({project: selProject.value, device: selDevice.value, old_suite, new_suite}),
    });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
    await loadSuiteMappings();
    refreshSuiteReadout();
  } catch (e) { alert('Could not save: ' + e.message); }
});
suiteDeleteBtn.addEventListener('click', async () => {
  if (!confirm(`Remove the suite mapping for ${selProject.value} / ${selDevice.value}?`)) return;
  try {
    const res = await fetch(`/api/suite-mappings/${encodeURIComponent(selProject.value)}/${encodeURIComponent(selDevice.value)}`, {method: 'DELETE'});
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
    await loadSuiteMappings();
    refreshSuiteReadout();
  } catch (e) { alert('Could not remove: ' + e.message); }
});

const targetModal = document.getElementById('targetModal');
document.getElementById('changeTargetBtn').addEventListener('click', () => targetModal.classList.add('open'));
document.getElementById('modalClose').addEventListener('click', () => targetModal.classList.remove('open'));
document.getElementById('modalCancel').addEventListener('click', () => targetModal.classList.remove('open'));
modalApply.addEventListener('click', () => {
  const pair = SUITE_MAPPINGS[currentPairKey()];
  if (!pair) return; // belt-and-braces; button is disabled in this state anyway
  window.CURRENT_TARGET = {project: selProject.value, device: selDevice.value, model: selModel.value};
  document.getElementById('targetChip').innerHTML =
    `${esc(selProject.value)} <span class="seg">/</span> ${esc(selDevice.value)} <span class="seg">/</span> ${esc(selModel.value)} ` +
    `<span class="seg">/</span> old: ${esc(pair.old)} <span class="seg">/</span> new: ${esc(pair.new)}`;
  targetModal.classList.remove('open');
  if (typeof ACTIVE_VIEW !== 'undefined' && VIEWS[ACTIVE_VIEW]) VIEWS[ACTIVE_VIEW]();
  refreshSetupGate();
});

document.querySelectorAll('#setupGateBanner [data-goto-view]').forEach(btn => {
  btn.addEventListener('click', () => {
    const view = btn.dataset.gotoView;
    const navBtn = document.querySelector(`.navitem[data-view="${view}"]`);
    if (navBtn) { setActiveNav(navBtn); ACTIVE_VIEW = view; VIEWS[view](); }
  });
});
refreshSetupGate();
</script>
