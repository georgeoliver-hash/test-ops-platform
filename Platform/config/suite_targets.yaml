# Shared, git-tracked source of truth for which project/device targets this console knows
# about — replaces the old hardcoded Python literal list in store.py's init_db(). Anyone who
# adds a target through the console UI gets it appended here; commit + push this file so a
# colleague's own local console picks it up on their next `git pull` (their local SQLite
# db is still per-machine and never shared — only this list of *which targets exist* is).
#
# fresh_build: true means there's no old suite to reference (the suite is being built purely
# from ingested documentation) -- old_suite/old_suite_id are "" / null in that case, not
# omitted, to match how the app already stores that case in its own database.
version: 1
targets:
  # cite: system-test-ops CLAUDE.md + knowledge/projects/translink.md:14 (old id 9317)
  - project: Translink
    device: POS
    old_suite: "AA-POS Acceptance Test"
    old_suite_id: 9317
    new_suite: "GG - POS - Claude Suite"
    new_suite_id: 30253
    fresh_build: false
    testrail_project_id: 42  # "TFTS - System Test" -- confirmed, Translink's suites live here

