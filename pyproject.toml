[project]
name = "test-ops-platform"
version = "0.1.0"
description = "Sandbox platform: shared model/ schema (mirrored from SIT) + testops/ (system-test-ops)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["model*"]
